<section class="screen" data-screen="redis">
<div style="height:100vh;overflow:auto" dir="ltr">
<style>
.rdis-root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#1a1a2e;min-height:100vh;display:flex;}
.rdis-rail{width:54px;flex:none;background:#fff;border-right:1px solid #eee;display:flex;flex-direction:column;align-items:center;padding:18px 0;min-height:100vh;box-sizing:border-box;}
.rdis-logo{color:#dc382c;margin-bottom:0;}
.rdis-bottom{margin-top:auto;display:flex;flex-direction:column;gap:22px;align-items:center;}
.rdis-bottom svg{width:18px;height:18px;color:#3a3a4a;}
.rdis-bottom .rdis-badgewrap{position:relative;}
.rdis-bottom .rdis-badge{position:absolute;top:-6px;right:-8px;background:#5b5bd6;color:#fff;font-size:9px;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;}
.rdis-main{flex:1;padding:0 0;}
.rdis-tabs{display:flex;gap:28px;padding:16px 24px 0;border-bottom:1px solid #eee;position:relative;}
.rdis-tab{font-size:14px;color:#8a8a9a;padding-bottom:12px;}
.rdis-tab.active{color:#1a1a2e;font-weight:600;border-bottom:2px solid #1a1a2e;}
.rdis-bulb{position:absolute;right:24px;top:12px;color:#8a8a9a;}
.rdis-toolbar{display:flex;align-items:center;gap:16px;padding:20px 24px;}
.rdis-createbtn{background:#0d1b2a;color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:13.5px;font-weight:600;}
.rdis-connect{font-size:13.5px;color:#1a1a2e;display:flex;align-items:center;gap:6px;font-weight:500;}
.rdis-box{margin:0 24px 24px;border:1px solid #e5e5ea;border-radius:8px;min-height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rdis-emptytitle{font-size:19px;font-weight:700;color:#3b3b8f;margin:20px 0 24px;}
.rdis-addbtn{background:#0d1b2a;color:#fff;border:none;border-radius:6px;padding:10px 18px;font-size:14px;font-weight:600;margin-bottom:14px;}
.rdis-createlink{font-size:13.5px;color:#8a8a9a;}
</style>
<div class="rdis-root">
  <div class="rdis-rail">
    <div class="rdis-logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L3 6l9 4 9-4-9-4zM3 10l9 4 9-4M3 14l9 4 9-4"/></svg></div>
    <div class="rdis-bottom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
      <div class="rdis-badgewrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="rdis-badge">3</span></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12c0 4.4 2.9 8.2 6.8 9.5.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .8.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.5-1.3.1-2.7 0 0 .8-.3 2.7 1 .8-.2 1.6-.3 2.5-.3s1.7.1 2.5.3c1.9-1.3 2.7-1 2.7-1 .6 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .3.3.6.8.6 1.7v2.5c0 .3.2.6.7.5C19.1 20.2 22 16.4 22 12c0-5.5-4.5-10-10-10z"/></svg>
    </div>
  </div>
  <div class="rdis-main">
    <div class="rdis-tabs">
      <div class="rdis-tab active">Redis Databases</div>
      <div class="rdis-tab">Redis Data Integration</div>
      <div class="rdis-bulb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a6 6 0 0 0-4 10.5c.6.5 1 1.3 1 2.1V16h6v-1.4c0-.8.4-1.6 1-2.1A6 6 0 0 0 12 2z"/></svg></div>
    </div>
    <div class="rdis-toolbar">
      <button class="rdis-createbtn">Create free Cloud database</button>
      <div class="rdis-connect">+ Connect existing database</div>
    </div>
    <div class="rdis-box">
      <svg width="90" height="90" viewBox="0 0 100 100">
        <ellipse cx="50" cy="82" rx="30" ry="7" fill="#a6d8ef"/>
        <rect x="30" y="45" width="40" height="30" fill="#f3ee9e"/>
        <rect x="30" y="45" width="40" height="8" fill="#fff"/>
        <path d="M30 45 Q40 38 50 45 T70 45" fill="none" stroke="#c9a6e0" stroke-width="3"/>
        <rect x="30" y="60" width="40" height="8" fill="#c9a6e0"/>
        <rect x="46" y="30" width="8" height="14" fill="#f3ee9e"/>
        <path d="M50 22 q3 4 0 8 q-3 -4 0 -8" fill="#f5a623"/>
      </svg>
      <div class="rdis-emptytitle">No databases yet, let's add one!</div>
      <button class="rdis-addbtn">+ Add Redis database</button>
      <div class="rdis-createlink">Create a free Redis Cloud database</div>
    </div>
  </div>
</div>
</div>
</section>
