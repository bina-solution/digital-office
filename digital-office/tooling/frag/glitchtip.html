<section class="screen" data-screen="glitchtip">
<div style="height:100vh;overflow:auto" dir="ltr">
<style>
.gtip-root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f2f2f2;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1a1a1a;}
.gtip-card{width:480px;background:#f7f7f7;border:1px solid #ddd;border-radius:2px;padding:32px 36px 30px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.gtip-logo{text-align:center;font-size:32px;font-weight:800;font-style:italic;margin-bottom:18px;background:linear-gradient(90deg,#e91e63,#f44336);-webkit-background-clip:text;background-clip:text;color:#e5334f;}
.gtip-h2{text-align:center;font-size:20px;font-weight:700;margin:0 0 22px;color:#1a1a1a;}
.gtip-field{margin-bottom:18px;position:relative;}
.gtip-label{font-size:12px;color:#c2185b;position:absolute;top:-8px;left:10px;background:#f7f7f7;padding:0 4px;}
.gtip-label.gray{color:#666;}
.gtip-input{width:100%;box-sizing:border-box;padding:13px 12px;border:1px solid #c2185b;border-radius:2px;font-size:14px;background:#fff;color:#1a1a1a;}
.gtip-input.gray{border-color:#b0b0b0;}
.gtip-btn{width:100%;background:#a3134a;color:#fff;border:none;padding:12px;font-size:14px;font-weight:600;border-radius:2px;margin-top:6px;margin-bottom:22px;cursor:pointer;}
.gtip-foot{text-align:center;font-size:14px;color:#333;margin-bottom:10px;}
.gtip-foot a{color:#a3134a;font-weight:700;text-decoration:underline;}
.gtip-resetlink{text-align:center;}
.gtip-resetlink a{color:#a3134a;font-weight:700;text-decoration:underline;font-size:14px;}
</style>
<div class="gtip-root">
  <div class="gtip-card">
    <div class="gtip-logo">GlitchTip</div>
    <h2 class="gtip-h2">Login</h2>
    <div class="gtip-field">
      <span class="gtip-label">Email*</span>
      <input class="gtip-input" />
    </div>
    <div class="gtip-field">
      <span class="gtip-label gray">Password*</span>
      <input class="gtip-input gray" />
    </div>
    <button class="gtip-btn">Log in</button>
    <div class="gtip-foot">New to GlitchTip? <a href="#">Sign Up</a></div>
    <div class="gtip-resetlink"><a href="#">Reset Password</a></div>
  </div>
</div>
</div>
</section>
