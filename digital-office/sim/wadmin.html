<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>צ׳אט</title>
  <style>
    /* The colours are the office's palette, light and dark: the simulation's build puts the block last in
       this page (sim/build.mjs, PALETTE). What is this screen's own is said in the palette's tokens — a
       sent bubble is olive's tint and its hairline, the wall behind a conversation is the ground with
       the ink at a twentieth (as the real chat admin, apps/chat/src/api/ui/chat.ejs). */
    :root{--shadow-xs:0 1px 2px var(--line);--shadow-md:var(--shadow-lg);
      --radius:16px;--radius-sm:10px;--radius-pill:999px;
      --bubble-out:var(--olive-soft);--bubble-out-bd:var(--olive-line);--bubble-in:var(--surface);
      --chat-bg:var(--bg);--chat-dot:color-mix(in srgb,var(--ink) 4.5%,transparent);
      --font:"Segoe UI",system-ui,-apple-system,"Noto Sans Hebrew","Assistant",Arial,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;height:100%}
    body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    .muted{color:var(--muted)}.small{font-size:12px}
    ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 32%,transparent);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
    ::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted) 50%,transparent);background-clip:padding-box}
    button{font-family:inherit}
    .tag{display:inline-flex;align-items:center;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;letter-spacing:.01em;line-height:1.55}
    .tag-cust,.tag-bot{background:var(--info-soft);color:var(--blue)}.tag-supp{background:var(--violet-soft);color:var(--violet)}
    .tag-grp{background:var(--accent-soft);color:var(--accent-d)}

    .chat{display:flex;height:100vh;overflow:hidden;background:var(--bg)}

    /* ── sidebar ─────────────────────────────────────────────────────────── */
    aside.side{width:248px;flex:none;background:var(--surface);border-inline-start:1px solid var(--line);
      display:flex;flex-direction:column;order:-1}
    aside.side .brand{padding:18px 18px 15px;display:flex;align-items:center;gap:11px}
    aside.side .brand .logo{width:38px;height:38px;border-radius:11px;flex:none;display:inline-flex;align-items:center;justify-content:center;
      background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
    aside.side .brand h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.02em}
    aside.side .brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
    .newbtn{margin:2px 14px 8px;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border:none;border-radius:12px;
      background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
    .newbtn:hover{background:var(--accent-d);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
    .newbtn:active{transform:translateY(0)}
    .side-lbl{padding:14px 20px 6px;font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
    .botctl{margin:2px 14px 6px;padding:14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:var(--shadow-xs)}
    .botctl .h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--ink)}
    .botctl .h .bi{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-d);display:inline-flex;align-items:center;justify-content:center;flex:none}
    .selwrap{position:relative;margin-top:11px}
    /* the select's chevron is DRAWN (two borders of a turned square), not a character of the font — and it
       stands at the END of the line, where the select keeps room for it: at the start it lay over the first
       letter of the option («בוט» read «צוט») */
    .selwrap::after{content:"";position:absolute;inset-inline-end:13px;top:50%;width:6px;height:6px;border:solid var(--muted);border-width:0 1.6px 1.6px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
    .botctl select{width:100%;padding:9px 12px;padding-inline-end:30px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13px;font-weight:600;
      background:var(--surface);color:var(--ink);appearance:none;cursor:pointer}
    .botctl select:focus{outline:2px solid var(--accent);border-color:transparent}
    .botctl .bd{margin-top:9px;font-size:11.5px;color:var(--muted);line-height:1.5}
    .side-sp{flex:1}
    .connftr{margin:8px 14px 14px;padding:12px 13px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);
      display:flex;align-items:center;gap:10px;cursor:default}
    .connftr .provico{width:30px;height:30px;border-radius:9px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--olive-ink);font-size:13px;position:relative}
    .connftr .provico .pdot{position:absolute;inset-inline-end:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--surface-2)}
    /* (the name OVER its line, as the live page's account bar stands them: two inline spans read «וואטסאפ
       עסקי050-000-0007» on one line, the number past the card's edge, and their ellipsis never applied) */
    .connftr .cx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
    .connftr .cn{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* (a line with no letter of its own — a phone number — reads left to right: «050-000-0007» stood «50-123-4567 972+») */
    .connftr .cs{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:right}

    /* ── conversation list ───────────────────────────────────────────────── */
    .conv-col{width:352px;flex:none;background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
    .conv-head{padding:16px 18px 10px}
    .conv-head .r{display:flex;align-items:center;justify-content:space-between}
    .conv-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
    .conv-head .cnt{font-size:11px;font-weight:800;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 9px}
    .search{position:relative;margin-top:12px}
    .search input{width:100%;padding:10px 38px 10px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:13px;background:var(--surface-2);color:var(--ink);transition:.15s}
    .search input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
    .search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
    .segtabs{display:flex;gap:3px;padding:3px;margin:12px 18px 4px;background:var(--bg);border-radius:11px}
    .seg{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 6px;min-height:30px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s;border:none;background:transparent}
    .seg:hover{color:var(--ink)}
    .seg.on{background:var(--surface);color:var(--accent-d);box-shadow:var(--shadow-xs)}
    .seg .n{font-size:10px;font-weight:800;background:var(--bg);color:var(--muted);border-radius:999px;padding:0 6px;min-width:16px;text-align:center}
    /* a count is said once it is KNOWN: the four stood «0» in the markup, beside «הצ׳אט לא נטען» */
    .conv-head .cnt:empty,.seg .n:empty{display:none}
    .seg.on .n{background:var(--accent-soft);color:var(--accent-d)}
    .conv-list{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 14px}
    .conv{display:flex;gap:12px;padding:10px 11px;border-radius:14px;cursor:pointer;align-items:center;position:relative;transition:background .12s}
    .conv:hover{background:var(--surface-2)}
    .conv.on{background:var(--accent-soft)}
    .conv.on::before{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--accent)}
    .avatar{position:relative;flex:none}
    .av{width:48px;height:48px;border-radius:50%;color:var(--surface);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.02em}
    .av.sm{width:42px;height:42px;font-size:14px}
    .presence{position:absolute;inset-inline-end:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2.5px solid var(--surface)}
    .conv.on .presence{border-color:var(--accent-soft)}
    .conv .cx{flex:1;min-width:0}
    .conv .r1{display:flex;align-items:baseline;gap:8px}
    .conv .nm{font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;letter-spacing:-.01em}
    .conv .tm{font-size:11px;color:var(--muted);flex:none;font-weight:600}
    .conv.unread .tm{color:var(--accent-d);font-weight:800}
    .conv .r2{display:flex;align-items:center;gap:7px;margin-top:3px}
    .conv .lm{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
    .conv.unread .lm{color:var(--ink);font-weight:600}
    .conv .lm .tick{color:var(--blue);font-weight:700;flex:none}.conv .lm .tick.gray{color:var(--muted)}
    .conv .badge{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow-xs)}
    .conv .pin{color:var(--muted);flex:none}
    .list-empty{padding:44px 22px;text-align:center;color:var(--muted);font-size:13px}
    .list-err{padding:40px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
    .list-err .le-ic{width:66px;height:66px;border-radius:20px;background:var(--danger-soft);border:1px solid var(--plum-line);color:var(--red);display:flex;align-items:center;justify-content:center}
    .list-err b{font-size:16px;color:var(--ink);font-weight:800}
    .list-err span{font-size:12.5px;color:var(--muted);line-height:1.5;max-width:280px}
    .list-err .le-btn{margin-top:4px;display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border:none;border-radius:11px;background:var(--plum);color:var(--plum-ink);font:inherit;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}

    /* ── thread ──────────────────────────────────────────────────────────── */
    .thread-col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--chat-bg);position:relative}
    .thread-col::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:1;
      background-image:radial-gradient(var(--chat-dot) 1.4px,transparent 1.4px);background-size:22px 22px;background-position:0 0}
    /* #thread must itself fill the column and establish the flex context, or the header/messages/composer
       grow past the viewport (composer disappears) and .msgs never scrolls. min-height:0 lets .msgs shrink. */
    #thread{flex:1;min-height:0;display:flex;flex-direction:column}
    .th-head,.msgs,.composer,.th-empty{position:relative;z-index:1}
    .th-head{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow-xs)}
    .th-head .cx{flex:1;min-width:0}
    .th-head .nm{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
    .th-head .hn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
    .th-head .hn.online{color:var(--accent-d);font-weight:600}
    .th-head .ha{display:flex;gap:2px}
    .th-head .ha button{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:9px;border-radius:10px;transition:.12s;display:inline-flex}
    .th-head .ha button:hover{background:var(--surface-2);color:var(--ink)}
    .msgs{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:20px clamp(18px,4%,52px) 16px;display:flex;flex-direction:column;gap:2px;align-items:stretch}
    .daysep{align-self:center;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:999px;
      padding:4px 14px;font-size:11px;font-weight:700;color:var(--muted);margin:12px 0 8px;box-shadow:var(--shadow-xs)}
    /* bubble: fit content but never so narrow the time wraps — the time is absolutely placed in the
       bottom corner and the text reserves room for it via a trailing inline spacer (WhatsApp technique). */
    .msg{position:relative;max-width:min(64%,560px);min-width:58px;padding:6px 11px 7px;border-radius:12px;font-size:13.6px;line-height:1.4;
      box-shadow:var(--shadow-xs);margin-top:2px;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word}
    .msg.in{align-self:flex-start;background:var(--bubble-in)}
    .msg.out{align-self:flex-end;background:var(--bubble-out);border:1px solid var(--bubble-out-bd)}
    .msg.head{margin-top:9px}
    .msg.in.head{border-start-start-radius:4px}
    .msg.out.head{border-start-end-radius:4px}
    .msg.in.head::before{content:"";position:absolute;top:0;inset-inline-start:-6px;width:11px;height:13px;background:var(--bubble-in);clip-path:polygon(100% 0,100% 100%,0 0)}
    .msg.out.head::before{content:"";position:absolute;top:0;inset-inline-end:-7px;width:12px;height:13px;background:var(--bubble-out);border-top:1px solid var(--bubble-out-bd);border-inline-end:1px solid var(--bubble-out-bd);clip-path:polygon(0 0,0 100%,100% 0)}
    .msg .sndr{display:block;font-size:12px;font-weight:800;margin-bottom:2px;letter-spacing:-.01em}
    .msg .txt::after{content:"";display:inline-block;width:46px;height:1px}
    .msg.out .txt::after{width:62px}
    .msg .mt{position:absolute;inset-inline-end:11px;bottom:6px;font-size:10px;color:var(--muted);font-weight:600;line-height:1;white-space:nowrap;pointer-events:none}
    .msg.out .mt{color:var(--olive-d)}
    .msg .mt .tick{color:var(--blue);font-weight:800;margin-inline-start:1px}
    .msg .mt .tick.gray{color:var(--muted)}
    /* typing indicator */
    .typing{align-self:flex-start;background:var(--bubble-in);border-radius:14px;border-start-start-radius:5px;padding:11px 14px;box-shadow:var(--shadow-xs);display:inline-flex;gap:4px;margin-top:6px}
    .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;animation:tp 1.2s infinite ease-in-out}
    .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
    @keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
    .botnote{align-self:center;background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:11px;font-weight:600;color:var(--muted);margin:10px 0 4px;display:inline-flex;align-items:center;gap:6px}

    .th-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center;padding:30px}
    .th-empty .big{width:96px;height:96px;border-radius:28px;background:linear-gradient(180deg,var(--surface),var(--surface-2));color:var(--accent-d);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);border:1px solid var(--line)}
    .th-empty .big.err{background:var(--danger-soft);border-color:var(--plum-line);color:var(--red)}
    .th-empty h3{margin:0;font-size:18px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
    .th-empty p{margin:0;max-width:330px;font-size:13px;line-height:1.6}

    /* ── composer ────────────────────────────────────────────────────────── */
    .composer{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:flex-end;gap:10px}
    .composer .ico{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:9px;border-radius:10px;flex:none;transition:.12s;display:inline-flex}
    .composer .ico:hover{background:var(--surface-2);color:var(--accent-d)}
    .composer .field{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:22px;display:flex;align-items:flex-end;padding:2px 6px 2px 4px;transition:.15s}
    .composer .field:focus-within{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
    .composer textarea{flex:1;resize:none;max-height:120px;min-height:22px;border:none;background:transparent;padding:9px 11px;font:inherit;font-size:14px;color:var(--ink);line-height:1.4;outline:none}
    .composer .send{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:.15s}
    .composer .send:hover{background:var(--accent-d);transform:scale(1.05)}
    .composer .send:active{transform:scale(.96)}

    /* thread back button (mobile only) */
    .th-back{display:none;background:transparent;border:none;color:var(--ink);cursor:pointer;padding:6px;margin-inline-end:2px;border-radius:9px}
    .th-back:hover{background:var(--surface-2)}

    /* ── mobile-first: collapse the 3-pane layout to a single column (list → thread → back).
       Desktop (>820px) is completely untouched. Super-app pattern: full-screen sub-views. ── */
    @media (max-width:820px){
      aside.side{display:none}
      .conv-col{width:100%;flex:1 1 auto;border:none}
      .conv-head{padding:14px 16px 8px}
      .thread-col{display:none}
      .chat.mob-thread .conv-col{display:none}
      .chat.mob-thread .thread-col{display:flex;flex:1 1 auto}
      .th-back{display:inline-flex}
      .msgs{padding:16px 12px 14px}
      .msg{max-width:82%}
      .conv{padding:12px 10px}          /* taller rows for touch */
      .composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
      .th-head{padding:10px 12px}
      .th-head .ha button{padding:10px}  /* 44px touch targets */
    }
    /* «שיחה חדשה» where the side panel is folded away (the list's head; the panel's own button is the wide frame's).
       34px under a finger, 28 of them in the row: the head keeps its height — 5px more of it squeezed the list
       shut in the smallest window, and the windows suite said so. */
    .mnew{display:none;flex:none;align-items:center;justify-content:center;width:34px;height:34px;margin-block:-3px;margin-inline-start:auto;
      border:none;border-radius:999px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
    @media (max-width:820px){.mnew{display:inline-flex}}

    /* toast */
    #toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:100;opacity:0;transform:translateY(12px);transition:.28s cubic-bezier(.2,.9,.3,1);box-shadow:var(--shadow-lg);pointer-events:none;display:flex;align-items:center;gap:9px}
    #toast.show{opacity:1;transform:translateY(0)}
    #toast .ok{font-weight:800;display:inline-flex}
    /* a MARK of the page (`mark()` below): drawn at the size of the text it sits in — as the live chat */
    .mk{width:1em;height:1em;flex:none;vertical-align:-.14em}
    .tick{display:inline-flex}
    .tick.read .mk{stroke-width:3.2}   /* read is also HEAVIER than delivered — not told by colour alone */
  </style>
</head>
<body>
  <div id="toast"></div>
  <div class="chat">
    <aside class="side">
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
        <div><h1>צ׳אט</h1><div class="sub">שיחות מרובות ספקים</div></div>
      </div>
      <button class="newbtn" id="newChat"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>שיחה חדשה</button>

      <!-- (hidden until an account is read: renderBotCard shows them) -->
      <div class="side-lbl" hidden>אוטומציה</div>
      <div class="botctl" hidden>
        <div class="h"><span class="bi"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg></span>בוט פעיל בחיבור זה</div>
        <div class="selwrap"><select id="botSelect"></select></div>
        <div class="bd" id="botDesc"></div>
      </div>

      <div class="side-sp"></div>
      <div class="side-lbl">חיבור פעיל</div>
      <div class="connftr" id="connftr" title="מצב החיבור">
        <span class="provico" id="provIco">·<span class="pdot" id="provDot"></span></span>
        <span class="cx"><span class="cn" id="connName">—</span><span class="cs muted" id="connState">טוען…</span></span>
      </div>
    </aside>

    <div class="conv-col">
      <div class="conv-head">
        <div class="r"><h2>שיחות</h2><span class="cnt" id="convCount"></span>
          <!-- the narrow frame's twin of «שיחה חדשה»: under 820px aside.side is hidden, and a conversation could
               not be started from a phone - or from the window desktop mode opens this screen in (580px on a laptop) -->
          <button class="mnew" id="mNew" type="button" title="שיחה חדשה" aria-label="שיחה חדשה"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="convSearch" placeholder="חיפוש שיחה או איש קשר…">
        </div>
      </div>
      <div class="segtabs" id="segtabs">
        <button class="seg on" data-f="all">הכל <span class="n" data-c="all"></span></button>
        <button class="seg" data-f="unread">לא נקראו <span class="n" data-c="unread"></span></button>
        <button class="seg" data-f="group">קבוצות <span class="n" data-c="group"></span></button>
      </div>
      <div class="conv-list" id="convList" role="list" aria-label="רשימת שיחות"></div>
    </div>

    <div class="thread-col"><div id="thread"></div></div>
  </div>

  <script>
  (function(){
    var $=function(s,r){return (r||document).querySelector(s);};
    /* What the service ANSWERED — or a failure, which is said. Every read and write here was asked bare: a
       service that did not answer threw «Failed to fetch» past everything, one that answered a proxy's 502
       threw the parser's complaint about «<», the page stood empty and said nothing, and «החיבור חודש בהצלחה»
       was said off any answer at all (flow-qa.py, rule 15). Said once, by the office's notice, with the way
       to ask again. */
    function api(p,o){return fetch('api'+p,o).then(function(r){ if(!r.ok) throw new Error('status '+r.status); return r; });}
    function jf(p,o){return api(p,o).then(function(r){return r.json();});}
    function post(p,body){return api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
    var UNSAID=null;
    function unsaid(what){ return function(){ if(UNSAID&&UNSAID.isConnected) return;
      UNSAID=binaTell(what,'bad',{stay:true,act:['נסה שוב',window.__chatReload]}); }; }
    function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
    function ago(m){ if(m==null)return''; if(m<1)return'עכשיו'; if(m<60)return m+' דק׳'; if(m<1440){return Math.floor(m/60)+' שע׳';} var d=Math.round(m/1440); return d===1?'אתמול':d+' ימים'; }
    function clock(m){ var total=(9*60)-m; if(total<0)total+=24*60; var hh=Math.floor(total/60)%24, mm=((total%60)+60)%60; return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm; }
    function daylabel(m){ var d=Math.floor(m/1440); return d===0?'היום':d===1?'אתמול':'לפני '+d+' ימים'; }
    function toast(msg){ var t=$('#toast'); t.innerHTML='<span class="ok">'+mark('check')+'</span>'+esc(msg); t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2400); }

    var STCOL={ok:'var(--ok)',warning:'var(--lime)',error:'var(--red)'};   // the palette's: well · look here · failed
    var STHE={ok:'מחובר',warning:'דורש תשומת לב',error:'שגיאת חיבור'};
    var PROVICO={local:'💬',whatsapp:'W',telegram:'T',whatsapp_cloud:'W',messenger:'M'};
    /* The page's MARKS are drawn, never typed — the live chat's helper (apps/chat, `mark()`), with the
       shapes this copy uses. A mark that tells something carries the words for it in `say`. */
    var MARK={check:'M20 6 9 17l-5-5',checks:'M18 6 7 17l-5-5M22 10l-7.5 7.5L13 16',
      bot:'M12 8V4H8M6 8h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zM2 14h2M20 14h2M15 13v2M9 13v2'};
    function mark(n,say){ return '<svg class="mk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" '+
      (say?'role="img" aria-label="'+esc(say)+'"><title>'+esc(say)+'</title>':'aria-hidden="true">')+'<path d="'+MARK[n]+'"/></svg>'; }
    function tagClass(t){return t==='לקוח'?'tag-cust':t==='ספק'?'tag-supp':t==='קבוצה'?'tag-grp':'tag-bot';}
    function tagHtml(t){return t?'<span class="tag '+tagClass(t)+'">'+esc(t)+'</span>':'';}
    /* A sent message's three states: one check, two, and two that are heavier and in the read colour. */
    function tickHtml(status){ return status==='read'?'<span class="tick read">'+mark('checks','נקראה')+'</span>'
      :status==='delivered'?'<span class="tick gray">'+mark('checks','נמסרה')+'</span>'
      :status==='sent'?'<span class="tick gray">'+mark('check','נשלחה')+'</span>':''; }

    var S={accounts:[],active:null,activeAcct:null,bots:[],convs:[],filter:'all',q:'',openId:null,openContact:null};

    function boot(){
      Promise.all([jf('/accounts'),jf('/bots')]).then(function(r){
        S.accounts=r[0].accounts||[]; S.active=r[0].active; S.bots=r[1].bots||[];
        S.activeAcct=S.accounts.filter(function(a){return a.id===S.active;})[0]||S.accounts[0]||null;
        renderBotCard(); renderConn(); loadConvs();
      }).catch(function(){ if(!S.activeAcct) $('#connState').textContent='לא נטען';   // not «טוען…» for good
        unsaid('הצ׳אט לא נטען')(); });
    }
    window.__chatReload=function(){ S.openId=null; S.openContact=null; boot(); };

    function loadConvs(){ jf('/conversations').then(function(d){ S.convs=d.conversations||[]; renderList(); if(!S.openId) renderThreadState(); }).catch(unsaid('השיחות לא נטענו')); }

    /* sidebar */
    function renderBotCard(){
      var sel=$('#botSelect'),a=S.activeAcct,card=sel.closest('.botctl');
      // with no account in view there is no bot to choose: «בוט פעיל בחיבור זה» stood over an EMPTY select
      card.hidden=!a; if(card.previousElementSibling)card.previousElementSibling.hidden=!a;
      if(!a){sel.innerHTML='';return;}
      sel.innerHTML=S.bots.map(function(b){return '<option value="'+b.id+'"'+(b.id===a.activeBot?' selected':'')+'>'+esc(b.name)+'</option>';}).join('');
      var cur=S.bots.filter(function(b){return b.id===a.activeBot;})[0]; $('#botDesc').textContent=cur?cur.desc:'';
      sel.onchange=function(){ var bot=sel.value;
        post('/account/bot',{id:a.id,bot:bot})
          .then(function(){return jf('/accounts');}).then(function(d){
            S.accounts=d.accounts||[]; S.activeAcct=S.accounts.filter(function(x){return x.id===S.active;})[0]||S.activeAcct; a=S.activeAcct;
            var c=S.bots.filter(function(b){return b.id===a.activeBot;})[0]; $('#botDesc').textContent=c?c.desc:'';
            toast('הבוט הפעיל עודכן: '+(c?c.name:bot)); if(S.openId) renderBotnote();
          }).catch(unsaid('הבוט הפעיל לא עודכן'));
      };
    }
    function renderConn(){
      var a=S.activeAcct; if(!a)return;
      $('#connName').textContent=a.label;
      var stx=$('#connState'); stx.textContent=(a.status==='ok'?a.identity:(a.reason||STHE[a.status])); stx.style.color=a.status==='ok'?'var(--muted)':STCOL[a.status];
      var ico=$('#provIco'); ico.firstChild.textContent=PROVICO[a.provider]||'·'; ico.style.background=a.color||'var(--olive)';
      $('#provDot').style.background=STCOL[a.status]||'var(--line)';
    }

    /* conversation list */
    function filtered(){
      var arr=S.convs.slice();
      if(S.filter==='unread')arr=arr.filter(function(c){return c.unread>0;});
      else if(S.filter==='group')arr=arr.filter(function(c){return c.group;});
      if(S.q){var q=S.q.toLowerCase();arr=arr.filter(function(c){return (c.name+' '+c.last+' '+(c.handle||'')).toLowerCase().indexOf(q)>=0;});}
      return arr;
    }
    function counts(){var c={all:S.convs.length,unread:0,group:0};S.convs.forEach(function(x){if(x.unread>0)c.unread++;if(x.group)c.group++;});return c;}
    function renderList(){
      var c=counts(); Object.keys(c).forEach(function(k){var el=document.querySelector('[data-c="'+k+'"]');if(el)el.textContent=c[k];});
      $('#convCount').textContent=S.convs.length;
      var arr=filtered(),host=$('#convList');
      // an errored account has no conversations — on mobile the thread pane is hidden, so surface the
      // failure + reconnect right here in the list (otherwise the user sees a blank "no chats" and is stuck).
      if(!arr.length && S.activeAcct && S.activeAcct.status==='error'){
        host.innerHTML='<div class="list-err"><div class="le-ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg></div>'+
          '<b>החיבור נכשל</b><span>'+esc(S.activeAcct.reason||'החשבון אינו זמין כרגע.')+'</span>'+
          '<button class="le-btn" id="reconBtnL"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>חבר מחדש</button></div>';
        var rb=$('#reconBtnL'); if(rb)rb.onclick=function(){ rb.disabled=true; rb.style.opacity='.6';
          post('/account/reconnect',{id:S.activeAcct.id}).then(function(){ toast('החיבור חודש בהצלחה'); window.__chatReload(); }).catch(unsaid('החיבור לא חודש')); };
        return;
      }
      if(!arr.length){host.innerHTML='<div class="list-empty">'+(S.convs.length?'אין שיחות תואמות':'אין שיחות בחיבור זה עדיין')+'</div>';return;}
      host.innerHTML=arr.map(function(c){
        var pin=c.pinned?'<svg class="pin" viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M16 3v2l-1 1v4l2 2v2h-4v5l-1 1-1-1v-5H6v-2l2-2V6L7 5V3z"/></svg>':'';
        var badge=c.unread>0?'<span class="badge">'+c.unread+'</span>':'';
        var pres=c.online?'<span class="presence"></span>':'';
        var lead=c.lastDir==='out'?tickHtml(c.lastStatus==='sent'||c.lastStatus==='read'?c.lastStatus:'delivered'):'';
        return '<div class="conv'+(c.id===S.openId?' on':'')+(c.unread>0?' unread':'')+'" data-id="'+esc(c.id)+'" role="listitem" tabindex="0" aria-label="'+esc(c.name)+(c.unread>0?(', '+(c.unread===1?'אחת חדשה':c.unread+' חדשות')):'')+'">'+
          '<span class="avatar"><span class="av" style="background:'+c.color+'">'+esc(c.initials)+'</span>'+pres+'</span>'+
          '<span class="cx"><span class="r1"><span class="nm">'+esc(c.name)+'</span><span class="tm">'+ago(c.mins)+'</span></span>'+
          '<span class="r2"><span class="lm">'+lead+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c.last)+'</span></span>'+tagHtml(c.tag)+pin+badge+'</span></span></div>';
      }).join('');
      host.querySelectorAll('.conv').forEach(function(el){var go=function(){openConv(el.getAttribute('data-id'));};el.onclick=go;el.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
    }

    /* thread */
    var mob=function(){return window.matchMedia&&window.matchMedia('(max-width:820px)').matches;};
    function openConv(id){ S.openId=id; var c=S.convs.filter(function(x){return x.id===id;})[0]; if(c)c.unread=0; renderList();
      if(mob()) document.querySelector('.chat').classList.add('mob-thread');   // slide to thread on phones
      jf('/conversation/'+encodeURIComponent(id)).then(renderThread).catch(unsaid('השיחה לא נטענה')); }
    function mobBack(){ document.querySelector('.chat').classList.remove('mob-thread'); }
    function bubble(msg,head,showSender){
      var sndr=(showSender&&msg.sender)?'<span class="sndr" style="color:'+(msg.scolor||'var(--blue)')+'">'+esc(msg.sender)+'</span>':'';
      return '<div class="msg '+(msg.dir==='out'?'out':'in')+(head?' head':'')+'">'+sndr+
        '<span class="txt">'+esc(msg.text)+'</span>'+
        '<span class="mt">'+clock(msg.mins)+(msg.dir==='out'?tickHtml(msg.status):'')+'</span></div>';
    }
    function msgsHtml(list,isGroup){
      var out='',prevKey=null,prevDay=null;
      list.forEach(function(mm){ var day=Math.floor(mm.mins/1440);
        if(day!==prevDay){ out+='<div class="daysep">'+daylabel(mm.mins)+'</div>'; prevDay=day; prevKey=null; }
        var key=mm.dir==='out'?'out':('in:'+(mm.sender||'')); var head=key!==prevKey;
        out+=bubble(mm, head, isGroup && mm.dir==='in' && head); prevKey=key;
      });
      return out;
    }
    function lastIsOut(m){ var e=m.querySelectorAll('.msg'); var l=e[e.length-1]; return l && l.classList.contains('out'); }
    function activeBotName(){var a=S.activeAcct;if(!a||a.activeBot==='none')return null;var b=S.bots.filter(function(x){return x.id===a.activeBot;})[0];return b?b.name:null;}
    function renderBotnote(){ var m=$('#msgs'); if(!m)return; var old=m.querySelector('.botnote'); if(old)old.remove();
      if(S.openContact && S.openContact.group) return;   // bots don't auto-reply in group chats
      var bn=activeBotName(); if(bn){var d=document.createElement('div');d.className='botnote';d.innerHTML=mark('bot')+' '+esc(bn)+' פעיל · מגיב אוטומטית';m.appendChild(d);m.scrollTop=m.scrollHeight;} }
    function renderThread(data){
      var ct=data.contact||{}; S.openContact=ct;
      $('#thread').innerHTML=
        '<div class="th-head"><button class="th-back" title="חזרה"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button><span class="avatar"><span class="av sm" style="background:'+(ct.color||'var(--muted)')+'">'+esc(ct.initials||'?')+'</span>'+((S.convs.filter(function(x){return x.id===data.id;})[0]||{}).online?'<span class="presence"></span>':'')+'</span>'+
          '<span class="cx"><div class="nm">'+esc(ct.name||'')+tagHtml(ct.tag)+'</div><div class="hn'+((S.convs.filter(function(x){return x.id===data.id;})[0]||{}).online?' online':'')+'">'+((S.convs.filter(function(x){return x.id===data.id;})[0]||{}).online?'מחובר/ת עכשיו':esc(ct.handle||''))+'</div></span>'+
          '<span class="ha">'+
            '<button title="שיחת וידאו"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg></button>'+
            '<button title="חיפוש בשיחה"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>'+
            '<button title="פרטים"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>'+
          '</span></div>'+
        '<div class="msgs" id="msgs" role="log" aria-live="polite" aria-label="הודעות בשיחה"></div>'+
        '<div class="composer" id="composer">'+
          '<button class="ico" title="אמוג׳י"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button>'+
          '<button class="ico" title="צירוף קובץ"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 6.34l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>'+
          '<div class="field"><textarea id="ta" rows="1" placeholder="הקלד/י הודעה…"></textarea></div>'+
          '<button class="send" id="sendBtn" title="שליחה"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>'+
        '</div>';
      var m=$('#msgs'); m.innerHTML=msgsHtml(data.messages||[], ct.group); renderBotnote(); m.scrollTop=m.scrollHeight;
      var ta=$('#ta');
      ta.addEventListener('input',function(){ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px';});
      ta.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});
      $('#sendBtn').onclick=doSend;
      var bk=$('.th-back'); if(bk)bk.onclick=mobBack;
      if(!mob())ta.focus();
    }
    function renderThreadState(){
      var a=S.activeAcct;
      if(a&&a.status==='error'){
        $('#thread').innerHTML='<div class="th-empty"><div class="big err"><svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg></div>'+
          '<h3>החיבור נכשל</h3><p>'+esc(a.reason||'החשבון אינו זמין כרגע.')+'</p>'+
          '<button class="newbtn" id="reconBtn" style="margin:2px 0 0;background:var(--plum);color:var(--plum-ink)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>חבר מחדש</button></div>';
        var rb=$('#reconBtn'); if(rb)rb.onclick=function(){ rb.disabled=true; rb.style.opacity='.6';
          post('/account/reconnect',{id:a.id})
            .then(function(){ toast('החיבור חודש בהצלחה'); window.__chatReload(); }).catch(unsaid('החיבור לא חודש')); };
        return;
      }
      $('#thread').innerHTML='<div class="th-empty"><div class="big"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>'+
        '<h3>הצ׳אט העסקי שלך</h3><p>בחר/י שיחה מהרשימה כדי להתחיל, או חבר/י חשבון צ׳אט נוסף (וואטסאפ · טלגרם · מקומי) מהמתג שבראש הדף.</p></div>';
    }
    function doSend(){
      var ta=$('#ta'); if(!ta)return; var text=ta.value.trim(); if(!text||!S.openId)return;
      var m=$('#msgs'); var note=m.querySelector('.botnote'); if(note)note.remove();
      m.insertAdjacentHTML('beforeend',bubble({dir:'out',text:text,mins:0,status:'sent'}, !lastIsOut(m)));
      m.scrollTop=m.scrollHeight; ta.value=''; ta.style.height='auto';
      var c=S.convs.filter(function(x){return x.id===S.openId;})[0]; if(c){c.last=text;c.lastDir='out';c.lastStatus='sent';c.mins=0;} renderList();
      post('/conversation/'+encodeURIComponent(S.openId)+'/send',{text:text})
        .then(function(r){return r.json();}).then(function(res){
          setTimeout(function(){var os=m.querySelectorAll('.msg.out');var last=os[os.length-1];if(last){var t=last.querySelector('.mt');if(t)t.innerHTML=clock(0)+tickHtml('read');}if(c){c.lastStatus='read';renderList();}},700);
          if(res.reply){
            var tp=document.createElement('div'); tp.className='typing'; tp.innerHTML='<i></i><i></i><i></i>'; m.appendChild(tp); m.scrollTop=m.scrollHeight;
            setTimeout(function(){ tp.remove(); m.insertAdjacentHTML('beforeend',bubble(res.reply,true)); renderBotnote(); m.scrollTop=m.scrollHeight;
              if(c){c.last=res.reply.text;c.lastDir='in';c.mins=0;renderList();} },1100);
          }
        }).catch(unsaid('ההודעה לא נשלחה'));
    }
    function newChat(){ if(S.convs.length){ toast('בחר/י שיחה קיימת, או חבר/י חשבון נוסף מהמתג'); } else { toast('חבר/י חשבון צ׳אט מהמתג שבראש הדף'); } }

    document.querySelectorAll('#segtabs .seg').forEach(function(el){el.onclick=function(){document.querySelectorAll('#segtabs .seg').forEach(function(x){x.classList.remove('on');});el.classList.add('on');S.filter=el.getAttribute('data-f');renderList();};});
    var deb; $('#convSearch').addEventListener('input',function(e){clearTimeout(deb);deb=setTimeout(function(){S.q=e.target.value.trim();renderList();},110);});
    $('#newChat').onclick=newChat;
    $('#mNew').onclick=newChat;

    boot();
  })();
  </script>
