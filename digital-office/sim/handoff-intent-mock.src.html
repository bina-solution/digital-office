<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>דפדפן הלשכה נפתח וחוזר · הדמייה</title>
<!--
  handoff-intent-mock — the interactive simulation behind DGO-1434 (the owner, 2026-11-06):
  «…i want it to open the browser in front of my eyes in desktop mode in a new windows so both shown
  and if not desktop mode it should just switch to the browser like native experience … and later
  even after login it should open back that application like it works in all operating systems».

  What is his, what is drawn, and what is proposed:
    * HIS PIXELS. The two pictures inside the windows are cut from his own screenshot of 14:54 (vps1's
      console, desktop mode): the Claude app's «Sign In» as its window streamed it, and the office
      browser on Google's account chooser, the window he had to open by hand. Device rows 500…1316 of
      the 2816x1762 shot, cut with sips into ci-artifacts/handoff-mock/src/ (never tracked: his
      addresses are in them). The builder embeds them.
    * THE SHELL'S OWN CSS. The desktop's ground, the menu bar pill, the windows' title bars and lights,
      the dock, the toast, the phone's top bar and tab bar and the failure card are the console's real
      markup on its real stylesheets (theme-tokens.css, style.css, desktop.css). This file writes no
      colour. The geometry (focus zone, flanks, the pill's edges) is desktop.js's computeGeom, restated.
    * THE PROPOSAL, what does not exist yet:
        .ho-ribbon   the asking window says what it waits for, with «show the browser» and «cancel»;
        .pill.need   on the browser's title: which app the errand is for (the existing violet pill);
        .ho-back     the phone's fixed way back to the app that asked;
      and the motion: the browser opens BESIDE the app (the app keeps its side and gives up half), and
      at the end (done, failed or cancelled) the browser's window goes and the app is in front again.
    * A STAND-IN. The app's screen after the sign-in (no shot of it exists) is a labelled sketch.

  States (the hash is the state, so a screenshot and a person land on the same screen):
    #0   his screen: the app asks for a sign-in       #1   the browser beside it (phone: switched to it)
    #2   back, signed in      #2x  back, cancelled     #2f  back, failed: the card says why
  ?shot hides the simulator's own bar; ?theme=midnight is the dark ground. The mode follows the width,
  as in the console: from 1024px it is the desktop, below it the phone.
  Built into one file by build-handoff-mock.py → ci-artifacts/handoff-mock/handoff-mock.html.
-->
<link rel="stylesheet" href="../../platform-base/bina-ui/theme-tokens.css"/>
<link rel="stylesheet" href="../../platform-base/console/static/style.css"/>
<link rel="stylesheet" href="../../platform-base/console/static/desktop.css"/>
<script src="../../platform-base/bina-ui/bina-icons.js"></script>
<style>
/* ── the simulator's own furniture (not the proposal) ── */
:root{--sim-h:46px}
html.shot{--sim-h:0px}
/* a screenshot is a state, not a frame of a motion (and the first paint places, it does not slide) */
html.shot *,html.shot *::before,html.shot *::after,html.ho-boot *{transition:none!important}
html,body{height:100%}
body{overflow:hidden}
.sim{position:fixed;inset-block-start:0;inset-inline:0;height:var(--sim-h);box-sizing:border-box;z-index:9800;
  display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);
  font-size:13px;white-space:nowrap}
html.shot .sim{display:none}
.sim-t{font-size:12px;color:var(--muted)}
.sim-step{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sim-grow{flex:1}
.sim-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sim-seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;cursor:pointer}
.sim-seg button.on{background:var(--accent-soft);color:var(--accent-d)}
.sim .btn.sm{display:inline-flex;align-items:center;gap:6px;height:30px;box-sizing:border-box}
.sim-phone{position:fixed;inset:var(--sim-h) 0 0 0;z-index:9700;display:grid;place-items:center;background:var(--scrim)}
.sim-phone[hidden]{display:none}
.sim-phone iframe{width:390px;height:min(844px,calc(100vh - var(--sim-h) - 24px));border:1px solid var(--line);
  border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-lg)}
@media (max-width:760px){.sim-t,.sim-seg,#simMode{display:none}}

/* the desktop sits under the simulator's bar; the phone shell likewise */
.dk.ho-desk{inset:var(--sim-h) 0 0 0}
html:not(.dk-on) .ho-desk{display:none}
/* the grid the desktop draws on its canvas (desktop.js drawBg), as a pattern of its own tokens */
.ho-desk{background-image:linear-gradient(var(--sky-line) 1px,transparent 1px),linear-gradient(90deg,var(--sky-line) 1px,transparent 1px);
  background-size:44px 44px;background-position:center}
html[data-theme="midnight"] .ho-desk{background-image:linear-gradient(var(--sky-line) 1px,transparent 1px),linear-gradient(90deg,var(--sky-line) 1px,transparent 1px)}
html.ho-ph-on #app{height:calc(100dvh - var(--sim-h));margin-top:var(--sim-h)}

/* ── a streamed app's pixels: drawn to COVER its window, the image's own geometry in LTR ── */
.ho-stream{position:absolute;inset:0;overflow:hidden;direction:ltr;background:var(--surface)}
.ho-fit{position:absolute}
.ho-fit img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.ho-hot{position:absolute;z-index:2;border:0;padding:0;background:transparent;cursor:pointer;border-radius:6px}
.ho-hot:hover,.ho-hot:focus-visible{outline:2px solid var(--sky-d);outline-offset:2px}
/* where to press, while that is the next step (the simulator's hint, not the proposal) */
.ho-hot.hint{outline:2px solid var(--lime);outline-offset:3px;animation:hoHint 1.6s ease-in-out infinite}
@keyframes hoHint{50%{outline-offset:7px;outline-color:var(--lime-line)}}

/* ── THE PROPOSAL ────────────────────────────────────────────────────────────────────────────── */
/* 1. the asking window, while its errand is in the office browser. NEW: no component of the shell is
      a band over a window's body that says what the window waits for. Sky: in motion, it informs. */
.ho-ribbon{position:absolute;inset-block-start:0;inset-inline:0;z-index:4;display:flex;align-items:center;gap:10px;
  min-height:46px;padding:7px 12px;box-sizing:border-box;background:var(--sky-soft);color:var(--ink);
  border-bottom:1px solid var(--sky-line);font-size:13px;direction:rtl}
.ho-ribbon[hidden]{display:none}
.ho-ribbon .ho-rt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ho-ribbon .btn.sm{height:30px;box-sizing:border-box;display:inline-flex;align-items:center;flex:none}
.ho-pulse{width:9px;height:9px;border-radius:50%;background:var(--sky-d);flex:none;animation:hoPulse 1.4s ease-in-out infinite}
@keyframes hoPulse{50%{opacity:.35;transform:scale(.7)}}
.ho-grow{flex:1}
/* 2. the browser is navigating (a sign-in page answering): the shell's sky, as a thin bar */
.ho-load{position:absolute;inset-block-start:0;inset-inline:0;height:3px;z-index:5;background:var(--sky-d);
  transform-origin:100% 50%;animation:hoLoad .9s var(--ease-standard) forwards}
@keyframes hoLoad{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
/* 3. the window the errand opened: in, beside the app; and out, toward its tile in the dock */
.dk-win.ho-in{animation:hoIn .42s var(--ease-standard)}
@keyframes hoIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.dk-win.ho-out{transition:transform .42s var(--ease-standard),opacity .42s;opacity:0;pointer-events:none}
.dk-win[hidden]{display:none}
.dk-title .pill.need{font-weight:600;margin-inline-start:4px}
.dk-title .ic-svg{width:15px;height:15px}
/* 4. the phone: two screens in the one frame, the browser slides over the app and back */
.ho-scr{position:absolute;inset:0;transition:transform .36s var(--ease-standard);background:var(--surface)}
.ho-scr.ho-bro{transform:translateX(-100%)}
html.ho-p1 .ho-scr.ho-bro{transform:none}
html.ho-p1 .ho-scr.ho-app{transform:translateX(30%)}
.ho-bro .ho-stream{inset-block-start:44px}
/* the way back: fixed at the top of the browser's screen, one touch, always (iOS's breadcrumb) */
.ho-back{position:absolute;inset-block-start:0;inset-inline:0;height:44px;box-sizing:border-box;z-index:4;display:flex;
  align-items:center;gap:8px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line);direction:rtl}
.ho-back-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 8px;border:0;border-radius:8px;
  background:none;color:var(--sky-d);font:inherit;font-size:14px;cursor:pointer}
.ho-back-btn:hover{background:var(--sky-soft)}
.ho-back-btn .ic-svg{width:17px;height:17px}
.ho-back .pill.need{font-weight:600}
#phTitle .ic-svg{width:20px;height:20px}
.bn-ic .ic-svg{width:20px;height:20px}
/* 5. the failure card is handoffs.js's own (`say`); without the sign-out card's grid (style.css
      `.signed-out .modal`) its button ran on inline after the sentence. The line style.css gains: */
.handoff-said .modal{display:grid;gap:12px}
.handoff-said .modal-h{margin:0}
.ho-phone .dk-toast{position:fixed;bottom:76px;z-index:70;max-width:calc(100vw - 32px);white-space:normal;text-align:center}
.dk-toast.ho-ok{border-color:var(--olive-line)}
</style>
</head>
<body>
<div class="sim" id="sim">
  <span class="sim-t">הדמייה · DGO-1434</span>
  <span class="sim-step" id="simStep"></span>
  <span class="sim-grow"></span>
  <div class="sim-seg" role="group" aria-label="מה יקרה בדפדפן אחרי בחירת החשבון">
    <button type="button" data-out="ok" class="on" title="בחירת חשבון מסיימת את ההתחברות">מתחבר</button><button type="button" data-out="fail" title="בחירת חשבון מסתיימת בכישלון, כדי לראות מה קורה אז">נכשל</button>

</div>

<!-- ═══ the desktop (from 1024px) ═══ -->
<div class="dk ho-desk" id="dk">
  <div class="dk-bar pill" id="dkBar">
    <button class="dk-logo" type="button" aria-label="תפריט הלשכה"><!--@brand--></button>
    <button class="dk-appname" type="button" id="dkApp"></button>

    <span class="dk-grow"></span>
    <button class="dk-srch" type="button" title="חיפוש (Ctrl K)" data-ic="search"><span>חיפוש</span></button>
    <span class="dk-clock">יום ו׳, 6 בנוב׳, 14:54</span>
  </div>
  <div class="dk-layer">
    <div class="dk-win focused" id="wApp" role="region" aria-label="בינה קלוד · HP">
      <div class="dk-tb"><div class="dk-lights">
        <button class="dk-l close" type="button" aria-label="סגירה" title="סגירה"></button>
        <button class="dk-l min" type="button" aria-label="שליחה לצד" title="שליחה לצד"></button>
        <button class="dk-l zoom" type="button" aria-label="הגדלה" title="הגדלה"></button></div>
        <div class="dk-title"><span data-ic="sparkles"></span><span class="dk-t" data-office-hue="grey">בינה קלוד · HP</span></div>

      <div class="dk-body">
        <div class="ho-stream" id="appStream"></div>

          <span class="ho-pulse" aria-hidden="true"></span>
          <span class="ho-rt" id="appRibT">ממתין להתחברות בדפדפן הלשכה</span>
          <span class="ho-grow"></span>
          <button type="button" class="btn sm ghost" id="ribShow" title="מביא את חלון הדפדפן לחזית">הצגת הדפדפן</button>
          <button type="button" class="btn sm ghost" id="ribCancel" title="מבטל את ההתחברות וסוגר את הלשונית שנפתחה בשבילה">ביטול</button>
        </div>

    <div class="dk-win external" id="wBro" role="region" aria-label="דפדפן הלשכה · HP" hidden>
      <div class="dk-tb"><div class="dk-lights">

        <button class="dk-l min" type="button" aria-label="שליחה לצד" title="שליחה לצד"></button>
        <button class="dk-l zoom" type="button" aria-label="הגדלה" title="הגדלה"></button></div>
        <div class="dk-title"><span data-ic="monitor"></span><span class="dk-t" data-office-hue="grey">דפדפן הלשכה · HP</span><span class="pill need" title="בינה קלוד ביקשה את הדפדפן כדי להתחבר">התחברות עבור בינה קלוד</span></div>
        <div class="dk-end"><button class="dk-tbtn" type="button" title="פתיחה בלשונית נפרדת" data-ic="external"></button></div>

  </div>
  <div class="dk-dock" id="dkDock"></div>

</div>

<!-- ═══ the phone (below 1024px): the classic shell ═══ -->
<div class="ho-phone" id="ph">
  <div id="app">
    <aside class="side bnv"></aside>
    <main class="main">
      <header class="topbar">
        <div class="tb-left"><h1 id="phTitle"></h1></div>
        <div class="tb-right">
          <button class="search-btn" type="button" title="חיפוש מסך" data-ic="search"><span>חיפוש</span><span class="kbd">Ctrl K</span></button>

        </div>
      </header>
      <div class="embedwrap"><div class="embed" id="phEmbed">
        <div class="ho-scr ho-app"><div class="ho-stream" id="phAppStream"></div></div>
        <div class="ho-scr ho-bro" aria-label="דפדפן הלשכה · HP">
          <div class="ho-back">
            <button type="button" class="ho-back-btn" id="phBack" title="חזרה לבינה קלוד: מבטל את ההתחברות"><span data-ic="back"></span><span>בינה קלוד</span></button>
            <span class="ho-grow"></span>

    <a class="bn-item"><span class="bn-ic" data-ic="folder"></span><span>קבצים</span></a>

<div class="sim-phone" id="simPhone" hidden><iframe title="אותה הדמייה במסך טלפון"></iframe></div>

<script>
(function () {
  "use strict";
  // ── his pixels (the builder embeds them) ──
  const PX = {
    stream: { src: "../../ci-artifacts/handoff-mock/src/claude-stream.png", w: 1258, h: 812 },
    page:   { src: "../../ci-artifacts/handoff-mock/src/claude-signin.png", w: 541, h: 812 },
    homeD:  { src: "../../ci-artifacts/handoff-mock/src/claude-home-desk.svg", w: 1258, h: 812 },
    homeP:  { src: "../../ci-artifacts/handoff-mock/src/claude-home-phone.svg", w: 541, h: 812 },
    google: { src: "../../ci-artifacts/handoff-mock/src/browser-google.png", w: 1076, h: 812 },
  };
  // where to press, in the image's own pixels (measured on the crops: x, y, w, h)
  const HOT = {
    stream: [[547, 366, 165, 24, "go", "Continue with Google"]],
    page:   [[188, 366, 165, 24, "go", "Continue with Google"]],
    google: [[588, 492, 488, 116, "pick", "החשבון הראשון"], [588, 622, 488, 144, "pick", "החשבון השני"]],
  };

  const html = document.documentElement;
  const q = new URLSearchParams(location.search);
  if (q.has("shot") || q.has("embed")) html.classList.add("shot");
  const theme = q.get("theme");
  html.setAttribute("data-theme", theme === "midnight" ? "midnight" : "light");

  const ic = (name) => '<svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    (name === "search" ? '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'
      : name === "focus" ? '<path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>'
      : (BINA_ICONS[name] || BINA_ICONS.app)) + "</svg>";
  document.querySelectorAll("[data-ic]").forEach((e) => e.insertAdjacentHTML("afterbegin", ic(e.dataset.ic)));

  // ── the state ──
  const DESK = () => window.innerWidth >= 1024;          // desktop.js CFG.MIN_WIDTH
  let state = "0", outcome = "ok", busy = false;
  const STEP = {
    d: {
      "0":  "1/3 · כך זה היום: לחצו «Continue with Google» בחלון של בינה קלוד",
      "0b": "1/3 · נלחץ: הלשכה פותחת את הדפדפן…",
      "1":  "2/3 · דפדפן הלשכה נפתח לידה, שניהם גלויים. בחרו חשבון, או «ביטול»",
      "2":  "3/3 · התחברתם: הדפדפן נסגר, בינה קלוד חזרה למקומה, בחזית ומחוברת",
      "2x": "3/3 · ביטלתם: הלשונית נסגרה, בינה קלוד בחזית כמו שהייתה",
      "2f": "3/3 · ההתחברות נכשלה: חוזרים לבינה קלוד, והסיבה כתובה",
    },
    p: {
      "0":  "1/3 · בטלפון: לחצו «Continue with Google»",
      "0b": "1/3 · נלחץ: עוברים לדפדפן…",
      "1":  "2/3 · המסך עבר לדפדפן. «בינה קלוד» למעלה מחזיר בנגיעה",
      "2":  "3/3 · חזרה לבינה קלוד, מחוברת",
      "2x": "3/3 · ביטלתם: חזרה לבינה קלוד",
      "2f": "3/3 · נכשל: חזרה לבינה קלוד, והסיבה כתובה",
    },
  };
  const $ = (id) => document.getElementById(id);

  function say(s) {
    const k = DESK() ? "d" : "p";
    $("simStep").textContent = STEP[k][s] || "";
    try { if (window.parent !== window) window.parent.postMessage({ hoStep: STEP.p[s] || "" }, "*"); } catch (e) { /* a file has no origin to name */ }
  }

  // a stream: his picture COVERING the box it is drawn in, hot spots in its own pixels
  function stream(box, key, pos, hint) {
    const p = PX[key];
    box.innerHTML = "";
    const fit = document.createElement("div");
    fit.className = "ho-fit";
    const img = document.createElement("img");
    img.alt = ""; img.src = p.src; img.draggable = false;
    fit.appendChild(img);
    (HOT[key] || []).forEach(([x, y, w, h, act, label], i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "ho-hot" + (hint === act && i === 0 ? " hint" : "");
      b.style.left = (x / p.w * 100) + "%"; b.style.top = (y / p.h * 100) + "%";
      b.style.width = (w / p.w * 100) + "%"; b.style.height = (h / p.h * 100) + "%";
      b.setAttribute("aria-label", label); b.title = label;
      b.dataset.act = act;
      fit.appendChild(b);
    });
    box.appendChild(fit);
    box.dataset.key = key; box.dataset.pos = String(pos == null ? 50 : pos);
    place(box);
  }
  function place(box) {
    const p = PX[box.dataset.key], fit = box.firstElementChild;
    if (!p || !fit) return;
    const cw = box.clientWidth, ch = box.clientHeight;
    if (!cw || !ch) return;
    const s = Math.max(cw / p.w, ch / p.h), fw = p.w * s, fh = p.h * s;
    fit.style.width = fw + "px"; fit.style.height = fh + "px";
    fit.style.left = ((cw - fw) * Number(box.dataset.pos) / 100) + "px";
    fit.style.top = ((ch - fh) / 2) + "px";
  }

  // ── the desktop: desktop.js's geometry, restated ──
  let G = null;
  function geom() {
    const W = window.innerWidth, H = window.innerHeight - parseFloat(getComputedStyle(html).getPropertyValue("--sim-h") || "0");
    const f = 0.18 + 0.07 * Math.max(0, Math.min(1, (W - 1440) / 1120));
    const F = Math.max(200, Math.round(W * f));
    const top = 6 + 30 + 12, bottom = H - (64 + 10 + 14);
    G = { W, H, F, zl: F, zr: W - F, top, bottom };
  }
  // his window, where he had it (measured on the shot: 29/1199 from the left, 630x443 of a 1199x639 view)
  const hisApp = () => ({ x: Math.round(G.W * 0.024), y: Math.round(G.top + (G.bottom - G.top) * 0.07),
                          w: Math.round(G.W * 0.525), h: Math.round((G.bottom - G.top) * 0.86) });
  // THE PLACEMENT RULE: the app keeps its side (its centre left of the screen's → the left) and gives
  // up half of the width; the browser takes the other half; both whole, none over the other. The
  // height is the browser's picture at that width (its display is landscape), centred in the zone.
  function beside(app) {
    const gap = 16, m = 24, w = Math.floor((G.W - 2 * m - gap) / 2);
    const h = Math.min(G.bottom - G.top - 16, Math.round(w * PX.google.h / PX.google.w) + 36);
    const y = Math.round(G.top + (G.bottom - G.top - h) / 2);
    const left = app.x + app.w / 2 <= G.W / 2;
    const a = { x: left ? m : m + w + gap, y, w, h };
    const b = { x: left ? m + w + gap : m, y, w, h };
    return { a, b };
  }
  function put(el, r, anim) {
    el.classList.toggle("anim", !!anim);
    el.style.left = r.x + "px"; el.style.top = r.y + "px";
    el.style.width = r.w + "px"; el.style.height = r.h + "px";
  }
  function focus(which) {
    const a = $("wApp"), b = $("wBro");
    a.classList.toggle("focused", which === "app");
    b.classList.toggle("focused", which === "bro");
    a.style.zIndex = which === "app" ? "12" : "11";
    b.style.zIndex = which === "bro" ? "12" : "11";
    const name = which === "bro" ? "דפדפן הלשכה" : "בינה קלוד";
    $("dkApp").innerHTML = name + ' · <span class="dk-office" data-office-hue="grey"><span class="office-animal">' + ic("elephant") + "</span>HP</span>";
  }
  function dock(open) {
    const d = $("dkDock");
    // his dock, in his order (screen right to left, which is the DOM's order in RTL)
    const apps = [
      ["bot", "dk-c0", "סוכן"], ["bot", "dk-c6", "סוכן"], ["bot", "dk-c0", "סוכן"], ["activity", "dk-c1", "מרכז הבקרה"],
      ["folder", "dk-c6", "קבצים"], ["shield", "dk-c2", "אבטחה"], ["sparkles", "dk-c0", "בינה קלוד", "app"],
      ["mic", "dk-c6", "פגישות"], ["mail", "dk-c2", "מייל"], ["message", "dk-c2", "צ׳אט"], ["palette", "dk-c6", "נכסים דיגיטליים"],
      ["browser", "dk-c1", "חלונות"], ["browser", "dk-c2", "דפים"], ["activity", "dk-c0", "תהליכים"], ["link", "dk-c6", "חיבורים"],
      ["bell", "dk-c1", "התראות"], ["grid", "dk-c2", "אפליקציות"], ["monitor", "dk-c0", "דפדפן הלשכה", "bro"],
    ];
    const fits = Math.max(6, Math.floor((G.W - 40 - 20 - 3 * 54 - 10) / 54));
    d.innerHTML = "";
    apps.slice(apps.length - Math.min(fits, apps.length)).forEach(([i, c, n, k]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "dk-ic " + c + (k ? " is-remote" : "") + (k && open[k] ? " run" : "");
      if (k) b.dataset.officeHue = "grey";
      b.innerHTML = ic(i) + '<span class="tip"></span>';
      b.querySelector(".tip").textContent = n + (k ? " · HP" : "");
      b.setAttribute("aria-label", n);
      if (k) b.id = "dock-" + k;
      d.appendChild(b);
    });
    d.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
    [["brain", "dk-c2", "זיכרון"], ["grid", "dk-c6", "כל החלונות"], ["more", "dk-c6", "עוד"]].forEach(([i, c, n]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "dk-ic " + c; b.innerHTML = ic(i) + '<span class="tip"></span>';
      b.querySelector(".tip").textContent = n; b.setAttribute("aria-label", n);
      d.appendChild(b);
    });
  }
  let toastT = 0;
  function toast(el, msg, ok) {
    el.textContent = msg;
    el.classList.toggle("ho-ok", !!ok);
    el.classList.add("show");
    clearTimeout(toastT);
    if (!html.classList.contains("shot")) toastT = setTimeout(() => el.classList.remove("show"), 4200);
  }
  function card(sentence) {
    const old = document.querySelector(".modal-ov.handoff-said");
    if (old) old.remove();
    if (!sentence) return;
    // handoffs.js `say()`: the shell's own modal, its own words
    const el = document.createElement("div");
    el.className = "modal-ov handoff-said"; el.setAttribute("role", "alertdialog");
    el.style.zIndex = "9500";
    el.innerHTML = '<div class="modal"><div class="modal-h"><h3>לא הושלם</h3></div><span></span><button class="btn" type="button">הבנתי</button></div>';
    el.querySelector("span").textContent = sentence;
    el.querySelector("button").onclick = () => el.remove();
    document.body.appendChild(el);
  }
  const FAIL = "גוגל לא החזירה אישור לבינה קלוד (הקוד שחזר לא היה של הבקשה הזו). אפשר ללחוץ שוב על «Continue with Google».";

  function renderDesk(s, anim) {
    geom();
    const bar = $("dkBar");
    bar.style.left = G.zl + "px"; bar.style.right = (G.W - G.zr) + "px";
    const a = $("wApp"), b = $("wBro"), his = hisApp(), two = beside(his);
    const signedIn = s === "2";
    const open = { app: true, bro: s === "1" };
    dock(open);
    $("appRib").hidden = s !== "1" && s !== "0b";
    $("ribShow").hidden = s !== "1"; $("ribCancel").hidden = s !== "1";
    $("appRibT").textContent = s === "0b" ? "פותח את דפדפן הלשכה…" : "ממתין להתחברות בדפדפן הלשכה";
    if (s === "1") {
      put(a, two.a, anim);
      b.hidden = false; b.classList.remove("ho-out");
      put(b, two.b, false);
      if (anim) { b.classList.remove("ho-in"); void b.offsetWidth; b.classList.add("ho-in"); }
      stream($("broStream"), "google", 50, "pick");
      focus("bro");
    } else {
      put(a, his, anim);
      if (anim && !b.hidden) {
        // the errand's window goes toward its tile in the dock
        const t = $("dock-bro"), r = t ? t.getBoundingClientRect() : null, wr = b.getBoundingClientRect();
        if (r) b.style.transform = "translate(" + (r.left + r.width / 2 - (wr.left + wr.width / 2)) + "px," +
                                    (r.top + r.height / 2 - (wr.top + wr.height / 2)) + "px) scale(.08)";
        b.classList.add("ho-out");
        setTimeout(() => { b.hidden = true; b.style.transform = ""; b.classList.remove("ho-out", "ho-in"); }, 440);
      } else { b.hidden = true; b.classList.remove("ho-out", "ho-in"); b.style.transform = ""; }
      focus("app");
    }
    stream($("appStream"), signedIn ? "homeD" : "stream", 50, s === "0" ? "go" : "");
    // after a move the boxes change size: re-cover once the motion is over
    if (anim) setTimeout(() => { place($("appStream")); place($("broStream")); }, 470);
    const T = $("dkToast");
    if (s === "2") toast(T, "התחברתם · בינה קלוד מחוברת, ובחזית", true);
    else if (s === "2x") toast(T, "ההתחברות בוטלה · הלשונית בדפדפן נסגרה");
    else T.classList.remove("show");
    card(s === "2f" ? FAIL : "");
  }

  function renderPhone(s, anim) {
    const browser = s === "1";
    html.classList.toggle("ho-p1", browser);
    document.querySelectorAll(".ho-scr").forEach((x) => { x.style.transition = anim ? "" : "none"; });
    $("phTitle").innerHTML = browser
      ? ic("monitor") + 'דפדפן הלשכה · <span class="dk-office" data-office-hue="grey">HP</span>'
      : ic("sparkles") + 'בינה קלוד · <span class="dk-office" data-office-hue="grey">HP</span>';
    $("phOpen").textContent = browser ? "2" : "1";
    stream($("phAppStream"), s === "2" ? "homeP" : "page", 50, s === "0" ? "go" : "");
    stream($("phBroStream"), "google", 74, browser ? "pick" : "");
    const T = $("phToast");
    if (s === "2") toast(T, "התחברתם · בינה קלוד מחוברת", true);
    else if (s === "2x") toast(T, "ההתחברות בוטלה");
    else T.classList.remove("show");
    card(s === "2f" ? FAIL : "");
  }

  function render(s, anim) {
    state = s;
    const desk = DESK();
    html.classList.toggle("dk-on", desk);
    html.classList.toggle("ho-ph-on", !desk);
    if (desk) renderDesk(s, anim); else renderPhone(s, anim);
    say(s);
    $("simMode").textContent = desk ? "טלפון" : "דסקטופ";
    if (!html.classList.contains("shot") || q.has("embed")) {
      const h = "#" + s;
      if (location.hash !== h && s !== "0b") history.replaceState(null, "", location.pathname + location.search + h);
    }
  }

  // ── the person's presses ──
  function press(act) {
    if (busy) return;
    if (act === "go" && state === "0") {
      busy = true;
      if (DESK()) { render("0b", false); setTimeout(() => { busy = false; render("1", true); }, 750); }
      else { busy = false; render("1", true); }
    } else if (act === "pick" && state === "1") {
      busy = true;
      const body = DESK() ? $("broStream") : $("phBroStream");
      const bar = document.createElement("div"); bar.className = "ho-load"; body.appendChild(bar);
      setTimeout(() => { busy = false; render(outcome === "fail" ? "2f" : "2", true); }, 950);
    } else if (act === "cancel" && state === "1") render("2x", true);
  }
  document.addEventListener("click", (e) => {
    const h = e.target.closest(".ho-hot");
    if (h) { press(h.dataset.act); return; }
    if (e.target.closest("#ribCancel, #broClose, #phBack")) { press("cancel"); return; }
    if (e.target.closest("#ribShow")) { focus("bro"); return; }
    if (state === "1" && e.target.closest("#wApp")) focus("app");
    else if (state === "1" && e.target.closest("#wBro")) focus("bro");
  });
  $("simReset").onclick = () => { card(""); render("0", false); const f = $("simPhone").querySelector("iframe"); if (!$("simPhone").hidden) f.src = phoneSrc(); };
  document.querySelectorAll(".sim-seg button").forEach((b) => b.onclick = () => {
    outcome = b.dataset.out;
    document.querySelectorAll(".sim-seg button").forEach((x) => x.classList.toggle("on", x === b));
    try { $("simPhone").querySelector("iframe").contentWindow.postMessage({ hoOut: outcome }, "*"); } catch (e) { /* not open */ }
  });
  const phoneSrc = () => location.pathname + "?embed" + (html.getAttribute("data-theme") === "midnight" ? "&theme=midnight" : "") + "&out=" + outcome + "#0";
  $("simMode").onclick = () => {
    const box = $("simPhone");
    if (!DESK()) return;
    box.hidden = !box.hidden;
    $("simMode").textContent = box.hidden ? "טלפון" : "סגירת הטלפון";
    if (!box.hidden) box.querySelector("iframe").src = phoneSrc();
    else say(state);
  };
  $("simPhone").addEventListener("click", (e) => { if (e.target === $("simPhone")) $("simMode").click(); });
  $("simTheme").onclick = () => {
    const dark = html.getAttribute("data-theme") !== "midnight";
    html.setAttribute("data-theme", dark ? "midnight" : "light");
    $("simTheme").textContent = dark ? "בהיר" : "כהה";
    const f = $("simPhone").querySelector("iframe");
    if (!$("simPhone").hidden) f.src = phoneSrc();
  };
  window.addEventListener("message", (e) => {
    const d = e.data || {};
    if (d.hoStep != null && !$("simPhone").hidden) $("simStep").textContent = d.hoStep;
    if (d.hoOut) outcome = d.hoOut;
  });
  if (q.get("out") === "fail") outcome = "fail";
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") { card(""); if (state === "1") press("cancel"); } });
  let rz = 0;
  window.addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => render(state === "0b" ? "0" : state, false)); });

  const start = (location.hash || "#0").slice(1);
  html.classList.add("ho-boot");
  render(["0", "1", "2", "2x", "2f"].includes(start) ? start : "0", false);
  requestAnimationFrame(() => requestAnimationFrame(() => html.classList.remove("ho-boot")));
  if (html.getAttribute("data-theme") === "midnight") $("simTheme").textContent = "בהיר";
  window.addEventListener("load", () => document.querySelectorAll(".ho-stream").forEach(place));
  // ?drive=go,pick — the proof that the PRESSES work, not only the states: each word clicks the real
  // element a person would press (the hot spot, «ביטול»), 1.4 s apart, through the same handler.
  const drive = (q.get("drive") || "").split(",").filter(Boolean);
  const target = (w) => w === "cancel" ? $(DESK() ? "ribCancel" : "phBack") : document.querySelector('.ho-hot[data-act="' + w + '"]');
  drive.forEach((w, i) => setTimeout(() => { const t = target(w); if (t) t.click(); }, 600 + i * 1400));
})();
</script>
</body>
</html>
