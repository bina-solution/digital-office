# any-concurrency + n8n + postgres example
# Usage:
#   docker compose -f examples/docker-compose.n8n.yml up -d
#   Dashboard:  http://localhost:8080
#   n8n:        http://localhost:5678

services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     n8n
      POSTGRES_PASSWORD: n8npassword
      POSTGRES_DB:       n8n
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      DB_TYPE:                    postgresdb
      DB_POSTGRESDB_HOST:         postgres
      DB_POSTGRESDB_PORT:         5432
      DB_POSTGRESDB_USER:         n8n
      DB_POSTGRESDB_PASSWORD:     n8npassword
      DB_POSTGRESDB_DATABASE:     n8n
      N8N_HOST:                   localhost
      WEBHOOK_URL:                http://localhost:5678
      EXECUTIONS_DATA_PRUNE:      "true"
      EXECUTIONS_DATA_MAX_AGE:    "336"  # 14 days
    volumes:
      - n8n_data:/home/node/.n8n

  any-concurrency:
    image: any-concurrency:latest
    build:
      context: ..
    container_name: any-concurrency
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PG_HOST:     postgres
      PG_PORT:     5432
      PG_USER:     n8n
      PG_PASS:     n8npassword
      PG_DB:       n8n
      N8N_URL:     http://localhost:5678
      ENABLE_DOCKER:  "1"
      ENABLE_WEBHOOK: "1"
      ENABLE_TRAEFIK: "0"  # no traefik in this example

volumes:
  n8n_postgres_data:
  n8n_data:
