services:
  ollama:
    image: ollama/ollama:0.32.5
    container_name: ollama-${DEPLOYMENT_NAME:-bina-deployment}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 6G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
    - OLLAMA_HOST=0.0.0.0
    - OLLAMA_ORIGINS=*
    - OLLAMA_KEEP_ALIVE=10m
    - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    - OLLAMA_NUM_THREAD=2
    volumes:
    - ollama_data:/root/.ollama
    networks:
    - traefik-network
    healthcheck:
      test:
      - CMD-SHELL
      - ollama list || exit 1
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  ollama_data: null
networks:
  traefik-network:
    external: true
