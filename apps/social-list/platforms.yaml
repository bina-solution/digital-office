        note: {he: "חשבון עסקי או יוצר. פרסום תמונה/קרוסלה/ריל, מחיקה, תגובות ונתונים. תמונה לפרסום חייבת כתובת ציבורית."}
    profile:
      fields:
        name:   {max_len: 30}
        handle: {max_len: 30, pattern: "^[A-Za-z0-9._]+$"}
        bio:    {max_len: 150}
        links:  {max: 5}
      avatar: {w: 320, h: 320, aspect: "1:1", shape: circle, max_mb: 8}
    posts:
      - {id: image, he: "תמונה", text_max: 2200, images_max: 1, aspects: ["1:1", "4:5", "1.91:1"]}
      - {id: carousel, he: "קרוסלה", text_max: 2200, images_max: 10, aspects: ["1:1", "4:5"]}
      - {id: reel,  he: "ריל", text_max: 2200, aspects: ["9:16"], video_max_s: 180}
      - {id: story, he: "סטורי", aspects: ["9:16"]}
    ops:
      profile.get:           {api: "yes", browser: "yes"}
      profile.update.name:   {api: "no",  browser: "yes"}
      profile.update.bio:    {api: "no",  browser: "yes"}
      profile.update.avatar: {api: "no",  browser: "yes"}
      profile.update.banner: {api: "no",  browser: "no", na: true, why: {he: "לאינסטגרם אין תמונת נושא"}}
      profile.update.links:  {api: "no",  browser: "yes"}
      profile.update.handle: {api: "no",  browser: "limited"}
      post.list:             {api: "yes", browser: "yes"}
      post.create.text:      {api: "no",  browser: "no", na: true, why: {he: "באינסטגרם כל פוסט הוא תמונה או וידאו"}}
      post.create.image:     {api: "yes", browser: "yes"}
      post.create.video:     {api: "yes", browser: "no"}
      post.update:           {api: "no",  browser: "yes", why: {he: "ה-API לא עורך כיתוב"}}
      post.delete:           {api: "yes", browser: "yes"}
      comment.list:          {api: "yes", browser: "limited"}
      comment.create:        {api: "yes", browser: "limited"}
      comment.delete:        {api: "limited", browser: "no"}
      reaction.create:       {api: "no",  browser: "limited"}
      insights.get:          {api: "yes", browser: "no"}
    urls:
      profile: "https://www.instagram.com/{handle}/"
      profile_edit: "https://www.instagram.com/accounts/edit/"
      compose: "https://www.instagram.com/"

  - id: x
    name: {he: "X (טוויטר)", en: "X"}
    color: "#0f1419"
    monogram: "X"
    tos: {level: ban}
    origin: "https://x.com"
    kinds:
      browser:
        protocol: social_x_browser
        recommended: true
        note: {he: "הדפדפן של הלשכה, בחשבון שהבעלים התחבר אליו פעם אחת. כללי האוטומציה של X אוסרים הפעלת האתר בסקריפט — הלשכה פועלת בקצב של אדם, רק בפעולות שהבעלים יזם."}
      api:
        protocol: social_x_oauth
        needs: [access_token]
        help_url: "https://docs.x.com/x-api/introduction"
        note: {he: "תשלום לפי שימוש (מ-2026-02): ‎$0.015 לפוסט, ‎$0.20 לפוסט עם קישור. עדכון פרופיל רק דרך נקודות v1.1 ישנות — לא אומת שהן עובדות."}
    profile:
      fields:
        name:   {max_len: 50}
        handle: {min_len: 5, max_len: 15, pattern: "^[A-Za-z0-9_]+$"}
        bio:    {max_len: 160}
        location: {max_len: 30}
        links:  {max: 1}
      avatar: {w: 400, h: 400, aspect: "1:1", shape: circle, max_mb: 2}
      banner: {w: 1500, h: 500, aspect: "3:1", max_mb: 5}
    posts:
      - {id: text,  he: "פוסט", text_max: 280}
      - {id: image, he: "פוסט עם תמונות", text_max: 280, images_max: 4, aspects: ["16:9", "1:1"]}
      - {id: video, he: "פוסט וידאו", text_max: 280, video_max_s: 140}
    ops:
      profile.get:           {api: "yes", browser: "yes"}
      profile.update.name:   {api: "limited", browser: "yes"}
      profile.update.bio:    {api: "limited", browser: "yes"}
      profile.update.avatar: {api: "limited", browser: "yes"}
      profile.update.banner: {api: "limited", browser: "yes"}
      profile.update.links:  {api: "limited", browser: "yes"}
      profile.update.handle: {api: "no",  browser: limited}
      post.list:             {api: "yes", browser: "yes"}
      post.create.text:      {api: "yes", browser: "yes"}
      post.create.image:     {api: "yes", browser: "yes"}
      post.create.video:     {api: "yes", browser: "no", why: {he: "העלאת וידאו בדפדפן עוד לא נבנתה"}}
      post.update:           {api: "limited", browser: limited, why: {he: "עריכה רק למנויי פרימיום, בשעה הראשונה"}}
      post.delete:           {api: "yes", browser: "yes"}
      comment.list:          {api: "limited", browser: limited}
      comment.create:        {api: "limited", browser: "yes", why: {he: "מ-2026-02 תשובה דרך ה-API רק כשהכותב המקורי תייג אתכם"}}
      comment.delete:        {api: "limited", browser: "yes"}
      reaction.create:       {api: "no",  browser: "yes", why: {he: "לייקים הוסרו מגישת ה-API העצמית ב-2026-04"}}
