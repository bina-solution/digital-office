      - {id: community, he: "פוסט בלשונית הקהילה", text_max: 5000}
    ops:
      profile.get:           {api: "yes", browser: "yes"}
      profile.update.name:   {api: "no",  browser: "yes"}
      profile.update.bio:    {api: "yes", browser: "yes"}
      profile.update.avatar: {api: "no",  browser: "yes"}
