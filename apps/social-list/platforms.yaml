# social-list — the platform catalogue. DATA, not code: a spec that changes (a new banner size, a
# new post type, an API that opened or closed) is an edit here, never a release of the adapters.
#
# Every entry answers the same questions, because the screens, the adapters and digital-assets all
# read them from here and nowhere else:
#
#   kinds     HOW the office speaks for an account — each kind is exactly one connection PROTOCOL,
#             and the account's protocol picks the adapter:
#               browser  the office browser (browser42): the owner logs in ONCE in its live view and
#                        portal scripts (scripts/<platform>.yaml) act in that session. The default for
#                        every network — the office's own browser is how it works everywhere.
#               api      the platform's own API, with a credential in the vault — an alternative where
#                        a network offers one.
#             There is no third kind: nothing is "prepared for the owner to click". An op the office
#             cannot do yet is `no` with the reason, and it becomes `yes` when its script is written.
#   tos       what the platform's terms say about automating its website (research/platforms.md) —
#             INFORMATION shown next to the network, not a switch:
#               ban   the rules single out automating the site/an account (X, Discord, WhatsApp)
#               risk  a broad "no automated access without permission" clause (Facebook, Instagram,
#                     YouTube)
#               low   GitHub, the office's own test network
#             Whatever the level, the office browser acts at a person's pace, only on actions the
#             owner (or digital-assets on the owner's behalf) started, and a WRITE runs unwatched only
#             after one watched run verified its script.
#   profile   the editable fields, their limits, and the avatar/banner renditions.
#   posts     the post types and their limits.
#   ops       op × kind → "yes" | limited | "no" (+ why). A missing op is marked `na: true`.
#   urls      where a human sees the same thing (profile, profile_edit, compose).
#
# Specs were read on 2026-09-29 (research/platforms.md carries the evidence tag of every number:
# [V] read on the official page, [S] official snippet, [2] secondary, [?] unverified).
version: 3
checked: "2026-09-29"

#: The abstract op vocabulary — the whole of `social.v1`.
ops:
  profile.get:           {he: "קריאת פרופיל",        kind: read}
  profile.update.name:   {he: "שם תצוגה",            kind: write}
  profile.update.bio:    {he: "תיאור קצר",           kind: write}
  profile.update.avatar: {he: "תמונת פרופיל",        kind: write}
  profile.update.banner: {he: "תמונת נושא",          kind: write}
  profile.update.links:  {he: "קישורים",             kind: write}
  profile.update.handle: {he: "שם משתמש",            kind: write, risky: true}
  post.list:             {he: "פוסטים אחרונים",       kind: read}
  post.create.text:      {he: "פוסט טקסט",           kind: write}
  post.create.image:     {he: "פוסט עם תמונה",       kind: write}
  post.create.video:     {he: "פוסט וידאו",          kind: write}
  post.update:           {he: "עריכת פוסט",          kind: write}
  post.delete:           {he: "מחיקת פוסט",          kind: write, risky: true}
  comment.list:          {he: "תגובות",              kind: read}
  comment.create:        {he: "כתיבת תגובה",         kind: write}
  comment.delete:        {he: "מחיקת תגובה",         kind: write, risky: true}
  reaction.create:       {he: "לייק / תגובת רגש",     kind: write}
  insights.get:          {he: "נתוני חשיפה",          kind: read}

support:
  "yes":     {he: "נתמך"}
  limited:   {he: "חלקי"}
  "no":      {he: "עוד לא"}

kinds:
  browser: {he: "דפדפן הלשכה", short: "דפדפן"}
  api:     {he: "API רשמי", short: "API"}

tos_levels:
  ban:  {he: "תנאי השימוש של הרשת אוסרים אוטומציה של האתר — הלשכה פועלת בקצב של אדם, רק בפעולות שהבעלים יזם"}
  risk: {he: "תנאי השימוש אוסרים גישה אוטומטית ללא רשות — הלשכה פועלת בקצב של אדם, רק בפעולות שהבעלים יזם"}
  low:  {he: "אין הגבלה מיוחדת על פעולות מעטות מחשבון הבעלים"}

platforms:

  # ── the office's own test network (fixture.py) ─────────────────────────────────────────────────
  - id: fixture
    name: {he: "רשת בדיקה", en: "Test network"}
    color: "var(--olive)"       # the office's own: a token of its palette (a network's entry below is that network's mark)
    monogram: "ב"
    test: true
    tos: {level: low}
    origin: "{browser_self}/fixture"
    kinds:
      browser: {protocol: social_fixture_browser, recommended: true}
      api:     {protocol: social_fixture_api, needs: []}
    profile:
      fields:
        name:   {max_len: 50}
        handle: {max_len: 30, pattern: "^[a-z0-9_.-]+$"}
        bio:    {max_len: 160}
        links:  {max: 3}
      avatar: {w: 400, h: 400, aspect: "1:1", shape: circle, max_mb: 2}
      banner: {w: 1500, h: 500, aspect: "3:1", max_mb: 5}
    posts:
      - {id: text,  he: "טקסט", text_max: 500}
      - {id: image, he: "תמונה", text_max: 500, images_max: 4, aspects: ["1:1", "16:9", "4:5"]}
    ops:
      profile.get:           {api: "yes", browser: "yes"}
      profile.update.name:   {api: "yes", browser: "yes"}
      profile.update.bio:    {api: "yes", browser: "yes"}
      profile.update.avatar: {api: "yes", browser: "yes"}
      profile.update.banner: {api: "yes", browser: "yes"}
      profile.update.links:  {api: "yes", browser: "no"}
      profile.update.handle: {api: "yes", browser: "no"}
      post.list:             {api: "yes", browser: "yes"}
      post.create.text:      {api: "yes", browser: "yes"}
      post.create.image:     {api: "yes", browser: "yes"}
      post.create.video:     {api: "no",  browser: "no", na: true}
      post.update:           {api: "yes", browser: "no"}
      post.delete:           {api: "yes", browser: "yes"}
      comment.list:          {api: "yes", browser: "no"}
      comment.create:        {api: "yes", browser: "no"}
      comment.delete:        {api: "yes", browser: "no"}
      reaction.create:       {api: "yes", browser: "no"}
      insights.get:          {api: "yes", browser: "no"}
    urls:
      profile: "{origin}/"
      profile_edit: "{origin}/settings"
      compose: "{origin}/"

  # ── the channels digital-assets was built around (the website belongs to `sites`) ──────────────
  - id: facebook
    name: {he: "פייסבוק", en: "Facebook"}
    color: "#1877f2"
    monogram: "f"
    tos: {level: risk}
    origin: "https://www.facebook.com"
    kinds:
      browser:
        protocol: social_facebook_browser
        recommended: true
        note: {he: "הדפדפן של הלשכה כבר מחובר לפייסבוק של הבעלים — הדרך הקצרה. פרסום ועריכת פוסט נצפו עובדים (2026-09-22)."}
      api:
        protocol: social_facebook_page_token
        needs: [page_id, page_token]
        help_url: "https://developers.facebook.com/docs/pages-api/getting-started"
        note: {he: "טוקן עמוד עם pages_manage_posts, pages_read_engagement, pages_manage_metadata. אפליקציית Meta במצב פיתוח שהבעלים מנהל אותה — כנראה בלי בדיקת אפליקציה (לא אומת)."}
    profile:
      fields:
        name:   {max_len: 75, note: {he: "שינוי שם עמוד הוא בקשה שפייסבוק מאשרת"}}
        handle: {min_len: 5, max_len: 50, pattern: "^[A-Za-z0-9.]+$"}
        bio:    {max_len: 101}
        links:  {max: 1}
      avatar: {w: 720, h: 720, aspect: "1:1", shape: circle, max_mb: 4, note: {he: "מוצגת 176×176 במחשב"}}
      banner: {w: 1640, h: 624, aspect: "851:315", min: "400x150", safe_area: "640x312 center"}
    posts:
      - {id: text,  he: "טקסט", text_max: 63206}
      - {id: image, he: "תמונה", text_max: 63206, images_max: 10, aspects: ["1:1", "4:5", "1.91:1"]}
      - {id: video, he: "וידאו / ריל", text_max: 63206, aspects: ["9:16", "16:9", "1:1"]}
      - {id: link,  he: "קישור", text_max: 63206}
    ops:
      profile.get:           {api: "yes", browser: "yes"}
      profile.update.name:   {api: "no",  browser: "limited", why: {he: "שם עמוד משתנה רק בבקשה שפייסבוק מאשרת"}}
      profile.update.bio:    {api: "yes", browser: "yes"}
      profile.update.avatar: {api: "yes", browser: "yes"}
      profile.update.banner: {api: "yes", browser: "yes"}
      profile.update.links:  {api: "yes", browser: "yes"}
      profile.update.handle: {api: "no",  browser: "limited"}
      post.list:             {api: "yes", browser: "yes"}
      post.create.text:      {api: "yes", browser: "yes"}
      post.create.image:     {api: "yes", browser: "yes"}
      post.create.video:     {api: "yes", browser: "no", why: {he: "העלאת וידאו בדפדפן עוד לא נבנתה"}}
      post.update:           {api: "limited", browser: "yes", why: {he: "ב-API — רק פוסטים שאותה אפליקציה יצרה"}}
      post.delete:           {api: "yes", browser: "yes"}
      comment.list:          {api: "yes", browser: "limited"}
      comment.create:        {api: "yes", browser: "limited"}
      comment.delete:        {api: "yes", browser: "no"}
      reaction.create:       {api: "limited", browser: "limited"}
      insights.get:          {api: "yes", browser: "no"}
    urls:
      profile: "https://www.facebook.com/{handle}"
      profile_edit: "https://www.facebook.com/{handle}/about"
      compose: "https://www.facebook.com/"

  - id: instagram
    name: {he: "אינסטגרם", en: "Instagram"}
    color: "#d62976"
    monogram: "i"
    tos: {level: risk}
    origin: "https://www.instagram.com"
    kinds:
