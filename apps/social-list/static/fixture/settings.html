<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רשת בדיקה — הגדרות פרופיל</title>
<style>
  :root{--bg:#f0f2f5;--card:#fff;--ink:#1c1e21;--muted:#65676b;--line:#dddfe2;--accent:#6b4d9c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,"Noto Sans Hebrew",Arial,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:14px;align-items:center}
  header b{color:var(--accent);font-size:19px}
  header nav{margin-inline-start:auto;display:flex;gap:12px}
  header a{color:var(--muted);text-decoration:none;font-weight:600}
  main{max-width:560px;margin:18px auto;padding:0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
  input,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  textarea{min-height:80px}
  button{font:inherit;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:#e4e6eb;font-weight:600}
  button.primary{background:var(--accent);color:#fff}
  .pics{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .av{width:84px;height:84px;border-radius:50%;background:#e4e6eb;object-fit:cover}
  .bn{width:210px;height:70px;border-radius:8px;background:#e4e6eb;object-fit:cover}
  #saved{color:#0e9f6e;font-weight:700;margin-inline-start:10px}
</style>
</head>
<body>
<header><b>רשת בדיקה</b><nav><a href="./">פיד</a><a href="settings">הגדרות פרופיל</a></nav></header>
<main>
  <p style="color:#65676b;font-size:13px">הגדרות הפרופיל ברשת הבדיקה של הלשכה הדיגיטלית: שם, ביו, תמונת פרופיל ותמונת נושא —
    אותם שדות שכל רשת אמיתית מציעה, כדי לבדוק את העדכון מקצה לקצה.</p>
  <section class="card" aria-label="תמונות">
    <div class="pics">
      <img id="avatar" class="av" alt="תמונת פרופיל נוכחית">
      <button type="button" id="change-avatar">שינוי תמונת פרופיל · Change profile picture</button>
      <input type="file" id="avatar-file" accept="image/*" hidden>
    </div>
    <div class="pics" style="margin-top:12px">
      <img id="banner" class="bn" alt="תמונת נושא נוכחית">
      <button type="button" id="change-banner">שינוי תמונת נושא · Change cover photo</button>
      <input type="file" id="banner-file" accept="image/*" hidden>
    </div>
  </section>
  <form class="card" id="form" aria-label="פרטי פרופיל">
    <label for="name">שם · Name</label><input id="name" name="name" maxlength="50">
    <label for="bio">ביו · Bio</label><textarea id="bio" name="bio" maxlength="160"></textarea>
    <div style="margin-top:14px"><button type="submit" class="primary" id="save">שמירה · Save</button><span id="saved" role="status"></span></div>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
const api = (p, o) => fetch("api/" + p, Object.assign({headers: {"content-type": "application/json"}}, o || {})).then(r => r.json());
const rel = (u) => u ? u.replace(/^.*\/fixture\//, "") : "";
async function load() {
  const p = await api("profile");
  $("name").value = p.name || ""; $("bio").value = p.bio || "";
  $("avatar").src = rel(p.avatar_url); $("banner").src = rel(p.banner_url);
}
function picker(btn, input, field) {
  $(btn).onclick = () => $(input).click();
  $(input).onchange = async () => {
    const f = $(input).files[0]; if (!f) return;
    const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.readAsDataURL(f); });
    await api("profile", {method: "PATCH", body: JSON.stringify({[field]: {data_base64: b64, mime: f.type || "image/png"}})});
    $("saved").textContent = "התמונה עודכנה"; load();
  };
}
picker("change-avatar", "avatar-file", "avatar");
picker("change-banner", "banner-file", "banner");
$("form").onsubmit = async (e) => {
  e.preventDefault();
  await api("profile", {method: "PATCH", body: JSON.stringify({name: $("name").value, bio: $("bio").value})});
  $("saved").textContent = "נשמר · Saved"; load();
};
load();
</script>
</body>
</html>
