# telegram — one small container: an MTProto client for the owner's account, its listener, and the screen.
# No films, no ffmpeg (that is telegram-tv): a Telegram connection and a few HTTP routes, so 192M is headroom.
services:
  telegram:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/bina-solution/digital-office/telegram:${IMAGE_TAG:-latest}
    pull_policy: missing
    container_name: telegram-${DEPLOYMENT_NAME:-bina-deployment}
    hostname: telegram
    restart: unless-stopped
    environment:
      - DEPLOYMENT_NAME=${DEPLOYMENT_NAME:-bina-deployment}
      # the credential plane: the account (telegram_user) and the bot tokens (telegram_bot) live there, never here
      - CONNECTIONS_URL=${CONNECTIONS_URL:-http://connections:8990}
      # the office's event stream (flow.v1): this app writes dgo:flow:telegram
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TG_DATA_DIR=/data
      # the chat the office listens to from the first connection — the group the owner named (DGO-1300)
      - TELEGRAM_WATCH_DEFAULT=${TELEGRAM_WATCH_DEFAULT:-Bina Solutions Main|בינה פיתרונות ראשי}
      # the same public api pair telegram-tv uses unless the office sets its own
      - TG_DEFAULT_API_ID=${TV_DEFAULT_API_ID:-414329}
      - TG_DEFAULT_API_HASH=${TV_DEFAULT_API_HASH:-af17b872310e6467fcd3d0aa82dc0d56}
      - LOG_LEVEL=${TELEGRAM_LOG_LEVEL:-INFO}
    volumes:
      # which account is active, and which chats are listened to. Losing it loses two choices, not the login.
      - telegram_data:/data
      # the office's ONE flow.v1 publisher (DGO-1402) — the platform's file, never a copy of it here
      - ../../platform-base/redis/flowpub.py:/opt/dgo/flowpub.py:ro
    networks:
      - traefik-network
    healthcheck:
      # python, never curl: python:3.12-slim has no curl (gate G18)
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8984/healthz',timeout=8).status==200 else 1)"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.02'
          memory: 48M
    logging:
      driver: ${LOGGING_DRIVER:-json-file}
      options:
        max-size: 5m
        max-file: '3'

volumes:
  telegram_data:

networks:
  traefik-network:
    external: true
