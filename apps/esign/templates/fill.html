<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>{{ boot.event.title }} — מילוי וחתימה</title>
  {# what a chat app shows under the link: the document and who sent it, never a party's name or a value #}
  <meta property="og:title" content="{{ boot.event.title }}">
  <meta property="og:description" content="מסמך למילוי ולחתימה{% if office_name %} מ{{ office_name }}{% endif %}">
  <link rel="stylesheet" href="{{ url_for('public_css') }}">
  <link rel="stylesheet" href="{{ url_for('fill_css') }}">
</head>
<body>
<main id="fill" class="fill" aria-live="polite">
  <noscript><div class="card"><h2>{{ boot.event.title }}</h2>
    <p class="note">כדי למלא ולחתום צריך דפדפן שמריץ JavaScript. אפשר לפתוח את הקישור בדפדפן של הטלפון.</p></div></noscript>
</main>

</body>
</html>
