    - blog
    - website
    - email
    - x
    assets:
    - kind: text
      spec: report
      count: 1
    - kind: page
      spec: status page entry
      count: 1
    - kind: email
      spec: to affected users
      count: 1
    copy: what happened -> impact -> what we did -> what we will change
