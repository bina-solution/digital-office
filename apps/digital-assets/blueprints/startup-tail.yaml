phases:
- id: stealth
  name:
    he: לפני ההשקה — מתחת לרדאר
    en: Pre-launch / stealth
  order: 1
  window: D-180..D-60
  units:
  - id: holding-page
    name:
      he: עמוד המתנה עם הרשמה
      en: Holding page with email capture
    purpose: Claim the name/domain, collect early interest, create the first public trace every later asset links
      back to.
    trigger: Name and domain decided.
    timing: 'D-180..D-60 (Supabase: first archived capture D-78)'
    channels:
    - website
    - github
    - x
    assets:
    - kind: page
      spec: 'single section: logo, one-line promise, email field'
      count: 1
    - kind: image
      spec: og/link card 1200x630 (1.91:1)
      count: 1
    - kind: image
      spec: X header 1500x500 (3:1)
      count: 1
    - kind: image
      spec: GitHub social preview 1280x640 (2:1)
      count: 1
    copy: one-line promise -> who it is for -> 'get early access' email field -> (optional) who is building it
    examples:
    - supabase.io, first archived 2020-03-10, 78 days before the HN launch - https://web.archive.org/web/20200310080644/https://supabase.io/
    - diabrowser.com holding page at the Dia teaser, 2024-12-02 - https://news.ycombinator.com/item?id=42298063
    - Raycast AI waitlist page, 2023-02-22 - https://www.raycast.com/ai
  - id: founder-thesis-post
    name:
      he: מניפסט המייסדים
      en: Founder thesis / manifesto post
    purpose: Frame the problem and the worldview so the later reveal has a story and a vocabulary.
    trigger: Before or together with the first public announcement.
    timing: D-120..D0
    channels:
    - blog
    - x
    - linkedin
    - hackernews
    - email
    assets:
    - kind: text
      spec: article 800-1500 words
      count: 1
    - kind: image
      spec: hero 16:9 1600x900
      count: 1
    - kind: thread
      spec: 5-8 posts (X) / 1 long post (LinkedIn)
      count: 1
    copy: the broken status quo -> why now -> our principles -> what we are building (no full screenshots) -> join
      the waitlist
    examples:
    - 'Linear: ''Announcing Linear'' Medium post + tweet + waitlist, 2019-04 - https://review.firstround.com/linears-path-to-product-market-fit/'
    - Linear Method (practices for building), on HN 2020-09-16 - https://linear.app/method
    - 'Plausible: viral ''why you should stop using Google Analytics'' post, 2020-04 (listed in) - https://plausible.io/blog/open-source-saas'
- id: teaser
  name:
    he: טיזר
    en: Teaser
  order: 2
  window: D-200..D-3
  units:
  - id: teaser-video
    name:
      he: סרטון טיזר / הצצה
      en: Teaser / early-peek video
    purpose: Create curiosity (and recruit talent) without full disclosure.
    trigger: Product direction fixed; beta date within ~6 months.
    timing: 'D-190..D-30 (Dia: D-191)'
    channels:
    - youtube
    - x
    - linkedin
    - instagram
    - website
    assets:
    - kind: video
      spec: 16:9 1920x1080, 60-180 s
      count: 1
    - kind: video
      spec: 9:16 1080x1920 cut, <=60 s
      count: 1
    - kind: image
      spec: YouTube thumbnail 1280x720
      count: 1
    - kind: page
      spec: teaser landing with waitlist field
      count: 1
    copy: 'tension (what is wrong today) -> glimpse (fragments of UI, people, process) -> name + ''coming <season>''
      -> CTA: waitlist / we are hiring'
    examples:
    - 'Dia: ''An early peek at Dia, our second product | A recruiting video'', 2024-12-02 - https://youtu.be/C25g53PC5QQ'
    - TechCrunch coverage of the Dia teaser, 2024-12-02 - https://techcrunch.com/2024/12/02/the-browser-company-teases-dia-its-new-ai-browser/
    - Raycast AI waitlist page 77 days before Raycast Pro, 2023-02-22 - https://www.raycast.com/ai
  - id: save-the-date
    name:
      he: שמרו את התאריך / ספירה לאחור
      en: Save-the-date / countdown
    purpose: Lock a date in people's calendars and turn followers into reminders.
    trigger: Date of the launch, launch week or livestream fixed.
    timing: D-30..D-3 (Supabase LW1 announced D-4; HA State of the Open Home 2025 announced D-17)
    channels:
    - blog
    - x
    - linkedin
    - youtube
    - email
    - discord
    - whatsapp
    assets:
    - kind: image
      spec: 16:9 1600x900
      count: 1
    - kind: image
      spec: 1:1 1080x1080
      count: 1
    - kind: image
      spec: story 9:16 1080x1920
      count: 1
    - kind: livestream
      spec: scheduled YouTube premiere/live page ('Notify me')
      count: 1
    - kind: email
      spec: 600 px wide, one CTA
      count: 1
    copy: what (event name) -> when (date + time in 3 time zones) -> what you will get -> reminder CTA ('Notify
      me' / add to calendar)
    examples:
    - Supabase 'Launch week - Five days of Supabase', posted 2021-03-25 - https://supabase.com/blog/launch-week
    - Home Assistant 'Announcing State of the Open Home 2025', 2025-03-26 for 2025-04-12 - https://www.home-assistant.io/blog/2025/03/26/state-of-the-open-home-2025-announcement/
    - Home Assistant save-the-date post on X for State of the Open Home 2024 - https://x.com/home_assistant/status/1772744406615175341
  - id: teaser-drip
    name:
      he: טפטוף טיזרים ב-X
      en: Teaser drip on X
    purpose: Build curiosity for a week without naming the product.
    trigger: A reveal date is fixed.
    timing: D-7..D-1
    channels:
    - x
    - instagram
    - discord
    assets:
    - kind: image
      spec: 2160x2160 crop of the product, one per day
      count: 5
    - kind: text
      spec: 1-3 word lowercase post per day ('uh oh', 'we cooked')
      count: 5
    copy: cryptic line → cropped glimpse → (no name, no link) → the reveal lands on D0
    examples: []
    from: umbrel U1 (research/umbrel.md)
- id: waitlist
  name:
    he: רשימת המתנה / בטא סגורה
    en: Waitlist / invite-only beta
  order: 3
  window: D-460..D-1
  units:
  - id: waitlist-survey
    name:
      he: רשימת המתנה עם שאלון
      en: Waitlist with qualifying survey
    purpose: Measure demand, pick fitting early users, learn their problems in their words.
    trigger: Teaser or thesis published.
    timing: opens D-460..D-90, stays open until public launch
    channels:
    - website
    - email
    assets:
    - kind: page
      spec: 'form: email + 2-3 questions (use case, current tool, team size)'
      count: 1
    - kind: email
      spec: confirmation, 600 px, plain
      count: 1
    - kind: image
      spec: og/link card 1200x630
      count: 1
    copy: promise -> 'why do you want it / what is your current problem?' -> honest expectation (small weekly batches)
      -> share link
    examples:
    - 'Linear private beta: ~10,000 emails, ~10 hand-picked invites per week - https://review.firstround.com/linears-path-to-product-market-fit/'
    - Karri Saarinen on hand-picking waitlist invites - https://x.com/karrisaarinen/status/1785391264730669351
    - Arc drops its waitlist at 1.0, 2023-07-25 - https://9to5mac.com/2023/07/25/arc-browser-no-waitlist/
  - id: cohort-invite-email
    name:
      he: הזמנה למחזור בטא + עדכון גרסה
      en: Cohort invite + beta build note
    purpose: Onboard a small batch, open a feedback loop, ship a new build per cohort.
    trigger: New cohort selected.
    timing: recurring:weekly during the beta
    channels:
    - email
    - discord
    assets:
    - kind: email
      spec: personal plain-text invite from a founder
      count: 1
    - kind: text
      spec: beta release note (what changed since last cohort)
      count: 1
    copy: personal note -> what is new since the last cohort -> what we want feedback on -> how to reach us
    examples:
    - 'Linear: a new version for every weekly cohort of ~10 users - https://review.firstround.com/linears-path-to-product-market-fit/'
    - 'Arc: ~100 NDA testers before the public invite-only period - https://en.wikipedia.org/wiki/The_Browser_Company'
- id: launch-day
  name:
    he: יום ההשקה
    en: Reveal / launch day
  order: 4
  window: D0
  units:
  - id: launch-post
    name:
      he: פוסט ההשקה (העמוד המרכזי)
      en: Launch post (canonical)
    purpose: The one page every other channel links to.
    trigger: Product (or public beta) available to anyone.
    timing: D0, fixed hour (Supabase publishes at 08:00 PT)
    channels:
    - blog
    - website
    - email
    - x
    - linkedin
    - facebook
    - hackernews
    - producthunt
    assets:
    - kind: text
      spec: 600-1200 words
      count: 1
    - kind: image
      spec: hero 16:9 1600x900
      count: 1
    - kind: image
      spec: og/link card 1200x630
      count: 1
    - kind: animation
      spec: MP4/GIF product loop 5-15 s, 16:9
      count: 3
    - kind: email
      spec: announcement 600 px
      count: 1
    copy: hook (one-line promise) -> the problem -> what it is + 3 capabilities (one loop each) -> proof (users,
      numbers, quotes) -> availability & price -> CTA -> what is next
    examples:
    - Arc 1.0 available to everyone, 2023-07-25 - https://techcrunch.com/2023/07/25/arc-browser-is-now-available-to-download-for-everyone
    - Calendso rebrands to Cal.com and launches v1.0 - https://cal.com/blog/calendso-rebrands-to-cal-com
    - Linear public launch on HN, 2020-06-30 - https://news.ycombinator.com/item?id=23693029
  - id: launch-film
    name:
      he: סרט ההשקה
      en: Launch film
    purpose: The shareable 'what it feels like' asset.
    trigger: Launch day.
    timing: D0 (premiere at post time)
    channels:
    - youtube
    - x
    - linkedin
    - instagram
    - facebook
    - website
    - producthunt
    assets:
    - kind: video
      spec: 16:9 1920x1080, 60-120 s master
      count: 1
    - kind: video
      spec: 9:16 1080x1920 cut, <=60 s
      count: 1
    - kind: video
      spec: 1:1 1080x1080 cut, <=60 s
      count: 1
    - kind: image
      spec: thumbnail 1280x720
      count: 1
    - kind: text
      spec: subtitles he/en (SRT)
      count: 2
    copy: cold open on a real pain -> name + promise -> 3 moments of use -> availability -> CTA
    examples:
    - Dia 'Never Explain Yourself Again', 2025-06-11 - https://youtu.be/YVOw0TAO9ok
    - Arc Max film, 2023-10-03 - https://www.youtube.com/watch?v=y7koAGLf0EE
    - NuPhy x Raycast keyboard film, 2026-08-27 - https://youtu.be/73pdeHCGerA
  - id: hn-launch
    name:
      he: השקה ב-Hacker News
      en: Launch HN / Show HN post
    purpose: Reach developers and early adopters in an honest founder voice.
    trigger: 'Launch day (YC companies: ''Launch HN'').'
    timing: D0, US morning
    channels:
    - hackernews
    assets:
    - kind: text
      spec: title <=80 chars
      count: 1
    - kind: text
      spec: founder first comment 300-600 words
      count: 1
    copy: who we are -> the problem we hit ourselves -> what we built and how it differs -> open source / pricing
      -> ask for feedback
    examples:
    - Supabase (YC S20), 2020-05-27, 1,120 points - https://news.ycombinator.com/item?id=23319901
    - 'Launch HN: PostHog (YC W20), 2020-02-20 - https://news.ycombinator.com/item?id=22376732'
    - 'Calendso: an open source Calendly alternative, 2021-04-15 - https://news.ycombinator.com/item?id=26817795'
  - id: product-hunt-launch
    name:
      he: השקה ב-Product Hunt
      en: Product Hunt launch
    purpose: Badge and one-day spike of social proof; not a lasting channel.
    trigger: Launch or a major version.
    timing: D0 at 00:01 PT
    channels:
    - producthunt
    - x
    - linkedin
    - email
    assets:
    - kind: image
      spec: thumbnail 240x240 (GIF allowed)
      count: 1
    - kind: image
      spec: gallery 1270x760
      count: 5
    - kind: video
      spec: YouTube link of the launch film
      count: 1
    - kind: text
      spec: tagline <=60 chars + maker comment
      count: 1
    copy: tagline -> maker comment (story + launch offer) -> gallery, one image per capability
    examples:
    - 'Calendso on Product Hunt: 2,100+ upvotes (per Cal.com) - https://cal.com/blog/calendso-rebrands-to-cal-com'
    - 'Plausible on Product Hunt 2020-08: ''spike of hope followed by flat line'' - https://plausible.io/blog/open-source-saas'
    - Supabase includes Product Hunt in its launch playbook - https://supabase.com/blog/supabase-how-we-launch
  - id: social-launch-thread
    name:
      he: שרשור / קרוסלת השקה
      en: Native launch thread / carousel
    purpose: Tell the story in each network's native format instead of a bare link.
    trigger: Launch post live.
    timing: D0, +0..2 h after the post
    channels:
    - x
    - linkedin
    - instagram
    - facebook
    - discord
    - whatsapp
    assets:
    - kind: thread
      spec: X thread 5-10 posts
      count: 1
    - kind: image
      spec: 16:9 1600x900 per capability
      count: 4
    - kind: image
      spec: carousel 4:5 1080x1350 (Instagram) / PDF 1080x1350 (LinkedIn)
      count: 8
    - kind: text
      spec: Discord announcement + WhatsApp channel update
      count: 2
    copy: post 1 = hook + film -> one capability per post with a visual -> proof -> link -> credits/thanks
    examples:
    - '''Everything launched at Next.js Conf'' thread, 2022-10 - https://twitter.com/leeerob/status/1585349567410626560'
    - 'Supabase daily rhythm: 07:30 reminder tweet, 08:00 blog post - https://supabase.com/blog/supabase-how-we-launch'
  - id: feature-cards
    name:
      he: כרטיסי פיצ'רים (בנטו)
      en: Feature-card thread (bento)
    purpose: Explain the release one feature per card, as replies to the reveal.
    trigger: The reveal post is up.
    timing: D0, as replies to the reveal
    channels:
    - x
    - linkedin
    - instagram
    assets:
    - kind: image
      spec: 3200x2400 (4:3) card per feature
      count: 6
    - kind: image
      spec: 4:3 'bento' hero summarising all features
      count: 1
    copy: '''Introducing X.'' → one card per feature (headline + one line) → thanks to the community'
    examples: []
    from: umbrel U2/U3
  - id: founder-forum-post
    name:
      he: פוסט מייסד בפורום
      en: Founder post in the community forum
    purpose: Talk to the existing community directly, before the press does.
    trigger: The reveal is public.
    timing: D0
    channels:
    - discord
    - github
    - website
    assets:
    - kind: text
      spec: '''Hey everyone'' post: what, how to try the beta, what feedback we need, the date'
      count: 1
    copy: Hey everyone → the reveal link → how to try the beta → ask for feedback → date promise
    examples: []
    from: umbrel U7
- id: post-launch
  name:
    he: אחרי ההשקה
    en: 'Post-launch: postmortem and first big update'
  order: 5
  window: D+1..D+180
  units:
  - id: launch-postmortem
    name:
      he: סיכום ההשקה במספרים
      en: Launch postmortem / numbers post
    purpose: 'Convert the launch into trust: the numbers, what broke, what changed.'
    trigger: Launch spike settled.
    timing: 'D+30..D+60 (Supabase: D+44)'
    channels:
    - blog
    - hackernews
