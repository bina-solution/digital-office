id: startup-tail
version: 1
order: 2
name:
  he: זנב סטארט־אפ
  en: Startup tail
summary:
  he: סדרת המדיה שמוצר צעיר מפרסם כדי לחשוף את עצמו ואז את העדכונים שלו — 14 שלבים ו-59 יחידות מדיה, מחקר על umbrelOS,
    n8n, Notion ועוד עשר חברות
  en: The media series a young product publishes to reveal itself and then its updates — derived from umbrelOS,
    n8n, Notion and ten more companies
extends:
- business-basic
sources:
- research/startup-patterns.md
- research/umbrel.md
- research/n8n.md
- research/notion.md
