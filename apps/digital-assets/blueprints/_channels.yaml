# The channel catalogue every blueprint draws from — where a business can appear.
#
#   social    automatable through the `social` capability (social-list): the channel is bound to one
#             of social-list's accounts — the office browser on every network, or the network's API —
#             and profile fields and posts go out through it
#   website   automatable through the `sites` capability: slots map to `data-da` keys in the pages
#   listing   a directory/marketplace page the owner updates by hand today (Google Business Profile,
#             Wolt, …) — the app tracks WHAT must change there and marks it done
#   print     a physical or document surface (signage, invoices, business cards) — files to produce
#
# `core: true` = the eight channels the app always shows (the owner's list: YouTube, GitHub, website,
# Facebook, Instagram, X, Discord, WhatsApp), whichever blueprint is applied.
channels:
  - {id: website,   kind: website, core: true, he: "אתר",        en: "Website"}
  - {id: facebook,  kind: social,  core: true, he: "פייסבוק",    en: "Facebook",  platform: facebook}
  - {id: instagram, kind: social,  core: true, he: "אינסטגרם",   en: "Instagram", platform: instagram}
  - {id: x,         kind: social,  core: true, he: "X",          en: "X",         platform: x}
  - {id: youtube,   kind: social,  core: true, he: "יוטיוב",     en: "YouTube",   platform: youtube}
  - {id: github,    kind: social,  core: true, he: "גיטהאב",     en: "GitHub",    platform: github}
  - {id: discord,   kind: social,  core: true, he: "דיסקורד",    en: "Discord",   platform: discord}
  - {id: whatsapp,  kind: social,  core: true, he: "וואטסאפ",    en: "WhatsApp",  platform: whatsapp}
  # not in social-list's catalogue yet (no office-browser script) — tracked by hand until they are
