# content-library — the SEO content of DGO as an editorial plan (DGO-819, DGO-685), hand-written.
#
# One `library:` entry per item and language; applying the blueprint makes each a richtext slot
# `content.<type>.<slug>.<lang>` (the plan — written or not yet), and a WRITTEN body,
# `content/<type>/<slug>.<lang>.md` beside this file (front matter + markdown), a DRAFT version of
# it — once per content of the file, never the active one (blueprints.seed_library). The voice, the
# five types and the checklist are ai/context/seo/style-guide.md's; every fact about DGO is
# ai/context/seo/facts.yaml's. `refs` names the work item each entry delivers (plans/seo.yaml keys:
# seo-003 → DGO-662, seo-302…336 → DGO-692…726, seo-501… → DGO-749…, seo-601… → DGO-766…,
# seo-701… → DGO-782…, seo-1001… → DGO-809…). Hebrew first: an `en` entry is added beside its `he`
# one, same slug, once the Hebrew passed its review (DGO-664).
#
# Slugs are latin on purpose: they are slot keys (`[a-z0-9-]`) and URL paths (DGO-679), and a
# Hebrew path is percent-encoded into something nobody can read or type.
#
# ספריית התוכן — the parent of every content type (article, project, tutorial, comparison, directory,
# news, report, post, glossary).
#
# Why content lives here and not in the site: a piece of writing is an asset like a logo. It has
# versions, one of them is the active one, and the active one is what every channel shows. The site
# reads it from the bundle, social posts point at it, and the office agent can draft the next version.
# So each piece is ONE SLOT, `content.<type>.<slug>-<lang>` (kind richtext). Its versions are the
# drafts and revisions; meta carries the front matter (title, SEO fields, sources, FAQ, project facts).
#
# The pieces themselves are written as files under apps/digital-assets/content/<type>/<slug>.<lang>.md
# (the writer's brief: content/BRIEF.md; the facts every piece may state: content/FACTS.md). They are
# imported by `./bbox digital-assets content`, which applies the type's blueprint and creates each
# piece's slot under it (the slot's source names the type). A blueprint therefore declares the TYPE —
# its hub, its shape and its rules — and never lists the pieces: a new article needs no new image.
#
# Conventions every type follows:
#   * `content.<type>.<slug>-he` / `-en` — Hebrew first; English is a separate slot, as names are.
#   * `content.<type>.hub-he` — the opening text of the type's hub page on the site.
#   * targets: website + google-search — the bundle the `sites` app serves, and what search shows.
#
# TWO DESIGNS MET HERE (the release merge, DGO-969). This file is both the PARENT of the nine type
# blueprints (content-<type>.yaml, `bbox digital-assets content`, slots `content.<type>.<slug>-<lang>`)
# and the EDITORIAL PLAN (`library:`, blueprints.seed_library, slots `content.<type>.<slug>.<lang>`).
# The two name the same written piece with two different keys — the content lane picks one (DGO-819).

id: content-library
version: 1
order: 6
name: {he: ספריית התוכן, en: Content library}
summary:
  he: 'כל התוכן של DGO כתוכנית עריכה — מאמרים, מדריכים, פוסטים, חדשות ודוחות. כל פריט הוא משבצת, וכל גוף שנכתב נכנס אליה כטיוטה.'
  en: 'All of DGO''s content as an editorial plan — articles, tutorials, posts, news and reports. Each item is a slot; each written body lands in it as a draft.'
sources: [DGO-819, DGO-685, DGO-690, DGO-727, ai/context/seo/style-guide.md, apps/digital-assets/content/BRIEF.md,
          apps/digital-assets/content/FACTS.md]

slots:
- key: content.library.byline-he
  section: content
  group: library
  kind: text
  lang: he
  label:
    he: שורת הכותב
    en: Byline (Hebrew)
  constraints:
    note: the author line every piece carries when it names no other — «צוות בינה סולושנס»
  targets:
  - channel: website
- key: content.library.hub-he
  section: content
  group: library
  kind: richtext
  lang: he
  label:
    he: פתיח ספריית התוכן
    en: Content library — opening text
  constraints:
    note: 60–120 words — what the reader finds here, in the author's voice
  targets:
  - channel: website
  - channel: google-search

