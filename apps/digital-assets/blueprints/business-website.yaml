# אתר תדמית לעסק / לחברת שירותים
#
# The pattern for a COMPANY'S OWN SITE — the site that sells the business itself rather than a
# product: who we are, what we do, the work we have done, how we work, and how to reach us, plus the
# legal pages a business site is expected to have (privacy, terms, accessibility).
#
# Its identity is the COMPANY's (`identity.name.*`, `identity.logo.*`, `identity.contact.*`) — the
# slots `business-basic` already defines, given a website target so the site can read them. A
# product of that company keeps its own identity in `startup-website` (`identity.product.*`), which
# is what lets one business run both sites from one assets screen without the two fighting over a
# value.
#
# Conventions (same as `startup-website`): `content.website.business.<page>.<part>` where `<page>` is the
# page's own name in the URL and `<part>` is `title` (the <title>/SEO title), `heading` (the page's
# first heading) or `intro` (the opening paragraph). `targets: [website]` is what publishes a slot
# into the bundle the `sites` app serves.
id: business-website
version: 1
order: 5
name:
  he: אתר תדמית לעסק
  en: Business website
summary:
  he: אתר התדמית של העסק עצמו — מי אנחנו, מה אנחנו עושים, העבודות שעשינו, איך עובדים איתנו ואיך
    יוצרים קשר, עם עמודי המדיניות שהאתר חייב. הזהות היא של החברה, בנפרד מזהות המוצרים שלה.
  en: The business's own site — who we are, what we do, the work we have done, how we work together
    and how to reach us, with the legal pages a business site needs. The identity is the COMPANY's,
    kept apart from its products'.
# What it LINKS rather than repeats: the company's name, logo, tagline, descriptions, contacts and
# hours are `business-basic`'s slots, and this pattern only gives them a WEBSITE target by inheriting
# them. One business, one place those facts live — the logo and the general data stay in the basic
# blueprint, exactly as they are for every other channel.
extends:
- business-basic
slots:

# ── the company's identity: inherited from `business-basic`, nothing to redeclare here ───────────
# ── the home page ────────────────────────────────────────────────────────────────────────────────
- key: content.website.business.home.hero
  section: content
  group: home
  kind: text
  label:
    he: כותרת הגיבור
    en: Hero headline
  required: true
  targets:
  - channel: website
- key: content.website.business.home.subtitle
  section: content
  group: home
  kind: richtext
  label:
    he: תת־כותרת דף הבית
    en: Home subtitle
  targets:
  - channel: website
- key: content.website.business.cta
  section: content
  group: home
  kind: text
  label:
    he: כפתור הפעולה הראשי
    en: Primary call to action
  targets:
  - channel: website
- key: content.website.business.home.about-heading
  section: content
  group: home
  kind: text
  label:
    he: כותרת „מי אנחנו” בדף הבית
    en: Home — about heading
  targets:
  - channel: website
- key: content.website.business.home.services-heading
  section: content
  group: home
  kind: text
  label:
    he: כותרת „הפתרונות שלנו”
    en: Home — services heading
  targets:
