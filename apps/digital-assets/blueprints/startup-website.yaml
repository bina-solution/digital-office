# אתר תדמית לסטארט־אפ / למוצר
#
# The pattern for a YOUNG PRODUCT'S OWN SITE: one long landing page that explains the problem, the
# product, how to start and what it costs, plus the handful of pages a product site cannot do
# without (features, apps/what's inside, pricing, demo, docs, about, vision, licence, community).
#
# Why this is a blueprint and not a folder of HTML: the owner edits TEXT from the assets screen.
# Every slot here is a place on that site whose value the assets app owns, and the site reads it by
# `data-da` — the mapping is declared once, and from then on a change is a version + an activate.
#
# It is deliberately separate from `business-website`: a product site speaks in the PRODUCT's voice
# (`identity.product.*`), and the company behind it keeps its own identity for its own site. Where
# one business runs both, both blueprints are applied — and the two never fight over one slot.
#
# Conventions every slot follows:
#   * `content.website.startup.<page>.<part>` — `<page>` is the page's own name in the site's URL, so a slot
#     can be found from the address bar; `<part>` is `title` (the <title>/SEO title), `heading` (the
#     page's first heading), `intro` (the opening paragraph) or a named block of the page.
#   * `targets: [website]` — the slot is published in the bundle the `sites` app serves, which is
#     what makes `data-da` see it. A slot with no target stays out of the bundle on purpose.
id: startup-website
version: 1
order: 4
name:
  he: אתר תדמית לסטארט־אפ
  en: Startup marketing site
summary:
  he: אתר תדמית של מוצר צעיר — עמוד נחיתה אחד שמסביר את הבעיה, המוצר, ההתחלה והמחיר, ועמודי יכולות,
    אפליקציות, תמחור, הדגמה, תיעוד, אודות, חזון, רישיון וקהילה. הזהות היא של המוצר, בנפרד מהחברה שמאחוריו.
  en: A young product's marketing site — one landing page (problem, product, getting started, price)
    plus features, apps, pricing, demo, docs, about, vision, licence and community. The identity is
    the PRODUCT's, kept apart from the company behind it.
# What it LINKS rather than repeats: the product's identity and the business's general data are
# already defined by the blueprints that own them — `startup-tail` (which itself extends
# `business-basic`) holds `identity.product.name` and `identity.product.one-liner`, and
# `business-basic` holds the company's name, logo, tagline and contacts. Extending is what keeps one
# fact in one place: the assets screen shows those slots once, with the value the business already has.
extends:
- startup-tail
slots:
- key: identity.product.tagline
  section: identity
  group: product
  kind: text
  label:
    he: סלוגן המוצר
    en: Product tagline
  constraints:
    note: the short line under the wordmark, in the site's header and footer — one value for both
  targets:
  - channel: website
- key: identity.product.description
  section: identity
  group: product
  kind: richtext
  label:
    he: תיאור המוצר
    en: Product description
  targets:
  - channel: website
- key: identity.product.logo
  section: identity
  group: product
  kind: image
  label:
    he: לוגו המוצר
    en: Product logo
  targets:
  - channel: website
  - channel: brand
    brand: product

