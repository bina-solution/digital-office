# apps/digital-assets/content/assignments.yaml — every piece the content library is to hold, as data.
#
# One entry per piece: `type/slug` (= the file content/<type>/<slug>.he.md and the slot
# content.<type>.<slug>-he), the work item it answers (plane), a working Hebrew title, and the angle the
# writer must cover. Writers follow content/BRIEF.md and content/FACTS.md. The SEO plan the pieces come
# from is apps/project-pln/plans/seo.yaml (modules «SEO · 3…7», items DGO-660…818).
#
# `status` on a project names its DGO status from FACTS.md: live | inside-app | planned.
# A piece that is written is a file; this list is what is still to write as much as what was asked.

