    description: |
      מה נדרש: 6eb0c9f0 moved the central blueprint apps/n8n/workflows -> apps/n8n/blueprint/n8n and pointed the hooks' WF_DIR there. apps/n8n/docker-compose.yml still binds `./workflows:/home/node/workflows` in three services (lines 337, 783, 1095), and hooks/pull exports INSIDE the container to C_WF=/home/node/workflows (line 31, `n8n export:workflow --backup --output ${C_WF}`) and then looks for the files on the host in WF_DIR - which was the same directory only while the bind named it. The directory the bind names is no longer in the tree, so on an office that runs n8n the next `up` has the engine create an empty apps/n8n/workflows, a pull's export lands there, and the hook finds nothing in WF_DIR. G26 (data-volumes-lint) names it on the tree since that commit: «n8n  stateful bind  ./workflows». The old path is also named by scripts/highload-inject.py:95, scripts/highload-inject-links.py:120 and ai/context/n8n-cli.md:31. NOT seen running: n8n is disabled on the HP office (platform.state.yaml), so this is read from the files and from the gate, not from a failed pull.
      קבלה: the three binds name the directory the hooks read; G26 passes on the tree; on an office that runs n8n, `./bbox n8n pull` leaves its export in apps/n8n/blueprint/n8n and no apps/n8n/workflows appears.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-09 — נמצא כש-G26 נכשל על העץ אחרי 6eb0c9f0 (core-001 שלב 2, DGO-477). הקבצים של הסשן שמעביר את n8n; לא נגעתי בהם.
