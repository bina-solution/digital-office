# apps/project-pln/plans/office.yaml — everything that is open in the digital office, as data,
# rendered into Plane by `./bbox project-pln plan office` (hooks/plan → plan.py; upsert, never delete).
#
# THE HUB. The owner's order of 2026-10-06: Plane is where the development is managed from, and the
# project «הלשכה הדיגיטלית» holds every open task. That project is DGO — declared by dgo-dev.yaml
# (the DGO Extend roadmap, phases p0…rel); this file ADDS to it (`project: { identifier: DGO }`), so
# there is one project, one numbering and no item twice. Apply dgo-dev first, then this.
#
# WHERE THE ITEMS CAME FROM (extracted 2026-10-06, each item says its own source):
#   · the owner's messages in every Claude Code session on hp-laptop, 2026-07-07 → 10-05
#     (5,876 turns, 2,275 distinct after de-duplication);
#   · his messages to the office agent on the MacBook, 2026-09-17 → 10-06 (638 turns in 152
#     conversations, 275 distinct) and to the agent on hp-laptop (4);
#   · the open files under issues/ — one work item per file, the file stays the full record;
#   · what the hp-laptop session itself found and did not finish.
# An ask that was found DONE in the repository is not here. Repeats of one ask are one item that
# says how many times it was said. His standing rules are one item (the first of «תיעוד»).
#
# LABELS. בעלים — only the owner can do it. HP — the hp-laptop office's lane (Claude Code).
# `assignee: azaria` — the MacBook office's lane. באג — backed by an issue file with measurements.
# Keys (eng-001, idx-014, …) are stable identities: rename freely, never re-key, never reuse.
# This file was scaffolded once from the extraction and is edited by hand from here on.

project: { identifier: DGO }

defaults:
  assignee: ""            # nobody by default: an item is taken (`tasks take`) by whoever does it

people:
  azaria: { vault: plane_local_api_token-azaria }

labels:
  - { name: בעלים,   color: "#ef4444" }
  - { name: אבטחה,   color: "#0ea5e9" }
  - { name: ממשק,    color: "#16a34a" }
  - { name: cli,     color: "#64748b" }
  - { name: תשתית,   color: "#a16207" }
  - { name: plane,   color: "#1d4ed8" }
  - { name: כבד,     color: "#f59e0b" }
  - { name: באג,     color: "#dc2626" }   # an issue file: a defect with its measurements
  - { name: indox,   color: "#7c3aed" }
  - { name: n8n,     color: "#ea580c" }
  - { name: HP,      color: "#0f766e" }   # the hp-laptop office's lane

modules:
- key: o-owner
  name: של הבעלים · החלטות, כניסות ופעולות
  status: backlog
  description: 'מה שרק הבעלים יכול: החלטה, סיסמה, מכונה פיזית, שרת הייצור. הסוכנים מכינים; כאן מחכים לו.'
  items:
  - key: own-001
    name: להחליף את ה-PAT של GitHub שנחשף בשיחה
    priority: urgent
    labels:
    - אבטחה
    - בעלים
    description: |
      מה נדרש: A GitHub personal access token was printed in an agent conversation. Rotate it in GitHub and update wherever it is stored.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-04 עד 10-06
  - key: own-002
    name: 'הרץ את הענף על המכונה הניידת: clone נקי, bbox run, indox test ו-CI'
    priority: high
    labels:
    - תשתית
    - בעלים
    description: |
      מה נדרש: On the portable machine: fresh clone, bbox run, ./bbox indox test and a full manual CI, reporting an existing workspace versus a new clone; a clean clone must give the full INDOX solution exactly as on the owner's machine. Missing: a clean-box bbox run (authentik race open, container egress/DNS needing sudo).
      בלשון הבעלים: «your job is to run the latest platform-os--indox-final on portable machone» · «it alwase ran perfectly i dont understand why you keep saying we need root»
      נאמר: 2026-08-21 עד 2026-08-24, 20 פעמים.
      מצב (חלקי): issues/release-readiness-20260821.md: 14 images built, indox push and seed ok, bbox run rc=1 (authentik cold-start race, container egress/DNS); portable branch merged ff36b032
      מקור: סשנים של Claude Code (claude-06#44)
  - key: own-003
    name: 'Plane: חשבון ''Admin User'' (ci@local.dev) עם מפתח office-agent פעיל — להסיר'
    priority: high
    labels:
    - אבטחה
    - plane
    - בעלים
    description: |
      מה נדרש: The instance that moved in carries a placeholder account ci@local.dev with a live API token labelled office-agent and a soft-deleted administrator row. Decide: delete the token and deactivate the account, after checking nothing uses that token.
      בלשון הבעלים: «bbb ו-ci@local.dev — לא נוגעים (הבעלים)»
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-04 עד 10-06
  - key: own-004
    name: 'hp-laptop: N8N_ENCRYPTION_KEY ב-.env אינו תואם ל-blueprint'
    priority: high
    labels:
    - בעלים
    description: |
      מה נדרש: The HP's .env key differs from the one the committed credential blobs are encrypted under (scripts/env-consistency-check.py). Decide which key wins before any n8n push on this office.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-04 עד 10-06
  - key: own-005
    name: למזג את dgo-pair לתוך dgo
    priority: high
    labels:
    - בעלים
    description: |
      מה נדרש: All pairing work lives on `dgo-pair`; vps1 (production) runs `dgo`. The merge and the deploy are the owner's call.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-04 עד 10-06
  - key: own-006
    name: 'hp-laptop: כניסה אחת של הבעלים — הדפדפן מנותק מכל הכתובות'
    priority: high
    labels:
    - בעלים
    description: |
      מה נדרש: Every gated host of hp-laptop answers 302 to the provider for the owner's browser (2026-10-06). One sign-in at console.localhost; the Plane window then signs itself in on its own host (ui2-012) and asks only for Plane's own password (pln-011 removes that too).
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-04 עד 10-06
  - key: own-007
    name: קצר את ריצת ה-INDOX E2E המלאה ב-GitHub Actions ל-5 דקות לכל היותר
    priority: medium
    labels:
    - תשתית
    - בעלים
    description: |
      מה נדרש: Target: full INDOX E2E (bring-up + battery) done in 5 minutes or less on the standard runner, twice in a row. Measured floor is ~8-9 min because the gdoc suite's real Tesseract OCR dominates and OCR caching was ruled out. A 5-min gate (doc_base+bs+pipeline) with gdoc in a heavier lane is possible but needs the owner's ruling on gate vs full battery.
      בלשון הבעלים: «the full github action indox e2e max 5 min, how can it be achived ?»
      נאמר: 2026-07-07 עד 2026-07-08, 3 פעמים.
      מצב (חלקי): ai/context/release-endgame-backlog.md: battery ~16 min on 2 vCPU, setup ~4.5 min after prebake; 'full battery under 5 min not achievable without caching OCR'; a 5-min gate needs a ruling
      מקור: סשנים של Claude Code (claude-01#4)
  - key: own-008
    name: הטמע חתימה אלקטרונית מאושרת (certified) על מסמכים ממוחשבים
    priority: medium
    labels:
    - בעלים
    description: |
      מה נדרש: A computerized original is legal only with a certified e-signature (Electronic Signature Law). The signing code exists; what is missing is a certificate from an approved CA loaded into the deployment, plus whatever else the owner meant by 'etc' in the legal layer.
      בלשון הבעלים: «and of course do 1. Certified e-signature, and 2, etc»
      נאמר: 2026-07-08 עד 2026-07-08, 1 פעמים.
      מצב (חלקי): apps/apitools/src/doc_data/signing.py signs PDFs (CMS/PKCS#7) but uses a dev self-signed NON-CERTIFIED cert unless SIGN_CERT_P12 + SIGN_CERT_CERTIFIED=true are provided
      מקור: סשנים של Claude Code (claude-01#16)
  - key: own-009
    name: הוסף או עדכן בטבלת החברות את החברות החסרות כדי לפתור MISSING_COMPANY_ID
    priority: medium
    labels:
    - indox
    - בעלים
    description: |
      מה נדרש: Group the MISSING_COMPANY_ID and UNKNOWN_COMPANY documents by company from their OCR and add or update companies so they resolve (UNKNOWN_COMPANY was verified to mean a company id that is not in the table). The coverage report now exists as a real file with 353 candidates; whether the owner approved and inserted them was not found.
      בלשון הבעלים: «i want you to spwan sonnet subagent that gos thru all missing/unkwown companies full doc ocr and groupes them into lists of companies we need to add (or update)» · «cause all the documents or hacohens the hole point is figuring the other company»
      נאמר: 2026-08-06 עד 2026-08-17, 7 פעמים.
      מצב (חלקי): apps/indox/reports/companies-coverage-2026-08-17.md: 353 add-candidates (586 docs), +493 docs resolvable; NEXT.md: owner review, not auto-inserted; no applied insert found
      מקור: סשנים של Claude Code (claude-05#44)
  - key: own-010
    name: הוסף ודאות חילוץ קבועה לחברה (רשימת ספקים עם אחוז ודאות גבוה) והפעל אותה
    priority: medium
    labels:
    - indox
    - בעלים
    description: |
      מה נדרש: Bring back the gsheet-era table of suppliers with a fixed high extraction certainty (for example 90%) as a column on companies and use it in selection. Code and UI exist and are proven with seeded companies; what remains is loading the real supplier list, which only the owner holds.
      בלשון הבעלים: «it should be added as a coulmn in companies table and used properly in the right place»
      נאמר: 2026-09-01 עד 2026-09-01, 1 פעמים.
      מצב (חלקי): companies.SELECTION_CERTAINTY (schema.sql:505), max(computed,fixed) in SelectType01, editable in SettingsPage; 0 of 1,180 companies carry a value (RELEASE-DECISIONS §6 q3)
      מקור: סשנים של Claude Code (claude-09#19)
  - key: own-011
    name: טבע ערכים חדשים לשני הסודות של browser42 ב-vps1 ואמת 401 לטוקן הישן
    priority: medium
    labels:
    - אבטחה
    - בעלים
    description: |
      מה נדרש: Two browser42 secrets were printed into a transcript and rotated on the Mac. If vps1's .env held the old values: mint fresh ones there (never copy from the Mac), recreate their holders (browser42-mcp, browser42-caddy, connections, domains, social-list as declared) and verify that vps1's b42 caddy answers 401 to the old token; record it under DGO-6. The live .env on vps1 cannot be inspected from here and no record of the check exists.
      בלשון הבעלים: «שני סודות של browser42 (BROWSER42_STATE_PASSPHRASE, BROWSER42_MCP_TOKEN) הודפסו היום לתמליל ורוטטו ב-Mac (22:44)»
      נאמר: 2026-09-30 עד 2026-09-30, 1 פעמים.
      מצב (פתוח): p0-6; no record of the rotation or of the 401 check in converge.py, ai/context or issues. By design converge.py:594 step_env mints vps1's .env on vps1 (scripts/ci-env.sh)
      מקור: שיחות עם עזריה בלשכת המק (mac-02#16)
    assignee: azaria
  - key: own-012
    name: אפשר גישת מחשב ל-HP דרך הקישור בין הלשכות, בלי שרת SSH
    priority: medium
    labels:
    - בעלים
    description: |
      מה נדרש: After two offices are paired, the main office should reach the other machine (what `computers` gives over SSH: commands, status, files) through the link itself. Today apps can be placed or moved on a paired office through its own app-management, but there is no machine or shell access to a paired office, and the HP has no sshd by the owner's decision. The mechanism still needs the owner's choice.
      בלשון הבעלים: «וגישת המחשב ל-HP מגיעה דרך הקישור»
      נאמר: 2026-10-04 עד 2026-10-04, 1 פעמים.
      מצב (פתוח): ai/context/dgo-pairing-contract.md:4 states the direction; apps/computers/app.py reaches machines only over SSH with the office key and has no door for a `kind: paired` office
      מקור: שיחות עם עזריה בלשכת המק (mac-02#47)
  - key: own-013
    name: הרץ בטרמינל של המק ./bbox engine forwards --apply ואחריו doctor, ואז צמד מחדש כשהמק מאזין
    priority: medium
    labels:
    - תשתית
    - בעלים
    description: |
      מה נדרש: Only the owner can do it: the command stops the Lima guest the Mac office and its agent live in, and macOS may ask for incoming-connection consent. Done when `./bbox engine doctor` shows instance declared · guest listening · Mac socket held, the Mac's .env no longer says DGO_WG_DIAL_ONLY=engine-guest, and a new pair made with the Mac as the dialed side connects.
      בלשון הבעלים: «מה שנשאר ומחכה לבעלים בטרמינל של המק: ./bbox engine forwards --apply ואחריו doctor, ואז צימוד חדש בכיוון שבו המק מאזין.»
      נאמר: 2026-10-05 עד 2026-10-05, 3 פעמים.
      מצב (פתוח): The step is documented in dgo-pairing-contract.md:233-244 and packaging/macos.md:134-135; no commit or proof since 5b84d714 records it run, nor a new pair with the Mac listening
      מקור: שיחות עם עזריה בלשכת המק (mac-03#14)
  - key: own-014
    name: 'הפוך לשכה ב-Windows במצב NAT לנגישה לחיוג: bbox.cmd dialable (WSL mirrored אחרי YES)'
    priority: medium
    labels:
    - תשתית
    - בעלים
    description: |
      מה נדרש: A verb that writes networkingMode=mirrored into the user's .wslconfig and restarts WSL after a typed YES (-Check, -Undo, -SelfTest). Only the editing rules and a scratch apply/undo were measured; the real restart never ran (the HP is already mirrored and hosts other stacks). Done when it runs on a Windows machine that starts in NAT and that office then pairs as the dialed side.
      בלשון הבעלים: «bbox.cmd dialable ל-Windows (מעביר את WSL ל-mirrored אחרי YES מוקלד»
      נאמר: 2026-10-05 עד 2026-10-05, 2 פעמים.
      מצב (חלקי): a1f66aca; scripts/windows/wsl-mirrored.ps1; dgo-pairing-contract.md:172 'The restart itself was not executed on the machine it was written on'
      מקור: שיחות עם עזריה בלשכת המק (mac-03#15)
  - key: own-015
    name: שדרג את vps1 למקמפל החדש, ואז הסר את ה-host הריק של בינה ואת רשימת ה-trusted hosts במק
    priority: medium
    labels:
    - בעלים
    description: |
      מה נדרש: A workaround left in place on purpose: the Mac publishes its agent with no host because vps1 still runs the old compiler (Host rewritten without Origin; also the old control door). Done when vps1 runs the current code, the Mac's catalog names bina's host, the hand-kept trusted-hosts entries are removed, and the tile still opens from the HP and from vps1.
      בלשון הבעלים: «אל תסיר עדיין את ה-host הריק: vps1 מריץ את המקמפל הישן, שכותב Host בלי Origin, והבינה שלך שם תקבל 403.»
      נאמר: 2026-10-05 עד 2026-10-05, 1 פעמים.
      מצב (פתוח): platform.state.yaml remote.macbook: bina-ds is published with no host (every other app has one); contract §C2.2: an app with NO host needs BINA_DS_TRUSTED_HOSTS on the serving office
      מקור: שיחות עם עזריה בלשכת המק (mac-03#22)
    assignee: azaria
  - key: own-016
    name: היכנס פעם אחת מהדפדפן של המק לכתובת המקוננת, כדי שהבינה של ה-HP תיפתח בקונסול של המק
    priority: medium
    labels:
    - אבטחה
    - בעלים
    description: |
      מה נדרש: Mirror direction of the fixed tile: the serving half is measured on the HP (Host + Origin of bina.localhost → 200), but nobody has seen the HP's agent open inside the Mac console. It needs the owner's own sign-in at the nested address in the Mac's browser (agents do not type passwords). Done when a screenshot from the Mac shows the HP's conversations in that tile.
      בלשון הבעלים: «הבינה שלי תיפתח אצלך בלי שום הצהרת trusted hosts אצלי, אחרי כניסה אחת של הבעלים בכתובת המקוננת מהדפדפן של המק»
      נאמר: 2026-10-05 עד 2026-10-05, 1 פעמים.
      מצב (פתוח): plane/from-the-mac/desktop-bina-remote.png (10-06): the tile «בינה ודעת · HP» shows only the 'open the office by its name' notice; no Mac-side proof of it open
      מקור: שיחות עם עזריה בלשכת המק (mac-03#29)
  - key: own-017
    name: 'הפעל קליטת דואר נכנס ב-VPS: הסר את חסימת פורט 25 של Hostinger והשלם TLS'
    priority: medium
    labels:
    - בעלים
    description: |
      מה נדרש: Inbound SMTP must reach the VPS mail server so a company mailbox receives mail from the internet. Hostinger blocks port 25 at its edge (account-level default), so the account holder must request lifting it; 587/993 also need a valid TLS cert for the mail host. Done when an external sender's mail lands in admin@<company> on the VPS.
      בלשון הבעלים: «inbound is most importent part it must work.. hostinger say themselfves that mail server is supported make sure you get it right and its working»
      נאמר: 2026-07-28 עד 2026-07-28, 4 פעמים.
      מצב (פתוח): platform-os-release-plan.md G7.2: private mail inbound/outbound unverified since 2026-07-28; the Hostinger port-25 ticket was never confirmed filed or resolved; GO-LIVE.md section 8.5 certificates
      מקור: סשנים של Claude Code (claude-02#10)
  - key: own-018
    name: 'אשר את תבנית הכתובות של כל חברה: console.חברה ו-admin.חברה@ מתוך BUSINESS_NAME'
    priority: medium
    labels:
    - תשתית
    - בעלים
    description: |
      מה נדרש: Hostnames and mail addresses derive from the existing BUSINESS_NAME and always follow one pattern. Hosts are console.<company>.digital-office.co.il, but mail was built as admin@<company>.digital-office.co.il (company in the domain) while the owner wrote admin.<company>@digital-office.co.il. The owner must accept the domain-based form or change it.
      בלשון הבעלים: «alwase keep this pattern where only staging is replaced with company name (eg console.hacohen.digital-office.co.il || person115@example.com )»
      נאמר: 2026-07-29 עד 2026-07-29, 2 פעמים.
      מצב (חלקי): reconcile.py sync_identity derives hosts from BUSINESS_NAME; mail is admin@<slug>.digital-office.co.il (mail-multi-tenant.md rejects admin.<slug>@: MX is per domain), unlike the ask
      מקור: סשנים של Claude Code (claude-02#13)
  - key: own-019
    name: המר את שכבות 1-2 לבינאריים נייטיב עם dockerd מוטמע ותמיכה בקומפוז לשכבה 3
    priority: medium
    labels:
    - תשתית
    - בעלים
    description: |
      מה נדרש: Layers 1 and 2 run as native processes (no images) while layer 3 accepts both docker-compose apps and native apps, with dockerd embedded, so the platform becomes its own Docker Desktop. Needs a decision on replacing authentik, then a per-service migration keeping behaviour identical and declarative.
      בלשון הבעלים: «ok i like the idea but we really need to think this throw, and plan the full path to any os executable + the layer 1/2 become binary.»
      נאמר: 2026-07-28 עד 2026-07-29, 6 פעמים.
      מצב (פתוח): packaging/native-plan.md + OPTIMISATION.md written (07-28/29); ROADMAP Phase 3: authentik has no non-Docker install, replacement choice (Authelia/Zitadel) 'has not been made'; no native binaries built
      מקור: סשנים של Claude Code (claude-02#52)
  - key: own-020
    name: ספק טוקן Plane Cloud ו-slug של סביבת העבודה כדי לייבא את המידע מהענן
    priority: medium
    labels:
    - plane
    - בעלים
    description: |
      מה נדרש: He used Plane Cloud and wants that data brought into the local Plane. The import needs his personal Plane Cloud API token and the cloud workspace slug, which only he can supply. Done when both are set and `bbox project-pln import-cloud` has been run, its plan reviewed, and applied.
      בלשון הבעלים: «אני בעצמי השתמשתי בשירות שלהם בענן ובהמשך ארצה גם להעביר את המידע»
      נאמר: 2026-09-28 עד 2026-09-30, 3 פעמים.
      מצב (פתוח): apps/project-pln/app.json connection plane-cloud-api-token (required: false); apps/project-pln/README.md: the import was verified local→local only — the cloud run needs the owner's token
      מקור: שיחות עם עזריה בלשכת המק (mac-01#34)
  - key: own-021
    name: מחק את מאגר הבדיקה הזמני bina-git-selftest מחשבון ה-GitHub
    priority: medium
    labels:
    - בעלים
    description: |
      מה נדרש: The git self-test left a scratch repository on the owner's GitHub account. Agents were told three times not to delete it — it is the owner's decision (the forge SSO from the same list was later delegated and done). Done when the repository no longer exists on GitHub; the repo holds no record of that.
      בלשון הבעלים: «אל תמחק את ה-repo הזמני ב-GitHub (solomonBoltin/bina-git-selftest-1790646696), אל תגדיר SSO ל-forge ואל תעשה commit — אלה החלטות של הבעלים»
      נאמר: 2026-09-29 עד 2026-09-30, 3 פעמים.
      מצב (פתוח): apps/git/selftest.py:13,163 creates bina-git-selftest-<timestamp> and is meant to delete it; nothing in the repo records that solomonBoltin/bina-git-selftest-1790646696 was removed
      מקור: שיחות עם עזריה בלשכת המק (mac-01#39)
  - key: own-022
    name: מחק את הקונטיינרים traefik-probe2 ו-traefik-probe3 ממנוע ה-Mac
    priority: medium
    labels:
    - תשתית
    - בעלים
    description: |
