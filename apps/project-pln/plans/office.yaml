    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/plane-api-dead-for-ten-hours-while-docker-said-healthy.yaml · נפתח 2026-09-30 · סטטוס שם: in-progress
      הכותרת בקובץ: project-pln: the API was dead for ~10 hours while Docker reported the container healthy — the probe hits Caddy, not the API
      תקציר: gunicorn ran with -w 1 and its single uvicorn worker died under load (~23:36 the night before); the arbiter never respawned it, nothing bound :3002/:3004/:3005, and Caddy timed out every request at 20 s — the owner's 'Plane does not really load'. The AIO healthcheck probes Caddy on :80, which answer
      משימות בקובץ:
      - [בוצע] supervisorctl restart api (done 2026-09-30 by the Plane session — API back)
      - GUNICORN_WORKERS=2 or worker supervision in apps/project-pln/supervisor.conf
      - Healthcheck probes the API port directly with a decisive result; timeout profile-owned (HEALTHCHECK_TIMEOUT)
      - binaos.autoheal=true on project-pln; verify autoheal restarts it on a sustained unhealthy
  - key: pln-002
    name: Plane נפתח מחוץ למשרד, הרשמה פתוחה, חשבון CI מחזיק את ה-workspace, ומצבי פרויקט חדש באנגלית
