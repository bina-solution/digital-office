  - key: n8n-018
    name: 'n8n: ה-compose עדיין קושר את `./workflows` אחרי שהתיקייה עברה ל-`blueprint/n8n` — מה ש-pull מייצא לא מגיע למקום שה-hook קורא, ו-G26 אדום'
    priority: high
