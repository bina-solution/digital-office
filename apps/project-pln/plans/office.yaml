    - ממשק
    description: |
      מה נדרש: SEEN 2026-10-10 in the simulation's copy of the same code, READ in the live app's (INDOX does not run on the HP office). apps/indox/app/webapp/src/pages/SettingsPage.tsx: the page owns the rows of a settings table (`companies`, line 1194) and counts them on the tab (line 1287); the grid, mounted only while its section is shown (line 1501), keeps a copy of its own (`useState(initial)`, line 700, refreshed only when the page's rows change, line 709). An add, a delete or an edit changes the copy alone. So the number on the tab never moves, and leaving the tab and returning draws the grid afresh from the page's rows: a deleted row is back, an added one is gone, an edited cell shows what it held before - while the service holds the change. In the simulation («חברות», three rows): one deleted -> the table counts 2 and the tab still reads «חברות 3»; one added; «חוקי תיוג» pressed and «חברות» again -> three rows, the deleted one among them, the added one not.
      קבלה: the rows have one owner (the grid reads and writes the page's rows - no copy); after a delete, an add and an edit, leaving the tab and returning shows the table as it was left, and the tab's number is the table's count - shown on an office that RUNS INDOX. The simulation's fork is corrected in round 31 of DGO-459, with a line of the suite that asks it («indox/a table keeps what was done in it when its tab is left and returned to, and the tab counts its rows»).
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-10 — נמצא בהכנת סבב 31 של DGO-459 (וקורא שני של השינוי הצביע על אותן שורות). לא תוקן שם: INDOX החי לא רץ בלשכה הזאת.
  - key: ui2-074
    name: 'INDOX החי: אסימון לועזי עם סימן בקצה מצויר הפוך בארבעה משפטים — «q_v3_*» ו«/documentDraw»'
    priority: low
    labels:
    - ממשק
    description: |
      מה נדרש: MEASURED 2026-10-10 in the simulation's copy of the same sentences, READ in the live app's (INDOX does not run on the HP office). A Latin token with a sign at its edge, standing in a right-to-left sentence, has that sign taken by the line and set at the token's other end: «(q_v3_*)» is drawn «(*_q_v3)», «(/documentDraw)» is drawn «(documentDraw/)». The live app holds the four sentences the simulation held - apps/indox/app/webapp/src/pages/ExtractionPage.tsx:402 «…השאילתות נטענות מההגדרות (q_v3_*).», pages/ExtractionDocPage.tsx:402 «…בטבלת settings (מפתחות q_v3_*) — ללא שינוי בתהליכים.», components/DocumentStage.tsx:153 «…apitools עצמו (/documentDraw): עוגן ירוק…» and :166 «זיהוי תווים (/documentOcrDraw): …». Round 32 of DGO-459 set each token left to right in the simulation's fork (<bdi dir="ltr">) and added rule 26 to the suite, which measures where a token's signs are drawn.
      קבלה: in the four sentences the token reads as it is written - «q_v3_*» with its star after its last letter, «/documentDraw» and «/documentOcrDraw» with the slash before the first - measured (the place of the token's first and last characters and of its sign) or photographed large enough to read, on an office that RUNS INDOX. Rule 26 of digital-office/sim/flow-qa.py asks it of the simulation's tiles; the simulation's document page of an extraction is walked by no suite line yet (looked at once in round 32).
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-10 — נמדד בסבב 32 של DGO-459. לא תוקן שם: INDOX החי לא רץ בלשכה הזאת.
