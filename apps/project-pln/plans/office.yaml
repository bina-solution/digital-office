  - key: pln-010
    name: 'Plane: אחרי כניסה החלון עזב את הכתובת שלו ונחת על דף שגיאה של הדפדפן'
    priority: high
    labels:
    - plane
    - HP
    description: |
      מה נדרש: Every answer of Plane's sign-in is a redirect to WEB_URL (http://plane.localhost), whatever host the browser is on. The office frames Plane on plane.console.localhost, and a linked office on its own nested host — so a person who typed the right password was sent to another site inside the frame (the browser's "refused to connect" page on hp-laptop; a 404 of the MacBook's own edge from there), and the session cookie stayed on the host they left. The redirect is answered on the origin that was asked, in the app's own front.
      ראיה: commit 6ad636c3 — apps/project-pln/Caddyfile (`asked`); the running container on hp-laptop answers each of plane.localhost / plane.console.localhost / plane.hp-laptop.console.localhost:8080 on itself; `bbox project-pln verify` → project-pln-origin ✓. Only the application container was recreated (healthy in 46 s).
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-06 (נמצא על ידי עזריה מהקונסול של המק)
  - key: pln-011
    name: 'Plane: נכנס עם הזהות של הלשכה — בלי סיסמה שנייה, מקומית ודרך קישור'
    priority: high
    labels:
    - plane
    - אבטחה
    - כבד
    - בעלים
    description: |
      מצב (עצור, 2026-10-06): לא נכתבה שורה. זו החלטה של הבעלים — מי נכנס ל-Plane ואיך — והיא מחכה שיאמר אותה בעצמו בסשן של לשכת ה-HP.
      מה נדרש: After the office's sign-in Plane still shows its own (e-mail and password) — a second sign-in for a local window and a third thing to know from a linked office. Plane CE has no OIDC, so the session has to be given by the office: a build-time patch (patches/, anchors asserted) that signs in the Plane user who IS the office's signed-in user. What it may trust: the token the identity provider signs for the request (X-authentik-jwt, verified against the provider's key) — never a bare header, which any container on the office network can write. Over a link the door has already replaced the peer's claims with this office's mapped user; the patch needs a way to know a request came through the door and not from a neighbour container. Mapping office user → Plane user is declared (bootstrap.yaml), not guessed. Plane's own password stays a way in (DGO-13).
      קבלה: with a live office sign-in, opening the Plane window (hp-laptop) and the «ניהול פרויקטים · HP» tile (MacBook) lands in the workspace with no form; a request to http://project-pln/ from another container with a hand-written identity header gets the sign-in page; `verify` proves both.
      בלשון הבעלים (כפי שנמסר דרך עזריה): «ברגע שהתחברת ללשכה שלך יש גישה לכל האפליקציות המקומיות והמקושרות בלי להירשם שוב»
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-06
  - key: pln-012
    name: 'Plane: השורה ב״חיבורים ומפתחות״ מציגה לבעלים סיסמה שאינה של החשבון — והמסמכים מבטיחים שהיא כן'
    priority: high
    labels:
    - plane
    - בעלים
    description: |
      מצב (עצור, 2026-10-06): הכלל הוא החלטה של הבעלים; הוא נשאל בסשן של לשכת ה-HP ועוד לא ענה. הקוד כפי שהיה.
      מה נדרש: On hp-laptop the owner could not sign in to Plane with what the credential screen shows. The instance moved in from the MacBook with his account; the screen's row holds this office's own line, which was never the account's. The app's README, AGENT.md and the row's own text say the screen's value is the account's password; the applier has kept an existing owner's password since 2026-09-30, and its switch for a deliberate change never reaches the container. One rule has to be chosen and the code, the row's text, README, AGENT.md and `verify` made to say the same thing.
      קבלה: what the row shows signs in (`verify`'s own sign-in check is green, not a warning) — or the row says in words that the account's password is not kept here, and shows none.
      בלשון הבעלים: «מה הסיסמה של הפליין זה לא נותן לי להתחבר עם הפרטים שבחיבורים ומפתחות למה זה לא זהה לשם ?»
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-06
  - key: pln-013
    name: 'מילוי מהכספת לכל אפליקציה שמביאה כניסה משלה — והעובדה ש-Plane CE אינו יכול להתאחד עם authentik'
    priority: medium
    labels:
    - plane
    - ממשק
    description: |
      מה נדרש: The generic half of the «no second password» question, and the fact that closes the tempting shortcut. (1) Recorded, verified against Plane's own docs: OIDC/SAML/LDAP in Plane are **Pro/Business**; CE has only Google/GitHub OAuth, email codes and passwords — so «disable Plane's own login by federating it with authentik» has NO configuration answer, and nobody should re-plan it. (2) The generic path is already half-built here: `apps/browser42/logins.py` bridges the credential plane to Chrome's autofill (origin-keyed; `./bbox b42 logins <list|sources|sync|materialize|harvest|export>`), and its store ALREADY holds `http://plane.localhost`. What is missing is only the console affordance: when the shell's «כניסה» card appears for an app whose login the vault knows, offer «פתח בדפדפן הלשכה» where the login is already filled — one card, one target, no new mechanism, and it covers every third-party app (n8n, glitchtip, supabase-studio, chat, facebook).
      ראיה ומדידות: issues/plane-signs-in-twice-when-opened-from-the-console.yaml · data/browser42/browser-logins.json (entries['http://plane.localhost'])
      מקור: בקשת הבעלים, 2026-10-06 («maybe even auto fill from secrets cloud solve this generically»)
  - key: pln-014
    name: 'Plane: שורת יומן ה-API שומרת את התשובה המלאה (כ-19KB לשורה) — לוודא שהניקוי היומי רץ, ולשקול לא לשמור תשובות'
    priority: medium
    labels:
    - plane
    - תשתית
    - HP
    - באג
    description: |
      מה נדרש: issues/plane-ran-with-no-scheduler-and-its-api-log-grew-200-mb-a-day.yaml. Fixed on 2026-10-07: the worker carries the scheduler (Plane's twelve periodic jobs run again) and the API request log is kept three days. Left: confirm that the daily prune is sent at 02:30 UTC and succeeds; then decide whether a row needs `response_body` at all — without it a row is under 1 KB and the table would not be the office's largest.
      קבלה: the worker's log shows `delete_api_logs` sent and succeeded; `api_activity_logs` stops growing past three days of traffic.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (נמצא בסקירת המסכים)
  - key: pln-015
    name: 'עדיין מלא טקסטים באנגלית בתוך Plane — סרגל הצד, הכותרת, החיפוש, המצבים והתגים'
    priority: high
    labels:
    - plane
    - ממשק
    assignee: azaria
    description: |
      מה נדרש: The owner, 2026-10-08, opening Plane in the console: «תראה יש עדיין מלא טקסטים שעדיין באנגלית». Two screenshots of the framed app show the Hebrew build is live (RTL, Hebrew states, Hebrew dates) yet these strings are still English in the UI: the work-item list header (`Work Items`, `499`, `Not started`, `Backlog`, the table's column header), the command palette `Search commands...`, the right rail (`Projects`, `More`, `Community`, `Private work item`/`דבקים`), the workspace switcher (`המשרד`), the profile screen (`Asia/Jerusalem`, `Joined Sep 29, 2026`, the `Overview` cards' labels `Not started`/`Backlog`), the editor toolbar and the item's own action tooltips. Enumerate EVERY remaining English string in the served bundle (`apps/project-pln/vendor/*` / the `plane-he` release named by PLANE_HE_WEB_URL+SHA256) mechanically — not by eye at one screen — and fix them in the plane-he source (or, for strings upstream hardcodes in the shipped JS bundle, in the patch/build step the AGENT.md already describes), so a Hebrew profile sees no English sentence and no English state name anywhere.
      קבלה: a scan of the served bundle (one enumerator, run over the whole app, not one screen) reports zero user-visible English strings except identifiers, and the screens in the two screenshots read fully Hebrew — proven by re-shooting both, and by the language being SERVER-side (`Profile.language=he`) so a reload and a second device show the same.
      בלשון הבעלים: «תראה יש עדיין מלא טקסטים שעדיין באנגלית»
      ראיה: שתי תמונות מסך של Plane במסגרת הקונסול, 2026-10-08 (מצורפות לפריט)
      מקור: הבעלים, 2026-10-08 (הודעה לסשן הלשכה עם שתי תמונות)
- key: o-link
  name: קישור בין לשכות · מעבר לתוכנית DGO
  status: backlog
  description: צימוד, מנהרה, גישה מסוכן לסוכן — מה שאינו פריט בשלבי DGO.
  items:
  - key: lnk-001
    name: העבר את האפליקציות הכבדות מה-Mac ללשכה ב-hp-laptop עם הנתונים; ב-Mac רק סוכנים ובקרה
    priority: high
    labels: []
    description: |
      מה נדרש: Owner priority: browser42 (profiles), Plane, my-docs, drive, n8n, mail, INDOX, apitools, sites, telegram-tv, git, digital-assets and social-list run on hp-laptop with their data and show on the Mac as remote apps; an app is switched off on the Mac only after its copy works. A measured move plan exists; so far only Plane moved with its data and Drive runs there. Later decisions sent sites to the cloud office and kept digital-assets on the Mac.
      בלשון הבעלים: «כל האפליקציות הכבדות עוברות אליו עם הנתונים» · «הלשכה המרוחקת צריכה לקחת עומס בפועל, כדי שכל הסוכנים יוכלו לעבוד ביחד ולסיים את המשימות»
      נאמר: 2026-09-30 עד 2026-10-01, 8 פעמים.
      מצב (חלקי): p3-6, p2-5; platform.state.yaml (hp): project-pln and drive enabled; browser42, n8n, mail, indox, apitools, my-docs, git, telegram-tv off; ai/context/moving-an-office.md §4
      מקור: שיחות עם עזריה בלשכת המק (mac-02#18)
    assignee: azaria
  - key: lnk-002
    name: ודא שכל שתי לשכות חדשות באותה רשת מתחברות מהקופסה, בלי להקליד דבר
    priority: high
    labels: []
    description: |
      מה נדרש: Any two freshly installed offices on one LAN must pair from their screens. Works when one side is Linux or Windows with WSL mirrored (HP↔Mac is proven). A Mac (Lima guest) and Windows in WSL NAT only dial, so pairs of those fail until a one-off command runs on the machine. Done when a NEW pair between two real fresh machines of each kind connects and is proven with screenshots.
      בלשון הבעלים: «הבעלים דורש שכל שתי לשכות חדשות באותה רשת יתחברו מהקופסה.» · «אף אחד מהם לא מציג לי QR שהשני יכול לסרוק.» · «וגם קודם חיבור לשכה (דרך הרחבת לשכה) ואז מקבלים גם גישת SSH למחשב של השלכה המורחבת» · «אבל אותה אימלפמנטציה אמורה לעבוד בכל מצב (גם מקומי וVPS וכו)»
      נאמר: 2026-10-04 עד 2026-10-05, 8 פעמים.
      מצב (חלקי): dgo-pairing-contract.md:175-176: Mac↔Mac, Mac↔Windows(NAT), NAT↔NAT do not pair; apps/dgo-extend/tests/fresh-offices.sh (d06262b2) tests fresh offices only as containers
      מקור: שיחות עם עזריה בלשכת המק (mac-03#12)
  - key: lnk-003
    name: בנייה מחדש של dgo-net משאירה את dgo-link ב-namespace מת, והקישור נופל בשקט בלי מדידת מסירה
    priority: high
    labels:
    - באג
    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/the-link-goes-dark-after-every-tunnel-rebuild.yaml · נפתח 2026-10-04 · סטטוס שם: open
      הכותרת בקובץ: The link goes dark silently: rebuilding dgo-net orphans dgo-link in a DEAD network namespace, and nothing measures delivery
      תקציר: Reaching this office from a linked one returned 502/timeout while the WireGuard handshake was up the whole time. Root cause, measured: `dgo-link` runs with `network_mode: service:dgo-net`, and Docker does NOT move it into the NEW namespace when `dgo-net` is recreated — its listeners (`10.79.2.1:9002
      משימות בקובץ:
      - Recreate dgo-link whenever dgo-net is recreated — declared as one unit (scripts/dc or the manifest), never remembered
      - A DELIVERY probe per pair through the tunnel, reported by /api/link and the console distinct from the tunnel's state
      - A lint that fails when a container sharing another's network namespace can outlive the container that owns it
      - [בוצע] One writer for /tunnel: step_link delegates to app.render_tunnel (done 2026-10-04, keep it)
      בלשון הבעלים: «זוג dgo-net/dgo-link שנבנה כיחידה»
  - key: lnk-004
    name: 'מנהרת המשרד נתקעת בשקט: פורט מקור אחד שנחסם הפיל אותה ל-15 שעות, ואין מסך שמודד handshake'
    priority: high
    labels:
    - באג
    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/the-office-tunnel-wedges-silently-and-nothing-measures-it.yaml · נפתח 2026-10-04 · סטטוס שם: in-progress
      הכותרת בקובץ: The office tunnel wedges silently: one blackholed source port left it dead for 15 hours, and no screen measures the handshake
      תקציר: Between `macbook` and `vps1` the WireGuard handshake had been dead for ~15 hours while the tunnel counted its handshakes as sent. Root cause, measured: every packet of the flow sourced from UDP 51820 was dropped on the way out of the home office — the initiations were captured leaving the machine (`
      משימות בקובץ:
      - [בוצע] Re-apply the link and verify with `wg show wg0 latest-handshakes` on both ends plus a door probe
      - [בוצע] Make the dialing side's listen port configurable (`DGO_WG_PORT`) and persist a working port
      - Expose the tunnel's measured state (handshake age, endpoint, door reachability, catalog age) in `/api/link` and render it in dgo-extend's own screen
      - Give `GET /api/tunnel` a consumer and a verdict, not just `{present, bytes}`
      - Render `state_error` as a cause class + details instead of the raw class name
      - Add a publish-time host resolution check that refuses a router/alias/endpoint for a name that does not resolve
      - Re-converge hp-laptop when it returns (its machine refuses SSH on 192.168.16.104:2222) so it learns the new port
      בלשון הבעלים: «תבדוק עם עזריה אם יש handshake»
  - key: lnk-005
    name: 'קישור: מסירת מפתח הסוכן בין לשכות מצומדות — דרך הקישור, לא SSH'
    priority: high
    labels:
    - אבטחה
    - cli
    description: |
      מה נדרש: converge refuses a paired office (409), and _remote_vault_put writes the peer's vault through `computers` (SSH), which paired offices do not have by the owner's decision — so `dgo_link-serve-<office>-<app>-agent` is never written and `bbox agent --office` / `bbox remote … --api` are answered 401. Design in the pairing contract: the consuming office PULLS the served agents' tokens from the serving office's link plane over the tunnel, authenticated by the pair's own secret, and stores them in its own vault. Done when `bbox remote macbook bina /v1/sessions --api` lists sessions from hp-laptop, and the reverse from the Mac.
      בלשון הבעלים: «use the browser to chat with macs dgo azaria» · «serve של «*» ב-HP לא פותח את פורט ה-API של הסוכן (3081) — רשום אצלי, אטפל בו בנפרד.»
      ראיה: commit 28595d77; MacBook's measurement 2026-10-06 04:00
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-04 עד 10-06
  - key: lnk-006
