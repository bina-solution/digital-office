  - key: app-030
    name: מפתח המטמון של OcrQuery לא כולל region, ולכן שרשרת fallback מחזירה רשימה ישנה בטווח שגוי
    priority: medium
    labels:
    - באג
    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/apitools-query-memo-ignores-region.yaml · נפתח 2026-08-06 · סטטוס שם: open
      הכותרת בקובץ: OcrQuery match memos are keyed without `region`, so a fallback chain serves a stale, wrongly-scoped match list
      תקציר: `find_texts_matching_annotations` caches on (texts, fuzzy, max_matches) but reads the region-filtered `self.text_annotations`, while `_run_single` re-assigns `self.ocr_query.region` per fallback step on a shared OcrQuery — so a region is silently ignored (or leaks) between steps of one query. Reprod
      משימות בקובץ:
      - Add region (y_min, y_max) to the memo keys in find_texts_matching_annotations, find_texts_matching_annotations_via_alignment, and _aligned_memo
      - Add a regression test asserting a region-scoped call after an unscoped one matches the fresh-object scoped control (band must keep >0 annotations and exclude >=1 anchor)
