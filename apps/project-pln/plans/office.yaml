    priority: high
    labels:
    - ממשק
    - אבטחה
    - HP
    description: |
      מה נדרש: A linked office's agent, its console home and Plane are framed on a host nested under the console; on a .localhost office that host cannot sign in inside a frame, and the shell drew a card that sent the owner to a tab — a second sign-in for every linked app. The office's sign-in is alive; the host only never saw it. The shell takes the browser there (a top-level load of the tile's `enter` path, /.dgo/enter/<route>), this office's edge passes it through its own sign-in and sends it back to the console at that route. The gate (authentik@file) stays on every nested route: the link's door trusts the office, so this sign-in is the only authentication in front of the other office's apps.
      ראיה: commit 6adb272d — flow suite 34/34 desktop and 31/31 mobile, five mutants each fail a check; hp-laptop's edge measured with a router of a made-up host: the port and the route survive the redirect; an unsigned browser on plane.console.localhost/.dgo/enter is sent to the provider. Live on hp-laptop (console created 2026-10-06 09:38Z).
      נשאר: the trip seen in a real signed-in browser — lnk-013 from the Mac, pln-005 on hp-laptop after the owner's sign-in (own-006).
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-06 (נמצא על ידי עזריה מהקונסול של המק)
