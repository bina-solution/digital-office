  - key: eng-005
    name: 'bbox run יוצר מחדש קונטיינרים שלא שונו: תצורתם תלויה במי מריץ compose ובאילו אפליקציות פעילות'
    priority: high
    labels:
    - באג
    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/a-containers-configuration-depends-on-who-asks-and-on-who-else-runs.yaml · נפתח 2026-10-06 · סטטוס שם: open
      הכותרת בקובץ: A container's configuration depends on WHO asks compose for it and on WHICH OTHER apps are enabled — so a bring-up re-creates containers nobody changed
      תקציר: Measured on hp-laptop 2026-10-06: the next `bbox run` would re-create 10 of 39 running containers (the edge, two databases, Plane, Drive, the agent) because one app was added days ago; the control plane and `scripts/dc` each compile a different configuration than `bbox` for 8–9 services.
      משימות בקובץ:
      - CPU caps leave the compose configuration: the budget stays one rendered plan, and one step applies it to the running set with `docker update --cpus` after every `up` (compose_files() stops merging the overlay; `_effective_cpu_budget` goes).
      - One zone, whoever asks: `scripts/dc` runs compose through `dcx` instead of beside it, and a container that runs compose is handed the host's zone at creation and uses it.
      - One socket path, whoever asks: a container that runs compose is handed the HOST path of the socket it holds, and interpolates that — never the path inside itself.
      - One compose for every caller: the plugin version is declared once and every image that runs compose (app-management, bina-ds, and the host installer) takes it from there — or those containers stop carrying a compose of their own and ask one
      - The check exists — `bash scripts/config-by-caller.sh [service …]`, read-only, exit 1 unless both answers are `none` (hp-laptop 2026-10-06 03:40: 18 of 39 services differ between the host shell and app-management — the zone on 11, the socket
  - key: eng-006
