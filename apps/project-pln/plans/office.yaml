      מקור: שיחות עם עזריה בלשכת המק (mac-02#51)
    assignee: azaria
  - key: lnk-008
    name: 'בנה קוד יחיד לחיבור לשכות: כתובת ומפתח גישה עם תוקף, ובחירת לתת/לקחת ואילו אפליקציות'
    priority: medium
    labels: []
    description: |
      מה נדרש: The owner's model for linking: the reachable office shows ONE code (barcode or text) that holds its address and an access key valid for a chosen time (default a week); the other office reads it, dials, and both show a connected office — the same on a home network and for a public server. Designed as an invite (create, accept, redeem over the tunnel, revoke) needing a private key per pair and a control door for a pending pair. Not built.
      בלשון הבעלים: «הלשכה הנגישה מציגה קוד אחד שמכיל כתובת + מפתח גישה עם תוקף (ברירת מחדל שבוע), בחירת לתת/לקחת/שניהם ואילו אפליקציות»
      נאמר: 2026-10-04 עד 2026-10-04, 2 פעמים.
      מצב (פתוח): ai/context/dgo-pairing-contract.md §D 'the invite … (DESIGN — not built)'; no DGOINV1 and no /api/pair/invite anywhere under apps/ (grep)
      מקור: שיחות עם עזריה בלשכת המק (mac-02#55)
  - key: lnk-009
    name: 'התאם או הסר את move.py הישן (SSH) של dgo-extend: לשכה paired עדיין נופלת ב-_step_preflight'
    priority: medium
    labels: []
    description: |
      מה נדרש: The promise was kept elsewhere: POST /api/apps/<id>/move in app-management moves an app to a paired office. The SSH-era mover in dgo-extend (move.py, with converge.py and peers.py) still assumes a machine record, so its own routes still fail for kind: paired. Done when those routes delegate to the native move or are removed with the SSH planes (vps1 still depends on them).
      בלשון הבעלים: «move.py ינהל את השלבים האלה גם ללשכה paired (בלי machine) — ה-KeyError ב-_step_preflight ייעלם»
      נאמר: 2026-10-05 עד 2026-10-05, 1 פעמים.
      מצב (חלקי): apps/dgo-extend/move.py:216 still reads office['machine'], untouched since 873cc857 (10-02); app.py:1480 still calls mv.start; the native move lives in app-management (a174de80)
      מקור: שיחות עם עזריה בלשכת המק (mac-03#23)
    assignee: azaria
  - key: lnk-010
    name: bbox agent --office מה-shell של המארח כשהמנהרה בתוך מכולה
    priority: medium
