  - key: qa-029
    name: 'pixel-diff: דף ריק מול דף מלא יוצא «CLOSE 0.69%» — הסף מתעלם מכל משטח של מערכת העיצוב'
    priority: medium
    labels:
    - ממשק
    description: |
      מה נדרש: scripts/ui-coverage/pixel-diff.py compared the simulation's apps panel when it was BLANK with the live apps screen (a heading, counters, six cards, a side list) and answered "0.69% differing · 46 regions · CLOSE" — only the dark glyphs were marked. The per-channel tolerance is 28, and the design system's surfaces differ from the page by 7–11 levels (#fff on #f4f6f8), so a card, its border and its grey text are all "the same" as an empty background. Every parity number the tool has produced has that floor under it. The verdict needs a measure that sees structure (compare a blurred/downscaled luminance at a low tolerance, or edges), tuned on three known pairs: identical, blank-vs-full (must be MAJOR), and the same screen with other data.
      ראיה: ci-artifacts/qa-2026-10-06/diff-desktop/00-console-apps-grid.png (2026-10-06)
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-06 (נמצא בזמן ה-QA המלא)
  - key: qa-030
    name: 'סימולציה שנפתחת (או מתרעננת) על כתובת של אפליקציה מציגה «קובץ לא נמצא» במקום האפליקציה'
    priority: medium
    labels:
    - ממשק
    description: |
      מה נדרש: The patch that serves a framed app from memory was installed AFTER the shell's own scripts. The mocked registry answers at once, so a page loaded or reloaded on `#/m/<tile>` drew its frame before the patch existed and asked the disk for `/a/<alias>/` — the browser's "file not found" where the app belongs, at every size. It showed up as the one JS error left in the phone run, once each error was printed with the check it first came after. Install the patch before the shell's scripts.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-06 (נמצא בזמן ה-QA המלא)
  - key: qa-031
    name: 'שמות שאף קובץ לא קושר: חמישה באגים בנתיב הנדיר, ושער G80 שעוצר את השישי'
    priority: high
    labels:
    - באג
    - תשתית
    description: |
      מה נדרש: Python meets a name only when its line runs, so a name no file binds survives in the branch that almost never does. Reading every tracked file's symbol table found five: mailapi `thread(bodies=false)` called `_summary` (the function is `_msg_summary`) - every headers-only thread read was a 500; browser42 `lease_connection` caught HTTPError / URLError and imported neither, so a refused credential lease surfaced as a NameError instead of `credential_refused`; apitools' text-layer reader logged a failed overlay render through a `logger` it never made, taking the document's whole reading down; the memory-budget gate (G30) crashed on a machine whose .env names no PERFORMANCE_PROFILE; the task runner carried a `span_push` that could never have worked (nothing called it).
      קבלה: all five fixed with a test that fails on the old source; a gate (G80 `undefined-name-lint`, `symtable`, nothing to install) names all of them on the old tree and passes on the new; a star import is refused rather than set aside.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (בדיקת qa-023 הובילה ל-`logger` ב-pdf_textlayer.py)
  - key: qa-032
    name: '16 מתוך 46 קובצי הבדיקות ששער הבדיקות מוצא אינם רצים במקום שבו השער רץ'
    priority: medium
    labels:
    - תשתית
    description: |
      מה נדרש: G72 (`plane-tests-lint`) finds every `test_*` beside a plane and runs it on the gate host - where, measured 2026-10-07, 26 of 46 ran and passed, 4 are steps of their own and 16 were NOT RUN: 10 of apitools' (six of them only because the gate runs from the repo root and they import `src`), 3 of the mail backend's (imapclient), and one each of console, data-management and digital-assets (requests, fastapi). No lane runs them in that image either: `bbox test apitools` runs the feature-validation suites, not `apps/apitools/tests/*_unit.py`. So the mail backend's 21 tests and apitools' 31 run only when somebody runs them by hand - which is how `thread(bodies=false)` stayed a 500 with a test file sitting next to it. Shown to work on 2026-10-07 for apitools: a throwaway container of the app's image, no network, the checkout's source mounted read-only (`docker run --rm --network none ... -m unittest`). Open question that decides the shape: the mail tests are pytest-style and the images carry no pytest.
      קבלה: every test file G72 discovers is run by some lane that fails when it fails - on the gate host, or in its app's image on an office that has it - and G72 says which; the NOT RUN count is zero or each one is named with the lane that runs it.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (qa-031)
  - key: qa-033
    name: 'מריץ השערים המקומי הריץ ארבעה שערים בלי ‎--strict‎ שה-CI נותן להם: שניים היו אדומים ב-CI וירוקים אצלנו'
    priority: high
    labels:
    - תשתית
    - באג
    description: |
      מה נדרש: `scripts/ci/gates.sh` - what a local run, `fresh-machine-check.sh` and `bbox baseline` execute, and the run every push here is judged by - called every gate bare, while ci-verify.yml runs ownership, layering, blueprint-dep and capability-use with `--strict`. Measured 2026-10-07: G9 layering fails under the flag (5: the INDOX extractor workflows parked in the central blueprint dial apitools) and G25 capability-use failed under it (chat consumed the platform's `sql` through a one-shot `psql` job and declared no `use: sql`; the gate also named the wrong fault - "own instance"). Both read green locally, so "the same 2 red" was 4 as CI counts. Two gates' self-tests (stalled-pagination, unread-error) also ran only in CI.
      קבלה: gates.sh passes each gate the flags CI passes; `--verify-ci` compares flags and self-tests in both directions and fails on a drift (shown); G25 is green under `--strict` for the right reason; G9's red is written down as known, with what closing it needs (DGO-315).
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (`run-gates.py` דיווח REGRESSION על G9 ש-gates.sh הראה ירוק)
  - key: qa-034
    name: 'חמישה שערי n8n עברו שבעה שבועות בלי לקרוא אף blueprint'
    priority: high
    labels:
    - תשתית
    - באג
    - n8n
    description: |
      מה נדרש: The blueprints became `.workflow.ts` on 2026-08-16. A pass on 08-23 moved twenty-two gates onto the one reader (`scripts/refactor/n8n_blueprint.py`); five were missed and went on globbing `*.json` in directories that hold none - G19 workflow-input ("0 executeWorkflow node(s)"), G42 writer ("0 sanctioned write nodes"), G45 loop order (22 exported snapshots, called "all 22 blueprint workflow(s)"), G47 app tag (one legacy file), G62 mail connection ("+ 0 n8n workflow(s)", passing while listed as known red). Four of them are in the gate list every push is judged by. Four more (G44, G52, G54, G55) passed over zero blueprints wherever the toolchain was missing.
      קבלה: each reads the shipped blueprints through the one reader and fails when it reads none (shown both ways on the gate host); what they find is written down, not parked: G19 green on 296 nodes; G42 green once the retired API left; G45 and G47 red with real findings (n8n-015, n8n-016, and the loop rule of n8n-014); G62 3 call sites.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (בדיקת n8n-014 הראתה ש-G45 קורא 22 קבצי snapshot ואפס blueprints)
  - key: qa-035
    name: 'ה-QA לא הסתכל על אף מסך במצב שולחן העבודה — סוויטת `windows`: כל מסך בחלון שלו ובחלון הקטן ביותר'
    priority: urgent
    labels:
    - ממשק
    - תשתית
    - בעלים
    description: |
      מה נדרש: The owner, 2026-10-07: «אתה חייב להתחיל לעשות צילומי מסך כשהקונסול במצב דסקטופ». Every flow suite and both maps looked at a screen in the classic shell's full frame; all were green while the timeline had 2 of its window's 530 pixels. A suite that turns desktop mode on and, for every screen the shell's registry offers, looks at its window as the desktop opens it and after its corner is dragged in as far as it goes - photographs both, and checks inside the frame: content, no sideways scroll, nothing cut, nothing that scrolls squeezed shut, the heading and the leading numbers a line and a strip of the window, the timeline most of its window.
      קבלה: `python3 digital-office/sim/flow-qa.py windows` is part of the default run on the simulation and reads a running office with `--url <console>`; it fails on the screens as they were before the small-window work and passes after; CLAUDE.md names it.
      מקור: הבעלים, 2026-10-07 (הודעה בסשן של Claude Code בלשכת ה-HP)
  - key: qa-036
    name: 'לסוויטות החיות (`connect`, ו-`windows` מול לשכה) אין קורא קבוע — הן רצות רק כשמישהו זוכר'
    priority: medium
    labels:
    - תשתית
    description: |
      מה נדרש: Two flow suites prove things only a running office can show: `connect` (the pairing screen against the office's own dgo-extend) and `windows --url` (every live screen in a desktop-mode window). Nothing calls either: `connect` was red for a day (a stub without its verdict) and broken again by a card's change before anyone ran it. They need a caller in the live lane (`scripts/ci/run-gates.py --live`), and `windows` needs to tell the office's own errors from a framed third party's when it comes in behind the edge - there noVNC reports three console errors about a page served without TLS, and the run exits non-zero on a green office.
      קבלה: the live lane runs both against the office it is on and is red when either fails; behind the edge the windows run is green on a healthy office (a third party's console noise is named, not counted) and still red on an error of the office's own pages - shown both ways.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (qa-035; DGO-437 הוא הדף של noVNC עצמו)
  - key: qa-037
    name: 'צילום מסך מחכה עד שהמידע שאמור להיות מוצג נטען — ומסך שנטען לאט מדי מדווח כבאג'
    priority: urgent
    labels:
    - ממשק
    - תשתית
    - בעלים
    description: |
      מה נדרש: The owner, 2026-10-09: «אתה חייב לוודא שהצילומי מסך שלך באמת מספיקים לטעון את המידע שאמור להיות מוצג ואם לוקח יותר מידי זמן אז לדווח באג». Every tool that photographs a screen waits a fixed time and then presses the shutter: the live map and the simulation's map (`scripts/ui-coverage/live-ui-map.py`, `digital-office/sim/ui-map.py`), the flow suites' photographs (`digital-office/sim/flow-qa.py`) and the session's own read-only looks. A screen that is still loading is photographed as it stands - the look at the live «אפליקציות» tile on 2026-10-09 shows six grey placeholder cards, before a change and after it, because the list took 5 to 13 seconds to arrive and the camera waited 4.5. So: a photograph is taken when the screen has SAID what it has to say (no placeholder, no «טוען…», no read of its data still in flight), and how long that took is written beside it; a screen that needs longer than a stated budget is a finding - its own bug, with the measured time and what was slow - never a picture of a skeleton passed off as the screen.
      קבלה: one shared rule of "loaded" (what counts as a placeholder; the budget) read by the live map, the simulation's map and the flow suites - no fixed sleep decides a photograph; each photograph's log carries its time-to-loaded; a run names every screen that was over the budget and is red for it, shown both ways: on a screen held back on purpose and on a healthy one; the first finding it produced - the live apps list, 5 to 13 seconds - is fixed or filed with its measured cause.
      מקור: הבעלים, 2026-10-09 (הודעה בסשן של Claude Code בלשכת ה-HP)
  - key: qa-040
    name: '«ניהול נתונים»: אחרי הפעלה מחדש של השירות המסך עומד על שלדים עד סוף הסריקה הראשונה — דקה ויותר'
    priority: medium
    labels:
    - ממשק
    - תשתית
    - באג
    description: |
      מה נדרש: Found by the rule of drawn (qa-037, DGO-507) on 2026-10-09: the live map read `ניהול נתונים (data-management)  NEVER DRAWN — still: .sk` (17 placeholders after 25 seconds) right after the service was rebuilt, and again during later sweeps. The second half is fixed (e5bff3ca: while a sweep runs the page keeps the last COMPLETED sweep's numbers - `SNAP["last"]`, `_shown()` - and the live map reads the tile drawn in 1.6s during a sweep). The first half is not: the snapshot lives in the process's memory, so a restarted service has nothing to stand on and its page is placeholders for as long as the first sweep takes - 85 seconds on hp-laptop that day (the binds are walked over /mnt/c), about 15 on a small host.
      קבלה: a restarted service shows the last completed sweep's numbers at once, said with their time («נסרק ב-…») and with the sweep in progress beside them; where they are kept survives the container being re-created and is declared as the service's own data (it is not the archives' root and not the checkout); a snapshot written by another deployment is never shown as this one's; the restore preflight and the CLI's `wait` still refuse numbers that are not a completed sweep of THIS process. Shown by re-creating the service and running the live map on its tile alone within ten seconds.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-09 (DGO-507: הכלל של "המסך נטען" מצא את זה בריצה הראשונה שלו אחרי בנייה מחדש)
  - key: qa-041
    name: 'forward-auth בלשכת ה-HP בלולאת הפעלה מחדש מאז 22:31 (355 פעמים): שני קובצי ההפעלה שלו נעלמו מ-/tmp כשהמנוע הופעל מחדש'
    priority: high
    labels:
    - תשתית
    - באג
    description: |
      מה נדרש: MEASURED on the HP office, 2026-10-10 04:20, read-only: the container forward-auth-hp is `restarting`, health `unhealthy`, restart count 355 (one a minute, policy unless-stopped), each exit 1 with `forward-auth: …: open /etc/forward-auth/legacy-sessions: no such file or directory`; the first such line in its log is 2026-10-09T19:31:13Z (22:31 local). Its /etc/forward-auth is a read-only bind of /tmp/forward-auth on the engine's machine: that directory is there, last changed at 22:31:03, and holds neither `users` nor `legacy-sessions` (their EXISTENCE only was checked - nothing of them was read or listed). THE CAUSE, each step measured: the distro's own userspace was restarted inside the running VM at 22:30:51 (pid 1 since then; the kernel is up since 2026-10-08 21:30; not by this session); systemd-tmpfiles-setup, which EMPTIES /tmp at every boot (`D /tmp 1777 root root -`), ran at 22:30:53; dockerd came up at 22:30:54 and made the missing bind source again as an empty directory at 22:31:03. The path is declared, not an accident: platform-base/forward-auth/docker-compose.yml line 61 binds `/tmp/forward-auth:/etc/forward-auth:ro` and its header says the prep files live «in /tmp/forward-auth on the host» - so EVERY restart of the distro (or of the machine) removes them, on every office that runs this service. THE EDGE IS NOT AFFECTED: asked with no credentials, console.localhost, /a/machine/ and /healthz each answer 302 to authentik's own authorize flow - sign-in still goes through authentik and the Go service is out of the path, as its writer's note says it was left. What it costs meanwhile: the container is started and dies once a minute, and the office's watchdog raises a notification and a wake request about it (the alerts screen at 04:17: 22 notifications, 20 unread, the newest three about it, one and two minutes old).
      קבלה: the two files the service is started with are kept where a restart of the engine does not remove them (not under /tmp), or the service starts without the migration pair when it is absent and says so; the container is healthy again after the engine's containers are restarted; the watchdog's repeated notification stops; the service's README says where the files live.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-10 — נמצא בקריאת הצילום של «התראות» בהליכה החיה של סבב 22 (DGO-459). forward-auth אינו שלי: לא נגעתי בשירות, במכולה או בקבצים שלו.
  - key: qa-042
    name: 'הקונסול רץ על 0.31 ליבה והקרנל עוצר אותו ביותר ממחצית הזמן כשחלון נפתח: כל תשובה שהוא נושא מתעכבת עד חצי שנייה, והפתיחה הראשונה של הדרייב לוקחת 3–5 שניות'
    priority: medium
    labels:
    - תשתית
    - באג
    description: |
      מה נדרש: MEASURED on the HP office, 2026-10-10 04:17-04:30, read-only (the two access logs' routes and times, and the containers' cpu.max / cpu.stat read from the host's cgroup tree). WHAT A PERSON SEES: the first window opened after the console's page loads is slow - the drive was drawn in 5.0s, then 3.2s, against 0.9-1.2s when it is opened again. WHERE THE TIME GOES: on the 3.2s load the drive answered each of its twelve requests in 0.00-0.19s (one, the first `/connections` after its start, in 0.82s), and the console - which carries every one of them - wrote its own line for the same request 351ms later for the page, 538ms later for `/connections`, 199ms for `app.js`, 160ms for `/readyz`: 1.45s added in all; on the warm load it added 1-16ms each. WHY: the console's container is allowed 0.31 CPU (cpu.max `31000 100000`) - its compose file declares 0.5, and .generated/cpu-budget.yml scales EVERY cap by 0.612 («Enabled services declare 26.15 vCPU of caps; the profile's budget is 16.00») - and one gunicorn worker with 48 threads serves the shell and proxies every byte of every embedded screen through it. During ONE walk of two windows (drive, machine; 15.5s on the clock) the kernel held the console back in 37 of 68 periods, 3.05s in all, while it used 1.40s of CPU; since it started: held in 2310 of 17741 periods, 165.8s in all. The same walk: machine (allowed 0.46) held in 51 of 99 periods, 3.67s, and drawn in 2.8s; the drive (0.61) not held at all.
      קבלה: while a window opens the console is not held back by the kernel (cpu.stat's nr_throttled does not move during the windows suite on two tiles) - the one process every screen passes through is not scaled by the same factor as a batch worker: the budget keeps a floor a service declares for itself, or the console's own cap is what an opening measures; the first window opened after the console's page loads is drawn within 2s on this office; the suite's «drawn in» times of the walk are kept beside the photographs as they are today, so the number is read again after the change.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-10 — הכלל של הבעלים ב-DGO-507 («אם לוקח יותר מידי זמן אז לדווח באג»): שלוש מדידות של הפתיחה הראשונה של הדרייב אחרי בנייה מחדש (5.0, 3.2, 1.9 שניות). התקציב (scripts/perf-profile-apply, perf-profiles.yml) והקונסול אינם שלי: לא שיניתי אף מגבלה ולא בניתי את הקונסול מחדש.
- key: o-docs
  name: תיעוד, כללים וניקיון
  status: backlog
  description: מסמכים, כללי עבודה קבועים, ניקוי קוד ומבנה הריפו.
  items:
  - key: doc-001
    name: לרכז את 37 כללי העבודה הקבועים של הבעלים במקום אחד שכל סוכן קורא
    priority: high
    labels: []
    description: |
      מה נדרש: הכללים שלמטה נאמרו בשיחות (חלקם עשרות פעמים) ואינם כתובים במקום אחד. לכתוב אותם ב-AGENTS.md (או במסמך שהוא מפנה אליו), בלי כפילות ובלי סתירה עם מה שכבר שם, ולוודא שגם הסוכן בלשכת המק קורא אותו.
      הכללים, מהנאמר הכי הרבה:
      - עבוד באוטופילוט מלא: בלי עצירות ושאלות; במקום להעביר לבעלים, העבר לסוכן-משנה (×35; «no handoff!!!. continue fully auto pilot lots of work ahed»)
      - אל תפסיק לעבוד עד שהכל גמור: בלי בקשות אישור, עם hook ועם ניטור מינימלי (×22; «how can i make sure that you never stop working until work completed. dont just say yes.. really ensure put ho»)
      - נטר תמיד בזמן אמת: בלי שינה ארוכה (עד 60 שניות, עדיף 15) והצג התקדמות ולוג חי (×16; «i want you to remember this once and for all.. no long sleeps!! max 60s better 15s»)
      - אל תישן ואל תריץ לולאות המתנה: בדוק התקדמות אמיתית בלוגים כל 30 שניות (×15; «never sleep, alwase pay attention eash 30s to progress»)
      - עבוד באוטופיילוט: בלי לעצור, לחנות משימות או לבקש ממני מה שאפשר לעשות לבד (×14; «wtf why do you stall this??? get to work fast fully autpilot dont park stuff»)
      - הצג בכל סבב את כל סרגלי ההתקדמות: הושלמו/שעה, מסווגים, CPU, שגיאות ותקועים (×14; «also give full progress report with all 15 bars i ever asked for»)
      - בצע QA תמיד בכרום האישי של הבעלים דרך כתובות אמיתיות ולא IP; browser42 רק ל-OAuth (×14; «use broser use: eg my private chrome browser on pc i use. you use it best.. use the browser42 only for oauth t»)
      - עבוד באוטופיילוט מלא בלי עצירות ובלי להעביר משימות חזרה לבעלים (×12; «i want you to swear to complete this workday without any requests from me, you got all context and acceess you»)
      - תקן שורש בצורה מינימלית וגנרית, לעולם אל תשנה מסמכים כדי לעבור, ותמיד תקן רגרסיות (×12; «alwase fix regressionss!! mylstvn, it used to work, i am very frustrated from this endless loop»)
      - נטר תמיד לוגים והתקדמות פקודות וסאב-אגנטים, ואל תישן (×12; «i mean alwase monitor the progress of commands that they run and not just sleep»)
      - ענה בקצרה ובטקסט, לא בקבצי דוח: עד 10 מילים כשהוא מבקש (×12; «from now answer in 10 words max. remeber this»)
      - שמור על כלל הגבול: עבוד רק בתוך הפריט; בדוק עומס ודיסק לפני build ונקה אחריו (×10; «כלל הגבול: הפריט הוא גבול — לא לאבחן/לשנות אפליקציות אחרות, לא dc up/build מחוץ לאפליקציה שבפריט»)
      - שמור על פשטות: הסברים קצרים וברורים ופתרונות בלי סיבוך מיותר (×10; «please explain clearlyl what is going on. no lots of words»)
      - עבוד ברציפות בלי לעצור: בלי שאלות, תירוצים, העברת משימות או הערת סוכנים אחרים (×9; «dont need my pick choose whatever you want never block like this»)
      - כללי compose ו-build: קובץ שלם + dc config, df לפני build, prune אחריו, אחד בכל פעם (×9; «כלל מעכשיו לכל עריכת compose: כותבים את הקובץ השלם, ומריצים dc config לפני כל דבר אחר»)
      - בצע QA דרך הקונסול והדפדפן עצמו, בלי לפתוח לשונית חדשה בכל צעד (×8; «no dont qa the indox page alone, alwase use via the console»)
      - ענה קצר ופשוט על מה שנשאל, לפני שמשנים משהו — בלי קירות טקסט (×8; «stop giving me half answers with loads of texts»)
      - ערוך קבצים רק בכלי Read/Edit, ענה קצר ואל תריץ פקודות חיפוש ארוכות (×8; «use only the file read / edit.. never patch like that using code»)
      - אל תשאל שאלות: בחר, תעד והמשך לפריט הבא עד שהכול מושלם (לא ask_user_question) (×8; «תפסיק עם השאלות תשלים הכל לבד ותמשיך עד שמושלם»)
      - אל תבטל צימוד ואל תפעיל מחדש את המנוע של המק בלי הבעלים ליד המחשב (×8; «אל תבטל צימוד ואל תפעיל את המנוע בינתיים.»)
      - קרא שוב את 100 ההודעות האחרונות שלי בכל סבב ושמור צ'קליסט של מה שהתבקש (×7; «make sure my last 100 messages fully addresed (check list)»)
      - כתוב 'תפילה' מאוחדת לסוכן פיתוח אוטונומי לחלוטין, בלי ציפייה להתערבות אנושית (×7; «merge all preyre into one final prayer that aims for trully autopilot, and eknoladges that no humen can ever r»)
      - קח אחריות מלאה: זהה בעצמך קיפאון והוכח שורש לפני שמדווחים (×7; «make sure you see the same thing i see and detect them on your own»)
      - אל תסבך: פתרון אחד פשוט ויציב, בלי קוד slop (×6; «are you sure your not over complictaing ? we need clean stable version no slop code.»)
      - לפני כל מחזור שחרר את כל הנעילות וודא שאין ריצות פעילות (×6; «did you unlock all before every cycle ?»)
      - המשך לעבוד עד שהכול הושלם — צור לעצמך משימות ואל תעצור (×6; «I need you to continue until everything is completed.»)
      - הצג תוכנית לפני שינוי מהותי, ובמשימה שניתנה — בצע עד הסוף בלי שאלות (×6; «שנייה תן לי את כל התוכנית לפני שאתה מתחיל לבצע»)
      - שמור על קוד מינימלי ונקי — פתרון בשורש ולא סקריפטים וטלאים מעל (×5; «וגם הקוד צריך להיות מינימלי ונקי כמו זהב טהור»)
      - שאלה אינה הוראה: אל תשנה, תמחק או תחזיר כשרק שאלתי (×4; «no dont prune!!!! i asked a question»)
      - בצע הכול בעצמך — אל תעביר לבעלים פקודות או משימות להרצה (×4; «לעולם אל תעביר לי משימות!!! יש לך את היכולת לעשות הכל!»)
      - הכול דקלרטיבי וחלק מהמערכת — אל תבקש ממני להריץ פקודות או חומת אש ידנית (×4; «הכל חייב להית דקלרטיבי וחלק מהOS»)
      - נטר בסבבים קצרים של 2–5 דקות — בלי שינה ארוכה ובלי polling ארוך (×3; «בחיים אל תשן כזה הרבה כשאתה מנטר מקסימום 2-5 דק»)
      - אל תיגע בהגדרות הניקוז והמקביליות — הניקוז נשאר דלוק ו-drain B נשאר 500 (×2; «turn it on and never turn off again !! dont mess with settings !!»)
      - קשר לשכות בלי SSH ובלי פקודות ידניות: מתקינים לשכה ומקשרים מהמסכים, בכל סדר (×2; «החלטת הבעלים היום: בלי SSH ובלי פקודות ידניות.»)
      - תן תמיד קישור לכל הרצת n8n שהרצת (×1; «alwase give link to executions you execute»)
      - דווח בנפרד שינויי בדיקות ושינויי פתרון — התאמת בדיקה כדי לעבור היא חריג (×1; «devide into test changes and solution changes to clear when you adjusted the tests and when the actual solutio»)
      - השתמש במונח 'מופע' ולא 'tenancy' בקוד, בתיעוד ובכלי הסוכנים (×1; «and make sure he stops using the word tannecy and uses instance instead.»)
      מקור: כל הסשנים, יולי עד אוקטובר 2026
  - key: doc-002
    name: תעד ארכיטקטורה ותוכנית שחרור והצג ויזואלית את ה-OS ואת זרימת bbox run
    priority: medium
    labels: []
    description: |
      מה נדרש: Keep one current architecture-and-release plan (layers, one owner per fact, every remaining task) and visualise the OS architecture, its tooling and the bbox run flow in all cases with minimal splits. The plan exists; the visuals are missing.
