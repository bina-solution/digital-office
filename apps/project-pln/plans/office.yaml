  - key: eng-039
    name: 'ה-HP על קצה הזיכרון: WSL הפסיק לענות לשתי דקות — והמסך «מכונה» לא מראה את זה'
    priority: high
    labels:
    - תשתית
    - באג
    - HP
    description: |
      מה נדרש: On 2026-10-06 at 18:18 every `wsl.exe` call on hp-laptop failed for about two minutes ("Wsl/Service/0x8007274c" — the connection to the VM timed out) while the office itself kept answering in 20 ms. Windows had 275 MB of 16 GB free: the WSL VM 6.5 GB (45 services of this office, eight of the neighbouring one; a sixth app stack, the office browser, was switched on the same afternoon), the browser 2.2 GB, the Claude app 2.1 GB. Releasing the VM's clean page cache gave Windows 1.3 GB back and the calls answered again. Three things follow: (1) the «מכונה» screen shows the VM's memory (65%) and says nothing about the machine the VM lives on, which is the one that ran out; (2) nothing warns before an app is switched on that the machine has no room for it, and nothing says afterwards that it is short; (3) the profile this machine is sized by is the smallest one (`ci-small`) although a profile for exactly this kind of machine exists (`wsl-10g`) — find out why it is not the one chosen.
      קבלה: the machine screen shows the host's free memory beside the VM's, with a state when it is short; switching an app on says what it will cost against what is free; the profile choice on hp-laptop is explained in one line of `bbox run`.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-06 (נמדד בזמן העבודה)
  - key: eng-040
    name: 'קובץ המצב שב-git הוא המצב של לשכה אחת: כל התקנה חדשה מתחילה ממנו, ו-pull מחליף או חוסם כל לשכה אחרת'
    priority: urgent
    labels:
    - תשתית
    - באג
    - בעלים
    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/one-offices-desired-state-is-what-every-clone-starts-from.yaml · נפתח 2026-10-06 · סטטוס שם: blocked
      מה נדרש: platform.state.yaml is tracked, so git carries one office's runtime. The copy on dgo-pair AND on origin/dgo since b7f3ba9c is the Mac office's: 13 of 39 apps on, notifications/machine/n8n/drive/mail/indox off "by: user", and its `remote:` block for vps1. A fresh clone starts from that; a pull on an office whose copy is unchanged takes it silently; a pull on an office whose copy is changed is refused; the HP hides its copy with a per-clone git flag. Gate G23 is red over it.
      ההחלטה של הבעלים: (1) the office's file leaves git and a tracked platform.state.default.yaml holds what a fresh install starts from — prepared, not applied; stopping to track a file three offices share is the owner's step. (2) the default list: 19 of 40 apps on (the platform, n8n, drive, mail, indox with apitools, bina-ds) and the ten apps that joined later off.
      אזהרה עד אז: before any pull on vps1, set its platform.state.yaml aside — origin/dgo's copy is the Mac office's.
      קבלה: a fresh clone compiles the product default; `git pull` changes no office's apps; no office needs a git flag; G23 green on a clean clone.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-06 (נמדד בזמן העבודה)
  - key: eng-041
    name: 'שלושה שערים שדורשים מערכת חיה רשומים ונבדקים בעצמם — ואף אחד לא מריץ אותם'
    priority: medium
    labels:
    - תשתית
    - באג
    description: |
      מה נדרש: `scripts/refactor/run-gates.py` keeps a LIVE_SET — the gates that need a running stack — and its own `unwired_gates()` counts membership there as "wired". Nothing invokes `run-gates.py --live`: no script, hook, workflow or bbox verb (grep, 2026-10-07). G70 sat there for six weeks and, once run, turned out to pass without comparing anything on a ported office; it has callers now (`bbox run`, `bbox baseline` P3). The other three are still asked by nobody: G61 published-drift-lint (an ACTIVE n8n workflow runs the body you can read), G69 declared-db-objects-lint (every object a tracked .sql declares exists after onboard), dock-fit-lint --live (the desktop dock's measured capacity). What each says on a fresh stack has not been measured, so they were not wired blind. Note for whoever wires them: `gates.sh --verify-ci` refuses a `*-lint.py` named in ci-verify.yml unless it is in the static GATES list — a live gate is called from baseline.sh or bbox, not from the workflow.
      קבלה: each of the three is either scored by `bbox baseline` with a measured green on a fresh stack, or leaves LIVE_SET with the reason written; `unwired_gates()` no longer accepts a list nobody runs as "wired".
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (מיון eng-010 / sec-006 מול הקוד)
  - key: eng-042
    name: '`bbox status` קרא לשלוש מכולות הקישור «לא מה שהקבצים אומרים» אחרי כל בנייה חלקית: שלושה שירותים בנו image אחד'
    priority: medium
    labels:
    - תשתית
    - באג
    description: |
      מה נדרש: dgo-extend's app, tunnel (`dgo-net`) and door (`dgo-link`) each carried a `build:` of the one Dockerfile under the one image name. Compose stamps the building service's name on an image (`com.docker.compose.service`), so three builds were three image ids under one tag - measured 2026-10-07: the same last layer, the same creation time, three ids - and rebuilding any one of them left the others named by `bbox status` ("not what the files say now") with nothing different in them. A check that cries wolf after every rebuild stops being read.
      קבלה: one service builds and two name the image; on hp-laptop one bring-up puts the three on one id and the app rebuilt alone, unchanged, re-creates nothing and leaves the list empty; a throwaway compose project shows what a fresh machine does (the image built once for all three; a sidecar started alone has nothing to build from and says so); G15 knows an image some service builds is first-party (self-test 8/8).
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (אחרי הבנייה מחדש של ui2-031)
  - key: eng-043
    name: 'הסימולציה: כל חלון של מצב שולחן העבודה היה ריק — הבנאי הריץ כל קובץ JS ב-eval, ו-`let MODULES` לא נראה ל-desktop.js'
    priority: high
    labels:
    - תשתית
    - באג
    description: |
      מה נדרש: `digital-office/sim/build.mjs` inlined each `<script src>` as base64 run through `(0,eval)`. Indirect eval keeps a file's top-level `let`/`const` to itself, and a page's files share them: the shell's desktop.js reads app.js's `let MODULES`, found none, and no desktop-mode window was given its frame's address - a title bar that said the module's id over a blank body. A console-own view in a window (`/?bare=1#/m/install`) showed the browser's listing of the disk's root. And a build always rewrote the tracked `platform-sim.html`, so one test's build changed the file under another run that was reading it.
      קבלה: an inlined script runs as a script element in its tag's place (the page's own scope); a console-own view's window shows that view; `SIM_OUT=<file>` builds elsewhere; every flow suite passes on the new build at both sizes and the simulator's audit says all apps are embedded.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (נמצא כשסוויטת החלונות אמרה «אין תוכן» על כל מסך)
  - key: eng-044
    name: 'שלושה כלים איתרו את «הקונסול של הלשכה הזו» כל אחד בדרכו — ושניים מהם נפלו ל«כל קונסול שעל המנוע»'
    priority: medium
    labels:
    - תשתית
    description: |
      מה נדרש: The live map, the parity tool and the dock gate each found the console's container their own way, and the windows gate was about to be the fourth. Two asked by the compose service of this checkout and fell back to ANY console on the engine - on an engine that carries a neighbour office that is the wrong office, taken exactly when the right one is missing; one asked by the deployment's name.
      קבלה: one lookup (`scripts/refactor/office_browser.py`: the service of this checkout, then this deployment's name, a hash-renamed container last, never another office) and all four callers ask it; on hp-laptop each gives the address docker itself gives, and the live map renders through it.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (נמצא בכתיבת G81)
  - key: eng-045
    name: 'הענף של לשכת ה-HP הוא hp-dgo: העבודה שנעשתה על dgo-pair עוברת אליו קדימה, והלשכה חוזרת לעמוד עליו'
    priority: urgent
    labels:
    - תשתית
    description: |
      מה נדרש: The owner, 2026-10-08: "what is dgo-pair branch ?  you are on hp dgo so branch needs to be hp-dgo". `dgo-pair` is a branch the HP office's agent opened by itself on 2026-10-04 (from `mac-dgo`@bba447d8, pushed the same minute) as a meeting branch for the HP's and the Mac's agents while the two offices were being paired. This checkout left `hp-dgo` for it that day and has committed there since: 313 commits past `hp-dgo`@4ebe96f6, 280 the HP's and 33 the Mac's. The owner never asked for it. An office commits on its own branch.
      קבלה: `hp-dgo` is an ancestor of all that work (measured: 0 commits only on it), so it moves FORWARD to the same commit - no merge commit, nothing re-developed, no history rewritten; this checkout stands on `hp-dgo` with its tree untouched (the office keeps running, the uncommitted work stays where it is); `origin/hp-dgo` carries it and is where the HP office's commits land from now on; nothing more is pushed to `dgo-pair` from here, and the branch is not deleted (deleting a branch is the owner's); the Mac office is told where to merge the HP's work from; the one thing on this branch that is not the HP's - `platform.state.yaml` at this commit is the Mac office's set and the HP keeps its own by a git flag (eng-040) - is written on the item.
      מקור: הבעלים, 2026-10-08 (הודעה בסשן של Claude Code בלשכת ה-HP)
  - key: eng-046
    name: 'dgo-stable: כל מה שיציב ממוזג אליו, והעבודה ממשיכה על הענף של הלשכה'
    priority: urgent
    labels:
    - תשתית
    description: |
      מה נדרש: The owner, 2026-10-08: «תמשיך על כל המשימות תדבר עם עזריה במק כדי לייעל ולעבוד יותר מהר ותמרגג את כל מה שיציב לתוך dgo-stable ותמשיך לעבוד על dgo-hp». There was no `dgo-stable`; it is opened at the commit both offices' pushed work stood on and that passed the whole round (f889931b: the gates with only the four known reds, the windows suite, the simulation's flows at both sizes). From here an office works on its own branch (`hp-dgo` here), a commit goes into `dgo-stable` once it has passed that round, and an office takes the others' work by merging `dgo-stable`.
      קבלה: `origin/dgo-stable` exists and holds nothing that did not pass the round (said in AGENTS.md, rule 6); the Mac office's agent knows where the HP's work is and merges it rather than writing it again; `dgo` itself - what the VPS pulls - is not moved by this.
      מקור: הבעלים, 2026-10-08 (הודעה בסשן של Claude Code בלשכת ה-HP)
