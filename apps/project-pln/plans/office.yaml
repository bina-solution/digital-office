  - key: qa-038
    name: 'שער אדום על הבסיס: app-tag-lint — לירוק'
    priority: medium
    labels:
    - תשתית
    - HP
    description: |
      מה נדרש: `python3 scripts/refactor/app-tag-lint.py` fails on the base branch too. Measured 2026-10-09 (gates.sh on the HP office): 92 workflows checked, 6 fail — four of google-workspace-agent (gDriveMcpAgent01, gSheetMcpAgent01, gmailMcpAgent01, gwaHealthCheck01) missing `app:google-workspace-age` (the `app:<id>` tag cut to n8n's tag_entity varchar(24)), apps/mail/mail01 missing `app:mail`, and platform-base/n8n/workflows/indoxApiRouter01 missing `app:n8n`. The tag is the ownership signal `platform-base/n8n/hooks/pull` routes an exported workflow home by, so a workflow without it is un-owned in n8n. The fix is the documented n8n loop, per app: `bbox n8n pull <app> <wfId>` → add the tag → `bbox n8n push` (never edit code alone: the next pull would take the tag away again).
      קבלה: `python3 scripts/refactor/app-tag-lint.py` reports 0 failures on a clean clone, and the six workflows carry their app tag in the LIVE n8n instance, not only in the blueprint.
      ראיה: gates.sh 2026-10-09: `FAIL app-tag-lint — 92 workflow(s) checked, 6 failed`
      מקור: סשן עזריה בלשכת ה-HP, 2026-10-09 (הרצת gates.sh)
  - key: qa-039
    name: 'שער אדום על הבסיס: n8n-loop-order-lint — לירוק'
    priority: medium
    labels:
    - תשתית
    - HP
    description: |
      מה נדרש: `python3 scripts/refactor/n8n-loop-order-lint.py` fails on the base branch too. Measured 2026-10-09 (gates.sh on the HP office): two workflows re-enter a loop from a lane node instead of from the loop itself — `platform-base/n8n/workflows/processLock01.workflow.ts` ('Loop Over Items' re-entered from 'Create a label') and a second one ('Loop Over Items' re-entered from 'Edit Fields'). A node on the way back need not hand back what it was given, so the loop stops early or goes around on the wrong count. The gate has no auto-fixer on purpose: raise the work lane above the loop re-entry node on the canvas AND wire the loop's output to the loop itself, then let the lane end. Same n8n loop as qa-038: pull the workflow, fix the wiring, push.
      קבלה: `python3 scripts/refactor/n8n-loop-order-lint.py` reports 0 failures on a clean clone, and the two workflows are wired that way in the LIVE instance.
      ראיה: gates.sh 2026-10-09: `FAIL n8n-loop-order-lint` naming processLock01 and the 'Edit Fields' loop
      מקור: סשן עזריה בלשכת ה-HP, 2026-10-09 (הרצת gates.sh)
