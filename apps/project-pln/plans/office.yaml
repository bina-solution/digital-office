  - key: ui2-047
    name: 'הכתובת היא המצב: כל מסך בכל אפליקציה ניתן לקישור, לפתיחה ולשיתוף — ו-G83 אוכף את זה'
    priority: urgent
    labels:
    - ממשק
    - תשתית
    description: |
      מה נדרש: The console URL IS the state of the office — one address per screen, in every app: copy it, open it in another tab, send it to someone, and it lands on that screen. The shell already owns the whole mechanism (the grammar `#/m/<id>[/inner][?query]`, the `bina:route` postMessage it mirrors with replaceState, and the tail it hands back to the frame through joinEmbed, platform-base/console/static/app.js:943-1014), but only the shell and three of fifteen apps take part — so "the link" is not yet how the office works.

      בלשון הבעלים: «deeply understand that console link as state is required feature from all apps so everything can be linkable open and shared quick»

      ראיה/מדידות (2026-10-12, live, every module this office runs, measured against the console host):
      · PARTICIPATION — a route reported to the shell (`bina:route`): `incoming` (indox) and `mailview` only; `bina` gained it today (`plugins/session-link`, agt-007); the other twelve report nothing. Adopting an arriving route: `incoming`, `drive`, `mailview`.
      · ARRIVAL — a PATH tail (`/a/<alias>/folder/5`) is answered when it is a route the app knows: `drive` 200 on `/trash` (and its own router renders it), `my-docs` and `incoming` 200 on any path, `domains` 404 (its routes live in the FRAGMENT, which never reaches a server). An INVALID path (`/some/deep/route`) 404s everywhere — the first version of this measurement used one and over-read it as "twelve apps have no SPA fallback"; corrected by the same session's probe.
      · THE SHELL CAN OWN IT — measured with `ci-artifacts/route-contract/bridge-probe.py`: the shell reads the frame's own URL (same origin) and WATCHES it with no cooperation from the app (this engine has the Navigation API in the frame; wrapping the child's `history.pushState` also works — the shell observed `pushState -> /a/drive/trash` from a click in the app's own rail), and a path tail opens the right screen with no protocol at all (`#/m/drive/trash`).
      · The office's own tooling works around this instead of using a link: `scripts/ui-coverage/inventory.py` (rewrite_for_console) reaches a deep view by forcing the iframe src.

      קבלה: every embedded app takes part in the route contract — it adopts `?r=<its own route>` on arrival and reports its route back — so `#/m/<id>?r=<route>` opens that screen in the console, proven per app in a browser; one source (`platform-base/bina-ui/bina-route.js`, a G27 block) is the copy every screen carries, and gate G83 (`embed-route-lint`, in the CI set) fails an app that takes no part. A screen with no inner state takes part with the root route `/`; an app whose browser half cannot carry the block declares it in `app.json` (`module.route: {mode: custom, why: …}`) and the gate names it instead of passing it silently.

      מצב (2026-10-12, נבנה כאן): המנגנון קיים ומיושם — `platform-base/bina-ui/bina-route.js` (הבלוק: קורא `?r=` דרך הניתוב של האפליקציה עצמה ומדווח `bina:route` בחזרה; `read`/`write` לגבי אפליקציה שמנתבת ב-pushState), רשום ב-G27, ו-G83 `scripts/refactor/embed-route-lint.py` (‏`--self-test`, מחובר ל-ci-verify + ל-`scripts/ci/gates.sh` + ל-KNOWN_RED עם הנימוק) מונה כל אפליקציה מוטמעת שאינה משתתפת. ההצהרה ל-app.json נוספה לסכימה (`routing[].module.route`), ו-`bina` מצהיר mode=custom (חצי הדפדפן שלו הוא באנדל ספק — `plugins/session-link` הוא המימוש).

      ההצעה הנכונה (2026-10-12, אחרי שהבעלים ביקש דרך אחת סטנדרטית ומינימלית): **הכתובת של האפליקציה היא הנתיב — הקונסול משקף אותה, ואין פרוטוקול ללשכה בכלל.** הזנב של הקונסול הוא ה-URL של ה-frame כמו שהוא (`path[?query][#fragment]`), והקונסול *צופה* בו (‏Navigation API, ואם אין — עטיפה של `history.pushState` של ה-frame + `hashchange`/`popstate`; נמדד שזה עובד בלי שום שיתוף פעולה של האפליקציה). הבלוק, ה-postMessage וה-`?r=` נמחקים. ההצעה המלאה, חמש המדידות ונקיון מלא (7 סעיפים): `ai/context/platform-navigation-design.md` §6 + `ci-artifacts/route-contract/bridge-probe.py`. ממתין להכרעת הבעלים על המהלך (הצעה, לא בוצע).

      **בוצע (2026-10-12, אחרי ההכרעה «בלי סריקות וקוד מורכב»):** המנגנון היחיד שרץ הוא *זהות* — הזנב של הקונסול וה-URL של האפליקציה הם אותו מחרוזת תחת ה-mount (`#/m/drive/folder/5` ⇄ `/a/drive/folder/5`) — ומאזין אחד בקונסול (`watchFrameRoute})` על אירוע ה-`navigate` של ה-frame עצמו; אין polling, אין postMessage, ואין שורת קוד באפליקציה. נמדד אחרי ההרמה (`ci-artifacts/route-contract/navigate-probe.py`): `#/m/drive/trash` פותח את מסך האשפה, ולחיצה בסרגל של דרייב הכניסה לכתובת הקונסול `#/m/drive/p/home` — הנתיב של האפליקציה כמו שהוא; טעינה מלאה בתוך ה-frame ממשיכה לעבוד. נמחקו: הבלוק `platform-base/bina-ui/bina-route.js`, השורה ב-G27, החיווט ב-`apps/drive/static/app.js` (חזר זהה למה שהיה), ו-`module.route` מהסכימה ומ-app.json של bina (מעולם לא פורסם). הקונסול והדרייב הועלו. G83 כוון מחדש: „כל אפליקציה מוטמעת מחזיקה את המסך שלה ב-URL שלה” — וכרגע מונה 7: my-docs, any-concurrency, alerts, machine, computers, connections, dgo-extend (‏hello-bina מוצהר בשער עם נימוק: תמונה זרה שעונה משפט קבוע ואין בה מסך לנתב). נשאר: 7 האפליקציות, שני נושאי ה-postMessage (`mailview`, `incoming`), כיווץ `session-link`, והחצי הרצה של G83 (כל מסך מה-inventory נפתח בכתובת שלו).
      הומר ואומת: **drive** — `#/m/drive?r=%2Ftrash` פותח את מסך האשפה, סרגל הכתובת של הקונסול נשאר `?r=%2Ftrash`, וצעד בתוך האפליקציה („דף הבית”) נכתב לכתובת. הראיות: `ci-artifacts/route-contract/drive-before.log` (לפני: הקישור העמוק פתח את דף הבית) ו-`drive-after.log` + שני צילומים, וכלי הבדיקה `ci-artifacts/route-contract/console-route-qa.py`.
      נשאר (7, לפי G83): my-docs, any-concurrency, alerts, machine, computers, connections, dgo-extend — לכל אחת מסך/מצב שאינו ב-URL שלה, וכל אחת מקבלת נתיב בפרדיגמה שלה. (‏`incoming`, `sites`, `domains`, `app-management`, `mailview` מנתבות ב-URL כבר היום; `hello-bina` מוצהר בשער עם נימוק.)
      בוצע מאז (2026-10-12 בלילה): הבלוק `bina-route.js` ומנגנון ה-`?r=` נמחקו כליל; הקונסול קורא את ה-URL של ה-frame בעצמו (`watchFrameRoute`, אירוע `navigate` תקני, בלי polling); הזנב הוא ה-URL של האפליקציה כמו שהוא, ומסך הבית נכתב `#/m/bina` ולא `#/m/bina/`; drive הומר ואומת (וגם אחרי הפעלה מחדש); התוסף `session-link` של בינה הצטמצם למה שהוא עניין של האפליקציה (להחזיק את השיחה ב-URL שלה) וחצי ה-`postMessage` נמחק — ואומת בדפדפן על התמונה החיה.

      מקור: הבעלים, 2026-10-12 17:52 (בהמשך ל-agt-007; העיקרון של «המקור היחיד לסלקטור הוא הקישור» מ-2026-08-24, ai/context/platform-navigation-design.md)
  - key: ui2-044
    name: 'הסימולציה: העותקים שלה (INDOX, דרייב, דואר, וואטסאפ) עדיין מציירים סימנים כתווי גופן — ונסחפו מהאפליקציות החיות'
    priority: medium
    labels:
    - ממשק
    description: |
      מה נדרש: The simulation embeds the real frontends of most apps, and four screens it owns itself: forks of INDOX, the drive and mail (`digital-office/sim/apps/{indox,localdrive,mailview}`), its overlay, and `wadmin.html`. The live apps no longer draw a control or a mark with a character of a font; the forks still do. The close and clear crosses were carried over on 2026-10-08 (nine controls, with ui2-043). What is left, counted the same day as rows that draw a symbol where an icon would stand: about forty - add (＋), run (▶), refresh (⟳ ↻), upload (⬆), list (☰), the star (★), ticks and crosses of results (✓ ✗), chevrons (▾). The INDOX fork is the far one: it was seeded from the platform build and the live webapp has been rewritten since (its grid alone is twice the size), so patching marks one by one widens a gap that should close.
      קבלה: the census of the simulation's own sources shows no symbol character in what is drawn (a tick that IS the datum - a message's delivery state, a boolean cell - is told apart without the font's metrics, as ui2-042 says for the live screens); the INDOX fork is brought to the live webapp's components rather than patched, or the reason it cannot be is written beside it; the flow suites pass at both sizes with no JS error, and each changed screen is photographed in the window as it opens and at 380x260.
      מקור: סשן Claude Code בלשכת ה-HP, 2026-10-08 (מפקד הסימנים בעותקי הסימולציה, בזמן ui2-043)
  - key: ui2-045
    name: 'הטבלה המשותפת ו«המסמכים שלי»: כפתורי העימוד וההוספה עדיין מצוירים כתווי גופן, ולעימוד אין שם'
