  - key: eng-012
    name: browser42 מצהיר על 3.7 GB ו-6 vCPU על VM של 4.9 GiB, ולפלטפורמה אין בקרת קבלה לפי זיכרון
    priority: high
    labels:
    - באג
    description: "קובץ ה-issue (המדידות והניתוח המלא): issues/resource-management-browser42-and-platform.yaml · נפתח 2026-09-18 · סטטוס שם: open\nהכותרת בקובץ: Resource management: browser42 declares 3.7 GB / 6 vCPU on a 4.9 GiB guest, and the platform has no memory-aware admission\nתקציר: On an 8 GB Mac (5 GiB Lima guest) `bbox run` starts 43 containers, the guest ends at 78 MB free with no swap, the console lags, and the 300 s health gate times out — browser42 alone declares 3.7 GB across six containers and defaults to 6 vCPUs on a 4-vCPU guest; nothing sizes the enabled set to the \nמשימות בקובץ:\n- browser42: cut default cpus from 6 to 2 and memory to ≤1G; drop the reservation block\n- browser42: declare a machine envelope (requires.mem_gb ≥ 8) and have the resolver honour it\n- app.schema.json: add `requires: {cores, mem_gb}`; resolver sums enabled limits vs docker host at render\n- bbox apps disable <app>: stop + remove that app's containers (volumes kept) instead of 'run bbox run'\n\
      - health gate: on timeout print free memory, container count, declared sum, largest optional apps\n- Render cost of transitively-pulled optional apps (supabase via drive) in `bbox apps list`\n- macOS engine: give the guest swap (or zram) so over-commit degrades instead of stalling\n- engine.sh: when `shell`/`exec` finds the guest Stopped, SAY it died (and keep the previous serial log) before auto-starting\n- [בוצע] Record measured per-container memory for ci-small on this Mac (docker stats) in this issue\n- supabase: capability-scoped render — drive needs storage+kong+rest, not studio+meta (~380 MB)\n"
