    priority: low
    labels:
    - indox
    - באג
    description: |
      מה נדרש: On a line that mixes Hebrew with a number in parentheses a PDF extractor returns the runs left to right: the supplier «אגן מפעלי הנדסה (1988) בע"מ» comes back from `page.get_text()` as «) בע"מ1988( אגן מפעלי הנדסה». `apps/apitools/src/ocr_core/pdf_textlayer.py` walks a Hebrew line's spans right to left for its WORD BOXES, but hands `fullTextAnnotation.text` on exactly as the extractor gave it (and inside one span the tokens keep the extractor's order too: `)1988(`). Measured 2026-10-07 on the committed synthetic corpus: 17 of 90 PDFs - every document of that one supplier - do not contain their own company name in the full text. Whatever matches a company NAME against the full text (the full-text fallback of the json query; `ocr_api`'s `fullTextAnnotation.text.split()` reading) misses such names. Not changed blind: it is the extraction path, and its suites need an office that runs apitools with its engines.
      קבלה: the full text of a born-digital PDF reads each Hebrew line in reading order (the name above is found as written), proven on the corpus (90 of 90) and with the feature-validation suites green before and after.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (qa-023, מדידת הקורפוס הסינתטי)
  - key: app-051
    name: 'שער ה-API (kong) מריץ worker לכל ליבה של המארח: בשרת הוא צמוד לתקרת הזיכרון ו-worker נהרג כל חצי שעה'
    priority: high
    labels:
    - באג
    - תשתית
    description: |
      מה נדרש: On 2026-09-03 the server session found `supabase-kong` pinned at 767/768 MiB with an nginx worker OOM-killed every 30-40 minutes (34 times in one boot) - container-local, so it never took SSH down, but kong is on the document path and every kill drops the requests in flight. It was left open that day and written nowhere. Cause, measured 2026-10-07 on hp-laptop: kong's default `worker_processes auto` starts one worker per HOST core whatever the container's 0.5-CPU cap says, each with its own LuaJIT VM - 6 workers at 81-84 MB, 480 of 768 MiB with no traffic; on the 8-core server ~670 MiB at rest. The limit had been raised once already (512M -> 768M, 2026-08-06) for the same symptom.
      קבלה: the gateway's footprint does not depend on the machine's core count and sits well under its limit. In the tree: KONG_NGINX_WORKER_PROCESSES=2 - on hp-laptop 134 MiB (17%) against 480 (63%), same answers on five probes. STILL OPEN: on the server after the owner's merge - `worker_processes 2;`, memory under a third of the limit, and `oom_kill 0` in the container's memory.events after a day.
      מקור: הסשן של Claude Code על השרת, 2026-09-03 (נמצא ונשאר פתוח) · הסשן בלשכת ה-HP, 2026-10-07 (נמדד ותוקן)
  - key: app-052
    name: 'apitools: תלות שאף קובץ לא מייבא (layoutparser), ושני קובצי בדיקת API שאף מסלול לא יכול להעביר'
    priority: low
    labels:
    - תשתית
    description: |
      מה נדרש: Two leftovers the tests lane named when it first ran apitools' tests in the app's image (2026-10-07). (1) `requirements.txt` pins `layoutparser~=0.3.4`, and with the exploratory test file gone nothing in the tree imports it. It is not free: it pulls the GUI build of OpenCV over the headless one, which the Dockerfile then has to undo (`--force-reinstall --no-deps` of opencv-python-headless, with a long comment on why) - a package nobody uses, and the conflict it causes. (2) `tests/test_api.py` and `tests/test_doc_exists.py` ask a server on 127.0.0.1:8080, so they are not unit tests (the gate names them as that), and by the app's own README they would not pass against a running one either: the first expects the root to answer "Hello API!" where the app answers a JSON object, the second mixes GET and POST on a GET-only endpoint. No lane runs them. Not changed from hp-laptop: it does not run apitools, and (1) is a rebuild of its image.
      קבלה: on an office that builds apitools - the image builds without layoutparser and without the reinstall step, `import cv2` works in it, and the seven unit files pass there (`plane-tests-lint.py --in-images`); the two API files either assert what the API answers and are run by `bbox test apitools` against the running service, or are removed.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (qa-032)
  - key: app-053
    name: 'סוויטת החלונות על לשכה שמריצה את שאר האפליקציות (מייל, INDOX, מסמכים שלי, נכסים, אתרים…) — ולתקן מה שהיא מוצאת'
    priority: high
    labels:
    - ממשק
    description: |
      מה נדרש: hp-laptop runs thirteen screens; the windows suite passed on all of them in real desktop mode (qa-035). The apps this office does not run were seen only in the simulation (INDOX's and mail's forks, my-docs' real page) or not at all (digital-assets, sites, domains, social-list, telegram-tv, git accounts, chat). On an office that runs them - the Mac, after it takes `dgo-pair` by merge and one `./bbox run` - `python3 digital-office/sim/flow-qa.py windows --url <its console>` photographs each in both windows and names what is squeezed, cut or scrolling sideways. One defect is already known from the code: the app's mail screen has the same status line the simulation's fork had (a flex row of text and links with no wrap - on a phone «טען עוד» and «דואר בדיקה מוסתר — הצג» each broke in two); the fork's two declarations fix it.
      קבלה: the suite passes on that office in both windows of every screen it draws, with the photographs looked at; each defect it names is fixed at its owner (a shared block where the block is the owner) and the suite is run again.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (ui2-035)
  - key: app-054
    name: 'נכסים דיגיטליים, דומיינים, אתרים ורשתות חברתיות: לכל אחד עותק פרטי של כותרת העמוד — ואף אחד מהם לא עבד בחלון קטן'
    priority: high
    labels:
    - ממשק
    description: |
      מה נדרש: Four screens each carried a private copy of the same heading (`.app-header`: a title, a sentence, actions - four rules, the same numbers), so none had a tier for a small window and the windows suite, which reads `.pg-head`, did not measure them. Seen 2026-10-07 with the MacBook awake: digital-assets through the link in hp-laptop's desktop mode (its heading ended at 133px of a 530px window and its five numbers at 475px; in the smallest window the heading was the window; a template's three facts left an empty grey cell; the channels' table took the page 220px sideways at 380px), and the other three from disk (their heading ended at 122 to 148px of the window).
      קבלה: the four carry the office's page heading (stamped, G27), their title stays in the smallest window because it names a view (`data-view`), digital-assets' numbers are a row and its facts have no hole; each seen again in a window - from disk for the three, on the MacBook's own page for digital-assets.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (DGO-443, כשהמק היה ער)
  - key: app-055
    name: 'טלגרם-TV אומר «Failed to fetch» כשהשירות לא עונה, ושורת המצב של המייל נשברת בטלפון באמצע קישור'
    priority: medium
    labels:
    - ממשק
    - באג
    description: |
      מה נדרש: Two things in apps hp-laptop does not run, found by opening their pages from disk at window sizes. telegram-tv's request helper let `fetch`'s own rejection through and called a refusal without a sentence «שגיאה 502»: with the service down its banner read «טעינת האפליקציה נכשלה: Failed to fetch». The mail screen's status line is a flex row that could not wrap: at a phone's width «טען עוד» and «דואר בדיקה מוסתר (1) — הצג» each broke in two.
      קבלה: telegram-tv uses the office's wording for a failed request (bina-said, stamped) and says «אין תשובה מהשירות»; the mail line wraps between its parts and a link in it is one line - each measured on the app's own page from disk.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (DGO-443)
