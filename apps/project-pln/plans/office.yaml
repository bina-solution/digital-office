    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/n8n-encription-rotate.yaml · נפתח 2026-06-14 · סטטוס שם: open
      הכותרת בקובץ: SECURITY: Rotate exposed secrets (n8n encryption key + more)
      תקציר: Credentials were committed to git and pushed to GitHub; files were removed but the values MUST be rotated (git removal alone does NOT make them safe).
      משימות בקובץ:
      - [בוצע] Saved missing gdrive OAuth creds to `.env`
      - [בוצע] Removed all 9 secret files from the project; scrubbed `obsidian/References/n8n/Credentials.md`
      - [בוצע] Hardened `.gitignore` (`.env.*`, `data/db-dumps/`, `data/chat.json`, `**/gdrive_credentials.json`, etc.)
