      הכותרת בקובץ: project-pln: the tile opens Plane OUTSIDE the office, signup is open, a CI placeholder account owns the seeded Hebrew workspace, and a new project still gets English states
      תקציר: Audit of the live instance against the owner's three acceptance points (inside the office like every app; 100% Hebrew incl. seeded defaults; fast). Fast is met and the Hebrew build is live, but: routing.module is embed:false/external:true so the console shows the very notice card the owner rejected;
      משימות בקובץ:
      - Console: for module.external, showEmbed(externalUrl(m)) in the content frame (desktop window as today); the notice card only when the frame does not load. Acceptance: tile → Plane renders in the pane; sign in; reload the console; still sign
      - Owner decision: DEV_DOMAIN=bina.localhost (every app at <app>.bina.localhost:8080) so console and plane are the same site on the Mac edge; the VPS domain is already same-site
      - patches/hebrew-states.py: DEFAULT_STATES → לביצוע-ממתין/לביצוע/בתהליך/בוצע/בוטל (names only; group/colour/sequence kept), anchors asserted, build refuses on drift. Acceptance: a project created in the UI and one via POST /api/v1/…/projects/
      - hooks/onboard: refuse a placeholder owner (ci@local.dev, *@local.dev, your-*) and name the .env key to set; then PLANE_OWNER_EMAIL=<the owner> and re-run onboard (idempotent) so the owner is the instance admin of 'המשרד'
      - Owner decision: keep/delete workspace bbb (offer: rename its five English states in place, UUIDs kept) and delete the ci@local.dev account
      - bootstrap.py: ENABLE_SIGNUP=0 once the owner exists; route auth:sso at the edge (CE has no OIDC — Plane's own login stays, the host stops being public). Acceptance: /sign-up says disabled; unauthenticated host request 302s to authentik
