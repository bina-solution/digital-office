    priority: high
    labels:
    - באג
    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/a-linked-office-tile-fails-blank-and-no-surface-says-why.yaml · נפתח 2026-10-04 · סטטוס שם: open
      הכותרת בקובץ: A linked office's app tile fails as a blank frame with no sentence, because the console can only detect a failed frame that is same-origin — and the liveness field it reads is never written
      תקציר: On vps1's console the `bina.macbook` tile ('בינה ודעת', this MacBook's `bina-ds`) opened a cross-origin frame whose content never painted; the owner saw the browser's dead-frame placeholder and nothing else. `externalFallback()` returns early for cross-origin frames, `REMOTE_DOWN` is therefore never
      משימות בקובץ:
      - Write `ok`/`at`/`cause` into `/app/peers.d/*.json` from `remote-status.json` (dgo-extend/peers.py)
      - Render the offline mark in the rail/home/palette/dock from that field before opening, and clear it on recovery
      - Pre-flight `external`/`remote` modules in `openModule` and render `renderExternalNotice()` instead of a dead frame
      - Add the cross-origin frame watchdog (heartbeat through the door or postMessage wrapper)
      - Extend the notice to name the hop (tunnel / door / edge / SSO / container) and offer its action
      - Fault-injection fixture + flow-qa suite at desktop and mobile that asserts the card names the broken hop
      בלשון הבעלים: «תחקור לעומק איך התצוגה מנגישה מצבים של ניתוק וכו ואיך להביא סטאנדרט הכי גבוה של מערכת ושיהיה ברור מה בדיוק קורה» · «תנתח לעומק צילומי מסך של כל המצבים ותבנה מערכת מושלמת»
  - key: ui2-004
