    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/indox-efficiency-diagnosis-2026-08-10.yaml · נפתח 2026-08-10 · סטטוס שם: open
      הכותרת בקובץ: INDOX efficiency diagnosis — the complete journey of one document, the measured time and resource budget of every stage, the complexity that makes it worse as the corpus grows, and the ranked plan for
      תקציר: The pipeline spends 292 n8n executions and ~1.7 hours of amortized wall time to finish ONE document, against a floor of 41-51. It is currently creating ~29,000 executions/hour and completing 20 documents/hour — roughly 1,450 executions per completed document. Two mechanisms account for almost all of
      הקובץ אינו מפרט משימות: לאמת מול הקוד אם עדיין קיים, ואז לתקן או לסגור עם הוכחה.
