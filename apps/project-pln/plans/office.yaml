      הקובץ אינו מפרט משימות: לאמת מול הקוד אם עדיין קיים, ואז לתקן או לסגור עם הוכחה.
  - key: sec-006
    name: 'authentik-bootstrap לא תקין כ-15 שעות: ה-outpost לא למד שני hosts חדשים ואף אחד לא טיפל'
    priority: high
    labels:
    - באג
    - אבטחה
    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/authentik-bootstrap-unhealthy-for-fifteen-hours-two-sso-hosts-unserved.yaml · נפתח 2026-09-30 · סטטוס שם: open
      הכותרת בקובץ: authentik-bootstrap: unhealthy for ~15 hours because the embedded outpost never learned two new gated hosts (digital-assets, social-list) — and nothing acted on it
      תקציר: authentik-bootstrap-local reports `running unhealthy` with a failing streak of 4851 probes (≈15 h), every probe saying `outpost not serving: digital-assets.localhost,social-list.localhost`. Its last successful run configured the outpost for the 21 gated hosts of 2026-09-22; the two auth:sso apps add
      משימות בקובץ:
      - [בוצע] Re-run the outpost sync at a quiet moment; verify 23 hosts served and the two hosts gate (302 to authentik unauthenticated)
      - [בוצע] Reconcile: adding/removing an auth:sso route triggers the outpost sync (or the probe repairs instead of only reporting)
      - [בוצע] The outpost reload after an apply must not depend on a hand restart of authentik-server: bbox (which has the socket) restarts it when outpost-ready reports 'waiting on' for > 3 min with every missing host attached in the DB; the bootstrap i
      - binaos.autoheal on authentik-bootstrap and the health card lists unhealthy platform-base containers
  - key: sec-007
    name: ה-routers מסוג -local (*.localhost) עוקפים אימות עם כותרת Host מזויפת בקצה הציבורי
    priority: high
    labels:
    - באג
    - אבטחה
    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/local-routers-host-spoof-bypass.yaml · נפתח 2026-06-16 · סטטוס שם: in-progress
      הכותרת בקובץ: *.localhost (-local) routers bypass auth via spoofed Host header on the public edge
      תקציר: The open `-local` routers match by Host header only (no source-IP limit); on the VPS, `curl -H 'Host: app.localhost' http://<vps-ip>/` reaches apps unauthenticated.
      משימות בקובץ:
