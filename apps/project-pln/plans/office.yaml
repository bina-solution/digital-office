  - key: ui2-060
    name: 'הדסקטופ תמיד מוכוון קישור: קישור לפריט עבודה פותח את חלון המשימות באותו דסקטופ — לא טאב חדש ולא חלון של בינה'
    priority: urgent
    labels:
    - ממשק
    - בעלים
    description: |
      מה נדרש: קישור מהבעלים — «הקישור למשימה עדיין לא עובד», ובהמשך: «המצב בדסקטופ, החלון המוצג והמידע בחלון תמיד מוכוון קישור כמו שכבר עשינו במסמכים נכנסים ובעוד … הכל באותו דסקטופ כשרק הקישור משתנה בלי שנוצר דף חדש בכרום». כלומר: כתובת (hash) ⇄ מצב הדסקטופ היא פונקציה דו־כיוונית — כל קישור ל־#/m/<app>/<route> שמגיע מבחוץ (מהצ׳אט של בינה, ממסמך, מהתראות, או מודבק בשורת הכתובת) חייב להזיז את הדסקטופ הקיים: לפתוח/למקד את החלון של אותה אפליקציה, לטעון בו את ה־route שבתוך הקישור, ולעדכן את שורת הכתובת — באותו טאב. וקישור שמגיע מלשכה מקושרת חייב לעבוד גם שם (‏id של אריח מקושר הוא <alias>.<office>, והפורט של הקצה שונה בכל מכונה).
      קבלה: (1) בכל אחת מהלשכות — פתיחת הקונסול במצב דסקטופ, פתיחת חלון בינה, יצירת פריט עבודה דרך עזריה, לחיצה על הקישור שהתקבל: החלון של ניהול הפרויקטים עולה באותו דסקטופ עם הפריט הפתוח, שורת הכתובת מתארת בדיוק את מה שרואים, ואין טאב חדש; (2) קישור שהודבק ידנית לאותו hash עושה בדיוק אותו דבר; (3) לשכה מקושרת: אותו מהלך עובד על האריח המקושר שלה, מוכח בצילום מסך ובהקלטת מסך מהדפדפן של אותה לשכה.
      מקור: הבעלים, 2026-10-09 (14:5x, בשיחה «העתקה לא עובד» — קישור DGO-509; עובד גם מדסקטופ המק)
  - key: ui2-061
    name: 'הקונסול על הענף נעצר בעלייה: `applyBrand(biz)` נשאר אחרי ש-`biz` הוסר, והמעטפת לא פותחת שום מסך'
    priority: urgent
    labels:
    - ממשק
    - באג
    description: |
      מה נדרש: platform-base/console/static/app.js:621 - `boot()` still calls `applyBrand(biz);`, right after the new `applyBrand(await getOffice());`. 1cbf97d1 removed `biz` (the old install screen's business record) and left this one line behind, so `boot()` throws `ReferenceError: biz is not defined` there and never reaches `openLoad()`, `BinaDesktop.boot()` or `route()`: a console built from the branch lists its tiles and opens none. The office's running console is NOT affected yet - it is the image of 2026-10-09 16:24Z, whose script still declares `biz` (read from the served app.js, 20:27) - the next rebuild of the console from the branch is. How it shows today: every flow suite on a simulation built from the branch tip ends with «JS errors: 1», so no simulation of the tip can be carried; the carried one (88d5d66e) is the build of 96abb82d for that reason, and what five later commits changed in the simulation's sources is not in it.
      קבלה: the line is gone; a simulation built from the tip (`node digital-office/sim/build.mjs`) passes `python3 digital-office/sim/flow-qa.py` at both sizes with no JS error; a console rebuilt from the tip opens its first tile and a deep link.
      מקור: הסשן של Claude Code בלשכת ה-HP (DGO-459), 2026-10-09 — נמצא בבדיקות הזרימה על בנייה של קצה הענף. הקובץ של הסשן שעובד על הקונסול; לא נגעתי בו. נרשם קודם כהערה על DGO-479, שכבר סגור.
  - key: ui2-062
    name: 'מעטפת הקונסול: הדיאלוגים שלה («מצב החיבורים», אשף חיבור החשבון) נגללים כולם, והכותרת והסגירה נגללות איתם'
    priority: medium
    labels:
    - ממשק
    - באג
    description: |
      מה נדרש: READ FROM THE STYLESHEET, not looked at in a browser. platform-base/console/static/style.css:822 - `.modal.wide{width:min(600px,94vw);max-height:88vh;overflow:auto}`: the whole card is the scroller and `.modal-h` (the title and the x) is inside it - app.js `healthPanel()` (:1501 «מצב החיבורים») and `openConnectWizard()` (:1641 «חיבור חשבון», several steps) are built on it. The base card, style.css:889 `.modal{...width:min(360px,92vw)...}`, has no bound at all. The same two shapes were MEASURED on 2026-10-09 on other screens (DGO-459 rounds 16-17): a card that scrolls whole lost its title and its way out at the end of a long form in 11 dialog/size pairs (computers, dgo-extend - the window desktop mode opens among them), and an unbounded one had its title and both buttons outside a short frame with nothing to scroll (the vault's «הוספת סוד חדש», on a phone on its side too). The fix that was proven there: the header takes the card's padding with it and is sticky at `top:calc(-1*<padding>)` - a padded scroller measures `top` from its content edge, `top:0` leaves a band of content above the title (apps/computers/static/index.html has it with its comment).
      קבלה: measured with each dialog up and the focus on its last control, on a phone on its side (844x390) and on a laptop: the title and the x stay in sight, nothing shows above the title, everything can be reached. Then G81's `dialog_pages` (scripts/refactor/desktop-windows-lint.py) reads this stylesheet too - today it reads `*/static/index.html` and `platform-base/*/ui.html` only.
      מקור: הסשן של Claude Code בלשכת ה-HP (DGO-459), 2026-10-09 — נמצא במפקד של הדיאלוגים אחרי סבבים 16–17. הקבצים של הסשן שעובד על הקונסול; לא נגעתי בהם.
