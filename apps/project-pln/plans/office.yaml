      קבלה: the census shows no symbol character in a control of either; each pager button has a name («העמוד הראשון», «הקודם», «הבא», «האחרון») and points the way the page reads; the vendored copies are rewritten by the gate's own `--fix` and G27 passes; looked at in the simulation (my-docs is one of its real frontends) on both grounds and at phone width, flows green.
      מקור: סשן Claude Code בלשכת ה-HP, 2026-10-09 (מפקד התווים בכל המסכים החיים, אחרי ui2-042)
  - key: ui2-046
    name: 'ציר הזמן של «כל מקביל»: סימני הפריסה ▸ ▾ והנקודה ● מוקלדים בתוך הקנבס'
