      מקור: הבעלים, 2026-10-08 (req-001, מחקר 2026-10-08). חלק מ-req-001.
  - key: web-002
    name: 'הסימולטור שבאתר מתעדכן לבנייה החדשה ביותר, ממוקד במערך האפליקציות הטובות'
    priority: high
    labels:
    - ממשק
    description: |
      מה נדרש: The owner: "we need to update the simulator there to the updated — now it's just showing the old console and old version of DGO; it needs to show the newest version, focusing on the set of good apps, and should be perfect and work very good". The committed digital-office/platform-sim.html is a 6.2 MB build from 2026-08-14 (2b782f90) — it predates the Olive Grove palette, the icon set, the focus ring and the new logo (ALIGNMENT-CHANGELOG.md:69-70). Rebuild it from today's sources (node digital-office/sim/build.mjs; the palette is read from theme-tokens.css at build.mjs:61), curate the shown app set to the good ones, and carry that build. Then make the site's live demo («נסו את ההדגמה החיה») serve this build.
      קבלה: the carried platform-sim.html is today's build; flow-qa.py passes at desktop+mobile with 0 JS errors; the site's demo loads it; the curated app set is what shows.
      מקור: הבעלים, 2026-10-08 (req-001). קשור ל-ui2-043 של הסשן האחֵר (שם «האתר» = קונסול הסטייג׳); כאן הכוונה לסימולטור שעל האתר הציבורי.
  - key: web-003
    name: 'לוגו אחד קנוני, כל הווריאנטים, משולב בכל מקום — אתר, מוצר, סימולטור'
    priority: high
    labels:
    - ממשק
    - כבד
    description: |
      מה נדרש: The owner: "update the logo all over the place; it should be integrated from the Mac's digital office logo — we need all versions of our logo, integrated into everything, especially the website, the product and the simulator". The canonical mark is the "i0" logo in digital-office/brand/io/final/ (added 2026-09-29 by the Mac snapshot): logo-1.svg==favicon.svg (green tile/white i0, light), logo-15.svg (white tile/green i0, dark), pair.png, sizes 96/48/32/16. DEFAULT decision (owner said pick sensible defaults, no questions): keep the i0 GEOMETRY, but recolour to the one Olive Grove palette (ui2-037), since the console's favicon.svg already uses #56693f/#f3f5f7/#a9b84c. Produce the full variant set from ONE source: favicon.svg + favicon.ico, light/dark marks, apple-touch, maskable, OG image, a horizontal wordmark lockup, PNG sizes. Wire a single source into: the website header/footer, the console shell + favicon + desktop bar (index.html:7,22; desktop.js:1038), the simulator (overlay/brand.js — a rebuild inherits the console SVG), authentik login branding (deployment-apps.yaml:257 has none today), bina-ds harness (brand-bina), the ~16 per-app favicons (inline data: URIs), and email templates. Drop the three stale #0e9f6e favicons (machine, notifications, sim mailview).
      קבלה: one source of truth for the mark; every surface references it (no per-screen copies); no stale #0e9f6e marks remain; G82 stays green (a colour only in theme-tokens.css); looked at on light and dark.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר הלוגו 2026-10-08).
  - key: web-004
    name: 'האתר נושא את התוכן והעיצוב של היום, נסרק ומושלם (beauty)'
    priority: medium
    labels:
    - ממשק
    description: |
      מה נדרש: The owner: "in general updated with all our content, with all our design and everything, design guidelines — it should be scanned and perfected". Beauty-score the site with the project's own engine (apps/sites, beautiful-score = github.com/solomonBoltin/beautiful; POST sites-render:8981/score), fix findings; verify texts/images/logo are served from digital-assets slots; align to the current Olive Grove design.
      קבלה: a beauty score is recorded and improved after the fixes; the live site reflects the current palette and the canonical logo; content comes from digital-assets.
      מקור: הבעלים, 2026-10-08 (req-001).
  - key: web-005
    name: 'הסימולציה שבאתר מציגה את המערכת במצב דסקטופ'
    priority: high
    labels:
    - ממשק
    description: |
      מה נדרש: The owner, 2026-10-09: "שים לב גם שהסימולציה באתר תדמית צריכה להציג את המערכת במצב דסקטופ". The demo frame on the site already renders the simulator at 1440x900 (site `demo.html`: `.demo-wrap iframe{min-width:1440px;min-height:900px}`, `src="/demo/?v=4"`), and the simulator embeds the REAL console shell — but it arrives in the CLASSIC shell, because desktop mode ("שולחן עבודה", `platform-base/console/static/desktop.js`) is only ever turned on by a press, kept in `localStorage['do-desktop']`, which a fresh visitor does not have. So the site shows the old shell while the product's own face is the window desktop.
      קבלה: opening the site's demo (and the hero preview) mounts desktop mode in the simulator — real windows, at the 1440x900 the frame draws — and the same page opened WITHOUT the flag still arrives in the classic shell; the flag is honored by the one source (the console's `desktop.js`), not by a per-surface copy; a screenshot of the served page is the evidence, plus `flow-qa.py windows` green on the rebuilt sim.
      מקור: הבעלים, 2026-10-09. חלק מ-o-web (req-001).

- key: o-core
  name: DGO Core · הליבה — מינימלית, נקייה, Go, ניתנת להורדה
  status: planned
  description: 'התוכנית השנייה, "big big big", ב-req-001: לקחת את הליבה (שכבה 0/1) לרמה הבאה — נקייה, יעילה, מינימלית. n8n יוצא מהליבה; ניהול תלויות מושלם; מסך ההתקנה הישן נמחק ובמקומו אשף התקנה אמיתי; הליבה נעשית בינארי Go קטן לכל מערכת הפעלה, עם מתקין זעיר שמורידים מהאתר.'
  items:
  - key: core-001
    name: 'n8n יוצא מהליבה אל שכבת האפליקציות (platform-base/n8n → apps/n8n)'
    priority: high
    labels:
    - n8n
    - תשתית
    - כבד
    description: |
      מה נדרש: The owner: "first thing, get n8n out of there — n8n is not a DGO core app; it moves to the application layer, the third layer. Core should have only strictly required apps". Today n8n is platform-base (layer 2). The move is `git mv platform-base/n8n apps/n8n`, set layer 3, and fix 287 literal `platform-base/n8n` references in 126 files + 10 path-join constructions (bbox n8n verbs, ~19 blueprint gates' BLUEPRINT_GLOBS, scripts/refactor/n8n_blueprint.py:46, app-management/app.py:838,853, .github/workflows/indox-e2e.yml, .gitignore). The id stays "n8n" so no state migration; renaming workflows/ to blueprint/n8n/ lets the existing apps/*/blueprint/n8n glob cover the central blueprint. Enumerate callers MECHANICALLY first (AGENTS.md rule 8).
      קבלה: n8n lives in apps/; reconcile validate+render pass; G9 layering --strict green; both test suites + the full gate suite pass (same known reds, no new); bbox run on one office brings n8n up as a layer-3 app. Depends on core-002 (dependency resolution) landing first or together.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר הליבה 2026-10-08).
  - key: core-002
    name: 'ניהול תלויות מושלם: להתקין INDOX מביא את n8n איתו; לכבות ספק שאפליקציה פעילה צריכה — נחסם'
    priority: high
    labels:
    - תשתית
    - כבד
    description: |
      מה נדרש: The owner: "verify perfect dependency management — because we're moving out n8n and INDOX relies on n8n; if I install INDOX it should auto-install n8n; it should work perfectly". The compiler resolve() already pulls a provider in for any app that hard-uses its capability (reconcile.py:642-701 — drive/INDOX/mail/chat pull `workflow`→n8n), but: (a) the apps screen starts only the app's OWN services, not pulled-in providers (app-management/app.py:1074,1096); (b) a pulled-in-but-disabled n8n never gets its central blueprint pushed (own-031); (c) disable is NOT guarded — it writes state and still runs unpush (app.py:1098-1109,1139), while archive/move/uninstall ARE guarded (_still_needed, 409). Fix: closure-based bring-up (start the resolved closure's provider services, push the provider blueprint FIRST), and a dependents guard on disable (app-management + `bbox apps disable`), using required_by() (reconcile.py:947).
      קבלה: enabling an app that needs n8n starts n8n's services and pushes its blueprint before the app's; `required-by --app n8n` is consulted and an unsafe disable is refused (or at minimum skips unpush); proven on one office by enabling INDOX/drive from scratch.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר הליבה). תלוי יחד עם core-001.
  - key: core-003
    name: 'למחוק כליל את מסך ההתקנה הישן («מסך התקנה / התקנה») — הוא רק פרטי עסק ולא עושה כלום'
    priority: medium
    labels:
    - ממשק
    description: |
      מה נדרש: The owner: "the install app (מסך התקנה) just holds business details now; it does nothing. Delete it entirely". It is a console view (static/app.js renderInstall :2153-2214, renderBusinessCard/saveBusiness :2268-2316, showQr, /api/business proxy app.py:356-362) that PUTs to apitools business_settings — apitools is disabled, so it 404s and every bare console visit redirects to it (boot() :605-611). Remove the install tile (modules.yaml:14-20), the view and its dead helpers (getConnections :526-531), install-only CSS, the /api/business proxy; remove from the sim (mocks/console.js, console-dev-server, flow-qa, ui-map), the mockup fragments, capture tooling (inventory.py, remote-ui-capture.py), GO-LIVE §3. KEEP the connect-wizard (connectOauth) and the brand line (getBusiness/applyBrand). Business details, if still wanted, get a home elsewhere (my-docs already has its own onboarding writing the same row) — owner's call where.
      קבלה: no install tile/route/view anywhere (console, sim, mockup, capture); the first-run redirect is replaced by the new wizard (core-004); gates + sim flows pass; nothing else lost the brand line.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר מסך ההתקנה 2026-10-08).
  - key: core-004
    name: 'אשף התקנה חדש בסטנדרט עולמי: קבלת תנאים ואז בחירת האפליקציות להתקנה (רק ה-AI מסומן כברירת מחדל)'
    priority: high
    labels:
    - ממשק
    - כבד
    description: |
      מה נדרש: The owner: "a new best-standards install wizard — it takes you through accept terms and conditions, then pick the basic apps to install out of the box. Nothing installed by default, only CHECKED in the wizard; when you click Next it installs. Only the AI app checked by default (maybe not even n8n). It ships with the core, and a new bbox run shows it as a native Go software window on any OS, letting you pick the apps". Build: welcome/hello → accept terms (store a first-run + terms-accepted marker) → app picker from GET /api/apps / the catalog (each with disclosure + room check) with ONLY bina-ds (the AI app) pre-checked → Next runs the enable jobs for the checked set. Shows in-console AND as a native desktop window on first run (ties to core-005/core-007). app-management today refuses platform-base apps and starts only own services — the wizard uses the catalog/enable path fixed in core-002.
      קבלה: a fresh DGO shows the wizard; terms acceptance is stored; the picker lists installable apps with bina-ds pre-checked and n8n unchecked; Next installs exactly the checked set and nothing else; proven in the sim and on one office.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר מסך ההתקנה 2026-10-08).
  - key: core-005
    name: 'הליבה נעשית בינארים נייטיביים (Go/C) לכל מערכת הפעלה — בלי וירטואליזציה/קונטיינרים לליבה עצמה'
    priority: high
    labels:
    - תשתית
    - כבד
    description: |
      מה נדרש: The owner: "I want DGO core replaced entirely with Go apps — authentik replaced with a Go binary, everything in the core very efficient, very fast, very Go/C, compiling into any OS without virtualization or containers. The core has the app management, and there we start getting the docker engine; layer 2 and 3 install container apps". This supersedes packaging/native-plan.md's current stance ("one Linux guest per OS, not per-OS binaries"). The core to reimplement in Go: the compiler (reconcile.py ~2994 LOC: manifest validation, capability resolve, compose/routing/SSO render, generations, state writer), catalog+signing, the run sequence, the hook runner, engine selection, job admission, .env generation — ~17.6k Python + 15.6k front-end today. PHASED: (1) a Go "core supervisor/installer" that runs natively on Win/mac/Linux and owns app-management + engine provisioning; (2) port reconcile/catalog/run; (3) the UI as a native window (evaluate Wails v3 / pure-Go purego webview). authentik→Go identity is core-006.
      קבלה: a phased plan is recorded on this item; a first Go binary runs natively on the three OSes and provisions the engine + app-management; decisions (webview lib, build matrix, signing) recorded; a prototype milestone demonstrated.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר אריזה/נייטיב 2026-10-08).
  - key: core-006
    name: 'להחליף את authentik בבינארי Go (forward-auth) — הוא הכבד ביותר בליבה'
    priority: medium
    labels:
    - אבטחה
    - תשתית
    - כבד
    - בעלים
    description: |
      מה נדרש: The owner named authentik specifically as the thing to replace with a Go binary. authentik today is Python + 3 containers, the largest (~1.1 GB, OPTIMISATION.md). It is used ONLY for forward-auth: proxy providers in forward_single mode, one per host (~35), bound to the embedded outpost, trusting X-authentik-username/groups/email/name/uid headers at the edge via middleware authentik@file; NO OIDC provider configured; default flows only (any signed-in user reaches every app); one admin akadmin; a bootstrap sentinel. Candidates: Authelia (Go single binary, forward-auth, ~20-50 MB; OIDC is beta) or a bespoke Go forward-auth. Evaluate, spike one, and migrate the ~35 hosts + the header contract that console/my-docs/indox/bina-ds/dgo-extend depend on, + the bootstrap/refresh machinery.
      קבלה: a chosen replacement with a migration of the forward-auth hosts and the header contract; memory footprint measured and much smaller; sign-in proven across the gated hosts; the owner approves the identity choice (it governs who can get in).
      מקור: הבעלים, 2026-10-08 (req-001, מחקר הליבה 2026-10-08).
  - key: core-007
    name: 'מתקין זעיר להורדה לכל OS (EXE/DMG/קובץ-או-פקודת לינוקס) שמוריד את DGO core — חתום, בלי clone'
    priority: high
    labels:
    - תשתית
    - כבד
    description: |
      מה נדרש: The owner: "You go to the DGO website and click download; it gives you DMG, EXE, or a Linux command/file — a very small file. You run it, get a hello, accept terms, then it downloads DGO core (also a minimal efficient binary) which has the app management and starts getting the docker engine. Binaries for any OS — very important — world-leading-software best practice, everything downloaded from the website, best possible flow; tap the need for a GitHub clone". Build a tiny signed stub per OS that: shows hello + terms, then downloads + VERIFIES DGO core (pin the payload's hash / a signed manifest inside the stub — a stub's own signature says nothing about what it fetches), then launches the core (→ core-005 → the wizard core-004). Best practices: Windows code-signing (EV no longer buys instant SmartScreen trust — budget a reputation warm-up per release); macOS Developer ID + hardened runtime + notarytool, staple the app then the DMG; Linux signed manifest + checksum from a separate host, never curl|bash; Go self-update pinned to an Ed25519 key, forward-only.
      קבלה: a per-OS stub (EXE/DMG/.run or one-line) downloads and verifies the core and launches it with no GitHub clone; the signing/notarization pipeline exists; the download comes from the website.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר אריזה/חתימה 2026-10-08).
  - key: core-008
    name: '"ליבה = רק אפליקציות שחובה": לבדוק מה באמת שכבה 0/1 ולהוריד את מה שלא'
    priority: medium
    labels:
    - תשתית
    description: |
      מה נדרש: The owner: "while we only [keep] strictly required apps in core — core should have only strictly required apps". Audit platform-base (any-concurrency, app-management, authentik, autoheal, bina-ui, connections, console, data-management, glitchtip, machine, n8n, notifications, postgres, redis, traefik) and reclassify non-core to layer-3 gallery apps: n8n→apps (core-001); glitchtip→gallery (native-plan.md already says demote); review any-concurrency/data-management/notifications/machine as candidates. Define the minimal strictly-required set that every deployment gets.
      קבלה: platform-base holds only the strictly-required set; the rest are layer-3 gallery apps; the minimal set is written down and the gates/compiler agree.
      מקור: הבעלים, 2026-10-08 (req-001).

- key: o-raphael
  name: רפאל · הסוכן המשמר (מודעוּת DGO וריפוי)
  status: planned
  description: 'התוכנית השלישית ב-req-001: סוכן חדש בשם רפאל, "סוכן DS כמו עזריה", שכל תכליתו לשמור שהמערכת חיה לפי הכוונה והסטנדרט הגבוה ביותר — מודעוּת רציפה (מראֶה, קוד, גישה/אבטחה, מכונות, קונטיינרים, שכבת הנתונים) והצעות ריפוי. תלוי ב-n8n: "רפאל התחל" מוודא שכל האוטומציות שלו קיימות, והן סורקות לבד ומפעילות אותו כשמוצאות משהו חריג. עזריה רץ ב-bina-ds (harness של DeepSeek), ורפאל יכול להיות preset שני באותו harness.'
  items:
  - key: rap-001
    name: 'ליצור את רפאל כ-preset שני ב-harness של bina-ds (agent-presets/raphael)'
    priority: high
    labels:
    - cli
    description: |
      מה נדרש: The owner: "a new agent whose sole purpose is being the system's recreator/curator — it gets the intention of the DGO, the final goal, the standards it should live up to; a DS agent like Azaria. His name is Raphael". Azaria is a preset in the bina-ds DeepSeek-Harness (agent-presets/azaria/{preset.yml, agent.cordis.yml, skills/}); a second persona needs agent-presets/raphael/ + an image rebuild (cordis.patch.yml discovers presets from roots; adapter POST /v1/sessions {preset}; bbox agent new -p <preset>). Also: AGENT_NAMES knows only azaria (scripts/bbox_agent/cli.py:483); add raphael. Raphael's persona = DGO intention + standards + "suggest healing". Shares token/CPU/full-access with Azaria (one process) — note it.
      קבלה: agent-presets/raphael/ exists with his persona and skills; the image rebuilds; `bbox agent new -p raphael` opens a Raphael session; AGENT_NAMES includes raphael.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר הסוכנים 2026-10-08).
  - key: rap-002
    name: '"רפאל התחל" מוודא את אוטומציות ה-n8n שלו; הן סורקות לבד ומפעילות אותו על חריג'
    priority: high
    labels:
    - n8n
    - cli
    description: |
      מה נדרש: The owner: "Raphael depends on n8n; when you say 'Raphael start' the first time he makes sure all his n8n automations are in place, then scans, scans, scans. The automations are hard-coded, doing scans on their own, and if they find something weird they trigger Raphael from within the automations". Build apps/raphael (or a blueprint under it) with scheduled n8n workflows (apps/raphael/blueprint/n8n/*.workflow.ts, tag app:raphael, Schedule Trigger like indoxHealth00001) that run the scans and, on an anomaly, (a) POST to the notification centre (notifications:8977/api/notifications, source "raphael") and (b) open/append a Raphael agent session (POST bina-ds:3081 /v1/sessions). NOTE: no sanctioned in-network path to the agent Bearer token exists today (contract forbids it in .env) — design one (read from the vault/connections like dgo-extend/converge does, or a dedicated capability). `bbox raphael start` → apps/raphael/hooks/start ensures the automations (push blueprint).
      קבלה: `bbox raphael start` ensures the automations are present; a scheduled scan that finds an anomaly posts a notice AND triggers a Raphael session with the finding; proven on an office that runs n8n.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר הסוכנים/n8n 2026-10-08).
  - key: rap-003
    name: 'מודעוּת מראֶה: סריקת ה-UI והזרימות של כל אפליקציה מותקנת ל-beauty + מבט LLM'
    priority: medium
    labels:
    - ממשק
    description: |
      מה נדרש: The owner: "appearance — every app installed on the running DGO continuously scanned, its UIs and flows and every corner, for beauty (the beauty GitHub repo we built) and a manual LLM watching the image. Later, in Raphael-management, set whether he looks at all apps or only the modified/custom ones; for now all". Orchestrate the existing engines: sites beautiful-score (github.com/solomonBoltin/beautiful, POST sites-render:8981/score), flow-qa.py --url <live>, live-ui-map.py --tiles, PLUS a vision-LLM read of the screenshots (new — rap-010 confirms the model has vision). A scope setting (all / modified-only).
      קבלה: per-app beauty score + an LLM read of the screens; findings become Raphael suggestions/items; the all-vs-modified scope setting works.
      מקור: הבעלים, 2026-10-08 (req-001).
  - key: rap-004
    name: 'מודעוּת קוד: סריקת כל בסיס הקוד — שערים, lint, קומפוזיציה, צורה, פרט'
    priority: medium
    labels:
    - cli
    description: |
      מה נדרש: The owner: "the same for code base — scan the entire code base, lint it, composition, shape, detail, lint, gates, etc; everything that can be noticed about a code base should be extracted and noticed, and Raphael suggests actions based on that". Orchestrate run-gates.py (58 gates), the lints, and turn findings into suggestions. (The gate suite already exists and is the natural engine.)
      קבלה: Raphael runs the gate suite + lints and turns the findings into ranked suggestions/items.
      מקור: הבעלים, 2026-10-08 (req-001).
  - key: rap-005
    name: 'מודעוּת גישה ואבטחה: פורטים, נקודות גישה, מי ניגש למה — לכל OS (Mac/VPS/Windows/Linux)'
    priority: medium
    labels:
    - אבטחה
    description: |
      מה נדרש: The owner: "access, security scans — DGO can run on Mac, VPS, Windows or Linux, so strong access awareness: ports, access points, who accesses what, how the OS and networking work; then suggest actions to make it more secure". Orchestrate the computers «אבטחה» audit (computers:8977/api/computers/<cid>/audit — sshd/UID0/ufw/docker-socket mounts/privileged/0.0.0.0 publishes/listening ports/reachability; today Linux/apt only — EXTEND to macOS and Windows), the route-claim (G21)/sso (G20) gates, and the open security issues (e.g. sec-020 docker-proxy on all interfaces). Produce a per-host access map and hardening suggestions.
      קבלה: an access map per host (ports, who/what, OS/network facts) across the OSes Raphael must cover; findings become hardening suggestions.
      מקור: הבעלים, 2026-10-08 (req-001).
  - key: rap-006
    name: 'מודעוּת מכונות: CPU, RAM, רשת, שירותים, גישת-קבצים — סריקה רציפה'
    priority: medium
    labels:
    - תשתית
    description: |
      מה נדרש: The owner: "machines — CPU, RAM, networks; their usage, services, file access; whatever can be figured out about the machine, scanned continuously; Raphael goes over the scans". Orchestrate machine:8080/api/overview + /api/storage, any-concurrency, autoheal, `bbox status`, lib.sh stale_containers. Continuous, with anomaly triggers into rap-002.
      קבלה: a machine-health scan (cpu/ram/net/services/files) whose anomalies trigger Raphael.
      מקור: הבעלים, 2026-10-08 (req-001).
  - key: rap-007
    name: 'מודעוּת קונטיינרים: להכיר את הקונטיינרים ולהציע פעולות מיוחדות כשצריך'
    priority: low
    labels:
    - תשתית
    description: |
      מה נדרש: The owner: "containers — [Raphael] should know about the containers, and if special actions [are] needed, suggestions, etc". Orchestrate machine + autoheal (notice-only watch) + config-by-caller/engine-orphans, scoped to OUR compose project (the engine carries two projects on hp-laptop — every docker filter must be scoped by com.docker.compose.project).
      קבלה: a container inventory + health, scoped to our project, with suggested actions on anomalies.
      מקור: הבעלים, 2026-10-08 (req-001).
  - key: rap-008
    name: 'מודעוּת שכבת הנתונים: איזה מידע יש לכל אפליקציה, שהוא מוצהר/מנותב/בריא'
    priority: medium
    labels:
    - תשתית
    description: |
      מה נדרש: The owner: "the data layer — always scan the apps and see what data they actually have, what is the valuable data, make sure it's routed and specified and sitting clearly in the standard way on the DGO; scan it, make sure it's healthy — the last aspect of Raphael's awareness". Orchestrate data-management:8080/api/inventory (coverage verdicts incl. UNCLAIMED/at_risk; manifest data.paths/sql/kv; unowned binds/tables/kv) and G26.
      קבלה: a data inventory with verdicts per app (declared/routed/healthy) whose problems become suggestions.
      מקור: הבעלים, 2026-10-08 (req-001).
  - key: rap-009
    name: 'מיומנות בדיקת-חדירה מורשית: לבדוק כמה גרסת DGO עמידה — מול ה-DGO של הבעלים בלבד'
    priority: low
    labels:
    - אבטחה
    - בעלים
    description: |
      מה נדרש: The owner: "Raphael should have the skill of penetration testing — so when given [the task of] getting into that DGO he knows how, and I can run it from another computer of mine and test how good the DGO version is against penetration testing". Scope STRICTLY and defensively: an AUTHORIZED release-hardness self-assessment of the owner's OWN DGO deployment, using standard well-known authorized security scanners, run only with the owner's explicit go-ahead; results become hardening suggestions. Arming any active testing is the owner's decision (label בעלים) — no offensive tooling is built until he authorizes it in-session. This item defines the authorized procedure and the scanner set; it does not build attack tooling.
      קבלה: a defined, authorized self-assessment procedure + the chosen standard scanners is written; the owner authorizes (in-session) before any active run; findings feed Raphael's suggestions.
      מקור: הבעלים, 2026-10-08 (req-001). קשור ל-sec-016.
  - key: rap-010
    name: 'מודל-ראייה ומסך ניהול לרפאל (היקף: כל האפליקציות / רק המותאמות, אילו סריקות, לוחות זמנים)'
    priority: low
    labels:
    - cli
    description: |
      מה נדרש: The owner implied a Raphael-management surface ("inside Raphael and management we can set if he looks at all apps or just the modified/customized ones") and the appearance scan needs an LLM that can see images. Confirm the configured harness model is vision-capable (the model lives on the bina-ds volume); build a management surface for scope (all/modified), which scans run, and their schedules.
      קבלה: the model is confirmed vision-capable (or set to one); a Raphael-management surface exists with the scope/scan/schedule settings.
      מקור: הבעלים, 2026-10-08 (req-001).
  - key: rap-011
    name: 'רפאל אומר «1 קונטיינרים לא בריאים»: אחת נאמרת ברבים בהתראות ובבקשות ההשכמה שלו'
    priority: low
    labels:
    - באג
    description: |
      מה נדרש: READ on the HP office's «התראות», 2026-10-10 04:17 and 06:41 (read-only): while one container of the office was unhealthy (forward-auth, DGO-522) every notification and wake request of Raphael's said «הדופק: 1 קונטיינרים לא בריאים» and «רפאל: 1 קונטיינרים קרסו או בלולאת ריסטארט» - a count of one before a plural noun, three new ones a minute. The screens of the office are being taught the same thing in DGO-459 round 27 («מכולה אחת לא תקינה», «מקור אחד»); the sentence here is written by Raphael (apps/raphael), which is not this session's to touch.
      קבלה: with one unhealthy container Raphael's notification and wake request read «קונטיינר אחד לא בריא» / «קונטיינר אחד קרס או בלולאת ריסטארט»; with two or more the number and the plural as today.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-10 — נמצא בקריאה של «התראות» בלשכה החיה (DGO-459). לא נגעתי: הטקסט נכתב ברפאל.

- key: o-fleet
  name: צי הלשכות · צבע וחיה לכל לשכה
  status: planned
  description: 'התוכנית הרביעית ב-req-001: כשכמה לשכות מקושרות, לכל לשכה צבע וחיה (נבחרים בשלב של אשף ההתקנה), ובכל מקום שאפליקציה או אריח של לשכה חיצונית מופיעים — הם נושאים את הצבע והחיה של אותה לשכה, כדי שיהיה ברור לאיזו לשכה הם שייכים ומה תפקידה. הקצאות הבעלים: HP = פיל/אפור (הכבדה), MacBook = צבי/צהבהב (הניידת), VPS = נשר (בעננים).'
  items:
  - key: flt-001
    name: 'לכל לשכה צבע וחיה, נבחרים בשלב של אשף ההתקנה ונשמרים בזהות הלשכה'
    priority: medium
    labels:
    - ממשק
    - תשתית
    description: |
      מה נדרש: The owner: "it should be an install-wizard step that every DGO picks a color [and animal]... every DGO as a color and an animal, so it's organized — a business could have 10-20 DGOs connected". Store {color, animal} in the office identity (dgo-extend home.json; writer beside set_home_label) and publish in the catalog (catalog.py build()). Assignments he gave: HP = elephant / grey ("the heavy laptop, most RAM/CPU"); MacBook = deer / yellow-ish ("MacBook Neo, 8 GB, my mobile interface, mainly AI + secret/digital-assets"); VPS = eagle / (colour to pick — default sky, "in the clouds, no legs, doesn't live on the ground"). A wizard step (core-004) sets them.
      קבלה: identity carries {color, animal}; a wizard step sets them; the three known offices have their defaults; the catalog publishes them.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר זהות הלשכה 2026-10-08).
  - key: flt-002
    name: 'הצבעים חוקיים תחת שערי הפלטה: גוונים per-לשכה כטוקנים ב-theme-tokens.css, שם על החוט (לא hex)'
    priority: medium
    labels:
    - ממשק
    description: |
      מה נדרש: The palette is owned by one file (theme-tokens.css) and gates G27/G82 forbid a colour named anywhere else. The legal way: add each office hue as 5-step tokens INSIDE theme-tokens.css (values in the light block and both dark blocks), carry a NAME from a closed vocabulary on the wire (never a hex), screens set data-office-hue="<name>", and a CSS rule maps name→token (precedent: the focus-ring rules in that file). Avoid collisions: lime already means "look here" / the remote mark, and --danger/--muted mean offline — a yellow-ish deer and a grey elephant sit near those.
      קבלה: G27 + G82 stay green; per-office hue tokens exist (light + both dark); the wire carries names, never hex; the deer/elephant hues are distinguishable from the lime/offline meanings.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר הפלטה 2026-10-08). קשור ל-ui2-037.
  - key: flt-003
    name: 'חיות כאייקונים (לא אמוג׳י): פיל/צבי/נשר ב-bina-icons.js, מוטבעים דרך G27'
    priority: medium
    labels:
    - ממשק
    description: |
      מה נדרש: Animal marks must be icons, not emoji — G77 forbids emoji in screens, and reconcile.py crashes on an emoji in a label. Add elephant/deer/eagle (and a small zoo for future offices) to platform-base/bina-ui/bina-icons.js as inline SVG path strings (24×24, stroke=currentColor), stamped by G27 into the carriers; test_icons.mjs requires every manifest icon to exist.
      קבלה: the animal glyphs are in the icon set as SVG paths; G27 + G77 green; the glyphs render on light and dark.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר אייקונים 2026-10-08).
  - key: flt-004
    name: 'בכל מקום שאריח/אפליקציה של לשכה חיצונית מופיעים — הם נושאים את הצבע והחיה שלה'
    priority: medium
    labels:
    - ממשק
    - כבד
    description: |
      מה נדרש: The owner: "when I go into the VPS and see apps, or external DGOs connected, or connect from the HP to the VPS/Mac, they appear with their color — a clear separation; I can see what each one is for". Carry {color, animal} through catalog→projection→serve→console (catalog.validate closed-vocabulary check; serve.plan keeps the keys; the remote module entry). Draw it on every surface that shows a linked office: rail tag (.bnv-meta[data-office]), top-bar chip (.vt-office), command palette, phone launcher, switcher, down-office card (shell + server _card), dock tile (colorFor), dock door, window title bar, desktop menu, app-management where-to-install/move sheet, app-management cards, dgo-extend offices list. Must scale to 10-20 offices.
      קבלה: each of those surfaces shows the linked office's hue + animal; proven in the console (with the Mac/VPS linked) and in the simulator; a 10-20 office set stays legible.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר הקונסול/הקישור 2026-10-08).
  - key: flt-005
    name: 'הסימולטור מדגים צבע וחיה ללשכות מקושרות (ושומר על ההבחנה online/offline בצבע)'
    priority: low
    labels:
    - ממשק
    description: |
      מה נדרש: The sim injects linked offices only in flow-qa (OWN_HOST/LINK_DOWN, office "macbook"); a flow-qa check asserts the .bnv-meta colour differs between offline and back. Mock a couple of linked offices WITH colour+animal and keep that online/offline colour difference intact; the palette+icons arrive automatically from the real sources on a sim rebuild.
      קבלה: the sim shows per-office colour+animal for a couple of linked offices; the offline/online colour-difference check still passes.
      מקור: הבעלים, 2026-10-08 (req-001, מחקר הסימולטור 2026-10-08).

- key: o-ccweb
  name: סשן Claude Code בענן · ההודעה הראשונה שלו והשלמת העבודה
  status: planned
  description: 'הבקשה של הבעלים (2026-10-09): לקרוא בדיוק מה הייתה ההודעה הראשונה שנשלחה לסוכן של סשן Claude Code בענן (claude.ai/code/session_01QiKPMAiRudn1ZkBTibk5UT), לדבר איתו דרך הדפדפן של הלשכה, לוודא שהוא משלים את כל מה שהוטל עליו, ולעזור לו — כדי שהכל ילך מהר יותר ויהיה מושלם.'
  items:
  - key: ccw-001
    name: 'סשן 01QiKPMAiRudn1ZkBTibk5UT: ההודעה הראשונה שלו, מו״מ דרך דפדפן הלשכה, והשלמת העבודה'
    priority: high
    labels:
    - cli
    description: |
      מה נדרש: The owner's own words (2026-10-09): "אני רוצה שתברר בדיוק מה ההודעה הראשונה ששלחתי לסוכן https://claude.ai/code/session_01QiKPMAiRudn1ZkBTibk5UT — תשתמש בדפדפן לשכה כדי לדבר איתו ולוודא שהוא משלים הכל ותעזור לו גם כדי שהכל ילך יותר מהר ושהכל יהיה מושלם". Three parts: (1) the session's FIRST message, verbatim — the request that agent was actually given; (2) a conversation with that agent from the office browser (browser42, the one the owner can watch at http://browser42.localhost:8080/view/), to confirm it is completing everything and to unblock it; (3) whatever help makes it go faster and land perfect.
      קבלה: the first message is quoted verbatim with its session URL; the session's own remaining work is enumerated and its completion state verified against what the browser shows; anything that needed help — a decision, a missing fact, a correction — was sent to that agent and its reply recorded here; the item's link was given to the owner before the work began.
      מקור: הבעלים, 2026-10-09 (הודעה ישירה לעזריה).

  - key: ccw-002
    name: 'הסשן "DGO web and core updates" — ללוות עד הסוף, ולהביא לבעלים את מה שחסום עליו'
    priority: high
    labels:
    - cli
    description: |
      מה נדרש: The owner's own words, 2026-10-09: "the session i was talking about is dgo web core updates". That session (claude.ai/code/session_01QiKPMAiRudn1ZkBTibk5UT, repo deployment-hacohen, branch hp-dgo, working in this very checkout) is the one the office follows: the browser talks to it, its owner-gated findings come back through here, and the office-side facts it needs (n8n's real state, who is editing what, Plane's health) are handed to it in one line. It asked for exactly this: "bring the owner-gated ones to him via you".
      קבלה: every owner-gated item the session raises is on the hub with the בעלים label and is brought to the owner in a reply; the session's questions are answered with measured facts (not guesses); what it ships is verified against the repo (commits on hp-dgo), not taken from its summary.
      מקור: הבעלים, 2026-10-09.

- key: o-captcha
  name: דפדפן הלשכה · מעבר חידות אנוש (captcha) בבטחה, באמינות ובלי להיתפס
  status: planned
  description: 'הבקשה של הבעלים (2026-10-09): "deep research online on latest captcha solving you must be able to bypass this safely, reliably and without being detected". הרקע: הכניסה ל-claude.ai בדפדפן הלשכה נחסמה בחידת Cloudflare Turnstile, והסוכן פתר אותה ידנית (קליק ב-X לפי קואורדינטות מתוך צילום). המטרה: מחקר עדכני, ומסלול שהוא חלק מהמערכת — לא טריק חד-פעמי.'
  items:
  - key: cap-001
    name: 'מחקר + מסלול לחידות אנוש בדפדפן הלשכה (Turnstile / reCAPTCHA / hCaptcha) — בטוח, אמין, בלי להיתפס'
    priority: high
    labels:
    - cli
    - אבטחה
    description: |
      מה נדרש: The owner's words: "deep research online on latest captcha solving you must be able to bypass this safely, reliably and without being detected". Today the office browser hits these live (2026-10-09: claude.ai's login challenged with a Cloudflare Turnstile image round, solved by hand from a screenshot). Deliver (a) an up-to-date, sourced survey of how the challenges are actually assessed in 2026 and what passes or fails, (b) a capability inside browser42 - declared, gated, documented - that gets the office browser through a challenge with no human by default, and (c) the honest boundary: what must stay a deliberate human/owner action and why. Constraints: it is the OWNER's own browser and his own accounts - never send a challenge's images or page content to a third party, never buy solved tokens from a farm, and never let one blocked login escalate into a locked account.
      קבלה: the survey cites its sources with dates; the capability lives in apps/browser42 (verbs + docs + gate-clean), is proven on a real challenge end-to-end, and its failure mode is a named refusal rather than a silent block; the safety boundary is written down.
      מקור: הבעלים, 2026-10-09.
  - key: cap-002
    name: 'חידת התמונות של Turnstile (המקרה של claude.ai) — לעבוד לבד בפעם הבאה, ולסיים את המחקר'
    priority: high
    labels:
    - cli
    - אבטחה
    description: |
      מה נדרש: The owner, 2026-10-09, after cap-001 shipped: "make sure to do all the research on the latest captcha and bypass and this one in particular and make sure it will be working for the next time we bump in to this". "This one in particular" is the round that actually stopped the office: a Cloudflare Turnstile MANAGED challenge on claude.ai's sign-in - the instruction "Click on the item used for gardening" over a 3x3 grid of pictures, inside a cross-origin iframe, reached only after the Google OAuth click. cap-001 gave the loop a captcha verb that reads the frame, returns the instruction/targets/picture and clicks ONE target like a hand (proven on reCAPTCHA's checkbox round); it does NOT yet make the image round work on its own. Deliver: (a) the finished survey - what the field ships in 2026 for Turnstile managed/image rounds, the retry and Skip semantics, what keeps a profile trusted across rounds, and what is measured vs claimed; (b) the image-round path in browser42: the tiles as separate pictures with their index and coordinates, one-click-per-tile with multi-select, the Verify/Skip controls named, the round's own state after every click (advanced / same round / solved), and a decision by the caller that can SEE; (c) the runbook where the NEXT agent will look for it - the office-browser skill must say the verb exists and when to reach for it; (d) proven against a live managed round, not only against a checkbox.
      קבלה: a live Turnstile managed/image round is detected, read, answered by the loop and passed end-to-end on the office browser; every click reports what it changed; the attempt budget still ends in the named refusal with the /view hand-off; the skill the next session loads names the verb; the survey's claims carry sources and dates.
      מקור: הבעלים, 2026-10-09 (המשך cap-001).
