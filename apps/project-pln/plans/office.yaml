      - (optional) Purge from `main` / `COPILOT` history on GitHub
  - key: sec-002
    name: traefik ו-Portainer מחזיקים Docker socket בקריאה וכתיבה — פריצה ל-traefik פירושה שליטה במארח
    priority: urgent
    labels:
    - באג
    - אבטחה
    - בעלים
    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/traefik-docker-socket-rw.yaml · נפתח 2026-06-16 · סטטוס שם: open
      הכותרת בקובץ: Traefik (and Portainer) mount the Docker socket read-write
      תקציר: The internet-facing Traefik container has full Docker API access (root-on-host) via /var/run/docker.sock; any Traefik compromise = host takeover.
      משימות בקובץ:
      - Add docker-socket-proxy service (caddy:2-alpine, GET-only Caddyfile, internal net)
      - Point Traefik at tcp://docker-socket-proxy:2375 and remove its socket mount
      - Verify all routes still resolve after the change
      - Apply the same proxy (or restrict) to Portainer's RW socket
      - Add no-new-privileges + cap_drop:[ALL] to Traefik
  - key: sec-003
    name: apitools מוגש בלי SSO לכל בקשה עם כותרת Host של apitools.localhost, גם בקצה של הייצור
    priority: high
    labels:
    - באג
    - אבטחה
    description: "קובץ ה-issue (המדידות והניתוח המלא): issues/apitools-served-without-sso-to-a-spoofed-host-header.yaml · נפתח 2026-09-30 · סטטוס שם: open\nהכותרת בקובץ: apitools is served WITHOUT SSO to any request whose Host header says apitools.localhost — on the production edge too\nתקציר: Measured 2026-09-30 22:22 from outside: `curl -H 'Host: apitools.localhost' http://31.97.196.82/` → 200 (apitools answers), while `Host: console.localhost` → 302 to authentik. The hand-written `apitools-local` router carried only the retry middleware although app.json declares auth:sso and apitools \nמשימות בקובץ:\n- [בוצע] apitools-local carries authentik@file; recreated on the Mac engine; edge probe → 302\n- [בוצע] Redeploy the VPS so the production edge stops serving apitools to a spoofed Host header. DONE 2026-09-30 23:16 (coordinator: vps1's declared commit moved to the dgo head 01f93b4d via the dgo-extend API, converge ok); verified from outside 2\n- Gate: an auth:sso host never has a router\
      \ without the authentik middleware unless the manifest exempts the path\nבלשון הבעלים: «תוודא שהכל מאובטח מאחורי authentic או לא נגיש אונליין, ואין גישה מבחוץ לאף אחד מהשירותים (כולל apitools ושירותים צדדים)» · «apitools הוגש **בלי SSO** לכל בקשה עם Host: apitools.localhost — גם בקצה של vps1»\n"
  - key: sec-004
    name: החלף את מפתח ה-API של Google Vision שהוטמע בקוד בהיסטוריית ה-git של apitools
    priority: high
    labels:
    - באג
    - אבטחה
    - בעלים
    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/apitools-vision-key-rotation.yaml · נפתח 2026-07-07 · סטטוס שם: open
      הכותרת בקובץ: rotate the Google Vision API key hardcoded in apitools git history
      תקציר: rotate the Google Vision API key hardcoded in apitools git history
      הקובץ אינו מפרט משימות: לאמת מול הקוד אם עדיין קיים, ואז לתקן או לסגור עם הוכחה.
  - key: sec-005
    name: ה-bootstrap של authentik מתחרה במיגרציות בהפעלה קרה, ואז מדווח ש-SSO מוכן בלי שום בדיקה
    priority: high
