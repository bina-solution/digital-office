      מה נדרש: The palette (ui2-037) now also owns what the browser paints by itself for a control (`accent-color`, said once in platform-base/bina-ui/theme-tokens.css). One more thing the browser paints is the keyboard focus ring: the live screens give a ring to particular parts (the side menu's entries, the home tiles, some fields - each in its own rule, all naming tokens), and any other button, link or field takes the browser's own ring, in the browser's colour. The simulation already has the answer as its item A10 (digital-office/sim/overlay/tokens.js): one rule for a, button, input, select, textarea, [tabindex], summary under :focus-visible - 2px of the accent, 2px away - and it is keyboard-only, so a pointer never sees it. Port it to the live screens from ONE place (the shared block that every screen carries), without `!important`, so a part that draws its own ring keeps it.
      קבלה: Tab through three screens of different families (the console's home, a one-page app, an app with a side menu) on the light ground and on the dark one: every stop shows a ring in the accent, none shows the browser's, and no part shows two rings. The flow suite gains a check that walks the tab order of each screen and reads the outline colour at every stop.
      מקור: סשן Claude Code בלשכת ה-HP, 2026-10-07 (נמצא בסיום ui2-037, כשנבדק מה עוד הדפדפן מצייר בעצמו)
