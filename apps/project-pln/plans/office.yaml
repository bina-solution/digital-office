  - key: eng-003
    name: תקרות CPU יוצאות מתצורת compose ומוחלות על המכולות הרצות (docker update)
    priority: urgent
    labels:
    - תשתית
    - HP
    description: |
      מה נדרש: The CPU budget overlay scales every cap by budget/declared-sum, so an app toggle re-creates most containers at the next bring-up (hp-laptop: dry-run = Recreate x12, incl. traefik and two databases). Keep one rendered plan; apply it with `docker update --cpus` after every up; compose_files() stops merging the overlay. Done when `scripts/config-by-caller.sh` says 're-create: none' after toggling an app that declares a cap.
      ראיה: issues/a-containers-configuration-depends-on-who-asks-and-on-who-else-runs.yaml task 1
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-04 עד 10-06
  - key: eng-004
    name: הרץ workers של n8n ו-apitools על הלפטופ הנייד, רשומים לפריסה, כדי להאיץ את העיבוד
    priority: high
    labels:
    - תשתית
    description: |
      מה נדרש: Use the portable Linux machine (ssh) as extra capacity: simplest registration of n8n workers (start with 3, up to 8) and apitools instances against this deployment, with proven speed gain (latency fix verified) and a calculation of workers needed to finish in 1h. Done when portable workers consume jobs.
      בלשון הבעלים: «the simplest way to add n8n workers running on protable laptop to gain extra speed» · «we used to use portale machine for extract n8n workors and maybe api. figure how it currently works»
      נאמר: 2026-08-10 עד 2026-08-16, 16 פעמים.
      מצב (חלקי): apps/apitools/scale-out/ (2nd apitools, haproxy-portable.cfg 38.4ms->2.3ms, tunnel.sh); issues/portable-box-docker-29-and-remote-worker-dns.yaml open: remote n8n workers cannot run INDOX
