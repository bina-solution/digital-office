  - key: n8n-015
    name: '28 לולאות ב-workflows של INDOX מתרוקנות לפני שהעבודה שלהן רצה (מיקום על הקנבס)'
    priority: high
    labels:
    - n8n
    - indox
    - באג
    description: |
      מה נדרש: Under `executionOrder: v1` the canvas decides which target of a fan-out runs first: the top-most, and on an equal y the left-most (GATES.md, G45 - verified in the engine's source). A loop wired to its lane AND to itself, with the lane's first node on the SAME y and to the right, re-enters the loop first: every batch is emitted before any lane runs, the lanes then run last-batch-first, and the loop's "done" output fires before the work. The workflow still reports success. G45 pins this shape in its self-test (`Loop Over Items39`) and could not see it for seven weeks (qa-034). Read again on 2026-10-07: 28 loops - indoxV2ActionsInv01 (10), indoxV2ActionsGlobal01 (8), indoxV2ActionsBS01 (8), indoxV2ActionsOrd01 (1), indoxV2ActionsRcp01 (1). `python3 scripts/refactor/n8n-loop-order-lint.py` names each loop, both positions and the fix.
      קבלה: G45 reports 0 "LOOP DRAINED BEFORE WORK" - each lane's first node sits strictly above its loop node - done on an office that runs INDOX, pulled first, pushed, and the action suites (`bbox indox test`) green before and after. Canvas positions are load-bearing; this is not a cosmetic edit.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (qa-034)
