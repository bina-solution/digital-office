  - key: eng-014
    name: traefik v3 מתעלם מהפורט בבקשה, ולכן כל router מסוג -http עם BASE_URL שכולל :8080 לא מתאים
    priority: high
    labels:
    - באג
    description: "קובץ ה-issue (המדידות והניתוח המלא): issues/traefik-v3-ignores-the-request-port-so-every-ported-base-url-router-is-dead.yaml · נפתח 2026-09-30 · סטטוס שם: open\nהכותרת בקובץ: traefik v3 ignores the request's port — every `-http` router rendered from a `<APP>_BASE_URL` that carries `:8080` never matches, and the Mac edge works only through the `-local` routers; a nested hos\nתקציר: Measured 2026-09-30 19:45 on the macOS engine (traefik:v3.3): `Host: console.localhost:9999` and `Host: plane.localhost:8080` are routed and reach the authentik forward-auth (its log shows those exact hosts), so a port-less rule matches any port; `Host: plane.console.localhost:8080` against the rule\nמשימות בקובץ:\n- [בוצע] Compiler: never a port inside Host() — reconcile.traefik_host() renders the host part of a ported BASE_URL as a literal (d3497a85); byte-identical for port-less values\n- [בוצע] CORRECTED 20:40: BASE_URL KEEPS the edge port (as ci-env.sh writes it) — authentik's forward-auth\
      \ matches the browser's Host header port included, and the compiled blueprint's '<App> Provider' external_host is http://${BASE_URL}; only the t\n- Plane: PROJECT_PLN_BASE_URL=plane.console.localhost:8080, recreate Plane, recreate the authentik bootstrap (provider gets the :8080 host), restart authentik-server if the outpost does not refresh; verify plane.console.localhost:8080 → 302 →\n- [בוצע] Outpost sync on host-set change: the bootstrap must be RECREATED (compose up, fresh env), never docker start/restart (DGO-60); a provider change needs an outpost refresh — a server restart is the lever when the signal does not arrive. DONE \n- [בוצע] Gate: compiled labels contain no Host() with a port. DONE a7f2b2a5: route-claim-lint invariant 3 — literal ports fail; a ${VAR} that this machine's .env resolves to host:port fails unless the same service has a port-less rule for that host\n"
