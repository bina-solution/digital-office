  - key: ui2-013
    name: 'מספר ויחידה מתהפכים בתוך טקסט עברי — «MB 3.5», «B 0», «KB 84» — בחמש אפליקציות'
    priority: high
    labels:
    - ממשק
    - באג
    - HP
    description: |
      מה נדרש: Wherever a number with a unit (or a timestamp, or a Latin model name) sits inside a Hebrew line it is not direction-isolated, so the unit lands before the number or the number is torn from it. Drive: the list footer "MB 3.5" / "kB 94", the storage line «קבצים MB · 25 7.4», the preview caption «10 מתוך MB · 1 2.2 · קובץ». מכונה: the network value "KB 84", the chips "GB / 9.7 GB 6.9" and «פנוי GB 875», the chart legend, the CPU row "6 11 · ליבותth Gen Intel(R)…", the uptime «ימים 4.8». ניהול נתונים: "B 0", "MB 653.8", "GB 6.68". הרחבת הלשכה: "23:56:33 ,4.10.2026". מחשבים: the uptime cells. Table cells that are already left-to-right are right. One idiom for all of them — the token is isolated where it is formatted (law 1 of the UI skill: RTL is the page, LTR is the token).
      קבלה: none of the listed strings reads unit-first in a fresh capture at the three sizes.
      ראיה: tiles 02, 06, 09, 12, 14, 16 and panels 04–17, 38 at every size (2026-10-06)
      מקור: סקירת כל המסכים של לשכת ה-HP בשלושה גדלים, 2026-10-06
