    - cli
    - HP
    description: |
      מה נדרש: On hp-laptop (WSL) the tunnel's interface lives in the tunnel container: from the host shell neither the link's name nor its address answers. `bbox remote` delegates into a container on the office network; `bbox agent --office` does not. One reach decision for both verbs.
      ראיה: commit 28595d77
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-04 עד 10-06
  - key: lnk-011
    name: הקרנה אוטומטית מחדש בלשכה בלי 'דלת' — לא רק ב-bbox run
    priority: medium
    labels: []
    description: |
      מה נדרש: On a machine without the link's door the remote block is re-projected only when someone runs `bbox run`. The link plane should do it when a peer's catalog changes.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-04 עד 10-06
  - key: lnk-012
    name: 'dgo test 2: שורת ה-room אדומה — ל-hp-laptop אין מקום לאפליקציה שמוצבת עליו'
    priority: medium
    labels: []
    description: |
      מה נדרש: `bbox dgo test 2` on the Mac: 'hp-laptop needs 4.3GB, has 3.5GB'. Either the placement is wrong for this machine or the WSL VM's memory is; decide and make the line true.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-04 עד 10-06
  - key: lnk-013
    name: 'מהמק: שלושת האריחים הממוסגרים של hp-laptop נפתחים בלי כניסה נוספת — צילומים בשני הדפדפנים'
    priority: high
    labels:
    - ממשק
    description: |
      מה נדרש: After `git pull` (6ad636c3 or later) and `./bbox run console` on the MacBook: open «בינה ודעת», the console home and «ניהול פרויקטים» of hp-laptop from the Mac console, in the office browser (no port) and in a browser on the host (:8080), each from a host that is not signed in yet. Expected: the console page leaves once to <nested host>/.dgo/enter/m/<tile>, comes back to #/m/<tile>, and the app is shown with no question asked; a second open does not leave at all. For Plane the app's own sign-in page remains (pln-011) — do not type a password, only show that a wrong sign-in is answered on the nested host (Location: http://plane.hp-laptop.console.localhost…/?error_code=…) and not on plane.localhost. Without a cookie, `curl -H 'Host: bina.hp-laptop.console.localhost' <edge>/.dgo/enter/m/bina.hp-laptop` answers 302 to the office's sign-in: the gate stands.
      קבלה: six screenshots (three tiles × two browsers) in the Drive folder «Plane — HP ומק», the network line of /.dgo/enter for one of them, and flow-qa console 34/34 + 31/31 on the Mac.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-06
    assignee: azaria
  - key: lnk-014
    name: 'הקישור בין הלשכות מת אחרי שה-Wi-Fi של ה-HP התחבר מחדש — ולא חזר לבד'
    priority: urgent
    labels:
    - באג
    - HP
    description: |
      מה נדרש: The tunnel between the MacBook and hp-laptop stopped at 15:33:40 on 2026-10-06 and did not come back. hp-laptop's Wi-Fi re-authenticated at 15:34:48–15:34:52 (WLAN events 11004/11005), 68 seconds after the last handshake. Nothing else changed: hp-laptop is still 192.168.16.102 (Windows and the mirrored WSL interface), the tunnel's port is bound (re-bound 16:59, when the container was re-created), the Hyper-V and host firewall rules for UDP 51830 exist and are enabled, a datagram sent from Windows to 127.0.0.1:51830 reaches the container. In fifteen minutes of listening on the LAN interface not one packet for the tunnel's port arrived; the MacBook (192.168.16.103) answers "port unreachable" for its own port 51820. Find which side stopped — whether the MacBook's packets leave it, and if they do, where they stop on the way into WSL — and make the link come back by itself after either machine's network reconnects. A link that needs a person after a Wi-Fi blip is not "native".
      מצב (2026-10-06 18:14): the link is back — hp-laptop sees a fresh handshake from 192.168.16.103 — after the MacBook's side was re-created by hand. What the two sides measured together: BOTH of the MacBook's links (to hp-laptop and to vps1) stopped in the same second, and its `dgo-link` was left in a dead network namespace (lnk-003) with its UDP going nowhere; on hp-laptop nothing was found broken (same address, port bound, firewall rules present, a local datagram reaches the container). The likeliest trigger is the access point dropping both machines for a moment (hp-laptop's Wi-Fi re-authenticated at 15:34:48). The open half is the acceptance below; on the MacBook's side it rests on lnk-003 — the link's two containers re-created as one unit.
      קבלה: with both offices up, the Wi-Fi of each is switched off and on in turn; within two minutes of each the tunnel has a fresh handshake and a linked tile opens, with nobody touching either machine.
      ראיה ומדידות: issues/hp-plane-unreachable-from-the-mac.yaml (המדידות מהמק: dgo-link ב-namespace מת, ה-UDP שנבלע, ה-HP שלא ענה)
      מקור: הסשן של Claude Code בלשכת ה-HP ומדידות של עזריה מהמק, 2026-10-06
  - key: lnk-015
    name: 'חיבור ישיר בין לשכת ה-HP ללשכת ה-VPS — כדי שניהול המשימות ייפתח מכל מקום'
    priority: urgent
    labels:
    - HP
    description: |
      מה נדרש: The owner, 2026-10-08: «וגם תשתמש בחיבור שיש לך דרך הלשכה במק כדי לייצר חיבור ישיר בין הלשכה פה והלשכה VPS כדי שאוכל לגשת לניהול משימות מכל מקום». Plane (the task hub) runs on hp-laptop, which no address outside its own network reaches; the VPS office has a public address. Today the HP office reaches the VPS office only by way of the MacBook. Wanted: the two paired directly - the HP dials, the VPS is the side that can be dialed - and the HP's task management given to the VPS office, so it opens from the VPS's public address behind that office's sign-in.
      קבלה: the pairing is made from the offices' own screens (no SSH, no key copied by hand), the VPS's screen reached through the Mac office's link; hp-laptop shows the VPS as a linked office with a fresh handshake, and the VPS shows hp-laptop; task management opens from a network that is neither office's, behind sign-in, and an item opened there is the item on the HP; the link comes back by itself after either side restarts. Before any code reaches the VPS: what it runs today is written down, and its own `platform.state.yaml` is set aside (eng-040).
      מקור: הבעלים, 2026-10-08 (הודעה בסשן של Claude Code בלשכת ה-HP)
  - key: lnk-016
    name: 'לשכה מקושרת שלא עונה נעלמת מהקונסול — במקום להופיע ככבויה'
    priority: high
    labels:
    - באג
    description: |
      מה נדרש: Two parts of the link say opposite things about a linked office that stops answering. The projection (`apps/dgo-extend/projection.py`, "What this module refuses to do") drops the office out of the `remote:` block when its catalog cannot be pulled - "a peer that does not answer is a peer with NO apps shown here" - so the compiler stops rendering its tiles. The console, since 2026-10-07, has a card for exactly that state (`isOff`, `renderExternalNotice`: the office does not answer, since when, and a retry) - but a card needs a tile to stand on. Measured on the MacBook, 2026-10-08: at 11:54, when hp-laptop stopped answering, its 14 tiles left `platform.state.yaml`; the only two left to carry the card were the office-level ones (bina, machine). The owner meets this as "task management is gone", not as "the HP is off".
      קבלה: an office that stops answering keeps the tiles it last published, each marked off, and opening one draws the card (no frame, no Bad Gateway); they return to normal on the first pull that succeeds, with nobody touching anything; an app the office STOPPED publishing still leaves - that is a different state, and the catalog says which; the state file is not re-written every minute for it; the policy text in projection.py and contract §4 say the one thing; proven on two offices by taking a link down and bringing it back.
      מקור: מדידה של עזריה מלשכת המק, 2026-10-08 (הדו״ח שלו מ-19:22 בשיחה «גישה לניהול משימות מה־VPS»), נקראה מול הקוד בלשכת ה-HP
  - key: lnk-017
    name: 'לשכה מאזינה שהכתובת שלה ברשת התחלפה: הזוג מת, ושום מסך לא אומר למה'
    priority: urgent
    labels:
    - באג
    - HP
    description: |
      מה נדרש: A pair pins the listening office's LAN address (`tunnel.endpoint` in the pair's record; `DGO_WG_ENDPOINT` in the listener's .env), and a home router hands addresses out by DHCP. Measured on hp-laptop, 2026-10-08: its Wi-Fi was off from 01:18 to 11:52 and came back as 192.168.16.100 instead of 192.168.16.102; from that minute the MacBook dialed an address nobody holds - 0 bytes on UDP 51830 in 25 s of capture while its ICMP to .100 arrived - and the dialing side's own healing moved its port six times and stopped ("this is not a port problem"). The firewall was right. The one place that knew was a line `firewall-converge.ps1 -Check` prints during `bbox.cmd run`, which nobody was running. lnk-014 (2026-10-06) was closed by re-creating the Mac's side by hand; this is its cause.
      קבלה: the dialing side finds a listener that moved inside its last known network by itself (a WireGuard handshake to each address of the /24 on the known port - only the holder of the key answers) and writes the address it found into its record; the listening side sees that the address it declares is not one it holds, says so where the link's state is read (the link's verdict, `bbox status`) and corrects what it declares; both proven by changing hp-laptop's address with the two offices up - a fresh handshake within two minutes and a linked tile opens, nobody touching either machine; a DHCP reservation in the router stays the owner's choice, not a requirement.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-08 (נמדד אחרי ההפעלה מחדש של WSL); הצד המחייג: עזריה
  - key: lnk-018
    name: 'ה-hook של dgo-extend לפני העלייה מת בשקט בכל לשכה שלא הכירה את השם הישן — בלי זהות, בלי כתובת, בלי הקרנה'
    priority: high
    labels:
    - באג
    description: |
      מה נדרש: `apps/dgo-extend/hooks/prepare` starts with `hooks/migrate` (the move from the app's old name, `offices`). Its `find_volume` is a pipeline ending in `grep … | head -1`, the hook runs under `set -euo pipefail`, and on an office that never had an `offices_state` volume the grep matches nothing: the function returns 1, `set -e` ends the hook at the assignment `OLD_STATE_VOL="$(find_volume …)"` with no line printed, and `prepare` - under `set -e` too - ends with it. So on every office born after the rename, the three steps that make an office ready to be paired never ran at bring-up: its identity, the address another office can dial (and following a DHCP lease that moved), and the projection of what linked offices give. Measured on hp-laptop, 2026-10-08, with `bash -x`: the trace ends at `+ OLD_STATE_VOL=`, exit 1; 0 volumes with the old suffix. It is why hp-laptop went on declaring 192.168.16.102 after its address had moved (lnk-017).
      קבלה: "none" is an answer in `find_volume`, not a failure; on hp-laptop the hook ends with exit 0 and says «legacy volumes are kept as none / none», and `prepare` goes on to the address step (it printed the lease that moved, and .env followed it); an office that does have the old volumes still migrates - that case is run on a throwaway `zz-*` pair of volumes, never on a real one.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-08 (נמצא כשה-hook נדרש כדי להצהיר על הכתובת החדשה)
  - key: lnk-027
    name: 'מהמק: אריח של לשכה שכבר אינה מקושרת נותן Bad Gateway בקונסול של vps1, והלשכה המקושרת היחידה לא מדברת 12 שעות'
    priority: high
    labels:
    - באג
    - HP
    description: |
      מה נדרש: On 2026-10-09 12:14 the owner, sitting at the MacBook, opened the VPS console and clicked the «בינה ודעת · MacBook» tile: the window showed `Bad Gateway`. Measured: tile and router are leftovers of the `macbook` pairing. The traefik file router `dgo-remote-macbook-bina-console@file` forwards `bina.macbook.console.staging.digital-office.co.il` to `http://bina.macbook:9002`, and the link's listener has no rule for that host any more — the live pair is `hp-laptop` — so traefik answers 502 in 2-12 ms (eight requests from 79.177.165.212, 09:09:44-09:12:27 UTC). `platform.state.yaml` has declared 0 remote apps since 2026-10-08 23:37, but `.generated/` was still the render of the older `remote:` block, so the console drew a door nothing serves. The second half is the office itself: this office's only linked office, `hp-laptop`, has had no WireGuard handshake since 2026-10-08 21:00 (44758 s, tunnel DEAD), its door is not listening, its catalog cannot be pulled and its public address answers nothing at all on TCP 22/80/443/9002; on our side the port is fine (docker-proxy on 0.0.0.0:51830, the nftables DNAT counted 49 packets in 13 h and 4 on eth0), so the peer is simply not dialing.
      בלשון הבעלים: «תראה אני לא מצליח לגשת לבינה ודעת של המק»
      קבלה: (1) after `reconcile.py render` — or any `./bbox run` — the console draws no tile for an office that is not declared, and the nested host answers 404 instead of 502 (verified here: zz-serve.yaml removed, `GET /api/modules` = 17 local tiles, `bina.macbook.console.…` 404); (2) a declared office that stops answering keeps its last tiles drawn OFF with the card, never a frame (that is lnk-016, still open); (3) within a minute of the linked office's tunnel coming back, its tiles are in this console again with nobody touching vps1.
      ראיה ומדידות: ci-artifacts/owner-reports/2026-10-09-macbook-tile-bad-gateway.webp (the owner's screenshot) · traefik access log 2026-10-09 09:09-09:12 UTC: `502 11 "dgo-remote-macbook-bina-console@file" "http://bina.macbook:9002"` · `./bbox dgo link status`: `hp-laptop … answers: unknown handshake: 44672s ago - the tunnel is DEAD` · `/api/link` → `delivery.door.listening=false, catalog.ok=false` · host: `ss -ulnp` shows docker-proxy on UDP 51830, nftables `udp dport 51830 counter packets 49`.
      מקור: הבעלים, 2026-10-09 12:14 (צילום מסך ו-«תראה אני לא מצליח לגשת לבינה ודעת של המק»); נמדד על ידי עזריה בלשכת vps1
  - key: lnk-028
    name: 'צימוד חוזר של אותן שתי לשכות נכשל בסוף הדרך ב-409, ולמסך המצטרף אין ממנו דרך — ואין הסבר למהלך'
    priority: urgent
    labels:
    - באג
    - ממשק
    - HP
    description: |
      מה נדרש: 2026-10-11 11:43, הבעלים ניסה לצמד שוב את לשכת hp-laptop מהמסך של הלשכה הזאת, במסלול המצטרף («הצטרפות ללשכה»: הצגת קוד → הדבקת קוד התשובה מהלשכה השנייה → קוד אישור), ולחץ אישור. השרת סירב ב-409 — «כבר קיימת כאן רשומה בשם hp-laptop — צימוד קודם. כדי להחליף אותה שלחו replace: true.» — והמסך הציג את המשפט כמו שהוא, בלי שום דרך להמשיך: אין כפתור, אין הסבר ואין דרך חזרה. הסיבה מבנית: ההגנה `Pairing._guard_replace` (apps/dgo-extend/pair_api.py:235-245) רצה בשני המסלולים, ולמסך יש טיפול ב-replace רק באחד מהם — המארח, `claim` (apps/dgo-extend/static/connect.js:788, כפתור btnReplace) — ולא במסלול המצטרף: `confirmCode` (connect.js:517-526) ו-`acceptReply` (connect.js:801-816) קוראים ל-`notBuilt` בלבד (connect.js:280 → «הפעולה נכשלה:»). כלומר בצד המצטרף השגיאה מגיעה בסוף, אחרי ששני הקודים הוחלפו, ואין ממנה המשך. בנוסף: הצימוד של שתי לשכות שכבר מצומדות הוא המקרה הנפוץ — ניסיון חוזר אחרי קישור שמת — ושם «צימוד קודם» אינו שגיאה אלא בדיוק מה שרוצים להחליף. ולצד זה, מסך הצימוד אינו אומר בכל שלב מה קורה אחריו ומה נדרש מהצד השני, ולכן נוצר הרושם ששני הצדדים סורקים סתם.
      קבלה: (1) צימוד חוזר של אותה לשכה מהמסך המצטרף נגמר בהצלחה או בסירוב עם דרך — כפתור «להחליף את הרשומה הקיימת ולהמשיך» בשני המסלולים, כמו שיש היום במארח; (2) מסלול המצטרף אינו חושף לאדם הוראה על `replace: true` — המשפט נאמר בשפה של המסך, על אותה שורה של הכפתור; (3) צימוד חוזר של לשכה שהיא kind: paired מחליף את הרשומה ומחזיר את הקישור, בלי שזליגה תישאר (pair_id/slot/token נבדקים בהצלחה ובכישלון); (4) מסך הצימוד אומר מה קורה בכל שלב ומה נדרש מהצד השני — שלושת הצעדים (הצעה → תשובה → אותו קוד אישור בשתי הלשכות), ומי מהצדדים נגיש למי.
      ראיה ומדידות: issues/pairing-again-with-an-office-you-already-have-is-a-dead-end.yaml · ci-artifacts/owner-reports/2026-10-11-hp-pairing-409.webp (הצילום של הבעלים מ-11:43:43, המסך המצטרף עם ה-409) · pair_api.py:235-245 (`_guard_replace`, נקרא מ-`offer_confirm`:476 ומ-`claim`:516) · connect.js:788 (המארח — יש החלפה) מול connect.js:517 ו-:801 (המצטרף — אין) · connect.js:280 («הפעולה נכשלה:» + הודעת השרת) · ה-409 עצמו: `POST /api/pair/offer/<rid>/confirm` מחזיר את אותו משפט (ראו גם `apps/dgo-extend/pair_api.py` selftest: «an installed office overwritten without replace»).
      בלשון הבעלים: «קודם כל לא הבנתי למה צריך ששתי הצדדים יסרקו את הבר קוד ולא היה בכלל ברור בתהליך מה קורה אחרי שסרקתי צד אחד. דבר שני בסוף לא הצלחתי להתחבר בכלל וקיבלתי את השגיאה הזאת»
      מצב (2026-10-11 12:0x): התיקון נכתב ב-`apps/dgo-extend/static/connect.js` — ההחלפה ירדה למקום אחד (`offerReplace` + `replaceRefusal` הטהור) ומוצעת בשני המסלולים, וגם ההודעה המטעה תוקנה (404 שנשא משפט מהשרת — «אין כאן בקשת צימוד חיה…» — אינו נקרא יותר «גרסה שקודמת»). הוכח: `node apps/dgo-extend/tests/connect-selftest.mjs` (18 בדיקות, כולל החדשות), `python3 apps/dgo-extend/tests/pair_contract.py` PASS, ובדיקת קצה-לקצה על האימג' החי בשני מופעים חד-פעמיים: צימוד מלא, ואז צימוד חוזר שבו המארח מחליף (`replace: true` → 200), המצטרף נדחה בשם (409 עם המילה replace), ולחיצה שנייה שלו כותבת — רשומה אחת, לא כפילות. הורץ ונפרס בלשכה הזאת (`dc up -d --build --force-recreate dgo-extend`, healthy; ה-JS מוגש עם ?v חדש). **השינוי אינו מקומט**: ה-checkout כאן detached (`d24547e2`) וקומיט/דחיפה מותרים רק לבקשת הבעלים מפורשת — עד אז כל converge של הלשכה הזאת מהלשכה אחרת יעביר אותו ל-`git stash`.
      מקור: הבעלים, 2026-10-11 11:43 (צילום מסך); נמדד על ידי עזריה בלשכת vps1
  - key: lnk-029
    name: 'הקישור עם המק נשמט בשקט כנכתב הצימוד של hp-laptop — הלשכה הפסיקה להכיר את המק, והמסך לא אמר דבר'
    priority: high
    labels:
    - באג
    - HP
    description: |
      מה נדרש: ב-2026-10-08 23:37:19 (20:37:19 UTC) נכתב בלשכה הזאת הצימוד עם hp-laptop — ובאותה שנייה נולד תיקיית הרשומות של האפליקציה (`/data/dgo`, birth=20:37:19.706700150, ובתוכה hp-laptop.yaml בלבד). 24 שניות אחר כך (23:37:43) נכתב `platform.state.yaml` מחדש, ומני אז אין בו שום app של לשכה מקושרת (remote: ריק) — כלומר אריחי המק נעלמו מהקונסול ולא חזרו. מה שנשאר מהמק בלשכה הזאת הוא שאריות בלבד: הקטלוג האחרון שלו (`/data/remote/macbook.json`, נמשך 23:36:40 — דקה לפני), אסימון ברשומה בכספת (`dgo_link-serve-macbook-bina-ds-agent`) וקובץ traefik שנוצר פעם (`platform-base/traefik/config/dgo-extend-peer.yaml`), ואילו רשומת צימוד של המק אין כאן כלל. ומה שכן חי — המנהרה הישנה של המק, ברמת המכונה: `wg-quick@wg0` ו-`dgo-link-door` פעילים על המכונה, wg0 על 10.79.2.2/24, עם לחיצת יד אחרונה ב-2026-10-11 01:23 (10.5 שעות לפני הבדיקה) והעברות 9.61 MiB שהתקבלו — כלומר המק לא נותק ברשת; הלשכה פשוט הפסיקה להצהיר עליו, ואיש לא ראה הודעה על כך. יש לתקן: מעבר/שדרוג של לשכה לא ישמיט בשקט שום עמית — או שהרשומה נודדת, או שהלשכה מסרבת לעלות עם רשימה בשם; ומצב של שתי מנהרות לאותו /24 (אחת ברמת המכונה ב-`.dgo/`, אחת במכולה ב-`/tunnel`) חייב להיות גלוי ולבעל בעלים אחד.
      קבלה: (1) לשכה שמתחילה עם עמית שרשומתו אינה אצלה אך המנהרה שלו חיה על המכונה (`.dgo/` או wg-quick יחיד) — אומרת על המסך מה היא רואה ואינה מכירה, ומצהירה עליו ככבוי, במקום שקט; (2) שדרוג/מיגרציה של רשומות אינו מוחק ואינו משמיט עמית — הוכחה על עמית מדומה: לפני המיגרציה n עמיתים, אחריה n, וכשאחד חסר הלשכה מסרבת לעלות עם שמו; (3) קישור המק חוזר לפעול בלי צימוד מחדש אם הרשומה נמצאה (או שהמסך אומר בדיוק שצריך לצמד מחדש, ומה יקרה לקישור הישן); (4) שתי מנהרות לאותו /24 — מזוהה, מדווח ומורץ לאחת, בלי לשבור את החיה.
      ראיה ומדידות: issues/the-mac-link-vanished-when-the-hp-pair-was-written.yaml · `/data/dgo` birth=2026-10-08 20:37:19.706700150 UTC (stat בתוך dgo-extend-staging) · `/data/remote/macbook.json` mtime=20:36:40 · `platform.state.yaml` mtime=23:37:43, ומ-23:37 אין בו remote · `platform.state.yaml` שבגיט (HEAD) מחזיק remote של לשכה אחרת (office: vps1) ולא של הלשכה הזאת · `docker exec dgo-extend-staging` → `/api/pair` אין macbook; בכספת אין `dgo_link-macbook` · על המכונה: `systemctl is-active wg-quick@wg0 dgo-link-door` → active/active, `wg show wg0` → peer +0B1Hc+… (המק) endpoint 79.177.165.212:58801, latest handshake 10h29m, 9.61 MiB received · `.dgo/addressing.json` (22:54) — הזוג עם macbook, slot 2, self 10.79.2.2.
      בלשון הבעלים: «וגם תברר למה החיבור עם המק נותק»
      מקור: הבעלים, 2026-10-11; נמדד על ידי עזריה בלשכת vps1
  - key: lnk-030
    name: 'מחקר עומק: אורך חיי הקישור — קישור חייב לשרוד עד ניתוק ידני, בלי שאדם יגע במשהו'
    priority: high
    labels:
    - תשתית
    - HP
    description: |
      מה נדרש: הקישור בין לשכות הוא חלק מהחוויה הבסיסית: בעל הלשכה מצמד פעם אחת מחשבים ושרתים, ומכאן והלאה הכול עובד — עד שהוא מנתק במפורש. היום אין לזה שום ערובה מדודה: הקישור מת והתיקון דרש אדם בכל אחד מהמקרים שנמדדו עד כה — כתובת שהתחלפה ב-DHCP (lnk-017), פורט מקור שנבלע ביציאה מהבית (issues/the-office-tunnel-wedges-silently-and-nothing-measures-it.yaml), מכולה שנבנתה מחדש והותירה את dgo-link ב-namespace מת (issues/the-link-goes-dark-after-every-tunnel-rebuild.yaml, lnk-003), לשכה שישנה (lnk-016), ורשומה שנשמטה בשקט (lnk-021); ובלשכה הזאת יש היום שתי מנהרות לאותו /24 — אחת ברמת המכונה ואחת במכולה. המחקר צריך להחזיר: (א) רשימה סגורה של כל סוגי המוות, ולכל אחד — הגלאי, התיקון האוטומטי, וזמן ההתאוששות הנמדד; (ב) מה נדרש כדי ש„יציב לנצח עד ניתוק ידני” יהיה אמת ולא תקווה: מי מחייג, כל כמה זמן keepalive ו-rekey, איך ממשיכים כתובת שהשתנתה, מה קורה כשהמכונה ישנה ומה כשהמנוע מוחלף, ומי הבעלים של המנהרה כששני מנגנונים חיים על אותה מכונה; (ג) מה המדידה שתוכיח את זה — בדיקה שרצה בעצמה ומדווחת „הקישור חי/מת ומתי חזר”, לא מסך שמראה „unknown”.
      קבלה: מסמך אחד תחת ai/context (ומפניה מ-AGENT.md של dgo-extend) שמונה כל סוג מוות עם מדידה, ולכל אחד: הגלאי, התיקון, ומדידת זמן התאוששות — ובנוסף בדיקה שמדפיסה לכל זוג קישור את מצבו לאורך זמן (מות, חזרה, מי תיקן); ומסקנה חד-משמעית על הבעלים האחד של המנהרה (ברמת המכונה או במכולה) עם התיקון הנדרש.
      ראיה ומדידות: lnk-014, lnk-017, lnk-019, lnk-021; issues/the-link-goes-dark-after-every-tunnel-rebuild.yaml, issues/the-office-tunnel-wedges-silently-and-nothing-measures-it.yaml; ai/context/connection-status-standard.md §1; בשטח בלשכת vps1: `wg-quick@wg0` (המק, לחיצת יד אחרונה 2026-10-11 01:23) לצד wg2 במכולה (`/tunnel`, hp-laptop, לחיצת יד אחרונה 2026-10-08 23:52) — שתיהן 10.79.2.0/24.
      בלשון הבעלים: «תוסיף תיקט של מחקר לעוומק על אורך חיי החיבור (חייב להיות יציב לנצח עד שמנתקים ידנית, חלק מאוד קריטי מחווית המשתמש שהוא מחבר בקות פעם אחת מחשבים ושרתים והכל עובד חלק עד שהוא מנתק במפורש)»
      מצב (2026-10-12 — המחקר נכתב והמדידה נבנתה): `ai/context/dgo-link-lifetime.md` — 13 סוגי מוות, ולכל אחד הראיה הנמדדת, הגלאי, התיקון וזמן ההתאוששות, ומסקנה: **המנהרה מחזיקה לבד** (פורט מקור ~3 דק', סריקת /24 עד ~9 דק', netns 33 שנ', keepalive 25 שנ', פרויקציה 60 שנ'), **והרשומה לא** — זוג שנכתב הפוך, רשומה שעזבה בלי גלאי, התנגשות שני מנהרות על /24, וכתובת ציבורית שהשתנתה בלי רענון שם. **המדידה**: כל סבב פרויקציה רושם שורה לכל שינוי מצב (+heartbeat כל `DGO_LINK_HISTORY_HEARTBEAT`) ל-`/data/link-history.jsonl` עם `fixed_by` — מי תיקן; `GET /api/link/history` ו-`./bbox dgo link history [n]`. שורה ראשונה: 2026-10-12 19:37 `hp-laptop up handshake 87s CHANGE`. §5 במסמך = תוכנית החיבור המשולש (שלושה זוגות; peer→peer חסום בתכנון, ולכן אין שרשרת vps1→macbook→hp-laptop).
      מקור: הבעלים, 2026-10-11
  - key: lnk-031
    name: 'צימוד שתי לשכות מקצה לקצה — מהמסכים, בדפדפן אמיתי ובסרטון: `bbox dgo test pair`'
    priority: high
    labels:
    - תשתית
    description: |
      מה נדרש: הבעלים, 2026-10-11: «חייב למצוא דרך להריץ בעצמך שתי לשכות לצמד בינהם אני רוצה סרטון מלא של התהליך». כל בדיקות הצימוד שהיו רצו ב-HTTP (`tests/fresh-offices.sh`, `tests/pair_contract.py`) ואף אחת מהן לא ראתה מסך — ולכן החסימה של אותו בוקר (סירוב 409 בסוף המהלך, בלי שום דרך להמשיך) עברה מתחת לכל הבדיקות הירוקות. נדרש פועל אחד שמרים שתי לשכות של האימג' של הלשכה הזאת, נוהג במסכים שלהן בדפדפן אמיתי (הצגת קוד → הדבקת קוד → פענוח הקוד → אישור), עושה זאת פעמיים — צימוד נקי, וצימוד חוזר אחרי קישור שמת (המקרה של הבעלים) — מקליט את שני המסכים, ומחזיר סרטון + צילום לכל שלב. וכל זה בלי להשאיר קונטיינר או רשומה בכספת.
      קבלה: `./bbox dgo test pair` מהמכונה: שתי לשכות זמניות, PASS/FAIL מדווח, סרטון של כל המהלך (שני המסכים זה לצד זה, בשני הסבבים), צילום לכל שלב, אפס שאריות בקונטיינרים ובכספת, ויציאה שאינה אפס ברגע שמסך אינו מצליח להשלים את המהלך.
      מצב (2026-10-11 — מומש והוכח): `apps/dgo-extend/tests/pair-video.sh` (שתי הלשכות + הדפדפן + חיבור הסרטון) ו-`apps/dgo-extend/tests/pair-screens.mjs` (המהלך עצמו ב-Playwright, על המסכים האמיתיים), מחווטים כפועל `bbox dgo test pair` (`hooks/test`). הורץ על האימג' החי: PASS — סבב 1 נצמד נקי (אותן שש ספרות בשני המסכים, ושתי הלשכות אומרות שהצימוד נכתב); סבב 2 פוגש את הרשומה הקיימת, **שני המסכים מציעים את כפתור ההחלפה**, והוא נשלם. ראיה: `ci-artifacts/dgo-pair-video/pair-latest.mp4` (32.7 שניות, 2720x940, שני המסכים) ותיקיית ההרצה עם `steps/*.png` ו-`pair-screens.json`; הקונטיינרים והכספת נבדקו נקיים אחרי ההרצה. בסרטון רואים בדיוק את התיקון של lnk-020: כפתור ההחלפה במסך המצטרף.
      ראיה ומדידות: ci-artifacts/dgo-pair-video/pair-latest.mp4 · ci-artifacts/dgo-pair-video/20261011T092218Z/ (pair-screens.json ok=true, steps/, a-r1/a-r2/b-r1/b-r2.webm) · `./bbox dgo test pair` → exit 0 · אחרי ההרצה: `docker ps -a` בלי קונטיינרים זמניים, ובכספת נשארו רק `dgo_link-serve-local-bina-ds-agent` ו-`dgo_link-serve-macbook-bina-ds-agent`.
      בלשון הבעלים: «גם זה.... חייב למצוא דרך להריץ בעצמך שתי לשכות לצמד בינהם אני רוצה סרטון מלא של התהתליך (תדווח משימה )»
      מקור: הבעלים, 2026-10-11 12:07
  - key: lnk-032
    name: 'הצימוד עם hp-laptop נכתב בכיוון שאי אפשר לחייג בו — לשכה עם כתובת ציבורית חייגה לכתובת מקומית, בלי שגיאה ובלי לחיצת יד'
    priority: urgent
    labels:
    - באג
    - תשתית
    description: |
      מה נדרש: הבעלים צמד את hp-laptop היום (2026-10-12 16:09) והצימוד „הושלם” — אבל המנהרה לא קיימת מאז: 0 בתים התקבלו. הסיבה אינה רשת אלא ההחלטה של מי מחייג: ברשומה של vps1 נכתב `tunnel: {side: 1, role: host, dial: host, endpoint: 192.168.16.100, port: 51830}` — כלומר vps1 (שרת עם כתובת ציבורית, מאחורי שום NAT) הוא המחייג, והכתובת שאליה הוא מחייג היא הכתובת המקומית של hp-laptop ברשת הביתית. `pair_api.claim` בוחר את הכתובת שהמצטרפת פרסמה בלי לשאול אם אפשר להגיע אליה מכאן, ולכן נולד זוג מת מראש: „הצד שנגיש מקשיב והצד שאינו נגיש מחייג” — בדיוק הפוך. מה שנדרש: (1) ההחלטה תיבחן מול מה שנגיש **מכאן**: כתובת מקומית של המצטרפת תיבחר לחיוג רק אם ללשכה הזאת יש כתובת מקומית משלה (כלומר היא יכולה להיות באותה רשת); לשכה שמפרסמת כתובת ציבורית תקשיב, והמצטרפת תחייג אליה — ואם אין מה לחייג ואין מה להקשיב, הצימוד יסרב במפורש; (2) שום מסך לא יגיד „מחובר” על זוג שאינו יכול לחייג — וגם לא „המנהרה פעילה אבל הלשכה לא עונה” (זה מה שהמסך אמר כאן בזמן שאין לחיצת יד כלל); (3) „ריפוי” הזוג לא יסרוק /24 של רשת זרה ולא יסובב פורטים של צד שאינו המחייג בפועל, אלא אומר את הסיבה האמיתית; (4) אחרי התיקון — צימוד חוזר מכל כיוון יוצא זוג שעובד, וכל השאר (קטלוג, אריחים, Plane בלשכת HP) נמדד מקצה לקצה.
      קבלה: (1) `pair_api` בוחר `dial: joiner` (המצטרפת מחייגת אל הכתובת הציבורית של המארחת) כשלמצטרפת יש כתובת מקומית ולמארחת יש כתובת ציבורית — ובבדיקה; (2) לשכה שאין לה מה לחייג אליו ושאינה יכולה להקשיב — מסרבת עם משפט שמסביר מה לעשות (ולא כותבת זוג מת); (3) `GET /api/link` ו-`bbox dgo link status` אומרים על הזוג הזה את האמת — „אין תנועה במנהרה”, ואם הזוג נכתב הפוך גם זאת, ובשום מצב לא „המנהרה פעילה” כשאין לחיצת יד; (4) `wg show` בלשכה המאזינה מציג לחיצת יד מ-hp-laptop, הקטלוג שלה נמשך, והאריח שלה (Plane) מופיע בקונסול בלי שאדם נגע במשהו; (5) שערי dgo-extend ירוקים.
      ראיה ומדידות (2026-10-12, לשכת vps1): `/data/dgo/hp-laptop.yaml` → `role: host, dial: host, endpoint: 192.168.16.100, port: 51830`, paired_at 1791810569 (16:09:29) · `wg show wg2` בתוך dgo-net-staging → `transfer: 0 B received, 1.45 KiB sent`, אין לחיצת יד; ה-Endpoint ברינדור 192.168.16.100:51830 · `.env`: `DGO_WG_ENDPOINT=console.staging.digital-office.co.il` (נפתר ל-31.97.196.82), `DGO_WG_PUBLISH_BIND=0.0.0.0`, `DGO_WG_PUBLISH_PORT=51830`; ufw מאשר 51830/udp · `find-peer.json` → `candidates: 64`, והסריקה רצה 8 דקות 37 שניות (13:14:59→13:23:36 UTC) מ-64 כתובות ב-192.168.16.0/24 — רשת שאיננה שלנו — „no peer found” · `listen-ports.json` → 51830→51932→52032 (שני סיבובים), ואף אחד מהם לא נוגע לבעיה (הצד הזה אינו המחייג בפועל — הוא היחיד שמחייג בכלל) · בזמן הסריקה `wg-state.json` לא נכתב, ולכן `GET /api/link` החזיר `verdict.hop = "office"` («המנהרה אליה פעילה, אבל הלשכה עצמה לא עונה») בזמן שאין לחיצת יד — מסך שמספר את ההפך מהמציאות.
      בלשון הבעלים: «ניסיתי להוסיף את הלשכת hp המקומית שיהיה חיבור דו כיווני בן פה בענן והמחשב שיושב אצלי בבית. למעשה החיבור הושלם אבל לא הייתה לחיצת יד, לא קפצה שום שגיאה ותכלס אין חיבור ושיתוף בין האפלקציות. תחקור את זה לעומק תדווח ותראה איך אתה יכול לפתור את זה אחת ולתמיד שיהיה פיצר יציב ויעיל לחיבור בין לשכות»
      מקור: הבעלים, 2026-10-12; נמדד על ידי עזריה בלשכת vps1
      מצב (2026-10-12 19:01 — נסגר והוכח): התיקון הורם בלשכת vps1 (`net.dialable_from_here`, `pair_api.claim`,
      `_verdict`, `find_peer`/`heal_links`, `projection.fetch`), והצימוד נכתב מחדש — vps1 מצטרפת, hp-laptop
      קלטה עם `replace: true` (סוכן לשכת HP ביצע). הרשומה: `slot 3, side 2, role joiner, dial host,
      endpoint console.staging.digital-office.co.il, port 51830 (listen_port 51830)`. המדידות:
      `wg show wg3` → `listening port: 51830 · endpoint 79.177.165.212:60670 · latest handshake: 36s ago ·
      transfer: 56856 B received, 43988 B sent` · `GET /api/link` → `state up, verdict {ok: true},
      delivery {door listening, catalog ok}, apps ["plane"]` · `/api/modules` של הקונסול → `plane.hp-laptop`
      (remote hp-laptop, `ok true`, `embed /a/plane/`) · `curl -H 'Host: plane.hp-laptop'
      http://plane.hp-laptop:9003/` → 200, דף ה-Plane של HP · `./bbox dgo link status` → `hp-laptop
      answers: up handshake: 36s ago` · `./bbox dgo test fresh` PASS (כולל הבדיקה החדשה: לשכה בבית מציעה
      ולשכה ציבורית אינה מחייגת לכתובת המקומית שלה) · `pair_contract` PASS · ומדידת מסלול ההקשבה: מאזין
      WireGuard בתוך dgo-net על הפורט המפורסם השלים לחיצת יד מול חיוג ל-31.97.196.82:51830. ראיה:
      `issues/the-pairing-wrote-a-dialer-that-could-never-reach-the-peer.yaml`.
  - key: lnk-025
    name: 'לשכה מקושרת לא יכולה לפרסם פריט ב-Plane של הלשכה האחרת — אין לה מפתח API של Plane'
    priority: medium
    labels:
    - תשתית
    description: |
      מה נדרש: הקישור עם hp-laptop עלה, והאפליקציה שלה (Plane) מוצגת כאן ומגישה דפים, אבל פרסום פריט עבודה מה-API של הלשכה הזאת נעצר על המפתח: `./bbox project-pln plan office` מגיע נכון (`reaching it at http://plane.hp-laptop:9003`) ואז `no Plane API key: the credential plane answered HTTP 404 for plane_local_api_token-local` — כלומר לכספת של vps1 אין מפתח API של Plane של HP, ו-`plan.py` קורא אותו משם (או מ-`PLANE_LOCAL_API_TOKEN`). מה שנדרש: מסלול מוצהר שבו לשכה מאפשרת לעמית לקרוא/לכתוב ב-API של אפליקציה שהיא מגישה — או מפתח שנמסר בכספת דרך הקישור (כמו שהצימוד כותב `dgo_link-<office>` ו-`dgo_link-serve-*`), או שהאפליקציה המגישה מכריזה בקטלוג שלה על `api.auth`/instance והמפתח מגיע לכספת של הצרכן; ומשם — שכל פריט עבודה של הבעלים באמת נכתב ב-DGO מכל לשכה. קבלה: `./bbox project-pln plan office` מלשכת vps1 מחזיר את ה-url של הפריט ב-DGO, והפריט נראה ב-Plane של HP.
      ראיה ומדידות (2026-10-12, לשכת vps1): `./bbox project-pln plan office` → `[bbox] [project-pln] the app runs on a linked office — reaching it at http://plane.hp-laptop:9003` ואחריו `404 unknown instance` עבור `plane_local_api_token-local`; בכספת של vps1 קיימים רק `dgo_link-hp-laptop` ו-`dgo_link-serve-*-agent`; `apps/project-pln/plan.py:8` — המפתח נקרא מ-`plane_local_api_token-local` בכספת או מ-`PLANE_LOCAL_API_TOKEN`.
      בלשון הבעלים: «אני רוצה לגשת לניהול המשימות מכל מקום» (המשך ישיר של issues/a-direct-pair-between-hp-laptop-and-vps1-needs-the-pairing-code-on-both-ends.yaml)
      מקור: נמדד על ידי עזריה בלשכת vps1, 2026-10-12 (התגלה כשהקישור עלה); אין צורך בפעולת בעלים כדי לפתוח אותו, וההכרעה איפה המפתח נמסר — של הלשכות
  - key: lnk-026
    name: 'אפליקציה של לשכה מקושרת לא נפתחת מהקונסול בכתובת localhost — הקצה מפנה ל-authentik וזה מחזיר 404'
    priority: medium
    labels:
    - ממשק
    description: |
      מה נדרש: בכתובת האמיתית (`console.staging.digital-office.co.il`) אריח של אפליקציה של לשכה מקושרת נפתח כראוי (`plane.hp-laptop.console.staging.digital-office.co.il` → 302 למסך הכניסה, כלומר הנתב וה-provider במקומם), אבל בכתובת ה-`.localhost` של אותו קונסול אותה כתובת מחזירה 404 מ-authentik: `gated_hosts` בבלופרינט מכיל את `plane.hp-laptop.console.staging.digital-office.co.il` בלבד, בלי תאום ה-`.localhost`, ואילו `framed_sso_entries` ב-`reconcile.py` מייצר תאומים כאלה רק ל-`external_modules` — כלומר לאפליקציות מקומיות, לא לכאלה שמגיעות מ-`remote:`. הקונסול עצמו יודע את זה (`noNestedHost`) ונופל ל-`m.proxy`, אבל אריח של לשכה מקושרת אינו נושא `proxy`, ולכן המסך מציג כרטיס במקום את האפליקציה. מה שנדרש: אותה החלטה גם על אריחי `remote:` — או תאום `.localhost` בבלופרינט, או `proxy` באריח — והבדיקה: בכתובת `.localhost` אריח של לשכה מקושרת מציג את האפליקציה (או את כרטיס הכניסה) ולא 404.
      ראיה ומדידות (2026-10-12, לשכת vps1): `curl -H 'Host: plane.hp-laptop.console.staging.digital-office.co.il' https://traefik` → 302; `curl -H 'Host: plane.hp-laptop.console.localhost' http://traefik` → 404 (גוף של authentik, `X-Powered-By: authentik`); `.generated/registry/console.modules.yaml` → האריח `plane.hp-laptop` עם `external: true` ובלי `proxy`; `platform-base/authentik/blueprints/zz-generated-apps.yaml` → `gated_hosts` כולל רק את הדומיין האמיתי.
      מקור: נמדד על ידי עזריה בלשכת vps1, 2026-10-12 (נתפס בבדיקת „מה שהבעלים רואה” של אריח Plane)
  - key: lnk-019
    name: 'מה שלשכה נותנת הוא אחד לכל הלשכות המקושרות — אי אפשר לתת ללשכה אחת רק אפליקציה אחת'
    priority: urgent
    labels:
    - אבטחה
    - HP
    description: |
      מה נדרש: `serve:` is one declaration for the whole office (the app says so itself: `pair_api.giving` - "serve: is not per peer"). hp-laptop gives everything (`"*"`, 14 apps: the machine, the vault, the drive among them). The owner asked for a direct link to the VPS office so that task management opens from anywhere (lnk-015) - and with one list for all, pairing with the VPS either hands a public server all 14, or narrowing the list takes the drive and the rest away from the MacBook. Measured on the committed code with stand-in doors: with `only: {vps1: [plane]}` written into `serve:`, vps1's door still answers 200 for `drive` and its catalog lists both. The owner's own model of extending an office (2026-10-04) starts with choosing WHICH apps to give - per office.
      קבלה: a reserved key of the same declaration, beside `exclude` - `serve.only: {<office>: [aliases]}` - narrows what ONE linked office is given; an office not named there is given what `serve:` says, and an empty list is "linked, and given nothing". It is enforced where the request arrives, on the serving side alone (no change of protocol, nothing new on the consuming office): that office's door routes only its own apps (anything else is answered "no app under that name"), its catalog lists only them, and a peer cannot ask for another office's list - the door writes which office is asking and removes what the peer wrote. Proven on stand-ins before/after (two offices, one narrowed), and live: hp-laptop narrowed for one office, measured through that office's door.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-08 (נמצא בהכנת הזיווג עם vps1)
  - key: lnk-020
    name: 'דקה אחרי כל בנייה מחדש של הקישור הלשכה המקושרת מוצגת «לא עונה» — אף שלחיצת היד טרייה'
    priority: low
    labels:
    - באג
    description: |
      מה נדרש: When the link's three services are re-created, the first projection pass runs before the tunnel has shaken hands: the pull fails, the status says the office does not answer, and the screens say «לא עונה» (and mark its tiles off) until the next pass a minute later. Seen 2026-10-08 on hp-laptop after each rebuild: the MacBook's card read «לא עונה» beside «לחיצת יד אחרונה: לפני 40 שנ׳», and «מחוברת» twenty seconds on. The state is true for the second it was measured in and wrong for the minute it is shown.
      קבלה: a pass that fails while the tunnel is young (no handshake yet, or one that is seconds old) is tried again within seconds rather than at the next minute, and until an office has been measured once since the app started its verdict is «נבדקת» (`ok: null`, which `_verdict` already has a shape for), not «לא עונה»; measured by re-creating the three services and reading the card every five seconds.
      מקור: סשן Claude Code בלשכת ה-HP, 2026-10-08 (נראה בצילומי המסך של lnk-019)
  - key: lnk-021
    name: 'העותק של קובץ המצב שבמאגר נושא בלוק `remote:` של לשכה אחת — ולשכה אחרת שמקבלת את הקוד לא עולה («SERVE PLAN REFUSED»)'
    priority: high
    labels:
    - באג
    - בעלים
    description: |
      מה נדרש: The repository's own copy of `platform.state.yaml` carries a `remote:` block — `office: vps1`, `address: 10.79.2.2` — on every line of the DGO branches (`dgo`, `dgo-pair`, `dgo-stable`, line 132). It is one office's PROJECTION (the MacBook's view of vps1), committed with the file, and every office that takes the code receives it as its own. On vps1 itself that row names the office's own tunnel address, today's rule refuses it ("היא הכתובת של הלשכה הזו בקישור הזה"), and `render` refuses the whole office: measured 2026-10-08, vps1's converge to d24547e2 passed backup, code, engine, env, login and state, and `bbox run` died at once on "SERVE PLAN REFUSED". The only thing that rewrites the block is the link app's projection, which runs inside the stack the render had just refused to start; it was freed by hand, and the next `code` step puts the row back. (First recorded here as "a block written by older code" — wrong: the block arrives with the checkout.)
      קבלה: TWO DECISIONS, BOTH THE OWNER'S, either one ends it. (1) The tracked copy stops carrying a projection: the `remote:` block leaves the committed file, or the file stops being tracked at all — that is eng-040 (DGO-408), and this is its first measured casualty. (2) `render` serves the rows it can plan and SAYS the ones it cannot, instead of refusing the office — the writer (`set_remote`) staying exactly as strict. A session tried (2) on 2026-10-08 and the safety classifier refused the edit as weakening a security control, and the index change (1) needs was refused on 2026-10-06 as the owner's call; nothing was routed around, the compiler is as it was. Until one is decided, every converge of vps1 needs its tail re-run by hand after the projection has rewritten the block.
      מקור: עזריה (לשכת המק), 2026-10-08 22:41, בזמן ה-converge של vps1 ל-dgo-stable; השורש נמדד בסשן Claude Code בלשכת ה-HP (`git show origin/dgo-stable:platform.state.yaml`)
  - key: lnk-022
    name: 'שרת ציבורי שהבעלים החליט שיאזין: ההחלטה היא ארבע שורות ב-.env ופורט שנבחר ביד — לא הצהרה אחת ש-bbox run מממש'
    priority: medium
    labels:
    - תשתית
    description: |
      מה נדרש: A local office becomes dialable by itself (`apps/dgo-extend/hooks/prepare` writes `DGO_WG_ENDPOINT`, `DGO_WG_PUBLISH_PORT`, `DGO_WG_PUBLISH_BIND` and `DGO_WG_PORT`; on Windows `bbox.cmd run` opens the firewall). A public server does not, by rule — "a public server's exposure is its owner's decision, never a default" — and the rule is right. But when the owner HAS decided (2026-10-08: a direct pair hp-laptop<->vps1, the laptop behind a home NAT, so the server must listen) the decision has no declaration: somebody types four keys into the server's `.env`, picks a free UDP port by hand, checks the firewall by hand, and until then the office's own card says only «לא הוצהרה לה כתובת». Measured on vps1 after its converge to dgo-stable: every `DGO_WG_*` key present and empty, `dgo-net` publishing 127.0.0.1:51839/udp, and an offer from it would have carried no address — the laptop would have become the listening end with a LAN address the server cannot reach.
      קבלה: ONE owner-set line (`DGO_WG_AUTO=1` on an office with a public domain — the key that already means "this hook may declare") makes `bbox run` declare the endpoint from the office's own domain and a free UDP port, bind the mapping, and open that port in the machine's firewall where one is active, idempotently; without the line nothing is declared, as today, and `DGO_WG_AUTO=0` still means "only dials". Proven on a throwaway copy of an `.env` for the hook's half (declares only with the line), and on a server for the firewall half.
      מקור: עזריה (לשכת המק) וסשן Claude Code בלשכת ה-HP, 2026-10-08 23:00, בזמן הזיווג הישיר hp-laptop<->vps1 (lnk-015)
  - key: lnk-023
    name: 'ביטול צימוד משאיר את האריחים והנתיבים של הלשכה בקונסול — עד ה-bbox run הבא'
    priority: medium
    labels:
    - באג
    description: |
      מה נדרש: «ביטול צימוד» removes the record, the token and the tunnel peer (`pair_api.Pairing.unpair`), and the next projection pass takes the office out of the `remote:` block — but nothing compiles: `projection.apply_new_remote_apps` runs only when an app was GAINED or changed, on purpose ("never because an app went away: … a far better failure than an unattended loop restarting the office's edge every time a laptop sleeps"). An unpair is not a laptop asleep; it is a person's act. Measured 2026-10-08 on hp-laptop, after its side of the pair with vps1 was removed at 23:50: the state file named only the MacBook from 23:53, and the compiled registry still held vps1's 16 tiles and the edge's file 249 lines naming it, half an hour later — sixteen tiles on the console that open onto a tunnel that no longer exists. `bbox reconcile render` by hand took them away.
      קבלה: unpairing an office from the screen takes its tiles and its routes off this office in the same act (the screen says when it is done, and says so if the compile failed); an office that merely stops answering keeps its tiles, marked, exactly as today. Proven on a throwaway pair: the registry and the edge's file before and after, with no command typed.
      מקור: סשן Claude Code בלשכת ה-HP, 2026-10-08 (אחרי הסרת הצד של ה-HP בזוג השגוי עם vps1, lnk-015)
  - key: lnk-024
    name: 'הקישור בין לשכת ה-HP ללשכת המק מנותק זה יומיים — לחקור לעומק, להגיע לעזריה במק, ולהחזיר את הקישור'
    priority: urgent
    labels:
    - באג
    - HP
    description: |
      מה נדרש: הבעלים, 2026-10-10 20:25 (תמלול קולי, מילה במילה): «Deeply investigate why uh, HP disconnected from the Mac uh, DGO. Currently, it's disconnected. So I want to deep, deeply investigate and find a way to contact um, Azaria from the Max VGO, or even if not, it should be reported as an issue that it disconnected and the connection should be restored. You have permissions to run everything.»
      ממצאים (נמדד מלשכת ה-HP, 2026-10-10 20:30-20:50): (1) הצד של ה-HP שלם: wg4 למעלה ומאזין על 0.0.0.0:51830 (מפורסם למארח), כללי Hyper-V ‏DigitalOffice-WG-hp(+Host) מאפשרים UDP 51830, WSL במצב mirrored, ‏.env מצהיר DGO_WG_ENDPOINT=192.168.16.100 — אבל latest-handshake=אף פעם ו-rx=0 מאז שהמכולה נוצרה מחדש ב-2026-10-09 19:31Z (ושוב ב-2026-10-10 17:42Z, ‏bbox run של סשן אחר). ‏link.json: «המנהרה אליה לא מעבירה תנועה». (2) רשומת הזוג (/data/dgo/macbook.yaml): המק מחייג (dial: joiner) אל 192.168.16.102:51830 — הכתובת שה-HP החזיק עד 2026-10-08 11:52; מאז ה-HP הוא .100 (חכירת DHCP, פגה 2026-10-10 21:57). זהו lnk-017 בדיוק; התיקון לצד המחייג (d155d62b, «a dialed pair whose address moved is found again») נמצא ב-hp-dgo וב-dgo-stable אבל origin/mac-dgo לא זז מאז 2026-10-04 (bba447d8). (3) המק (192.168.16.103) עונה ל-ping ב-170-350ms (חתימת «ישן», כמו ב-2026-10-06 02:45), כל פורטי TCP סגורים, ו-UDP 51830/51820 שותקים: ה-HP חייג אליו בעצמו (wg set endpoint, בדיקה בזמן ריצה בלבד) — 1.6KiB נשלחו, 0 התקבלו. אחרי magic packet ‏(WoL ל-5C-13-AC-45-D7-1B) ה-RTT ירד ל-~100ms (המק התעורר) ועדיין אין handshake. (4) גם הקישור מק<->vps1 מת: bina.macbook.console.staging.digital-office.co.il עונה 404 (ל-vps1 אין עוד נתיב למק), drive.macbook… בלי תעודה. שני הקישורים של המק מתים יחד = לשכת המק (האורח של Lima / dgo-net שלה) לא מחייגת לאף אחד — לא רק כתובת שגויה. (5) אין דרך להגיע לעזריה של המק מכאן: הצ'אט שלו דרך vps1 — 404; דרך הקישור — מת; מראה ה-git ‏macbook-git — 502; הוא כותב לסשן הזה מהדפדפן של המק אבל זו דלת לכיוון אחד.
      מה מחזיר את הקישור (על המק — עזריה של המק או הבעלים; מכאן אי אפשר): (א) להעיר את המק ולהשאיר אותו ער (או לאפשר Wake on Demand); (ב) `./bbox engine status` ואז `./bbox run` — ולראות שהמנהרה שלו מחייגת ל-vps1 (הקישור הזה חוזר תוך דקה כשהלשכה חיה); (ג) הרשומה שלו ל-hp-laptop צריכה לחייג ל-192.168.16.100:51830 (ולא .102) — או שהמק מריץ את d155d62b והמחפש מוצא את ה-HP לבד; (ד) רצוי: `./bbox engine forwards --apply` כדי שגם ה-HP יוכל לחייג למק (היום הוא engine-guest ואין מי שיקבל UDP); (ה) שמירת כתובת קבועה ל-HP בנתב נשארת בחירה של הבעלים (lnk-017).
      קבלה: ב-HP ‏`wg show wg4 latest-handshakes` מראה handshake טרי ו-link.json אומר ok; אריח של המק נפתח מהקונסול של ה-HP; הצ'אט של עזריה-מק נפתח דרך vps1; ואחרי שהחכירה של ה-HP מתחלפת שוב הקישור חוזר לבד תוך שתי דקות (lnk-017). עד אז: דוח החקירה המלא מצורף לפריט (issues/hp-mac-link-down-2026-10-10.md).
      מקור: הבעלים, 2026-10-10 (בקשה בסשן Claude Code בלשכת ה-HP); המדידות — אותו סשן
- key: o-agent
  name: סוכני הלשכה
  status: backlog
  description: 'בינה/עזריה: ה-harness, ה-CLI, המודלים.'
  items:
  - key: agt-001
    name: מצא את מודל ה-LLM האג'נטי הטוב ביותר שרץ על המכונה הניידת
    priority: medium
    labels: []
    description: |
      מה נדרש: Research which agentic coding model (best SWE-bench-Pro score, preferring DeepSeek V4 Flash, then the best Qwen) fits the portable machine's resources, including the most optimised build for a 4-core CPU or a laptop GPU. Done = a written recommendation naming the model, quantisation and the spec it assumes.
      בלשון הבעלים: «what is the best agentic llm i can run on portable machine (see full resources spec) i really want deepseek v4 flash»
      נאמר: 2026-08-12 עד 2026-08-12, 3 פעמים.
      מצב (פתוח): No model research or recommendation found under ai/, apps/ollama or issues/ (grep deepseek, qwen, portable machine)
      מקור: סשנים של Claude Code (claude-05#6)
  - key: agt-002
    name: הצג מחיר בשקלים ליד שימוש הטוקנים בממשק הסוכן
    priority: medium
    labels: []
    description: |
      מה נדרש: Next to the per-turn usage chip ('שימוש 42.4 אלף טוקנים') show what it cost in shekels; on 09-22 he also asked how much a task had cost. Done when the usage chip and the session statistics show a ₪ amount derived from the model's price and a USD→ILS rate.
      בלשון הבעלים: «אתה יכול להוסיף מחיר בשקל ליד ה שימוש 42.4 אלף טוקנים»
      נאמר: 2026-09-17 עד 2026-09-22, 2 פעמים. שוב ב-2026-10-12: «במקום 1.9 מ טוקנים אני רוצה את העלות בשקל או מה שמוגדר בהגדרות … תוודה שהפעם זה נכנס רשמית לאפלקציה של בינה ודעת … וספק הוכחות»
      מצב (פתוח): apps/bina-ds/plugins/locale-he/dicts/he/chat.json:81 'שימוש {total}' shows tokens only; no ₪/ILS/cost string anywhere under apps/bina-ds
      מקור: שיחות עם עזריה בלשכת המק (mac-01#1)
      ── נמסר 2026-10-12, לשכת ה-vps1 ──
      נבנה תוסף רשמי: apps/bina-ds/plugins/cost-meter (lib/pricing.js — מחירון DeepSeek 12-10-2026 כולל שיא/שפל;
      lib/cost.js — קיפול על אירועי הסשן; lib/index.js — יחידת projection בשם costMeter ומרחב הגדרות cost-meter;
      lib/client.js — הגלולה בדוק התחתון, הפאנל וכרטיס ההגדרות). נרשם ב-harness/profile: תלות file: ב-package.json
      ושורה ב-cordis.patch.yml. 13 בדיקות ב-test/pricing.test.mjs עוברות; המחירים והחישוב אומתו מול 16 יומני סשן
      אמיתיים בלשכה (הגדול: 152.4M טוקנים = ₪2.68) ומול הריצה החיה (סשן 3e2f4c31: 15.7M טוקנים = ₪0.480, וגם
      ₪0.390 אחרי ששער 3.0 נשמר בהגדרות). צילומים: ci-artifacts/cost-pill-mock/.
      מה שנשאר מהקבלה: הצ׳יפ של השימוש בסבב ('שימוש 42.4 אלף טוקנים') וטבלת הסטטיסטיקה של השיחה עדיין מציגים
      טוקנים בלבד. הדוק התחתון — מה שהבעלים ביקש ב-10-12 — הוחלף.
  - key: agt-003
    name: 'קבע דפוס אחיד: אפליקציה רגילה תחת apps/ שמביאה איתה את הקונטקסט שלה לעזריה'
    priority: medium
    labels: []
    description: |
      מה נדרש: A new capability is a regular office app under apps/<id> (he rejected an 'office-apps' side tree) and carries its own AI brief, so Azaria knows it exists and how to operate it the moment it is installed, with nothing hard-coded in the agent. The mechanism works; the older core apps still ship no AGENT.md, so the agent has no brief for them.
      בלשון הבעלים: «ברגע שמתקינים את האפלקציה עזריה יודע שהיא קיימת ויש דפוס קבוע איך כל אפלקציה בלשכה הדיגיטלית מנהלת את הקוטנקסט שלה»
      נאמר: 2026-09-23 עד 2026-09-23, 3 פעמים.
      מצב (חלקי): reconcile.py render_agent_context → .generated/registry/agent-context.md → bina-ds plugin office-context; 10 apps declare agent.context; mail, drive, indox, chat, my-docs, apitools do not
      מקור: שיחות עם עזריה בלשכת המק (mac-01#11)
  - key: agt-004
    name: '‎/next — פקודת דו״ח אחד על כל העבודה הפתוחה, וכל דיווח באג מהבעלים נפתח כפריט ב-DGO'
    priority: high
    labels: []
    description: |
      מה נדרש: (1) `/next` כפקודת סלאש: סוקר את כל מקורות העבודה הפתוחה — שני קובצי התוכנית של DGO (apps/project-pln/plans/dgo-dev.yaml + plans/office.yaml, שהם ההצהרה שממנה Plane מורכב), issues/*.yaml עם status open/in-progress/blocked, מצב הלשכות והקישורים (`./bbox dgo`, `/api/link`), והרשימה שלי ב-Plane כשהוא נגיש — ומחזיר דוח קצר: מה דחוף, מה חסום ומי חוסם, מה מחכה לבעלים, ומה מומלץ לסבב הזה עם ההוכחה שתראה. (2) כלל עמידה: כל דיווח באג או בקשה של הבעלים נפתחים כפריט עבודה ב-DGO במקום הנכון, לפני העבודה — לא „אני אבדוק”, ולא תיקון בלי פריט.
      מצב (מיושם, ממתין לבנייה): התוסף `apps/bina-ds/plugins/command-next` רשום ב-`agent-presets/azaria/agent.cordis.yml` וב-`harness/profile/package.json`; המיומנות `next-work` עם `overview.py` (369 פריטים מוצהרים + 70 קבצי issue, עובד גם בלי Plane) יושבת ב-`skills/next-work/`; הכלל נוסף ל-`skills/plane-tasks/SKILL.md`. הפקודה לא קיימת ב-harness עד `./scripts/dc up -d --build bina-ds` (‏node --check עבר; הבריף של `/next` מפנה למיומנות).
      מקור: בקשת הבעלים, 2026-10-06 («/next command should analyse all open work overviews and suggest the work should be done next» · «any bug report i send you or any task should be opened currectly at the right place and investigated on»)
  - key: agt-005
    name: 'כל בקשה של הבעלים היא קודם כל פריט עבודה ב-project-pln — עם כל הקבצים שצירף, וקישור אליו בתשובה; ורק אז מתחילים'
    priority: urgent
    labels:
    - cli
    - plane
    description: |
      מה נדרש: The owner, 2026-10-07: "Make sure to remember in context that when I send request like this alwase mange it with an workitem in projectpln with all my attachments and reply (also you also azaria) with the link to the workitem and then start working on it (unless you got only questions/asked only to report or wait)". Until now a request became a hub item when the work was written up, without its pictures, and the answer carried no link. The hub's command line had no way to put a file on an item.
      קבלה: `./bbox project-pln tasks attach <REF> <file…>` puts a request's files on its item (through Plane's own signed upload, from any office - also one that reaches Plane behind the link); the rule is one of the owner's standing rules in AGENTS.md, where every office's agent reads it (hp-laptop's and the MacBook's עזריה); shown on this very request and on ui2-037: each is an item with the owner's words, its attachments open in Plane, and the reply to him carried the link before the work began.
      מקור: הבעלים, 2026-10-07 (הודעה בסשן של Claude Code בלשכת ה-HP)
  - key: agt-007
    name: בטלפון אי אפשר לראות מה מקלידים בבינה — המקלדת מכסה את תיבת הקלט (המסך לא מתכווץ איתה)
    priority: high
    labels:
    - ממשק
    - באג
    description: |
      מה נדרש: On a phone, typing into בינה shows nothing: the message composer sits at the bottom of the LAYOUT viewport, and Chrome/Android's on-screen keyboard only shrinks the VISUAL viewport, so the whole composer (input, send button, model/context row) stays behind the keyboard. The shell must hand the app the height that is really left: `interactive-widget=resizes-content` in the console's viewport meta, plus a shell-owned VisualViewport `--kb` fallback for browsers that do not implement it. Nothing inside an app can fix it — an iframe's `visualViewport` equals its layout viewport (MDN), so the number must come from the shell.

      בלשון הבעלים: «חקור לעומק ודווח תקלה למה זה לא מראה לי את הטקסט שאני כותב בזמן שאני מקליד במובייל. מה הפרקטיס הכי טוב במובייל ומה המשתמשים דיפסיק הרנס הרשמי מדווחים וממליצים»

      ראיה/מדידות (2026-10-12, live console at the phone profile 411×891 through the real edge; in `ci-artifacts/keyboard-mobile/`): with the keyboard closed the conversation composer is at page-y 703–831 and the editable at 711–747 — docked at the bottom of `iframe#frame` (411×773 at y=58). His keyboard covers page-y 587–891 (keys start at 66 % of the screen), so the entire composer is inside the covered band; the band itself (`B1-keyboard-open-resizes-visual.png`) shows the conversation and no composer. With the layout viewport resized instead (`C1-keyboard-open-resizes-content.png`) the iframe becomes 411×469 and the composer re-docks at 399–527, the input at 407–443 — clear of the keyboard. Full argument and sources: `issues/mobile-composer-hidden-behind-the-keyboard.yaml`.

      קבלה: on a phone the composer, its send button and the text being typed are visible while the keyboard is up — measured at the phone profile in the console and in full screen (`html.bare`), with the numbers in the issue file.

      מקור: הבעלים, 2026-10-12 16:22 (צילום מסך מהטלפון: הקלדה בצ׳אט של בינה בלי שהטקסט נראה)
  - key: agt-008
    name: 'הקישור העליון נושא את השיחה עצמה — קישור עמוק לשיחה בבינה (‎#/m/bina?s=<id>)'
    priority: high
    labels:
    - ממשק
    description: |
      מה נדרש: The address bar must name the conversation that is open in בינה and be copyable — opening that link anywhere lands on the same conversation. Today the console URL is `#/m/bina` whatever is on screen: the harness's browser half has NO url routing at all (the durable selection lives in the browser's own storage, `dsh.sessions.current`), so the shell has nothing to mirror and nothing to hand back on arrival.

      בלשון הבעלים: «אני רוצה שהקישור העליון יכיל את הקישור לשיחה עצמה תחקור לעומק איך הכי כדאי לעשות את זה ותן לי את הקישור»

      ראיה/מדידות (2026-10-12, live): the pinned frontend build (dsh-web-frontend 0.1.6-alpha.1, dist/assets/index-C04Zg7TP.js) contains zero `location.hash` / `pushState` / `URLSearchParams`; the shell's grammar IS `#/m/<id>[/inner/path][?query]`, it mirrors an embedded app's route from a same-origin postMessage (`{type:'bina:route', path}` — platform-base/console/static/app.js:943-1014) and hands that tail back through joinEmbed, so the missing half is the app's. `/a/bina/<path>` answers 404 (no SPA fallback) while `/a/bina/?s=<id>` serves the app — the route form is the QUERY. The harness's own client service `sessions` (`open(id)`; list snapshot with `getSnapshot`/`subscribe`) is the documented door.

      קבלה: on the live console, `https://console.<domain>/#/m/bina?s=<sessionId>` opens that conversation, and moving between conversations leaves the address bar naming the open one — proven with a browser screenshot and the harness's own session list.

      מצב (2026-10-12): נבנה תוסף רשמי — `apps/bina-ds/plugins/session-link/` (‏`lib/client.js`: שני הכיוונים דרך שירות הלקוח `sessions`; 12 בדיקות ב-`test/client.test.mjs`; תלות `file:` ב-`harness/profile/package.json` ושורה ב-`cordis.patch.yml`). התמונה נבנתה ואומתה לפני ההרמה (המניפסט שהתהליך מגיש מכיל את התוסף עם תלות הטעינה, הבאנדל מוגש, והמנוע עולה נקי). הראיות: `ci-artifacts/session-link/` — `before.log` (הקישור העמוק לא נפתח, סרגל הכתובת נשאר `#/m/bina`, בדפדפן אמיתי דרך המנוע), `owner-shot.png`, `after-restart.log` + שלושה צילומים אחרי ההרמה.
      שער הרשומה: Plane (`apps/project-pln`) אינו מותקן בלשכה הזאת והקישור ל-hp-laptop למטה (`verdict: pair`), ולכן הפריט נשאר בהצהרה הזאת — `./bbox project-pln plan office` יפרסם אותו כש-Plane יחזור.

      מקור: הבעלים, 2026-10-12 17:16 (צילום מסך של הקונסול, `console.staging.digital-office.co.il/#/m/bina`; השיחה הפתוחה בצילום: «לשכת HP מקומית מחוברת דו-כיוונית»)
  - key: agt-009
    name: 'עדכון עצמי שממשיך את הסוכן, ו-`bbox update` שמוכיח שההרמה נחתה — בלי שאף אחד ימתין'
    priority: urgent
    labels:
    - cli
    - תשתית
    description: |
      מה נדרש: The owner, 2026-10-12: «אתה חייב למצוא דרך יותר יעילה לעדכן את אפלקיית בינה ודעת ואפלקציות בכללי מבלי לחכות שמשהו יקרה … פשוט תריץ בעצמך את העדכון ותפעיל מראה משהו שימשיך אותך ברגע ששוב זמין. תחקור לעומק על הדרך האולטימטיבית». Updating the app the agent itself runs in ended the turn that asked for it, and the work resumed only when a person came back and typed; and for every other app `./scripts/dc up -d --build <app>` could deploy NOTHING and read as success.

      ראיה/מדידות (2026-10-12, live):
      · ההמתנה העצמית: פרדיקט ה"שקט" ספר גם את השיחה שביקשה את העדכון, והלוג ישב שעה שלמה על `waiting for a quiet moment … a conversation wrote in the last 120s` (17:49→18:21) בזמן שהכותב היחיד היה זאת שביקשה.
      · הסיגנל הנכון: ה-adaptor (‏agent.v1) מדווח `running` לכל שיחה — 22 שיחות, ורק המבקשת `true`. מכאן ההרמה נוחתת בפער שהמבקשת משאירה בסוף התור, ולא באמצעו.
      · ההמשכיות: ההודעה נשלחת מה-helper (מחוץ לקונטיינר) ל-`POST /v1/sessions/<id>/messages` עם הטוקן מהנפח — בלוג: `ok: bina-ds healthy on image adb929648b58` ואחריו `continued session session-3b0e4897-… (the update's own continuation message was accepted)`. התור הבא נפתח מעצמו פעמיים הלילה (שתי הרמות), בלי שאדם נגע בדבר.
      · אפליקציות בכלל: `./bbox update <app…>` (‏`scripts/app-update.sh`) — בונה, משווה את התמונה שהקונטיינר רץ עליה לזו שנבנתה, מחליף רק כשהן שונות (או `--force`), ממתין ל-healthcheck של הקונטיינר עצמו, ומחזיר את התמונה הקודמת אם לא נהיה בריא. נמדד על drive: `dc up -d --build drive` דיווח `Running` ולא החליף כלום פעמיים באותה שעה; הוורב החדש אמר `nothing to apply — drive already runs the build just made`, ו-`--force` החזיר `ok — drive healthy on c1bf5db1436b` (ובדיקת דפדפן אחריו עברה). bina-ds מועבר לדלת של עצמו (`apps/bina-ds/hooks/self-update`) והמנוע אומר זאת במקום לחכות לקונטיינר שביקש למות.

      קבלה: `./bbox update <app>` מדווח בדיוק מה קרה (מה נבנה, מה הוחלף, מה הבריאות) ואף פעם לא "מצליח" בלי להחליף; הרמה של bina-ds ממשיכה את השיחה שביקשה אותה בלי שאדם יגע; ושתי הדרכים נמדדו על אפליקציה חיה.

      מקור: הבעלים, 2026-10-12 18:22 (בהמשך ל-ui2-044 ולעבודת ההרמה של agt-007)
  - key: agt-006
    name: '„העתקה לא עובד” — כפתור ההעתקה בשורת הפעולות של ההודעה לא מעתיק בחלון בינה שבתוך הקונסול'
    priority: high
    labels:
    - באג
    - ממשק
    description: |
      מה נדרש: בכפתור ההעתקה שבשורת הפעולות של הודעה (לצד 👍/👎, כלי העזר „העתקה”/„הועתק”) הלחיצה אינה מעתיקה דבר ואינה מראה „הועתק” — כלומר ההודעה לא נכנסת ללוח. הבעלים דיווח על כך בצילום מסך של חלון הבינה (הכלי „העתקה” גלוי מתחת להודעה) במשפט «העתקה לא עובד». בוצע = הלחיצה מכניסה את טקסט ההודעה ללוח ואומרת „הועתק”, במשטח שהבעלים באמת משתמש בו — חלון בינה בתוך הקונסול (‏console/a/bina, iframe) — ולא רק בעמוד עצמאי.
      קבלה: קריאה חיה של הלוח (‏navigator.clipboard.readText דרך הדפדפן של הלשכה) מחזירה את טקסט ההודעה אחרי לחיצה אחת בכל אחד משני המשטחים: בינה standalone ובינה ממוסגרת בקונסול; כשאין הרשאה ללוח — הכפתור עדיין מעתיק (נפילה למסלול הישן) ואם גם זה נכשל הוא אומר משהו, ולא נשאר שקט.
      מקור: הבעלים, 2026-10-09 14:50 (צילום מסך «צילום מסך 2026-10-09 ב-14.50.57.png» מצורף לפריט)
