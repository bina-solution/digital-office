  - key: sec-019
    name: 'כניסה שקטה בתוך מסגרת: ספק הזהות תחת האתר של הקונסול בלשכת ‎.localhost'
    priority: medium
    labels:
    - אבטחה
    - כבד
    - HP
    - בעלים
    description: |
      מה נדרש: The root of every "sign in again" on a .localhost office: auth.localhost is another SITE than console.localhost, so a frame on a nested host can never pass the sign-in by itself. ui2-012 works around it with one top-level trip per host per day. The cure is one site: the identity provider under the console's own name (auth.console.localhost — the provider's session cookie is Lax over http and then travels into a same-site frame), with the shell trying the frame silently before it takes the trip. NOT the provider's domain-level mode: the outpost matches a domain provider by the suffix of host:port, so a console on :8080 (the macOS edge) never matches. Touches AUTH_EXTERNAL_URL / AUTHENTIK_BASE_URL in each office's .env, every provider's issuer and the capture scripts that name auth.localhost; everybody signs in once more. Alternative recorded in pln-002: one DEV_DOMAIN for every app.
      קבלה: on a .localhost office with a live sign-in, a tile on its own host opens with no navigation of the console page (0 loads of /.dgo/enter), in the office browser and in a browser on the host port.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-06
  - key: sec-020
    name: 'הפעלת openhands מפרסמת את ה-API של Docker בלי אימות על כל ממשקי הרשת (docker-proxy ‎2375)'
    priority: high
    labels:
    - אבטחה
    - באג
    - בעלים
    description: |
      קובץ ה-issue (המדידות והניתוח המלא): issues/openhands-docker-proxy-publishes-the-docker-api-on-every-interface.yaml · נפתח 2026-10-06 · סטטוס שם: open
      מה נדרש: apps/openhands runs `docker-proxy` (socat TCP 2375 -> /var/run/docker.sock) and publishes it as `2375:2375` on 0.0.0.0 — whoever reaches the port owns the host. The app ships disabled, so no office is exposed today. Binding to loopback would close the feature too (the sandboxes come back in through host.docker.internal), so the fix needs the app running: sandboxes on the office network, or a bridge-gateway bind with a filtering proxy. Same look for `openhands 3000:3000`.
      קבלה: with openhands enabled, no port of it is published on every interface; a sandbox still reaches docker; a gate refuses an all-interface publish outside the edge.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-06 (סריקת כל ה-ports בקובצי ה-compose)
  - key: sec-021
    name: 'מכולה שאסור להפעיל מחדש יכולה להיות לא תקינה שעות בלי שאף הודעה נשלחת'
    priority: medium
    labels:
    - תשתית
    - אבטחה
    description: |
      מה נדרש: autoheal is the only thing that posts a container's health to the notification centre, and only for containers that carry `binaos.autoheal=true` — the ones it may RESTART (six on hp-laptop: the n8n workers and runners, Plane). A container that must not be restarted — the sign-in sentinel (a restart mid-apply starts the apply over; decided 2026-10-07 in issues/authentik-bootstrap-unhealthy-for-fifteen-hours-two-sso-hosts-unserved.yaml), every database (autoheal's hard refusal list) — can report `unhealthy` for hours: the machine screen and the apps screen show it to whoever opens them, and nobody is told. Wanted: a SUSTAINED `unhealthy` on such a container becomes one notice per episode, never a restart, after a threshold that outlasts a cold start (the sentinel's own apply deadline is 15 minutes) — a notice on every slow first boot is the red light over a working system. Two shapes to weigh, one owner either way: a second label value (`binaos.autoheal=watch`) in autoheal, whose loop already observes and posts; or the machine service, which already reads every container's health.
      קבלה: a container held unhealthy past the threshold produces exactly one notice naming it and its last health output, and is not restarted; a cold start of the office produces none.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (מיון eng-010 / sec-006 מול הקוד)
  - key: sec-022
    name: '`auth_exclude` מוצהר בסכמה וב-social-list ואינו ממומש במהדר — לממש (ולחשוף בגילוי ההתקנה) או להסיר'
    priority: medium
    labels:
    - אבטחה
    - בעלים
    description: |
      מה נדרש: The manifest schema offers `routing[].auth_exclude` ("path prefixes exempt from auth"), build-your-first-app.md documents it, and apps/social-list declares `/public/` and serves expiring image copies there for the office browser. The label emitter (platform/manager/reconcile.py) never reads the field: on a host the compiler routes every router is gated, so the path is behind sign-in and the feature cannot work through the edge. G21 says so as a note on every run. Two ways out, and the first OPENS a path without sign-in, which is why it is the owner's: (1) implement it — a higher-priority, un-gated router per excluded prefix on every host variant (what drive does by hand for /file/d/), and say it in the install disclosure (the `no-auth` power fires only for `auth: none` today); (2) withdraw it from the schema and from social-list, and give that app another way to hand an image to the browser. For hand-written composes the field already binds in the other direction: G21 refuses an open path the manifest does not list (drive /file/d/, browser42 /mcp).
      קבלה: either a compiled app's excluded path answers without sign-in while everything else on its host redirects to it, with the disclosure naming the paths — or no manifest and no document mentions the field.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (השער של sec-003)
  - key: sec-023
    name: 'ריפוי עצמי של לשכה אחת מפעיל מחדש מכולות של לשכה אחרת על אותו מנוע'
    priority: high
    labels:
    - אבטחה
    - באג
    - HP
    description: |
      מה נדרש: autoheal listed every running container on the ENGINE that carries `binaos.autoheal=true`, not its own deployment's. hp-laptop's engine carries two compose projects (measured 2026-10-07: 45 containers of `mydgo`, 8 of `platform-os-net`, an autoheal in each), so each autoheal counted the other stack's labelled containers as eligible: a wedged n8n worker of this office would be restarted by both, under two separate circuit breakers, and reported in the other office's notification centre. Fixed in this tree (commit 391db83a): the list is scoped to the service's own compose project; shown live in DRY RUN against two throwaway labelled containers - the committed code would restart both, the new one only its own project's.
      קבלה: on an engine with two stacks, neither autoheal restarts or reports the other's containers. Done for this office's autoheal. STILL OPEN: the `platform-os-net` stack runs its own checkout, whose autoheal still counts this office's six labelled containers (the n8n workers and runners, Plane) - it stops when that checkout takes the commit by merge and rebuilds its autoheal.
      מקור: הסשן של Claude Code בלשכת ה-HP, 2026-10-07 (אחרי בניית autoheal מחדש הופיע לצידו autoheal שני, של הפרויקט השכן)
