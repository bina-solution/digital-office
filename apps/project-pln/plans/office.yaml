      משימות בקובץ:
      - [בוצע] Fix mailLabelEngine01 `Batching 1` — move `Start Gmail Item` strictly above y=272
      - [בוצע] Fix indoxV2Driver01 `Loop Over Items39` — break the y=14840 tie so the work wins
      - [בוצע] Full fleet audit — every splitInBatches across all blueprints, with a positive-controlled detector
      - [בוצע] Audit n8n-loop-order-lint.py against the quoted rule; confirm it catches the y-tie case
      - [בוצע] Resolve why the lint flags syncV3Deliver0001, whose loop has no same-output fan-out
      - [בוצע] Fix the auto-layout tool to preserve loop-lane ordering, or refuse workflows with splitInBatches
      - [בוצע] Push the staged fix live (scratchpad/push-batch1.sh, coordinated slot) — LANDED, active version confirms 'Batching 1' at the user's own dragged coordinate [-96,432]
      - [בוצע] Fleet-wide zero-defect confirmation with a mutation-test proof (100 injected, 100 caught, 0 missed) — see 6b
      - [בוצע] Capture the first genuine post-fix scheduled run (~10:15 UTC) as behavioural proof — interleaved log + runtime vs the 748.5-829.7s baseline
      - [בוצע] Relay the indoxV2ActionsBS01 +16px knife-edge (tightest margin in the fleet) to its owning lane before any further edit near that loop — done, flagged directly
