  - key: req-002
    name: 'בקשת הבעלים 2026-10-09 — לסגור את המלאי לבד עד מוצאי שבת, ולסיים את השבת עם גרסה מושלמת והלשכה יוצאת לציבור'
    priority: urgent
    labels:
    - כבד
    - בעלים
    description: |
      מה נדרש: מה שהבעלים ביקש ב-2026-10-09 לפני כניסת השבת, כלשונו למטה. בפועל שלושה דברים: (א) לדעת מתי שבת נכנסת ולסגור את החלון; (ב) שהלשכה תמשיך לעבוד לבד — עזריה והתת-סוכנים — עד מוצאי שבת, בלי שהבעלים יגע בדבר; (ג) שהחלון ייגמר בגרסה מושלמת, מוכחת, ועם הלשכה יוצאת לציבור. נמדד ברגע הפתיחה: 318 פריטים פתוחים בלוח (104 מהם urgent/high), 512 שורות בפרויקט DGO, ו-18 פריטים בתהליך — ולכן "כל המלאי" אינו בהכרח 318 פריטים אלא כל מה שלא חסום על הבעלים, לפי סדר העדיפות, כשכל פריט שלא נסגר אומר במשפט אחד למה.
      קבלה: (1) שרשרת העבודה האוטונומית חמושה ומוכחת במדידה — מטרה פעילה עם מכסת סבבים, והדופק (apps/bina-ds/pulse.sh) שמעיר שיחה ששקטה 20 דקות כשיש לה מטרה פעילה, עם שורת wake אמיתית בלוג; (2) פריטי הלוח מקודמים לפי סדר העדיפות, כל "בוצע" נושא הוכחה (שער ירוק / בדיקה שרצה / צילום), וכל פריט שנשאר פתוח במוצאי שבת נושא משפט אחד שאומר למה — בעלים, מכונה, או זמן; (3) לפני צאת השבת: שערי ה-CI, `bbox baseline` ודוח אחד על הפריט הזה עם המספרים; (4) שום פריט לא מסומן בוצע בלי הוכחה, וגם לא "כמעט".
      מקור: הבעלים, 2026-10-09 (הודעה לעזריה בלשכת ה-HP, לפני כניסת השבת; שעת הדלקת נרות בירושלים 17:34, בצאת השבת 18:49).
      בלשון הבעלים:
      עוד מעט נכנסת השבת (תראה תאריך) ואני הולך לשבות מעבודה, אני חייב שתתכוננן לזה ותוודה שאתה יכול להישאר על זה ולסיים את כל המשימות במלאי בפליין ושהכל יהיה מושלם ולא ישארו עוד משימות במוצאי שבת
      תברר מתי שבת נכנסת ומה כבר קורה בכל מקביל ותחשוב לעומק איך אפשר להבטיח שעזריה וחבריו ישלימו את כל המשימות לבד בלי התערבות שלי עד מוצאי שבת לסיים את השבת עם גרסה מושלמת והשקת הלשכה לציבור הרחב

