  # ──────────────────────────────────────────────────────────────────────────────────────────────
  - key: git
    name: "git · Forgejo הוא האריח"
    status: in-progress
    description: "כלל הבעלים: «לקחת 99 אחוז מהתצוגה של הקוד פתוח… רק חיבורים נוספים והתאמות ללשכה, לא לבנות מחדש את המסכים!». היום הקונסול מציג את ההפך: ה-UI שנבנה מחדש הוא האריח, ו-Forgejo מוסתר."
    items:
      - key: git-1
        name: "Forgejo הוא האריח (host-embed במסגרת הקונסול); ה-UI של הלשכה מצטמצם לחשבונות/חיבורים והצהרות mirrors"
        priority: urgent
        labels: [ממשק]
        description: |
          apps/git/app.json: המודול `git` (embed:true, order 4) הוא המסכים שנבנו בלשכה (index.html 506 שורות + app.js 913 + app.py 952 — "אוסף של שברי פיצ'רים" במילות הבעלים); המודול `forge` (Forgejo 16.0.5, host forge, port 3000) הוא embed:false בלי external:true, ו-reconcile.py:1654-1656 מדלג עליו — בלי אריח, לא בסרגל, לא בבית, לא ב-⌘K.
          - `forge` הופך לאריח (host-embed בתוך המסגרת: `curl -I forge.localhost:8080/` → 200 בלי X-Frame-Options ובלי CSP — ההצפה עובדת; עוגיית Lax → אותה תלות same-site של DGO-11 ב-Mac, ב-VPS תקין).
          - המסכים של הלשכה מצטמצמים למה שרק הלשכה יודעת — חשבונות/חיבורים והצהרות mirrors — כאריח משני או מגירה; mirrors רצוי כ-pull-mirrors של Forgejo עצמו (הפריט "native mirrors" ברשימת הבעלים), כך שיש מקום אחד שמציג מאגרים.
      - key: git-2
        name: "כניסה אחת: auth:sso ב-edge + Forgejo reverse-proxy auth (X-authentik-username, auto-registration, trusted proxies)"
        priority: high
        labels: [אבטחה, בעלים]
        description: |
          היום: הטופס של Forgejo (REQUIRE_SIGNIN_VIEW=true, DISABLE_REGISTRATION=true) על host עם auth:none = כניסה שנייה ומארח ציבורי.
          - הנתיב auth:sso ב-edge + `FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION=true`, `REVERSE_PROXY_AUTHENTICATION_USER=X-authentik-username`, `ENABLE_REVERSE_PROXY_AUTO_REGISTRATION=true`, `REVERSE_PROXY_TRUSTED_PROXIES=<CIDR של רשת traefik>` — כניסה אחת, הזהות של ה-edge. הפריט הפתוח של הבעלים "approve Forgejo SSO" הופך למתג שהוא אומר לו כן.
      - key: git-3
        name: "קבלה: אריח → רשימת המאגרים של Forgejo במסגרת, מחובר כמשתמש ה-edge (בלי טופס שני); mirrors של Forgejo; אין דפדוף מאגרים בממשק הלשכה; 390px"
        priority: high
        labels: [שער, ממשק]
        description: |
          - אריח בקונסול → רשימת המאגרים של Forgejo נטענת בפאנל התוכן, כבר מחובר כמשתמש ה-edge.
          - mirrors מוצגים על ידי Forgejo עצמו; לממשק הלשכה אין דפדוף מאגרים משלו.
          - עובד ב-390px; 1.3k השורות הלא-מחויבות של apps/git נכנסות בקומיט לפי DGO-4 לפני שממשיכים.

