          - האפליקציה מוצגת בחלון שולחן-עבודה ברוחב שרירותי (בצילום: חלונות של 940px בתוך viewport של 2000px) — הפריסה מגיבה למכולה (CSS container queries על שורש האפליקציה), לא ל-viewport.
          - מחלקות גודל לפי Material 3 window-size classes ו-canonical layouts (list-detail, supporting pane) ו-Apple HIG (סייד-בר → tab bar בקומפקטי, split view מתקפל): compact <600px → נווט כמגירה (או bottom bar עד 5 יעדים), פאנל אחד (רשימה או פרטים), חיפוש כאייקון שנפתח במקום, סרגלים לפי Priority+ (ראשי + שניים גלויים, השאר תחת ⋯); medium 600–840 → רכבת אייקונים + פאנל אחד; expanded ≥840 → נווט מלא + list-detail.
          - תמיד: מטרות מגע 44px, כותרות של שורה אחת (ellipsis, לעולם לא wrap), pitch קבוע לשורה, חשיפה הדרגתית לרשימות ארוכות. מדדי השוואה: Linear, Superhuman, Apple Mail — חיפוש ברכבת, עמודת meta אחת, שורות של שורה אחת.
