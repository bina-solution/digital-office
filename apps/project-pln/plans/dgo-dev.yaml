# apps/project-pln/plans/dgo-dev.yaml — the DGO Extend roadmap as data, rendered into Plane by
# `./bbox project-pln plan dgo-dev` (hooks/plan → plan.py; upsert, never delete).
#
# This file also DECLARES the project (name, description, lead): it is the hub of all development —
# «הלשכה הדיגיטלית» — and plans/office.yaml adds everything that is not this roadmap to the same
# project (`project: { identifier: DGO }`). Apply this one first.
#
# The design it breaks down: ai/context/dgo-extend-plan.md (sections 11 "Decisions" and 12
# "Implementation plan"; the owner accepted the two open decisions on 2026-09-30: rename to
# dgo-extend, CI-built images) plus the owner's additions of the same day: the work is ASSIGNED to
# the office agent (עזריה, a Plane account of his own), moves to בוצע when he completes it, and shows
# on כל מקביל (any-concurrency) next to his session timeline. Every phase is a module; every gate is
# a work item labeled שער. Keys (p1-3, …) are stable identities — rename freely, never re-key.
#
# 2026-09-30 22:45 — the owner delegated the open decisions to the coordinator ("you can do everything,
# you don't need me"): DGO-58 Forgejo SSO → enable (two steps, as documented); DGO-64 INDOX → supabase +
# indox placed on vps1 in phase 2 (no five containers on the 5 GB engine); DGO-15 → document god-mode;
# DGO-69 → pruned (15.1 → 2.3 GB, newest 5 kept); the בעלים label stays only where a physical act or an
# external account is needed (DGO-35 the portable machine on the network).

project:
  identifier: DGO
  name: הלשכה הדיגיטלית    # THE HUB since 2026-10-06 (the owner: "הפרוייקט בפליין הופך להיות מרכז הניהול של המשך הפיתוח");
                           # it was "dgo dev". Plane refuses a hyphen in a project name; the key stays DGO.
  description: "מרכז הפיתוח של הלשכה הדיגיטלית — כל משימה פתוחה, מכל הלשכות ומכל הסוכנים. המודולים «שלב N» הם תוכנית הרחבת הלשכה (DGO Extend: לשכות מרוחקות, קישורים, הצבת אפליקציות, העברות וקנה-מידה; המפרט: ai/context/dgo-extend-plan.md). כל השאר — מנוע, כניסה, קונסול, Plane, INDOX, n8n, אפליקציות, QA ומה שמחכה לבעלים — מוצהר ב-apps/project-pln/plans/office.yaml."
  network: 0
  lead: azaria            # project lead: the office agent's Plane account
  default_assignee: ""    # NOBODY. Plane gives the project's default assignee to every item created with
                          # none, and the hub holds items of three lanes — an item is its taker's.
                          # (This roadmap's own items are עזריה's by `defaults.assignee` below.)

defaults:
  assignee: azaria        # every item below is his unless it says otherwise (בעלים items stay his too:
                          # he prepares, the owner decides)

# Who the names above are. Each maps to an account the credential plane holds (bootstrap.py creates
# it): the vault instance's secret carries the user's token, and plan.py resolves the user id with it.
people:
  azaria: { vault: plane_local_api_token-azaria }

states:
  backlog: מלאי
  unstarted: לביצוע
  started: בתהליך
  completed: בוצע
  cancelled: בוטל

labels:
  - { name: שער,     color: "#8b5cf6" }   # a phase gate: `bbox dgo test N` — the proof, not the code
  - { name: בעלים,   color: "#ef4444" }   # needs the owner (a decision, a login, a machine on the network)
  - { name: כבד,     color: "#f59e0b" }   # heavy for the 5 GB engine — alone, quiet box, or on a remote office
  - { name: אבטחה,   color: "#0ea5e9" }
  - { name: ממשק,    color: "#16a34a" }   # UI, Hebrew, RTL, mobile
  - { name: cli,     color: "#64748b" }
  - { name: תשתית,   color: "#a16207" }   # engine, images, CI, hygiene
  - { name: plane,   color: "#1d4ed8" }   # the project tool itself

modules:
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  - key: p0
    name: "שלב 0 · יסודות"
    status: in-progress
    description: "מה שחייב לקרות לפני שלב 1: השם הנכון לאפליקציה, סוכן עם CLI חי, Plane שלא מת בשקט ושמשימותיו הן של עזריה, עץ נקי, ומסגרת בדיקות לשערים."
    items:
      - key: p0-1
        name: "שינוי שם: apps/offices → apps/dgo-extend (הרחבת הלשכה, alias `dgo`) + hook מיגרציה"
        priority: urgent
        labels: [תשתית]
        description: |
          החלטה 1 במסמך, אושרה ע"י הבעלים 2026-09-30. מזהה האפליקציה `dgo-extend`, כותרת "הרחבת הלשכה", ופועל `bbox dgo …` כקיצור.
          - כל מופע של `offices` בקוד, ב-app.json, ב-compose, ב-platform.state.yaml, בקונסול ובוואלט — עובר; מיגרציה למשרד שכבר מכיר `offices` (המצב, מזהי חיבורים, vps1 שכבר פרוס) ב-hook אחד, אידמפוטנטי.
          - קבלה: `bbox dgo` עובד; `reconcile.py` נקי; converge חוזר על vps1 ירוק; `grep -r offices` מוצא רק את המיגרציה והיסטוריה.
      - key: p0-2
        name: "bina-ds: אימג' חדש (adapter v2, client-hmr 60s, שכבות Dockerfile) ו-relaunch דרך self-update"
        priority: urgent
        labels: [cli, תשתית, כבד]
        description: |
          ה-CLI (`bbox agent`) נולד, אבל המתאם שרץ הוא v1. הבנייה כבדה (pnpm install של ה-harness) — רק כשהמנוע שקט: ttrpc מתחת ל-20 ב-5 דקות, load מתחת ל-20, ובאישור סשן המנוע.
          - הבנייה דרך `scripts/dc build bina-ds` (heavy_admit); ה-relaunch רק דרך `apps/bina-ds/self-update.sh launch up` (שער בריאות, rollback, בדיקת פורטים תפוסים).
          - קבלה: `bbox agent doctor` ירוק, כל hop מתחת ל-2 שניות במנוחה; `bbox agent follow <sid>` מזרים תור חי; `bbox agent send` עובד; אין קובץ cordis.patch.yml על ה-volume.
      - key: p0-3
        name: "Plane: ה-worker של ה-API לא מת בשקט — autorestart, healthcheck דרך Caddy, שני workers"
        priority: high
        labels: [plane, תשתית]
        description: |
          2026-09-30: gunicorn master בלי אף child, הקונטיינר "בריא", Caddy מחכה 20 שניות על כל בקשה, "לא נטען" בקונסול. סיבת השורש נמצאה בסשן ה-Plane של עזריה.
          - supervisor: autorestart ל-api, ו-gunicorn עם `--workers 2 --max-requests` כדי שמות של worker יחיד לא ישבית את המוצר (GUNICORN_WORKERS=1 היום).
          - healthcheck של הקונטיינר בודק `/api/instances/` דרך Caddy עם timeout קצר מ-20 השניות של Caddy — לא `[ "$code" != "000" ]`.
          - קבלה: הריגת ה-worker → חוזר תוך 30 שניות; API מת → הקונטיינר unhealthy; הבעלים רואה את ה-Plane בקונסול מתחת ל-2 שניות.
      - key: p0-4
        name: "היגיינת קומיטים: העבודה הלא-מחויבת של 5 הסשנים נכנסת בקומיטים לפי אפליקציה"
        priority: high
        labels: [תשתית]
        description: |
          ~2000 שורות לא מחויבות בעץ אחד (apps/git, apps/project-pln, scripts/ui-coverage, הקונסול, הסכימה, ci-env.sh) מ-5 סשנים שנקטעו ב-13:39.
          - `git fetch` + `merge --ff-only` לפני (לא stash על העץ המשותף), קומיט hunk-selective לפי אפליקציה.
          - קבלה: `git status` נקי חוץ מ-`data/`; כל קומיט עובר את שערי ה-lint (G7/G12/G32).
      - key: p0-5
        name: "מסגרת השערים: `bbox dgo test N` — מריץ את בדיקות הקבלה של שלב N מול הלשכות המוצהרות"
        priority: high
        labels: [שער, תשתית]
        description: |
          כל שלב במסמך מסתיים בשער. השער הוא קוד, לא רשימה: `apps/dgo-extend/tests/phaseN.py` שמריץ את הבדיקות מול הלשכות המוצהרות (offices/*.yaml) ומדפיס PASS/FAIL עם המדידה.
          - קבלה: `bbox dgo test 0` מריץ את בדיקות שלב 0 (שם, CLI, Plane, עץ) ונכשל כשאחת נכשלת.
      - key: p0-6
        name: "vps1: לסיים את השדרוג — converge ירוק מקצה לקצה על הקוד העדכני, גיבוי לפני"
        priority: high
        labels: [כבד]
        description: |
          vps1 עודכן חלקית (הקוד חדש, חלק מהקונטיינרים ישנים; צעד `state` נכשל בעבר; tar של volume ה-postgres נכשל).
          - קבלה: `offices/vps1.yaml` (בשם החדש) → converge machine→…→publish ירוק; console.staging עולה; הגיבוי נמצא ומאומת ב-`bbox export`.
      - key: p0-7
        name: "חשבון Plane לעזריה: משתמש, חברות בסביבת העבודה, טוקן API בוואלט (plane_local_api_token-azaria), והעבודה מוקצית לו"
        priority: urgent
        labels: [plane]
        description: |
          הבעלים: "give azaria a profile and assign the work to him". bootstrap.py (ORM, כמו הבעלים והטוקן של הלשכה) יוצר משתמש `azaria@<domain>` בשם התצוגה עזריה, מוסיף אותו לסביבת העבודה (member), טובע לו APIToken ושומר בוואלט מופע `plane_local_api_token-azaria` עם `token` ו-`user_id`.
          - plan.py כבר מבין `lead: azaria` ו-`defaults.assignee: azaria` (מופע הוואלט → user_id); הרצה חוזרת של `bbox project-pln plan dgo-dev` מקצה את כל הפריטים.
          - קבלה: ב-Plane כל פריט DGO מוקצה לעזריה; פעולה שהוא עושה עם הטוקן שלו נרשמת בשמו (activity "עזריה שינה מצב").
      - key: p0-8
        name: "פועל `tasks` ב-project-pln: list/show/start/done/comment/take, `--as azaria`, `--json` — הכלי של הסוכן מול המשימות שלו"
        priority: urgent
        labels: [plane, cli]
        description: |
          apps/project-pln/tasks.py + hooks/tasks, באותה תבנית של plan.py (רץ בתוך הקונטיינר, הטוקן מהוואלט, אף סוד לא חוצה שורת shell). זה המימוש היחיד של "משימות" — גם הסוכן וגם `bbox agent tasks` צורכים אותו.
          - `./bbox project-pln tasks list [--project DGO] [--mine|--assignee <שם>] [--state unstarted|started|completed] [--json]`
          - `tasks show DGO-12`, `tasks start DGO-12`, `tasks done DGO-12 [--comment "…"]`, `tasks comment DGO-12 "…"`, `tasks take DGO-12`
          - `--as azaria` משתמש בטוקן של עזריה (הפעילות נרשמת בשמו); ברירת המחדל הטוקן של הלשכה.
          - חוזה ה-JSON: {"tasks":[{"ref":"DGO-12","id":"…","project":"DGO","name":"…","state":"לביצוע","group":"unstarted","priority":"high","labels":["שער"],"assignees":["עזריה"],"module":"שלב 1 · …","url":"…","updated_at":"…"}]}
          - קבלה: `tasks done DGO-12 --as azaria` → הפריט ב-בוצע, תגובה בעברית, הפעילות בשם עזריה; `--json` יציב ומתועד ב-README.
      - key: p0-9
        name: "bina-ds: מיומנות `plane-tasks` לעזריה + `bbox agent [azaria] tasks …` + `bbox agent do DGO-12`"
        priority: high
        labels: [cli]
        description: |
          הצד של הסוכן: מיומנות (office skill) שמלמדת את עזריה ש-`@project-pln/DGO-12` הוא פריט עבודה ב-Plane — לקרוא אותו (`./bbox project-pln tasks show`), לעבור ל-בתהליך כשמתחילים, לסיים עם `tasks done … --as azaria --comment` שמסכם מה נעשה, ולעולם לא לסמן בוצע בלי שער ירוק.
          - המתאם (agent.v1): `/v1/tasks`, `/v1/tasks/{ref}`, `/v1/tasks/{ref}/start|done|comment` — מפעיל את `bbox project-pln tasks … --json` (מימוש אחד).
          - CLI: `bbox agent tasks list|show|start|done|comment`, וגם `bbox agent azaria tasks list` (שם הסוכן כבורר אופציונלי); `bbox agent do DGO-12 [sid]` שולח "complete task @project-pln/DGO-12" לסשן.
          - קבלה: `bbox agent do DGO-12` → עזריה פותח את הפריט, עובד, ומסיים; הפריט ב-בוצע; `bbox agent tasks list --state completed` מציג אותו.
      - key: p0-10
        name: "כל מקביל: נתיב Plane (משימות כ-spans) לצד נתיב בינה — התמונה המלאה של הסוכן והמשימות"
        priority: high
        labels: [plane, ממשק]
        description: |
          הבעלים: "make sure they're showing up perfectly in any-concurrency so we can see the timeline of the agent and tasks". בינה כבר מוצהרת כמקור spans (apps/bina-ds/app.json → /timeline/spans, plugins/timeline-lanes) — הנתיב חי רק אחרי ה-relaunch (p0-2). Plane צריך את שלו:
          - project-pln מצהיר מקור spans ב-app.json ומגיש `GET /timeline/spans?since=` (תהליך קטן תחת supervisor, Caddy מנתב): לכל פריט עבודה span מיצירה/תחילת בתהליך עד בוצע, בשם `DGO-12 · הכותרת`, עם המקצה (עזריה) כשחקן, המודול כנתיב-משנה, ומעברי מצב כ-instants; `since` אינקרמנטלי.
          - קבלה: בכל מקביל שני נתיבים — "בינה" (סשנים, תורים, כלים) ו-"משימות" (DGO-n) — מיושרים על אותו ציר זמן; פריט שעזריה סיים נראה נסגר באותו רגע שבו התור שלו מסתיים.
      - key: p0-11
        name: "Plane נטען בתוך הלשכה (לא בכרטיסייה חדשה): הצפה במסגרת + עוגיות same-site"
        priority: urgent
        labels: [plane, ממשק, בעלים]
        description: |
          הבעלים דחה את הכרטיס "האפליקציה הזו פועלת במארח משלה ואינה נטענת בתוך המסוף". הממצא (סשן המנוע): אין X-Frame-Options על ה-SPA, החוסם האמיתי הוא העוגייה — SameSite=Lax בין `console.localhost` ל-`plane.localhost` (אתרים שונים כש-TLD לא ברשימה); ב-VPS (`*.<slug>.digital-office.co.il`) הם same-site והצפה עובדת כפי שהיא.
          - (א) הקונסול: `module.external` נטען ב-showEmbed(externalUrl) במסגרת התוכן (ובחלון בשולחן העבודה כמו היום); הכרטיס נשאר רק כ-fallback כשהמסגרת לא עולה.
          - (ב) edge ב-Mac: DEV_DOMAIN=bina.localhost כדי שכל אפליקציה תהיה `<app>.bina.localhost:8080` (same-site; Chrome פותר *.localhost בכל עומק) — שינוי רוחבי, החלטת בעלים.
          - קבלה: אריח בקונסול → Plane נטען בתוך המסגרת, התחברות, רענון הקונסול — עדיין מחובר; גם בשולחן העבודה; גם ב-390px.
      - key: p0-12
        name: "Plane 100% עברית גם לפרויקט חדש: מצבי ברירת המחדל (DEFAULT_STATES) בעברית ב-patch בנייה"
        priority: high
        labels: [plane, ממשק]
        description: |
          פרויקט חדש מהממשק או מה-API מקבל Backlog/Todo/In Progress/Done/Cancelled מרשימה אחת: plane/db/models/state.py DEFAULT_STATES. patch בנייה ליד patches/hebrew-defaults.py (אותו חוזה של anchor) שמשנה את השמות ושומר group/צבע/סדר.
          - קבלה: פרויקט חדש מהממשק → מצבים בעברית; POST /api/v1/…/projects → אותו דבר; plan.py כבר לא צריך לשנות שמות.
      - key: p0-13
        name: "זהות הבעלים ב-Plane: onboard מסרב לבעלים placeholder (ci@local.dev), הבעלים האמיתי הוא מנהל 'המשרד'"
        priority: high
        labels: [plane, בעלים]
        description: |
          ב-DB: סביבת העבודה העברית 'המשרד' שייכת ל-ci@local.dev (placeholder של scripts/ci-env.sh ב-.env), וסביבת bbb (אנגלית) היא של הבעלים שנרשם בעצמו.
          - hooks/onboard מסרב לזהות placeholder (`*@local.dev`, `your-*`) כמו שentrypoint.sh מסרב למפתחות placeholder, ואומר איזה מפתח .env לקבוע.
          - PLANE_OWNER_EMAIL = כתובת הבעלים, onboard חוזר (אידמפוטנטי) → הבעלים מנהל 'המשרד'. bbb ומחיקת ci@local.dev — החלטת בעלים.
          - קבלה: כניסה של הבעלים → 'המשרד' עם DGO; `bbox project-pln verify` ירוק.
      - key: p0-14
        name: "Plane לא ציבורי: ENABLE_SIGNUP=0 אחרי שהבעלים קיים, והמארח מאחורי SSO של ה-edge"
        priority: high
        labels: [plane, אבטחה]
        description: |
          היום ENABLE_SIGNUP=1 והנתיב auth:none — ב-VPS כל מי שמגיע ל-plane.<slug>.digital-office.co.il יכול להירשם.
          - bootstrap.py קובע ENABLE_SIGNUP=0 כשהבעלים קיים (IS_WORKSPACE_CREATION_DISABLED נשאר לבעלים); הנתיב עובר ל-auth:sso (ל-CE אין OIDC — הכניסה של Plane נשארת, המארח מפסיק להיות ציבורי).
          - קבלה: /sign-up עונה disabled; המארח מחזיר 302 ל-authentik כשלא מחוברים; הצפה בקונסול (p0-11) ממשיכה לעבוד.
      - key: p0-15
        name: "god-mode / admin של Plane — build סטטי באנגלית: לנתב הרחק או לתעד"
        priority: low
        labels: [plane, בעלים]
        description: |
          החלטת בעלים קטנה: /god-mode/ נשאר באנגלית (build של הספק). או לנתב אותו הרחק מה-edge, או לקבל ולתעד ב-README.
      - key: p0-16
        name: "authentik: ה-outpost מתעדכן כשרשימת המארחים המוגנים משתנה, ו-unhealthy לא נשאר בשקט 15 שעות"
        priority: high
        labels: [אבטחה, תשתית]
        description: |
          ממצא 2026-09-30 (סשן המנוע): authentik-bootstrap-local היה `running unhealthy` 4851 בדיקות רצופות (~15 שעות), restarts 0: "outpost not serving: digital-assets.localhost, social-list.localhost" — שתי אפליקציות auth:sso שנוספו אחרי הסנכרון האחרון של ה-outpost (21 מארחים) ולא נדחפו אליו, כלומר ה-SSO שלהן לא נאכף, ואף אחד לא צפה בזה. תוקן זמנית ב-restart של ה-bootstrap (15:35).
          - הסנכרון של ה-outpost רץ מחדש כשרשימת המארחים המוגנים (הרישום שה-compiler מרנדר) משתנה — צעד ה-reconcile שמוסיף נתיב auth:sso מפעיל אותו.
