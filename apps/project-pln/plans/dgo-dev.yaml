          מה שהצילום מראה במייל מול bina-ds (נמדד): (1) שורת מותג — עיגול ירוק בלי כפתור קיפול מול ריבוע כחול עם קיפול; (2) פעולה ראשית — pill ירוק ≈56px מול כפתור שטוח ≈44px; (3) רשימת ניווט — 9 פריטים שטוחים ≈54px בלי meta ואזור ריק מול ≈46px עם עמודת meta ו-"הצגת 19 שיחות נוספות"; (4) חיפוש — שדה מלוא הרוחב כשורה ראשונה של התוכן עם הרצאת תחביר באנגלית מול אייקון בכותרת המקטע; (5) סרגל כלים — שתי שורות בקרה, הספירה "162 מתוך 168" פעמיים; (6) שורות — נושא נשבר לשתי שורות, אמוג'י גולש לשלישית, גובה משתנה ≈78/≈108px מול שורה אחת ו-pitch קבוע; (7) תחתית — הגדרות צפות מול מוצמדות.
