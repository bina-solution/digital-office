; project-pln — the four programs this deployment runs, out of the eight the AIO ships.
;
; Dropped: space (public project sharing — a Node/react-router server), live (real-time
; collaboration websockets — another Node server), beat (a third full Django process for periodic
; jobs — the jobs themselves still run: the one worker below carries the scheduler, see
; patches/worker-scheduler.py). Together ~400 MB.
; Kept: migrator (one-shot; the api entrypoint blocks on wait_for_migrations, so it MUST exist),
; api, worker, proxy (Caddy — it is what serves the static SPA and owns the path routing; the
; office edge forwards the whole host to it rather than re-implementing the six routes).
;
; autostart/autorestart semantics are upstream's, deliberately: the migrator is `unexpected` (it
; exits 0 by design) and everything else restarts. The migrator runs first (priority 10).

[supervisord]
user=root
nodaemon=true
stdout_logfile=/app/logs/access/supervisor.log
stderr_logfile=/app/logs/error/supervisor.err.log

; Upstream's AIO config has neither of these, so `supervisorctl status` — the command its own
; README tells you to run — answers "http://localhost:9001 refused connection": supervisorctl's
; built-in default serverurl is that inet socket and nothing declares a unix one. The Dockerfile
; also copies this file to /etc/supervisord.conf, which is where supervisorctl looks by default.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
; Without this section supervisorctl connects and then refuses every command with "supervisord
; responded but did not recognize the supervisor namespace commands that supervisorctl uses to
; control it".
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:migrator]
directory=/app/backend
command=sh -c "./bin/docker-entrypoint-migrator.sh"
autostart=true
autorestart=unexpected
startsecs=0
priority=10
stdout_logfile=/app/logs/access/migrator.log
stderr_logfile=/app/logs/error/migrator.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3

[program:api]
directory=/app/backend
command=sh -c "./bin/docker-entrypoint-api.sh"
autostart=true
autorestart=true
priority=20
environment=PORT=3004,HOSTNAME=0.0.0.0
stdout_logfile=/app/logs/access/api.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/logs/error/api.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3

[program:worker]
directory=/app/backend
command=sh -c "./bin/docker-entrypoint-worker.sh"
autostart=true
autorestart=true
priority=25
stdout_logfile=/app/logs/access/worker.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/logs/error/worker.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3

[program:proxy]
directory=/app/proxy
command=sh -c "caddy run --config /app/proxy/Caddyfile"
autostart=true
autorestart=true
priority=30
stdout_logfile=/app/logs/access/proxy.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/logs/error/proxy.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

[program:spans]
directory=/app/backend
command=python3 /app/spans.py
autostart=true
autorestart=true
priority=30
stdout_logfile=/app/logs/access/spans.log
stdout_logfile_maxbytes=0
stderr_logfile=/app/logs/error/spans.err.log
stderr_logfile_maxbytes=10MB
