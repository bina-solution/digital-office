# apitools scale-out load balancer
# =================================
# Holds the `apitools` network alias ALONGSIDE the real local apitools container, so docker's
# embedded DNS returns two A records for the name the pipeline hardcodes in 37 places across 17
# workflow JSONs. Roughly half of all callers therefore reach this proxy and half reach the local
# instance directly -- and this proxy forwards its half to the SECOND instance on the portable
# laptop. No workflow file is edited, and no caller's literal `http://apitools:8080` changes.
#
# WHY ADDITIVE (this proxy shares the alias rather than owning it):
#   If this container stops, docker DNS drops its record automatically and 100% of traffic goes
#   back to the local instance. Taking the alias away from the live container instead would have
#   required a disconnect/reconnect of a production service and would have made this proxy a
#   single point of failure for all apitools traffic.
#
# WHY THE LOCAL BACKUP GOES VIA TRAEFIK:
#   Once this proxy also answers to `apitools`, the name is ambiguous -- resolving it here could
#   return this proxy itself and loop. The container IP would be unambiguous but goes stale the
#   moment apitools is recreated, and a stale BACKUP fails silently (it is only exercised during
#   a remote outage, exactly when it is needed). Traefik already discovers apitools by docker
#   label and re-discovers it automatically after any restart, so `Host: apitools.localhost` via
#   traefik is the stable, zero-touch path back to the local instance.

global
    log stdout format raw local0 info
    maxconn 4096

# haproxy resolves server names ONCE at startup unless told otherwise, and then caches the
# address forever. That is a real hazard here: traefik is recreated routinely, and a backup
# pinned to a dead IP fails silently because it is only exercised during a remote outage --
# exactly when it has to work. Point haproxy at docker's embedded DNS so it re-resolves, and
# use init-addr so a momentarily unresolvable name does not stop the proxy from starting.
resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # apitools runs GUNICORN_TIMEOUT=900 and APITOOLS_SLOT_WAIT_TIMEOUT=600; a legitimate
    # /documentOcr on a large scan really can run for minutes (measured max 506s). These
    # timeouts must sit ABOVE that or the proxy would sever calls the app would have completed.
    timeout connect 10s
    timeout client  930s
    timeout server  930s
    timeout http-request 120s
    timeout queue   60s
    retries 2

frontend apitools_fe
    bind :8080

    # Callers arrive with `Host: apitools:8080`, which matches no traefik router, so the local
    # backup hop would 404. apitools is a Flask app with no SERVER_NAME set and returns relative
    # paths rather than absolute URLs, so normalising Host for BOTH backends is harmless and
    # lets one backend hold a traefik-fronted server and a tunnelled one together.
    http-request set-header Host apitools.localhost

    # /documentImage, /documentDraw and /documentOcrDraw serve a raster that /documentOcr wrote
    # to LOCAL disk (.storage/ocr_pdf_images/<md5>.jpg). Postgres holds the OCR *result* but not
    # that file, and on a cache hit the raster is never rebuilt -- so it exists on exactly one of
    # the two hosts. These routes get a backend that retries the peer on 404 instead of letting
    # INDOX fall back to an expensive /pdfToJpeg re-render (or show no thumbnail at all).
    acl needs_local_file path_beg /documentImage /documentDraw /documentOcrDraw
    use_backend be_localfile if needs_local_file

    default_backend be_split

# Extraction path. file_id resolves through the SHARED Postgres ocr_cache, which stores the full
# OCR result (ocr_cache.ocr_json), so these routes are genuinely host-independent.
backend be_split
    # `roundrobin`, NOT `leastconn`. leastconn was tried first and quietly ignored the 20:1
    # weight below: it picks the lowest (active-connections / weight), so a server sitting at
    # zero connections always wins outright no matter how small its weight. At the 1-2 requests
    # of real concurrency this pipeline runs, that made it alternate ~50/50 and the weight did
    # nothing (measured: 8 remote vs 7 local). roundrobin honours the weight deterministically.
    # The pressure valve that leastconn would have provided is `retry-on 429` below instead,
    # which is a better signal anyway -- it is apitools' own bulkhead saying it is full, rather
    # than haproxy guessing from connection counts.
    balance roundrobin

    # ── THE FAILOVER BUG THIS CONFIG EXISTS TO NOT HAVE ────────────────────────────────────
    # First version had `server localviatraefik ... backup` and relied on `option redispatch`.
    # A controlled outage (remote instance stopped, tunnel left up) produced 502 on HALF of all
    # traffic. Two compounding reasons, both worth knowing:
    #
    #  1. The ssh -L forward KEEPS LISTENING when the far-side app is gone. haproxy's TCP
    #     connect therefore SUCCEEDS and the failure arrives later as an empty response. The
    #     default retry policy is `conn-failure` only, which does not cover that -- so there
    #     was no retry at all, just a 502.
    #  2. A `backup` server is only eligible once every active server is already marked DOWN.
    #     For the first fall*inter seconds the remote is still nominally UP, so even a retry
    #     had nowhere to go.
    #
    # Fix is both halves: retry on the failure shape a tunnel actually produces, and keep the
    # local instance ACTIVE (not backup) so there is always somewhere to redispatch to.
    # Re-verified with the same outage test: 12/12 requests succeeded, zero 5xx.
    # 429 is apitools' OCR bulkhead shedding because its slots are full. Retrying it on the
    # other instance is exactly right, and it is a real improvement over the pre-split status
    # quo: before this proxy existed a 429 went straight back to the pipeline and turned into
    # an API_TOOLS_FAILED document. The 40 minutes before the split logged 35 of them.
    retry-on conn-failure empty-response response-timeout 429 502 503 504
    option redispatch 1
    retries 3
    # Health checks are generated by the backend and do NOT inherit the frontend's Host rewrite,
    # so the check must carry the header itself or traefik answers 404 and the backup is marked
    # permanently DOWN.
    #
    # WAS `GET /`, NOW `/readyz` — and this is the change that would have caught the incident.
    # `GET /` is a pure jsonify: it proves the process is alive and nothing else. It answered
    # 200 for the whole 6 hours of 2026-08-11 while the remote instance had lost its Postgres
    # leg and was writing OCR results into a local JSON file no other instance could see
    # (5,296 fallback warnings, 1,171 orphaned results). haproxy kept sending it 81.6% of
    # traffic because, by the only question it was asking, the instance was fine.
    # /readyz asks the question that actually matters for a two-instance deployment — "can
    # this instance reach the SHARED Postgres OCR cache" — so a split instance is taken out
    # of rotation in fall*inter (6s remote / 30s local) instead of diverging silently.
    # It is still safe for a health check: the common case is a read of a tmpfs marker kept
    # warm by real traffic, never a per-check DB call, and unlike /health it never touches the
    # storage bind mount (which is why /health is not used here — it would hang if that hung).
    option httpchk
    http-check send meth GET uri /readyz hdr Host apitools.localhost
    http-check expect status 200
    # The second instance on the portable laptop, via the ssh -L forward bound on the
    # traefik-network bridge gateway.
    #
    # WEIGHT 20:1 IS DELIBERATE, AND IT IS NOT "PREFER THE FASTER BOX" HAND-WAVING. Measured
    # over the same 30 minutes of real traffic, same endpoints, same document population:
    #                       /documentOcr        /documentJsonQuery
    #     local   p50/p99   1798ms / 532550ms   1057ms / 23244ms
    #     remote  p50/p99    345ms /  15806ms    231ms /   655ms
    # The remote is faster at EVERY percentile including the median, over a 65ms-RTT wifi link.
    # That is not tail skew from a few huge documents -- it is this host being CPU-starved
    # (n8n workers pegged at 95%, load 12-19, ~4GB swapped) while the laptop sits at ~1% of
    # four idle cores. Its local p99 of 532s is a document taking nearly nine minutes.
    #
    # Only ~half of all traffic reaches this proxy at all: `apitools` resolves to TWO A records
    # (this proxy and the real container), and the DNS half is load-blind by construction. So
    # the weight here is the only lever on the overall ratio, and 20:1 pushes this proxy's share
    # almost entirely remote -- about 48% of all apitools traffic -- while keeping the local
    # server ACTIVE and therefore still eligible as a redispatch target when the wifi drops.
    server remote 172.18.0.1:18080 weight 20 check inter 3s fall 2 rise 2
    # The local instance via traefik, ACTIVE rather than backup (see the note above): it is the
    # redispatch target that turns a wifi drop into a retry instead of a 502.
    server localviatraefik traefik-shlomo-laptop:80 weight 1 check inter 10s fall 3 rise 2 resolvers docker init-addr last,libc,none

# Host-local-file path. Both servers active; a 404 means "this host does not have that raster",
# so redispatch to the peer, which does.
backend be_localfile
    # `first`, not roundrobin: with no maxconn set, every request goes to the LOCAL instance and
    # only a 404 ("I don't hold that raster") falls through to the remote. Round-robin sent half
    # of all thumbnail lookups across the wifi link to be 404'd and retried, and during an
    # induced remote outage one such request exhausted its retries and 502'd. Local first is
    # both fewer round trips and immune to the remote being down -- and it is the better guess
    # anyway, since this host holds every raster produced before the split.
    balance first
    # Health checks are generated by the backend and do NOT inherit the frontend's Host rewrite,
    # so the check must carry the header itself or traefik answers 404 and the backup is marked
    # permanently DOWN.
    #
    # WAS `GET /`, NOW `/readyz` — and this is the change that would have caught the incident.
    # `GET /` is a pure jsonify: it proves the process is alive and nothing else. It answered
    # 200 for the whole 6 hours of 2026-08-11 while the remote instance had lost its Postgres
    # leg and was writing OCR results into a local JSON file no other instance could see
    # (5,296 fallback warnings, 1,171 orphaned results). haproxy kept sending it 81.6% of
    # traffic because, by the only question it was asking, the instance was fine.
    # /readyz asks the question that actually matters for a two-instance deployment — "can
    # this instance reach the SHARED Postgres OCR cache" — so a split instance is taken out
    # of rotation in fall*inter (6s remote / 30s local) instead of diverging silently.
    # It is still safe for a health check: the common case is a read of a tmpfs marker kept
    # warm by real traffic, never a per-check DB call, and unlike /health it never touches the
    # storage bind mount (which is why /health is not used here — it would hang if that hung).
    option httpchk
    http-check send meth GET uri /readyz hdr Host apitools.localhost
    http-check expect status 200
    # 404 = "this host does not hold that raster" -> the peer does. The rest are the same
    # tunnel-shaped failures be_split retries; see the long note there.
    retry-on 404 conn-failure empty-response response-timeout 502 503 504
    option redispatch 1
    retries 3
    server localviatraefik traefik-shlomo-laptop:80 check inter 10s fall 3 rise 2 resolvers docker init-addr last,libc,none
    server remote 172.18.0.1:18080 check inter 3s fall 2 rise 2

# Counters, so the split can be PROVEN rather than assumed.
frontend stats_fe
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
