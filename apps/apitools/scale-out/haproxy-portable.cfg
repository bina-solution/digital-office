# apitools ON-BOX load balancer — runs ON THE PORTABLE LAPTOP
# =============================================================================
# THE PROBLEM THIS SOLVES (MEASURED 2026-08-11 18:10Z, n=25 per row, from the portable's
# own network namespace — the n8n workers there run --network host, so this is literally
# their path):
#
#   portable worker -> apitools:8080 -> socat 127.0.0.10:8080 -> ssh -R 19021
#     -> HOST apitools-lb (172.18.0.35) -> be_split, weight 20:1 -> ssh -L 18080
#     -> BACK ACROSS THE SAME WIFI LINK -> the apitools instance on the portable
#
#   GET /            via 127.0.0.10: 38.4 ms      on-box direct:   2.3 ms   (16.7x)
#   POST /docExists  via 127.0.0.10: 255.5 ms     on-box direct: 185.7 ms   (-27%)
#
# ~81.6% of the portable workers' apitools calls were crossing the WiFi link TWICE to
# reach a process on their own machine. That round trip is why a remote worker was worth
# ~16% of a local one.
#
# WHY A PROXY AND NOT `http://127.0.0.1:8080`
# A plain rewrite would have been two lines and would have thrown away four things:
#   1. the 404 -> peer retry for raster endpoints (a raster lives on whichever box did
#      the OCR, and no hash can predict which — see be_localfile);
#   2. 429 spillover when the local instance's own OCR bulkhead is full;
#   3. `option redispatch`, which turns a WiFi/tunnel drop into a retry instead of a 502;
#   4. the ONLY place the local/remote split is observable (stats on :8405).
# (4) is not academic: the 6-hour silent split-brain on 2026-08-11 was detectable only
# through haproxy's counters. This config keeps all four ON the portable.
#
# WHAT MAKES IT SAFE TO SERVE EXTRACTION LOCALLY: file_id resolves through the SHARED
# Postgres ocr_cache, proven by direct test — /docExists and /documentJsonQuery return
# 200 with real OCR metadata on the portable for documents whose source file exists only
# on the host. And no n8n workflow calls a raster endpoint (25 refs /documentJsonQuery,
# 5 /documentOcr, 1 each /docExists and /docGen, ZERO /documentImage|Draw|OcrDraw).
#
# NO SESSION AFFINITY, NO CONSISTENT HASHING — deliberately. For be_split it is pure
# loss (the path is host-independent, so affinity forfeits balance and 429 spillover for
# no correctness gain). For be_localfile it is actively WRONG: the raster is wherever the
# OCR happened, which no hash function knows. `first` + `retry-on 404` is strictly better.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # A legitimate /documentOcr on a large scan really can run for minutes (measured max
    # 506s). These sit ABOVE that or the proxy severs calls the app would have completed.
    timeout connect 5s
    timeout client  930s
    timeout server  930s
    timeout http-request 120s
    timeout queue   60s
    retries 2

frontend apitools_fe
    # 127.0.0.10 is the loopback alias the portable's n8n workers resolve `apitools` to
    # (--add-host apitools:127.0.0.10). Binding it here REPLACES the socat that used to
    # forward the name straight back across the tunnel, so not one workflow JSON, worker
    # env, or container has to change — and rollback is just restoring that socat.
    bind 127.0.0.10:8080

    # The host peer is reached through the ssh -R leg, whose far end is the host's
    # apitools-lb; and the local instance is a bare Flask app. Neither cares about Host,
    # but the host's LB rewrites it to apitools.localhost for traefik, so send what it
    # expects and let it do its own thing.
    http-request set-header Host apitools.localhost

    acl needs_local_file path_beg /documentImage /documentDraw /documentOcrDraw
    use_backend be_localfile if needs_local_file
    default_backend be_split

backend be_split
    # `first`, not roundrobin: the entire point is to serve on-box. The local server is
    # tried until it reaches `maxconn`, and only then does traffic spill to the host.
    # That maxconn IS the sizing decision — see the note on the server line.
    balance first

    # HEALTH CHECK IS /readyz, NOT `GET /`.
    # `GET /` only proves the process is alive. It answered 200 throughout the 6-hour
    # split while the instance was writing OCR results into a local JSON file that no
    # other instance could see. /readyz answers the question that actually matters —
    # "can this instance reach the SHARED Postgres OCR cache" — so an instance that
    # loses its DB leg is taken out of rotation in fall*inter (6s) instead of quietly
    # diverging. It is a tmpfs marker read in the common case, never a DB call per check.
    option httpchk
    http-check send meth GET uri /readyz hdr Host apitools.localhost
    # Strict 200. (It briefly accepted 404 as well, while the host instance was still on a
    # build that predated /readyz; both instances were rebuilt 2026-08-11 18:24Z and the
    # allowance was removed the same session. Re-add it ONLY for the duration of a rollout
    # where one side is knowingly older — a permanent 404 allowance would silently disable
    # the readiness gate for any instance that lost the endpoint.)
    http-check expect status 200

    # 503 is what strict mode returns when the shared cache is unreachable; retrying it
    # on the peer is exactly right, and it is why the guard uses 503 and not 500.
    # 429 is apitools' own OCR bulkhead shedding — also a "try the other box" signal.
    retry-on conn-failure empty-response response-timeout 429 502 503 504
    option redispatch 1
    retries 3

    # maxconn 12 = the local instance's real serving width, not a guess: the portable
    # instance runs GUNICORN_WORKERS=6 (6 concurrent requests) with
    # APITOOLS_MAX_CONCURRENT_JSON_QUERY=8. 12 lets a short queue form for fast cache
    # hits without letting a burst of slow OCR monopolise the box, and anything beyond
    # it spills to the host rather than waiting. Raise it only together with
    # GUNICORN_WORKERS on the portable.
    server local 127.0.0.1:8080 maxconn 12 check inter 3s fall 2 rise 2
    # The host, via the ssh -R leg that already existed for this purpose. Kept ACTIVE
    # (not `backup`) so `first` can overflow into it and so redispatch always has a
    # target — a `backup` server is only eligible once every active server is DOWN,
    # which is exactly the gap that produced 502s on the host's LB the first time.
    server hostpeer 127.0.0.1:19021 check inter 5s fall 3 rise 2

backend be_localfile
    # A raster (.storage/ocr_pdf_images/<md5>.jpg) exists on whichever box ran the OCR.
    # Local first, and a 404 means "not mine" -> the peer has it.
    balance first
    option httpchk
    http-check send meth GET uri /readyz hdr Host apitools.localhost
    # Strict 200. (It briefly accepted 404 as well, while the host instance was still on a
    # build that predated /readyz; both instances were rebuilt 2026-08-11 18:24Z and the
    # allowance was removed the same session. Re-add it ONLY for the duration of a rollout
    # where one side is knowingly older — a permanent 404 allowance would silently disable
    # the readiness gate for any instance that lost the endpoint.)
    http-check expect status 200
    retry-on 404 conn-failure empty-response response-timeout 429 502 503 504
    option redispatch 1
    retries 3
    server local 127.0.0.1:8080 check inter 3s fall 2 rise 2
    server hostpeer 127.0.0.1:19021 check inter 5s fall 3 rise 2

# Counters, so the on-box split can be PROVEN rather than assumed — and so a future
# silent split has somewhere to show up. Bound to loopback only; this box has no
# authentication in front of it.
frontend stats_fe
    bind 127.0.0.1:8405
    stats enable
    stats uri /
    stats refresh 5s
