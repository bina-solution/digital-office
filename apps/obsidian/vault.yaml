# apps/obsidian/vault.yaml — what a fresh office's Obsidian vault holds, and where each note comes from.
#
# THE ONE PLACE that says it (DGO-1642). `platform/manager/reconcile.py render` compiles this into
# `.generated/vault/`, and `apps/obsidian/hooks/prepare` carries the changed notes into the vault
# volume. The gate `scripts/refactor/vault-sources-lint.py` fails when a document under `ai/context/`
# is neither published here nor excluded here with a reason — so adding a doc is a decision a person
# makes once, in this file, and never a silent leak or a silent gap.
#
# WHY A DECLARATION AND NOT A COPY. The vault is what an agent and a person read first in a session,
# so it is believed. `ai/context` is 151 files and 28 MB: publishing all of it is noise, publishing a
# hand-maintained copy is a second truth that goes stale. A declared subset, recompiled on every
# `bbox run`, is the only shape that stays true.
#
# SCOPE — THE CLIENT BOUNDARY. A note is `office` (default) or `herd`:
#   * `office` — this office's own facts: how the platform works, its apps, its architecture.
#   * `herd`   — the BUSINESS's offices together: their machines, addresses, links and every security
#                finding. Rendered ONLY where `DGO_OFFICE_ID` is one of `apps/computers/herd.yaml`'s
#                `offices:`. Absent, unmatched, or an unreadable herd file all mean OFFICE ONLY —
#                it fails closed, because a client office must never hold another office's posture.
#
# WHAT IS NEVER PUBLISHED, whatever the scope: any value from `.env` (the compiler reads only the
# deployment's public identity), another app's data or volume, and the documents excluded below.
version: 1

