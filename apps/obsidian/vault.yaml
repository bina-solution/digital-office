# ── what the compiler writes itself ───────────────────────────────────────────────────────────────
# `index`     — "00 - START HERE": the office's identity, what is installed, the reading order, and
#               which folders belong to a person and which to the compiler.
# `inventory` — every enabled app: its capability, its door, its tile. From the compiled registry.
# `apps`      — one note per enabled app, from its own AGENT.md (the contract it already writes).
# `diagrams`  — one note per archify source, linking the office's own /a/archify/ tile.
generated: [index, inventory, apps, diagrams]

# ── deliberately not published, each with a reason ────────────────────────────────────────────────
