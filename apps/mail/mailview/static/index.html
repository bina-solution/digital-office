<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>מייל</title>
<script>
/* Relative-URL anchor. Every screen is a URL (/message/<id>, /v/starred, /organizer, …) and every
   API call is RELATIVE (api/…), so a deep link needs a base element or "api/messages" resolves to
   /message/api/messages. The mount is read off the URL itself: under the console shell the document
   lives at /a/<alias>/…, standalone at /. The console proxy also injects a base element of its own,
   and this script steps aside when one is already there. Built via the DOM, and the words
   "base"+"href" never appear together in this file's markup or comments: the proxy decides
   whether to inject by a substring test, and on 2026-09-02 a comment that spelled the tag out
   suppressed the injection — every script and API call then resolved against the console root
   (rules-lib.js 404 → "Unexpected token <", boot() on a null element, the mail page stuck on
   "טוען…"). app.js reads document.baseURI back to learn its mount — the ONE place it is known. */
(function(){ if(document.querySelector("base")) return;
  var m=location.pathname.match(/^(.*\/a\/[^/]+\/)/); var b=document.createElement("base");
  b.setAttribute("href", m ? m[1] : "/"); document.head.insertBefore(b, document.head.firstChild); })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2356693f'/%3E%3Cpath d='M6 10h20v12H6z' fill='%23f3f5f7'/%3E%3Cpath d='M7 11l9 6 9-6' fill='none' stroke='%23475734' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ── this screen's own: radii and type. The colours are the office's palette, in the generated block
   below — nothing in this file writes one (but an e-mail's own paper and the printed page). ── */
:root{
  --radius:16px; --radius-sm:9px; --radius-pill:999px;
  --font:"Segoe UI",system-ui,-apple-system,"Noto Sans Hebrew","Assistant",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* @bina-theme-tokens:start */
/* OLIVE GROVE — the one palette of the office (the owner, 2026-10-07 · DGO-450). Four hues, sampled
   from his mock-up, and the ground they stand on. A screen never writes a colour: it names one of
   these. Each hue is the colour itself (a FILL — a button, a bar, a dot), «-d» for text and thin
   lines on the ground (4.5:1 or more), «-soft» and «-line» for a tint and its hairline, and «-ink»
   for what is written ON the fill. The role names every screen already uses point at them:
   (no backtick in this block: one of its copies lives inside a script's template string)
     olive  the brand and the main action · what is well, what is done
     sky    what is in motion, what only informs · a link
     lime   look here — a warning, something waiting
     plum   a person must act — a failure, a removal, the one final action
   Contrast, measured (WCAG): ink on the ground 13.7 · muted 4.65 · light text on olive 5.51 and on
   plum 9.54 · ink on lime 6.88 · its ink on sky 6.32 · sky-d 4.61 · lime-d 4.70 · violet 5.32 ·
   on the desk: its ink 6.32 (dark: 13.96), and 11.2 where the sky pales (dark: 5.12). */
:root,:root[data-theme="light"]{
  color-scheme:light;
  accent-color:var(--accent);   /* the browser's OWN controls - a checkbox, a radio, a range, a progress bar - on both grounds: said once, here (it was said for eight single controls, and every other one was the browser's blue) */
  --bg:#f3f5f7; --surface:#fff; --surface-2:#f9fafb; --ink:#1f2a17; --muted:#6a7068; --line:#dcdfde;
  --olive:#56693f; --olive-d:#475734; --olive-soft:#e7eae4; --olive-line:#bfc6b6; --olive-ink:#f3f5f7;
  --sky:#7baae3; --sky-d:#2a6fc4; --sky-soft:#edf3fb; --sky-line:#cddff4; --sky-ink:#13263f;
  --lime:#a9b84c; --lime-d:#69732e; --lime-soft:#f3f5e6; --lime-line:#dee4bb; --lime-ink:#1f2a17;
  --plum:#5b3349; --plum-d:#4a303b; --plum-soft:#e8e2e6; --plum-line:#c1b1ba; --plum-ink:#f3f5f7;
  --accent:var(--olive); --accent-d:var(--olive-d); --accent-soft:var(--olive-soft); --accent-ink:var(--olive-ink);
  --blue:var(--sky-d); --amber:var(--lime-d); --red:var(--plum);
  --violet:#7c5c6d;   /* plum, lifted a fifth toward white: someone has to look — nothing has failed */
  --ok:var(--olive); --warn:var(--lime-d); --danger:var(--plum); --info:var(--sky-d);
  --ok-soft:var(--olive-soft); --warn-soft:var(--lime-soft); --danger-soft:var(--plum-soft); --info-soft:var(--sky-soft);
  --red-soft:var(--plum-soft); --amber-soft:var(--lime-soft); --blue-soft:var(--sky-soft); --violet-soft:var(--plum-soft);
  --side:var(--olive); --side-ink:#f3f5f7; --side-mut:#dce1da; --side-line:#788765;
  --desk:var(--sky); --desk-ink:var(--sky-ink);   /* desktop mode's ground is the sky (the owner, DGO-452), and what is written straight on it */
  --scrim:rgba(31,42,23,.5);                      /* what dims a screen behind a pop-up */
  --shadow:0 1px 3px rgba(31,42,23,.08),0 6px 24px rgba(31,42,23,.06);
  --shadow-lg:0 20px 60px rgba(31,42,23,.28);
  /* ONE COLOUR AND ONE ANIMAL PER OFFICE (the owner, 2026-10-09 · flt-002). When offices are linked,
     a person reads WHICH office a thing belongs to without opening it, so each office gets a hue of
     its own. The hue is an IDENTITY and never a health state: an office that stopped answering keeps
     its colour, and the quiet mark is the one that says "not answering". Each is an ALIAS of the
     palette's own hue — no fourth value is invented, and because the ground re-points the hue, the
     office mark follows the ground by itself. Each office's animal (elephant, deer, eagle) is a
     glyph of bina-icons.js. */
  --office-hp:var(--muted);   /* hp · elephant — grey: the heavy laptop at home, in the palette's own grey */
  --office-mac:var(--lime);   /* macbook · deer — yellow: the palette has one yellow and it is lime. A FILL, so what is written ON it is --lime-ink, never this */
  --office-vps:var(--sky-d);  /* vps · eagle — deep sky blue, «the eagle in the clouds». THE OWNER'S OWN CHOICE (2026-10-09, in writing: vps = נשר + כחול-שמיים) — this line is the colour he picked, not a default kept for him */
}

/* ── A LINKED OFFICE'S MARK, BY NAME (flt-004) ───────────────────────────────────────────────
   The link carries a NAME — mark: {color, animal} in the catalog, from the office's own identity
   — and never a value: the office that DRAWS a linked tile owns the pixels, so it paints the name
   with its own palette. These seven rules are that translation, one per family above; a screen sets
   data-office-hue="lime" and paints var(--office-hue).
   A name this file does not know paints nothing, which is why the vocabulary in
   apps/dgo-extend/identity.py may only name families that exist here — and why --red and --ok
   are not among them: they mean «danger» and «it is well» on every screen in the office. */
[data-office-hue="grey"]   { --office-hue:var(--muted); }
[data-office-hue="lime"]   { --office-hue:var(--lime); }
[data-office-hue="sky"]    { --office-hue:var(--sky-d); }
[data-office-hue="olive"]  { --office-hue:var(--olive-d); }
[data-office-hue="plum"]   { --office-hue:var(--plum); }
[data-office-hue="blue"]   { --office-hue:var(--blue); }
[data-office-hue="violet"] { --office-hue:var(--violet); }
/* the dark ground is the same four hues on the palette's own ink, and the SAME legend. Olive on that
   ink is 2.5:1, so its text step there is olive LIFTED — its own hue and saturation, lighter (7.14
   on a card, 4.82 on its own tint) — and the brand, the main action and «it is well» take that step.
   Lime stays «look here» and the sky «in motion», as on the light ground: were lime the accent here
   (it was, for a day), a warning, a selection and «it is well» were one colour. Each «-d» on its
   own «-soft» there, measured: olive 4.82 · sky 4.62 · lime 4.63 · plum 4.71. */
@media (prefers-color-scheme:dark){
  :root{ color-scheme:dark;
         --bg:#141b0f; --surface:#1f2a17; --surface-2:#192213; --ink:#f3f5f7; --muted:#a2a8a2; --line:#414a3b;
         --olive-d:#a5ba8c; --olive-soft:#384629; --olive-line:#56693f;
         --sky-d:#7baae3; --sky-soft:#2e3f38; --sky-line:#4d6a8c;
         --lime-d:#a9b84c; --lime-soft:#3b4622; --lime-line:#69732e;
         --plum-d:#ad99a4; --plum-soft:#402f33; --plum-line:#7c5c6d;
         --accent:var(--olive-d); --accent-ink:var(--surface);
         --red:#ad99a4; --violet:#bdadb6; --danger:#ad99a4; --ok:var(--olive-d); --side:var(--surface);
         --desk:var(--sky-ink); --desk-ink:var(--ink); --scrim:rgba(0,0,0,.6);
         --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.3);
         --shadow-lg:0 20px 60px rgba(0,0,0,.55); }
}
:root[data-theme="midnight"]{
  color-scheme:dark;
  --bg:#141b0f; --surface:#1f2a17; --surface-2:#192213; --ink:#f3f5f7; --muted:#a2a8a2; --line:#414a3b;
  --olive-d:#a5ba8c; --olive-soft:#384629; --olive-line:#56693f;
  --sky-d:#7baae3; --sky-soft:#2e3f38; --sky-line:#4d6a8c;
  --lime-d:#a9b84c; --lime-soft:#3b4622; --lime-line:#69732e;
  --plum-d:#ad99a4; --plum-soft:#402f33; --plum-line:#7c5c6d;
  --accent:var(--olive-d); --accent-ink:var(--surface);
  --red:#ad99a4; --violet:#bdadb6; --danger:#ad99a4; --ok:var(--olive-d); --side:var(--surface);
  --desk:var(--sky-ink); --desk-ink:var(--ink); --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.3);
  --shadow-lg:0 20px 60px rgba(0,0,0,.55);
}
/* THE KEYBOARD'S RING - what the browser draws around the stop the keyboard is on, in the palette, wherever
   a part draws none of its own. It has no specificity at all (:where), so any rule of a part wins. Two
   screens said this for themselves; on the others nearly every stop wore the browser's ring (DGO-455).
   A field keeps the offset it has - fourteen rules draw a field's own outline and say no offset. An area
   (a scroll box, a table) takes the ring inside, where nothing clips it; a control takes it outside,
   where a filled button does not hide it. */
:where(:focus-visible){outline:2px solid var(--accent)}
:where(:focus-visible:not(a,button,summary,[role=button],input,select,textarea)){outline-offset:-2px}
:where(a,button,summary,[role=button]):focus-visible{outline-offset:2px}
/* HEBREW AT A HEAVY WEIGHT - on Windows, where the first family of --font is installed. "Segoe UI" has its
   Hebrew in Light, Regular, Semibold and Bold. Asked for 800 or 900 the browser takes the family's Black
   face, which has none, and so has every family after it - so the Hebrew of every title at 800 was drawn in
   the system's last-resort serif, thin, beside Latin in Black: «חשבונות ומראות» at 20px is 150px wide at 700
   and 120px at 800 (Chrome 154; the screens ask for 800 in 167 places, the question's title among them).
   These faces give the family's HEBREW RANGE the faces that have it. A family a sheet names is no longer the
   system's for those characters, so every weight and both styles are named, each as the system resolves it:
   measured, only upright 800 and 900 change. Any other character is not theirs and goes on to the next
   family the screen names - system-ui in --font, on Windows the same faces, Black included - which is why
   G27 asks that system-ui follows wherever a screen names this family itself. Where the family is not
   installed nothing here resolves and nothing changes. */
@font-face{font-family:"Segoe UI";src:local("Segoe UI Light");font-weight:100 300;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI");font-weight:400;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Semibold");font-weight:500 600;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Bold");font-weight:700 900;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Light Italic");font-weight:100 300;font-style:italic;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Italic");font-weight:400;font-style:italic;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Semibold Italic");font-weight:500 600;font-style:italic;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Bold Italic");font-weight:700 900;font-style:italic;unicode-range:U+0590-05FF,U+FB1D-FB4F}
/* @bina-theme-tokens:end */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{margin:0}
a{color:var(--accent-d);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;border-radius:var(--radius-sm)}
button:disabled,button[aria-busy="true"]{opacity:.55;cursor:default}
bdi{unicode-bidi:isolate}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:start}
/* Lucide line icons — one size rule for every glyph (never emoji: they render differently on
   every OS and carry a colour the design system never chose) */
.ic-svg{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}

/* ── shared component tokens (pill / dot / btn) ── */
.pill{padding:2px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;white-space:nowrap;display:inline-block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.b{background:var(--sky)}.dot.a{background:var(--lime)}.dot.g{background:var(--ok)}.dot.r{background:var(--red)}.dot.n{background:var(--muted)}
.dot.healthy,.dot.ok{background:var(--accent)}.dot.needs_action,.dot.warn{background:var(--amber)}
.dot.checking{background:var(--blue)}.dot.degraded{background:var(--red)}.dot.muted{background:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border:none;border-radius:var(--radius-sm);
  padding:8px 15px;cursor:pointer;font-family:inherit;font-size:13px;transition:background .12s,color .12s;line-height:1.2;
  display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){background:var(--accent-d);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);border-color:var(--muted);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--red)}
.btn.danger:hover:not(:disabled){background:var(--plum-line);color:var(--red)}
.btn .ic-svg{width:14px;height:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:2px 9px;border-radius:var(--radius-pill);background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip .rm{cursor:pointer;font-weight:800;opacity:.55;padding:0 1px;display:inline-flex;background:none;border:none;color:inherit}
.chip .rm .ic-svg{width:11px;height:11px}
.chip .rm:hover{opacity:1}
.chip.addtag{background:var(--surface);border:1px dashed var(--line);color:var(--muted);cursor:pointer}
.chip.addtag:hover{border-color:var(--accent);color:var(--accent-d)}
.chip.healthy{background:var(--ok-soft);color:var(--accent-d);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--amber);border-color:transparent}
.chip.bad{background:var(--danger-soft);color:var(--red);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--blue);border-color:transparent}

/* ── the app's half of the menu contract ─────────────────────────────────────────────────────────
   `.bnv-host` is the container the menu MEASURES (its own width, not the window's) and `.appgrid` is
   the grid whose side column is `--bnv-side`. Those two classes are all mailview contributes to the
   layout of navigation: the full menu at ≥840px, an icon rail at 600–839px and a drawer over one
   pane below 600px come from bina-nav.css — so this screen is right inside a 940px pane on a 2000px
   desktop AND on a 390px phone, which a viewport query cannot do. */
.bnv-host{height:100vh;height:100dvh}
#app{height:100%}

/* the panel the menu sits in: a surface and a hairline, and nothing else — every row, its height,
   its hover, its rail and its drawer belong to the component. */
.side{border-inline-end:1px solid var(--line)}
/* ── compose ────────────────────────────────────────────────────────────────────────────────────
   The compose WINDOW — the button that opens it is the menu's own primary action. Reply / reply-all
   / forward in the reader open the same window with prefills. */
.mlc-ov{position:fixed;inset:0;background:var(--scrim);z-index:10000;display:flex;
  align-items:flex-end;justify-content:flex-start;padding-inline-start:24px}
.mlc-win{background:var(--surface);width:min(540px,94vw);border-radius:14px 14px 0 0;
  box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;max-height:80vh}
/* on a phone it is a sheet the width of the screen: inset from one side only, it left a strip of the
   list showing beside it */
@media (max-width:640px){.mlc-ov{padding-inline-start:0}.mlc-win{width:100%}}
.mlc-h{background:var(--olive);color:var(--olive-ink);padding:11px 16px;font-size:13px;font-weight:600;
  display:flex;justify-content:space-between;align-items:center}
.mlc-h button{background:none;border:none;color:inherit;cursor:pointer;font-size:16px;opacity:.8;display:inline-flex}
.mlc-h button:hover{opacity:1}
.mlc-b{padding:6px 16px 14px;overflow:auto}
.mlc-f{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:9px 2px}
.mlc-f label{font-size:12px;color:var(--muted);min-width:52px}
.mlc-f input{flex:1;border:none;outline:none;font:inherit;font-size:14px;background:transparent;color:var(--ink)}
.mlc-body{width:100%;min-height:190px;border:none;outline:none;resize:vertical;font:inherit;font-size:14px;
  padding:12px 2px;color:var(--ink);background:transparent}
.mlc-foot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
.mlc-send{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--radius-pill);padding:9px 22px;
  font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.mlc-send:hover:not(:disabled){background:var(--accent-d)}
.mlc-err{color:var(--red);font-size:12.5px;margin-inline-start:auto}
/* the office's notice is said in the corner «שליחה» is in: while the sheet is open it sits above the foot
   (which is 60px under a cursor and 68px under a thumb — see below) */
body:has(.mlc-ov) #bina-tell{inset-block-end:76px}
/* a 25x21 close button is fine for a cursor and a coin-toss for a thumb */
@media (pointer:coarse){.mlc-h button{padding:10px 12px;font-size:20px}
  .mlc-send{padding:13px 26px}.mlc-f{padding:13px 2px}}
/* the scroll region, the section headings, the "show more" row, the pinned footer and the user
   line are the COMPONENT's (.bnv-scroll / .bnv-ghead / .bnv-more / .bnv-foot), so none of them is
   styled here — that is what keeps this menu and the ten others the same object. */
/* the settings menu — two named destinations, never a bare gear that opens "somewhere" */
.gearwrap{position:relative}
.gearmenu{position:absolute;bottom:calc(100% + 6px);inset-inline-start:0;min-width:210px;z-index:30;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);
  padding:5px;display:flex;flex-direction:column;gap:1px}
.gearmenu a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;color:var(--ink);
  font-size:13px;font-weight:600}
.gearmenu a:hover{background:var(--accent-soft);color:var(--accent-d)}
.gearmenu a .ic{display:inline-flex;color:var(--muted)}
.gearmenu a .sub{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}

/* ── main ── */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0 28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;
  border-bottom:1px solid var(--line);padding:18px 2px 14px;flex:none}
.topbar h1{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-tools{display:flex;align-items:center;gap:14px;flex:none}

.tablewrap{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);margin-top:14px}
.empty{padding:48px;text-align:center;color:var(--muted)}
/* the failure state — what a list shows when the mailbox could not be reached at all */
.failbox{padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.failbox > .ic-svg{width:28px;height:28px;color:var(--red)}   /* its own mark — not the one inside «נסה שוב», which it drew large and red on the button */
.failbox b{font-size:15px}
.failbox .why{color:var(--muted);font-size:12.5px;max-width:560px;overflow-wrap:anywhere}
/* the line WRAPS between its parts, and a link in it is one token: as a row that could not wrap, on
   a phone «טען עוד» and «דואר בדיקה מוסתר — הצג» each broke in two (seen in the simulation's copy
   of this rule, 2026-10-07) */
.statusbar{flex:none;padding:8px 4px 12px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:2px 16px}
/* (the count of further labels, «+3», is a number with its sign before it: in the row's direction it was drawn «3+») */
.plusn{display:inline-block;font-size:10.5px;font-weight:800;color:var(--muted);background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius-pill);padding:1px 8px;cursor:pointer;direction:ltr}
.plusn:hover{background:var(--accent-soft);color:var(--accent-d)}
.testline{color:var(--accent-d);cursor:pointer;font-weight:600;white-space:nowrap}
.testline:hover{text-decoration:underline}

/* ── modal + overlay + notice (shared pattern) ── */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:40}
.modal{position:fixed;top:50%;inset-inline-start:50%;transform:translate(50%,-50%);z-index:60;
  width:min(460px,92vw);max-height:80vh;background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.modal.wide{width:min(640px,94vw)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:16px}
.modal-b{padding:14px 20px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal-b input[type=text],.modal-b input[type=search],.modal-b textarea{border:1px solid var(--line);border-radius:8px;padding:9px 12px;
  font-family:inherit;font-size:14px;width:100%;background:var(--surface);color:var(--ink)}
.modal-b textarea{min-height:120px;resize:vertical}
.modal-f{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:9px 14px}
.primary:hover:not(:disabled){background:var(--accent-d);color:var(--accent-ink)}
.ghost{background:var(--surface);border:1px solid var(--line);padding:8px 14px;font-weight:600;color:var(--ink)}
.ghost:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.danger{background:var(--danger-soft);color:var(--red);font-weight:700;padding:9px 14px}
.danger:hover:not(:disabled){background:var(--plum-line)}
.x{background:var(--surface-2);border:1px solid var(--line);width:30px;height:30px;border-radius:8px;font-weight:800;color:var(--ink);
  display:inline-grid;place-items:center}
.x:hover{background:var(--accent-soft);border-color:var(--accent)}
.pick-list{display:flex;flex-direction:column;gap:2px;max-height:42vh;overflow:auto}
.pick{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px}
.pick:hover{background:var(--accent-soft)}
.pick-new{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.pick-new input{flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field .h{font-size:11.5px;color:var(--muted);line-height:1.45}
.field input[type=text],.field input[type=password]{border:1px solid var(--line);border-radius:8px;padding:9px 12px;
  font-family:inherit;font-size:14px;width:100%;background:var(--surface);color:var(--ink)}
/* (ONE notice channel for every action — the office's own, `binaTell` in app.js: a success is a short
   line that fades; a failure STAYS until it is pressed and carries the service's own sentence; an
   action that can be undone carries «ביטול» for a few seconds. No notice or snackbar of this screen's.) */

/* ══ Gmail-grade message list ══════════════════════════════════════════════════════════════════
   The list is ROWS, not a data table: a table with column headers is what made this read as an
   internal admin tool rather than a mail client. Read rows sit on a tinted ground, unread rows are
   white + bold, and hovering a row raises it and swaps the date for quick actions. */
/* ── reading pane ──────────────────────────────────────────────────────────────────────────────
   A message gets the whole column: subject as the page heading, sender block underneath, body on
   white at a comfortable measure, and every action in one bar at the top. */
.readpane{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.rp-bar{flex:none;display:flex;align-items:center;gap:4px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
/* (a pane's bar carries no title of its own: the page's heading, a line above it, already says «חוקי
   תיוג» or «הגדרות תיבה» — the bar said it a second time, under it) */
.rp-back{background:transparent;border:none;color:var(--muted);padding:7px;border-radius:50%;
  display:inline-grid;place-items:center;cursor:pointer}
.rp-back:hover{background:var(--surface-2);color:var(--ink)}
.rp-back .ic-svg{width:17px;height:17px}
/* (what stands beside the back button takes the room it leaves and wraps INSIDE it: sized by its own
   content it went to a line of its own as soon as it was wider than that room, and the back button
   stood alone on a line above it — three lines of bar in the smallest window) */
.rp-acts{display:flex;gap:2px;align-items:center;padding-inline-start:6px;flex:1 1 0;min-width:0;
  border-inline-start:1px solid var(--line);margin-inline-start:4px;flex-wrap:wrap}
.rp-acts .gm-act,.rp-nav .gm-act{display:inline-grid;place-items:center}
.rp-nav{display:flex;align-items:center;gap:2px;margin-inline-start:auto}
.rp-pos{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rp-scroll{flex:1;min-height:0;overflow:auto;padding:22px 26px 26px}
/* the reading measure is capped: a 1400px-wide line of Hebrew is unreadable no matter how much
   screen there is, so the pane centres its content instead of stretching it */
.rp-scroll>*{max-width:860px;margin-inline:auto}
.rp-subject{font-size:22px;font-weight:800;line-height:1.35;margin-bottom:10px}
.rp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.rp-from{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:12.5px;
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.rp-from b{color:var(--ink);font-size:13.5px}
.rp-body{min-height:180px;font-size:14px;line-height:1.7}
.rp-body iframe{width:100%;min-height:240px;border:none;background:#fff}
.rp-body pre{margin:0;white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.7}
/* loading / failure state of the open message — the pane is never a stale previous message */
.rp-state{padding:26px 0;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);text-align:center}
.rp-state.err{color:var(--red)}
.rp-state .why{font-size:12.5px;overflow-wrap:anywhere;max-width:560px}
.skel{width:100%;max-width:720px;display:flex;flex-direction:column;gap:9px}
.skel div{height:11px;border-radius:6px;background:var(--line);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.skel div{animation:none}}
.rp-atts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.rp-atts:empty{display:none;border:none;margin:0;padding:0}
.att-h{flex-basis:100%;font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.05em}
.attcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;min-width:210px;max-width:280px;background:var(--surface);color:var(--ink)}
.attcard:hover{border-color:var(--accent);background:var(--surface-2)}
.attic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.attic .ic-svg{width:15px;height:15px}
.attx{min-width:0;display:flex;flex-direction:column}
.attx b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attx span{font-size:11px;color:var(--muted)}
/* the document-system panel: what INDOX did with this message, or that it could not be asked */
.rp-doc{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;display:flex;
  flex-direction:column;gap:8px;margin-bottom:16px}
.rp-doc.err{border-color:var(--plum-line);background:var(--danger-soft)}
.rp-doc.none{padding:6px 14px;color:var(--muted);font-size:12px}
.dochead{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.05em}
.docrow{display:flex;flex-direction:column;gap:3px}
.docline{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
.docerr{color:var(--red);font-size:11.5px}
.doclink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.badge{padding:1px 8px;border-radius:var(--radius-pill);font-size:11px;font-weight:700}
.badge.g{background:var(--ok-soft);color:var(--accent-d)}.badge.r{background:var(--danger-soft);color:var(--red)}
.badge.a{background:var(--warn-soft);color:var(--amber)}

/* ── the earlier turns of a conversation ── */
.rp-thread{margin-top:22px}
.rp-thread:empty{display:none}
.th-h{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.05em;
  border-top:1px solid var(--line);padding-top:14px;margin-bottom:6px}
.thmsg{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--surface-2)}
.thmsg.open{background:var(--surface)}
.thm-h{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;min-width:0}
.thm-h:hover{background:var(--accent-soft)}
.thm-h b{font-size:12.5px;flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thm-snip{flex:1;min-width:0;color:var(--muted);font-size:12.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.thm-when{flex:none;font-size:11.5px;color:var(--muted)}
.thm-b{padding:4px 14px 14px;border-top:1px solid var(--line)}
.thm-b iframe{width:100%;min-height:180px;border:none;background:#fff}
.thm-b pre{margin:0;white-space:pre-wrap;font-family:inherit;font-size:13.5px;line-height:1.7}
.thm-b .muted{font-size:12px;padding:8px 0}
.rp-reply{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.rp-reply button{background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--radius-pill);padding:8px 18px;font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;gap:7px}
.rp-reply button:hover:not(:disabled){background:var(--surface-2);border-color:var(--muted)}
.rp-reply .ic-svg{width:14px;height:14px}
@media (max-width:640px){
  .rp-scroll{padding:16px 14px 20px}
  .rp-subject{font-size:18px}
  .rp-acts{border:none;margin:0;padding:0}
  .rp-nav{margin-inline-start:auto}
}
/* On a phone the top bar holds the title and two 44px buttons, nothing else. The search is not
   squeezed into a stub up here any more: it lives in the menu, and the magnifier opens the drawer
   on it — "always choose what is possible to display at any given size". */
@media (max-width:760px){
  .main{padding:0 12px}
  .topbar{flex-wrap:wrap;gap:8px;padding:12px 2px 10px}
  .topbar h1{flex:1 1 auto;font-size:17px}
  .topbar-tools{flex:1 1 100%;gap:4px}
  .gm-tools{flex-wrap:wrap}
  .gm-count{flex-basis:100%;margin-inline-start:0;order:9}
}

.gm-tools{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);
  background:var(--surface);position:sticky;top:0;z-index:3;border-radius:12px 12px 0 0;flex-wrap:wrap}
.gm-tbtn{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 10px;
  font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.gm-tbtn:hover:not(:disabled){background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.gm-tbtn .ic-svg{width:14px;height:14px}
.gm-tbtn[aria-busy="true"] .ic-svg{animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gm-selinfo{font-size:12.5px;font-weight:700;color:var(--accent-d)}
.gm-bulk{display:flex;gap:2px;align-items:center;padding-inline-start:8px;border-inline-start:1px solid var(--line)}
.gm-count{margin-inline-start:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* ── a SHORT frame: a window in desktop mode ────────────────────────────────────────────────────
   The list is this screen, and its chrome is fixed around it: in the smallest window (380 × 224) the
   title on one row, the menu's two buttons on the next and the status line left the list its own
   toolbar and not one message (the windows suite, 2026-10-09). There the title shares ONE row
   with the two buttons and the chrome is tighter; and the list's toolbar is one row too — the time
   window scrolls inside itself where the row is narrow, the count is left to the status line, which
   says it — and scrolls away with the rows instead of standing over them. (A selection's own
   buttons still wrap: they are more than a row.) */
@media (max-height:399px){
  .topbar{flex-wrap:nowrap;padding:6px 2px}
  .topbar-tools{flex:none}
  .tablewrap{margin-top:8px}
  .gm-tools{position:static}
  .gm-tools:not(:has(.gm-bulk)){flex-wrap:nowrap}
  .gm-win{flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
  .gm-win::-webkit-scrollbar{display:none}
  .gm-win button{flex:none}
  .gm-count{display:none}
  .statusbar{padding:4px 4px 6px}
}

/* time-window segmented control — the platform's existing `.seg` (platform-base/any-concurrency),
   lifted rather than reinvented so this reads as the same product. RTL: no left/right anywhere —
   `inline-flex` in a dir="rtl" document lays the options out right-to-left by itself. */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;color:var(--muted);font-family:inherit;
  font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer;transition:.12s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--line)}
/* A window switch is a server round trip. Dim the control while it is in flight so a second click
   is visibly not being taken. */
.gm-win.busy{opacity:.55;pointer-events:none}

/* select-all: box toggles, caret opens predicates. "select every unread" is the real operation. */
.gm-selwrap{position:relative;display:flex;align-items:center;gap:1px}
.gm-caret{border:none;background:transparent;color:var(--muted);cursor:pointer;
  padding:2px 3px;border-radius:4px;line-height:1;display:inline-flex}
.gm-caret .ic-svg{width:12px;height:12px}
.gm-caret:hover{background:var(--surface-2);color:var(--ink)}
.gm-selmenu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:20;min-width:150px;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-lg);
  padding:5px;display:flex;flex-direction:column}
.gm-selmenu button{border:none;background:transparent;font:inherit;font-size:12.5px;text-align:start;
  padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink)}
.gm-selmenu button:hover{background:var(--accent-soft);color:var(--accent-d)}
/* partial selection reads as a dash, not a tick — "some" and "all" must never look the same */
.gm-cb.some{background:var(--accent);border-color:var(--accent);position:relative}
.gm-cb.some::after{content:"";position:absolute;inset-inline-start:2px;top:5px;width:8px;height:2px;background:var(--accent-ink)}

/* density — the same list at three information densities (Gmail's comfortable/cozy/compact) */
body[data-density="comfortable"] .gm-row{height:56px}
body[data-density="compact"] .gm-row{height:32px}
body[data-density="compact"] .gm-av{display:none}

.gm-list{display:flex;flex-direction:column}
.gm-day{font-size:11.5px;font-weight:700;color:var(--muted);padding:10px 12px 4px;letter-spacing:.02em}

.gm-row{display:flex;align-items:center;gap:9px;padding:0 10px;height:42px;
  border-bottom:1px solid var(--line);background:var(--surface-2);cursor:pointer;position:relative}
.gm-row:hover{background:var(--surface);box-shadow:inset 1px 0 0 var(--line),var(--shadow);z-index:2}
.gm-row.unread{background:var(--surface)}
.gm-row.unread .gm-from,.gm-row.unread .gm-sub{font-weight:700;color:var(--ink)}
.gm-row.sel{background:var(--accent-soft)}
.gm-row.subrow{padding-inline-start:34px;background:var(--surface-2)}
.gm-row.busy{opacity:.5;pointer-events:none}

.gm-cb{width:16px;height:16px;flex:none;border:2px solid var(--muted);border-radius:3px;cursor:pointer}
.gm-cb:hover{border-color:var(--ink)}
.gm-cb.on{background:var(--accent);border-color:var(--accent);position:relative}
.gm-cb.on::after{content:"";position:absolute;inset-inline-start:4px;top:0;width:4px;height:9px;
  border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.gm-star,.gm-imp{flex:none;width:20px;display:inline-flex;justify-content:center;color:var(--line);cursor:pointer;line-height:1;
  background:none;border:none;padding:0}
.gm-star .ic-svg,.gm-imp .ic-svg{width:15px;height:15px}
.gm-star:hover,.gm-imp:hover{color:var(--muted)}
.gm-star.on,.gm-imp.on{color:var(--lime)}   /* «look here»: a star, a mark of importance */
.gm-star.on .ic-svg,.gm-imp.on .ic-svg{fill:currentColor}
.gm-av{flex:none;width:24px;height:24px;border-radius:50%;color:var(--surface);font-size:11px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center}
.gm-from{flex:0 0 168px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:13px;color:var(--ink)}
.gm-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.gm-sub{color:var(--ink)}
.gm-snip{color:var(--muted)}
.gm-att{flex:none;width:16px;display:inline-flex;justify-content:center;color:var(--muted)}
.gm-att .ic-svg{width:13px;height:13px}
/* Label Engine triage dot — mail's own status ("has mailLabelEngine01 gotten to this message, and
   what happened"), resolved from the tag-rule KEYS in app.js's TRIAGE_KEYS via /api/label-map (never
   a hardcoded label literal). One small dot, THREE states; a message with none of the lifecycle
   labels paints nothing, on purpose. */
.gm-triage{flex:none;width:12px;display:inline-flex;justify-content:center;align-items:center}
.gm-triage.waiting::after,.gm-triage.processed::after,.gm-triage.failed::after{content:"";width:6px;height:6px;border-radius:50%}
.gm-triage.waiting::after{background:var(--amber)}
.gm-triage.processed::after{background:var(--accent)}
.gm-triage.failed::after{background:var(--red)}
.gm-when{flex:0 0 84px;text-align:end;font-size:12px;color:var(--muted);white-space:nowrap}
.gm-row.unread .gm-when{font-weight:700;color:var(--ink)}

/* hover swaps the date for the quick actions — the real product's most-used affordance */
.gm-acts{display:none;gap:2px;flex:none;align-items:center}
.gm-row:hover .gm-acts{display:flex}
.gm-row:hover .gm-when{display:none}
.gm-act{border:none;background:transparent;cursor:pointer;line-height:0;
  padding:6px;border-radius:50%;color:var(--muted);display:inline-grid;place-items:center}
.gm-act .ic-svg{width:15px;height:15px}
.gm-act:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.gm-act:disabled{opacity:.32;cursor:default;background:transparent}
.gm-act.on{color:var(--lime)}
.gm-act.on .ic-svg{fill:currentColor}
.gm-row .thx{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:16px;
  padding:0 5px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);
  font-size:11px;font-weight:700;color:var(--muted);margin-inline-start:6px;cursor:pointer}
.gm-row .thx .ic-svg{width:11px;height:11px}

@media (max-width:820px){
  /* A WRAPPED ROW OWES ITS CELLS THE ROOM THE LINE HAS. This was `flex-basis:96px`, a width chosen
     for the single-line desktop row; here the row wraps, so the sender sits alone on the first line
     beside the checkbox and the star, and 96px cut the names that needed 108–185px while a third of
     that line stood empty (measured 390×844: every element the ui-coverage audit called "cut" on
     this screen was a `.gm-from`). `flex:1 1 auto` takes the free space; the ellipsis stays, for a
     name genuinely longer than the line, which is the one case it is for. */
  .gm-from{flex:1 1 auto}
  .gm-av,.gm-imp{display:none}
  .gm-row{height:auto;padding:9px 10px;align-items:flex-start;flex-wrap:wrap}
  /* …and a snippet that is one unbreakable token (a URL, an address — most business mail carries
     one) has no line to break at, so `white-space:normal` alone still clipped it: the box cut the
     whole snippet where the text had nowhere to go. */
  .gm-main{flex-basis:100%;white-space:normal;overflow-wrap:anywhere}
  .gm-row:hover .gm-when{display:inline}
  .gm-acts{display:none!important}
}

/* ══ the rules editor (/organizer) ═════════════════════════════════════════════════════════════
   A real editor over the organizer's rule rows: order · event · key · label · rule · enabled, each
   cell editable in place, RULE in a monospace LTR box (it is JavaScript, and a Hebrew string inside
   an RTL textarea is unreadable), the inList arrays as chips, and per-row validation problems
   printed under the cell they belong to. */
.org-scroll{padding:18px 22px 26px}
.org-scroll>*{max-width:none}
.org-intro{color:var(--muted);margin:0 0 12px;font-size:13px}
.org-notice{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}

.org-legend{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:12px;background:var(--surface-2);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px 22px;font-size:12.5px}
.org-legend h3{font-size:12px;color:var(--muted);letter-spacing:.05em;margin-bottom:6px}
.org-legend div.l{display:flex;gap:8px;align-items:baseline;padding:2px 0;min-width:0}
.org-legend code{font-family:var(--mono);font-size:11.5px;direction:ltr;unicode-bidi:isolate;background:var(--surface);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org-legend span{color:var(--muted);min-width:0}
.org-grid{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.org{width:100%;border-collapse:collapse;min-width:960px}
table.org th{position:sticky;top:0;z-index:2;text-align:right;font-size:12px;color:var(--muted);
  font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.org td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
table.org tr:last-child td{border-bottom:none}
table.org tr.sys td{background:var(--surface-2)}
table.org tr.off td{opacity:.62}
table.org tr.off td.org-on{opacity:1}
table.org tr.bad td{background:var(--danger-soft)}
td.org-ord{white-space:nowrap;width:86px}
.ord-n{display:inline-block;min-width:22px;text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.ord-b{background:transparent;border:1px solid var(--line);border-radius:6px;width:24px;height:24px;display:inline-grid;
  place-items:center;color:var(--muted);padding:0;margin-inline-start:2px}
.ord-b:hover:not(:disabled){border-color:var(--accent);color:var(--accent-d)}
.ord-b .ic-svg{width:12px;height:12px}
td.org-type{width:150px}
td.org-key{width:190px}
td.org-label{width:230px}
td.org-on{width:60px;text-align:center}
td.org-acts{width:120px;white-space:nowrap}
.org-in{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-family:inherit;font-size:13px;
  background:var(--surface);color:var(--ink)}
.org-in.ltr{direction:ltr;text-align:left;font-family:var(--mono);font-size:12.5px}
.org-in:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.org-in.bad{border-color:var(--red)}
select.org-in{cursor:pointer}
.org-ro{color:var(--muted);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
textarea.org-rule{min-height:64px;resize:vertical;line-height:1.55;white-space:pre-wrap}
.org-prob{color:var(--red);font-size:11.5px;margin-top:4px;display:flex;gap:5px;align-items:flex-start}
.org-prob .ic-svg{width:12px;height:12px;flex:none;margin-top:3px}
.org-lbl{display:flex;flex-direction:column;gap:6px}
.org-lbl .pickbtn{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid var(--line);
  border-radius:7px;padding:6px 9px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;text-align:start}
.org-lbl .pickbtn:hover{border-color:var(--accent)}
.org-lbl .pickbtn .ic-svg{width:13px;height:13px;color:var(--muted);flex:none}
.org-lbl .pickbtn bdi{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org-lbl .pickbtn .none{color:var(--muted)}
.org-rm{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.org-rm input{margin:0}
/* (a rule's switch is pressed through the label around it: the box is 13px - 20 under a finger - the label 30) */
.org-onl{display:inline-flex;align-items:center;justify-content:center;min-width:30px;min-height:30px;margin-block:-5px;cursor:pointer}
.org-rm.on{color:var(--red);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px;padding:6px 8px;border:1px dashed var(--line);border-radius:8px}
.chips .chh{flex-basis:100%;font-size:11px;color:var(--muted);font-family:var(--mono);direction:ltr;text-align:left}
.chips .chip{max-width:260px}
.chips .chip bdi{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.chips input{border:none;background:transparent;font:inherit;font-size:12px;min-width:140px;flex:1;color:var(--ink);direction:ltr;text-align:left}
.chips input:focus{outline:none}
.chips:focus-within{border-color:var(--accent)}   /* the field's outline is off: its frame says where the keyboard is */
.org-rowacts{display:flex;gap:4px;flex-wrap:wrap}
.org-rowacts button{padding:5px 9px;font-size:12px}
/* The table needs 960px to show one rule whole, and the pane it stands in is narrower than that
   nearly everywhere: 892px in the console at 1440 (two menus beside it), a desktop-mode window, a
   tablet, a phone. There a rule's own buttons — and on a phone everything past its key — were behind
   a sideways scroll of the card. Where the grid ITSELF is narrower than the table (its own width: a
   container query, not the window's), a rule is a card: its order, its key, its switch and its
   buttons on one line; its label and its event on the next; the rule across the whole width. The
   header row is gone there, so each field says what it is. */
.org-grid{container:orgrid / inline-size}
@container orgrid (max-width:959px){
  table.org,table.org tbody{display:block;min-width:0}
  table.org thead{display:none}
  table.org tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px 12px;align-items:start;
    grid-template-areas:"ord key on acts" "lbl lbl type type" "rule rule rule rule";
    padding:12px 14px;border-bottom:1px solid var(--line)}
  table.org tr:last-child{border-bottom:none}
  table.org tr.sys{background:var(--surface-2)}
  table.org tr.bad{background:var(--danger-soft)}
  table.org td,table.org tr.sys td,table.org tr.bad td{display:block;width:auto;min-width:0;padding:0;border:none;background:none}
  td.org-ord{grid-area:ord;align-self:center}
  td.org-key{grid-area:key}
  td.org-on{grid-area:on;align-self:center;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  tr:not(.sys) > td.org-on::after{content:"פעיל"}
  td.org-acts{grid-area:acts;align-self:center}
  td.org-type{grid-area:type}
  td.org-label{grid-area:lbl}
  td.org-rule{grid-area:rule}
  td.org-type::before,td.org-label::before,td.org-rule::before{display:block;margin-bottom:3px;font-size:11px;font-weight:700;color:var(--muted)}
  td.org-type::before{content:"אירוע"}
  td.org-label::before{content:"תווית"}
  td.org-rule::before{content:"חוק"}
}
@container orgrid (max-width:519px){
  table.org tr{grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"ord on" "key key" "lbl lbl" "type type" "rule rule" "acts acts"}
}

/* ══ mailbox settings (/settings) ══════════════════════════════════════════════════════════════
   The three screens that lived in the mail service's own UI — the company's addresses, the
   private-mail DNS/DKIM checklist, and the guided connect — as sections of one pane. */
.set-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-inline-start:10px;flex:1 1 0;min-width:0}
.set-tabs a{padding:6px 12px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid transparent}
.set-tabs a:hover{background:var(--surface-2);color:var(--ink)}
.set-tabs a.active{background:var(--accent-soft);color:var(--accent-d);border-color:transparent}
.set-scroll{padding:18px 22px 26px}
.set-scroll>*{max-width:820px}
.set-h{font-size:18px;font-weight:800;margin-bottom:4px}
.set-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.set-acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
/* a part of a settings section — «חשבונות מחוברים», and under it «חיבור חשבון חדש»: the wizard's step
   chips stood right against the list above them, with nothing to say that a second thing begins */
.set-cap{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 8px}
.set-sub + #cwConns > .set-cap:first-child{margin-top:6px}
.cw-msg{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  font-size:12.5px;line-height:1.6;display:flex;align-items:flex-start;gap:9px;min-width:0;margin-bottom:10px}
.cw-msg .ic-svg{width:15px;height:15px;flex:none;margin-top:2px}
.cw-msg>div{min-width:0}
.cw-msg b{display:block}
.cw-msg .sub{color:var(--muted);font-weight:400}
.cw-msg.soft{background:transparent;border-color:transparent;color:var(--muted);padding:0 2px}
.cw-msg.ok{background:var(--ok-soft);border-color:var(--olive-line);color:var(--accent-d)}
.cw-msg.err{background:var(--danger-soft);border-color:var(--plum-line);color:var(--red)}
.cw-msg.wait{background:var(--info-soft);border-color:var(--sky-line);color:var(--blue)}
.cw-msg.ok .sub,.cw-msg.err .sub,.cw-msg.wait .sub{opacity:.8;color:inherit}
.spin{display:inline-flex;animation:sp 1.4s linear infinite}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.cw-steps{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 10px}
.cw-step{padding:3px 9px;border-radius:var(--radius-pill);background:var(--bg);border:1px solid var(--line);
  color:var(--muted);font-size:11px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.cw-step.cur{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-d);font-weight:700}
.cw-step.done{color:var(--accent-d);border-color:var(--olive-line)}
.cw-step .ic-svg{width:11px;height:11px}
.cw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:10px}
/* a card is a BUTTON, and a button centres what it holds: two cards of unequal text stood with their
   icons and names at different heights. Its lines start at its top, one under the other. */
.cw-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:var(--shadow);text-align:start;color:inherit;min-width:0;font:inherit;

  transition:transform .08s,box-shadow .12s,border-color .12s}
.cw-card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.cw-ic{color:var(--accent-d);display:inline-flex}
.cw-ic .ic-svg{width:24px;height:24px}
.cw-t{font-weight:700;font-size:14.5px;margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cw-d{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.45}
.cw-m{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;color:inherit;min-width:0;font:inherit;margin-bottom:8px}
.cw-m:hover{border-color:var(--accent);background:var(--accent-soft)}
.cw-m-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;flex-wrap:wrap}
