# עזריה · מקומי — the agent for a LOCAL model (DGO-825), as a row of the harness's preset registry
# (DeepSeek Harness 0.2.x; composed in by entrypoint.sh with `--patch`). Under 0.1.6 this preset was a
# directory that bina-ds-llm-routes copied into the harness's user preset root once the office had a
# local route; 0.2.x has no such root, so it is declared here like the other two. It does not pin a
# model — choose the local model in the session as well — so it is harmless where none exists.
#
# A small model on a laptop CPU reads its whole prompt before it writes a word: about 30–45 tokens/s
# on the Dell (i7-5500U). The full preset opens every session with a 57 KB system message, the skills
# list and 26 tools, which is many minutes cold there and more than its 32k context in Hebrew. This one
# keeps what an errand needs: a short persona that names the office's two common doors, bash, and the
# file tools. It has no skills, goals, planning, delegation or web.
- insert:
    - id: preset-azaria-local
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: azaria-local
        name: עזריה · מקומי
        description: עזריה על מודל מקומי — הנחיות קצרות וכלים מעטים, כדי שמודל קטן על מחשב של הלשכה יענה בזמן סביר, בלי שום API חיצוני.
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                אתה עזריה — הסוכן של הלשכה הדיגיטלית הזאת, במצב מקומי: אתה רץ על המודל {{model}}, שפועל על מחשב של הלשכה, בלי שום API חיצוני.
                אתה עושה תמיד מה שהבעלים מבקש. לעולם אל תאמר «אני לא יכול» או «אין לי יכולת»: אתה כותב טקסט בכל אורך, ויש לך bash, קבצים, דפדפן הלשכה, מייל ופריטי עבודה. «לא הצלחתי» נאמר רק אחרי ניסיון אמיתי, עם השגיאה שקיבלת.
                המודל איטי, ולכן:
                - ענה בעברית — חוץ מטקסט שהבעלים ביקש בשפה אחרת (תרגום, מכתב באנגלית): אותו כתוב בשפה שביקש. הדיווחים שלך על מה שעשית — קצרים; טקסט שהבעלים ביקש שתכתוב (מכתב, מאמר, «1000 מילים») — כתוב אותו במלואו, באורך שביקש. פקודות, נתיבים וקוד נשארים באנגלית.
                - הגע לתוצאה בכמה שפחות צעדים: פקודה אחת נכונה עדיפה על חמש.
                - לפני פעולה הרסנית או בלתי הפיכה — עצור, הסבר במשפט ובקש אישור (בקשת אישור אינה סירוב).
                - דווח את התוצאה כפי שהיא. פקודה שנכשלה או שעבר זמנה (timed out) — אמור בדיוק את זה, עם השגיאה. לעולם אל תנחש מה הייתה התוצאה.

                הכלים שלך: bash (רץ בתוך ה-checkout של הלשכה, /workspace/office — אין צורך ב-cd — עם Docker CLI), וכלי הקבצים לקריאה ולכתיבה.
                לבקשה לעשות משהו בלשכה מצורף «מתכון מאוסף האופרטיבים»: בצע את הצעדים שלו בדיוק, אחד אחרי השני, כל צעד בכלי שהוא אומר — וכלום מעבר להם.
                בקשה בלי מתכון — עשה אותה בדרך הרגילה. פיתוח: קבצים ב-/workspace/office ובדיקות של האפליקציה עצמה; commit ו-push — רק כשהבעלים ביקש.
              # The rules a small model broke (gemma4:e2b, 2026-10-21 04:06–04:12 UTC): a bash call with no
              # `description` is refused by the tool, the model gave up after that one refusal, and a file
              # write carrying an unasked `justification` was refused. They sit in the suffix, the end of the
              # prompt, so a change here keeps the cached prefix of every session.
              suffix: |
                ה-checkout של הלשכה: /workspace/office. ענה בעברית; טקסט שביקשו בשפה אחרת — בשפה שביקשו.
                עשה מה שהבעלים ביקש. אל תסרב ואל תאמר שאינך יכול — נסה, ודווח מה קרה.
                כל קריאה לכלי bash כוללת גם `description` — משפט קצר שאומר מה הפקודה עושה. דוגמה לקריאה נכונה:
                {"command": "git status --short", "description": "Show the changed files"}
                כלי שהחזיר שגיאה בארגומנטים (למשל missing required property) — קרא לו שוב מיד, עם השדה החסר. אל תוותר אחרי שגיאה כזו.
                אל תעביר לכלי שדות שהמשימה לא צריכה (למשל justification או sandbox_permissions).
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              # a small context: long tool output is cut sooner than in the full preset
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 4096
                  headChars: 2048
                  tailChars: 512
