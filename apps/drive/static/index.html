@media (max-height:399px){
  .bnv{overflow-y:auto;overscroll-behavior:contain}
  .bnv-scroll{flex:none;overflow:visible}
  /* …and the page's own menu buttons are a cursor's size there, not a finger's: 44px of a head is a
     fifth of such a window (a touch screen keeps the finger's size — it is not this window). */
  @media (pointer:fine){.bnv-burger{width:32px;height:32px;border-radius:8px}}
}
@media (prefers-reduced-motion:reduce){
  .bnv,.bnv *,.bnv-scrim{transition:none!important;animation:none!important}
}
/* @bina-nav:end */
</style>
</head>
<body>
<div id="app">
  <aside class="side bnv">
    <div class="brand bnv-head"><span class="logo">ד</span><b>דרייב</b></div>
    <label class="upbtn primary block"><span data-ic="upload"></span> העלאת מסמכים<input type="file" id="filePick" multiple hidden></label>
    <div class="sidescroll bnv-scroll">
      <!-- System places. A drive's rail answers "where can a file be?" — three of these are not
           places at all but standing QUERIES (recent / starred / shared-with-me), which is exactly
           why they sit above the folder tree and not inside it. -->
      <nav id="sysRail" class="sysrail bnv-list"></nav>
      <!-- slot "rail" (§4c): whatever apps registered. Empty when nothing is registered — the drive
           below is complete without it. -->
      <div id="railMount"></div>
      <nav id="folderTree">
        <div class="navhead" id="treeHead"><span>התיקיות שלי</span><span class="tog" data-ic="chevron"></span></div>
        <div id="treeList"></div>
      </nav>
    </div>
    <button id="newFolderBtn" class="newfolder"><span data-ic="plus"></span> תיקייה חדשה</button>
    <!-- storage meter: the only place the drive states its own limits, so it lives where the eye
         lands last and never competes with navigation -->
    <div id="storeBox" class="storebox"></div>
    <div class="acct" id="acct"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="viewTitle">דרייב</h1>
      <button id="sideToggle" class="linkbtn" title="תיקיות" aria-label="תיקיות" data-ic="menu"></button>
      <div class="topbar-tools">
        <input id="search" type="search" placeholder="חיפוש בתיקייה…" autocomplete="off"/>
        <div class="hint" id="folderHint"></div>
      </div>
    </header>

    <!-- Toolbar: WHERE you are (breadcrumb) · HOW you narrow (filter chips) · HOW you look
         (list/grid + details). Three different questions, so three visually distinct zones. -->
    <div class="dtoolbar">
      <nav id="crumbs" class="crumbs" aria-label="נתיב"></nav>
      <div id="chips" class="chiprow"></div>
      <div class="viewtools">
        <button id="btnList" class="vtb" title="תצוגת רשימה" aria-label="תצוגת רשימה" data-ic="list-view"></button>
        <button id="btnGrid" class="vtb" title="תצוגת רשת" aria-label="תצוגת רשת" data-ic="grid-view"></button>
        <span class="vsep"></span>
        <button id="btnInfo" class="vtb" title="פרטים" aria-label="פרטים" data-ic="info"></button>
      </div>
    </div>

    <div id="dropstrip" class="dropstrip hidden">
      <span class="dz-icon" data-ic="upload"></span>
      <span class="dz-say">גרור קבצים לכל מקום במסך, או</span> <label class="dz-browse">בחר קבצים<input type="file" id="filePick2" multiple hidden></label>
      <div id="upProgress" class="up-progress hidden"><div id="upBar"></div><span id="upLabel"></span></div>
    </div>

    <div id="bulkbar" class="bulkbar hidden">
      <b id="bulkCount"></b>
      <button data-bulk="move"><span data-ic="folder-input"></span> העברה</button>
      <button data-bulk="trash"><span data-ic="trash"></span> לאשפה</button>
      <button data-bulk="restore" class="hidden"><span data-ic="restore"></span> שחזור</button>
      <button data-bulk="delete" class="hidden danger"><span data-ic="x-circle"></span> מחיקה סופית</button>
      <button data-bulk="clear" class="ghostlink">ביטול בחירה</button>
    </div>
    <!-- content + details sit side by side so opening details NARROWS the list rather than covering
         it — a pane that hides what you selected is worse than no pane -->
    <div class="contentrow">
      <div id="filesTable" class="tablewrap"><div class="empty">בחר תיקייה מהצד</div></div>
      <aside id="details" class="details hidden"></aside>
    </div>
    <footer class="statusbar" id="statusbar"></footer>
  </main>

  <aside id="preview" class="drawer hidden">
    <div class="drawer-h"><h2 id="pvName">תצוגה מקדימה</h2><button class="x" id="pvClose" data-ic="x"></button></div>
    <div class="drawer-meta" id="pvMeta"></div>
    <iframe id="pvFrame" title="preview"></iframe>
    <div class="drawer-f">
      <button class="ghost" id="pvRename"><span data-ic="pencil"></span> שינוי שם</button>
      <button class="ghost" id="pvMove"><span data-ic="folder-input"></span> העברה</button>

  <div id="overlay" class="overlay hidden"></div>
  <div id="modal" class="modal hidden">

    <div class="modal-f" id="mFoot"></div>

  <div id="dropveil" class="dropveil hidden"><div><span data-ic="upload"></span> שחרר כדי להעלות לתיקייה הנוכחית</div></div>
  <div id="ctx" class="ctx hidden"></div>
  <div id="pvfull" class="pvfull hidden"></div>
</div>
