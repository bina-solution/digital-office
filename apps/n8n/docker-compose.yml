    - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    - N8N_RUNNERS_HEARTBEAT_INTERVAL=${N8N_RUNNERS_HEARTBEAT_INTERVAL:-90}
    - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    - N8N_RUNNERS_TASK_TIMEOUT=${N8N_RUNNERS_TASK_TIMEOUT:-300}
    - N8N_RUNNERS_TASK_REQUEST_TIMEOUT=${N8N_RUNNERS_TASK_REQUEST_TIMEOUT:-300}
    - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    # EXECUTION PRUNING — NOTE THE MISSING `N8N_` PREFIX. These four were spelled
    # `N8N_EXECUTIONS_DATA_*` here since the file was written, and n8n has been IGNORING ALL FOUR:
    # @n8n/config's executions.config.js (n8n 2.17.0, read out of the running image 2026-08-09)
    # declares them as `EXECUTIONS_DATA_PRUNE`, `EXECUTIONS_DATA_MAX_AGE`,
    # `EXECUTIONS_DATA_PRUNE_MAX_COUNT`, `EXECUTIONS_DATA_SAVE_ON_PROGRESS` — unprefixed. So pruning
    # was never enabled: measured the same day, `execution_data` was 1 560 MB of a 1 634 MB database
    # with 27 332 executions and ZERO soft-deleted rows, i.e. nothing had ever been pruned.
    #
    # THE TRAP THAT MADE THIS EASY TO GET WRONG, spelled out so it is not re-introduced: n8n mixes
    # the two conventions in ONE config file. `N8N_EXECUTIONS_QUEUE_RECOVERY_BATCH` and
    # `N8N_EXECUTIONS_QUEUE_RECOVERY_INTERVAL` (set just below) genuinely ARE `N8N_`-prefixed;
    # the data-retention ones are not. Prefixing by analogy is silently accepted — an unknown env
    # var is not an error — and the only symptom is a table that never stops growing.
    - EXECUTIONS_DATA_PRUNE=true
    - EXECUTIONS_DATA_MAX_AGE=168
    # 2000 -> 20000. 2000 was never applied (see above), so this is not a loosening of a working
    # limit — it is choosing the first value that will ACTUALLY take effect. At the measured
    # ~5 900 executions/hour this fleet produces under backfill, 2000 is ~20 minutes of history:
    # it would hard-delete executions while they are still being read back through
    # `/rest/executions/<id>`, which is the fleet's primary debugging surface. 20000 is ~3.4 h at
    # that peak rate and still bounds the table, which is the point.
    - EXECUTIONS_DATA_PRUNE_MAX_COUNT=20000
    - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
    - N8N_EXECUTIONS_TIMEOUT_MAX=${N8N_EXECUTIONS_TIMEOUT_MAX:-36000}
    - NODE_FUNCTION_ALLOW_EXTERNAL=*
    - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_SENTRY_DSN=${N8N_SENTRY_DSN:-}
    - CREDENTIALS_OVERWRITE_DATA={"googleSheetsOAuth2Api":{"clientId":"${N8N_GOOGLE_OAUTH_CLIENT_ID}","clientSecret":"${N8N_GOOGLE_OAUTH_CLIENT_SECRET}"},"googleDriveOAuth2Api":{"clientId":"${N8N_GOOGLE_OAUTH_CLIENT_ID}","clientSecret":"${N8N_GOOGLE_OAUTH_CLIENT_SECRET}"},"googleSheetsTriggerOAuth2Api":{"clientId":"${N8N_GOOGLE_OAUTH_CLIENT_ID}","clientSecret":"${N8N_GOOGLE_OAUTH_CLIENT_SECRET}"},"gmailOAuth2":{"clientId":"${N8N_GMAIL_OAUTH_CLIENT_ID}","clientSecret":"${N8N_GMAIL_OAUTH_CLIENT_SECRET}"}}
    - N8N_CUSTOM_EXTENSIONS=/home/node/custom-extensions
    # See n8n-worker-1 for why these five exist. Same values on purpose: the probe compares a
    # worker against its OWN concurrency, and the log path is per-container (/tmp is not shared),
    # so worker-2 needs no distinct filename. NOT a concurrency change: still 8.
    - N8N_WORKER_CONCURRENCY=${N8N_WORKER_CONCURRENCY:-8}
    - N8N_LOG_OUTPUT=console,file
    - N8N_LOG_FILE_LOCATION=/tmp/n8n-worker.log
    - N8N_LOG_FILE_SIZE_MAX=8
    - N8N_LOG_FILE_COUNT_MAX=2
    env_file:
    - path: .env
      required: false
    volumes:
    - n8n_storage:/home/node/.n8n
    - ./blueprint/n8n:/home/node/workflows
    - ./worker-liveness.sh:/worker-liveness.sh:ro
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
    restart: unless-stopped
    labels:
      # Opt in to autoheal -- see n8n-worker-1 for the full argument. Both workers are equally
      # eligible and equally protected: eligibility is not what decides a restart, a sustained
      # `unhealthy` is, and on 2026-08-10 worker-2 was the one that was genuinely fine.
      binaos.autoheal: "true"
    healthcheck:
      # Same replacement as n8n-worker-1 -- see there for the full argument. Both workers ran
      # the same process-existence probe, so both had the same blind spot; worker-1 is simply
      # the one that wedged first.
