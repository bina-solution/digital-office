# n8n declarative blueprint — './bbox n8n push all' restores the instance from the files below.
# Fully human-readable. The OWNER account is NOT stored here — it is created from .env (N8N_OWNER_*).
schema: n8n-blueprint/v2
n8n_version: "2.17.0"
encryption_key_fingerprint: "77aee1e843d268cd"
owner:
  source: env            # N8N_OWNER_EMAIL/PASSWORD/FIRSTNAME/LASTNAME — bootstrapped by n8n-push
parts:
  workflows:
    path: ./blueprint/n8n
    format: workflow.ts     # code files (wrap.mjs render); compiled back to import JSON on push
    count: 19
  credentials:
    path: ./credentials
    format: json            # export:credentials — id/name/type readable; secret AES-encrypted
    count: 24
community_nodes:            # npm packages reinstalled on push (N8N_REINSTALL_MISSING_PACKAGES)
  []
active_workflows:           # SNAPSHOT of what was active when pulled — read by nothing
  - "[CI] Active-state webhook probe"
  - "Error Handler"
  - "GlitchTip Error Reporter"
  - "process_lock"
credential_overrides:       # local/owned creds RE-SEEDED from .env on push (n8n-push PATCHes each, re-encrypting
                            # under the CURRENT key) → fully .env-driven, survive N8N_ENCRYPTION_KEY drift.
                            # Format: <cred-id>: {"name","type","data":{field: "${ENV}" | literal}}. Preserved across pulls.
                            # Workflows reference these by id (unchanged); only the data is sourced from .env.
