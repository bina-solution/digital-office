  ## Headline metrics

  ```yaml
  note: COMPLETED counted by STATUS delta, never by ACTION_LOG stamp (only ~28% of completed rows carry one) and never by updated_at (~4,500 rows were rewritten backwards). Base progress is a POPULATION DELTA of BASE_EXTRACTION_COMPLETED, not a touch count -- a touch count cannot distinguish a row that EARNS the flag inside the window from one being re-extracted.
  session_start_to_0210Z:
    completions_per_hour:
      from: 12
      to: 85
    duplicate_actions_per_doc:
      from: 9.93
      to: 0.0
    single_value_extractions:
      from: 47
      to: 5
      target: 0
    false_max_iterations:
      from: 45
      to: 0
    action_router_p99:
      from: 605s
      to: ~40s
    per_type_extraction:
      from: 602s
      to: 2-4s
    error_rate:
      from: 279/hr
      to: 0.15% between import windows
    net_queue:
