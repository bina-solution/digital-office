  ## Traps that cost time tonight

  - ACTION_LOG tokens are HUMAN DISPLAY NAMES ('Extract Base Doc', 'STATUS COMPLETED', 'mark_max_iterations'), not action slugs. Two queries keyed on lowercase slugs returned 0 rows, which reads exactly like 'nothing is happening'.
  - In psql, (x = y)::text yields 'true'/'false', NOT 't'/'f'. A bash loop comparing to "t" never matched and deactivated a live router six times -- 221 errors, 191 failed dispatches.
  - Reconstructing a gate condition from null columns is NOT evidence of what the machine does. A gate-firing table built that way wrongly blamed BALANCE_SHEET for single-value extraction; Decide BS Action never applies that gate.
  - Get Changed Docs contains THREE `not in (...)` lists. A regex testing all of them reported MAX_ITERATIONS 'still excluded' twice when only the duplicate-detector's copy matched. Check WHICH occurrence.
  - .generated/compose.runtime.yml is a stale Jul 28 artifact. The stack composes from .generated/compose.yml, a 26-line include: file that pulls platform-base/*/docker-compose.yml directly -- so editing the source IS editing what deploys. Reading the stale file produced a wrong conclusion that settings had never been deployed.
  - n8n import:workflow sets active=false AND activeVersionId=NULL. Checking only active=true after re-activating is a FALSE PASS -- activeVersionId can still point at the old version. Verify activeVersionId = versionId AND grep the live nodes for the change.
  - Executions sitting in status='running' for hours are orphan DB rows, not held slots. Verify against bull:jobs:active before concluding capacity is lost.
  - A webhook execution's startedAt is JOB CREATION time, so stoppedAt-startedAt includes Bull queue wait. With ~2,000 jobs waiting this inflates every duration and makes queue wait look like slot occupancy.
