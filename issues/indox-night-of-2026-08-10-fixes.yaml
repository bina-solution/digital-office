  method: Ran the LIVE Decide DOC BASE Action code against four constructed documents. n8n execute could not be used -- it binds task-broker port 5679, already held by the live instance.
  results:
  - 60 DUPLICATE triples, IN_PROGRESS  -> __route_gdoc__           (not maxed)      PASS
  - 60 DISTINCT triples, IN_PROGRESS   -> mark_max_iterations      (ceiling intact) PASS
