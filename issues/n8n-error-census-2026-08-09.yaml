- text: 'GROUP 4 (12) — gmail-link: needs_review instead of a throw — id: 4 · proof: The 5-error plurality was a deliberate `Stop and Error: Not PDF`. Replaced live with a `Not A PDF (needs review)` code node feeding the workflow''s normal terminal (`Prepare Output`), emitting `{success:false, error:''not_a_pdf'', needs_review:true, mimeType, fileName}` — the mail carried a link, the link resolved, and what came back is not a document; retrying cannot change that. Repo and live were diffed first and were identical (32 nodes, same params, same connections), so the owner''s UI edits were confirmed intact and were built on, not reverted. The LINK fabrication in `Upsert Incoming Document` was fixed in the same deploy (see the top section) — that is the source of G1''s 15. Still open in this workflow: the 5 connection_id failures (task 10), the 1 d:upload no-binary (task 8), the 1 ExpressionError (task 12).'
