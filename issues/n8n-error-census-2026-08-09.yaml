- text: 'NEW — connection identity leaks across app boundaries (11 errors) — id: 10 · next: One defect, two shapes, spread across G3 and G4 and closely related to G1''s root cause. (a) 6x `http:addLabels` -> 400 `unsupported protocol ''drive_google_service_account''`: a DRIVE connection id passed to a MAIL op. (b) 5x mail ops called with connection_id EMPTY, refused by mailapi''s `_explicit_connection_required`. Both are the same underlying thing as the local-id-to-Google-connection bug: a connection/engine identity travelling somewhere it does not belong. Worth one pass that finds where connection ids are chosen and threaded, rather than five spot fixes.'
  done: false
- text: 'NEW — queue stalled-job exhaustion (the only errors since the fixes went live) — id: 11 · next: In the 70 minutes and 8,090 executions after the census window, the only 3 errors were "This execution failed to be processed too many times and will no longer retry" on Incoming Documents v2 / indox api - supabase / Sync v3 Reconcile, all at 22:08:07 — Bull''s stalled-job retry limit, not any of G1-G7. Same family as G7 (worker saturation) and almost certainly the completion-throughput lane''s concurrency change. Flagged for that lane; not touched here, since worker concurrency is theirs.'
  done: false
- text: 'NEW — ExpressionError at gmail-link `Upsert Incoming Document` (1 error) — id: 12 · next: The single error the census attributed all 12 of G4 to. `Invalid expression`, value undefined. The node reads six `$(''...'').item.json.*` paths that each assume an upstream node produced an item; one did not. Low volume, but it is the guard the census asked for.'
