- text: |-
    GROUP 6 (6) — uq_incdoc_hash collision: needs INSERT ... ON CONFLICT at the write path — id: 6 · decision: STILL NOT LANDED — but now for a MEASURED reason, not caution. Do not land the statement printed in the original `next:` below: it is verified WRONG. See verified_2026-08-10. · verified_2026-08-10: A dedicated lane took this on, reproduced everything on real data in a scratch clone of public.incoming_documents (`create table ... (like ... including all)`, so the real partial unique index came with it), seeded with 180 REAL rows, every case run in a transaction and rolled back. Findings, in order of importance:
    (1) THE PRESCRIBED STATEMENT SILENTLY WRITES TO THE WRONG DOCUMENT. Its `coalesce` resolves the HASH twin FIRST and the caller's "ID" only as a fallback. That inverts the precedence of `Resolve IDs` directly upstream, which does the opposite — an existing caller ID wins, and only then does it try a logical match. PROVED: caller names R2 (10316097696htaw) while carrying R1's hash; the prescribed statement wrote 'CALLER MEANT R2' into R1 (1023348463y1cx5) and left R2 untouched. Today that case raises a visible uq_incdoc_hash error. Trading a loud error for a silent wrong-row write, on the single write path of an 18k-document client corpus, is strictly worse than the bug it fixes.
    (2) IT HARD-ERRORS ON HASH='unknown'. The prose says to reuse the index predicate verbatim, but the statement omits `lower(...) <> 'unknown'` and guards only the PARAM, not the column. Rows with HASH='unknown' are outside the partial index so many may exist; the scalar subquery then raises `more than one row returned by a subquery used as an expression` — a hard failure on the single write path. PROVED with two 'unknown' rows present. It does not fire today only because the table currently holds 0 such rows (13,383 indexed + 660 NULL, 0 empty, 0 'unknown', 0 duplicate hashes) — that is data luck, not correctness.
    (3) IT DROPS `RETURNING *`. n8n's upsert node generates `... ON CONFLICT ("ID") DO UPDATE SET ... RETURNING *` (helpers/utils.js addReturning, default outputColumns=['*']), and `PG Upsert` is a TERMINAL node — its output IS what indoxApiSupabase01 returns to every caller of the UPSERT action. Dropping RETURNING would empty that contract fleet-wide.
    (4) NOT a defect, tested and cleared: `INSERT ... SELECT` with stringified params into the six non-text columns (ITERATION_COUNT/RETRY_COUNT int, priority_sync bool, created_at/ updated_at/NEXT_RETRY_AT timestamptz) coerces correctly.
    THE CORRECTED STATEMENT (verified on real rows; keep VALUES form, keep RETURNING, preserve Resolve IDs' precedence, reuse the index predicate on BOTH sides, LIMIT 1 for robustness):
      insert into public.incoming_documents ("ID", <cols>)
      values (
        coalesce(
          (select d."ID" from public.incoming_documents d where d."ID" = $id),
          (select d."ID" from public.incoming_documents d
             where d."HASH" = $hash and $hash <> '' and lower($hash) <> 'unknown' limit 1),
          $id),
        <vals>)
      on conflict ("ID") do update set <col> = excluded.<col>, ...
      returning *
    Cases proved: A brand-new ID + brand-new HASH -> INSERT (180->181 rows); B existing ID -> UPDATE in place (180->180); C brand-new ID + EXISTING HASH (the actual defect) -> UPDATES the twin, row count unchanged, zero ghost rows, where today's statement raises; D wrong-row case -> still errors exactly as today, no silent misdirect; E HASH='unknown' -> resolves cleanly where the prescribed statement dies; F item with no HASH key -> INSERT. The residual race (two truly-simultaneous brand-new hashes) is still closed only by retry — `PG Upsert` already carries retryOnFail=true/maxTries=4/waitBetweenTries=3000, and with the resolution INSIDE the statement the loser's retry succeeds instead of repeating the failure.
    WHY IT IS STILL NOT LANDED — the benefit measured out to ~zero:
      * The "6 errors across 6 workflows" are not 6 defects. They are ONE document failing TWO
        write attempts, recorded once per workflow up two sub-workflow call chains
        (559287 indoxV2Driver01 <- 559288 indoxV2ActionsShip01; 559294 indoxV2Upsert01 <-
        559295 indoxDocBatchUpsert01 <- 559296 indoxApiRouter01 <- 559297 indoxApiSupabase01).
      * Both collided on the SAME hash, 456d9e7e5ea944d2cc472954eb5d21cd. That row exists today:
        doc_msm0vrh6vaud1v, "סימנט אי.אס.-13003", SHIPMENT, STATUS=COMPLETED, updated_at
        20:56:33.504 — ONE SECOND BEFORE the first failure at 20:56:34.429. The concurrent writer
        won and the document was never lost; the failures cost a redundant UPDATE, not content.
      * ZERO recurrences since: the only uq_incdoc_hash errors in the whole table of executions
        are those 6, all inside the 20:00 hour. The following three hours ran ~20,000 executions
        with 30 errors, none of them this one.
      Replacing the single write path (a new Build code node generating per-item dynamic column
      sets over 105 columns incl. a Hebrew-named one, plus an executeQuery node) to recover one
      redundant update, while 4,347 documents sit queued in TO_EXTRACT, is the wrong trade. The
      SQL is proven; the generator that would emit it per-item would be new unproven code on the
      hot path. Land it when the backfill is idle, with the corrected statement above.
    Rollback artifact if someone does land it: the pre-change published export was taken at 2026-08-09 (versionId 18d1f8c2-01aa-4bb8-ba8d-f0a73ec53f31, active=t, versionId == activeVersionId); re-import + re-publish is restart-free.
     · next: SUPERSEDED — the statement below is the ORIGINAL, UNVERIFIED prescription. It is retained only so the correction above has something to point at. DO NOT PASTE IT INTO A WORKFLOW.
      with resolved as (
        select coalesce((select "ID" from public.incoming_documents
                         where "HASH" = $hash and $hash is not null and $hash <> ''), $id) as id)
      insert into public.incoming_documents ("ID", <cols>)
      select resolved.id, <vals> from resolved
      on conflict ("ID") do update set <col> = excluded.<col>, ...
  done: false
