summary: Every n8n error in a 3-hour window, decoded from the compacted execution_data format. 82 errors, 0 crashes. The first pass grouped them by WORKFLOW and inferred one cause per group; decoding each execution INDIVIDUALLY showed that three of the seven groups are several unrelated defects wearing one name, and that two of the stated causes were wrong. Corrected findings, the fixes, and the proofs are below. Recorded because the owner's standard is "never just restart and assume fixed; dig into the cause and the pattern".
description: |
  As first recorded — category: reliability

  METHOD. n8n stores execution_data as a flat array where a purely-numeric string is an INDEX
  into that same array; a naive read returns "8" instead of a message. Everything below was
  recovered with a recursive dereferencer with cycle and depth guards (tmp/decomp2.py — the
  earlier scratchpad/decomp.py is gone; decomp2.py is a working replacement, and unlike the
  first pass it was run over EVERY failing execution, not a sample).

  WHAT THE PER-EXECUTION DECODE CHANGED
  Three groups were composites, and the biggest single cause in the census was never named:

  ── THE LINK-FABRICATION DEFECT (21 of the 82, spread across 2 "groups") ──────────────
  `'https://drive.google.com/file/d/' + <id>` was applied to whatever id an upload returned,
  including the LOCAL drive engine's `lf<hex>` ids. That is a well-formed Google URL for a file
  that is not on Google. It was stored as the row's LINK, and every later consumer routed on the
  HOSTNAME, so the download went to the Google service account, which correctly 404'd.
    * 15 of G1's 24 are this, with `connection_id=drive_google_service_account-ea660043` and a
      fileId of `https://drive.google.com/file/d/lf19fd702b2ed1d16ff3074` (etc.). Only 12
      DISTINCT ids produced the 24 errors — `lf19fd19b797efa776a9a21` was re-attempted 5 times
      in a row, because a 404 was raised as an exception and an exception means retry.
    * The fabrication sites: indoxGmailLinkDownloader01 `Upsert Incoming Document`.LINK,
      indoxGmailDocDownloader01, and apps/indox/app/incoming_documents/api/__init__.py:4049
      (`/documents/upload`, which uploads through the LOCAL engine).
    * syncV3Deliver0001 had already deleted its own copy of this fallback and written down why
      ("A wrong link is worse than an absent one: absent prompts a question, wrong gets
      clicked"), and api/__init__.py `_resolve_open_url` documents the same mistake as fixed.
      These were the copies neither reached.

  ── GROUP 1 — drive api, 24 errors, 19:57-20:58. THREE causes, not one. ───────────────
    * 15 — the link fabrication above (local id -> Google connection). NOT "a file the client
      moved or trashed": these files were never on Google.
    *  5 — one genuinely unresolvable Google id, `1lCGj_Z-InBSM5OGuxVmXxvBs9hjvdArH`, retried
      five times. This one IS the vanished-source case the first pass described.
    *  4 — not `d:download` at all. `d:upload` at 19:57, "This operation expects the node's
      input data to contain a binary file 'data', but none was found" (profile_id=admin,
      folderId=ld19fd16971a5e326590441). Unrelated defect, still open (task 8).

  ── GROUP 2 — invoice Extractor - Gemini, 18 errors, 20:52-21:06. NOT quota, NOT auth. ─
    Both hypotheses were wrong. The raw upstream envelopes are:
      404 `{"code":404,"message":"Requested entity was not found.","status":"NOT_FOUND"}`  (x3)
      400 `{"code":400,"message":"Request contains an invalid argument.","status":"INVALID_ARGUMENT"}` (x15)
    No RESOURCE_EXHAUSTED, no UNAUTHENTICATED, no PERMISSION_DENIED, no retryDelay, no quota
    metadata anywhere in the 18 payloads. The cause is the INPUT: six stub fixtures with forged
    extensions — a 0-byte `unknown-unknown.jpg` and 32-39 byte "PDFs" whose entire content is one
    line of ASCII (`sv3f mixed mail attachment 99464`) — each retried 3x = 18. The 0-byte JPEG
    yields a File resource that never materialises, hence NOT_FOUND rather than INVALID_ARGUMENT.
    Counter-proof that the credential and quota are fine: 507 SUCCESSES on the same node, model
    (`models/gemini-3.1-pro-preview`) and credential in the same window, including a 9.21 MB scan.
    The credential `ai-studio-bs-extraction [env-managed]` (6mfcsdRaqQ4IdQ8Y) is healthy;
    GEMINI_API_KEY is set in .env (len 39) and deliberately absent from the container env — it
    lives only in the encrypted credential row, reseeded by platform-base/n8n/hooks/push.
    Fixture provenance: sv3Inject3x001 / syncV3FullTest01 / mailOrgTest00001 + a manual
    sa-fix-test-invoice.pdf. Synthetic seeds reaching the live extractor (task 9).

  ── GROUP 3 — mail api, 14 errors, 19:34-21:01. Also three causes. ────────────────────
    Only 3 of the 14 are the HTML-500 the group was named for:
    * 3 — `http:get` on `/message/0?id=...&connection_id=mail_imap_app_password-51185288`,
      HTTP 500 with a 265-byte Flask HTML page. Real cause, from the mailapi tracebacks:
        LookupError: unknown encoding: iso-8859-8-i   (apps/mail/mailapi/app.py:938 and :940)
      `iso-8859-8-i` is a valid IANA charset (Hebrew, implicit bidi) that Python's codec registry
      has no alias for. The `"replace"` errors-arg does not save it: LookupError comes from the
      CODEC LOOKUP, before any byte is decoded. Hebrew senders emit it, so this fires on real
      client mail. It surfaced as HTML because service.py registered only AdapterError and
      ProfileError handlers — no generic one — so everything else fell through to Flask's stock
      page. Exactly the class the mailview half was fixed for today; this was the other half.
    * 6 — `http:addLabels`, 400, `unsupported protocol 'drive_google_service_account'`.
    * 5 — `http:search`/`http:get`, 400, mailapi's explicit `connection_id` refusal, with the
      value rendered EMPTY.
    The last two are one defect with G4's connection failures: identity leaking across app
    boundaries — a DRIVE connection id handed to a MAIL op, and mail ops called with none at
    all (task 10).

  ── GROUP 4 — Gmail Link Downloader, 12 errors, 19:34-19:58. FIVE causes. ─────────────
    The stated cause (ExpressionError, invalid expression, undefined) is exactly ONE of the 12.
    *  5 — `Stop and Error: Not PDF`, errorMessage `error_not_pdf`. A DELIBERATE stopAndError on
      a non-PDF download: the workflow was throwing on purpose. Largest cause in the group.
    *  5 — mail ops with no `connection_id` (3 `http:get`, 2 `http:search`) — see G3.
    *  1 — `d:upload` with no binary (same as G1's four).
    *  1 — ExpressionError at `Upsert Incoming Document`.
    The owner's hand-edits (Edit Fields, Get a message, Code in JavaScript1) were verified
    present and byte-identical in repo and live before editing, and are untouched.

  ── GROUP 5 — apitools 429, 6 errors, 21:09-21:10. As described. ─────────────────────
    `server_busy` on `Document OCR2`; the bulkhead is by design, killing the document is not.
    3 errors on Upload Doc To API TOOLS + 3 on its caller Base Document Extraction, all inside
    47 seconds. n8n silently clamps waitBetweenTries to 5s and maxTries to 5 in
    workflow-execute.js, so the node's configured 15000ms backoff has never once been honoured.

  ── GROUP 6 — uq_incdoc_hash, 6 errors across 6 workflows at 20:56:34-37. NOT YET FIXED. ─
    Diagnosis confirmed and sharpened. The DELIVER write path is ALREADY safe —
    indoxApiSupabase01 `Build Deliver` emits `insert ... on conflict ("HASH") where <partial-index
    predicate> do nothing`. The failure is on the OTHER write path: `PG Upsert`, an n8n Postgres
    node with operation=upsert and matchingColumns=["ID"], which generates
    `on conflict ("ID")` — so a collision on the SECOND unique index, uq_incdoc_hash, is not a
    conflict target and hard-errors. `Resolve IDs` does dedup by HASH, but against `Load Match
    Index`, a SNAPSHOT read before the write; the six failures landed in one second, inside the
    snapshot's staleness window. See task 6 for the exact fix.

  ── GROUP 7 — task-runner 300s timeout, 1 error, 20:03. Watch. ───────────────────────
    Not reproducing at the load it was recorded at. See task 11 for what appeared instead.

