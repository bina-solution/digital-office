  ```

  ## Deployed

  ```yaml
  method: |
    Surgical, per the owner's constraint that the continuous client backfill stays up: docker cp <file> n8n-shlomo-laptop:/tmp/stage/ ; n8n import:workflow --separate --input=/tmp/stage ; then `update workflow_entity set active=true, "activeVersionId"="versionId"` (import lands as a DRAFT in n8n 2.x and does nothing without it). Every workflow was EXPORTED LIVE FIRST and the patch applied to that export, never to the repo copy, so no other lane's or the owner's UI edits were reverted; the same patch was applied to the repo blueprint separately. n8n was never restarted.
  verified:
  - n8n-shlomo-laptop / worker-1 / worker-2 RestartCount=0, still running, after both batches
  - all four workflows active=t and versionId=activeVersionId (published, not draft)
  - 8,090 executions completed after the census window with 3 errors, none of them G1-G6
  ```

  ## Open after this pass

  ```yaml
  live_now: G1, G2, G4 (the not-PDF plurality + the LINK fabrication), G5 — 4 workflows, published, n8n never restarted. G3 (mailapi charset + JSON errorhandler) went live 2026-08-10 via a --no-deps single-container rebuild; see task 3.
  repo_only: the /documents/upload LINK fabrication (indox api), indoxGmailDocDownloader01 — still need an image rebuild
  untouched: G6 (write path — NOT landed, and the prescribed statement is verified WRONG; see task 6), G7, and tasks 8-12
  new_finding_for_another_lane: |
    COMPLETION HAS FLATLINED, and it is not G6. Rows are still being INGESTED (315-828 created per hour through 23:00) but public.incoming_documents COMPLETED has not moved from 6,243 for over two hours: COMPLETED-by-updated_at goes 14:00 -> 4,606, 15:00 -> 349, 16:00 -> 132, 17:00 -> 36, 18:00 -> 71, 19:00 -> 56, 20:00 -> 109, 21:00 -> 56, then NOTHING in 22:00 or 23:00, while TO_EXTRACT climbed 4,308 -> 4,472 in the same window. Executions are still succeeding in volume (~20k in three hours, 30 errors), so this is documents entering and not finishing, not the pipeline being down. Almost certainly the same family as task 11 (Bull stalled-job exhaustion) and the completion-throughput lane's concurrency change. Belongs to that lane — worker concurrency is theirs — but it is the biggest thing visible in the data right now, and it is why "a rising COMPLETED count" could not be used as the acceptance signal for any change tonight.
  ```
tasks:
- text: 'GROUP 1 (24) — drive d:download on unresolvable ids — id: 1 · proof: TWO fixes, both live. (a) indoxV2ExtractInvoiceGemini01 `Download LINK` now routes on the ID SHAPE, not the hostname: `^l[fd][0-9a-f]{8,}$` means the local engine, so a poisoned `drive.google.com/file/d/lf19fd...` LINK goes to profile_id=admin instead of the Google service account. This repairs rows that ALREADY carry the bad LINK, which a source-side fix alone cannot. (b) driveApi01 `d:download` is now onError=continueErrorOutput into a `Download Miss` code node: a 404 (or the local adapter''s Hebrew "הקובץ אינו קיים") becomes `{ok:false, error:''source_gone'', needs_review:true, http_status}` and flows to `Done`, so the execution succeeds and stops being retried; a 5xx, a timeout or an auth refusal is RE-THROWN untouched, because those are transient and the caller''s retry is correct for them. Callers already gate on `If Binary`/`If No Binary` and have their own FILE_NOT_FOUND branch, so a binary-less result is the shape they were already written for. Proved by replaying all 12 distinct recovered fileIds and 5 error envelopes through the deployed expressions inside n8n''s own node runtime: the 15 local ids route LOCAL, the real Google ids route GOOGLE, 404-and-Hebrew-404 classify as source_gone, 503/401/ETIMEDOUT re-throw.'
  done: true
- text: 'GROUP 2 (18) — Gemini Document Processor: recover the RAW upstream error before fixing — id: 2 · proof: Raw envelopes recovered (400 INVALID_ARGUMENT x15, 404 NOT_FOUND x3) and correlated 1:1 against binary metadata: 6 documents of 0-39 bytes. The 32-byte "PDF" for exec 563517 was read off disk — its entire content is the ASCII line `sv3f mixed mail attachment 99464`. Neither quota nor auth: 507 successes on the same credential and model in the same window. Fix live: a `Check Doc Bytes` -> `Doc Bytes OK?` pre-flight in front of `Document Processor` refuses anything under 1 KB (parsing n8n''s formatted fileSize, and failing OPEN on an unparseable one so a format change can never block a real document), routing to `Report Unusable Document` which emits `{success:false, error:''unusable_document'', needs_review:true, bytes, details}` — deliberately NOT the existing ''LLM Faild'', because the LLM was not called and blaming it sends the next reader to the wrong place. `Document Processor` also gained onError=continueErrorOutput into the existing `Response Format: No LLM Output`, so an unforeseen bad document cannot take a run down. Proved against the real recovered fileSizes: 0 B / 32 B / 35 B / 39 B all REFUSE, the 9.21 MB scan that succeeded still CALLS, an unparseable size still CALLS.'
  done: true
- text: |-
    GROUP 3 (14) — mail api http:get receiving an HTML 500: surface the real status/body — id: 3 · deployed_2026-08-10: LIVE. Rebuilt with `docker compose -f .generated/compose.yml -f .generated/routing.override.yml -f .generated/connections.override.yml --project-directory . up -d --build --no-deps mailapi`. NOT `bbox run mailapi`: reading bbox first showed `run` also does `ensure_perf_profile`, `run_app_hooks prepare` for EVERY app, `ensure_converged` (POSTs the control-plane `/api/reconcile`, the path that pushes n8n blueprints from the repo and has clobbered the owner's UI edits twice today) and `run_app_hooks onboard` — and `reconcile.py services --for mail` resolves the mail closure to include n8n, both workers, the task-runners, postgres and redis. With ~18k documents mid-backfill and a hard "never restart n8n", `--no-deps` on the one service is the only correct path. Compose recreated mailapi ONLY. PROOFS. (a) Pre-deploy, inside the running container, the OLD expression raised the real defect: `LookupError: unknown encoding: iso-8859-8-i`. (b) Post-deploy the live module has the fix — `import app; app.decode_part` resolves, 4 call sites in /app/app.py and 4 in /app/local_app.py. (c) Variant coverage: `iso-8859-8-i`, `-e`, uppercase `ISO-8859-8-I` and plain `iso-8859-8` all decode to the right Hebrew; bogus/empty charsets fall back to utf-8 with NO raise (mojibake, by design). (d) END-TO-END through the route that used to 500: a real message declaring `charset="iso-8859-8-i"` with iso-8859-8 octets was APPENDed to the LOCAL TEST mailbox (mail_imap_local-10ebefad, indox@local.test — the client's Gmail was never written to) and fetched back with `GET /message/108`: HTTP 200, subject `בדיקת קידוד`, body_text `שלום, מצורפת חשבונית לתשלום.` — correct, no 500, no HTML page. (e) service.py now registers handlers for AdapterError, ProfileError AND Exception. HEALTH AFTER: container healthy, RestartCount=0; /healthz 200, /readyz 200 (ready:true), /connections 200 (6 connections, active mail_imap_app_password-51185288), /stats 200; live pipeline traffic (POST /search, GET /organizer/settings from n8n) serving 200s. N8N UNTOUCHED, verified by before/after snapshot: n8n, worker-1, worker-2, task-runners, n8n-postgres, supabase-db and redis all have IDENTICAL StartedAt and RestartCount=0, and every workflow_entity row has the same versionId/activeVersionId/updatedAt as before the rebuild. Also shipped in the same image (pre-existing uncommitted work, verified complete and safe, not this lane's): the mailapi Dockerfile's JSON --access-logformat (already identical to what the running container had, so a no-op) and fixtures/tag_rules.json (SAFE: organizer_seed.py is create-only — `/data/organizer-defaults.json` already exists on the persistent volume with the new hyphenated Hebrew names, so no re-seed and no change to the client's live label rules). Owner-protected gunicorn worker count and IMAP pool sizing were not touched. SECOND REBUILD, same command, 23:56Z: the `label:` lane finished after the first one, so the image was rebuilt again to carry both fixes. Pre-flight before it: `decode_part` in the tree was diffed against the RUNNING container's copy and was byte-identical (22 lines), call sites 5/5 in app.py and 4/4 in local_app.py, and service.py was byte-identical to the deployed file — confirming that lane's "did not touch service.py or decode_part" claim rather than trusting it; all 15 modules compiled; their test_label_vocabulary.py passed 10/10. After it: charset end-to-end re-run and still PASS (GET /message/109 -> 200, correct Hebrew subject and body), /healthz /readyz /connections /stats all 200, container healthy, RestartCount=0, both lanes' symbols present in /app/app.py, gunicorn still `-w 1 --threads 12`. n8n, both workers, task-runners, n8n-postgres, supabase-db and redis again byte-identical StartedAt and RestartCount=0 across BOTH rebuilds.
     · proof: Root-caused to `LookupError: unknown encoding: iso-8859-8-i` at apps/mail/mailapi/app.py:938 and :940 (3 tracebacks in the container log, one per 500). FIXED IN THE REPO, NOT YET LIVE: (a) a new `decode_part()` helper normalises the IANA-only `-i`/`-e` bidi suffixes to the real codec and falls back to utf-8 rather than raising, applied to all EIGHT decode sites across app.py and local_app.py; (b) a generic `@app.errorhandler(Exception)` in service.py returns JSON naming the exception type and path (HTTPException keeps its own status), so the next unforeseen failure is legible from the caller instead of needing a log dive. All three files compile. DEPLOY STEP OUTSTANDING: `docker cp` into `mailapi-shlomo-laptop: /app/` was refused by this environment's permission classifier (n8n's /tmp/stage is allowed; overwriting a running container's application source is not). Needs either an approved `docker cp apps/mail/mailapi/{app,local_app,service}.py mailapi-shlomo-laptop:/app/` followed by a mailapi restart, or a normal image rebuild. Rollback copies of the three live files are in tmp/g3_live/.
