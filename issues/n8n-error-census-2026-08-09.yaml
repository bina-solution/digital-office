- text: 'GROUP 5 (6) — apitools 429 must not kill a document — id: 5 · proof: `Document OCR2` is now onError=continueErrorOutput into an `OCR Shed` node that recognises 429 / server_busy / "too many requests" and degrades through this workflow''s OWN existing convention — an item carrying `error`, which the `Return` node already turns into ok:false — marked retryable:true and needs_review:false, because nothing is wrong with the document and the next sweep should pick it up unchanged. Anything that is NOT a shed is re-thrown. waitBetweenTries corrected 15000 -> 5000 and maxTries left at 5: those are the values n8n actually enforces after its silent clamp, so the node''s configuration now states what it really does instead of implying a 15s backoff that has never run. The apitools bulkhead itself is untouched — it is behaving as designed.'
