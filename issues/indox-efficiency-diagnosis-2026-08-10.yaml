  ## Do not do

  ```yaml
  - item: raise N8N_WORKER_CONCURRENCY above 8
    why: Documented OOM history, and the host has 189 MiB free with 4,379 MiB of swap in use and container limits already over-committed 3.1x. The queue latency that makes this tempting is caused by ~590 hung executions holding slots (P5), not by too few slots.
  - item: raise n8n-postgres memory to fix the execution_data churn
    why: the churn is 2.3 GB/hour of transient data; P1/P2/P10 remove the volume rather than buffering it
  - item: repair the hourly GET_ALL sweep as-is
    why: It is O(N) with a hard 20,000 cap and is already at 83.4% of it. Repairing it buys a few weeks and then fails permanently. Replace it with a bounded, resumable cursor sweep — or delete it once P2 removes the need for a whole-corpus re-drive. Note it is also a re-delivery path in its own right (journey.re_delivery_paths path 5).
  - item: tune the pickup query before fixing the driver
    why: The pickup costs 364 ms twelve times an hour = 4.4 s/hour. The driver's per-action respawn costs orders of magnitude more. Fix P2 first, then re-measure the pickup — most of its load is a symptom of the working set being re-delivered, not a cause.
  ```

