      own_duration: avg 21.6 s, p50 15.0 s, p90 47.2 s, max 333.6 s, total 72,293 s
      queue_latency: avg 40.44 s, p90 126.06 s, max 397.78 s
      avg_nodes: 25.0, wall accounted by node times 97.2%
