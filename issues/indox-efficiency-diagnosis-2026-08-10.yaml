# yaml-language-server: $schema=./schema.json
title: INDOX efficiency diagnosis — the complete journey of one document, the measured time and resource budget of every stage, the complexity that makes it worse as the corpus grows, and the ranked plan for the smoothest fastest possible run
opened: '2026-08-10'
category: performance
severity: critical
status: open
summary: 'The pipeline spends 292 n8n executions and ~1.7 hours of amortized wall time to finish ONE document, against a floor of 41-51. It is currently creating ~29,000 executions/hour and completing 20 documents/hour — roughly 1,450 executions per completed document. Two mechanisms account for almost all of it, and both are now pinned to a specific node. (1) THE REPEAT: indoxV2Driver01''s node `If2` tests `$execution.mode != ''test''`, which is unconditionally true in production, so every action a document receives spawns a brand-new full driver execution for the same document — the "continue in the same execution" branch that would prevent it exists, is already wired, and is reachable only in test mode. A second self-call runs in parallel; measured driver executions are exactly 2.0x the per-pass baseline. The only bound is max_actions_per_doc = 50, and the measured 22-32 passes sit comfortably inside it. (2) THE COST OF EACH REPEAT: the AI leg of base extraction is 82.9% of the most expensive workflow''s node time, and 65% of that is queue wait rather than model time; it is the sole source of a field in 3.7% of runs, and in 56.8% of runs it returns nothing at all while the local extractor — which costs 694 ms — supplies every field. The two compound: the system runs a 160-second AI call ~6 times per document to re-derive an answer it already had in under a second. Behind them: supabase-db, which holds every document, the OCR cache and the company registry, is still pinned at 1.0 CPU / 1 GiB with stock 128 MB shared_buffers against a 225 MB hot working set — the same ceiling that was just fixed on n8n-postgres one layer over; and the @registry_ids binding is rebuilt from the companies table on every read, including a node that spends 190 ms constructing a 2,378-element registry and md5-ing 187 KB of JSON in order to return an 8-character string, twice per document per pass. That registry term is the one that scales with the CLIENT rather than the corpus.'
description: |
  ## Method

  ```yaml
  windows:
    n8n_execution_history: execution_entity retains 2026-08-10T07:21:09Z -> 16:50:18Z (9h29m, 33,531 rows) at the time of the census. Older executions are pruned, so every "24h" filter below is in practice this 9.5-hour window. Stated explicitly wherever it matters.
    supabase_pg_stat_statements: stats_reset 2026-08-09T09:03:32Z, read at 2026-08-10T17:13:48Z = 1 day 08:10:16. All supabase-side query totals are over that 32.2-hour window.
    n8n_pg_stat_statements: stats_reset 2026-08-10T16:42:02Z, read at ~17:05Z = ~23 minutes. Short window; used only for rates, and my own diagnostic queries are excluded by name.
    container_stats: two `docker stats --no-stream` samples at ~16:55Z and ~17:14Z.
  principals:
    n8n_db: psql -U hacohen -d n8n inside n8n-postgres-shlomo-laptop
    doc_db: psql -U postgres -d postgres inside supabase-db-shlomo-laptop — the SAME role the pipeline uses (credential `INDOX Supabase Postgres`), per the state-machine map's principal proof. Not supabase_admin, not the PostgREST `authenticator` role.
  attribution_technique:
    what: 'n8n''s execution_data.data is COMPACTED — a flat array in which purely-numeric strings are indices into that same array. Numbers, however, are stored INLINE. Two consequences exploited here, both safe without a dereferencer:'
    doc_attribution: 'Document IDs appear as literal strings in the blob, so `data LIKE ''%doc_xxx%''` finds every execution that touched a document. Batch executions mention many documents, so raw counts overstate. Every per-document figure below is therefore AMORTIZED: sum(1/ndocs) where ndocs is the count of distinct doc_ ids in that execution. Both the raw and amortized numbers are given.'
    node_timing: '`"executionTime":<ms>` is an inline number, so per-node timings are extractable with `regexp_matches(data,''"executionTime":([0-9]+)'',''g'')` with no dereferencing. Validated against a hand-read execution (898157): the extracted node times sum to 67,222 ms against a 67.2 s wall time, and across 1,587 executions the node times account for 99.6% of wall — i.e. the extraction is complete, not a sample.'
  not_used:
  - '`updated_at` is NOT used as a progress signal anywhere in this document (~4,500 rows were rewritten backwards). Where it appears it is only as "rows touched in the last hour", which is a set-membership question, not an ordering one.'
  - Inclusive wall time is never presented as if it were additive. Parent executions in n8n include their children's time; the double counting is called out at every point where it would otherwise mislead.
  caveat_deploy: READ-ONLY investigation. No workflow, container, DB row or config was changed. Other lanes were importing workflows and rebuilding containers during the window; two containers restarted mid-measurement (n8n-postgres at ~16:43Z, drive at ~16:36Z), which is why some rates differ between the early and late samples. Both are reported.
  ```

  ## Journey

  ```yaml
  specimen:
    id: doc_msm3oxeu136v4c
    type: INVOICE
    company_id: '510616956'
    api_tools_id: 65d738344a99bd515375114fe21d1cba
    created_at: '2026-08-09T17:52:53Z'
    completed_at: '2026-08-10T16:54:30Z'
    elapsed: 23 hours 2 minutes
    why_this_one: Picked because it reached STATUS='COMPLETED' inside the retained execution window, so its late life is fully reconstructable. Its BASE extraction happened on 08-09 (execution 682582, visible in ACTION_LOG) and is therefore OUTSIDE the window — that gap is accounted for explicitly in the fan-out arithmetic below.
  hops_note: Ordered as the document actually travels. Workflow ids are n8n workflowIds; the executing definition is workflow_history.nodes at workflow_entity.activeVersionId, read live today — NOTE that two of the versionIds carried in the brief and in issues/state-machine-map-2026-08-10.yaml are STALE (see corrections_to_prior_claims). Node-level detail for BaseDocEx01 is read from execution 898157 directly.
  hops:
  - hop: 0
    name: INGEST
    workflow: syncV3Deliver0001 ("Sync v3 Deliver") / gmailApiImap01 / indoxGmail*Downloader01
    does: Discovers the file, writes the incoming_documents row with STATUS='IN_PROGRESS' (or 'TO_EXTRACT' via status_override) and a LINK. Measured 320 successful executions, p50 62.4 s, 30,184 s total (2.88% of pipeline wall).
    writes: 1 row upsert per document
  - hop: 1
    name: PICKUP (the 5-minute poll)
    workflow: indoxApiSupabase01
    live_version: ece2eaf4-bd40-486c-953a-e43abf6ec802
    trigger: '"Poll Line Changes" — scheduleTrigger, {"rule":{"interval":[{"field":"minutes","minutesInterval":5}]}} = EVERY 5 MINUTES = 288 firings/day = 12/hour.'
    correction: 'The brief and issues/state-machine-map-2026-08-10.yaml both say "2-minute poll, LIMIT 40". Read from the LIVE definition today: the interval is 5 MINUTES and the LIMIT is 120 (the query''s own comments record the 40 -> 120 raise under "[width 2026-08-10]"). Dispatch budget is therefore 12 x 120 = 1,440 row-slots/hour, not 1,200. Both prior figures are superseded.'
    nodes:
    - Get Changed Docs (postgres, id=indox-poll-q) — the pickup query, LIMIT 120, retryOnFail maxTries 4
    - Terminalize Stalled (postgres, id=indox-terminalize) — the reaper, fires on the SAME trigger, NO LIMIT
    - Process Changed Doc -> executeWorkflow indoxV2Driver01, mode:"once", waitForSubWorkflow:false
    mode_once_consequence: '`mode:"once"` means all <=120 picked rows enter ONE driver execution, which is why a single driver execution mentions ~41.6 documents in my execution_data census.'
    pickup_query_shape: 'NINE slices, not four: s_burst, s_fin, s_finstale, s_live, s_new, s_old, s_stale, s_recov, s_adj — each an independent row_number() over the eligible set, seven of them with an md5() tiebreak computed per row, UNION ALLed and then re-grouped by min(k). Full verbatim text in `complexity.pickup_query`.'
    important_state_machine_update: 'The live WHERE now explicitly admits NEEDS_REVIEW, EXTRACTION_FAILED, DOUBLE, ACTION_RESTART, UNKNOWN_COMPANY, API_TOOLS_FAILED, MISSING_COMPANY_ID and MISSING_TYPE, and there is a dedicated `s_recov` slice for them ordered by `needs_base desc`. The state-machine map''s central finding — "fifteen of nineteen statuses have no working path back into the machine" — has been ADDRESSED in the live definition since that map was written. Terminalize Stalled has also changed: IN_PROGRESS >6h now goes back to TO_EXTRACT with RETRY_COUNT+1, and only reaches MAX_ITERATIONS at RETRY_COUNT >= 5. It no longer writes NEEDS_REVIEW for the IN_PROGRESS arm.'
    measured_cost: 892 calls, 363.58 ms mean, 324.3 s total (supabase 32.2h window)
  - hop: 2
    name: DRIVER
    workflow: indoxV2Driver01 ("Incoming Documents v2")
    live_version: 9c2e57f9-edc6-421e-b844-22536d9c0300
    measured:
      executions_9h5: 1,088 success + 189 error + 197 running
      avg_nodes_per_execution: 22.1
      avg_wall: 62.4 s
      pct_time_in_hottest_node: 69.3%
      inclusive_wall_total: 206,793 s (19.71% of pipeline)
      error_p50: 2,673.8 s
    note: Driver wall time is INCLUSIVE of decide + actions + extraction. It is not additional work; it is the same seconds counted at a higher altitude.
    THE_ROOT_CAUSE_OF_THE_REPEAT:
      node: indoxV2Driver01 / If2
      condition: '{{ $execution.mode }} notEquals "test"'
      why_it_is_the_root_cause: |-
        In production `$execution.mode` is never 'test', so If2 is UNCONDITIONALLY TRUE on every pass and always takes output 0:
          Execute Action -> Check Next Action -> If2(true) -> No Operation, do nothing4
          -> MAP ID1 [disabled, so items pass through] -> Execute Workflow
             [executeWorkflow -> {{$workflow.id}} = ITSELF, {ID}, waitForSubWorkflow:false]
        EVERY action a document receives therefore spawns a brand-new full driver execution for that same document ID. There is no counter on it, no delay, and no convergence test — If2 is not testing progress, it is testing the execution mode. The "continue in the same execution" branch (Check next In Same Execution -> Run By ID) is the FALSE branch, i.e. it is test-mode-only and never runs in production.
      second_self_call: Independently, `Execute Action` also fans out to If USE ACTION LINE -> Group By ACTION (groups of <=25) -> Loop Over Items37 (batchSize 10) -> Dispatch Action Lines [executeWorkflow -> indoxV2Driver01, SELF, waitForSubWorkflow:false]. So there are TWO self-invocations per pass.
      measured_confirmation: indoxDocGet01 runs exactly once per Run-By-ID pass and was measured at 137/hour. indoxV2Driver01 was measured at 275/hour in the same window = 2.0x — both self-invocations confirmed live, not hypothetical.
      the_ceiling: 'The only bound is in indoxV2ActionsGlobal01 / "Decide DOC BASE Action": `_iter = (ACTION_LOG.match(/\d{13}/g) || []).length; _maxIter = __CFG().max_actions_per_doc || 50; if (_iter >= _maxIter && !terminalKeep) return ''mark_max_iterations''`. The cap is 50 ACTIONS PER DOCUMENT. The measured 22-32 passes are comfortably INSIDE the permitted envelope — nothing stops the loop before 50.'
      note: This supersedes my earlier hypothesis that the repeat was purely the poll re-selecting unchanged rows. The poll contributes (any write bumps updated_at, which re-enters the s_burst slice at absolute priority k = rn*1.0 - 1000.0), but the dominant multiplier is the driver respawning itself once per action.
  - hop: 3
    name: DECIDE
    workflow: indoxV2Decide01 ("indox-v2 Decide")
    chain: When Called -> "Determine Action" (batch normalize + stateful dedup census, writes doc._dup) -> "Set decide mode (docbase)" -> "Call router_doc_base (decide)" [= indoxV2ActionsGlobal01 in mode=decide] -> "Route By Type" -> per-type decide -> "Decided" (chain proven in issues/state-machine-map-2026-08-10.yaml topology.decide_chain)
    measured: 810 success, avg 8.34 s, p50 3.43 s, 6,197 s total (0.59%)
    consequence: EVERY document passes "Decide DOC BASE Action" unconditionally before any per-type decide is reachable.
  - hop: 4
    name: ACTIONS — DOC BASE
    workflow: indoxV2ActionsGlobal01 ("indox-v2 Actions — DOC BASE")
    measured:
      success: 911, p50 0.57 s, p90 5.64 s
      canceled: 69, p50 3,600.02 s
      error: 19, p50 3,552.97 s
      running_now: 208, oldest 9.7 hours
      inclusive_wall_total: 179,929 s (17.15%)
      avg_nodes: 4.5, pct_in_hottest_node 39.0%
    finding: The success path is sub-second at p50. The 179,929 s is almost entirely the 88 canceled/errored executions that sat at ~3,600 s — they hold a production worker slot for a full hour and are then thrown away. 3,600 s is a timeout, not work.
  - hop: 5
    name: BASE EXTRACTION
    workflow: BaseDocEx01 ("Base Document Extraction (local + AI, parallel)")
    measured_9h5:
      success: 1,312 — p50 126.1 s, p90 612.4 s, p99 809.4 s, max 976.5 s, total 290,864 s
      canceled: 161 — total 24,345.9 s
      error: 42 — total 7,710.6 s
      running_now: 150, oldest 8.8 hours
      inclusive_wall_total: 322,920 s = 30.78% of ALL pipeline wall time
    anchor_check: 'The brief''s anchor was p50 264-339 s, p90 654-798 s, max 1297 s. Measured now: p50 126.1 s, p90 612.4 s, max 976.5 s. CONFIRMED IMPROVED — p50 has roughly halved, consistent with today''s thumbnail and /documentJsonQuery fixes. The shape is unchanged.'
    node_by_node:
      source: execution 898157 (doc_msnfw3v0fivoiz), read verbatim from execution_data
      total_wall_ms: 67222
      nodes:
      - n: 1
        node: Doc In
        type: executeWorkflowTrigger
        ms: 1
      - n: 2
        node: Lock Map Set (retry scope)
        type: set
        ms: 39
      - n: 3
        node: Upload+OCR
        type: executeWorkflow
        target: indoxV2UploadApiTools01
        sub_execution: 898160
        ms: 694
      - n: 4
        node: Check Local Enabled (Base)
        type: set
        ms: 33
      - n: 5
        node: If Local Disabled (Base)
        type: if
        ms: 1
      - n: 6
        node: Call JQExV3 Base
        type: executeWorkflow
        target: JQExV3Base000001
        sub_execution: 898164
        ms: 1780
      - n: 7
