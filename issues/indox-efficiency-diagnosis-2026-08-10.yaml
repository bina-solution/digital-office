      avg_docs: 30.5
      amortized_s: 27.8
    total_amortized_wall_s: 6068
    reading: '~1.7 HOURS of amortized wall time for one document, and the "dedicated" column tells the story on its own: 27, 27, 22, 32, 31, 32, 22 — this document made between 22 and 32 complete round trips through decide + actions + get + upsert. Not 1. Not 3.'
    cost_of_ONE_pass:
      source: read node-by-node from the live definitions
      execute_workflow_invocations: 19
      chain: 'Run-By-ID execution: 1 Get Line By ID -> indoxDocGet01; 2 Call INDOX GETALL -> indoxApiRouter01; 3 Call Supabase -> indoxApiSupabase01; 4 Call indox-v2 Decide -> indoxV2Decide01; 5 Call router_doc_base -> indoxV2ActionsGlobal01 (mode=decide); 6 Call router_<type> -> per-type actions (0 if TYPE unresolved); 7 Check LOCKED -> processLock01; 8 Dispatch Action Lines -> SELF; 9 Execute Workflow -> SELF. Act-lane execution: 10 Call Actions—DOC BASE -> indoxV2ActionsGlobal01 (mode=act); 11 Call BaseDocEx01 (mode "each", PER ITEM); 12 Upload+OCR -> indoxV2UploadApiTools01; 13 Download file -> driveApi01; 14 Call JQExV3 Base -> JQExV3Base000001; 15 Upsert (central) -> indoxV2Upsert01; 16 Delegate to Batch Upsert -> indoxDocBatchUpsert01; 17 Call INDOX UPSERT -> indoxApiRouter01; 18 Call Supabase -> indoxApiSupabase01; 19 SB Unlock Doc -> processLock01.'
      http_request_nodes: 9
      http_breakdown: UploadApiTools 3 (/docExists, /documentOcr, thumbnail) + driveApi01 2 (d:download x2) + JQExV3 1 (/documentJsonQuery) + BaseDocEx01 1 (/webhook/invoice_extractor) + Gemini 1 (Google DocumentAI) [+0-2 priority-sync on the shipment lane]
      postgres_nodes: 12
      postgres_breakdown: PG Get 1; Load Company Resolver Gen x2 (decide + act) = 2 AT 190 ms EACH; BaseDocEx01 Check Local Enabled + Check AI Enabled = 2; JQExV3 Load V3 Config 1 AT 212 ms; Gemini Check AI Enabled + Load V3 Config (AI) + KVStorage + KVStorage1 = 4; Load Match Index + PG Upsert = 2.
      registry_rebuilds_per_pass: 3
      registry_cost_per_pass: ~600 ms of pure registry re-materialisation, per document, per pass
      key_batching_defect: indoxV2ActionsGlobal01 / "Loop Base Doc" has batchSize 1 and calls BaseDocEx01 in mode "each" — there is NO batching at the single most expensive step in the system.
      measured_confirmation:
        method: execution counts per hour, normalised against indoxDocGet01 = exactly 1 per Run-By-ID pass
        indoxDocGet01: 137/hr = the pass baseline
        indoxV2Driver01: 275/hr = 2.0x -> both self-invocations confirmed
        indoxV2ActionsGlobal01: 219/hr = 137 decide-mode + 82 act-mode -> DOC BASE runs TWICE per document per pass
        BaseDocEx01: 1,238/hr = 9.0 per pass (Loop Base Doc batchSize 1 over an action-line group)
        indoxApiSupabase01: 1,827/hr = 13.3 per pass
        JQExV3Base000001: 1,233/hr = 1,233 full 215 KB registry reads per hour from this node alone
    the_floor:
      one_clean_pass_no_extraction: 12
      one_pass_as_actually_built: 19
      note: The system's OWN minimum for one pass is 19 executeWorkflow invocations, not 12 — two of the 19 are the driver calling itself, which is pure overhead (see journey.hops[2].THE_ROOT_CAUSE_OF_THE_REPEAT), and two more are the double evaluation of indoxV2ActionsGlobal01 in decide then act mode.
      realistic_floor_for_a_document_that_needs_all_its_state_transitions: 41-51
      realistic_composition: 'A document legitimately needs ~3 actions: (a) extract base -> COMPANY_ID/TYPE/DATE, (b) per-type extraction, (c) selection + mark completed. At the theoretical 12 that is 41 including the one-time extraction subtree; at the as-built 17 (19 minus the two self-calls) it is 51.'
      correction_to_the_brief: '"a theoretical floor near 11" is right for a SINGLE pass counted generously. The honest floor for a real document on the current topology is 41-51. The measured 292-330 is therefore a 6-8x waste factor, not a 27x one. That is still the largest single lever in the system, but the plan below is costed against 6-8x.'
      cost_of_the_measured_27_passes:
        execute_workflow_sub_executions: 27 x 19 = 513
        http_calls: 27 x 9 = 243
        sql_statements: 27 x 12 = 324
        registry_rebuilds: 27 x 3 = 81 full 2,378-identifier rebuilds = ~16 seconds of pure DB CPU for ONE document
    system_wide_ratio:
      executions_per_hour_measured: 484/minute averaged over 16:52-17:11Z = ~29,000/hour. Earlier in the window the rate was ~9,000-12,000/hour (10-minute buckets 14:40-16:40Z ranged 725-2,342). Both are reported; the system is bursty and currently at the high end.
      documents_completed_per_hour: 20
      completed_per_hour_source: '`select count(*) from incoming_documents where updated_at > now()-interval ''60 minutes'' and "STATUS"=''COMPLETED''` = 20. Cross-check: COMPLETED went 6,341 at 16:52Z -> 6,358 at 17:12Z (+17 in 20 min = 51/h); and 6,321 at 14:01Z (state-machine map) -> 6,341 at 16:52Z (+20 in 2.85h = 7/h). The rate is bursty; 20/h is the middle measurement and is used throughout.'
      executions_per_completed_document: ~1450
      why_it_differs_from_292: 292 is the cost of a document that FINISHES. ~1,450 is total system throughput divided by completions — it includes all the work spent on the ~300 documents that were worked on this hour and did not finish. The gap between 292 and 1,450 is the cost of thrash on non-completing documents.
