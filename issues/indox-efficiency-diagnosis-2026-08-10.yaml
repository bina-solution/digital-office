    the_second_finding: Gemini is the ONLY workflow in the system with meaningful queue latency. Every other workflow waits under 1.3 s to be dequeued (drive api 0.41 s, process_lock 0.50 s, indox api 0.36 s, BaseDocEx01 itself 0.39 s). Gemini waits 40.4 s on average and 126 s at p90. So of the ~62 s a single Gemini call costs its caller, ~40 s (65%) is queue wait for a worker slot and ~22 s is the model. The caller's node averages 159.4 s because BaseDocEx01 issues ~2.1 Gemini executions per run (3,343 Gemini / 1,587 BaseDocEx in the same 4 hours).
