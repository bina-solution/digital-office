    measured:
      upsert_central: 867 success, 16,508 s (1.57%)
      batch_upsert: 867 success, 12,960 s (1.24%)
      get_incoming_document: 858 success, 6,182 s (0.59%)
      indox_api_router: 2,358 success, 14,648 s (1.40%)
      indox_api_supabase: 2,365 success, 7,205 s (0.69%)
      process_lock: 2,414 success, 4,309 s (0.41%)
    terminal_write: 'STATUS=''COMPLETED'' via ''Build: ... - STATUS COMPLETED'' in the per-type action workflow'
  re_delivery_paths:
    intro: Complete census of every mechanism that can hand the SAME document to the driver again. Read from the live definitions. This is the mechanical explanation of the measured 31.9 driver deliveries per document per hour.
    paths:
    - n: 1
      mechanism: self-respawn per action
      where: indoxV2Driver01 If2 -> MAP ID1 -> Execute Workflow (self)
      bound: NONE — one per action until _iter >= 50
    - n: 2
      mechanism: action-line self-call
      where: Group By ACTION (<=25) -> Loop Over Items37 (10) -> Dispatch Action Lines (self)
      bound: one child per loop iteration
    - n: 3
      mechanism: 5-min poll re-pickup
      where: Poll Line Changes -> Get Changed Docs
      bound: s_burst rn<=6 at absolute priority; LIMIT 120
      note: 'any write bumps updated_at, which re-enters the 15-minute burst window. The query''s OWN comment states the loop: ''an action writes the row -> the row enters the changed-window -> it is picked again on the next poll -> next action -> repeat'''
    - n: 4
      mechanism: tail drainer (3rd independent feeder)
      where: 'indoxV2TailDrain01 Every 5 min -> Pick Drain Candidates LIMIT 25 -> Drain Loop batchSize 1 -> Driver: Run By ID (waitForSubWorkflow:true)'
      bound: 25 driver calls / 5 min
    - n: 5
      mechanism: hourly whole-corpus sweep
      where: indoxV2Driver01 Schedule Trigger {hours:1,minute:5} -> GETALL Req -> Lines Batching Loop (20000)
      bound: 1/hour x entire table
    - n: 6
      mechanism: poll node retry
      where: Process Changed Doc retryOnFail maxTries 3 wait 3000ms onError:continueRegularOutput
      bound: 3
    - n: 7
      mechanism: NEXT_RETRY_AT / RETRY_COUNT backoff
      where: indoxV2ActionsGlobal01 'Record Base Doc Failure' AND errorHandler01 'Backoff + Dead-letter' — byte-identical logic
      bound: 5 attempts; NEXT_RETRY_AT = now() + 5*power(3,RETRY_COUNT) min = 5/15/45/135; 'infinity' at >=5
    - n: 8
      mechanism: Terminalize re-queue
      where: 'Terminalize Stalled: IN_PROGRESS >6h -> TO_EXTRACT with RETRY_COUNT+1'
      bound: 5 attempts then MAX_ITERATIONS
    - n: 9
      mechanism: loop-back inside DOC BASE
      where: Upsert (central) - Base Doc -> Loop Base Doc, and Record Base Doc Failure -> Loop Base Doc (batchSize 1)
      bound: per batch item
    - n: 10
      mechanism: per-node retries
      where: Figure Document Type 3267ms, Mark Invoice Completed 3333ms, Apply Gmail Label 5000ms, every indoxApiSupabase01 pg node maxTries 4
      bound: 3-4 each
    - n: 11
      mechanism: Wait nodes
      where: Wait {{Math.floor(Math.random()*6)+3}}s, Wait1, Webhook Callback Wait (20 min limit)
      bound: '-'
    - n: 12
      mechanism: redis process lock
      where: Check LOCKED -> processLock01 check_and_lock (INCR + TTL 600)
      bound: TTL 600s
    the_silent_drop:
      finding: 'When processLock01 reports the document is already LOCKED, the driver takes `If NOT LOCKED` -> false -> `If TEST` -> (production branch) -> "Call ''Snooze Incoming Document''" -> "Process Blocked Error" — AND BOTH OF THOSE NODES ARE `disabled: true`. So a lock collision does not defer the document and does not raise an error: the document is SILENTLY DISCARDED for that pass.'
      why_it_matters: There are five independent feeders (paths 1, 2, 3, 4, 5) racing for the same document, arbitrated only by a Redis lock whose loser is dropped on the floor. Every lost arbitration is a complete wasted pass — the work of getting the row, deciding, and acquiring the lock is all thrown away. This converts lock contention directly into the measured execution volume, and it gets WORSE as concurrency rises.
  fan_out:
    question: A prior partial measurement suggested ~398 executions per document against a theoretical floor near 11. VERIFY OR CORRECT — do not take on trust.
