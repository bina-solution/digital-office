      the_finding: 'Node 10 is 64,613 ms of 67,222 ms = 96.1% of that execution. Nodes 1-9 and 11-14 together cost 2,609 ms. The document''s own _TIMINGS field records what the LOCAL extractor spent to produce all three base fields: {"TYPE":614,"DOC_DATE":71, "COMPANY_ID":9} = 694 ms. And SELECTION_DEBUG_BASE for that execution reads {"COMPANY_ID":"AGREE","TYPE":"AGREE","DOC_DATE":"AGREE","LOCAL_STATUS":"ran","AI_STATUS":"ran"} — the 64.6-second AI call returned exactly what the 0.69-second local call had already returned.'
    at_scale:
      window: 1,587 successful BaseDocEx01 executions, last 4 hours
      avg_nodes: 14.0
      avg_sum_of_node_times: 192.3 s
      avg_single_hottest_node: 159.4 s
      pct_of_all_node_time_in_the_single_hottest_node: 82.9%
      avg_wall: 193.0 s
      pct_of_wall_accounted_by_node_times: 99.6%
      reading: 82.9% of every second BaseDocEx01 spends is one node, and that node is the AI webhook. There is no hidden queue latency INSIDE BaseDocEx01 — 99.6% of its wall time is accounted for by its own node timings.
  - hop: 5a
    name: BASE EXTRACTION -> apitools (the local leg)
    workflows:
    - indoxV2UploadApiTools01
    - JQExV3Base000001
    measured:
      upload_api_tools: 1,639 success, avg 22.3 s, 38,606 s total (3.68%), avg 8.2 nodes, 66.7% in hottest
      jq_ex_v3_base: 1,546 success, avg 14.4 s, 20,044 s total (1.91%), avg 5.0 nodes, 77.0% in hottest
    http_calls: POST /documentOcr (upload) and POST /documentJsonQuery (per field / batched) on apitools
  - hop: 5b
