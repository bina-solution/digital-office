  ## Complexity

  ```yaml
  symbols:
    N: document count in incoming_documents (16,680 today)
    C: company count in public.companies (1,183 today) -> 2,378 bound identifiers
    D: documents in flight per hour (measured 317)
    P: polls per hour (12 — the trigger is every 5 MINUTES, not 2; see journey.hops[1].correction)
    E: base extractions per document (measured 5.86)
    Q: apitools queries per document (measured 5.4 /documentJsonQuery calls per file_id)
  per_poll:
    frequency: 12/hour (every 5 minutes), NOT 30/hour — see journey.hops[1].correction
    pickup_query:
      cost: O(N log N) with a large constant — TWO full scans and ~10 sorts per evaluation
      why: (a) The `elig` CTE full-scans incoming_documents; its WHERE is a 9-way OR chain including `"STATUS" is null or "STATUS" = ''` and an unanchored `updated_at > now() - interval '15 minutes'`, which no single index can serve. (b) Inside that WHERE, the dup-detector `"ID" in (select z."ID" from (...) z where z._n > 1)` is a SECOND full scan carrying `count(*) over (partition by "COMPANY_ID", trim(coalesce(nullif("DOC_ID",''), nullif("COMPANY_DOC_ID",''))))` — a window that forces a sort of the entire table on a COMPUTED expression that cannot be indexed, plus 4 regexp_replace calls per row. (c) NINE slices (s_burst, s_fin, s_finstale, s_live, s_new, s_old, s_stale, s_recov, s_adj) each run their own row_number() over the eligible set, seven with an md5() tiebreak computed per row. (d) `u` UNION ALLs all nine, then `group by "ID"` with `min(k)` — a tenth sort/hash-aggregate. Roughly two full scans plus ten sorts, every 5 minutes, to return 120 rows.
      measured: 892 calls, 363.58 ms mean, 324.3 s total (32.2h window)
      scales_with: CORPUS, not with the 120 rows returned
      unproven: Whether the planner materialises `elig` (referenced 9 times, so it should) or re-evaluates it per slice. EXPLAIN was deliberately NOT run against the live pickup to avoid adding load to the pipeline's own database. If it is not materialised the cost is ~9x the above.
    terminalize_stalled:
      cost: O(N), UNBOUNDED UPDATE — no LIMIT
      why: The WHERE is a disjunction over "STATUS" + updated_at and the leading `"ID" <> '__bootstrap__'` is non-sargable, so it full-scans. Plus one `NOT EXISTS` drain-guard subquery (uncorrelated, so evaluable once).
      frequency: 288/day — same 5-minute trigger as the pickup, so both run together
    tail_drainer_same_cadence:
      cost: O(N) — `shared` CTE does GROUP BY "COMPANY_DOC_ID" HAVING count(DISTINCT "COMPANY_ID") > 1 over the WHOLE table, plus a NOT EXISTS anti-join against indox_dupid_targets_20260810
      measured: 79 calls, 11,951.82 ms mean — 12 SECONDS per call
      frequency: every 5 minutes
    verdict_per_poll: 'Every 5 minutes the database is asked to full-scan incoming_documents at least four times: twice for the pickup, once for the unbounded reaper UPDATE, once for the tail drainer''s whole-table GROUP BY. That is the measured source of seq_tup_read = 759,431,037.'
  per_document:
    registry_binding:
      cost: O(16 x C) per call, called E times per document -> O(N x E x C) for the corpus
      why: '`public.extraction_queries` is a VIEW, not a table. Its definition: `SELECT ... bind_registry(s.value::jsonb, jsonb_build_object(''@registry_ids'', COALESCE(r.registry_ids,''[]''), ''@registry_idents'',..., ''@registry_names'',..., ''@registry_name_map'',..., ''@registry_primary_map'',...)) FROM settings s LEFT JOIN company_registry r ON r.instance = s.instance WHERE s.key LIKE ''q\_v3\_%''`. There are 16 matching settings rows, and `company_registry` is re-evaluated per row rather than once. The 2,378 identifiers are rebuilt from the 1,183-row companies table and re-substituted into every query template, on every call.'
      measured:
        query: select coalesce(jsonb_object_agg(key, query), $1::jsonb) as cfg from public.extraction_queries where instance = $2
        calls: 4906
        mean_ms: 734.24
        total_s: 3602.2
        rank: '#1 query on supabase-db by total time'
        collateral: companies seq_scan = 142,560, seq_tup_read = 168,330,421 tuples from a 1,183-row table
      per_node_explain_analyze_note: EXPLAIN (ANALYZE, BUFFERS) against the live supabase DB, per reading node
      per_node_explain_analyze:
      - node: indoxV2ActionsGlobal01 / Load Company Resolver Gen
        statement: SELECT COALESCE((SELECT resolver_gen FROM extraction_queries WHERE instance=... AND key='q_v3_company'),'')
        measured_ms: 190.5
        plan: Seq Scan on companies rows=1183 -> CTE ident rows=2378 -> sort 2378 rows (337 kB quicksort) -> GroupAggregate
        calls_per_hour: 219
        the_absurdity: THIS QUERY WANTS AN 8-CHARACTER STRING. To produce it the view must build the entire 2,378-element registry, run bind_registry to splice it into the 187 KB q_v3_company JSON, and then md5() the whole 187 KB — 190 ms for 8 bytes. And it runs TWICE per document per pass, because `Route Mode` sits AFTER `Load Company Resolver Gen`, so decide-mode calls pay the act-mode cost.
        cost: 219 x 190 ms = ~42 s/hour of supabase CPU, entirely wasted
      - node: JQExV3Base/BS/Invoice/Order/Ship000001 + indoxV2ExtractInvoiceGemini01 / Load V3 Config
        statement: select coalesce(jsonb_object_agg(key, query),'{}') from extraction_queries where instance=...
        measured_ms: 212.4
        plan: same rows=2378 CTE, x16 keys via Materialize
        calls_per_hour: 1,233 (JQExV3Base alone) + 2,091 (Gemini)
        cost: 1,233 x 212 ms = ~4.4 MINUTES/hour of DB CPU, plus ~215 KB x 1,233 = ~265 MB/hour of JSON shipped into n8n worker heaps
      payload_sizes:
        q_v3_company_bytes: 186956
        other_15_keys_total: ~28 KB
        largest_jsonb_array: 2,378 elements  <- the reported 2,378 identifiers
        composition: 1,212 + 1,166 = 2,378, from 1,183 companies x ~2 identifier columns via a LATERAL VALUES fan-out
        total_string_leaves_in_q_v3_company: 7183
      the_punchline: APITOOLS_FIND_OPTION_MAX_TEXTS truncates a find-option list to 25. Of the 2,378 identifiers rebuilt, serialised and shipped on every call, apitools uses at most 25. (Quoted from the workflow comment in JQExV3Base000001 'Fan Fields'; NOT read from the running apitools container, so UNPROVEN for the current build.)
      company_registry_is_also_a_plain_view: '`company_registry` has relkind=''v'' — it is a plain VIEW, not materialised. So is `extraction_queries`. Nothing is cached anywhere in this path.'
      this_is_the_one_that_scales_with_the_CLIENT: Cost is independent of N but linear in C, and it is paid once per extraction. A client with 5,000 companies pays 4.2x per call. A client with 5,000 companies AND 200k documents pays 4.2 x 12 = 50x the current 3,602 s.
    ocr_cache_read:
      cost: O(blob) per call, and blob does not fit in shared_buffers
      measured:
        query: SELECT ocr_json FROM ocr_cache WHERE file_hash = $1
        calls: 165220
        mean_ms: 17.65
        total_s: 2915.9
        table_size: 175 MB over 5,140 rows (avg 32 kB, max 548 kB per blob)
        shared_buffers: 128 MB — SMALLER THAN THE TABLE
      why_it_is_worse_than_it_looks: Per the apitools profile, /docExists and /documentImage both load and decode the FULL OCR JSONB via OcrObject.from_file_id in order to return, respectively, a boolean and a static file path — 1,775 worker-seconds = 10.8% of all apitools CPU spent on data neither endpoint's output depends on.
    postgrest_layer:
      measured:
      - calls: 38004
        mean_ms: 77.56
        total_s: 2947.6
        q: PostgREST SELECT over incoming_documents
      - calls: 26760
        mean_ms: 31.43
        total_s: 841.1
        q: settings jsonb_object_agg lookup
      - calls: 3179
        mean_ms: 270.37
        total_s: 859.5
        q: SELECT name FROM pg_timezone_names
      - calls: 3967
        mean_ms: 302.77
        total_s: 1201.1
        q: INSERT INTO indox_sync_stats
      - calls: 279
        mean_ms: 7710.73
        total_s: 2151.3
        q: select pg_sleep($1)
      notes:
      - 'pg_timezone_names is pure PostgREST schema-cache overhead: 859 s of a 1-core DB spent listing timezones.'
      - '`select pg_sleep($1)` — 279 calls at 7.7 SECONDS each, 2,151 s total, holding a database connection the whole time. No occurrence of `pg_sleep` exists anywhere in platform-base/, apps/ or scripts/ (grep returned zero hits), so this is issued from a live n8n node or from PostgREST. UNPROVEN: which caller.'
      - settings table has 66 rows and 48,132 sequential scans.
  per_hour_whole_corpus:
    get_all_sweep:
      cost: O(N), hard cap 20,000
      status: BROKEN — 2/2 observed executions failed at 'Call INDOX GETALL' (state-machine map P2)
      headroom: 16,680 / 20,000 = 83.4% of cap
      note: even when fixed, it dies permanently at 20k rows
    tail_drainer:
      measured: 79 calls, 11,951.82 ms mean, 944.2 s total — 12 SECONDS per call
      cost: O(N) with a multi-predicate filter and an anti-join against indox_dupid_targets_20260810
  measured_scan_pressure:
    incoming_documents:
      seq_scan: 72732
      seq_tup_read: 759431037
      idx_scan: 359453
      idx_tup_fetch: 205004769
      n_tup_upd: 66741
      n_tup_hot_upd: 37887
      reading: 759 MILLION rows read sequentially from a 16,680-row table in 32 hours — an average of 10,442 rows per sequential scan, i.e. most scans read the whole table. Index scans fetch 570 tuples each on average, which is not point-lookup behaviour either.
    companies:
      seq_scan: 142560
      seq_tup_read: 168330421
      reading: 168 million tuples from a 1,183-row table = the registry view, 120 scans per second of pipeline time
  growth_curve:
    assumptions: Extrapolated from the measured per-call costs, holding hardware and the current algorithm constant. Marked PROJECTION — these are arithmetic extrapolations of measured constants, not measurements.
    table:
    - N: 16680
      pickup_ms_per_poll: 364
      pickup_s_per_hour: 10.9
      terminalize_relative: 1.0
      registry_s_per_hour: 112
      get_all: 83.4% of cap
      verdict: current state
    - N: 18000
      pickup_ms_per_poll: 396
      pickup_s_per_hour: 11.9
      terminalize_relative: 1.08
      registry_s_per_hour: 121
      get_all: 90% of cap
      verdict: PROJECTION — nothing breaks yet
    - N: 50000
      pickup_ms_per_poll: 1200
      pickup_s_per_hour: 36
      terminalize_relative: 3.0
      registry_s_per_hour: 336
      get_all: DEAD — exceeds the 20,000 cap and the Guard Get Size node throws
      verdict: PROJECTION — GET_ALL is permanently gone (it already fails today). Pickup is still tolerable. Registry hits 336 s/h = 9.3% of supabase-db's single core.
    - N: 200000
      pickup_ms_per_poll: 5500
      pickup_s_per_hour: 165
      terminalize_relative: 12.0
      registry_s_per_hour: 1344
      get_all: DEAD
      verdict: 'PROJECTION — the pickup query alone consumes 165 s of every 3,600 s on a 1-core DB, the reaper''s unbounded full-table UPDATE runs 12x heavier every 5 minutes, and the registry consumes 1,344 s/h = 37% of the core. With C also growing to 5,000 the registry term alone becomes ~157% of one core: the DB cannot serve it.'
    the_terms_that_scale_with_the_CORPUS_not_the_document_count:
    - 'pickup dup-detector window function: O(N log N) x 30 polls/hour — five whole-corpus sorts per poll'
    - 'Terminalize Stalled: O(N) full-scan UPDATE x 30/hour'
    - 'GET_ALL hourly sweep: O(N), hard-capped at 20,000, ALREADY FAILING at 16,680'
    - 'PostgREST SELECT over incoming_documents: 38,004 calls at 77.56 ms'
    the_term_that_scales_with_the_CLIENT_not_the_corpus:
    - 'the @registry_ids binding: O(16 x C) per extraction. This is the one that gets worse as the CLIENT grows (more companies), independently of how many documents they have, and it is already the #1 query on the database.'
