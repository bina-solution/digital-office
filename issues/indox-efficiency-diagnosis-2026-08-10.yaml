  ```yaml
  note: 'Ranked by share of TOTAL PIPELINE WALL TIME, de-nested: parent workflows whose time is entirely their children''s are excluded from the ranking and shown separately, so these shares sum to distinct work. CPU share is attributed to the container that actually burns it.'
  ranked:
