  ## Fix in progress

  ```yaml
  chosen: Audit recommendation R1 — retire indoxV2Upsert01 ('Upsert (central)'), a pure pass-through with zero business logic (Redis GET -> always-false IF -> a Code node whose whole body is `return $('When Called').all();`). Proven 1:1 with its child (2,989 = 2,989 executions) and adding ~5.7s (26%) per call. Its only purpose is a test-capture seam whose two consumers are INACTIVE.
  rationale: The failure is connection ACQUISITION, which scales with the NUMBER of concurrent executions. Removing a whole redundant execution layer from every write reduces that directly.
  rejected_alternative: Shrinking the pickup batch (limit 120) would be BACKWARDS — smaller batches mean MORE executions and MORE pool pressure, not less.
  explicitly_not_doing: 'Not retiring indoxDocBatchUpsert01 (audit R4): it holds ''SB Unlock Doc'', the release half of the doc_step lock. Moving that changes lock semantics. Not raising DB_POSTGRESDB_POOL_SIZE: 3 processes x 25 = 75 against max_connections=100 leaves no room, and postgres is capped at 2GB.'
  ```

  ## Constraints honoured

  - No document rows edited — no bulk UPDATEs, no hand-set STATUS or flags.
  - No ./bbox run. No git checkout.
  - Execution history left enabled.
  - Worker concurrency unchanged.
  - COMPLETED counted by STATUS delta only, never ACTION_LOG stamp or updated_at.
