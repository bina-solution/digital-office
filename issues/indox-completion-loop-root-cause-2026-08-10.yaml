  ## Session end state 2026-08-11

  ```yaml
  everything_converges_on_one_root: 'Four separate symptoms are one defect. With the production loop continuation broken, a document gets exactly ONE action per pickup, so: (1) it is re-picked for every subsequent action, which is the dup/doc figure; (2) the selection stage is starved because the 120-row budget goes to the 6,859 documents needing base extraction; (3) mark_completed is dispatched and the loop dies before it lands; (4) documents exhaust their iteration budget while waiting and are retired to MAX_ITERATIONS.'
  stage_by_stage_population_delta:
    method: two snapshots 254s apart; POPULATION counts, not touch counts
    base_extraction: +40  (~570/hr) — working
    typed: +41  (~580/hr) — working
    per_type: +9   — slow but moving
    selection: 0    — FROZEN
    completed: 0    — FROZEN
    max_iterations: +9   — documents destroyed (sustained rate ~10/hr, 167 -> 192 over the session)
    executions_in_window: 5106
  selection_is_starved_not_broken: 'The write path is intact: ''Build: Batch Update - Selection & Score'' carries all 16 fields including SELECTION_COMPLETED, and the chain terminates cleanly at the upsert. The problem is throughput — 15 select_invoice_values dispatches in 60 minutes against 191 documents waiting at that gate. ~13 hours of queue, growing.'
  quality_defect_recorded_separately: SELECTION_COMPLETED is written as ={{ true }} UNCONDITIONALLY, so it records that selection was ATTEMPTED, not that it produced an answer. Part of why 1,371 COMPLETED rows are missing required fields. Not the freeze cause; matters for the "fully processed" bar.
  permanent_lock_leak:
    measured: 27 of 250 doc_step keys at ttl=-1 (10.8%), acquisition counters up to 34
    healthy: 223 keys with sane TTLs (152 at 301-600s, 71 at 61-300s)
    cause: STAMP LOCK TTL fires only on the winner path; any failure before it leaves a key with no expiry
    fix_dispatched: EXPIRE <key> <ttl> NX on BOTH branches (Redis is 7.4.10). NX is mandatory — a bare EXPIRE would refresh the TTL on every contended poll and make a busy document's lock immortal, strictly worse than the leak. Self-heals the existing 27 within one TTL window, no manual Redis surgery.
  landed_and_verified_tonight:
  - processLock01 mutex two-runs fix — lock reply completeness 23.2% -> 100%
  - indoxDocBatchUpsert01 — error-path unlock added (was leaking on every failed upsert)
  - R1 — indoxV2Upsert01 pass-through retired, 16 call sites re-pointed, its volume -87%
  - indoxV2ExtractInvoiceGemini01 — FIELDS-aware cache with merge, proven zero extra paid calls
  - autoheal sidecar + worker liveness probe fixed (was 100% false-positive on rotated logs)
  - 'watchdog: dup/doc and inactive_targets detectors; stall counter anchored to container start'
  trajectory:
    errors_per_hour: 279 -> 60
    single_value_extractors_per_hour: 34 -> 14
    rework: 89% -> ~66%
    completed: 6,389 -> 6,396 (essentially flat)
    intake: 67/hr -> 145/hr (backlog widening)
  two_repo_landmines_caught_before_any_push:
  - 'processLock01: repo copy was missing ''First Acquire?'' and ''STAMP LOCK TTL'' — a push would have made EVERY lock permanent.'
  - 'indoxV2Driver01: repo 131 nodes vs live 132; the node only in live is ''Dispatch Action Lines'' — a push would have deleted the one working dispatcher.'
  ```

  ## What actually fires the duplicate actions

  ```yaml
  answer: 'indoxV2Driver01 RE-ENTERS ITSELF. ''Group By ACTION'' feeds ''Dispatch Action Lines'', an executeWorkflow node targeting the LITERAL indoxV2Driver01 with ACTION_LINES={{ $json.items }} and waitForSubWorkflow:false. Each pass re-reads the pending set, so any document whose action did not stick is still pending and is dispatched again. Confirmed by the parentExecution chain: every duplicated execution''s parent is another indoxV2Driver01 execution, lastNode=''Redis1''.'
  not_webhooks: The webhook fan-out path ('Start Sub-Workflow via Webhook') is DEAD — its target webhook incoming-documents-016 is disabled and unregistered, so it would 404. The live re-entry is the executeWorkflow self-call.
  worked_example:
    documents:
    - doc_msm3jikzv7t7w2
    - doc_msmqu0zwmmqcka
    - doc_msm3huy0gxocvk
    executions:
    - 953133
    - 953196
    - 953235
    - 953284
    - 953331
    - 953398
    pairwise_overlap: 3 of 3 across all 15 pairs — every execution carried the IDENTICAL 3 documents
    timing: 19:35:34.072, 19:35:46.347, 19:35:52.951, 19:36:11.446, 19:36:21.657, 19:36:34.528
    note: NOT concurrent (gaps of 12/6/19/10/13s) and all mode=integrated. line_count decreases 22->22->22->21->19->19 as other work drains while the same 3 documents ride every pass. Their outline is select_invoice_values_x_22_actions_x_7, and the action list includes mark_completed — dispatched repeatedly, landing never.
  spec_violated: 'ROUTERS-ARCHITECTURE.md §2 specifies "GET doc by id -> acquire doc_step lock -> DISPATCH -> router returns ONE action''s result -> Batch Upsert (sets a *_COMPLETED flag + unlocks) -> loop". One action per iteration, under a lock, unlock inside Batch Upsert. All three are broken live: the lock is inert, the unlock runs only on the success path, and the driver re-enters itself.'
  still_happening: yes — dispatches per document 5.82 -> 7.44 -> 9.93 (peak) -> 3.22 -> 4.86 -> 2.60
  last_observed: 20:10:37, doc_msm3ox0t708agq, 7 dispatches
  ```

  ## Why it stayed hidden

  - Parent execution DATA is pruned while the row survives, so n8n's 'View parent execution' dead-ends one hop up. 913686 and 890440 are gone entirely while 722379 from 07:21 is still held.
  - ACTION_LOG inflates: the append trigger rewrites one execution's single write as N identical entries, so counting there yields a fake ~17x that is pure artifact.
  - execution_metadata truncates at n8n's 512-char custom-data cap (the 'Custom data value over 512 characters' log spam), silently cutting the id list.
  - Lock SKIPS are correct by design, so the one alarming-looking signal is expected noise — while the real failure was documents ABSENT from the lock reply entirely.
  - The failure is recorded as a STRING inside a document field (ERROR: ... sub-workflow error: Workflow is not active ...), never as an alert.

  ## Detectors added 2026-08-10

  ```yaml
  where: scratchpad/watchdog.sh (2-minute tick)
  dup_per_doc:
    what: dispatches per document over 30 minutes; ROUTERS-ARCHITECTURE.md §2 says this must be 1.00
    source_discipline: 'Counted from execution_metadata key=''ids'', whose ''executing_action'' stamp is written by ''Execution Data3'' DOWNSTREAM of ''If NOT LOCKED'' — so every counted row got past the mutex and is a real dispatch. Never from ACTION_LOG. Truncation makes it a LOWER bound: it can under-report, never cry wolf.'
    reading_at_install: 5.25
  inactive_dispatch_targets:
    what: any of the 15 executeWorkflow targets with active=false or activeVersionId IS NULL
    why: OUR OWN DEPLOYS CREATE THIS. import:workflow sets active=false AND activeVersionId=NULL; until activate lands, every dispatch into that target throws and every affected document is re-queued. BaseDocEx01 was re-imported 17:28:49 and 'not active' errors spiked to 138 in the following hour.
    escalation: outranks every other flag, including a completions stall, which it usually causes
  ```

  ## Largest single error source

  ```yaml
  node: indoxV2Driver01 / 'Execute Workflow'
  error: Workflow is not active and cannot be executed. (getPublishedWorkflowData)
  share: 120 of 167 driver errors in 2h = 72%
  why_it_can_never_succeed: Its resource-locator target is the expression value "={{ $workflow.id }}" with mode:'id' — the stored cachedResultUrl is that literal expression URL-encoded (/workflow/=%7B%7B%20$workflow.id%20%7D%7D). n8n 2.x requires an executeWorkflow target to be PUBLISHED; this does not resolve to one, so it throws every run.
  why_disabling_is_safe:
  - It has NO outgoing edges in the live connections — a dead end, output consumed by nothing.
  - It is fed from 'MAP ID1', which is itself DISABLED (data passes straight through).
  - 'The real dispatch is a DIFFERENT node that works: ''Dispatch Action Lines'' does the same fire-and-forget self-dispatch (waitForSubWorkflow:false) against the LITERAL ''indoxV2Driver01'' and succeeds — confirmed in the per-node census of executions 955781 and 955778, where it ran with 1 item while ''Execute Workflow'' errored with 0.'
  do_not: Do NOT repair it by swapping the expression for the literal id. That switches ON a self-dispatch that has never once run, alongside one that already works; the plausible outcomes are double dispatch or runaway recursion. Removing the error is the goal.
  knock_on: An unhandled node error ends the driver execution, so post-action bookkeeping never runs — which is the same mechanism behind the doc_step lock leak.
  ```

