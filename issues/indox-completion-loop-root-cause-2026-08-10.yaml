# yaml-language-server: $schema=./schema.json
title: Fully-extracted documents are re-processed ~9x and retired to MAX_ITERATIONS instead of COMPLETED, because the status write dies on n8n's internal DB pool
opened: '2026-08-11'
severity: critical
status: in-progress
summary: 'COMPLETED is pinned near 6,389/16,824 while base extraction runs 70-130/hr at 56-79% rework. The state machine is NOT wrong: decide returns mark_completed correctly. The STATUS write is lost, so the pickup re-selects the same rows forever until the action counter trips and the document is retired to MAX_ITERATIONS — a terminal status it can never leave.'
description: |
  id: indox-completion-loop-root-cause-2026-08-10
  As first recorded — status: root-cause-proven; fix in progress (retire redundant upsert layer)

  ## Objective

  #1 — all six-month docs synced + COMPLETED

  ## Proof

  ```yaml
  the_loop_is_real:
    source: 'n8n execution_metadata — the driver stamps key=''ids'' (document ids) and key=''actions'' per execution. This is the driver''s own record, not inference. NOTE: values are truncated at n8n''s 512-char custom-data cap (this is the "Custom data value over 512 characters" log spam), so counts are LOWER BOUNDS and never false positives.'
    examples:
    - doc: doc_mshcwoo6dajvcn
      driver_executions: 148
      window: 17:37 -> 19:05 (88 minutes)
      sample_executions:
      - 914397
      - 915152
      - 915293
      - 916351
      - 934387
    - doc: doc_msmk9ibfywgqto
      driver_executions: 120
    - doc: doc_msmk92mmiwtdwm
      driver_executions: 118
    - doc: doc_msm3o0fhz66jkb
      note: identical action set 44 times
    not_lock_skips: 'The exection_type=''executing_action'' stamp is written by node ''Execution Data3'', whose ancestors include ''If NOT LOCKED'' and ''Join LOCKED''. The stamp is therefore DOWNSTREAM of the lock check: these were real dispatches that passed the lock, not skips.'
    real_work_confirmation: BaseDocEx01 ran 2,515 executions in 2 hours against 277 distinct documents = 9.08 extractions per document. Independent of the metadata.
    disproven_hypothesis: 'The "batchSize 10 fan-out" theory is WRONG (owner rejected it twice, and the data agrees). ACTION_LOG entries written by one execution all carry a SINGLE timestamp (exec 885026/885558/885737: 10 entries, 1 distinct timestamp each) — one write logged ten times by the append-only trigger. The "17.2 actions per document" figure is a logging artifact.'
  decide_is_correct:
    method: Extracted the LIVE 'Decide Shipment Action' / 'Decide GDoc Action' node source from the EXECUTING version (activeVersionId -> workflow_history.nodes, not the workflow_entity draft) and ran it against the real row JSON.
    result_over_181_fully_gated_open_docs:
      no_action_double: 94
      mark_completed: 45
      get_short_doc_id: 15
      update_name: 10
      other_extraction_actions: 17
    conclusion: 45 documents are decided mark_completed on every sweep and do not complete. The routing is right; the write is lost.
    worked_example:
      doc: doc_mshcwoo6dajvcn
      decide_returns: mark_completed
      every_gate_satisfied:
        COMPANY_DOC_ID: 21/136535
        SHORT_DOC_ID: '36535'
        NAME: טכנו איתן-36535
        DOC_TOTAL_AMOUNT: 13,659.00
        DOC_DATE: 01/04/2026
        all_seven_completion_flags: true
      observed: STATUS read TO_EXTRACT at 19:22 and MAX_ITERATIONS by 20:00 — the loop retired it DURING the investigation. A finished, correctly-decided document was killed instead of completed.
  where_the_write_dies:
    error: timeout exceeded when trying to connect
    stack: '@n8n/typeorm -> PostgresDriver.obtainMasterConnection (pg-pool)'
    significance: This is n8n's INTERNAL metadata database, not INDOX's Supabase. The pool is DB_POSTGRESDB_POOL_SIZE=25 per process against 16 worker slots.
    measured:
      driver_error_rate: 209 of 401 executions errored in 2h (52%)
      failing_nodes:
      - node: Get Line By ID
        failed_after_ms: 82610
        note: received 120 items from MAP ID, returned 0
      - node: Map ACTION_LINE
        failed_after_ms: 99354
      errors_by_workflow_60m:
        indox-v2 Upsert (central): 60
        Batch Upsert: 53
        Incoming Documents v2 (driver): 47
        Base Document Extraction: 38
      note: 113 of 279 errors (40%) are in the upsert chain itself
    corroboration: Independent workflow audit (issues/indox-workflow-audit-2026-08-10.yaml) found the write path is a 5-deep nested chain accounting for 19,228 of 42,808 executions (44.9% of the estate), with sampled failures overwhelmingly this same pool timeout. All sub-executions are mode='integrated', so each hop costs a postgres CONNECTION, not queue time.
    lock_leak: When 'Call INDOX UPSERT' fails, 'SB Unlock Doc' never runs and the doc_step lock leaks until its 600s TTL. 166 keys held at audit time, 97 later. This delays re-pickup but does not prevent it.
