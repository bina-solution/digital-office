  ## Final verified state 2026-08-11 2340z

  ```yaml
  headline: The duplication defect is fixed and measured. Landed duplicate actions went from a 2-hour window of 40 pairs to 24, live dispatch duplication from ~25 per 5-minute window to 14 of 548 pairs (2.6%) — and five of those eight are ONE stale batch execution (1019495) overlapping newer individual re-dispatches, not eight independent races. dup/doc 9.93 peak -> 1.13.
  the_single_biggest_throughput_fix:
    what: 'per-type extraction''s Gemini call: httpRequest -> executeWorkflow'
    before: InvoiceDocEx01 602s, ShipmentDocEx01 601s, on EVERY execution
    after: 2-4s
    why: 'The httpRequest hit /webhook/invoice_extractor with timeout:600000. A webhook call creates a NEW Bull job, but the caller already held one of 16 slots — so it waited for a slot that could not free until it finished, and burned the full 600s timeout every time. The Gemini extractor itself averages 18s; the transport was the entire cost. executeWorkflow runs INTEGRATED in the caller''s existing slot: no new job, no queue, no deadlock.'
    how_it_hid: BaseDocEx01 had ALREADY been converted and ran at 28s, but its node is still NAMED 'Extract Base via Webhook'. The stale name made two different transports look identical. A leftover scratch workflow, ZZAbGemProbe01 ('ZZ A/B Gem transport probe'), exists because someone previously A/B-tested exactly this.
  verified_landed:
  - processLock01 two-runs mutex — lock reply completeness 23.2% -> 100%
  - unlock moved INTO indox api > upsert (every action ends in an upsert)
  - lock TTL 600 -> 5400 — MUST stay above indoxV2Driver01's 3600s executionTimeout
  - driver rewired to POST the separated router; If2 / Execute Workflow / MAP ID1 / Dispatch Action Lines deleted
  - indoxV2ActionRouter01 created, webhook-registered — first real Bull parallelism (queue was wait=0 active=1 all night)
  - GETALL cap 20000 removed -> limit 100001 with CAP+1 so the guard is reachable
  - 'R1: indoxV2Upsert01 retired, volume -87%, zero callers'
  - FIELDS-aware AI cache — 42% hit rate measured, zero extra paid calls
  - autoheal + its liveness probe (the probe was 100% false-positive on rotated logs)
  - indox_execution_mode corrected all-in-one -> parallel-actions to match reality
  metrics_start_to_end:
    completed_per_hour: 12 -> 27
    errors_per_hour: 279 -> 37 (of which ~19 are our own deploy windows)
    single_value_extractors_per_hour: 47 -> 15
    extract_invoice_google_ai_per_hour: 119 -> 39
    highlight_coverage: 367/4402 (8%) -> 3078/3128 (98.4%)
    per_type_extraction: 601s -> 2-4s
    dup_per_doc: 9.93 -> 1.13
  still_open:
  - single-value extractors 15/hr and extract_invoice_google_ai 39/hr — target 0
  - 'LIKELY CAUSE, unverified: per-type writes AI_SHIPMENT_IDS but the gate reads SHIPMENT_DOC_ID — extraction works, the gate checks the wrong column. Same shape as the query_invoice_id case already fixed in that file.'
  - indoxDocBatchUpsert01 not retired; 11 callers still route through it
  - 6 uninvokable active workflows (whatsappApi01, gmailApiRouter01, JQExV3Order00001, indoxGmailActionProcessor01, sv3Inject3x001, IndoxInjectDemo01) — deactivation blocked by the permission classifier
  - 27 permanent doc_step locks (ttl=-1) — needs ioredis in the RUNNER image; n8n's Redis node has no EXPIRE NX and Code nodes run in runners where the library is absent
  - executionTimeout=3600 is configured on 5 workflows and does NOT enforce — driver observed at 19,525s
  - $('Companies') in 'If group action' references a node absent from the driver; the try/catch always returns true so the all-in-one branch has never executed (0 vs 1,070)
  corrections_i_had_to_make_to_my_own_diagnosis:
  - '''Execute Workflow was broken'' — WRONG. It resolved and ran successfully in 262/686 executions. The ''not active'' errors were our own import windows.'
  - '''the lock is bypassed everywhere'' — overstated. Check LOCKED ran in 387/686 and blocked ~125 passes; only the action lane skipped it.'
  - dup/doc built on execution_metadata.ids — WRONG SOURCE, truncated at 512 chars (~22 of 120 ids). Retracted.
  - '''started=364 ended=0'' — a measurement bug: those keys are HASHES, GET returns WRONGTYPE. Needs HGET.'
  - '''80 of 80 never picked up'' — WRONG, same truncation. They rank 1-2 in the pickup slices.'
  - '''per-type is starved'' — WRONG. Its queue was 612; base extraction''s was 6,743.'
  - '''worker-1 is idle'' — WRONG. A docker stats point sample; it had finished MORE jobs than worker-2.'
  - lock TTL retuned 5400 -> 1800 then REVERTED — the bound is the driver's 3600s timeout, not the chain p99.
  - removed the test-mode lock bypasses then REVERTED — they are a deliberate affordance, not the If2 anti-pattern.
