  done: true
- text: "Regression test: platform-base/n8n/test_compile_blame.mjs (11 checks; fails on the compiler as it was)"
  done: true
- text: "push <app> <wfId ...> compiles only what it pushes (and its dependencies), so a broken blueprint blocks only itself - needs the push cache's rows kept for what was not compiled"
