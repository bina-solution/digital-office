  ## Remaining

  1. The five OPEN gates need to READ .workflow.ts, not just be repointed. G64 shows why:
     after fixing its paths it still fails, because line 273 does

         blueprints[rel] = json.loads(p.read_text(encoding="utf-8"))

     on a TypeScript file. Every one of these gates wants the compiled workflow dict.
     There is exactly one compiler — `node platform-base/n8n/tooling/wrap.mjs compile <dir> <out>`,
     the same one `bbox n8n push` uses — so the fix is ONE shared reader in scripts/refactor/
     (load .json directly, compile .workflow.ts once per directory and cache), adopted by all
     six. Six private parsers is how this drifts again.

  2. Adopt incoming-documents-writer-lint into the canonical GATES list (verify it passes first —
     gates.sh's own convention is that adopting a red gate turns every lane red rather than
     fixing anything), and treat --verify-ci as blocking rather than informational.

  3. gates.sh should fail loudly when a gate reports ZERO inspected units. Every one of the five
     would have been caught the day the blueprints moved. "A gate that runs nowhere is
     documentation" (GATES.md) — these run everywhere and inspect nothing, which is worse,
     because they consume the attention a real failure needs.

  ## Related retirement debt

  Found while repointing G64: two workflows are RETIRED and inactive but still shipped and still
  referenced by live blueprints —

      indoxApiSupabase01  'indox api (RETIRED 2026-08-12 - id renamed to indoxApi01)'  active: false
      indoxApiRouter01    'indox api router (RETIRED 2026-08-12 - folded into indoxApiSupabase01)' active: false

  indoxApiRouter01 is still named by SyncApi0000000001, indoxHealth00001, indoxV2ActionsBS01,
  indoxV2BSTest01, indoxV2DocBaseTest01 and more; indoxApiSupabase01 by indoxDocGet01 and
  indoxV2ActionsGDoc01. They are not islands, so they cannot simply be deleted (see the project
  note on dead-node removal safety) — but a retired, inactive workflow that live blueprints still
  call is its own hazard, and it is what made the allow-list repoint above land on the wrong file
  at the first attempt.
