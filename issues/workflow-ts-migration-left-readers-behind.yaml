title: The .workflow.ts migration moved 96 blueprints and left EIGHT readers pointing at the JSON era
opened: '2026-08-21'
severity: high
status: in-progress
summary: |-
  Commit 52b32aa4 — "blueprints are code: 96 workflows as *.workflow.ts, JSON era removed" —
  moved every blueprint and parked the old JSON in legacy/blueprints-json-20260816/. Today:

      git ls-files apps/indox/blueprint/n8n/ | grep -c '\.json$'          -> 0
      git ls-files apps/indox/blueprint/n8n/ | grep -c '\.workflow\.ts$'  -> 70

  Eight consumers were never repointed. They were found one failure at a time over a single
  session on 2026-08-21, which is the reason this is filed as ONE issue: individually each
  looks like a small stale path, and together they are a migration that was not finished.
  Anyone landing a change of this shape should sweep the readers, not wait for the failures.

  The consumers do not fail the same way, and that is what made them hard to see:
    - some CRASH (FileNotFoundError)
    - some report "not found" AS A FINDING, so they look merely red rather than dead
    - one aborted a deploy path with a message that named the wrong cause
    - one refused a safety flip that was actually safe
description: |
  area: n8n blueprints / CI gates / deploy path
