  ## Still unproven needs clean window

  - THE 10:02-10:07 CLUSTER. Four changes, five minutes, one outcome. Nothing in the data can say whether the recovery came from re-activating BS/GDoc/Ship or from the v5 burst slice. A clean window means: change ONE of them, hold everything else, and watch COMPLETED count deltas for a full hour.
  - THE invoice_extractor REPAIR. Live for ~33 minutes at the time of writing and TYPED has not moved (9,171 at 11:28:26 and again at 11:30:58). This is the highest-value measurement outstanding: base extraction has been running at 1 event per document all night while the AI leg silently 404'd, so if typing does not recover now, the 404 was not the whole story.
  - THE 30s -> 2m POLL. Confounded by the worker restart and the BaseDocEx01 import within six minutes. Needs an hour where it is the only variable.
  - WHETHER THE 10:00 BURST IS THROUGHPUT OR TAIL-DRAIN. All ~41 completions were OLD documents; of 1,529 created today, ZERO have completed. Until a document ingested today completes, 47/hr is backlog drain, not pipeline throughput.
  - THE BaseDocEx01 API_TOOLS_ID PAIRING RISK. Still live (`$('Upload+OCR').item.json.file_id` plus combineByPosition). Never fixed, and the 10:28 deploy that was believed to fix it did not touch Select Base.
  - THE 523 ZOMBIE EXECUTIONS. 289 Incoming Documents v2 + 234 indox-v2 Actions — DOC BASE still in status='running' with oldest 07:21, never reaped by the worker restart. Unknown whether they still hold doc_step locks.

  ## Recommendations not actioned this lane

  - Cap `s_burst` with `where rn <= 40` like every other slice in the same query — it is the only unbounded one and it produced 65 base extractions per document.
  - Stop full-fleet re-imports. 82 publish batches in 48h, and every 'not active' burst maps to one. Publish only changed workflows.
  - Commit. 201 modified files and 202 untracked files across two days with zero commits means no lane can diff its own change against another's.
  - Raise N8N_EXECUTIONS_DATA_PRUNE_MAX_COUNT — 2000 is why the concurrency timeline cannot reach further back than 07:21 and why this verdict has a 4-hour execution window instead of 48.
