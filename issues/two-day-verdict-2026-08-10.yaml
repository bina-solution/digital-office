  ## Verdict

  ```yaml
  - change: 16 full-blueprint re-imports (63-81 workflows each), 08-09 11:45:22 -> 14:36:50; 82 publish batches over the 48h
    what_it_was: Repeated whole-fleet `import` pushes, ~1,100 workflow writes in under 3 hours
    evidence: |
      select to_char("createdAt",'YYYY-MM-DD HH24:MI:SS'), count(*), string_agg(distinct authors,',')
      from workflow_history where "createdAt" > now() - interval '48 hours' group by 1 order by 1;
      docker logs n8n-worker-1-shlomo-laptop --timestamps | grep -i "not active" | cut -c1-16 | sort | uniq -c
    measured: Every 'not active' spike coincides with an import minute (08-09 13:15/13:22/13:34/13:45/14:08/14:36; 08-10 01:09/03:07/04:14/04:16/09:49/10:05/10:06/10:07/10:24/11:20). 72 error executions carry the string. The 14:36:50 re-import is also the hour in which 4,624 rows had updated_at rewritten.
    effect_completed: not separable per-import, but zero completions across the whole 08-09 22:00 -> 08-10 09:59 stretch that these preceded
    effect_typed: no measurable gain
    effect_errors: direct cause of discrete error bursts, up to 36 in a single minute (10:05)
    verdict: HURT
    confidence: high
  - change: '`Get Changed Docs` v1/v2/v3 — pickup fairness (01:08:56, 01:54:42, 02:06:41)'
    what_it_was: Replaced `order by updated_at asc limit 40` with a multi-slice weighted pick. Diagnosis in the node comment is well-evidenced and correct.
    evidence: first-completion series per hour; Extract Base Doc events vs distinct docs per hour
    measured: 'COMPLETED/hr for the eight hours after v3: 02 -> 1, 03 -> 0, 04 -> 1, 05 -> 0, 06 -> 0, 07 -> 0, 08 -> 0, 09 -> 0. Churn in the v1 hour: 1,130 Extract Base Doc events over 124 docs (9.11x).'
    effect_completed: 0/hr before, 0.25/hr after — no change
    effect_typed: AI values (DOC BASE) first-stamps 0,0,0,5,2,0,0,2 for hours 01-09 — no change
    effect_errors: not measurable (no execution data before 07:21)
    verdict: NO EFFECT
    confidence: high
    note: The fix addressed a real starvation defect but did not move the outcome, because a second blocker (the invoice_extractor 404) was downstream of it and unaddressed.
  - change: Execution-throughput recovery at ~08:55-09:00
    what_it_was: Not a change. No workflow, setting or schema edit landed between 04:17:34 and 09:40:05.
    evidence: workflow_history gap 04:17:34 -> 09:40:05; executions/10min 08:50 = 60 -> 09:00 = 3,086; dmesg -T global OOM kills at IDT 10:27:06 / 11:30:09 / 11:32:13 = UTC 07:27 / 08:30 / 08:32
    measured: executions/hr 241 (08:00) -> 13,588 (09:00); still 0 completions and ~2 typings in the whole 09:00 hour
    effect_completed: none — zero completions in the 09:00 hour despite 11,808 successful executions
    effect_typed: 2 documents
    effect_errors: errors/hr rose 56 -> 1,237 (volume-driven)
    verdict: UNPROVEN
    confidence: high
    note: UNATTRIBUTABLE to any change by construction. The OOM-release mechanism is plausible and consistent with the 08:44-08:59 error burst, but is not proven.
  - change: '`Get Changed Docs` v4 — finisher slice (09:49:10), and indoxV2TailDrain01 created (09:40:05)'
    what_it_was: Five capped slices s_fin/s_live/s_new/s_old/s_adj, each `rn <= 40`; plus a new every-5-min gated backfill workflow
    evidence: errors/10min; BaseDocEx01 per-10min error rate; first-completion series
    measured: errors/10min 183 (09:30) -> 294 (09:40) -> 337 (09:50), the day's peak. BaseDocEx01 error rate 71/200 = 36% (09:30) -> 170/382 = 44.5% (09:50). Completions still zero. 'not active' x12 at 09:49-09:50.
    effect_completed: 0 -> 0
    effect_typed: no measurable gain
    effect_errors: +154 per 10 min across the deploy window
    verdict: HURT
    confidence: medium
    note: The two changes are 9 minutes apart and share the measurement window; the error rise cannot be split between them, and part of it is the publish itself (see deploy churn).
  - change: 10:01:47-10:07:09 cluster — indoxV2ActionsBS01 activate (10:02:30), `Get Changed Docs` v5 burst priority (10:05:17), indoxV2ActionsGDoc01 activate (10:05:45), import (10:06:32), indoxV2ActionsShip01 activate (10:07:09)
