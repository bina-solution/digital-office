summary: 'Read-only reconstruction of the last 48h across the codebase/workflow changelog and the concurrency timeline, correlated. Headline: COMPLETED was flat for THIRTEEN hours (2026-08-09 21:15 -> 2026-08-10 10:05 UTC), not eight; the three overnight `Get Changed Docs` fairness rewrites (01:08/01:54/02:06) produced ZERO completions in the eight hours that followed; the 09:00 execution-throughput recovery cannot be attributed to any change because no change landed between 04:17:34 and 09:40:05; completions restarted inside a five-minute window (10:02:30-10:07:09) containing four separate changes and CANNOT be attributed to one of them. Deploy churn is confirmed as an active harm, not a suspicion: every single "Workflow is not active and cannot be executed" spike in the worker logs lands exactly on an import/activate timestamp. The current COMPLETED rate is 47/hr and TYPED is at ZERO.'
description: |
  As first recorded — category: throughput · status: analysis-only

  SCOPE AND METHOD.

  Window: 2026-08-08 11:05 UTC -> 2026-08-10 11:31 UTC. All times UTC unless marked IDT.
  Both databases run TimeZone=UTC (verified: `select now(), current_setting('TimeZone')` on
  supabase-db-shlomo-laptop -> UTC, and on n8n-postgres-shlomo-laptop -> Etc/UTC). Host
  `dmesg -T` prints IDT (UTC+3); repo file mtimes are IDT. Both are converted below.

  THREE MEASUREMENT CONSTRAINTS FOUND FIRST, BECAUSE THEY BOUND EVERY CLAIM THAT FOLLOWS.

  (1) THE GIT CHANGELOG IS EMPTY. There are ZERO commits in the last five days.
      `git log --since='5 days ago'` returns nothing; HEAD is 73cd73b7 dated 2026-08-05T08:25:02
      on branch platform-os-refactor. Everything that happened in these 48 hours is
      UNCOMMITTED: `git diff HEAD --shortstat` = 201 files changed, 25,743 insertions(+),
      12,165 deletions(-), plus 202 untracked files (`git ls-files --others --exclude-standard
      | wc -l`). The repo-side changelog below is therefore reconstructed from file mtimes
      (`find . -type f -newermt '2026-08-08 11:00' -printf '%TY-%Tm-%Td %TH:%TM %p\n'`), not
      from commits. This is itself a finding: there is no reviewable history for two days of
      work by many lanes.

  (2) THE EXECUTION TIMELINE CANNOT COVER 48 HOURS. n8n retains only 36,751 executions and the
      OLDEST is 2026-08-10 07:21.
        select min("startedAt"), max("startedAt"), count(*) from execution_entity;
        -> 2026-08-10 07:21 | 2026-08-10 11:08 | 36751
      Cause is retention config, not a gap in activity:
        docker -H unix:///run/bbox-docker.sock exec n8n-shlomo-laptop sh -c 'env | grep EXECUTIONS'
        -> N8N_EXECUTIONS_DATA_PRUNE=true, N8N_EXECUTIONS_DATA_PRUNE_MAX_COUNT=2000,
           N8N_EXECUTIONS_DATA_MAX_AGE=168, EXECUTIONS_MODE=queue
      MAX_COUNT=2000 is doing the pruning, not MAX_AGE=168h. So per-hour executions/errors/p50/p99
      exist ONLY from 07:21 today. Any claim about execution concurrency before 07:21 is
      unavailable from n8n and is not made here.

  (3) BOTH OBVIOUS COMPLETION CLOCKS ARE UNUSABLE, AS BRIEFED — CONFIRMED, WITH NUMBERS.
      * updated_at is a "last touched" stamp, not an event time. `touch_updated_at()` is
        `begin new."updated_at" = now(); return new; end` on BEFORE UPDATE FOR EACH ROW, so every
        step rewrites it. The mass rewrite is real and locatable:
          select to_char(date_trunc('hour',updated_at),'MM-DD HH24'), count(*)
          from incoming_documents where updated_at > now() - interval '48 hours' group by 1;
          -> 08-09 14 | 4624      (next largest bucket is 08-09 23 | 2149)
        4,624 rows share the 08-09 14:00 hour. That is the ~4,500 the brief warned about, and it
        coincides with the 14:36:50 mass re-import.
      * The ACTION_LOG stamp covers only 23% of completed rows:
          select count(*) filter (where "STATUS"='COMPLETED'),
                 count(*) filter (where "STATUS"='COMPLETED' and "ACTION_LOG" ~ 'STATUS COMPLETED, [0-9]{13}')
          from incoming_documents;   -> 6274 | 1464       (23.3%)
        Note the marker is the literal `STATUS COMPLETED`, NOT `mark_completed` — a search for
        `mark_completed` returns 0 rows. Format is `<label>, <epoch_ms>, <execution_id>`, e.g.
        `STATUS COMPLETED, 1786287786680, 466098`.

      SO THE TWO CLOCKS ARE USED FOR DIFFERENT JOBS, AND NEITHER IS USED FOR THE OTHER'S JOB:
        LEVEL and RATE come from `count(*) filter (where "STATUS"='COMPLETED')` sampled at two
        wall-clock times (the delta method the brief asked for).
        SHAPE (which hour did work happen in) comes from the anchored ACTION_LOG regex
        `'STATUS COMPLETED, ([0-9]{13})'`, deduplicated to the FIRST stamp per document.
        The shape series UNDERCOUNTS by construction (23% coverage) and is never used to state a
        rate. Where the two disagree, the count delta wins and the disagreement is stated.
        A generic `[0-9]{13}` regex is NOT safe — it matches document IDs and yields garbage
        (max came back as 09-29 07:40, a date that does not exist yet). Only the anchored form
        is used.

  ── THE FLAT LINE: 13 HOURS, NOT 8 ───────────────────────────────────────────────────────
  First-completion stamps per hour (anchored regex, min stamp per doc):
    08-09 15 -> 301,  16 -> 127,  17 -> 24,  18 -> 0,  19 -> 0,  20 -> 42,  21 -> 10,
    08-09 22 -> 0, 23 -> 0, 08-10 00 -> 0, 01 -> 0, 02 -> 1, 03 -> 0, 04 -> 1,
    05 -> 0, 06 -> 0, 07 -> 0, 08 -> 0, 09 -> 0, 10 -> 36(first)/40(last), 11 -> 7(last only)
  The last real completion before the stall is in the 08-09 21:00 hour; the live
  `Get Changed Docs` node comment independently records "COMPLETED/hr -> 0 (last stamp 21:15)".
  The first completion after it is at 10:05-10:10 on 08-10 (5-minute bucket). That is
  13 hours of flat line with two strays (02:xx, 04:xx), NOT the ~8 hours in the brief.

  The LEVEL is corroborated by an independent snapshot from another lane:
  issues/n8n-error-census-2026-08-09.yaml records COMPLETED "has not moved from 6,243 for over
  two hours" at ~23:00 on 08-09. Measured now: 6,272 at 11:07:49 and 6,278 at 11:30:58. So
  6,243 -> ~6,231 -> 6,278: flat overnight (it actually DIPPED slightly, as rows left COMPLETED
  for DOUBLE/MERGED), then a burst. The brief's "~6,225" is inside this range.

  ── THE CURRENT RATE IS 47/HR, AND TYPED IS ZERO ─────────────────────────────────────────
  Two snapshots 152 seconds apart:
    11:28:26.929  COMPLETED 6276 | TYPED 9171 | TO_EXTRACT 6611
    11:30:58.941  COMPLETED 6278 | TYPED 9171 | TO_EXTRACT 6608
  +2 COMPLETED in 152s = 47.4/hr, which matches the briefed "~50/hr".
  TYPED did not move AT ALL. The typing pipeline is at zero right now, and the
  `AI values (DOC BASE)` first-stamp series says it has been near zero since 08-09 21:00
  (231/hr at the 08-09 15:00 and 16:00 peak; 5, 2, 0, 0, 2, 7, 4 for 08-10 05,06,07,08,09,10,11).
  Of the 1,529 documents created today, 920 carry a TYPE and ZERO have reached COMPLETED:
    select count(*), count(*) filter (where "TYPE" is not null and "TYPE"<>''),
           count(*) filter (where "STATUS"='COMPLETED')
    from incoming_documents where created_at >= '2026-08-10 00:00:00+00';   -> 1529 | 920 | 0
  Every completion in the 10:00 recovery burst was an OLD document. Nothing ingested today has
  finished.

  ── THE SIX `Get Changed Docs` REWRITES (the brief says three; there are six) ─────────────
    select h."versionId", h."createdAt", md5(n::text), length(n::text)
    from workflow_history h, jsonb_array_elements(h.nodes::jsonb) n
    where h."workflowId"='indoxApiSupabase01' and n->>'name' ilike '%Get Changed Docs%'
    order by h."createdAt";
  md5 of the node body is constant (92c36c23, 3628 chars) for every one of the 16 re-imports
  from 08-09 11:45 through 08-09 23:21, then changes six times:
    v1  08-10 01:08:56  ad13078e  7232   replaces `order by updated_at asc limit 40`
    v2  08-10 01:54:42  5b74bdf3  7972   "fixes the SECOND plug, which v1 ..."
    v3  08-10 02:06:41  53cd3b9a  9350
    v4  08-10 09:49:10  1c75df8b 12117   finisher slice: s_fin/s_live/s_new/s_old/s_adj,
                                          EACH capped `where rn <= 40`, jitter floor(epoch/30)
    v5  08-10 10:05:17  eb1231c5 15266   ADDS s_burst `rn * 1.0 - 1000.0` and s_stale
    v6  08-10 10:24:23  5f4b1923 16261   jitter floor(epoch/30) -> floor(epoch/120)
  The live "Poll Line Changes" scheduleTrigger is now `minutesInterval: 2`, so the 30s -> 2m
  change is real in both the trigger and the query's jitter bucket.

  THE DEFECT INTRODUCED BY v5. Every other slice is guarded `where rn <= 40`. `s_burst` is not,
  and its key starts at -1000, so it sorts ahead of everything and can consume the entire
  `limit 40` window by itself. The consequence is measurable as extreme re-work:
    select date_trunc('hour', to_timestamp(m[1]::bigint/1000.0)), count(*), count(distinct "ID")
    from incoming_documents d, regexp_matches(d."ACTION_LOG",'Extract Base Doc, ([0-9]{13})','g') m
    group by 1;
  events / distinct docs / events-per-doc:
    08-09 09..17  -> 1.00 to 1.10       (healthy baseline)
    08-10 01      -> 1130 / 124  = 9.11  (v1 hour)
    08-10 04      ->  662 / 134  = 4.94
    08-10 09      ->  341 /  70  = 4.87
    08-10 10      -> 2411 /  37  = 65.16 (v5 hour)
  65 base extractions per document. ~98% of the work in the 10:00 hour was redundant.

  ── DEPLOY CHURN IS CONFIRMED HARM, NOT A SUSPICION ──────────────────────────────────────
  82 distinct publish batches in 48h (`select "createdAt", count(*) from workflow_history
  where "createdAt" > now() - interval '48 hours' group by 1`), including SIXTEEN full-blueprint
  re-imports of 63-81 workflows each between 08-09 11:45:22 and 08-09 14:36:50 — roughly 1,100
  workflow writes in under three hours.

  The "Workflow is not active and cannot be executed" error is real (72 error executions contain
  the string), but the brief's framing is WRONG in an important way. It is not a persistent stale
  publish state that was repaired at 10:00-10:07. It is TRANSIENT and IMPORT-INDUCED, it recurs on
  every publish, and it recurred AFTER the supposed repair. Timestamped from the worker logs
  (`docker logs n8n-worker-2-shlomo-laptop --timestamps | grep -i "not active" | cut -c1-16 | uniq -c`):
    09:49 x11, 09:50 x1, 10:05 x36, 10:06 x18, 10:07 x1, 10:24 x32, 11:20 x2
  and on worker-1 (log survives back to 08-06):
    08-09 13:15 x5, 13:22 x10, 13:34 x20, 13:45 x5, 14:08 x5, 14:36 x4,
    08-10 01:09 x5, 03:07 x4, 04:14 x32, 04:16 x4
  EVERY ONE of those minutes is an import/activate timestamp from workflow_history. There is not a
  single "not active" spike that does not coincide with a publish. The 10:05/10:06/10:07 burst is
  caused BY the activate operations, not cured by them — and 10:24 and 11:20 prove the condition
  was still being re-created after the "repair".

  ── WHAT RESTARTED THROUGHPUT AT 09:00 — NOTHING WE DID ──────────────────────────────────
  Executions per 10 minutes (execution_entity):
    07:20-08:30  10, 2, 32, 34, 6, 156, 5, (08:30 bucket absent = zero)   ALL with 0 successes
    08:40  14 (10 ok, 4 err)      <- first successes of the day
    08:50  60 (2 ok, 52 err)      <- error storm as the wedged calls fail
    09:00  3086 (2949 ok)         <- recovery
  The wedge is visible as executions that entered `running` and never left. 289 executions of
  Incoming Documents v2 and 234 of indox-v2 Actions — DOC BASE are STILL in status='running',
  oldest 07:21, and were never reaped.
  NO WORKFLOW OR SETTING CHANGE LANDED BETWEEN 04:17:34 AND 09:40:05. The gap in
  workflow_history is unambiguous. Therefore the 09:00 recovery is NOT attributable to any
  change in this changelog. The most likely mechanism is runtime: three global OOM kills of the
  apitools gunicorn workers at 07:27, 08:30 and 08:32 (dmesg IDT 10:27:06, 11:30:09, 11:32:13,
  all `global_oom` / CONSTRAINT_NONE) released the calls the wedged executions were blocked on,
  which then failed (the 08:44-08:59 error burst) and let the queue drain. That mechanism is
  PLAUSIBLE BUT UNPROVEN and is recorded as such.
  A FOURTH OOM kill not in the brief: dmesg IDT 12:28:47 = 09:28 UTC, `CONSTRAINT_MEMCG`
  (container-limited, not global), again killing apitools gunicorn.
  Both apitools and incoming-documents report `OOMKilled=true` with `RestartCount=0` — the
  gunicorn CHILDREN were killed, PID 1 survived, which is exactly why Docker went on reporting
  the containers healthy.

  ── CORRECTIONS TO TWO BRIEFED LANDMARKS ─────────────────────────────────────────────────
  * "n8n-worker-1 wedged from 08:19 until restarted ~10:29, Docker reported it healthy" —
    CONFIRMED. `docker inspect n8n-worker-1-shlomo-laptop` StartedAt = 2026-08-10T10:29:23.795Z,
    RestartCount=0, health=healthy. But note the wedge starts EARLIER than 08:19: the first
    never-finishing executions start at 07:21.
  * "BaseDocEx01 / Select Base pairing fix at ~10:28" — MISATTRIBUTED. Diffing the 03:53:12 and
    10:28:40 versions node by node, the ONLY delta is that `Lock Map Set (retry scope)` was
    ADDED. `Select Base` is byte-identical across the two (md5 ac865430dfdc6837af895378ee85d535,
    9029 chars, both versions). The `Select Base` rewrite actually landed at 03:53:12
    (b2a41061 6787 chars -> ac865430 9029 chars). The added node is a Redis dead-letter scope
    publisher whose own note says BaseDocEx01 "is the largest single error source in the fleet
    (532 errors/hour, all 'Upload+OCR timed out')".
    The pairing RISK is nonetheless real and STILL LIVE: `Call JQExV3 Base` reads
    `$('Upload+OCR').item.json.file_id` (paired lookup) and `Merge Local + AI (Base)` uses
    `combineByPosition`; the new node even encodes the doubt, setting its value to
    `{{ $input.all().length === 1 ? $json.ID : '' }}` — i.e. it only trusts identity when the
    batch is exactly one item. Unfixed, and not what shipped at 10:28.

  ── THE invoice_extractor 404 IS THE BEST-EVIDENCED SINGLE CAUSE OF THE TYPE STALL ───────
  `Extract Base via Webhook` in BaseDocEx01 POSTs to http://n8n:5678/webhook/invoice_extractor
  with `onError: continueRegularOutput` — so a 404 is swallowed and the branch returns nothing.
  indoxV2ExtractInvoiceGemini01 (the workflow that owns that webhook path) has its FIRST
  execution of the entire retained window at 10:58:
    select min("startedAt"), count(*) from execution_entity
    where "workflowId"='indoxV2ExtractInvoiceGemini01';   -> 10:58 | 20
  Meanwhile base extraction was running all night at 1 event per document
  (08-10 02 -> 122/122, 03 -> 84/84, 05 -> 40/40, 06 -> 48/48, 07 -> 143/143, 08 -> 293/293)
  while `AI values (DOC BASE)` first-stamps were 0-5 per hour. That is the exact signature of a
  leg that runs, silently gets nothing back, and lets the document through untyped. The webhook
  is registered NOW (`select "webhookPath", method, "workflowId" from webhook_entity` ->
  invoice_extractor | POST | indoxV2ExtractInvoiceGemini01).

  ── SETTINGS AND SCHEMA ──────────────────────────────────────────────────────────────────
  Only ONE public.settings row changed in the 48h window:
    select key, updated_at from settings where updated_at > now() - interval '5 days'
      order by updated_at desc;
    -> sync_registry | 2026-08-09 23:54:48.134586+00
  Explicitly NOT changed, contrary to the brief's suspicion: `indox_execution_mode` is still
  "all-in-one" with updated_at 2026-07-30 23:45:11, and `activePrioritySync` is still false with
  the same 07-30 timestamp. Neither has been touched in eleven days.

  Triggers on incoming_documents (5, none internal): trg_incdoc_action_log_append,
  trg_incdoc_mirror_warehouse_upd, trg_incdoc_mirror_warehouse_ins, trg_incdoc_touch,
  trg_stats_dirty. The append-only one is new: scripts/ops/migrations/
  2026-08-10_action_log_append_only.sql, mtime 13:31 IDT = 10:31 UTC today. Its own header
  records the defect it fixes — ~40 router "Build:" nodes rebuild the row with
  includeOtherFields:false and write '' back over ACTION_LOG, erasing one-shot loop breakers;
  "only 8 of 380 rows in the retry cohort still carried the marker; 322 of them sat at
  EXTRACTION_FAILED with an ACTION_LOG of ~2 characters, re-entering extract_base_doc on every
  sweep forever."
  CAVEAT THAT AFFECTS EVERY MEASUREMENT ABOVE: the trigger has been live only since ~10:31, so
  ACTION_LOG history BEFORE 10:31 was still erasable by those writers. That is the most likely
  reason stamp coverage is only 23%, and it means the shape series undercounts EARLIER hours
  more than later ones. It also caps the column at 6,000 chars with a trimmed middle
  (`left(merged,1500) || ' ...[trimmed]... ' || right(merged,4000)`), so very long logs lose
  their middle — currently 0 rows are affected.

  ── ONE NEW WORKFLOW IN 48 HOURS ─────────────────────────────────────────────────────────
    select id, name, active, "createdAt" from workflow_entity
    where "createdAt" > now() - interval '48 hours';
    -> indoxV2TailDrain01 | indox-v2 Tail Drainer (gated backfill) | t | 2026-08-10 09:40:05
  Schedule trigger `minutesInterval: 5`. It has run 13 times since 10:01, of which 2 succeeded
  and 8 are still stuck in `running`. It is not yet doing useful work.

