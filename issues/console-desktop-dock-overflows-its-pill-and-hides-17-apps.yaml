  - { text: "Owner decision — what the overflow surface is: the existing grouped launcher grid (renderHome/app-management) vs pinned(≤6)+recent(≤5) per the rail spec's P6. DECIDED 2026-10-05: the grouped launcher grid behind one door.", done: true }
  - { text: "Implement the slot budget in `buildDock()`: `slots = floor((dockWidth - padding - sep - overflowTile) / (tile + gap))`, tiles `flex:0 0 46px`, always render the overflow tile when `N > slots`, re-fit from a `ResizeObserver` (and on `refresh()`), never on a timer. DONE 2026-10-05 (dock-budget.js + buildDock, rebuilt on resize).", done: true }
  - { text: "Give `.dk-dock` a real overflow policy so content can never paint outside the pill: `overflow:hidden` (or the measured budget alone), plus a `mask-image`/fade affordance at the clipped edge if anything is still clipped. DONE differently and on purpose: the budget alone, measured, with no clip - see the resolution note.", done: true }
  - { text: "Add the missing measurement as a gate: a headless probe at 1294/1440/1512/1920/2560 with desktop mode forced on, asserting `dock.scrollWidth <= dock.clientWidth + 1` and `every tile rect > 0`, and wire it into `scripts/refactor/run-gates.py` (today nothing covers desktop.css — G27 targets exclude it, layering-lint skips /static/). DONE 2026-10-05 as scripts/refactor/dock-fit-lint.py + scripts/ui-coverage/dock-fit.py, WARN mode for one release; the assertion is the ROW against the pill content box, not scrollWidth, which also counts the tooltip and the door badge by design.", done: true }
  - { text: "Cover desktop mode in the UI map (`scripts/ui-coverage/capture.py` never sets `do-desktop`), or record in `ai/context/platform-navigation-design.md`/PORT-PLAN why it cannot be. STILL OPEN - the capture gap is untouched by this fix.", done: false }
