  ## Defects fixed this session

  ```yaml
  - id: postgres-cpu-cap
    finding: n8n-postgres pinned at cpus:'1' and sitting at 102% of that core — the ceiling under everything
    fix: 3 cores (owner's number), synchronous_commit=off, effective_cache_size 3GB -> 1500MB, pg_stat_statements installed
    result: CPU 102% -> 1-15%; postgres is no longer the limiter
    caution: Raising max_worker_processes 2->8 and max_parallel_workers 2->4 alongside it hit the 2GiB cgroup ceiling 44,149 times and crash-recovered the DB. Reverted to 2/1/2. HOST HAS NO MEMORY HEADROOM.
  - id: gemini-extractor-rejecting-everything
    finding: Check Doc Bytes read n8n's filesystem-backed binary marker 'filesystem-v2' (13 chars) as base64 -> every document measured 9 bytes -> under MIN_BYTES 1024 -> rejected. 1,073 of 1,073.
    result: 0/1073 accepted -> 1060/1073; cache rows 4-in-4h -> 91-in-17min; 9/10 replayed documents field-for-field identical
  - id: doc-id-had-no-producer
    finding: NOTHING wrote DOC_ID. Zero nodes assign it, live or draft. Filled once by a 2026-08-06 migration. Coverage 93.6% on 08-05, 0.0% every day from 08-07.
    fix: Producer restored in Select Per Type Values (GDoc + Ship), fill-only, cross-contamination gated
    remaining: 1,336 historical gaps; 1,050 of them have COMPANY_DOC_ID on the row. Backfill APPROVED by owner.
  - id: batch-commit-barrier
    finding: extract_base_doc committed once per BATCH after every sub-call returned, against a 3600s executionTimeout. BaseDocEx01 p50 ~300s, so batches >10 could not finish; whole batches discarded INCLUDING successes. 'canceled' never fires the error workflow, so nothing was recorded — 93.9% of 7,259 documents had never recorded a failure.
    fix: Commit-per-document + Record Base Doc Failure; cancellations 23/20min -> 0
  - id: drive-redownload
    finding: 91.8% of downloads redundant (1,214/hr over 100 files, 636.9MB for 42MB unique, worst file 112x). The /docExists short-circuit keyed on API_TOOLS_ID = md5(file_content) — unknowable before download, and NULL on 88% of TO_EXTRACT rows.
    fix: Content-addressed cache on Google's own md5Checksum; cold 2,037ms -> warm 699ms; ~595MB/hr egress saved
  - id: apitools-alignment-cpu
    fix: 'find_texts_matching_annotations_via_alignment: per-box geometry cache + axis-aligned fast reject + direction-aware prefilter; CPU -69 to -76%, 72 category-runs byte-identical'
  - id: pickup-unreachable-statuses
    finding: 2,516 documents in statuses decide has forward paths for that eligibility never admitted; the reaper minted NEEDS_REVIEW, a status pickup treated as terminal, at ~100/hr
    fix: Bounded rotating recovery slice; terminal-status exclusion (MAX_ITERATIONS was taking 25% of every pickup); reaper re-queues to TO_EXTRACT with backoff; width 40->120; poll 2m->5m as one knob; stamped-DOUBLE fenced out of the finisher slices (507 of 653 finishers were guaranteed no-ops)
  - id: schema-dollar-quoting
    finding: incdoc_action_log_append added with `as $$`, which pg-promise rejects; schema.sql applies as ONE transaction so it failed the entire schema apply — a fresh install would come up with no schema
    fix: Single-quoted body, proven md5-identical to the deployed function
  ```

  ## Open defects

  - _cfg never reaches decide: __CFG() reads $('Companies') (unreachable in decide mode) then falls back to _cfg, which nothing sets. So max_actions_per_doc and old_document_months_back have ALWAYS used hardcoded fallbacks — the OLD cutoff enforces 24 months while settings say 6 (267 out-of-scope open documents, 2.7%).
  - 13 of 17 completion flags stamp on ATTEMPT not ANSWER. Worst: PER_TYPE_EXTRACTION_COMPLETED 1,234 of 1,774 stamped-but-empty (69.6%).
  - indoxV2Driver01/If2 tests $execution.mode != 'test', unconditionally true in production, so every action respawns a full driver execution (2.17x). The fix branch has NEVER run in production and flipping it would COLLAPSE throughput — see lane finding below.
  - Extract * via Webhook is a synchronous POST to n8n's OWN webhook: the caller holds a worker slot while waiting for one. 68.4% of extractor latency is queue wait (30.2s p50, 141.1s p90).
  - mark_completed has no required-field gate in the GDoc/Shipment routers (bsDecide checks hasAllRequiredFields) — 1,368 documents COMPLETED while missing required fields.
  - SELECTION_COMPLETED written ={{ true }} unconditionally, overriding a conditional finalScore>0 above it.
  - Gemini cache key is invoice:<md5(bytes)> with NO FIELDS component — 700 of 1,476 invoice cache rows carry an empty AI_DOC_AMOUNT. Latent until the Check Doc Bytes fix made caching work; now live.
  - GETALL reads the whole table with LIMIT 20000 and Guard Get Size throws above it; corpus 16,808 = 84% of that ceiling. Fix is keyset pagination, NOT a bigger cap.
  - Dead-letter leaky: 345 rows past RETRY_COUNT 5, 152 with NEXT_RETRY_AT NULL i.e. still dispatchable.
  - ACTION_LOG is not a usable attempt counter: 2,537 of 2,693 stuck documents show zero Extract Per Type markers despite carrying the stamped flag.

  ## Design decisions confirmed by owner

  - LOCK SKIP IS CORRECT BY DESIGN — a lock collision means another main workflow already owns that row. An efficiency diagnosis recommended re-enabling the disabled Snooze deferral; that recommendation is WRONG and must not be actioned.
  - DOUBLE -> MERGED approved for the 554-606 confirmed duplicates.
  - DOC_ID backfill approved (migration precedence, fill-only).
  - bbox indox CLI stays a PLAN — not to be implemented yet.

  ## Instrumentation corrections

  - completed overstated by 1,368 partially-complete rows -> watchdog now reports `fully` too
  - stalled2h counts queue-blocked callers, not failures — 175 in flight against 16 real Bull slots
  - TTL divided open by completion rate and ignored intake -> now reports GROWING(out N < in M)
  - base-extraction rate counted touches, not population -> reported a false 20x; now a population delta
  - a watchdog edit referenced NOWS before assignment, writing '|count' lines and printing 'warmup' forever — broken instrumentation reads exactly like a quiet system
