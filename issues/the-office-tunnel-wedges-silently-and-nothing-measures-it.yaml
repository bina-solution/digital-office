    done: true
  - text: "The same for a published router/alias host: it cannot live in the compiler (a compile must not need DNS — offline machines, `.localhost`, CI); it belongs to the step that already asks every published host over HTTP (`converge`'s health step) — done 2026-10-06: `_no_answer` prints a name with no DNS record, a refused connection and a timeout as three different things, where all three were `URLError`"
    done: true
  - text: "Re-converge hp-laptop when it returns (its machine refuses SSH on 192.168.16.104:2222) so it learns the new port — obsolete: hp-laptop is a PAIRED office since 2026-10-05 (no SSH between the offices, by the owner's order); the pair carries its own port in its own record"
