  - text: "Render `state_error` as a cause class + details instead of the raw class name — done 2026-10-06: the cause class is `verdict.hop` (tunnel / office / door) with its one Hebrew sentence (`verdict.why`, said once in dgo-extend and shown as given by the console); what the pull ended with is a detail after it"
