    done: false
  - text: "Decide whether recursion is wanted at all, or whether detect-and-report is the permanent answer"
    done: false
  - text: "If recursing: add a per-pipe max_depth to sync_registry (default 1) and to the fixture's config keys"
    done: false
  - text: "Re-check the six production folders for subfolders after any client-side reorganisation"
    done: false
