title: 'Oversize scans stall the whole pipeline: the size guard caps BYTES but the cost is PIXELS. 151MP pages exhaust host memory, OOM-kill services, and their completed work is discarded.'
opened: '2026-08-11'
severity: high
status: in-progress
summary: 'A cohort of very large scans entered the upload queue. apitools decodes each page locally (OCR itself is remote -- OCR_ENGINE=google), so a 10330x14609 page costs ~453MB of RAM regardless of how small the file is. At APITOOLS_MAX_CONCURRENT_OCR=8 that is ~3.6GB, on a host with 9.95GB total. The host reached 100% swap, three containers were OOM-killed, n8n execution throughput collapsed from 359/min to 9/min, and the document pipeline stalled completely: base extraction 0/hr, typed flat, COMPLETED flat for four consecutive watchdog ticks.'
description: |
  id: indox-apitools-oversize-decode-oom-2026-08-11
  As first recorded — opened: 2026-08-11T03:30Z · status: mitigated-root-fix-outstanding

  ## The defect in one line

  The oversize policy caps FILE SIZE at 10MB and is enforced at download; the resource cost is PIXEL COUNT. A 10330x14609 TIFF compresses to well under 10MB and decodes to ~453MB, so the very largest pages sail straight past the guard built to stop them.

