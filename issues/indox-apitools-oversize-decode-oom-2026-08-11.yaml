  ## Fixes applied

  ```yaml
  - id: n8n-timeout
    where: indoxV2UploadApiTools01
    change: Document OCR2 timeout 120000 -> 600000; Check HASH timeout 30000 -> 120000
    why: Both timeouts were SHORTER than the work, so every large document failed maxTries=5 times while apitools completed the decode each time. We paid for ~453MB of decode five times and discarded every result. Upload went 0/22 success to 43/45.
    tradeoff_that_was_missed_at_the_time: The 120s timeout had been KILLING those decodes early and thereby freeing the memory. At 600s they run to completion and hold ~453MB five times longer. This change is correct for throughput but it INCREASED memory pressure, and that was not foreseen when it was made. It should not be reverted -- reverting returns to discarding completed work -- but it must be paired with a bound on concurrency or on decode size.
  - id: apitools-concurrency
    change: APITOOLS_MAX_CONCURRENT_OCR 8 -> 4 (plus APITOOLS_OCR_WEIGHT_LARGE_MP=25, MEDIUM_MP=10)
    result: apitools resident memory 3.86GiB -> 589MiB (-85%), still at ~100% CPU. Host load 33 -> 7.65, swap began draining.
    principle: Under swap pressure the machine goes FASTER by doing LESS at once. Raising concurrency here is the wrong direction and was proposed twice before being disproven.
  ```

  ## Root fix still outstanding

  ```yaml
  - id: downsample-before-decode
    priority: highest
    rationale: OCR does not need 151MP; Document AI has its own input limits and ~300 DPI is ample for text. Capping the working resolution (long edge ~4000px, or a 16-24MP ceiling) cuts the per-decode footprint roughly 6-10x. It is the ONLY lever that makes the host less loaded rather than rationing what is left, and it fixes latency and memory together.
  - id: guard-on-pixels-not-bytes
    rationale: Move the existing 10MB rule to a pixel/megapixel ceiling, read from the file header before decoding (cheap). The rule is right in spirit and wrong in unit.
  - id: segregate-large-documents
    rationale: 343 documents over 5MB should not be able to block 6,664 at 1.42MB average. A separate low-concurrency lane with long timeouts keeps the bulk flowing.
  ```

  ## Why raising apitools max concurrent ocr cannot help

  ```yaml
  detail: 'Weight is per-document: <=6MP -> 1, <=16MP -> 2, >16MP -> max(1, max_slots). For oversized pages THE WEIGHT IS DEFINED AS THE POOL SIZE, so raising the pool raises the weight and the contention is scale-invariant. Confirmed twice. The owner''s note that "there is no ocr work we use google engine" does NOT rescue the argument, because the cost being incurred is LOCAL IMAGE DECODE, not the remote OCR call.'
  ```

  ## Operational lesson about parallel agents

  ```yaml
  what_happened: Four investigation subagents were run concurrently on a host already 4GB into swap. That pushed it to 100% swap, cost ~40 minutes of degraded throughput (COMPLETED flat for four ticks), and at the worst point a plain `docker inspect` timed out. Stopping three lanes freed ~3.5GB and restored both memory and observability -- the agents were a LARGER share of the pressure than apitools.
  rule: On this 6-core / 9.95GB host, more than ~2 concurrent investigation lanes produces LESS work, not more. Check free memory and swap before fanning out, not after.
  ```

  ## Measurement traps hit while diagnosing this

  - getent hosts <service> returns UNRESOLVED from inside the n8n containers even when that service is being called hundreds of times a minute. Do NOT use it as a DNS test; make an actual HTTP call.
  - LIKE '%"timeout": 600000%' on workflow JSON returns false because the stored JSON has no space after the colon. PARSE the nodes, do not pattern-match them. Four false readings tonight came from string-matching JSON.
  - execution_entity rows, Bull active entries, and ACTION_LOG document-touches are THREE DIFFERENT UNITS and do not convert into each other. A 'collapse' from 300/hr to 92/hr was purely a units error between executions and document-touches.
  - Bull's active list holds only ENTRY-POINT jobs. Nested executeWorkflow calls run integrated inside the parent's slot, so a workflow can appear to hold 12 of 16 slots for 17 minutes while hundreds of nested executions complete underneath. That is the architecture, not a blockage.
  - A workflow that is starved looks identical to one that is failing if you only count starts. Always break down by status.
