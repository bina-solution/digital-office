    chain: When Called -> "Determine Action" (batch normalize + stateful dedup census, writes doc._dup) -> "Set decide mode (docbase)" -> "Call router_doc_base (decide)" [= indoxV2ActionsGlobal01 in mode=decide, node "Decide DOC BASE Action"] -> "Route By Type" -> {__route_bs__ | __route_gdoc__ | __route_shipment__ | fallback} -> per-type decide -> "Decided".
    consequence: 'EVERY document passes through "Decide DOC BASE Action" first, unconditionally. The per-type decides are only reached when docBaseDecide returns null AND resolveDocType() maps TYPE to a known lane. That single fact explains most of the backlog geometry: a document blocked at the company/name/type gates never reaches its per-type decide at all.'
  delivery_paths:
  - id: P1
    name: 2-minute narrow poll (PRIMARY)
    where: indoxApiSupabase01 / trigger "Poll Line Changes" (every 2 minutes) -> node "Get Changed Docs" (postgres, id=indox-poll-q) -> node "Process Changed Doc" -> indoxV2Driver01
    budget: LIMIT 40 per poll (= 1,200 dispatch slots/hour)
    admits_by_status:
    - IN_PROGRESS
    - TO_EXTRACT
    - null
    - ''
    also_admits:
    - any row with updated_at > now() - interval '150 seconds' (the burst window)
    - any row in the (COMPANY_ID, DOC_ID) collision subquery
    hard_excludes:
    - coalesce(STATUS,'') = 'MERGED'
    - NEXT_RETRY_AT in the future, unless STATUS='ACTION_RESTART'
    slices:
    - s_burst(6)
    - s_fin
    - s_live
    - s_new
    - s_old
    - s_stale
    - s_adj
    note: The `or "STATUS" = 'ACTION_RESTART'` clause is in the NEXT_RETRY_AT conjunct only. It removes a backoff block; it does NOT admit the status. See finding F3.
  - id: P2
    name: hourly whole-corpus sweep — BROKEN
    where: indoxV2Driver01 / "Schedule Trigger" (hours=1, at minute 5) -> "GETALL Req" ({INLINE_ACTION:'GET_ALL'}) -> "Call INDOX GETALL" -> indoxApiRouter01 -> indoxApiSupabase01 "PG Get All"
    query: select * from public.incoming_documents where "ID" <> '__bootstrap__' order by "ID" limit 20000       -- NO status filter at all
    guard: node "Guard Get Size", CAP = 20000, throws rather than truncating
    status: 'FAILING. Both trigger-mode driver executions in the retained window errored: exec 818825 (12:05:42Z, 502s) and exec 837800 (13:05:52Z, 82s), both with lastNodeExecuted = "Call INDOX GETALL" and error.message = "Task execution aborted because runner became unresponsive". 16,410 rows x ~40 columns cannot cross the executeWorkflow boundary into a task runner. 2 of 2 observed = 100% failure.'
    why_it_matters: This is the ONLY path that ever delivered MISSING_COMPANY_ID / MISSING_TYPE / NEEDS_REVIEW / EXTRACTION_FAILED / UNKNOWN_COMPANY / API_TOOLS_FAILED / ACTION_RESTART / ACTION_REQUIRED / MISSING_LINK to decide. With it down, those statuses receive ZERO visits per hour.
    headroom: 16410 / 20000 = 82.1% of CAP. Even if fixed, it dies for good at 20k rows.
  - id: P3
    name: 5-minute tail drainer (gated backfill)
    where: 'indoxV2TailDrain01 / "Every 5 min" -> "Pick Drain Candidates" (LIMIT 25) -> "Driver: Run By ID" -> indoxV2Driver01'
    predicate: TYPE in ('INVOICE','SHIPMENT','ORDER') AND STATUS not in ('COMPLETED','MERGED','DOUBLE','OLD','GARBAGE','PAUSE','MAX_ITERATIONS','ACTION_RESTART') AND lower(PER_TYPE_EXTRACTION_COMPLETED) = 'true' AND COMPANY_DOC_ID not shared across companies AND ID not in indox_dupid_targets_20260810
    measured_reach_2026-08-10T13:57Z:
      TO_EXTRACT: 35
