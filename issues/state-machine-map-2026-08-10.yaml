  ## Proposal

  ```yaml
  principle: 'A status must answer exactly one question: WHERE IS THIS DOCUMENT IN THE PIPELINE? It must never encode (a) which stage failed — that is REQUIRED_ACTION/ERROR, (b) how the pipeline is feeling — that is monitoring, (c) an operator preference — that is a flag. Every status the machine writes must be one the machine can read back. The invariant to enforce: *a status the pickup does not admit may only be written by a gate that is provably final for that document.*'
  canonical_set:
  - status: QUEUED
    means: delivered, not yet worked
    replaces:
    - TO_EXTRACT
    - 'NULL'
    - ''
    pickup: admitted
    rows_today: 6973
  - status: WORKING
    means: the machine owns it; some stage is incomplete
    replaces:
    - IN_PROGRESS
    - MISSING_COMPANY_ID
    - UNKNOWN_COMPANY
    - MISSING_TYPE
    - MISSING_LINK
    - EXTRACTION_FAILED
    - API_TOOLS_FAILED
    - ACTION_REQUIRED
    - ACTION_RESTART
    - NEEDS_REVIEW
    - MISSING_SHIPMENT
    - MISSING
    pickup: admitted
    why: Every one of these is "the machine has not finished". WHICH stage is blocked is already fully recoverable from the completion flags and the value columns — decide re-derives it from scratch on every visit and never trusts the status anyway (the status only appears in decide as a `!==` guard to avoid rewriting the same value). Deleting them loses no information the machine uses.
    rows_today: 2582
  - status: DONE
    means: finished
    replaces:
    - COMPLETED
    pickup: adjudication slice only
    rows_today: 6321
  - status: RETIRED
    means: final, machine-decided, no human owed
    replaces:
    - OLD
    - GARBAGE
    - MAX_ITERATIONS
    - MERGED
    pickup: excluded
    discriminator: RETIRED_REASON in (old_date, garbage, iteration_budget, merged_into)
    rows_today: 392
  - status: REVIEW
    means: final for the machine, a human decision is owed
    replaces:
    - DOUBLE (confirmed)
    - genuinely-unresolvable documents
    pickup: excluded
    discriminator: REVIEW_REASON in (double_confirmed, unresolvable)
    rows_today: 307
    note: This is the ONLY legitimate human-review pile, and it must be entered by a DECISION about the document (adjudication said 'two real candidates, pick one'), never by a timer.
  result: 19 statuses -> 5. Every one of the five is either admitted by pickup or provably final by a decision about the document.
  what_moves_out_of_STATUS:
  - was: PAUSE
    becomes: HOLD boolean column
    why: operator preference, no writer in the estate (F11), orthogonal to pipeline position
  - was: ACTION_RESTART
    becomes: RESET_REQUESTED_AT timestamp
    why: an operator INTENT, not a position. decide reads `RESET_REQUESTED_AT > flags_stamped_at` to re-open gates; pickup admits it because the row is WORKING, which fixes F3 without a status at all
  - was: NEEDS_REVIEW
    becomes: deleted; the reaper writes STALLED_SINCE and emits a metric
    why: F2 — a latency alarm belongs in monitoring, and the document stays WORKING so it keeps being retried
  - was: MISSING_* / *_FAILED
    becomes: REQUIRED_ACTION text (already written) + the completion flags (already written)
    why: no consumer reads them as state; the dashboard reads them for display and can read REQUIRED_ACTION instead
  decide_structure:
    shape: |-
      One ordered list of (guard, action) rules over DATA ONLY. No rule may test STATUS except the four terminal gates (RETIRED, REVIEW, DONE, HOLD). Every gate becomes:
        if (<value is absent>) {
          if (<attempted recently && bounded>) return no_action_backoff;
          return <resolver action>;
        }
      i.e. presence of the ANSWER is the gate, and the flag is only a rate limiter.
    concrete_rules:
    - delete the four `update_status_*` -> `no_action_awaiting_*` pairs (D8/D9, D11/D12, unknownTypeAction 3/4, bsDecide 1/2). A document with no company is simply still WORKING with a resolver that has run out of attempts; the status write bought nothing and cost delivery.
    - make every completion flag answer-conditional at the WRITE site (the 'Select Base Values' pattern), and make every gate read `(!flag || isBlank(value))` at the READ site. Belt and braces, because 13 flags have to be corrected across six workflows.
    - give each resolver a bounded attempt counter (ATTEMPTS_<stage>) and terminalise to REVIEW at the bound, instead of terminalising to a status that merely stops delivery.
    - delete the 7 dead switch outputs and add a `no_action_delete_row` rule (or drop the branch — it is unreachable).
    - rename the 5 misnamed Build nodes so ACTION_LOG is truthful.
    - add IRRELEVANT and CENTRALIZED_INVOICE to resolveDocType, or make the default lane explicit.
  pickup_structure:
  - eligibility becomes `STATUS in ('QUEUED','WORKING') or (STATUS='DONE' and <needs adjudication>)`. Four terminal values are excluded and nothing else is.
  - the hourly GET_ALL sweep is deleted, not repaired (F4). It cannot survive 20k rows and it duplicates what a status-driven pickup already does.
  - the reaper stops writing STATUS. It writes STALLED_SINCE and increments a counter; the document stays WORKING and keeps being picked up.
  migration_path_driven_by_the_machine:
    constraint: no bulk UPDATE on incoming_documents; the state machine drives its own rows
    method: Ship the collapse as a decide-side ALIAS plus a state-machine-driven rewrite. No row is edited by hand; each row rewrites its own status on its next visit.
    steps:
    - step: 1
      name: widen eligibility (the owner's draft), so every legacy status is deliverable
      effect: 2,002 documents start moving; 614 still bounce
      risk: none to data — the predicate can only add rows
    - step: 2
      name: make the flag gates value-aware (F6) and delete the self-cancelling pairs (F7)
      effect: the remaining 614 start moving; 306 legacy query_* dispatches (F5) stop being needed
    - step: 3
      name: stop the reaper writing STATUS (F2)
      effect: ~100 rows/hour stop being removed from the machine
    - step: 4
      name: add the alias layer
      detail: decide gains `const S = canon(doc.STATUS)` where canon() maps the 19 legacy values onto the 5 canonical ones, and every gate tests S. Writers start emitting canonical values. Pickup admits BOTH vocabularies during the overlap. A legacy row is rewritten to its canonical value the first time it is visited for any other reason — the machine migrates itself, one document per visit.
    - step: 5
      name: after the legacy counts reach zero, delete the alias and the legacy branches
    no_document_can_be_stranded:
      argument: The mapping is total and order-preserving, and every collapse is toward a MORE deliverable state, never a less deliverable one.
      row_by_row:
      - '6,973 QUEUED-class rows: already admitted, unchanged.'
      - '2,582 WORKING-class rows: currently 0-eligible; after step 1 they are admitted. Strictly more delivery, never less.'
      - '6,321 DONE rows: keep the adjudication slice verbatim, so double detection is unaffected.'
      - '392 RETIRED rows: currently excluded (MERGED, OLD, GARBAGE, MAX_ITERATIONS). Excluded after. Unchanged — except MAX_ITERATIONS, where the 94 rows with a company AND a type should be re-admitted once by the step-2 rebuild before the budget is re-applied on a corrected counter (F12).'
      - '307 REVIEW rows: currently excluded and unreachable. After: still excluded, but now visible in a named review queue with a REVIEW_REASON, which is the first time the product can act on them.'
      - '35 PAUSE rows: become HOLD=true and STATUS=WORKING. They stay out of dispatch via the HOLD flag, so behaviour is identical, but they regain a status the machine understands.'
      - '59 ACTION_RESTART rows: become WORKING + RESET_REQUESTED_AT. They gain delivery they do not have today (F3).'
      invariant_check: No canonical value is less deliverable than the legacy value it replaces. Since strandedness is exactly 'not deliverable and not final-by-decision', and the mapping never reduces deliverability while every newly-final value (RETIRED, REVIEW) is entered only by an existing decision gate, no currently-live document can be stranded by the collapse.
  measurable_acceptance:
  - 'rows in a status with eligible_now = 0 and provable forward work: 2,002 -> 0'
  - 'NEEDS_REVIEW arrivals/hour: ~100 -> 0'
  - 'legacy Query* executions/hour: ~88 -> 0 (as a CONSEQUENCE of the flag fix, not by deleting the workflows)'
  - 'stamped-but-empty completion flags: >3,000 -> 0 on new writes'
  - 'hourly trigger-mode driver failures: 2/2 -> 0/0 (the trigger is deleted)'
  - 'distinct STATUS values in the table: 19 -> 5'
