    node: indoxV2ActionsGlobal01 / 'Adjudicate Merge'
    rules:
    - '1 live candidate -> promote: DOUBLE -> IN_PROGRESS, stamp {merge_sig, merge_key, promoted:true}. 1,045 historical firings.'
    - <=1 distinct real HASH in the group -> MERGE (same-hash tier)
    - exactly 2 rows agreeing on TYPE + DOC_DATE + amount (blank agrees with anything) -> MERGE
    - 'otherwise -> confirm: winner keeps STATUS + gets MERGE_CANDIDATES; every loser gets STATUS=''DOUBLE'' + the same context. 396 confirm-double + 291 confirm-keep firings.'
    - a doc-id appearing under >=3 distinct companies is QUARANTINED (never auto-adjudicated) and stamped merge_sig:'none', unadjudicable
    winner_selection: most _COMPLETED flags true, then STATUS='COMPLETED', then oldest created_at, then lowest ID
    merge_write: indoxApiSupabase01 / 'Build Merge Write' — `update ... set STATUS='MERGED', MERGED_INTO=$1, ACTION_LOG=$2 where ID=$3`. NEVER deletes.
    dead_end: The confirm branch is the only verdict with no downstream consumer. 307 rows sit in confirmed-DOUBLE with a full MERGE_CANDIDATES snapshot and no workflow, UI action, or query that resolves them. 229 of the 320 have a company and a type — i.e. they are real, adjudicated, evidence-complete documents waiting on a human decision that the product has no surface for.
  interaction_with_pickup:
