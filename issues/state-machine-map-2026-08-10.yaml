    - shape: dedup snapshot — {idMatch, hashMatch, compShortDocMatch, match, matchedId}
      written_by: 'docBaseDecide D2 -> ''Action: Handle Doubles'' -> ''Build: ... (DOC BASE)1'''
      example_count: 10 rows with one particular value; ~325 rows total in this shape
    - shape: adjudication record — {merge_sig, merge_key, kept, promoted|MERGE_CANDIDATES, unadjudicable}
      written_by: indoxV2ActionsGlobal01 / 'Adjudicate Merge'
      count: 1624
    merge_key: '`${COMPANY_ID}\u0001${bizDocId}` — the business identity the group was adjudicated under. bizDocId = DOC_ID or COMPANY_DOC_ID, rejected if <3 alnum chars, all-zeros, equal to COMPANY_ID, or in (''unknown'',''action_required'',''null'',''none'').'
    merge_sig: '`sort(join(''|'', ID+'':''+HASH))` over the candidate group — the group''s COMPOSITION. Re-adjudication fires only when the signature changes.'
    silencing_rule: docBaseDecide treats the gate as satisfied only when merge_sig is present AND merge_key === the row's CURRENT bizKey. If extraction later corrects DOC_ID, the key changes and the gate legitimately re-fires.
