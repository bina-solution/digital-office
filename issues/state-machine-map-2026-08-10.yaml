  - 'consequence: once adjudicated, a row leaves the dup arm permanently. Combined with STATUS=''DOUBLE'' not being an admitted status, the 307 confirmed doubles are unreachable — which is correct for a review queue and wrong for a status the machine is supposed to own.'
