      UNKNOWN_COMPANY: 0
      ACTION_RESTART: 0
      MISSING_LINK: 0
      ACTION_REQUIRED: 0
    verdict: 46 rows total. P3 is not a rescue lane for any blocked status; it is a tail-finisher for typed, per-type-complete documents.
  conclusion: Effective delivery today = P1 only. Fifteen of nineteen statuses have no working path back into the machine.
  ```

  ## Status vocabulary legend

  ```yaml
  class:
    transient: the machine is expected to leave it on its own
    terminal_by_design: intended to be final
    terminal_by_accident: not intended to be final, but nothing can move it
    absorbing_operator_only: only a human/UI write can move it
    unreachable_action: the code can write it, but no decide branch emits the action that reaches the writer
    read_only_or_test_only: read or seeded, never written by the live machine
  eligible_now: measured against the LIVE Get Changed Docs predicate at 14:01:10Z
  ```

