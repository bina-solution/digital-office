  ## Decide logic

  ```yaml
  entry: indoxV2ActionsGlobal01 / 'Decide DOC BASE Action' (code, id=dbdecidehead01), live version 41afcdbe
  preamble:
  - 'TEXT-boolean normalisation: every string value equal to ''true''/''false'' (case/space-insensitive) is coerced to a real boolean, because every *_COMPLETED column is TEXT and the literal string ''false'' is truthy in JS. Measured at the time of the fix: FIGURE_COMPANY_COMPLETED=''false'' on 878 rows, COMPANY_NAME_COMPLETED=''false'' on 911, FIGURE_TYPE_COMPLETED=''false'' on 874.'
  - _dup arrives from indoxV2Decide01 'Determine Action' and is deleted from the output.
  docBaseRouterDecide:
    gates_in_execution_order:
    - n: 1
      cond: '!normDoc.ID'
      action: no_action_delete_row
      doc_type: '''empty'''
      reachable: NO — pickup requires ID is not null and <> ''; measured 0 rows with an empty ID
      routing_defect: DEAD *and* UNHANDLED. 'no_action_delete_row' IS in indoxV2Driver01 Switch1's output-0 action list, so it routes to the DOC BASE lane — but the '3a. DOC BASE Actions Switch' has no rule for it, so it falls to fallbackOutput 17 = 'Stop and Error - Unhandled DOC BASE ACTION'. If it ever fired it would hard-error the driver. Also note DOC_TYPE:'empty' while driver Switch1 output 3 tests DOC_TYPE==='empty_row' — a second, separate mismatch.
    - n: 2
      cond: normDoc.STATUS === 'MERGED'
      action: no_action_merged
      reachable: no via P1 (pickup excludes MERGED); yes via a direct per-type call
      correct: true
    - n: 3
      cond: SOURCE_TYPE contains 'GMAIL' && SOURCE_ID present && ACTION_LOG lacks 'Apply Gmail Labels' && !__mergePending && (typed || TYPE='GARBAGE' || (no type && STATUS in [MISSING_TYPE,EXTRACTION_FAILED,GARBAGE,MAX_ITERATIONS]))
      action: apply_gmail_labels
      reachable: partly — the failure arm keys on 4 statuses pickup will not deliver, so only the `_typed` arm fires in practice (776 ACTION_LOG hits)
    - n: 4
      cond: SOURCE_TYPE='GOOGLE_DRIVE_FOLDER' && SYNC_NAME && CONNECTION && LINK && ACTION_LOG lacks marker && STATUS in [MISSING_TYPE,EXTRACTION_FAILED,GARBAGE,MAX_ITERATIONS,NEEDS_REVIEW]
      action: file_to_failed_folder
      reachable: NO in practice — every one of those five statuses is undeliverable. 74 NEEDS_REVIEW rows satisfy the predicate; 3 are eligible. 177 ACTION_LOG hits, all historical.
    - n: 5
      cond: TYPE === 'GARBAGE' (A5)
      action: 'STATUS===''GARBAGE'' ? no_action_garbage : update_status_garbage'
      reachable: yes for the no_action arm; the update arm is stranded for 12 rows (9 NEEDS_REVIEW + 3 ACTION_REQUIRED)
    - n: 6
      cond: STATUS === 'MAX_ITERATIONS'
      action: no_action_max_iterations
    - n: 7
      cond: count(/\d{13}/g in ACTION_LOG) >= max_actions_per_doc (default 50)
      action: mark_max_iterations
      note: 14 firings in the last hour; see the MAX_ITERATIONS entry for the counter concern
    - n: 8
      cond: docBaseDecide(...) returns non-null
      action: see docBaseDecide below
    - n: 9
      cond: otherwise
      action: resolveDocType(TYPE) -> __route_gdoc__ | __route_shipment__ | __route_bs__ | unknownTypeAction(doc)
    resolveDocType:
      SHIPMENT: shipment
      INVOICE: gdoc
      ORDER: gdoc
      BALANCE_SHEET: bs_doc
      everything_else: unknown
      unmapped_types_in_live_data:
        IRRELEVANT: 4 rows (3 MISSING_TYPE, 1 MISSING_COMPANY_ID) — falls into unknownTypeAction and loops back to MISSING_TYPE forever
        CENTRALIZED_INVOICE: 0 rows today, but it IS in the gmail-label `_typed` list and NOT in resolveDocType — a latent mismatch
      ai_type_adoption: docBaseRouterDecide promotes AI_TYPE to TYPE when TYPE is blank/UNKNOWN/UNKNWON. 43 rows currently qualify.
  docBaseDecide:
    branches_in_order:
    - id: D1
      name: business-key adjudication gate
      cond: dup.bizKey present
      sub:
      - unstamped && (dup.bizCollision || STATUS==='DOUBLE') -> resolve_double
      - unstamped && no collision -> bizAdjudicated=true (silences the weak SHORT_DOC_ID detector for this row)
      - stamped && STATUS==='DOUBLE' -> no_action_double
      - stamped otherwise -> bizAdjudicated=true
      reachability: resolve_double fired 1,045 (promote) + 396 (confirm-double) + 291 (confirm-keep) times historically; only 13 rows still owe adjudication
    - id: D2
      cond: dup.match && !bizAdjudicated
      action: 'STATUS===''DOUBLE'' ? no_action_double : update_status_double'
    - id: D3
      cond: STATUS === 'PAUSE'
      action: no_action_paused
    - id: D4
      cond: LINK && !BASE_EXTRACTION_COMPLETED
      action: extract_base_doc
      note: the busiest branch in the system — 10,893 ACTION_LOG hits, 44 in the last hour
    - id: D5
      cond: LINK && isBlank(API_TOOLS_ID) && ACTION_LOG lacks 'BASE APITOOLS RETRY'
      action: extract_base_doc
      note: one-shot rescue for the 412 rows with BASE_EXTRACTION_COMPLETED but no API_TOOLS_ID
    - id: D6
      cond: '!COMPANY_ID && ((!FIGURE_COMPANY_COMPLETED) || STATUS===''ACTION_RESTART'') && LINK'
      action: figure_company_id
    - id: D7
      cond: '!COMPANY_ID && NAME && ACTION_LOG lacks ''FIGURE COMPANY OFFLINE'''
      action: figure_company_offline
      note: 254 ACTION_LOG entries recorded 'FIGURE COMPANY OFFLINE MISS c=0' — it ran and found nothing, and the marker then permanently disables it
    - id: D8
      cond: '!COMPANY_ID && STATUS !== ''MISSING_COMPANY_ID'''
      action: update_status_missing_company
    - id: D9
      cond: '!COMPANY_ID (else)'
      action: no_action_awaiting_company_id
      classification: SELF-CANCELLING
      trapped_rows: 203
    - id: D10
      cond: isBlank(COMPANY_NAME) && ((!COMPANY_NAME_COMPLETED) || STATUS==='ACTION_RESTART')
      action: get_company_name
    - id: D11
      cond: isBlank(COMPANY_NAME) && STATUS !== 'UNKNOWN_COMPANY'
      action: update_status_unknwon_company
      note: typo preserved end-to-end (decide, switch key, node name)
    - id: D12
      cond: isBlank(COMPANY_NAME) (else)
      action: no_action_awaiting_company_name
      classification: SELF-CANCELLING
      trapped_rows: 15
    - id: D13
      cond: anyOldDate([DOC_DATE, BS_LINE_DATE, AI_DOC_DATE, SELECTED_DOC_DATE]) || anyOldDate([TIMESTAMP])
      action: 'STATUS!=''OLD'' ? update_status_old_doc : no_action_old_date'
    - id: D14
      cond: fallthrough
      action: null (proceed to type routing)
  unknownTypeAction:
  - cond: '!FIGURE_TYPE_COMPLETED || STATUS===''ACTION_RESTART'''
    action: figure_document_type
  - cond: API_TOOLS_ID && !AI_EXTRACTION_COMPLETED
    action: extract_invoice_google_ai
  - cond: STATUS !== 'MISSING_TYPE'
    action: update_status_missing_type
  - cond: else
    action: no_action_unknown_document_type
    classification: SELF-CANCELLING
    trapped_rows: 80
  invoiceDecide:
    terminal_guard: STATUS==='MERGED' -> no_action_merged; STATUS==='DOUBLE' && merge_sig -> no_action_double
    gdocHead:
    - cond: STATUS === 'ACTION_RESTART'
      action: restart_gdoc
      reachable: NO — pickup delivers 0 ACTION_RESTART rows
    - cond: COMPANY_DOC_ID && SHORT_DOC_ID !== last5(COMPANY_DOC_ID)
      action: get_short_doc_id
    - cond: NAME !== `${COMPANY_NAME}-${SHORT_DOC_ID}`
      action: update_name
    - cond: isBlank(FROM_OFFICE_CHECK)
      action: check_from_office
    body:
    - cond: linkMissing && !SEARCH_IN_DRIVE_COMPLETED && SHORT_DOC_ID && COMPANY_NAME
      action: find_link
    - cond: linkMissing && !isBsLine && STATUS!=='MISSING_LINK'
      action: update_status_missing_link
    - cond: linkMissing && !isBsLine (else)
      action: no_action_link_not_found
      classification: SELF-CANCELLING
    - cond: isBlank(API_TOOLS_ID) && !API_TOOLS_ID_COMPLETED
      action: get_api_tools_id
    - cond: STATUS!=='COMPLETED' && API_TOOLS_ID && !PER_TYPE_EXTRACTION_COMPLETED
      action: extract_per_type
    - id: THE LEGACY EXTRACTOR BRANCH
      cond: API_TOOLS_ID (i.e. per-type already stamped, or STATUS==='COMPLETED')
      actions:
      - '!INVOICE_ID && !INVOICE_ID_COMPLETED -> query_invoice_id'
      - '!DOC_DATE && !DOC_DATE_COMPLETED -> query_doc_date'
      - '!DOC_TOTAL_AMOUNT && !DOC_TOTAL_AMOUNT_COMPLETED -> query_doc_total_amount   (invoice/order only)'
      - '!PURCHASE_ID && !PURCHASE_ID_COMPLETED -> query_purchase_id'
      - '!SHIPMENT_DOC_ID && !SHIPMENT_ID_COMPLETED -> query_shipment_id'
      see: findings.F5
    - cond: '!AI_EXTRACTION_COMPLETED'
      action: extract_invoice_google_ai
    - cond: '!COMPANY_DOC_ID && (INVOICE_ID || AI_DOC_ID)'
      action: update_company_doc_id
    - cond: EXTRACT_SHIPMENT_COMPLETED !== true
      action: action_extract_shipment_ids
    gdocTail:
    - cond: STATUS!=='COMPLETED' && !SELECTION_COMPLETED && PRIORITY_SYNC_COMPLETED!==true
      action: select_invoice_values
    - cond: cfg.activePrioritySync && !PRIORITY_SYNC_COMPLETED
      action: action_priority_sync
    - cond: STATUS !== 'COMPLETED'
      action: mark_completed
    - cond: else
      action: no_action_already_completed
  shipmentDecide:
    same_as_invoice_except:
    - no MISSING_LINK dead-end (a linkless shipment is legitimate)
    - no query_doc_total_amount branch — so the GDOC switch's output 14 is emitted only on the invoice/order side
    - resolves COMPANY_DOC_ID from SHIPMENT_DOC_ID or AI_SHIPMENT_IDS[0], with or without a link
    - linkMissing && !SEARCH_IN_DRIVE_COMPLETED && !(SHORT_DOC_ID && COMPANY_NAME) -> no_action_link_not_found
  bsDecide:
    branches:
    - cond: '!COMPANY_ID && STATUS!==''MISSING_COMPANY_ID'''
      action: update_status_missing_company
    - cond: '!COMPANY_ID (else)'
      action: no_action_awaiting_company_id
      classification: SELF-CANCELLING
    - cond: STATUS==='ACTION_RESTART'
      action: restart_balance_sheet
      reachable: NO — 0 ACTION_RESTART rows delivered
    - cond: API_TOOLS_ID && !PER_TYPE_EXTRACTION_COMPLETED && BS_EXTRACTION_VERIFIED!==true && STATUS!=='COMPLETED'
      action: extract_per_type
    - cond: '!BS_EXTRACTED_LINES && !BS_EXTRACTED_LINES_COMPLETED'
      action: extract_balance_sheet
    - cond: '!BS_EXTRACTED_LINES && BS_EXTRACTED_LINES_COMPLETED && STATUS!==''EXTRACTION_FAILED'''
      action: update_status_extraction_failed
    - cond: '!BS_EXTRACTED_LINES (else)'
      action: no_action_extraction_failed
      classification: SELF-CANCELLING
    - cond: '!BS_EXTRACTION_VERIFIED'
      action: update_status_extraction_failed / no_action_extraction_failed
    - cond: '!BS_LINK_DOCUMENTS_COMPLETED'
      action: link_documents
    - cond: STATUS!=='COMPLETED' && hasAllRequiredFields(bs_doc)
      action: mark_completed
    - cond: STATUS==='COMPLETED'
      action: no_action_already_completed
    - cond: else
      action: no_action_unhandled_state
    note: bsDecide is the ONE decide with no dead branches and no unhandled actions — its switch handles all 13 emitted actions plus __unhandled_action__. It is the model the other three should follow.
  no_action_semantics:
    proven_from: live connections of indoxV2ActionsGlobal01 (41afcdbe)
    fact: 'Every no_action_* output of ''3a. DOC BASE Actions Switch'' terminates in a noOp node with NO downstream connection: No Action: Double, Paused, Old Date, Awaiting Company ID1, Awaiting COMPANY_NAME, Unknown Document Type, MAX_ITERATIONS, Merged, Garbage — all have `main: []`.'
    consequence: 'A no_action_* verdict writes NOTHING. updated_at is not bumped (trg_incdoc_touch only fires on UPDATE), so the row does not re-enter the 150-second burst window and goes permanently quiet. THAT is the mechanism behind "self-cancelling": the gate does not merely decline to act, it removes the row from the only remaining delivery path.'
  ```

