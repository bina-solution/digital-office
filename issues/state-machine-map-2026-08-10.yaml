    - node: 'indoxV2ActionsGlobal01 / Build: Call ''Incoming Document Batch Update'' - STATUS MISSING_COMPANY_ID (DOC BASE)1'
      writes: DOUBLE
    - node: 'indoxV2ActionsGDoc01|Ship01 / Build: Call ''Incoming Document Batch Update'' - STATUS COMPLETED1'
