title: INDOX document state machine — complete map, proven against the live stack, plus the minimal canonical state machine it should collapse into
opened: '2026-08-10'
category: bug
severity: critical
status: open
summary: 'The status column has 19 live values. The 2-minute pickup admits FOUR of them. The hourly whole-corpus sweep that was the only delivery path for the other fifteen has been failing 2/2 in the observable window ("Task execution aborted because runner became unresponsive" at Call INDOX GETALL). The 5-minute tail drainer reaches 46 rows total. Net effect: 3,163 of 16,410 documents (19.3%) are in a status the machine cannot re-enter, and 2,002 of those have provable forward work. NEEDS_REVIEW is the largest single block (1,177 rows, growing ~100/hour, +100 during the four hours this map was measured). It is not a document verdict: 910 of 1,177 were written by ONE postgres node, "Terminalize Stalled", which fires every 2 minutes and parks any row whose updated_at is older than 6h — a statement about the PIPELINE''s latency stamped onto the DOCUMENT''s status column, in a value pickup will not re-deliver. It was introduced net-new on 2026-07-07 by an agent-co-authored commit; it is NOT part of the original Phase-3 status enum and it replaced nothing.'
description: |
  ## Snapshot

  ```yaml
  taken_at_utc: '2026-08-10T14:01:10.845919Z'
  host: hacohen-vps stack on shlomo-laptop (WSL Ubuntu, docker -H unix:///run/bbox-docker.sock)
  table: public.incoming_documents
  total_rows: 16410
  note: Counts drift while the pipeline runs. Every per-status number below comes from the 14:01:10Z snapshot unless a different timestamp is stated inline. NEEDS_REVIEW was 1077 at 13:20Z (owner's figure), 1079 at 13:35Z, 1104 at 13:44Z, 1128 at 13:50Z, 1158 at 13:53Z, 1174 at 13:58Z, 1177 at 14:01Z — that growth curve is itself a finding, not measurement noise.
  ```

  ## Method

  ```yaml
  principal_used: 'All incoming_documents queries were run as role `postgres` on database `postgres` inside supabase-db-shlomo-laptop. That is the SAME principal the pipeline uses: node "Get Changed Docs" carries credential `INDOX Supabase Postgres` (id yY8FYvp6Kz86pt2t), and pg_stat_activity shows the n8n containers (172.18.0.x) connected as `postgres`. Not supabase_admin, not the PostgREST `authenticator` role.'
  live_vs_draft: workflow_entity.nodes is the DRAFT. The executing definition is workflow_history.nodes WHERE versionId = workflow_entity.activeVersionId. Every decide/routing claim below was read from workflow_history at the activeVersionId listed in `topology.live_versions`. Where the repo blueprint differs from live, the difference is called out explicitly (see `owner_draft_in_progress`).
  eligibility_proof: The eligibility predicate was lifted VERBATIM out of the live "Get Changed Docs" query and re-run as a LEFT JOIN against the full table, so `eligible_now` per status is a measurement, not an inference.
  decide_replay_validation: The SQL replay of docBaseDecide's gate order (used to compute "what would decide do with this row") independently reproduced the owner's own two measurements — 203 of 526 MISSING_COMPANY_ID and 80 of 164 MISSING_TYPE in the self-cancelling trap — to the row. That is the calibration proof for every replay figure here.
  ```

