title: The hourly full-table sweep fails every single run. n8n hardcodes maxStalledCount:0, so one expired Bull lock kills the job with zero retries.
opened: '2026-08-11'
severity: high
status: in-progress
summary: indoxV2Driver01's Schedule Trigger (hourly, at minute 5) is the ONLY entry point that reads the whole incoming_documents table. Every scheduled run in the observed window failed after 470-830s with Bull's stalled-job error, not a workflow error. The webhook and integrated runs carry only 1-97 lines each and never sweep, so when the scheduled run dies there is no full-table pass at all.
description: |
  id: indox-scheduled-sweep-stalled-2026-08-11
  As first recorded — opened: 2026-08-11T01:30Z · status: diagnosed-fix-written-NOT-DEPLOYED

