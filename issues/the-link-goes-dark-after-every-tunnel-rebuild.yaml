title: 'The link goes dark silently: rebuilding dgo-net orphans dgo-link in a DEAD network namespace, and nothing measures delivery'
opened: 2026-10-04
category: ops
severity: high
status: resolved
summary: 'Reaching this office from a linked one returned 502/timeout while the WireGuard handshake was up the whole time. Root cause, measured: `dgo-link` runs with `network_mode: service:dgo-net`, and Docker does NOT move it into the NEW namespace when `dgo-net` is recreated — its listeners (`10.79.2.1:9002`, `:8983`, `:3081`) stayed bound inside the dead namespace, so packets arriving on the new `wg2` met a kernel RST (`Connection refused`, measured from vps1 to 10.79.2.1:9002) and traefik answered 502. `./scripts/dc up -d --force-recreate dgo-link` restored it instantly (9002 → 404 door, 8983 → 200 catalog, 3081 → 401 agent API). THIS IS A DEPLOY-TIME HAZARD, not a one-off: the app under development IS the one that owns the tunnel, so every rebuild of it can silently take the link down. Restart is not enough — the container must be RECREATED. Four distinct silent faults hit the link in one day (this, the per-interface UDP port collision, apply-before-retire on the interface rename, and
  the legacy door number advertised to every peer); each surfaced only as "unreachable" on a screen.'
description: "## Measured (2026-10-04, macbook ↔ vps1, all from the live office)\n\nThe tunnel was healthy the entire time. Delivery was not, and no surface said so.\n\n```\n# from vps1, while the owner saw 502 in the console\ncurl -m 4 http://10.79.2.1:9002/healthz   → connect failed: Connection refused   (kernel RST)\ncurl -m 4 http://10.79.2.1:8983/healthz   → 000\nping  -c1 10.79.2.1                        → rtt 74.0 ms                       (ICMP: fine)\n# wg on both ends: latest handshake < 60s, transfer counters moving both ways\n# tcpdump -ni wg0 'host 10.79.2.1 and tcp port 9002' on vps1: 0 packets captured\n# wg show wg2 transfer, before/after 3 SYNs:  3976 → 5128 sent, 3864 → 4440 received\n```\n\nInside the link proxy, in what turned out to be the DEAD namespace:\n\n```\nss -ltn (docker exec dgo-link-local)\n    LISTEN 10.79.2.1:8983  10.79.2.1:9002  10.79.2.1:3081  172.18.0.7:9402/9404/9004\n```\n\nAfter `./scripts/dc up -d --force-recreate dgo-link` (recreate, not restart):\n\
  \n```\nss -ltn → the listeners above, in the namespace that owns wg2\nfrom vps1: 10.79.2.1:9002 → 404 (the door answers; 404 is Host routing)\n           10.79.2.1:8983 → 200\n           10.79.2.1:3081 → 401 (the agent API; it is there)\n```\n\n## Why it reads as \"unstable\"\n\nBecause the failures are silent and they all wear the same mask (\"the office is unreachable\"), while\nthe only instrument that tells them apart is a combination of `ss` *in the right namespace*,\n`wg show` counters and a `tcpdump` on the far end. The four that happened today:\n\n1. **This one** — a rebuild of `dgo-net` orphans `dgo-link` (shared netns). FIXED BY HAND each time;\n   the durable fix is below.\n2. **One UDP listen port for every pair.** WireGuard binds a socket per interface, so the second pair\n   cannot come up: `RTNETLINK answers: Address already in use` — while the address itself was free\n   (adding `10.79.4.2/24` to `lo` by hand succeeded, which is how the two causes were told apart).\n  \
  \ FIXED: `ListenPort = DGO_WG_PORT + slot`, per pair.\n3. **Apply before retire in the tunnel applier.** A pair keeps its address when its interface is\n   RENAMED (`wg0` → `wg2`): bringing the new one up first failed, the old one was then retired, and\n   the office was left with NO tunnel (~2 minutes, vps1). FIXED: retire first, then apply.\n4. **The legacy single door number went to every peer.** `build_catalog` advertises `link.port`, and\n   it was taken from the FIRST pair — which after the pairing was the new one (slot 4), so the dev\n   server was told to reach this office on `9004`, a door only the other pair has. FIXED: the\n   machine declaration's pair describes the legacy field.\nPlus a fifth, quieter one: one record with no WireGuard key (`hp-laptop` before the pairing) refused\nthe WHOLE render, so no pair could be updated until it was replaced.\n\n## What has to be true before this is closed\n\n1. **The pair is recreated as a unit.** A container that consumes another's\
  \ network namespace must be\n   recreated whenever that namespace's owner is recreated — declared, not remembered. Either\n   `bbox`/`scripts/dc` treats `dgo-net` + `dgo-link` as one unit on any `up`, or the app stops\n   sharing a namespace (the door listens by name instead). Acceptance: after\n   `./scripts/dc up -d --build dgo-net`, the far office reaches `10.79.2.1:9002` **within 60s with no\n   human step**.\n2. **A DELIVERY probe per pair, distinct from the tunnel's.** The link's state must be measured end to\n   end (the door and the catalog answering through the tunnel from the far side), reported per pair in\n   `/api/link` and on the console, and `tunnel up` must never be shown as `link up`. This is the same\n   gap `ai/context/connection-status-standard.md` describes: today a dead delivery and a healthy one\n   look identical on every screen.\n3. **A gate.** The app declares `network_mode: service:<x>`; a lint must fail when that pair is not\n   handled as one unit (or when\
  \ the consumer's namespace can outlive the provider's), so the next\n   person cannot re-introduce it by adding a second shared-namespace container.\n4. **One renderer for the tunnel files.** `step_link` wrote `/tunnel/wg0.conf` itself while the app\n   wrote the same directory from the records — two writers of one layout (`pairs/wg<slot>.conf`). The\n   step now delegates to `app.render_tunnel`; keep it that way, and make \"who writes `/tunnel`\" a\n   single answer.\n\n## Done on dgo-pair (2026-10-06)\n\n1. **The pair is one unit, and nobody declares it.** `netns_rejoin` (scripts/lib.sh) runs after every\n   `up` that goes through `dcx` - and G7 lets no `up` go any other way. It reads STATE: a container\n   whose network namespace belongs to a container that is gone, or that was started after it, is\n   recreated. No pair is named anywhere, so the next service that shares a namespace is covered the\n   day it is added. Measured on hp-laptop: `./scripts/dc up -d --no-deps --force-recreate dgo-net`\n   alone -> `dgo-link` recreated by the same command (33 s), every rule of the plan answering in the\n   new namespace (`link-proxy.py --check`: 5 OK), the tunnel's handshake back about a minute after\n   the replacement, no human step. An `up` that replaces nothing recreates nothing (the same\n   container ids before and after).\n2. **Delivery is measured per pair, apart from the tunnel.** `/api/link` carries `delivery` (this\n   pair's door answering here + her catalog arriving through the tunnel), `tunnel` (the last\n   handshake, measured where the interface lives) and `verdict` (`{ok, hop}`). The console marks\n   every tile of that office from the verdict. The same test showed it end to end: the pass that ran\n   while the tunnel was coming back published `{ok: false, hop: tunnel}`, all ten MacBook tiles\n   carried the sentence, and the next pass took it off.\n3. **The lint is not needed any more**, because there is nothing left to forget: no pair is declared,\n   and the gate that matters already exists (G7 - every compose call goes through `dcx`).\n"
references:
- apps/dgo-extend/docker-compose.yml
- apps/dgo-extend/tunnel-entrypoint.sh
- apps/dgo-extend/net.py
- ai/context/connection-status-standard.md
tasks:
- text: Recreate dgo-link whenever dgo-net is recreated — declared as one unit (scripts/dc or the manifest), never remembered
  done: true
- text: A DELIVERY probe per pair through the tunnel, reported by /api/link and the console distinct from the tunnel's state
  done: true
- text: A lint that fails when a container sharing another's network namespace can outlive the container that owns it
  done: true
- text: 'One writer for /tunnel: step_link delegates to app.render_tunnel (done 2026-10-04, keep it)'
  done: true
