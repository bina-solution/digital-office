summary: 'Both apps run on the engine and in the console; every network connects through the office browser (browser42) — there is no hand-off kind any more. Facebook is connected and read through b42. Left: the owner signs in once to Instagram, X, YouTube, GitHub, Discord and links WhatsApp Web; each draft script is observed and its first write watched; `sites` gets the data-da write path.'
description: |
  ## Where it stands (2026-09-29, evening)
  - Enabled and running on the macOS engine; both screens open inside the console (/a/digital-assets/,
    /a/social-list/) and console deep links reopen the exact screen (#/m/social-list/matrix,
    #/m/digital-assets/s/identity?slot=…) through the `bina:route` bridge.
  - The console used to freeze its app-route map at start, so an app enabled later answered
    `unknown_app`; it now re-reads .generated/registry/console.app_bases.json when it changes.
  - The apps screen ("0 אפליקציות") was /api/apps taking 62–67 s behind a 40 s proxy; now 0.8–1.5 s
    (one sparse docker list, cached 4 s) and the screen keeps the last list on a failed poll.
  - NO HAND-OFF: the owner's rule "everything should work without handoff, use the b42 inside the
    digital office". platforms.yaml v3 has two kinds (browser — recommended everywhere — and api);
    X, Discord and WhatsApp are browser networks with their terms shown as information. LinkedIn,
    TikTok, Telegram and Threads left social-list (they had no automation) and are digital-assets
    `listing` channels until each gets a browser script.
  - Proven through the real browser42: the social-list browser self-test 5/5 on the test network;
    Facebook connected (Bina Solutions page, read back: name, id, link, avatar, cover); the logo
    plan pushes to Facebook through the office browser.
  - b42 stability: every navigation used to take a full accessibility snapshot (megabytes on X and
    Facebook) and the MCP process died "JavaScript heap out of memory" three times; social-list and
    domains now navigate without one (`open(snapshot=False)`), and @playwright/mcp is pinned to 0.0.83.
  - Login detection per network: each script names `session.signed_in` / `signed_out` marks, because
    a signed-out X or WhatsApp page has no password field for the generic probe to see.

  ## Sign-in state inside b42 (probed 2026-09-29)
  facebook ✓ signed in · instagram ✗ login form · x ✗ onboarding · youtube ✗ "Sign in" ·
  github ✗ signed out · discord ✗ login + QR · whatsapp — splash, not linked yet.
