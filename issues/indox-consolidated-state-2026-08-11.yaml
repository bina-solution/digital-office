  ## Root cause found 2026-08-11t08:30z

  ```yaml
  headline: The driver queues behind itself. That standing queue IS the 127.7-minute transit.
  measured:
  - 150 of 150 sampled jobs in bull:jobs:wait are indoxV2Driver01 at priority 50. The backlog is 100% driver.
  - bull:jobs:wait = 3,296. Driver webhook jobs arrive at 597/15min = 2,388/hr. 3,296 / 2,388 = 82.8 minutes.
  - Oldest-to-newest timestamp span across the whole wait list = 87.6 minutes. Matches independently.
  - indoxV2ActionRouter01 is priority 100, a SEPARATE class, and never accumulates -- consumed as fast as it arrives, which is why it measures a 3-second wait. There is no starvation and no misconfiguration.
  the_mechanism: indoxV2Driver01 re-enters ITSELF over HTTP -- node 'POST Next Action (by id)' POSTs to its own webhook incoming-documents-017. Every document hop therefore mints one QUEUED Bull job. The host drains them at ~2,388/hr, which is exactly the rate they are created, so the backlog is stable at ~3,300 and every hop pays ~83 minutes of queue wait for a job whose actual execution takes 33 seconds.
  the_chain_now_closes_end_to_end: |
    driver HTTP self-call -> 1 queued job per hop
                          -> standing 3,296-job backlog
                          -> ~83 min per hop
                          -> ~8 hops = 127.7 min median transit        (matches measurement)
                          -> 1,440 offers/hr / 7.7 = 187/hr ceiling    (matches measured 188/hr)
  why_every_capacity_experiment_failed: Drain rate is CPU-BOUND on the host (cpu_idle 0.8-10.7%), not slot-bound. 90.7% of all executions are integrated sub-executions consuming that CPU. Adding 40 remote slots drained no faster because the queue was never waiting for a slot -- it was waiting for CPU already fully committed. This is the correct explanation for the repeatedly-observed "more workers changed nothing".
  the_fix: 'Convert the driver''s HTTP self-call into an IN-PROCESS loop. It removes the queue hop entirely rather than adding capacity to a saturated host, and unlike raising the sweep cadence it makes the queue SHALLOWER instead of deeper. Expected: queued executions per completion ~18 -> ~3, and transit collapsing from ~128 minutes toward minutes. RISK MEDIUM: the self-webhook is also the driver''s parallelism mechanism, so the loop must preserve concurrency. Do not do this blind.'
  ```

  ## Prepared plan driver in process loop

  ```yaml
  status: ANALYSED AND READY FOR REVIEW -- not implemented. Deploys are blocked.
  the_node_as_it_exists_today:
    name: indoxV2Driver01 / POST Next Action (by id)
    type: n8n-nodes-base.httpRequest
    url: http://n8n:5678/webhook/incoming-documents-017   (the driver's OWN webhook)
    method: POST
    options: 'batching { batchSize: 10, batchInterval: 250 }, timeout 10000'
    body: ID, TRIGGER_TYPE=check_next, TRIGGER_CHAIN
    fed_by: Next Action IDs
    feeds_into: NOTHING -- terminal, fire-and-forget
    receiving_webhook: Webhook, path=incoming-documents-017, POST, responseMode=responseNode
    measured_rate: 503 executions / 15 min = 33.5/min, avg duration 30.1s
  three_findings_that_make_this_tractable:
  - IT IS A TERMINAL NODE. The parent never consumes a response, so replacing it breaks no continuation. This removes the main structural hazard I expected to find.
  - 'CONCURRENCY TODAY HAS TWO SOURCES: the HTTP node''s own batching (10 requests per 250ms) AND the queue''s parallelism. An in-process replacement must supply its own concurrency or it will SERIALISE and be slower despite removing the queue wait. This is the real risk.'
  - 'THE ARITHMETIC FAVOURS THE CHANGE. 33.5 self-calls/min against a 3,300-job backlog produces the ~98-minute wait. Converting to executeWorkflow (integrated -- never queues) trades that for holding a Bull slot through the chain: ~8 hops x 30s = ~4 min per document against 56 slots = ~840 docs/hr of slot capacity, comfortably above the 500/hr target. It converts the system from LATENCY-BOUND to CPU-BOUND.'
  what_would_then_bind: Host CPU. Idle is already 0.8-10.7% and 90.7% of executions are integrated sub-executions, so 840/hr is not achievable on CPU grounds -- but the ceiling would move from 187/hr (queue-bound) to whatever CPU allows, and THAT is when relieving the host (the owner's rebalance idea) and collapsing indoxApiRouter01 start paying off. Those changes are worthless while the queue binds; they become the lever once it does not.
  sequencing: 1) driver in-process loop  2) SHORT_DOC_ID (already staged, removes a hop)  3) collapse indoxApiRouter01 / rebalance to the portable box, to buy CPU  4) only then raise the sweep cadence from 5 min to 2 min. Doing 4 first deepens a saturated queue and gains nothing.
  ```

  ## Apirouter collapse risk reassessed

  ```yaml
  lane_rating: LOW risk -- pure plumbing, no behaviour change.
  verified_true_part: 'indoxApiRouter01 is genuinely plumbing: 5 nodes, ZERO lines of code. When Called -> If Management -> either Call Sync Api (SyncApi0000000001) or Call Supabase (indoxApiSupabase01) -> Return. A two-way switch with no transformation of any kind.'
  but_the_rating_understates_blast_radius: IT HAS 33 CALL SITES ACROSS 20 WORKFLOWS -- indoxV2Driver01, indoxV2ActionsGlobal01, indoxSettings01, syncV3Main0001, syncV3Deliver0001, indoxDocBatchUpsert01, indoxV2ActionsGDoc01, indoxV2ActionsShip01, indoxV2ActionsBS01, mailApi01, indoxDocGet01, indoxHealth00001, SyncApi0000000001, sv3Inject3x001, IndoxInjectDemo01, indoxV2SearchWarehouse01 and others. Collapsing it requires 33 coordinated edits. That is LOW COMPLEXITY but HIGH BLAST RADIUS, which is not the same as low risk -- and every edit needs the deploy cycle currently blocked.
  and_the_benefit_is_indirect: Its 6,852 executions/hr are INTEGRATED, so they consume CPU but never enter the Bull queue. Removing them frees CPU and therefore raises DRAIN RATE (drain is CPU-bound), but it does not shorten the queue directly the way the driver in-process fix does. Rank it BELOW the driver fix, not above it.
  ```

  ## Executive summary

  Worker capacity is NOT the constraint and has been proven so three separate ways: 56 Bull slots exist, adding 2 remote workers moved COMPLETED by zero, and executions average 4.6 SECONDS against a median document transit of 127.7 MINUTES. Documents spend ~99% of their life waiting between sweep dispatches, not executing. Throughput is therefore governed by (dispatches per hour) / (hops per document) -- and the sweep cadence has never been measured. That single unknown decides whether 500/hr is a tuning problem or a structural one. A lane is measuring it now.

  ## Fixed

  ```yaml
  - id: stalled-executions
    what: '239 executions stuck in ''running'', 135 older than 10 min, oldest 7.3 HOURS. Cause: EXECUTIONS_TIMEOUT is unset on n8n main so a hung execution never ends, and 106 of them were mode=integrated children orphaned when their parent died. They clustered by hour (02:00->40, 03:00->33, 05:00->35) -- the signature of worker death events.'
    fix: 'Cleared via n8n''s OWN stop-execution endpoint (never row edits). A reaper runs every 3 minutes at a 30-minute threshold, chosen from measured maxima (longest legitimate execution: 565s). scratchpad/reaploop.sh + reapnow.sh.'
    why_not_executions_timeout: Setting that env var needs a container recreate, and recreating a worker is what CREATES these orphans -- maxStalledCount is hardcoded 0 in n8n 2.x, so every execution a dying worker holds fails permanently. The cure would cause the disease.
    verified: 0 past 30m, 0 past 2h, sustained. orph 102->0, inert 65->0, bull stalled 24->0.
    confirmed_self_healing: 'After 1h04m of continuous operation the reaper logs `candidates: 0` on EVERY cycle -- it cleared 239 orphans once and has had nothing to collect since. That is the important result: no NEW stalled executions are being created at all, so the underlying cause (worker recreation killing in-flight executions under maxStalledCount:0) has not recurred. The class of problem is eliminated, not merely swept. When the watchdog transiently reports stalled2h=2, those are rows that crossed the 30-minute line between reaper passes; they are collected within 3 minutes.'
  - id: apitools-remote-tunnel-dead
    what: The apitools remote backend was DOWN from 04:57 on ECONNREFUSED. haproxy correctly failed all OCR to the local instance, so nothing errored -- it silently put 100% of OCR on a 6-core host already 4GB into swap while the portable box idled at 13% CPU with 7,176 documents queued. The mesh tunnel had a watchdog; this one did not.
    fix: Rebuilt ssh -L 172.18.0.1:18080 -> portable 127.0.0.1:8080, plus a watchdog that health-checks over HTTP rather than port-liveness. scratchpad/apitools_tunnel_watchdog.sh.
    critical_detail: An ssh forward can keep its port LISTENING after the far side dies, so failure arrives as an EMPTY RESPONSE rather than a refusal. A `ss -ltn` check reports healthy straight through it. Never health-check a tunnel by port state.
    verified: HTTP 200 end to end; haproxy brought the backend UP in <5s; load 25->22 immediately.
  - id: old-date-completed-guard
    what: The old-date gate re-evaluated COMPLETED documents and pushed them into OLD, which the pipeline can never leave. 93 of 98 OLD rows were finished work.
    fix: 'Decide DOC BASE Action: added a COMPLETED exclusion alongside OLD.'
    verified: Parsed from the live version; 51 successes / 0 errors in the 90s after deploy.
    not_repaired: The 93 documents already moved to OLD stay there.
  - id: batching-two-unlock-callers
    what: indoxDocBatchUpsert01 'SB Unlock Doc' and indoxApiSupabase01 'API Unlock Doc', executeWorkflow mode each -> once.
    outcome_honest: 'SAFE BUT NO MEASURABLE GAIN. processLock01 stayed at ~5,000/hr. The reason: parent workflows carry ~1 item per execution, so the batch loop had one iteration. Correct by the owner''s batching principle and harmless, but it bought nothing. Left in place.'
    verified: '1,494 + 389 executions, ZERO errors. Lock TTLs healthy: 3,469 keys, 0 without expiry, max 5,399s, population churning not accumulating.'
  ```

