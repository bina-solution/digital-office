  ## Hop reduction design

  ```yaml
  why_this_is_the_lever: Throughput = WIP / transit. Executions average 4.6 SECONDS against a 127.7-MINUTE median transit, so ~99% of a document's life is spent waiting for the next sweep. Slots are not the constraint (56 slots at under 40% utilisation, four independent proofs). Therefore transit is set by HOPS x SWEEP-INTERVAL, and removing a hop is worth exactly as much as making the sweep that much faster -- but it is permanent and costs no extra load.
  the_three_hops: gdocHead() returns, in strict order, get_short_doc_id -> update_name -> check_from_office before a document can reach selection. Combined 557 dispatches/hr, measured hop latencies 11.1 / 9.0 / 6.3 minutes. Removing all three cuts ~26 minutes and 3 of roughly 8 hops -- a ~37% transit reduction, which by Little's Law is a ~60% throughput increase at constant WIP.
  hop_1_get_short_doc_id:
    status: SOLVED -- patch verified on all 9,422 rows, staged, blocked only on deploy permission.
    detail: Build Per Type Upsert writes COMPANY_DOC_ID but not the SHORT_DOC_ID derived from it, so the gate re-opens on a value the node already had in hand.
  the_live_gate_code:
    where: indoxV2ActionsGDoc01 / Decide GDoc Action, 305 lines, read via activeVersionId
    verbatim: |
      46  const expectedShort = String(doc.COMPANY_DOC_ID ?? '')...
      51  if (!doc.SHORT_DOC_ID || String(doc.SHORT_DOC_ID) !== expectedShort)
      52      return 'get_short_doc_id';
      54  const expectedName = `${doc.COMPANY_NAME ?? 'unknown'}-${doc.SHORT_DOC_ID ?? 'unknown'}`;
      55  if (doc.NAME !== expectedName)
      56      return 'update_name';
      58  if (isBlank(doc.FROM_OFFICE_CHECK))
      59      return 'check_from_office';
    what_this_settles:
    - Line 51 closes exactly when SHORT_DOC_ID === expectedShort, which is what the staged patch writes. The fix is correct against the real gate, not against a description of it.
    - 'HOP 2 IS CAUSALLY DOWNSTREAM OF HOP 1: expectedName is built FROM SHORT_DOC_ID (line 54). A document lacking SHORT_DOC_ID must therefore burn hop 1 before the name comparison is even computable. With the staged fix, SHORT_DOC_ID arrives with per-type extraction and hop 1 is eliminated rather than merely deferred.'
    - Line 55 confirms the update_name gate is on the NAME VALUE, so writing NAME early would indeed suppress the rename. The lane's rejection was correct.
  hop_2_update_name:
    lane_verdict: REJECTED -- satisfying the NAME check early means the Drive file is never renamed, because update_name also drives Build Drive Rename -> Drive Rename.
    confirmed_at: line 55, `if (doc.NAME !== expectedName) return 'update_name';` -- the gate is on the value, and line 56 is the ONLY mention of update_name in the node.
    but_the_objection_is_solvable: 'The defect is that ONE field (NAME) is overloaded to mean two different things: ''the name value is correct'' AND ''the Drive file has been renamed''. Those are separate facts and should have separate markers. Give the rename its own completion marker (e.g. NAME_RENAMED / RENAME_COMPLETED) and gate Build Drive Rename on THAT, not on the NAME value. Then per-type extraction can write NAME immediately -- closing the gate and removing the hop -- while the rename still happens on its own schedule, driven by its own marker. This is the same shape of defect as hop 1: a derived value withheld so that a gate stays open.'
    risk: MEDIUM. Requires a new column plus a gate change, and the rename must be verified to still fire. Not to be done in the same change as hop 1.
  hop_3_check_from_office:
    lane_verdict: Move it out of gdocHead into gdocTail, after select_invoice_values -- 161 dispatches/hr and a 6.3-minute hop moved behind selection rather than in front of it.
    status: RISK RAISED, NOT LOWERED -- do not attempt without redesign.
    consumers_now_certified: |-
      I scanned all 90 workflows (active and inactive) and parsed every node referencing FROM_OFFICE*. There are 23 references and FOUR are genuine READ sites, so the field is NOT write-only:
        indoxV2Driver01      / If From Waerhouse1  -- branches on !!FROM_OFFICE
        indoxV2Driver01      / map response        -- FROMWAREHOUSE = FROM_OFFICE_CHECK ? 'Y' : ''
        indoxV2ActionsShip01 / Map Request         -- FROMWAREHOUSE = FROM_OFFICE == true ? 'Y' : ''
        indoxV2ActionsGDoc01 / Map Request         -- same
    why_that_blocks_the_move: FROM_OFFICE feeds a FROMWAREHOUSE field in outbound request mappings and an IF branch. Moving check_from_office behind selection lets Map Request run BEFORE the value exists, silently emitting an empty FROMWAREHOUSE -- a data-quality defect with no error anywhere, which is the worst kind. The diagnosing lane's caution was correct.
    if_it_is_ever_attempted: 'It needs the same treatment proposed for hop 2: separate the fact ''from-office has been checked'' from the value consumers read, and ensure every Map Request site is ordered after the check or tolerates a null. That is a redesign, not a re-ordering.'
    caveat_on_my_own_scan: 'The active/inactive column in my scan output was wrong -- I concatenated a postgres boolean and tested for ''t'' when postgres yields ''true'', so every workflow printed as inactive. See the measurement-traps section; this is that same trap. The READ-SITE finding is unaffected: it came from parsing node parameters, not from the boolean.'
  combined_expected_effect: 'INFERENCE, not measured: hops 8 -> 5, transit 127.7 -> ~80 min, throughput ~155/hr -> ~250/hr at constant WIP. That is not 500/hr on its own. Reaching 500 needs the hop reduction AND a faster or larger sweep -- which is exactly the measurement now in flight.'
  ```

  ## Measurement traps

  - ACTION_LOG tokens are HUMAN DISPLAY NAMES, not slugs. Slug queries return 0 rows and look like findings.
  - SOME TOKENS ARE BARE NUMBERS: `1` = get_short_doc_id (~197/hr, the largest consumer in its lane, invisible in every census until decoded). `3` = an ActionsBS batch-update node (~245/hr).
  - Bucketing rows by the MAX epoch in ACTION_LOG measures LAST TOUCH, not arrival. Retried rows pile into recent buckets. This made stuck-state creation look like it jumped 7x. Only a count delta between two snapshots gives a true arrival rate.
  - The `rework%` metric divides base-extraction stamps by ALL row touches -- mismatched units, and 32% of the 'touches' were rows CREATED in the same window. It approaches 100% in a perfectly healthy pipeline.
  - workflow_entity.nodes is a DRAFT. The live code is via activeVersionId -> workflow_history. Checking active=true alone is a FALSE PASS.
  - Three units that do not convert: execution_entity rows, Bull active entries (entry-point jobs only; nested executeWorkflow runs integrated in the parent's slot), ACTION_LOG touches.
  - In psql `(x = y)::text` yields 'true'/'false', NOT 't'/'f'. This deactivated a live workflow six times.
  - A partially-filled time bucket read as a trend. I called errors 'decaying' off a bucket with 1,554 successes against a ~5,000 norm.
  - Do not pattern-match workflow JSON -- parse it. Four false readings came from LIKE against node JSON.
  - Lock SKIPS are correct by design and must never be reported as a defect.
