  ## The two explanations

  ```yaml
  E1_ordering: Company resolution runs before the evidence exists. Directly evidenced for at least 199 documents (35%) which have NO API_TOOLS_ID -- they had not been OCR'd when they were judged. For those, the verdict was rendered on a document the pipeline had not yet read.
  E2_extraction_quality: Base extraction ran (486 of 575) but the COMPANY_NAME action almost never did (10 of 575). So it is not that extraction looked and found nothing -- the name-extraction step appears not to have been reached at all on this cohort. That points back at E1 rather than at OCR quality.
  verdict: 'The weight of evidence is on E1 (ordering / premature judgement), not on documents genuinely lacking a company. The decisive contrast: COMPANY_NAME fires 431/hr pipeline-wide -- the single most frequent action -- yet fired on only 1.7% of this cohort.'
  ```

  ## Why it matters

  ~57 documents/hr diverted against ~153/hr completing. MISSING_COMPANY_ID is not in the pickup's normal advancement path, so these do not come back on their own. A prior drain of this same state exists as bak_missing_company_drain_20260806 (293 rows), so this has recurred before and was previously handled by draining rows rather than by fixing the ordering.

  ## Not fixed because

  Two lanes were mid-work on higher-value items (the selection-stage ceiling, which caps ALL completions at ~118/hr, and horizontal scale-out toward the owner's 500/hr target). This is diagnosed and recorded rather than half-fixed. It should NOT be resolved by draining rows again -- the owner's standing rule is "never just move itmes or edit db row!!!! you need to really fix the pipline!! we aim to perfect state machine".

  ## Next step when picked up

  - Read the LIVE 'FIGURE COMPANY OFFLINE' code in indoxV2ActionsGlobal01 (via activeVersionId -> workflow_history; workflow_entity.nodes is only a draft) and find the gate that admits a document with a null API_TOOLS_ID to company resolution.
  - Establish whether COMPANY_NAME extraction is a separate action that this cohort never reaches, or a step inside base extraction that silently no-ops.
  - Check whether the 199 no-API_TOOLS_ID documents should have been held at 'awaiting OCR upload' instead -- that is the 6452-document backlog and the pipeline's binding constraint.
