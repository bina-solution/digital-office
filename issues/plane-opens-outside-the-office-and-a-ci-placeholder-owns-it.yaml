  - text: "bootstrap.py: ENABLE_SIGNUP=0 once the owner exists; route auth:sso at the edge (CE has no OIDC — Plane's own login stays, the host stops being public). Acceptance: /sign-up says disabled; unauthenticated host request 302s to authentik"
