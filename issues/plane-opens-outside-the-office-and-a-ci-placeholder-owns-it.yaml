  - text: "patches/hebrew-states.py: DEFAULT_STATES → לביצוע-ממתין/לביצוע/בתהליך/בוצע/בוטל (names only; group/colour/sequence kept), anchors asserted, build refuses on drift. Acceptance: a project created in the UI and one via POST /api/v1/…/projects/ both get Hebrew states"
    done: false
  - text: "hooks/onboard: refuse a placeholder owner (ci@local.dev, *@local.dev, your-*) and name the .env key to set; then PLANE_OWNER_EMAIL=<the owner> and re-run onboard (idempotent) so the owner is the instance admin of 'המשרד'"
    done: false
  - text: "Owner decision: keep/delete workspace bbb (offer: rename its five English states in place, UUIDs kept) and delete the ci@local.dev account"
