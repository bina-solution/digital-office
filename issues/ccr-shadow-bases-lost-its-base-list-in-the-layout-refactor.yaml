# yaml-language-server: $schema=./schema.json
title: "ccr_shadow_bases lost its base-image list in the platform-OS refactor: the FROM glob still points at production/ and development/, which no longer exist"
opened: "2026-09-27"
category: bug
severity: medium
status: resolved
summary: "The cloud-sandbox CA-shadowing helper collects bases from `dcx config` (which never contains FROM lines — the code says so itself) and from `production/*/Dockerfile development/*/Dockerfile`, two directories this repo no longer has. The shadow set is therefore effectively empty, the helper still reports success, and the 11 first-party Dockerfiles' bases (python:3.12-slim, node:22-slim, …) go unshadowed on the one path that needs it."

description: |
  ## What the code does (scripts/lib.sh, ccr_shadow_bases)
  ```sh
  bases="$( { dcx config 2>/dev/null | grep -oE 'FROM [^ ]+' | awk '{print $2}' | grep -vE '\$|AS' | sort -u; } || true)"
  bases="$( { printf '%s\n' $bases $(grep -rhoE '^FROM [^ ]+' "${REPO_ROOT}"/production/*/Dockerfile \
            "${REPO_ROOT}"/development/*/Dockerfile 2>/dev/null | awk ...) ; echo 'n8nio/n8n:'"$(read_env N8N_VERSION)"; } || true)"
  ```
  The first substitution reads `docker compose config`. Compose config renders service definitions, not
  build recipes, and it contains **no `FROM` lines at all** — the function's own comment two lines
  earlier acknowledges exactly this ("`compose config` has no FROM lines"), which is why the second
  substitution exists. The second one globs `production/` and `development/`: the layout the
  platform-OS refactor replaced with `apps/` + `platform-base/`.

  ## Verified 2026-09-27 (this checkout, bc8b041e)
  | Check | Result |
  |---|---|
  | `./scripts/dc config \| grep -c 'FROM '` | **0** |
  | `ls -d production development` | `No such file or directory` (both) |
  | `ls apps/*/Dockerfile \| wc -l` | 11 — and their bases include `python:3.12-slim`, `node:22-slim`, `node:24-bookworm-slim`, `node:20-alpine` |
  | Net shadow set | effectively `n8nio/n8n:$N8N_VERSION` only |

  ## Why it is silent
  A base that cannot be fetched or rebuilt is a `warn "shadow build failed for ${b}"` — and an empty
  list is no warning at all. The helper then returns 0 and `bbox run` continues. The only environment
  that runs this code path is the Claude cloud sandbox (`ccr_have_proxy_ca` is false on macOS/Lima and
  on the VPS), so nothing on this machine has ever contradicted it.

  ## The sibling claim, also false
  `scripts/lib.sh` (cloud section) and `apps/browser42/hooks/prepare` both say browser42's base image
  "is DIGEST-PINNED … so the CA-shadow cannot retag it … it cannot be CA-shadowed". That is not a
  property of a third-party image: the digest is this repo's own choice
  (`apps/browser42/Dockerfile.browser:10`, `FROM cloakhq/cloakbrowser:latest@sha256:440907…`), and the
  mechanism named is the helper's **last line** — `docker build … -t "$b"` — which cannot tag a
  digest reference. So the exclusion is caused by the helper's own interface, and it is fixable here
  (build the shadow under a separate tag and point the Dockerfile's `FROM` at it), not by the vendor.

  ## Recommended fix
  1. Collect bases from the Dockerfiles that exist: `apps/*/Dockerfile`, `platform-base/*/Dockerfile`,
     plus any nested build contexts — the same set `image-pin-lint` already derives. A gate that
     asserts the derived set is non-empty would have caught this on the day the layout moved.
  2. Make an empty/partial base list LOUD (fail or warn), because "shadowed nothing" and "no proxy
     CA" must not look identical.
  3. Decide browser42's cloud story explicitly: shadow it under a derived tag, or keep dropping it and
     say so in terms of the helper, not of the vendor image.

  ## Where it stands (2026-10-07, hp-laptop, branch dgo-pair)

  1. Done before this pass: `ccr_bases` reads every FROM of every Dockerfile the RENDERED compose
     project builds, so no list of directories can go stale. On hp-laptop: 7 bases from the 21
     services that build.
  2. Done here: a list that is n8n's base alone - what a compose side that answers nothing leaves -
     is said before anything is shadowed ("could not derive the base images from the compose
     project - only n8n's base will trust the proxy CA, and every other build will fail on TLS").
     `ccr_shadow_bases` run as written with stand-ins (a proxy CA "present", docker replaced by a
     recorder, nothing pulled or built): the office as it is - 7 shadow builds and the usual line;
     a compose side that fails - the warning, then 1.
  3. browser42's cloud story is the app's own: `apps/browser42/hooks/prepare` drops it there and
     says why (`BBOX_WITH_BROWSER42=1` to try anyway).

  Not measured: the real thing, in a cloud sandbox with a proxy CA. This office has none.
