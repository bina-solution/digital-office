title: "Console desktop mode — windows, stash rails, collections and an episodic timeline (Jenson 'working memory')"
opened: "2026-09-25"
category: feature
severity: medium
status: in-progress
summary: "Turn the console into an optional multi-window desktop (spatial), attach per-object clip collections (associative) and add a private activity timeline joined with any-concurrency's system lanes (episodic), after Scott Jenson's Akademy 2026 talk."

description: |
  ## Why
  Scott Jenson's KDE Akademy 2026 talk ("Are we really going to use the same Desktop UX forever?")
  argues that the desktop should work as the user's **working memory**, in three parts:
  spatial (organic window placement), associative (clips kept with their document) and episodic
  (a private story of what you did). Today the console shows exactly one app in one `#frame`, keeps
  no server-side state, and any-concurrency holds system spans only, in memory.

  The full research and design is in `ai/context/console-desktop-working-memory.md`:
  - §3 has every idea from the stage with stable IDs (P*, R*, S1–S14, A1–A9, E1–E8, Q1–Q5).
  - §4 has the sources plus Jenson's prototype repos. They carry **no license**, so implement
    clean-room.
  - §5–§9 hold the platform facts, the design, the phases, the owner decisions and the risks.

  ## Shape
  - **Desktop mode.** An **opt-in mode beside the classic shell**, at ≥ 1280 px only. Classic
    stays the default, so every harness contract that assumes one `#frame` keeps its meaning.
  - **Where state lives:**
    - The console owns the window manager (`static/desktop.js` / `desktop.css`, no new
      dependencies).
    - A new platform-base service (working name `memory`) owns layouts, collections and
      episodes per user.
    - any-concurrency stays the source of system lanes only. The personal join happens in the
      viewer's browser, because any-concurrency broadcasts every span to every viewer.
  - **Privacy.** Content-free signals (counts, durations, object ids; never text, keystrokes or
    screenshots), owner-only access, 30-day retention, pause and forget.

