# Middlewares referenced by /root/bina-devops production/bina-solutions-website labels
# (copied so the personal site can be served by the staging Traefik). Added 2026-09-17.
http:
  middlewares:
    ratelimit-default:
      rateLimit:
        average: 100
        burst: 50
    security-headers:
      headers:
        customFrameOptionsValue: "SAMEORIGIN"
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        # HSTS for the site's own host only: a subdomain may be another office on another server (exf.digital-
        # office.co.il is a client's, 93.184.216.9), and one still waiting for its certificate would be unreachable
        # for a year in any browser that had seen the apex (DGO-687, 2026-11-10). No stsIncludeSubdomains.
        stsSeconds: 31536000
    compress:
      compress: {}
