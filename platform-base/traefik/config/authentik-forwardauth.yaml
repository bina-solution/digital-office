## Dynamic configuration — the authentik forwardAuth middleware.
##
## This lives in traefik's FILE provider, not on authentik-server's docker labels, and that is the
## whole point.
##
## When this middleware was defined by labels, it existed only while traefik's docker snapshot
## contained the authentik-server container. Any moment it did not — a recreate, a decorated
## duplicate left by an interrupted `bbox run`, a reload racing a container event — traefik could not
## resolve `authentik@docker`, and traefik's response to an unresolvable middleware is to DISCARD THE
## WHOLE ROUTER. A discarded router means the host does not exist, so all 14 SSO-gated hosts served a
## bare `404 page not found` while the stack reported itself healthy. Measured 2026-07-30: 3,718
## router rejections across ~30 minutes of container churn, every gated surface dark, nothing in
## `bbox status` showing it.
##
## Defined here, it is part of traefik's static-ish dynamic config and ALWAYS exists. Routers are
## never discarded. If authentik itself is down or still starting, the forwardAuth call fails and the
## browser gets a 502 naming the auth service — a legible error instead of a 404 that reads as
## "this app was never deployed".
##
## Referenced as `authentik@file` (the provider suffix is required to cross from a docker-provider
## router to a file-provider middleware; a bare `authentik` on a docker router resolves to
## `authentik@docker` and would silently reintroduce the bug).
##
## TWO middlewares, one definition (DGO-1755): `authentik` for an app every signed-in person opens, and
## `authentik-admins` for an app whose app.json says `people: admins` (the office's root apps). Both compilers pick
## the name per app; under forward-auth the second asks /auth/traefik/admins, which answers 403 with a card to a
## signed-in person who is not an admin. With the SSO off (a developer's laptop) and under authentik (an office not
## yet moved to forward-auth) the two are the same: neither knows the rule, and an office on authentik keeps
## today's behaviour until it moves.
http:
  middlewares:
{{- range $mw := list "authentik" "authentik-admins" }}
    {{ $mw }}:
{{- if eq (env "BBOX_SSO") "off" }}
      headers:
        customRequestHeaders:
          X-authentik-username: akadmin
          X-authentik-name: Developer
          X-authentik-email: akadmin@localhost
          X-authentik-groups: authentik Admins
          X-authentik-uid: dev
{{- else if eq (env "DGO_IDENTITY") "forward-auth" }}
      # forward-auth (platform-base/forward-auth, DGO-1090): the same five headers, under the same
      # middleware name, so no router and no app changes. trustForwardHeader false: traefik writes the
      # X-Forwarded-* it sends from the request it received, never a client's own.
      forwardAuth:
        address: http://forward-auth:9078/auth/traefik{{ if eq $mw "authentik-admins" }}/admins{{ end }}
        trustForwardHeader: false
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          # a phone's machine behind its native core: forward-auth reads the core's signature of the request
          # and never answers it, so traefik removes it from what the app receives (android-path.md)
          - X-DGO-Edge-At
          - X-DGO-Edge-Nonce
          - X-DGO-Edge-Sig
{{- else }}
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
{{- end }}
{{- end }}
