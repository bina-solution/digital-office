# Config below was layered by production/compose.override.yml before the platform-OS
# refactor; merged here so this app owns its complete definition.
services:
  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          cpus: '1'
          # 512M -> 256M, 2026-08-06. Measured high-water 45MiB (~5.7x headroom retained).
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M
    container_name: redis-${DEPLOYMENT_NAME:-bina-deployment}
    restart: unless-stopped
    # THE PASSWORD IS NEVER ON A COMMAND LINE (DGO-1654). Until then it rode `--requirepass` and the
    # healthcheck's `redis-cli -a`, which left it in three places:
    #   - the container's Args, Cmd and Healthcheck (the docker API handed those to any app until DGO-1647);
    #   - every healthcheck's exec event, every 30 s;
    #   - the process list while the check ran (the hosting provider's hourly telemetry reads every
    #     command line).
    # Now it is an environment variable. At start the entrypoint writes it into a config file only redis
    # can read, and the healthcheck hands it to redis-cli as REDISCLI_AUTH. `$$` keeps compose from
    # expanding it into either command, and `exec docker-entrypoint.sh` keeps redis as PID 1, dropped to
    # the redis user as before.
    # WHERE THE FILE LIVES MATTERS (the second reader). In /tmp, the file belonged to redis after the first
    # start. On the NEXT start of the same container, root's `>` into a file another user owns in a
    # sticky directory is refused by the kernel (fs.protected_regular=2, the default on Debian and Ubuntu).
    # The chain stops, and `unless-stopped` loops the container forever, taking authentik and n8n down
    # with it. So the file lives in /etc, a directory root owns that is not sticky, and is removed before
    # it is written again.
    environment:
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    entrypoint:
    - /bin/sh
    - -c
    - umask 077 && rm -f /etc/redis-auth.conf && printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /etc/redis-auth.conf && chown redis:redis /etc/redis-auth.conf && exec docker-entrypoint.sh redis-server /etc/redis-auth.conf "$$@"
    - redis
    command:
    - --appendonly
    - 'no'
    - --save
    - 300 1 60 1000
    # STAGED: this belongs below the container's 256M (192mb). A BGSAVE forks, and the child's copy-on-write pages
    # count against the same cgroup; at maxmemory = the limit a full redis (972k probe sessions, MacBook 2026-11-02)
    # sat at its cap with a save running 2¼ hours. But redis reloads its dump whatever maxmemory says, so an office
    # whose db1 still holds the probe's sessions would come back above 192mb and refuse every write (noeviction).
    # The probe no longer mints them (outpost-ready.py) and they expire within a day; lowered once every office's
    # db1 is measured small (issues/sso-readiness-probe-filled-redis-with-a-million-sessions-and-jammed-the-engine.yaml).
    - --maxmemory
    - 256mb
    - --maxmemory-policy
    - noeviction
    - --stop-writes-on-bgsave-error
    - 'yes'
    - --protected-mode
    - 'yes'
    volumes:
    # its dump (n8n's queue and caches, the flow streams, authentik's sessions): in the DGO folder's data/redis/data
    # (DGO-2019; it was the volume redis_data, moved once by `bbox run`) — claimed by hooks/backup, which carries no
    # key by design (stale locks and job ids), and re-proves that at every export
    - ../../data/redis/data:/data
    networks:
    - traefik-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
    - traefik.enable=true
    - traefik.tcp.middlewares.redis-ipallowlist.ipallowlist.sourcerange=${DBS_ALLOWED_IPS}
    - traefik.tcp.routers.redis.rule=HostSNI(`${REDIS_HOST}`)
    - traefik.tcp.routers.redis.entrypoints=redis
    - traefik.tcp.routers.redis.service=redis
    - traefik.tcp.routers.redis.middlewares=redis-ipallowlist
    - traefik.tcp.routers.redis.tls=true
    - traefik.tcp.routers.redis.tls.certresolver=${TRAEFIK_CERTRESOLVER-myresolver}
    - traefik.tcp.services.redis.loadbalancer.server.port=6379
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: 5
      start_period: 10s
networks:
  traefik-network:
    external: true
