<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>התראות</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e9f6e'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%94%94%3C/text%3E%3C/svg%3E">
<style>
/* ── what is this screen's own: radii and type (each app stays independent, no external assets).
   The colours are the office's palette, in the generated block below. Fills width like the console
   shell; NO app sidebar (avoids double-nav when embedded at /a/alerts/). All fetch/asset URLs are
   RELATIVE so it works standalone AND embedded. ── */
:root{
  --radius:16px; --radius-sm:10px; --radius-pill:999px;
  --font:"Segoe UI",system-ui,-apple-system,"Noto Sans Hebrew","Assistant",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* @bina-theme-tokens:start */
/* OLIVE GROVE — the one palette of the office (the owner, 2026-10-07 · DGO-450). Four hues, sampled
   from his mock-up, and the ground they stand on. A screen never writes a colour: it names one of
   these. Each hue is the colour itself (a FILL — a button, a bar, a dot), «-d» for text and thin
   lines on the ground (4.5:1 or more), «-soft» and «-line» for a tint and its hairline, and «-ink»
   for what is written ON the fill. The role names every screen already uses point at them:
   (no backtick in this block: one of its copies lives inside a script's template string)
     olive  the brand and the main action · what is well, what is done
     sky    what is in motion, what only informs · a link
     lime   look here — a warning, something waiting
     plum   a person must act — a failure, a removal, the one final action
   Contrast, measured (WCAG): ink on the ground 13.7 · muted 4.65 · light text on olive 5.51 and on
   plum 9.54 · ink on lime 6.88 · its ink on sky 6.32 · sky-d 4.61 · lime-d 4.70 · violet 5.32 ·
   on the desk: its ink 6.32 (dark: 13.96), and 11.2 where the sky pales (dark: 5.12). */
:root,:root[data-theme="light"]{
  color-scheme:light;
  accent-color:var(--accent);   /* the browser's OWN controls - a checkbox, a radio, a range, a progress bar - on both grounds: said once, here (it was said for eight single controls, and every other one was the browser's blue) */
  --bg:#f3f5f7; --surface:#fff; --surface-2:#f9fafb; --ink:#1f2a17; --muted:#6a7068; --line:#dcdfde;
  --olive:#56693f; --olive-d:#475734; --olive-soft:#e7eae4; --olive-line:#bfc6b6; --olive-ink:#f3f5f7;
  --sky:#7baae3; --sky-d:#2a6fc4; --sky-soft:#edf3fb; --sky-line:#cddff4; --sky-ink:#13263f;
  --lime:#a9b84c; --lime-d:#69732e; --lime-soft:#f3f5e6; --lime-line:#dee4bb; --lime-ink:#1f2a17;
  --plum:#5b3349; --plum-d:#4a303b; --plum-soft:#e8e2e6; --plum-line:#c1b1ba; --plum-ink:#f3f5f7;
  --accent:var(--olive); --accent-d:var(--olive-d); --accent-soft:var(--olive-soft); --accent-ink:var(--olive-ink);
  --blue:var(--sky-d); --amber:var(--lime-d); --red:var(--plum);
  --violet:#7c5c6d;   /* plum, lifted a fifth toward white: someone has to look — nothing has failed */
  --ok:var(--olive); --warn:var(--lime-d); --danger:var(--plum); --info:var(--sky-d);
  --ok-soft:var(--olive-soft); --warn-soft:var(--lime-soft); --danger-soft:var(--plum-soft); --info-soft:var(--sky-soft);
  --red-soft:var(--plum-soft); --amber-soft:var(--lime-soft); --blue-soft:var(--sky-soft); --violet-soft:var(--plum-soft);
  --side:var(--olive); --side-ink:#f3f5f7; --side-mut:#dce1da; --side-line:#788765;
  --desk:var(--sky); --desk-ink:var(--sky-ink);   /* desktop mode's ground is the sky (the owner, DGO-452), and what is written straight on it */
  --scrim:rgba(31,42,23,.5);                      /* what dims a screen behind a pop-up */
  --shadow:0 1px 3px rgba(31,42,23,.08),0 6px 24px rgba(31,42,23,.06);
  --shadow-lg:0 20px 60px rgba(31,42,23,.28);
  /* ONE COLOUR AND ONE ANIMAL PER OFFICE (the owner, 2026-10-09 · flt-002). When offices are linked,
     a person reads WHICH office a thing belongs to without opening it, so each office gets a hue of
     its own. The hue is an IDENTITY and never a health state: an office that stopped answering keeps
     its colour, and the quiet mark is the one that says "not answering". Each is an ALIAS of the
     palette's own hue — no fourth value is invented, and because the ground re-points the hue, the
     office mark follows the ground by itself. Each office's animal (elephant, deer, eagle) is a
     glyph of bina-icons.js. */
  --office-hp:var(--muted);   /* hp · elephant — grey: the heavy laptop at home, in the palette's own grey */
  --office-mac:var(--lime);   /* macbook · deer — yellow: the palette has one yellow and it is lime. A FILL, so what is written ON it is --lime-ink, never this */
  --office-vps:var(--sky-d);  /* vps · eagle — deep sky blue, «the eagle in the clouds». THE OWNER'S OWN CHOICE (2026-10-09, in writing: vps = נשר + כחול-שמיים) — this line is the colour he picked, not a default kept for him */
}

/* ── A LINKED OFFICE'S MARK, BY NAME (flt-004) ───────────────────────────────────────────────
   The link carries a NAME — mark: {color, animal} in the catalog, from the office's own identity
   — and never a value: the office that DRAWS a linked tile owns the pixels, so it paints the name
   with its own palette. These seven rules are that translation, one per family above; a screen sets
   data-office-hue="lime" and paints var(--office-hue).
   A name this file does not know paints nothing, which is why the vocabulary in
   apps/dgo-extend/identity.py may only name families that exist here — and why --red and --ok
   are not among them: they mean «danger» and «it is well» on every screen in the office. */
[data-office-hue="grey"]   { --office-hue:var(--muted); }
[data-office-hue="lime"]   { --office-hue:var(--lime); }
[data-office-hue="sky"]    { --office-hue:var(--sky-d); }
[data-office-hue="olive"]  { --office-hue:var(--olive-d); }
[data-office-hue="plum"]   { --office-hue:var(--plum); }
[data-office-hue="blue"]   { --office-hue:var(--blue); }
[data-office-hue="violet"] { --office-hue:var(--violet); }
/* the dark ground is the same four hues on the palette's own ink, and the SAME legend. Olive on that
   ink is 2.5:1, so its text step there is olive LIFTED — its own hue and saturation, lighter (7.14
   on a card, 4.82 on its own tint) — and the brand, the main action and «it is well» take that step.
   Lime stays «look here» and the sky «in motion», as on the light ground: were lime the accent here
   (it was, for a day), a warning, a selection and «it is well» were one colour. Each «-d» on its
   own «-soft» there, measured: olive 4.82 · sky 4.62 · lime 4.63 · plum 4.71. */
@media (prefers-color-scheme:dark){
  :root{ color-scheme:dark;
         --bg:#141b0f; --surface:#1f2a17; --surface-2:#192213; --ink:#f3f5f7; --muted:#a2a8a2; --line:#414a3b;
         --olive-d:#a5ba8c; --olive-soft:#384629; --olive-line:#56693f;
         --sky-d:#7baae3; --sky-soft:#2e3f38; --sky-line:#4d6a8c;
         --lime-d:#a9b84c; --lime-soft:#3b4622; --lime-line:#69732e;
         --plum-d:#ad99a4; --plum-soft:#402f33; --plum-line:#7c5c6d;
         --accent:var(--olive-d); --accent-ink:var(--surface);
         --red:#ad99a4; --violet:#bdadb6; --danger:#ad99a4; --ok:var(--olive-d); --side:var(--surface);
         --desk:var(--sky-ink); --desk-ink:var(--ink); --scrim:rgba(0,0,0,.6);
         --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.3);
         --shadow-lg:0 20px 60px rgba(0,0,0,.55); }
}
:root[data-theme="midnight"]{
  color-scheme:dark;
  --bg:#141b0f; --surface:#1f2a17; --surface-2:#192213; --ink:#f3f5f7; --muted:#a2a8a2; --line:#414a3b;
  --olive-d:#a5ba8c; --olive-soft:#384629; --olive-line:#56693f;
  --sky-d:#7baae3; --sky-soft:#2e3f38; --sky-line:#4d6a8c;
  --lime-d:#a9b84c; --lime-soft:#3b4622; --lime-line:#69732e;
  --plum-d:#ad99a4; --plum-soft:#402f33; --plum-line:#7c5c6d;
  --accent:var(--olive-d); --accent-ink:var(--surface);
  --red:#ad99a4; --violet:#bdadb6; --danger:#ad99a4; --ok:var(--olive-d); --side:var(--surface);
  --desk:var(--sky-ink); --desk-ink:var(--ink); --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.3);
  --shadow-lg:0 20px 60px rgba(0,0,0,.55);
}
/* THE KEYBOARD'S RING - what the browser draws around the stop the keyboard is on, in the palette, wherever
   a part draws none of its own. It has no specificity at all (:where), so any rule of a part wins. Two
   screens said this for themselves; on the others nearly every stop wore the browser's ring (DGO-455).
   A field keeps the offset it has - fourteen rules draw a field's own outline and say no offset. An area
   (a scroll box, a table) takes the ring inside, where nothing clips it; a control takes it outside,
   where a filled button does not hide it. */
:where(:focus-visible){outline:2px solid var(--accent)}
:where(:focus-visible:not(a,button,summary,[role=button],input,select,textarea)){outline-offset:-2px}
:where(a,button,summary,[role=button]):focus-visible{outline-offset:2px}
/* HEBREW AT A HEAVY WEIGHT - on Windows, where the first family of --font is installed. "Segoe UI" has its
   Hebrew in Light, Regular, Semibold and Bold. Asked for 800 or 900 the browser takes the family's Black
   face, which has none, and so has every family after it - so the Hebrew of every title at 800 was drawn in
   the system's last-resort serif, thin, beside Latin in Black: «חשבונות ומראות» at 20px is 150px wide at 700
   and 120px at 800 (Chrome 154; the screens ask for 800 in 167 places, the question's title among them).
   These faces give the family's HEBREW RANGE the faces that have it. A family a sheet names is no longer the
   system's for those characters, so every weight and both styles are named, each as the system resolves it:
   measured, only upright 800 and 900 change. Any other character is not theirs and goes on to the next
   family the screen names - system-ui in --font, on Windows the same faces, Black included - which is why
   G27 asks that system-ui follows wherever a screen names this family itself. Where the family is not
   installed nothing here resolves and nothing changes. */
@font-face{font-family:"Segoe UI";src:local("Segoe UI Light");font-weight:100 300;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI");font-weight:400;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Semibold");font-weight:500 600;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Bold");font-weight:700 900;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Light Italic");font-weight:100 300;font-style:italic;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Italic");font-weight:400;font-style:italic;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Semibold Italic");font-weight:500 600;font-style:italic;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Segoe UI";src:local("Segoe UI Bold Italic");font-weight:700 900;font-style:italic;unicode-range:U+0590-05FF,U+FB1D-FB4F}
/* @bina-theme-tokens:end */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

/* page shell — fills the console content area, wide cap for readable line-length */
.wrap{width:100%;max-width:1160px;margin:0 auto;padding:22px 26px 48px}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;
  padding:7px 13px;border-radius:var(--radius-sm);cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-d)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.ghost{box-shadow:none;background:transparent}

/* ── KPI strip (spans full width; 2026 dashboard pattern) ─────────────────── */
/* Four tiles are one row of four or two rows of two — `auto-fit` made them 3 + 1 on a tablet. The
   grid, and the strip it becomes in a window and on a phone, are the office's (`.pg-kpis`). */
#hud{margin:2px 0 18px}
@media (max-width:430px) and (min-height:700px){#hud{--pg-kpi-cols:2}}   /* a phone; a small WINDOW keeps one row */

/* ── filter bar ───────────────────────────────────────────────────────────── */
/* ── the app's half of the menu contract ─────────────────────────────────────────────────────────
   `.bnv-host` is the container the menu MEASURES (its own width, not the window's) and `.appgrid` is
   the grid whose side column is `--bnv-side`; the rail at 600–839px and the drawer below 600px come
   from bina-nav.css. `.filters` went with its bar — the filters are menu sections now. */
.side{border-inline-end:1px solid var(--line)}
.pg{min-width:0}
/* Below 600px the menu — this screen's filters — is a drawer, and the head holds the button that
   opens it, at the end of the title's line (there was none: on a phone the filters could not be
   reached). The title block gives it the room: a line of text takes the whole row otherwise. */
.pg-head>div:first-child{flex:1 1 0;min-width:0}
@media (min-height:700px){.pg-head>.bnv-burger{margin-block-start:-6px}}   /* (level with the title's line) */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:600;font-size:12.5px;
  padding:6px 12px;border-radius:var(--radius-pill);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:var(--shadow)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.on{background:var(--accent-soft);color:var(--accent-d);border-color:transparent}
.chip .c{font-size:11px;font-weight:700;opacity:.75}
.chip .sw{width:8px;height:8px;border-radius:50%;flex:none}
.chip .sw.error{background:var(--red)} .chip .sw.warning{background:var(--amber)} .chip .sw.info{background:var(--blue)}
.filters .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.filters .grow{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ── list ─────────────────────────────────────────────────────────────────── */
.daygroup{margin-top:20px}
.daygroup:first-child{margin-top:0}
.dayhdr{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin:0 4px 9px;text-transform:none;
  display:flex;align-items:center;gap:10px}
.dayhdr::after{content:"";flex:1;height:1px;background:var(--line)}
#list{display:flex;flex-direction:column;gap:10px}

.item{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px 14px 18px;box-shadow:var(--shadow);border-inline-start:4px solid var(--line);
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;transition:border-color .12s,box-shadow .12s}
.item:hover{box-shadow:var(--shadow-lg)}
.item.lv-error{border-inline-start-color:var(--red)}
.item.lv-warning{border-inline-start-color:var(--amber)}
.item.lv-info{border-inline-start-color:var(--blue)}
.item.unread{background:linear-gradient(90deg,var(--accent-soft),var(--surface) 42%)}
.item.unread .title::before{content:"";position:absolute;inset-inline-start:-11px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* source avatar */
.ava{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;
  background:var(--surface-2);border:1px solid var(--line);flex:none}
.ava{color:var(--muted)}
.ava svg{width:19px;height:19px}
.ava.error{background:var(--red-soft);border-color:transparent;color:var(--red)}
.ava.warning{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.ava.info{background:var(--blue-soft);border-color:transparent;color:var(--blue)}

.body{min-width:0}
.title{position:relative;font-weight:700;color:var(--ink);overflow-wrap:anywhere;padding-inline-start:2px}
.desc{color:var(--muted);font-size:13px;margin-top:4px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* (two lines are what a row shows of a text; a press on the row shows the whole of it - `onRowClick`) */
.item.whole .desc{display:block;-webkit-line-clamp:unset;overflow:visible}
.meta{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tag.src{color:var(--accent-d);background:var(--accent-soft);border-color:transparent}
.tag.proj{font-family:var(--mono);font-size:10.5px}
.meta .cnt{display:inline-flex;align-items:center;gap:4px}
.meta a.open,.desc a{color:var(--accent-d);text-decoration:none;font-weight:700}
.meta a.open:hover,.desc a:hover{text-decoration:underline}
/* (what a finger hits is 30px high: «פתח במקור» was 18 - it is 30 whatever the font draws, and its own margin takes
   the difference back so that the line stays where it was) */
@media (pointer:coarse){.meta a.open{display:inline-flex;align-items:center;min-height:30px;margin-block:-6px}}

/* row actions */
.rowacts{display:flex;align-items:center;gap:4px;flex:none;opacity:.35;transition:opacity .12s}
.item:hover .rowacts{opacity:1}
.iact{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:6px;border-radius:8px;
  min-width:30px;min-height:30px;display:inline-grid;place-items:center}
.iact:hover{background:var(--surface-2);color:var(--accent-d)}
.iact.del:hover{color:var(--red)}
.iact svg,.btn svg{width:15px;height:15px;display:block;flex:none}

/* ── states ───────────────────────────────────────────────────────────────── */
.state{color:var(--muted);text-align:center;padding:56px 20px;background:var(--surface);border:1px dashed var(--line);
  border-radius:var(--radius)}
.state .ico{opacity:.5;margin-bottom:10px;display:flex;justify-content:center}
.state .ico svg{width:40px;height:40px}
.state .t{font-size:15px;font-weight:700;color:var(--ink)}
.state .s{font-size:13px;margin-top:5px}
.state.err{color:var(--red);border-color:var(--red)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-inline-end:8px}
@keyframes sp{to{transform:rotate(360deg)}}


@media (max-width:640px){
  .wrap{padding:16px 14px 40px}
  .item{grid-template-columns:auto 1fr;gap:10px}
  .rowacts{grid-column:1 / -1;justify-content:flex-end;opacity:1;margin-top:-4px}
  .brand .htext h1{font-size:20px}
}

/* @bina-page:start */
.pg{
  --pg-max:1180px;
  width:100%;
  max-width:var(--pg-max);
  margin:0 auto;
  padding:20px 24px 48px;
  box-sizing:border-box;
}
/* the header: title block at the start, actions at the end. It wraps rather than shrinking,
   which is what keeps a long action row off the title on a narrow screen. */
.pg-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:18px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
}
.pg-head h1{
  margin:0;
  font-size:22px;
  line-height:30px;
  font-weight:700;
  letter-spacing:-.01em;
  color:var(--ink);
}
.pg-sub{margin-top:3px;color:var(--muted);font-size:13px;line-height:20px;max-width:70ch}
.pg-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-inline-start:auto}

/* the live chip. One chip, everywhere: a dot that beats while the number is fresh, and that
   stops dead when it is not — a still dot is the whole signal that the figure is old. */
.pg-live{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;line-height:18px;font-weight:700;white-space:nowrap;
  color:var(--accent-d);
  background:var(--accent-soft);
  border-radius:999px;
  padding:4px 11px;
  border:0;font-family:inherit;          /* the chip is a <button> where it pauses the refresh */
}
button.pg-live{cursor:pointer}
.pg-live[data-stale="1"]{color:var(--amber);background:var(--warn-soft)}
.pg-live .beat{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none;animation:pg-beat 1.6s infinite}
.pg-live[data-stale="1"] .beat{animation:none}
@keyframes pg-beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* the card. `> h2/h3` is the card's own title; an app that puts a toolbar in it uses .pg-cardhead */
.pg-card{
  box-sizing:border-box;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px 18px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}
.pg-card>h2,.pg-card>h3{margin:0 0 10px;font-size:15px;line-height:22px;font-weight:700;color:var(--ink)}
.pg-cardhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pg-cardhead>h2,.pg-cardhead>h3{margin:0;font-size:15px;line-height:22px;font-weight:700}
.pg-cardhead .pg-actions{margin-inline-start:auto}
.pg-hint{color:var(--muted);font-size:12px;line-height:18px;font-weight:400}
.pg-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pg-note{color:var(--muted);font-size:12.5px;line-height:19px}
.pg-empty{padding:18px 4px;color:var(--muted);font-size:13px}

/* ── the KPI tile: the one number a screen leads with ─────────────────────────────
   Four of these screens drew it four ways — 26, 28 and 30px numbers, three paddings, with and
   without a shadow (measured 2026-10-06). One tile: a 12.5px label over a 26px tabular number.
   A state is said twice — the number's colour and a 3px bar on the reading edge — through
   `data-state`, in the product's legend; a zero is not a state, so a screen leaves the attribute
   off and adds `is-zero`. The legend is the palette's: what waits is lime, what is in motion is
   sky, what is done is olive, what failed is plum, what needs a person is plum lifted. What a
   screen adds of its own (a chip, a sparkline, a sub-line) goes inside the tile; how many tiles
   share a row is the screen's (`--pg-kpi-cols`), so that no row ends in a lone one. */
.pg-kpis{display:grid;grid-template-columns:repeat(var(--pg-kpi-cols,4),minmax(0,1fr));gap:12px}
.pg-kpi{position:relative;min-width:0;overflow:hidden;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  box-shadow:var(--shadow)}
.pg-kpi-k{display:block;color:var(--muted);font-size:12.5px;line-height:18px;font-weight:600}
/* `fit-content`: the number sits under its label at the page's reading edge even when it is an
   LTR token (`.num`) — as a full-width block its own direction sent it to the far side. */
.pg-kpi-v{display:block;width:fit-content;max-width:100%;margin-top:4px;font-size:26px;line-height:30px;
  font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pg-kpi-v small{font-size:13px;font-weight:700;letter-spacing:0;margin-inline-start:4px;color:var(--muted)}
.pg-kpi.is-zero .pg-kpi-v{color:var(--muted)}
.pg-kpi[data-state]::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--pg-kpi-c)}
.pg-kpi[data-state] .pg-kpi-v{color:var(--pg-kpi-c)}
.pg-kpi[data-state=todo]{--pg-kpi-c:var(--amber)}
.pg-kpi[data-state=running]{--pg-kpi-c:var(--blue)}
.pg-kpi[data-state=done]{--pg-kpi-c:var(--accent-d)}
.pg-kpi[data-state=failed]{--pg-kpi-c:var(--red)}
.pg-kpi[data-state=person]{--pg-kpi-c:var(--violet)}

/* touch: the header's controls are the ones a phone reaches for first */
@media (pointer:coarse){
  .pg-actions .btn,.pg-actions button,.pg-actions a.btn{min-height:44px}
}
@media (max-width:640px){
  .pg{padding:14px 12px 40px}
  .pg-head{gap:10px;margin-bottom:14px}
  .pg-head h1{font-size:19px;line-height:26px}
  .pg-card{padding:14px;border-radius:12px}
  .pg-actions{margin-inline-start:0;width:100%}
}
/* ── a SHORT frame: a window in desktop mode ─────────────────────────────────────
   Desktop mode opens an app in a window of about 580 × 530, and a person halves and quarters it.
   A page laid out for a tall frame spent that whole window on its own heading: at 640 × 330 five
   of the office's screens showed their title, their sentence, their buttons and four tiles — and
   none of what they are for (photographed 2026-10-07). In a short frame the heading is ONE line:
   the window's bar already names the app, so the sentence under the title steps aside (a line
   that reports something — `data-live` — stays), and the room is the content's. */
@media (max-height:699px){
  .pg{padding-block-start:10px}
  .pg-head{gap:8px;margin-bottom:10px;padding-bottom:8px;align-items:center}
  .pg-head h1{font-size:17px;line-height:24px}
  .pg-sub:not([data-live]){display:none}
  .pg-actions{width:auto;margin-inline-start:auto;gap:6px}
  .pg-actions .btn,.pg-actions button,.pg-actions a.btn{padding:4px 9px;font-size:12px}
}
/* …and in the SMALLEST window — its corner dragged in as far as it goes, 380 × 224 of page — a
   title over a row of buttons was 88px of it. The window's bar already says the screen's name,
   so where the heading has actions the title steps aside and they are its one line. A title
   that names a VIEW (`data-view`) stays: the bar says the app, not where in it. */
@media (max-height:699px) and (max-width:430px){
  .pg-head:not([data-view]):has(.pg-actions) h1{display:none}
  .pg-actions{margin-inline-start:0}
  /* …and a line that reports (`data-live`) shares that line with them, as far as it fits */
  .pg-head:has(.pg-sub[data-live]){flex-wrap:nowrap}
  .pg-head>:first-child:has(.pg-sub[data-live]){flex:1 1 0;min-width:0}
  .pg-sub[data-live]{margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pg-head:has(.pg-sub[data-live]) .pg-actions{flex:none;flex-wrap:nowrap}
}
/* …and there, and at a phone's width, the leading numbers are one STRIP rather than tiles: a
   hairline grid, key over value, in the columns the screen declares (`--pg-kpi-cols`). Four tiles
   were 184px of a 530px window, before the first row of what they count. */
@media (max-height:699px),(max-width:700px){
  .pg-kpis{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .pg-kpis>.pg-kpi{border:0;border-radius:0;box-shadow:none;padding:5px 8px}
  .pg-kpis .pg-kpi-k{font-size:10.5px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pg-kpis .pg-kpi-v{margin-top:0;font-size:17px;line-height:22px}
  .pg-kpis .pg-kpi-v small{font-size:10.5px;margin-inline-start:3px}
}
@media (prefers-reduced-motion:reduce){
  .pg-live .beat{animation:none}
}
/* @bina-page:end */

/* @bina-nav:start */
/* ── §1 the vocabulary ────────────────────────────────────────────────────── */
.bnv{
  --bnv-bg:var(--surface-2);
  --bnv-ink:var(--ink);
  --bnv-ink-2:var(--muted);
  --bnv-hover:color-mix(in srgb, var(--bnv-ink) 6%, transparent);
  --bnv-active:color-mix(in srgb, var(--bnv-ink) 10%, transparent);
  --bnv-brand:var(--accent);
  --bnv-brand-ink:var(--accent-d);
  --bnv-brand-soft:var(--accent-soft);
  --bnv-line:var(--line);

  /* geometry — the rail (§3) and the sizes (§4) change THESE, never a rule */
  --bnv-pad:8px 10px;
  --bnv-gap:2px;
  --bnv-row-w:100%;
  --bnv-row-h:36px;
  --bnv-row-pad:7px 8px;
  --bnv-row-gap:8px;
  --bnv-row-justify:flex-start;
  --bnv-head-h:52px;
  --bnv-head-pad:4px 6px 10px;
  --bnv-head-justify:flex-start;
  --bnv-primary-w:100%;
  --bnv-primary-h:44px;
  --bnv-primary-pad:10px 12px;
  --bnv-primary-justify:flex-start;
  --bnv-foot-align:stretch;
  /* what a rail takes away — `none` per part, because only the owner of a rule may say what
     that rule's display IS. A `display:none!important`-style override cannot be undone by a
     narrower container, and a phone must be able to bring these back.
     A rail takes away WORDS, never a way in: the names, the group heads, the search's field, and
     «הצג עוד» (which is words) — so the rows «הצג עוד» folds are all there in a rail (`--bnv-rest`),
     the search stays as its magnifier, and the collapse control stays, turned round, under the
     avatar. It used to take those three away too: a rail had no search, was missing the folded
     rows, and — once a person had chosen it — nothing left to press that would bring the menu back. */
  --bnv-text:block;
  --bnv-ghead:flex;
  --bnv-field:block;     /* the search's field */
  --bnv-more:block;
  --bnv-rest:none;       /* the rows folded behind «הצג עוד», while they are folded */
  --bnv-head-dir:row;    /* the brand row: avatar · name · collapse — a rail stacks what is left of it */
  --bnv-turn:none;       /* the collapse control's arrow */
  --bnv-side:252px;      /* read by .appgrid — the only width the host asks for */
  --bnv-off:-100%;       /* where a closed drawer parks; flipped for RTL below */

  background:var(--bnv-bg);
  color:var(--bnv-ink);
  display:flex;
  flex-direction:column;
  gap:var(--bnv-gap);
  box-sizing:border-box;
  height:100%;
  min-height:0;
  padding:var(--bnv-pad);
  font-size:14px;
  overflow:hidden;
}

/* ── §2 the parts ─────────────────────────────────────────────────────────── */
.bnv-scroll{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:var(--bnv-gap);
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}
.bnv-list{display:flex;flex-direction:column;gap:var(--bnv-gap);min-width:0}

/* brand row: square avatar · name (+ one line of context) · the collapse control */
.bnv-head{
  display:flex;
  flex-direction:var(--bnv-head-dir);
  align-items:center;
  justify-content:var(--bnv-head-justify);
  gap:10px;
  min-height:var(--bnv-head-h);
  padding:var(--bnv-head-pad);
  flex:none;
  overflow:hidden;
}
.bnv-avatar{
  width:28px;height:28px;border-radius:8px;flex:none;
  display:grid;place-items:center;overflow:hidden;
  background:var(--bnv-brand-soft);color:var(--bnv-brand-ink);
  font-weight:800;font-size:14px;line-height:1;
}
.bnv-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.bnv-head-text{flex:1;min-width:0;display:var(--bnv-text)}
/* (a brand line reads its own way — `dir=auto`, so what is cut is its end — and still sits on the menu's side) */
.bnv-head b,.bnv-head small{text-align:-webkit-match-parent;text-align:match-parent}
.bnv-head b{display:block;font-size:16px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnv-head small{display:block;color:var(--bnv-ink-2);font-size:11px;line-height:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnv-collapse{
  flex:none;width:28px;height:28px;padding:0;border:0;border-radius:8px;
  background:transparent;color:var(--bnv-ink-2);
  display:grid;place-items:center;cursor:pointer;
}
.bnv-collapse:hover{background:var(--bnv-hover);color:var(--bnv-ink)}
.bnv-collapse:focus-visible{outline:2px solid var(--bnv-ink);outline-offset:-2px}
.bnv-collapse svg{width:16px;height:16px;transform:var(--bnv-turn)}

/* the ONE flat primary action — the same object in every app, at finger size */
.bnv-primary{
  box-sizing:border-box;flex:none;width:var(--bnv-primary-w);min-height:var(--bnv-primary-h);
  display:flex;align-items:center;justify-content:var(--bnv-primary-justify);gap:8px;
  padding:var(--bnv-primary-pad);border:0;border-radius:10px;
  background:var(--bnv-brand-soft);color:var(--bnv-brand-ink);
  font:inherit;font-size:14px;line-height:22px;font-weight:600;
  text-align:start;text-decoration:none;cursor:pointer;
}
.bnv-primary:hover{background:color-mix(in srgb, var(--bnv-brand) 16%, transparent)}
.bnv-primary:active{background:color-mix(in srgb, var(--bnv-brand) 24%, transparent)}
.bnv-primary:focus-visible{outline:2px solid var(--bnv-brand);outline-offset:2px}
.bnv-primary .bnv-label{flex:1}
.bnv-primary[aria-disabled="true"],.bnv-primary:disabled{opacity:.5;cursor:default}

/* a group: a named block of rows, with its own header */
.bnv-group{display:flex;flex-direction:column;gap:var(--bnv-gap);min-width:0}
.bnv-ghead{display:var(--bnv-ghead);align-items:center;gap:2px;min-height:28px;padding:6px 6px 0;flex:none}
.bnv-gtitle{
  flex:1;min-width:0;display:var(--bnv-text);
  color:var(--bnv-ink-2);font-size:11px;line-height:16px;font-weight:600;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* a group action is a small icon button, and there are never more than two */
.bnv-act{
  flex:none;width:26px;height:26px;padding:0;border:0;border-radius:7px;
  background:transparent;color:var(--bnv-ink-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
}
.bnv-act:hover{background:var(--bnv-hover);color:var(--bnv-ink)}
.bnv-act:focus-visible{outline:2px solid var(--bnv-ink);outline-offset:-2px}
.bnv-act svg{width:15px;height:15px}

/* search lives IN the menu — which is what frees the top of the page for content.
   Its magnifier is a button (it puts the keyboard in the field), and in a rail it is the whole box:
   the field is gone (`--bnv-field`), and a press opens the menu over the page, on the field. */
.bnv-search{
  display:flex;align-items:center;justify-content:var(--bnv-row-justify);flex:none;
  margin:0 2px;min-height:34px;
  border:1px solid var(--bnv-line);border-radius:8px;background:var(--bnv-bg);cursor:pointer;
}
.bnv-search button{
  flex:none;align-self:stretch;width:30px;padding:0;border:0;border-radius:7px;
  background:transparent;color:var(--bnv-ink-2);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
}
.bnv-search button:hover{color:var(--bnv-ink)}
.bnv-search button:focus-visible{outline:2px solid var(--bnv-ink);outline-offset:-2px}
.bnv-search svg{width:15px;height:15px;flex:none}
.bnv-search input{
  display:var(--bnv-field);
  flex:1;min-width:0;padding:7px 0;padding-inline-end:9px;border:0;background:transparent;color:inherit;
  font:inherit;font-size:13px;line-height:20px;cursor:text;
}
.bnv-search input:focus{outline:none}
.bnv-search:focus-within{border-color:color-mix(in srgb, var(--bnv-brand) 45%, transparent)}
.bnv-search[hidden]{display:none}

/* the row */
.bnv-item{
  box-sizing:border-box;
  width:var(--bnv-row-w);
  min-width:0;
  min-height:var(--bnv-row-h);
  display:flex;
  align-items:center;
  justify-content:var(--bnv-row-justify);
  gap:var(--bnv-row-gap);
  padding:var(--bnv-row-pad);
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--bnv-ink-2);
  font:inherit;
  font-size:14px;
  line-height:22px;
  font-weight:500;
  text-align:start;
  text-decoration:none;
  cursor:pointer;
}
.bnv-item:hover{background:var(--bnv-hover);color:var(--bnv-ink)}
.bnv-item:active{background:var(--bnv-active)}
.bnv-item.is-active,.bnv-item[aria-current="page"]{
  background:var(--bnv-active);
  color:var(--bnv-ink);
  font-weight:500;
}
.bnv-item:focus-visible{outline:2px solid var(--bnv-ink);outline-offset:-2px}
.bnv-item[aria-disabled="true"],.bnv-item:disabled{opacity:.5;cursor:default}

/* a REMOTE app — one that runs on a LINKED office, not on this machine
   (ai/context/dgo-remote-apps.md §4). The row is a row like any other: same height, same hover,
   same active tint. What says "not this machine" is one corner bracket in the logo's apps-line
   colour, mirrored at the row's inline-start corner in BOTH directions (logical properties only —
   this component has no physical direction anywhere, and the mark is not going to be the first).
   The colour is the palette's «look here» in its line step (the lime the mark's apps carry). */
.bnv-item.is-remote{position:relative}
.bnv-item.is-remote::after{
  content:"";position:absolute;inset-block-start:3px;inset-inline-start:3px;
  width:7px;height:7px;pointer-events:none;
  border-block-start:2px solid var(--lime-d);
  border-inline-start:2px solid var(--lime-d);
  border-start-start-radius:3px;
}
/* the office did not answer: the mark goes quiet, the row keeps its place — a tile that vanishes
   is a tile nobody can ask about. The state is FORM here, not words: the office's tag (capped at
   5em below — "MacBook לא זמינה" was drawn as "…acBook") turns the failure colour and the row dims;
   the sentence is the row's tooltip. */
.bnv-item.is-remote.is-offline::after{border-color:var(--bnv-ink-2)}
/* …and the mark takes the OFFICE's own colour where the row knows which office it is: the shell adds
   `office-<id>` (console/static/app.js, remoteCls) and the hue is the palette's family
   `--office-hp/-mac/-vps` — declared in theme-tokens.css and nowhere else (G27/G82). An office with no
   token keeps the lime this mark ships with, so a fourth office needs one token and no CSS. */
.bnv-item.office-hp.is-remote::after{border-color:var(--office-hp)}
.bnv-item.office-mac.is-remote::after{border-color:var(--office-mac)}
.bnv-item.office-vps.is-remote::after{border-color:var(--office-vps)}
.bnv-item.is-offline :is(.bnv-ic,.bnv-label){opacity:.72}
.bnv-item.is-offline .bnv-meta{color:var(--danger)}
/* `hidden` is how the search filters rows, and it has to beat `display:flex` above */
.bnv-item[hidden],.bnv-empty[hidden],.bnv-group[hidden]{display:none}
.bnv-ic{width:18px;height:18px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.bnv-ic svg,.bnv-ic .ic-svg{width:18px;height:18px;display:block}
/* the label is what gives way — never the row, never the container.
   A label that is a NAME someone gave (a folder, a mailbox) carries `dir="auto"`: it is cut at ITS
   end, not the row's — «Plane — HP ומק» lost its first letters in a narrow rail («…ne — HP ומק») —
   and `match-parent` keeps it on the row's reading edge whichever way it reads. */
.bnv-label{flex:1;min-width:0;display:var(--bnv-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-align:-webkit-match-parent;text-align:match-parent}
/* the SECOND column: a count, a size, a time. Tabular, so a list of them aligns. */
.bnv-meta{
  flex:none;display:var(--bnv-text);color:var(--bnv-ink-2);
  font-size:12px;line-height:18px;font-variant-numeric:tabular-nums;
}
/* A REMOTE row's meta is a NAME, not a count — and a name may be long ("שרת פיתוח בינה סלושנס").
   With `flex:none` (above) it held its full width, so the LABEL took the loss: measured on the live
   rail (218px), `מסמכים שלי` — 73px of text — was drawn in 44px, while the office name kept 124px.
   That inverts what a row is for: the app is the subject, the office is commentary.

   `flex:0 1 auto` alone does NOT fix it, and that is worth writing down: the row is not overflowing
   (18 + 8 + 44 + 8 + 124 + 16 = 218), so there is no shrink pressure to resolve — the label simply
   sits at min-content while the meta takes what it asks for. Nothing is "squeezed out" to shrink.

   So the meta gets a CAP of `min(40%, 5em)` — and the measurement is why it is a formula and not a
   percentage. At the console's live rail (218px), a 40% cap left the office 81px and still ellipsized
   the app name by 16px (`חיבורים ומפתחות`, 103px). Swept on the live row: 40% → name 87 (clipped),
   30% → 107 (fits) + office 61, 26% → 115 + 53, 22% → 124 + 44. `5em` is 60px of office at this
   font — the shortest tag that still names an office — and it leaves the label 107px, its full
   width. The percentage half keeps a WIDE rail from giving the office an unbounded share; `flex:0 8`
   then resolves what is left in the label's favour. `.is-remote` and not every meta on purpose: a
   count has no office to name, and its fixed slot is what makes a column of them line up. */
.bnv-item.is-remote .bnv-meta{
  flex:0 8 auto;min-width:0;max-inline-size:min(40%,5em);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* trailing slot: a badge, a dot, a chevron. `nowrap` so it can never wrap into a second line. */
.bnv-tail{flex:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--bnv-ink-2);font-size:12px}
.bnv-item:hover .bnv-tail,.bnv-item.is-active .bnv-tail{color:inherit}
.bnv-badge{
  flex:none;min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:var(--bnv-brand-soft);color:var(--bnv-brand-ink);
  font-size:11px;line-height:18px;font-weight:700;text-align:center;
}
.bnv-item:hover .bnv-badge,.bnv-item.is-active .bnv-badge{background:color-mix(in srgb, var(--bnv-brand) 22%, transparent)}

/* Priority+: the rows that did not fit, and the one row that reveals them. (A rail has no such
   row to press — it is words — so there the folded rows are simply there: `--bnv-rest`.) */
.bnv-rest{display:var(--bnv-rest);flex-direction:column;gap:var(--bnv-gap);min-width:0}
.bnv-rest.is-open{display:flex}
.bnv-more{
  display:var(--bnv-more);flex:none;width:100%;min-height:28px;padding:4px 8px;border:0;border-radius:8px;
  background:transparent;color:var(--bnv-ink-2);font:inherit;font-size:12px;font-weight:600;
  text-align:start;cursor:pointer;
}
.bnv-more:hover{background:var(--bnv-hover);color:var(--bnv-ink)}
.bnv-empty{padding:6px 8px;color:var(--bnv-ink-2);font-size:12px;line-height:18px}

.bnv-foot{
  flex:none;margin-top:auto;padding-top:10px;border-top:1px solid var(--bnv-line);
  min-width:0;display:flex;flex-direction:column;gap:var(--bnv-gap);align-items:var(--bnv-foot-align);
}
.bnv-foot-text{
  display:var(--bnv-text);padding:0 8px;max-width:100%;color:var(--bnv-ink-2);
  font-size:11px;line-height:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bnv-sep{height:1px;background:var(--bnv-line);margin:6px 8px;flex:none}

/* ── §3 the rail: one state, two triggers, a list of values ────────────────── */
/* `.bnv.is-rail` — a rail somebody chose: the menu's own collapse control (remembered per app),
   or a host that collapses the menu by itself.
   `.rail-host .bnv` — a host whose grid column decides and cannot put a class on the aside.
   Both write the SAME values as the medium size class in §4, so the rail exists once.
   The values are a rail's while it is SHUT. Opened — by its collapse control, or by its search —
   it is the whole menu again, the values above, standing over the page (the rule under these).
   `:where()` keeps that condition out of the selector's weight: the drawer of a phone-sized frame
   must still out-rank a rail saved on a desktop. */
:is(.bnv.is-rail,.rail-host .bnv):where(:not(.is-open)){
  --bnv-pad:12px 10px;
  --bnv-gap:6px;
  --bnv-row-w:36px;
  --bnv-row-h:36px;
  --bnv-row-pad:0;
  --bnv-row-gap:0;
  --bnv-row-justify:center;
  --bnv-head-h:36px;
  --bnv-head-pad:0 0 10px;
  --bnv-head-justify:center;
  --bnv-primary-w:36px;
  --bnv-primary-h:36px;
  --bnv-primary-pad:0;
  --bnv-primary-justify:center;
  --bnv-foot-align:center;
  --bnv-text:none;
  --bnv-ghead:none;
  --bnv-field:none;
  --bnv-more:none;
  --bnv-rest:flex;
  --bnv-head-dir:column;
  --bnv-turn:rotate(180deg);
}
/* An OPENED rail: the whole menu, standing over the page until a row is picked or it is shut — the
   way to a rail's search, and to the names of its rows. (The rail by width says the same in §4.) */
:is(.bnv.is-rail,.rail-host .bnv).is-open{position:fixed;inset-block:0;inset-inline-start:0;z-index:60;width:min(84vw,320px);box-shadow:var(--shadow-lg)}

/* ── §4 the sizes ─────────────────────────────────────────────────────────── */
/* The app declares ONE container (`.bnv-host`, on the element that wraps the shell) and one grid
   (`.appgrid`, whose side column is `--bnv-side`). From there: ≥840px the full menu, 600–839px the
   rail, <600px a drawer over one pane. Nothing here names a breakpoint of the WINDOW: the menu
   answers the space it is actually given, so the same app is right in a 940px pane, in a 2000px
   desktop, and on a 390px phone — which is exactly what a viewport query cannot do. */
.bnv-host{container-type:inline-size;container-name:bnav}
.appgrid{
  display:grid;
  grid-template-columns:var(--bnv-side,252px) minmax(0,1fr);
  min-width:0;
}
/* …and its `min-height:0` (an app may scroll inside a fixed shell) carries NO weight, so that a
   page which scrolls can say `min-height:100dvh` of its grid wherever it likes. At one class this
   line beat a page that said so ABOVE the block: the menu's panel ended where the content did, half
   way down the screen. Three pages moved their two lines below the block for it; the fourth — the
   apps screen, whose list is short for as long as it loads — never did. */
:where(.appgrid){min-height:0}
/* THE MENU STAYS. Where the PAGE scrolls, the menu's cell is as tall as the page and the menu left
   with it: by the end of a long list the notifications' filters and the apps' sections were a
   screen and a half up, over a column left empty (2026-10-09, the live office: 2360px of page). It
   is a frame tall at the most, and holds on to the frame's top. `:where()` keeps this at one class:
   the drawer and the opened rail — `position:fixed`, at two classes and more — still say where
   THEY stand. */
:where(.appgrid) > .bnv{position:sticky;inset-block-start:0;max-height:100dvh}
/* Which column the CONTENT is in — owned here, not by each app.
   The menu is `position:fixed` below 600px, and a fixed child is not a grid item: the browser
   places the remaining in-flow child (the content) into COLUMN 1, which is the side column. So the
   content inherited the menu's width — 252px on a desktop, 56/64px in the rail, and 0px once the
   phone collapses the side column. Measured 2026-10-01 at 390x844: `.pg` was 24px wide, mailview's
   phone score was clipping 0.0/15, and every adopter's phone layout was a sliver.
   It survived a green map because the DESKTOP profile has a fine pointer and a static aside: there
   the menu IS a grid item, the content auto-places into column 2, and nothing looks wrong. */
.appgrid > :not(.bnv):not(.bnv-scrim):not(.bnv-burger):not(.bnv-drawer){
  grid-column:2;
  min-width:0;
}
/* the burger: shown only where the menu is a drawer, and it is row-sized there */
.bnv-burger{
  display:none;flex:none;width:44px;height:44px;padding:0;border:0;border-radius:10px;
  background:transparent;color:inherit;align-items:center;justify-content:center;cursor:pointer;
}
.bnv-burger:hover{background:color-mix(in srgb, currentColor 8%, transparent)}
.bnv-burger:focus-visible{outline:2px solid currentColor;outline-offset:-2px}
.bnv-burger svg{width:20px;height:20px}
.bnv-scrim{
  position:fixed;inset:0;z-index:55;border:0;padding:0;
  background:var(--scrim);   /* the palette's own: mixed from the menu's ink it was a WHITE veil wherever that ink is light */
  opacity:0;visibility:hidden;transition:opacity .18s ease;
}
.bnv-scrim.is-open{opacity:1;visibility:visible}

/* medium — the rail, chosen by container width instead of by a class */
@container bnav (max-width:839px){
  .appgrid{--bnv-side:56px}
  .bnv:where(:not(.is-open)){
    --bnv-pad:12px 10px;
    --bnv-gap:6px;
    --bnv-row-w:36px;
    --bnv-row-h:36px;
    --bnv-row-pad:0;
    --bnv-row-gap:0;
    --bnv-row-justify:center;
    --bnv-head-h:36px;
    --bnv-head-pad:0 0 10px;
    --bnv-head-justify:center;
    --bnv-primary-w:36px;
    --bnv-primary-h:36px;
    --bnv-primary-pad:0;
    --bnv-primary-justify:center;
    --bnv-foot-align:center;
    --bnv-text:none;
    --bnv-ghead:none;
    --bnv-field:none;
    --bnv-more:none;
    --bnv-rest:flex;
    --bnv-head-dir:column;
    --bnv-turn:rotate(180deg);
  }
  .bnv.is-open{position:fixed;inset-block:0;inset-inline-start:0;z-index:60;width:min(84vw,320px);box-shadow:var(--shadow-lg)}
}
/* …and a rail somebody CHOSE takes a rail's column — where the frame is wide enough to have given the
   menu its whole one (below that the two size classes already say). Nothing said it: the icons of a
   chosen rail stood in a column 252px wide. */
@container bnav (min-width:840px){
  .appgrid:has(> .bnv.is-rail){--bnv-side:56px}
}
/* compact — one pane, and the menu becomes a drawer over it.
   `:is(.bnv,.bnv.is-rail,.rail-host .bnv)` is deliberate: a rail saved on a desktop must NOT
   survive into a phone, so this block has to out-rank the class trigger and the host class. */
@container bnav (max-width:599px){
  .appgrid{--bnv-side:0px}
  .bnv-burger{display:inline-flex}
  :is(.bnv,.bnv.is-rail,.rail-host .bnv){
    position:fixed;inset-block:0;inset-inline-start:0;z-index:60;
    width:min(84vw,320px);box-sizing:border-box;
    transform:translateX(var(--bnv-off,-100%));
    transition:transform .18s ease;
    --bnv-pad:8px 10px;
    --bnv-gap:2px;
    --bnv-row-w:100%;
    --bnv-row-h:44px;
    --bnv-row-pad:10px 8px;
    --bnv-row-gap:8px;
    --bnv-row-justify:flex-start;
    --bnv-head-h:52px;
    --bnv-head-pad:4px 6px 10px;
    --bnv-head-justify:flex-start;
    --bnv-primary-w:100%;
    --bnv-primary-h:44px;
    --bnv-primary-pad:10px 12px;
    --bnv-primary-justify:flex-start;
    --bnv-foot-align:stretch;
    --bnv-text:block;
    --bnv-ghead:flex;
    --bnv-field:block;
    --bnv-more:block;
    --bnv-rest:none;
    --bnv-head-dir:row;
    --bnv-turn:none;
  }
  /* The shadow is the OPEN drawer's. On the parked one it still painted: a 40px grey band down the
     screen edge, over the page, in every app that carries this menu (seen in five, 2026-10-06). */
  :is(.bnv,.bnv.is-rail,.rail-host .bnv).is-open{
    transform:none;
    box-shadow:var(--shadow-lg);
  }
}
/* in RTL the drawer parks on the other side — the only direction-dependent line in this file */
:is([dir="rtl"],:dir(rtl)) .bnv{--bnv-off:100%}

/* touch: the same rows, sized for a finger. bina keeps 36px on every pointer; a phone needs 44. */
@media (pointer:coarse){
  .bnv-item{min-height:44px;padding:10px 8px}
  .bnv-primary{min-height:44px}
  .bnv-search{min-height:44px}
  .bnv-act{width:36px;height:36px}
  :is(.bnv.is-rail,.rail-host .bnv):where(:not(.is-open)) .bnv-item{width:44px;height:44px;min-height:44px}
  /* THE RAIL IS A RAIL ONLY IN THE RAIL RANGE. This rule used to read `(max-width:839px)`, which
     also covers the compact range — and because it comes AFTER the compact block (§4), the same
     specificity meant it won there: on any touch device narrower than 600px `--bnv-side` was 64px
     instead of 0, so the drawer opened over a content column 64px wide.
     Measured 2026-10-01 on the office's own capture at 390x844 (`is_mobile`/`has_touch`, i.e. the
     profile the phone map uses): `.pg` came out 64px wide and mailview scored clipping 0.0/15 —
     "text cut with no way to reach it" was not the app's layout, it was this line. The desktop
     capture never saw it (fine pointer), which is why it survived a green map on both profiles. */
  @container bnav (min-width:600px) and (max-width:839px){
    .appgrid{--bnv-side:64px}
  }
  @container bnav (min-width:840px){
    .appgrid:has(> .bnv.is-rail){--bnv-side:64px}
  }
}
/* a SHORT panel — the menu of a window dragged small. Its head, its button and its foot are most
   of 224px, and the rows were left a sliver to scroll in (measured 2026-10-07 in the drive's
   menu: 20px for 416px of rows). There the PANEL scrolls, rows and all. */
@media (max-height:399px){
  .bnv{overflow-y:auto;overscroll-behavior:contain}
  .bnv-scroll{flex:none;overflow:visible}
  /* …and the page's own menu buttons are a cursor's size there, not a finger's: 44px of a head is a
     fifth of such a window (a touch screen keeps the finger's size — it is not this window). */
  @media (pointer:fine){.bnv-burger{width:32px;height:32px;border-radius:8px}}
}
@media (prefers-reduced-motion:reduce){
  .bnv,.bnv *,.bnv-scrim{transition:none!important;animation:none!important}
}
/* @bina-nav:end */
/* The page's half of the menu contract: its grid stands the screen's whole height, so the menu's
   panel does not end where the page's content does, half way down the screen. (The component's own
   `min-height:0` carries no weight — `:where` — so these two lines hold wherever they are written.) */
.bnv-host{min-height:100dvh}
.appgrid{min-height:100dvh}
</style>
</head>

<!-- the app's half of the menu contract: the container the menu measures, and the grid whose side
     column the component's size classes own. The menu is declared below, built by the shared
     component (gate G27 keeps that component identical in every app that carries it). -->
<div class="bnv-host">
<div class="appgrid">
  <aside class="side bnv" id="sideNav" aria-label="ניווט"></aside>
  <div class="pg">
  <header class="pg-head">
    <div>
      <h1>התראות</h1>
      <div class="pg-sub">מרכז התראות מאוחד — שגיאות, אירועים ומצב המערכת מכל האפליקציות.</div>
    </div>
    <!-- the menu holds this screen's filters, and below 600px it is a drawer: this opens it (the
         component shows the button only there, draws it and wires it) -->
    <button class="bnv-burger" type="button" data-nav-toggle="תפריט" title="תפריט — קריאה, חומרה, מקור"></button>
    <div class="pg-actions">
      <button id="live" class="pg-live" onclick="togglePause()" title="השהה/חדש רענון אוטומטי"><span class="beat"></span><span id="liveTxt">חי</span></button>
      <button id="readAll" class="btn" onclick="readAll()" title="סמן את כל ההתראות כנקראו"><span data-ic="check"></span>סמן הכל כנקרא</button>
      <button id="clearRead" class="btn ghost" onclick="clearRead()" title="הסר את כל ההתראות שנקראו">נקה נקראו</button>
    </div>
  </header>

  <div class="pg-kpis" id="hud"></div>

  <!-- The filter bar lived HERE and is now the menu's three sections: קריאה · חומרה · מקור. A row
       with a count is where a filter belongs — filtering IS navigation, and the content column is
       for the notifications themselves. -->

  <div id="list"><div class="state"><span class="spin"></span>טוען התראות…</div></div>
  </div><!-- /.pg -->
</div><!-- /.appgrid -->
</div><!-- /.bnv-host -->

  /** A search box: its magnifier and its field. The magnifier is a BUTTON — it puts the keyboard in the
   *  field. In a rail the field is gone and the box is the magnifier alone: there a press opens the
   *  menu over the page (`reach`) and lands in the field. A rail used to have no search at all. */
  function searchBox(placeholder, value, reach) {
    var box = el("div", "bnv-search");
    var go = el("button", null, svg("search"));
    go.type = "button";
    go.title = placeholder;
    go.setAttribute("aria-label", placeholder);
    var input = el("input");
    input.type = "search";
    input.placeholder = placeholder;
    input.setAttribute("aria-label", placeholder);
    if (value) input.value = value;
    box.appendChild(go);
    box.appendChild(input);
    box.addEventListener("click", function (ev) {
      if (ev.target === input) return;
      if (!shown(input)) reach();
      input.focus({ preventScroll: true });       // (the menu may still be sliding in: the page must not chase the field)
    });
    return { box: box, input: input };
  }

  /** The element the page actually scrolls inside — the nearest scroller, or none (the window). */
  function scrollerOf(node) {
    for (var n = node && node.parentElement; n; n = n.parentElement) {
      var cs = getComputedStyle(n);
      if (/(auto|scroll)/.test(cs.overflowY) && n.scrollHeight > n.clientHeight) return n;
    }
    return null;
  }

  /* ── a row ────────────────────────────────────────────────────────────────── */
  /* The trailing slot is built as NODES, never as a string: the badge is what changes while a
     person is looking at it (`setBadge`), so it has to be an element this file can find again. */
  function tailNode(spec) {
    var has = (spec.badge !== undefined && spec.badge !== null && spec.badge !== "") || spec.tail;
    if (!has) return null;
    var tail = el("span", "bnv-tail");
    if (spec.badge !== undefined && spec.badge !== null && spec.badge !== "") {
      var badge = el("span", "bnv-badge");
      badge.setAttribute("data-bnv-badge", "");
      badge.textContent = spec.badge;
      tail.appendChild(badge);
    }
    if (spec.tail) {
      if (typeof spec.tail === "string" && spec.tail.charAt(0) === "<") tail.innerHTML += spec.tail;
      else { var t = el("span"); t.textContent = spec.tail; tail.appendChild(t); }
    }
    return tail;
  }

  function row(spec, ctx) {
    var node = el(spec.href ? "a" : "button", "bnv-item");
    if (spec.href) node.setAttribute("href", spec.href); else node.setAttribute("type", "button");
    if (spec.id !== undefined && spec.id !== null) node.setAttribute("data-bnv-id", spec.id);
    node.title = spec.title || spec.label || "";
    node.appendChild(el("span", "bnv-ic", svg(spec.icon)));
    var label = el("span", "bnv-label");
    label.textContent = spec.label == null ? "" : spec.label;
    node.appendChild(label);
    if (spec.meta !== undefined && spec.meta !== null && spec.meta !== "") {
      var meta = el("span", "bnv-meta");
      meta.textContent = spec.meta;
      node.appendChild(meta);
    }
    var tail = tailNode(spec);
    if (tail) node.appendChild(tail);
    /* `active` is how a menu with MORE THAN ONE choice says where it stands: notifications picks a
       level AND a read state AND a source, so `setActive()` (one row in the whole menu) cannot
       express it. Re-rendering the section carries the marks with it. */
    if (spec.active) node.classList.add("is-active");
    if (spec.disabled) { node.setAttribute("aria-disabled", "true"); node.setAttribute("tabindex", "-1"); }
    node.addEventListener("click", function (ev) {
      if (spec.disabled) { ev.preventDefault(); return; }
      if (spec.onClick) spec.onClick(ev, spec);
      if (ctx.onPick) ctx.onPick(spec.id, spec);
      if (!spec.keepOpen) ctx.closeDrawer();
    });
    return node;
  }

  /* ── a group: header (title · ≤2 actions · search), rows, Priority+ ───────── */
  function group(spec, ctx) {
    var g = el("div", "bnv-group");
    if (spec.id) g.setAttribute("data-bnv-group", spec.id);
    var rows = [];
    var state = { el: g, rows: rows, section: spec, spec: spec };

    var actions = (spec.actions || []).slice(0, 2);
    if (spec.title || actions.length || spec.search) {
      var head = el("div", "bnv-ghead");
      var gtitle = el("span", "bnv-gtitle");
      gtitle.textContent = spec.title == null ? "" : spec.title;
      head.appendChild(gtitle);
      actions.forEach(function (a) {
        var node = el(a.href ? "a" : "button", "bnv-act", svg(a.icon));
        if (a.href) node.setAttribute("href", a.href); else node.setAttribute("type", "button");
        node.title = a.label || a.title || ""; node.setAttribute("aria-label", a.label || a.title || "");
        node.addEventListener("click", function (ev) { if (a.onClick) a.onClick(ev, a); });
        head.appendChild(node);
      });
      if (spec.search) {
        var toggle = el("button", "bnv-act", svg("search"));
        toggle.type = "button";
        toggle.title = (spec.search.placeholder || "חיפוש");
        toggle.setAttribute("aria-label", toggle.title);
        toggle.setAttribute("aria-expanded", spec.search.always ? "true" : "false");
        head.appendChild(toggle);
        g.appendChild(head);

        var sb = searchBox(spec.search.placeholder || "חיפוש", spec.search.value, ctx.openMenu);
        var box = sb.box, input = sb.input;
        if (!spec.search.always) box.hidden = true;
        g.appendChild(box);
        state.input = input; state.box = box; state.toggle = toggle;

        toggle.addEventListener("click", function () {
          box.hidden = !box.hidden;
          toggle.setAttribute("aria-expanded", box.hidden ? "false" : "true");
          if (!box.hidden) input.focus();
          else { input.value = ""; filter(state, ""); }
        });
        var onInput = function () {
          var q = input.value;
          if (spec.search.filter !== false) filter(state, q);
          if (spec.search.onInput) spec.search.onInput(q, spec);
        };
        input.addEventListener("input", onInput);
        input.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape" && input.value) { input.value = ""; onInput(); }
          ev.stopPropagation();
        });
      } else {
        g.appendChild(head);
      }
    }

    var list = el("div", "bnv-list");
    var items = spec.items || [];
    var limit = spec.showMore === true ? 8 : (typeof spec.showMore === "number" ? spec.showMore : 0);
    var head_items = limit > 0 && items.length > limit ? items.slice(0, limit) : items;
    var rest_items = limit > 0 && items.length > limit ? items.slice(limit) : [];
    head_items.forEach(function (it) { var r = row(it, ctx); rows.push(r); list.appendChild(r); });
    g.appendChild(list);

    if (rest_items.length) {
      var rest = el("div", "bnv-rest");
      rest_items.forEach(function (it) { var r = row(it, ctx); rows.push(r); rest.appendChild(r); });
      g.appendChild(rest);
      state.rest = rest;
      var more = el("button", "bnv-more");
      more.type = "button";
      var setMore = function (open) {
        rest.classList.toggle("is-open", open);
        more.textContent = open ? ctx.labels.less : ctx.labels.more + " (" + rest_items.length + ")";
      };
      setMore(false);
      more.addEventListener("click", function () { setMore(!rest.classList.contains("is-open")); });
      g.appendChild(more);
    }
    return state;
  }

  /** Client-side filtering: the label and the meta column are what a person reads. */
  function filter(state, q) {
    q = (q || "").trim().toLowerCase();
    var shown = 0;
    state.rows.forEach(function (r) {
      var on = !q || r.textContent.toLowerCase().indexOf(q) >= 0;
      r.hidden = !on;
      if (on) shown++;
    });
    if (q && !shown && !state.empty) {
      state.empty = el("div", "bnv-empty");
      state.empty.textContent = "לא נמצאו פריטים";
      state.el.appendChild(state.empty);
    } else if (state.empty) {
      state.empty.hidden = !!shown || !q;
    }
  }

  /* ── the mounted menu ─────────────────────────────────────────────────────── */
  function build(root, cfg) {
    var ctx = {
      labels: { more: cfg.labels && cfg.labels.more || LABELS.more, less: cfg.labels && cfg.labels.less || LABELS.less,
                rail: cfg.labels && cfg.labels.rail || LABELS.rail },
      onPick: cfg.onPick || null,
      closeDrawer: function () { if (root.classList.contains("is-open")) api.close(); },
      openMenu: function () { api.open(); }
    };
    var states = [];
    var rowsById = {};
    var headName = null, headSub = null, headAvatar = null;   // setBrand() writes these
    var navSearch = null;                                      // setSearch() writes this

    // 1. the brand row — square avatar, name, one line of context, the collapse control
    if (cfg.brand) {
      var head = el("div", "bnv-head");
      var av = cfg.brand.href ? el("a", "bnv-avatar") : el("span", "bnv-avatar");
      if (cfg.brand.href) av.setAttribute("href", cfg.brand.href);
      if (cfg.brand.image) av.innerHTML = '<img src="' + esc(cfg.brand.image) + '" alt="">';
      else av.textContent = cfg.brand.avatar || (cfg.brand.name || "?").charAt(0);
      head.appendChild(av);
      var text = el("div", "bnv-head-text");
      headName = brandLine("b");
      headName.textContent = cfg.brand.name || "";
      text.appendChild(headName);
      if (cfg.brand.sub) {
        headSub = brandLine("small");
        headSub.textContent = cfg.brand.sub;
        text.appendChild(headSub);
      }
      headAvatar = av;
      head.appendChild(text);
      if (cfg.collapse !== false) {
        var cbtn = el("button", "bnv-collapse", svg("chevron-end"));
        cbtn.type = "button";
        cbtn.title = ctx.labels.rail;
        cbtn.setAttribute("aria-label", ctx.labels.rail);
        /* ONE control, and what it does is what the menu is not. An opened menu folds back. The whole
           menu becomes a rail — a person's choice, remembered. A chosen rail is the whole menu again;
           and where the frame has no room for that (a rail by WIDTH), the menu opens over the page.
           It used to be hidden in a rail: one press of it, and there was nothing left to press. */
        cbtn.addEventListener("click", function () {
          if (api.isOpen()) { api.close(); return; }
          if (shown(headName)) { api.setRail(true); return; }
          if (root.classList.contains("is-rail")) api.setRail(false);
          if (!shown(headName)) api.open();
        });
        head.appendChild(cbtn);
      }
      if (cfg.brand.onClick) {
        av.style.cursor = "pointer";
        av.addEventListener("click", function (ev) { if (!cfg.brand.href) ev.preventDefault(); cfg.brand.onClick(ev); });
      }
      root.appendChild(head);
    }

    // 2. the ONE flat primary action
    if (cfg.primary) {
      var p = el(cfg.primary.href ? "a" : "button", "bnv-primary");
      if (cfg.primary.href) p.setAttribute("href", cfg.primary.href); else p.setAttribute("type", "button");
      p.title = cfg.primary.title || cfg.primary.label || "";
      p.appendChild(el("span", "bnv-ic", svg(cfg.primary.icon)));
      var plabel = el("span", "bnv-label");
      plabel.textContent = cfg.primary.label || "";
      p.appendChild(plabel);
      var ptail = tailNode(cfg.primary);
      if (ptail) p.appendChild(ptail);
      if (cfg.primary.disabled) { p.setAttribute("aria-disabled", "true"); p.setAttribute("tabindex", "-1"); }
      p.addEventListener("click", function (ev) {
        if (cfg.primary.disabled) { ev.preventDefault(); return; }
        if (cfg.primary.onClick) cfg.primary.onClick(ev);
        if (!cfg.primary.href) ev.preventDefault();
        ctx.closeDrawer();
      });
      root.appendChild(p);
    }

    // 3. the scrolling body
    var scroll = el("div", "bnv-scroll");
    root.appendChild(scroll);

    // a nav-level search: one box that filters every group, in the menu and not on the page
    if (cfg.search) {
      var nsb = searchBox(cfg.search.placeholder || "חיפוש", cfg.search.value, ctx.openMenu);
      var nbox = nsb.box, ninput = nsb.input;
      navSearch = ninput;
      scroll.appendChild(nbox);
      ninput.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && ninput.value) { ninput.value = ""; states.forEach(function (s) { filter(s, ""); }); }
        if (ev.key === "Escape") ev.stopPropagation();
      });
      /* `filter:false` is how an app says "this box searches the WORLD, not my menu": mail's search
         queries the mailbox, and hiding every menu row because a message did not match would be the
         menu answering a question nobody asked. */
      var filters = cfg.search.filter !== false;
      ninput.addEventListener("input", function () {
        var q = ninput.value;
        if (filters) states.forEach(function (s) { filter(s, q); });
        if (cfg.search.onInput) cfg.search.onInput(q);
      });
    }

    (cfg.sections || []).forEach(function (spec) {
      var st = group(spec, ctx);
      states.push(st);
      scroll.appendChild(st.el);
      st.rows.forEach(function (r) {
        var id = r.getAttribute("data-bnv-id");
        if (id !== null) rowsById[id] = r;
      });
    });

    // 4. the pinned footer
    if (cfg.footer) {
      var foot = el("div", "bnv-foot");
      (cfg.footer.items || []).forEach(function (it) { var r = row(it, ctx); foot.appendChild(r); });
      if (cfg.footer.text) { var ft = el("div", "bnv-foot-text"); ft.textContent = cfg.footer.text; foot.appendChild(ft); }
      /* `html` is the app's own block — a settings POPUP container, say — so it is not styled as
         the footer's small print, and it is never hidden by a rail: a rail still opens popups. */
      if (cfg.footer.html) foot.appendChild(el("div", "bnv-foot-extra", cfg.footer.html));
      root.appendChild(foot);
    }

    // 5. the drawer: a scrim, the toggles, Escape — all owned here, none of it in the app
    var scrim = null;
    function ensureScrim() {
      if (scrim) return scrim;
      scrim = el("button", "bnv-scrim");
      scrim.type = "button";
      scrim.setAttribute("aria-label", ctx.labels.less === "הצג פחות" ? "סגירת התפריט" : "close");
      scrim.addEventListener("click", function () { api.close(); });
      document.body.appendChild(scrim);
      return scrim;
    }
    if (document.body) ensureScrim();

    /* The page's half of the drawer: a button it marks `data-nav-toggle` opens and shuts the menu,
       and one it marks `data-nav-find` opens the menu ON its search. The page only places them (as
       `.bnv-burger`, which the stylesheet shows where the menu is a drawer); the drawing and the
       wiring are here — two screens had each written both for themselves, and three had no button
       at all, so on a phone their menu could not be opened. */
    function bindToggles() {
      [["data-nav-toggle", "menu", "תפריט", function () { api.toggle(); }],
       ["data-nav-find", "search", "חיפוש", function () { api.open(); if (navSearch) navSearch.focus({ preventScroll: true }); }]
      ].forEach(function (kind) {
        var nodes = document.querySelectorAll("[" + kind[0] + "]");
        for (var i = 0; i < nodes.length; i++) {
          var t = nodes[i];
          if (t.getAttribute("data-bnv-bound") === "1") continue;
          t.setAttribute("data-bnv-bound", "1");
          if (kind[0] === "data-nav-toggle") t.setAttribute("aria-expanded", "false");
          if (!t.getAttribute("aria-label")) t.setAttribute("aria-label", t.getAttribute(kind[0]) || kind[2]);
          if (!String(t.innerHTML || "").trim()) t.innerHTML = svg(kind[1]);
          t.addEventListener("click", function (ev) { ev.preventDefault(); kind[3](); });
        }
      });
    }

    var api = {
      el: root,
      id: cfg.id || null,
      sections: states,
      /** Mark one row as the current place. */
      setActive: function (id) {
        Object.keys(rowsById).forEach(function (k) {
          var on = k === String(id);
          rowsById[k].classList.toggle("is-active", on);
          if (on) rowsById[k].setAttribute("aria-current", "page");
          else rowsById[k].removeAttribute("aria-current");
        });
        return api;
      },
      /** The badge in a row's trailing slot — a count that changes under the reader. */
      setBadge: function (id, value) {
        var r = rowsById[String(id)];
        if (!r) return api;
        var tail = r.querySelector(".bnv-tail");
        var badge = tail && tail.querySelector("[data-bnv-badge]");
        if (value === null || value === undefined || value === "") {
          if (badge) badge.remove();
          return api;
        }
        if (!tail) { tail = el("span", "bnv-tail"); r.appendChild(tail); }
        if (!badge) { badge = el("span", "bnv-badge"); badge.setAttribute("data-bnv-badge", ""); tail.appendChild(badge); }
        badge.textContent = value;
        return api;
      },
      /** The second column of a row. */
      setMeta: function (id, value) {
        var r = rowsById[String(id)];
        if (!r) return api;
        var meta = r.querySelector(".bnv-meta");
        if (!meta) { meta = el("span", "bnv-meta"); r.insertBefore(meta, r.querySelector(".bnv-tail")); }
        meta.textContent = value == null ? "" : value;
        meta.hidden = !value;
        return api;
      },
      /** The brand's second line — whose mailbox, which account, which build. */
      setBrand: function (part) {
        if (!part) return api;
        if (part.name != null && headName) headName.textContent = part.name;
        if (part.sub != null) {
          if (!headSub) {
            headSub = brandLine("small");
            var box = root.querySelector(".bnv-head-text");
            if (box) box.appendChild(headSub);
          }
          headSub.textContent = part.sub;
        }
        if (part.avatar != null && headAvatar && !part.image) headAvatar.textContent = part.avatar;
        return api;
      },
      /** Mirror a URL's query into the menu's search, without firing the app's own handler. */
      setSearch: function (value) {
        if (navSearch) navSearch.value = value == null ? "" : value;
        return api;
      },
      /** Replace one group's rows in place — a menu whose lists come from the server. */
      setItems: function (sectionId, items, showMore) {
        var st = null;
        states.forEach(function (s) { if (!st && (s.spec.id === sectionId || s.spec.title === sectionId)) st = s; });
        if (!st) return api;
        var keep = st.el.querySelector(".bnv-ghead");
        var keepBox = st.box, keepToggle = st.toggle;
        st.el.innerHTML = "";
        if (keep) st.el.appendChild(keep);
        if (keepBox) st.el.appendChild(keepBox);
        var fresh = group({ id: st.spec.id, title: null, items: items, showMore: showMore === undefined ? st.spec.showMore : showMore }, ctx);
        [].slice.call(fresh.el.children).forEach(function (c) { st.el.appendChild(c); });
        st.rows = fresh.rows;
        st.rest = fresh.rest;
        st.rows.forEach(function (r) {
          var id = r.getAttribute("data-bnv-id");
          if (id !== null) rowsById[id] = r;
        });
        if (keepBox) { st.box = keepBox; st.toggle = keepToggle; }
        return api;
      },
      /** Rail (icon-only) — the state a person chooses; the size classes choose it by width. */
      setRail: function (on) {
        if (root.classList.contains("is-open")) api.close();     // (the menu over the page is not a state to be left in)
        root.classList.toggle("is-rail", !!on);
        try { if (api.id) localStorage.setItem("bnav:rail:" + api.id, on ? "1" : "0"); } catch (e) { /* private mode */ }
        if (cfg.onRail) cfg.onRail(!!on);
        return api;
      },
      isRail: function () { return root.classList.contains("is-rail"); },
      /** The menu over the page: the drawer of a phone-sized container, and a rail that is opened —
          by its collapse control, or by its search (see bina-nav.css §3 and §4). Where the menu is
          whole and in its own column nothing calls this. */
      open: function () {
        ensureScrim().classList.add("is-open");
        root.classList.add("is-open");
        document.querySelectorAll("[data-nav-toggle]").forEach(function (t) {
          t.setAttribute("aria-expanded", "true");
        });
        return api;
      },
      close: function () {
        if (scrim) scrim.classList.remove("is-open");
        root.classList.remove("is-open");
        document.querySelectorAll("[data-nav-toggle]").forEach(function (t) {
          t.setAttribute("aria-expanded", "false");
        });
        return api;
      },
      toggle: function () { return root.classList.contains("is-open") ? api.close() : api.open(); },
      isOpen: function () { return root.classList.contains("is-open"); },
      destroy: function () {
        if (scrim && scrim.parentElement) scrim.parentElement.removeChild(scrim);
        root.innerHTML = "";
        root.classList.remove("bnv", "is-rail", "is-open");
        if (api.id && NAVS[api.id] === api) delete NAVS[api.id];
      },
    };

    bindToggles();
    if (cfg.id) {
      NAVS[cfg.id] = api;
      try {
        if (cfg.rail === true || (cfg.rail !== false && localStorage.getItem("bnav:rail:" + cfg.id) === "1")) {
          root.classList.add("is-rail");
        }
      } catch (e) { /* private mode: no memory, no failure */ }
    } else if (cfg.rail) {
      root.classList.add("is-rail");
    }
    if (cfg.onRail) cfg.onRail(root.classList.contains("is-rail"));

    /* Escape shuts a menu that stands over the page, and the key stops there: it was for the top
       layer, not for whatever the page would close under it (so: on the way DOWN, before the page's
       own listeners). A search field with something in it keeps its first Escape — it empties itself. */
    document.addEventListener("keydown", function (ev) {
      if (ev.key !== "Escape" || !root.classList.contains("is-open")) return;
      var t = ev.target;
      if (t && t.value && t.closest && t.closest(".bnv-search")) return;
      api.close();
      ev.stopPropagation();
    }, true);
    return api;
  }

  /* ── the two older shapes, kept working ───────────────────────────────────── */
  /** Sections a page marked up itself: `<section id="x" data-nav="חשבונות" data-nav-icon="users">`.
      The SAME menu as a declared one — the brand row, the rail, the drawer, the remembered state —
      with one row per section: this shape built its rows by hand and so had none of them, and the
      one screen that uses it stood in the office as the menu with no name over it. A row scrolls to
      its section; the section in view is the one marked. */
  function mountSections(root, opts) {
    var secs = [].slice.call(document.querySelectorAll(opts.sections || "[data-nav]"));
    if (!secs.length) return null;
    /* A pressed row IS the marked one while the page travels to its section — and stays it when the
       page cannot travel that far: a last section too short to reach the top left the mark on the
       long one above it, under the finger that had just pressed another row. */
    var pressed = 0;
    var api = build(root, {
      id: opts.id, brand: opts.brand, rail: opts.rail, collapse: opts.collapse, labels: opts.labels, footer: opts.footer,
      sections: [{ items: secs.map(function (s) {
        return { id: s.id, label: s.getAttribute("data-nav") || s.id, icon: s.getAttribute("data-nav-icon"),
                 onClick: function () {
                   var sc = scrollerOf(root);
                   var top = s.getBoundingClientRect().top - (sc ? sc.getBoundingClientRect().top : 0)
                     + (sc ? sc.scrollTop : window.scrollY) - 8;
                   pressed = Date.now() + 1200;
                   api.setActive(s.id);
                   (sc || window).scrollTo({ top: top, behavior: "smooth" });
                 } };
      }) }],
    });
    if (typeof IntersectionObserver === "function") {
      /* The FIRST section in view, in the page's order — not the last one the observer happened to
         report: on load it reports them all at once, and the mark landed on whichever came last. */
      var inView = {};
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { inView[en.target.id] = en.isIntersecting; });
        if (Date.now() < pressed) return;
        for (var i = 0; i < secs.length; i++) if (inView[secs[i].id]) { api.setActive(secs[i].id); break; }
      }, { root: scrollerOf(root), rootMargin: "-10% 0px -70% 0px", threshold: 0 });
      secs.forEach(function (s) { io.observe(s); });
    }
    return api;
  }

  function mount(root, opts) {
    if (!root) return null;
    opts = opts || {};
    root.classList.add("bnv");
