  }).join("");
}

/* ── the filter bar is the MENU ──────────────────────────────────────────────────────────────────
   Filtering is navigation, so it belongs where navigation lives. The three axes the bar used to
   stack into one row — קריאה · חומרה · מקור — are three sections of the shared side menu, each row
   carrying its count, and the component owns what a row looks like, the rail, the drawer and the
   count pill. The bar itself is gone from the content column.
   A menu with THREE independent choices cannot use `setActive` (one row, whole menu), so each item
   declares `active` about its own axis and the section is re-rendered with the marks in it. */
var NAV=null;

function mountNav(){
  if(NAV||typeof BinaNav==="undefined")return NAV;
  var el=document.getElementById("sideNav"); if(!el)return null;
  NAV=BinaNav.mount(el,{
    id:"notifications",
    brand:{name:"התראות",sub:"מרכז התראות מאוחד",avatar:"ה"},
    sections:[
      {id:"read",  title:"קריאה", items:[]},
      {id:"level", title:"חומרה", items:[]},
      {id:"source",title:"מקור",  items:[], showMore:8}
    ]
  });
  return NAV;
}

function renderFilters(){
  var nav=mountNav(); if(!nav)return;
  // A count is said once it is KNOWN. The menu is drawn from the start — it was mounted BY the first answered
  // count, so with the service silent the whole side of the screen was a blank column — and a 0 would be a claim.
  var bl=(stats&&stats.by_level)||{}, n=function(v){return stats?v||0:undefined;};
  var un=n(stats&&stats.unread), tot=n(stats&&stats.total);

  nav.setItems("read",[
    {id:"read:all",    label:"הכל",      icon:"inbox", active:state.read==="all",    onClick:function(){setRead("all");}},
    {id:"read:unread", label:"לא נקראו", icon:"mail", badge:un, active:state.read==="unread", onClick:function(){setRead("unread");}}
  ],0);

  nav.setItems("level",[
    {id:"level:all",     label:"הכל",     icon:"list",  badge:tot,        active:state.level==="all",     onClick:function(){setLevel("all");}},
    {id:"level:error",   label:"שגיאות",  icon:"error", badge:n(bl.error),  active:state.level==="error",   onClick:function(){setLevel("error");}},
    {id:"level:warning", label:"אזהרות",  icon:"alert", badge:n(bl.warning),active:state.level==="warning", onClick:function(){setLevel("warning");}},
    {id:"level:info",    label:"מידע",    icon:"info",  badge:n(bl.info),   active:state.level==="info",    onClick:function(){setLevel("info");}}
  ],0);

  /* The sources are dynamic and can be many, so the tail is Priority+: the component keeps the
     first rows and hides the rest behind one row that names how many it holds. */
  var bs=(stats&&stats.by_source)||{};
  var srcs=Object.keys(bs);
  var items=[{id:"source:all", label:"כל המקורות", icon:"grid", active:!state.source, onClick:function(){setSource(null);}}];
  if(srcs.length>1){
    srcs.sort(function(a,b){return bs[b]-bs[a];}).forEach(function(s){
      items.push({id:"source:"+s, label:srcLabel(s), icon:srcIcon(s), badge:bs[s],
                  active:state.source===s, onClick:function(){setSource(s);}});
    });
  }
  nav.setItems("source", items, 8);
}

function setLevel(l){state.level=l;renderFilters();load();}
function setRead(r){state.read=r;OPENED={};renderFilters();load();}   // (a list that is left folds what was opened in it)
function setSource(s){state.source=s;renderFilters();load();}

/* ── list ───────────────────────────────────────────────────────────────── */
function itemHtml(n){
  var b=bucket(n.level), read=n.is_read;
  var meta=n.meta||{};
  var proj=meta.project?'<span class="tag proj">'+esc(meta.project)+'</span>':"";
  var cnt=(meta.count&&Number(meta.count)>1)?'<span class="cnt">×<span class="num">'+esc(meta.count)+'</span></span>':"";
  var open=n.link?'<a class="open" href="'+esc(n.link)+'"'+opens(n.link)+' onclick="event.stopPropagation()">פתח במקור</a>':"";
  var desc=n.body?'<div class="desc">'+linked(n.body)+'</div>':"";
  return ''+
  '<div class="item lv-'+b+(read?"":" unread")+(OPENED[n.id]?" whole":"")+'" data-id="'+n.id+'" onclick="onRowClick(event,'+n.id+','+(read?"1":"0")+')">'+
    '<div class="ava '+b+'">'+ic(srcIcon(n.source))+'</div>'+
    '<div class="body">'+
      '<div class="title">'+islands(n.title)+'</div>'+
      desc+
      '<div class="meta">'+
        '<span class="tag src">'+esc(srcLabel(n.source))+'</span>'+
        proj+cnt+
        '<span title="נראה לראשונה '+esc(rel(n.created_at))+'">'+esc(rel(lastAt(n)))+'</span>'+
        open+
      '</div>'+
    '</div>'+
    '<div class="rowacts">'+
      '<button class="iact" title="'+(read?"סמן כלא נקרא":"סמן כנקרא")+'" onclick="event.stopPropagation();toggleRead('+n.id+','+(read?"1":"0")+')">'+ic(read?"mail":"check")+'</button>'+
      '<button class="iact del" title="הסר" onclick="event.stopPropagation();dismiss('+n.id+')">'+ic("x")+'</button>'+
    '</div>'+
  '</div>';
}

var DRAWN=[];                    // the rows the list holds, as they were last read
function render(items){
  var list=document.getElementById("list");
  DRAWN=items;
  if(!items.length){
    var msg=state.read==="unread"?{i:"check",t:"הכל נקרא",s:"אין התראות שלא נקראו. עבודה טובה!"}
      :(state.level!=="all"||state.source)?{i:"search",t:"אין התראות תואמות",s:"נסה להסיר מסננים."}
      :{i:"bell",t:"אין התראות",s:"כשתתקבל התראה חדשה (שגיאה, אירוע מערכת) היא תופיע כאן."};
    list.innerHTML='<div class="state"><div class="ico">'+ic(msg.i)+'</div><div class="t">'+msg.t+'</div><div class="s">'+msg.s+'</div></div>';
    return;
  }
  // group by day (items are newest-first already)
  var groups=[],cur=null;
  items.forEach(function(n){
    var k=dayKey(lastAt(n));
    if(!cur||cur.k!==k){cur={k:k,items:[]};groups.push(cur);}
    cur.items.push(n);
  });
  list.innerHTML=groups.map(function(g){
    return '<div class="daygroup"><div class="dayhdr">'+esc(g.k)+'</div>'+
      g.items.map(itemHtml).join("")+'</div>';
  }).join("");
}

async function fetchStats(){
  try{
    var r=await fetch("api/notifications/stats",{headers:{Accept:"application/json"}});
    if(r.ok){stats=await r.json();renderHud();renderFilters();
      document.getElementById("readAll").disabled=(stats.unread===0);
      document.getElementById("clearRead").disabled=((stats.total-stats.unread)<=0);
      reportWidget();return true;}
  }catch(e){/* keep last */}
}
/* The console's desktop mode draws a window pushed far to the side as a small widget: this is what
   it says — the unread count. A label only; nothing is sent when the page is not embedded.
   One is said in the singular and with its numeral («1 לא נקראו» it said): the shell gives the line 120px, the
   tile's name included, and «אחת לא נקראה» needs 133 of them. */
function reportWidget(){
  if(window.parent===window)return;
  var n=(stats&&stats.unread)||0;
  try{window.parent.postMessage({type:"bina:widget",label:n?(n===1?"1 לא נקראה":n+" לא נקראו"):"הכל נקרא"},location.origin);}catch(e){}
}

/* In «לא נקראו» the press that OPENS a row also reads it, and the service's list of the unread no longer has it: the
   text left the screen under the eye that had just opened it. A row that is open there and is not among the unread
   is asked for by itself, and stands where the service's own order puts it - while it is open, and of this list
   (its level, its source). One that is gone, or is of another list, is forgotten; one whose own answer did not
   come stands as it was last read - the list is not held back for one row. (`OPENED[id]` is that last answer.) */
async function withOpen(items){
  var here={};items.forEach(function(n){here[n.id]=1;});
  var ids=Object.keys(OPENED).filter(function(id){return OPENED[id]&&!here[id];});
  if(!ids.length)return items;
  var rows=await Promise.all(ids.map(function(id){
    return fetch("api/notifications/"+id,{headers:{Accept:"application/json"}})
      .then(function(r){return r.status===404?null:r.ok?r.json():OPENED[id];}).catch(function(){return OPENED[id];});}));
  rows.forEach(function(n,i){
    if(!OPENED[ids[i]])return;   // (folded, or its list left, while its answer was on its way: the answer does not open it again)
    if(n===true)return;          // (not answered by itself yet, and no answer now: it is asked for again at the next read)
    if(n&&(state.level==="all"||bucket(n.level)===state.level)&&(!state.source||n.source===state.source)){OPENED[ids[i]]=n;items.push(n);}
    else delete OPENED[ids[i]];
  });
  var at=function(n){return n.last_seen||n.created_at||"";};
  return items.sort(function(a,b){return at(a)<at(b)?1:at(a)>at(b)?-1:b.id-a.id;});
}
/* `soft` is a read nobody pressed for - the list's own clock, and the read a row's opening press asks. It does not
   draw over a MARKED text: the list is redrawn whole, and a word a reader had just marked in a notification was
   unmarked by the next read. The list waits for the mark - a minute at most, so that a mark left standing does not
   keep new notifications out of it for good; its numbers do not wait at all. */
var MARKED=0;                    // when a soft read first met a mark it did not draw over
function listKey(){return state.read+"|"+state.level+"|"+(state.source||"");}
async function load(soft){
  var list=document.getElementById("list"), asked=listKey();
  try{
    var qs=["limit=200"];
    if(state.read==="unread")qs.push("unread=1");
    if(state.level!=="all")qs.push("level="+state.level);
    if(state.source)qs.push("source="+encodeURIComponent(state.source));
    var r=await fetch("api/notifications?"+qs.join("&"),{headers:{Accept:"application/json"}});
    if(!r.ok)throw new Error(String(r.status));
    var d=await r.json(), items=d.notifications||[];
    if(state.read==="unread")items=await withOpen(items);
    if(asked!==listKey())return; // (the answer of a list that was left is not drawn into the one that replaced it, which asked its own)
    unheard=false;chip();
    var mark=getSelection(), held=!!(soft&&mark&&String(mark)&&list.contains(mark.anchorNode));
    if(held&&!MARKED)MARKED=Date.now();
    if(!held||Date.now()-MARKED>60000){MARKED=0;render(items);}
  }catch(e){
    if(asked!==listKey())return;
    // the chip stops saying «חי», and a list that WAS read stays: one round with no answer emptied the screen
    unheard=true;chip();
    if(!list.querySelector(".item"))list.innerHTML='<div class="state err"><div class="ico">'+ic("alert")+'</div><div class="t">שגיאה בטעינת ההתראות</div><div class="s">המסך שואל שוב מעצמו כל 15 שניות.</div></div>';
  }
  fetchStats();
}

/* ── actions ────────────────────────────────────────────────────────────── */
/* A PRESS ON A ROW WHOSE TEXT IS CUT OPENS IT, and reads the row (the natural "seen" gesture). A row shows two
   lines of a notification's text: on a phone most texts are longer, and the press marked the row read and showed
   nothing more - the end of the sentence, and the link an address at its end is, could not be read at all. What a
   person opened stays open across the list's reads, in «לא נקראו» too (see withOpen). A row whose text is WHOLE
   has nothing to open: the press reads it, as it always did.
   An OPEN text is the reader's own - a word in it is marked and copied, and no press on it folds the row: a press
   beside the text does (the title, the line under it), and a fold reads nothing. And a press that marks text
   anywhere in the row - a drag from the title down - is no press at all. */
var OPENED={};
function onRowClick(ev,id,isRead){
  var mark=getSelection();
  if(ev.target.closest("a,button")||(mark&&String(mark)))return;      // (a link or a button in the row is its own press)
  var row=ev.currentTarget, text=row.querySelector(".desc"), was=!!OPENED[id];
  if(was&&ev.target.closest(".desc"))return;
  if(was||(text&&text.scrollHeight>text.clientHeight+1)){
    OPENED[id]=!was&&(DRAWN.filter(function(n){return n.id===id;})[0]||true);
    row.classList.toggle("whole",!was);
  }
  if(!was&&!isRead)setRead1(id,true,true);
  else if(was&&state.read==="unread")load();       // (a row kept in «לא נקראו» while it was open leaves it as it folds)
}
async function setRead1(id,read,soft){
  // the fourth action here that said nothing when it failed: a refusal was not read, and no answer was swallowed
  try{var r=await fetch("api/notifications/"+id+"/read",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({read:read})});
      if(!r.ok)binaTell("הסימון נכשל","bad");}
  catch(e){binaTell("הסימון נכשל — השירות לא ענה","bad");}
  load(soft);
}
function toggleRead(id,isRead){ if(busy)return;busy=true; setRead1(id,!isRead).finally(function(){busy=false;}); }

async function dismiss(id){
  if(busy)return;busy=true;
  var el=document.querySelector('.item[data-id="'+id+'"]');
  if(el){el.style.transition="opacity .15s";el.style.opacity="0";}
  // each of the three below said its good news whatever came back: a refusal read as done, and a service that
  // did not answer said nothing at all. (A 404 here means it is already gone - which is what was asked for.)
  try{var r=await fetch("api/notifications/"+id,{method:"DELETE"});
      if(r.ok||r.status===404)binaTell("ההתראה הוסרה");else{binaTell("ההסרה נכשלה","bad");if(el)el.style.opacity="";}}
  catch(e){binaTell("ההסרה נכשלה — השירות לא ענה","bad");if(el)el.style.opacity="";}   // (the row it faded stays in the list)
  finally{busy=false;load();}
}
async function readAll(){
  if(busy)return;busy=true;
  try{var r=await fetch("api/notifications/read-all",{method:"POST"});var d=await r.json().catch(function(){return {};});
      if(r.ok)binaTell(d.updated===1?"סומנה אחת כנקראה":"סומנו "+(d.updated||0)+" כנקראו");else binaTell("הסימון נכשל","bad");}   // (it said «סומנו 1 כנקראו»)
  catch(e){binaTell("הסימון נכשל — השירות לא ענה","bad");}
  finally{busy=false;load();}
}
/* WHAT DESTROYS ASKS FIRST. «נקה נקראו» deletes every notification that was read - of every level and source, whatever
   the list is narrowed to - and did so at one press. The count it asks about is READ AT THE PRESS: the tiles' own is
   a read behind (a moment after «סמן הכל כנקרא» they still counted what was read before it - the question would
   name three, and ten be deleted). The button is off while the count is read - the press is taken - and that is
   four seconds at most: a count that cannot be read is not said. Where nothing is read any more nothing is
   asked: the button stays off, and the list - which is the one that was behind - is read again. */
async function clearRead(){
  if(busy)return;busy=true;
  var b=document.getElementById("clearRead");b.disabled=true;
  var n=(await Promise.race([fetchStats(),new Promise(function(r){setTimeout(r,4000);})]))?stats.total-stats.unread:NaN;
  // (the focus the button lost by going off is given back to it - the question returns it there, as before; one a
  //  person moved meanwhile is theirs)
  var at=document.activeElement;b.disabled=n<=0;if(!b.disabled&&(!at||at===document.body||at===b))b.focus();
  if(n<=0||!(await binaAsk({danger:true,ok:"מחיקה",body:"פעולה זו אינה הפיכה.",
        title:n===1?"למחוק את ההתראה שנקראה?":"למחוק את "+(n>1?n+" ":"")+"ההתראות שנקראו?"}))){busy=false;if(n<=0)load();return;}
  try{var r=await fetch("api/notifications/clear-read",{method:"POST"});var d=await r.json().catch(function(){return {};});
      if(r.ok)binaTell(d.deleted===1?"נוקתה התראה אחת":"נוקו "+(d.deleted||0)+" התראות");else binaTell("הניקוי נכשל","bad");}   // (and «נוקו 1 התראות»)
  catch(e){binaTell("הניקוי נכשל — השירות לא ענה","bad");}
  finally{busy=false;load();}
}

/* ── live refresh ───────────────────────────────────────────────────────── */
/* The chip says what IS: «חי» only while the last read was answered — it beat on above «שגיאה בטעינת ההתראות». */
var unheard=false;
function chip(){var l=document.getElementById("live");
  // the shared chip: `data-stale` is the component's attribute, `paused` its own state
  l.classList.toggle("paused", paused);
  l.dataset.stale = paused||unheard ? "1" : "0";
  document.getElementById("liveTxt").textContent=paused?"מושהה":unheard?"אין תשובה מהשירות":"חי";}
function togglePause(){paused=!paused;chip();if(!paused)load();}

// A button's icon is named in the markup and drawn from the menu's vocabulary.
document.querySelectorAll("[data-ic]").forEach(function(e){e.innerHTML=ic(e.getAttribute("data-ic"));});
renderFilters();   // the menu is the screen's own: there before anything is read
load();
setInterval(function(){if(!paused&&!document.hidden)load(true);},15000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!paused)load(true);});
</script>
</body>
</html>
