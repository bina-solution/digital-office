# Provider catalog — APPS: mail, drive/data (supabase), WhatsApp, error tracking, other AI providers.

# ── Mail ───────────────────────────────────────────────────────────────────────
- id: gmail-app-password
  title: Gmail app-password (IMAP/SMTP — the active mail backend)
  title_he: סיסמת אפליקציה של Gmail (IMAP/SMTP)
  kind: app-password
  env: GMAIL_IMAP_APP_PW
  envs_extra: [GMAIL_IMAP_USER, GMAIL_IMAP_HOST, GMAIL_IMAP_PORT, GMAIL_IMAP_MODE]
  # consumers: DERIVED from each app\'s connections[] (see catalog()) — do not author
  now: "16-char Google app password in .env -> inbox service (IMAP read-pool + SMTP). Chosen over
        OAuth because it sidesteps Gmail-API quota AND supports append/seed (messages.insert). Per-business
        setup is manual: enable 2SV -> create app password -> set user/pw -> recreate inbox."
  # probe: contributed by the app (contributes.connection_probes) — gate G9
  wizard: "guided capture (step-by-step 'get your app password'); GMAIL_IMAP_MODE=local uses GreenMail (no key)"

- id: localmail
  title: Local mail (GreenMail) credentials — dev/CI
  kind: config
  env: LOCALMAIL_USER
  envs_extra: [LOCALMAIL_PW]
  # consumers: DERIVED from each app\'s connections[] (see catalog()) — do not author
  now: "env -> GreenMail user; inbox in GMAIL_IMAP_MODE=local points here (zero external mail)"
  # probe: contributed by the app (contributes.connection_probes) — gate G9
  wizard: "auto (local mode default)"

# ── Platform database (layer-1 `postgres`) ───────────────────────────────────────
# These are the DATABASE's credentials, not the gallery app's. The env names keep their historical
# SUPABASE_* spelling because every consumer (drive, apitools, indox, .env, scripts/ci-env.sh) reads
# them under those names and platform-base/postgres/hooks/keygen.py mints them — renaming is a
# separate migration. What DOES belong to apps/supabase is declared there:
#   supabase-dashboard  -> apps/supabase/app.json contributes.connection_providers (kong/Studio
#                          basic-auth: no kong, no secret — it must leave the catalog with the app)
#   the storage probe   -> apps/supabase/app.json contributes.connection_probes
- id: supabase-jwt-secret
  automint: {type: hex, bytes: 32}
  title: Supabase JWT secret (root of anon/service keys)
  kind: text-secret
  env: SUPABASE_JWT_SECRET
  # consumers: DERIVED from each app\'s connections[] (see catalog()) — do not author
  impact: [supabase, n8n, drive]
  rotate_warn: "החלפת הסוד תפסול את מפתחות ה‑anon/service הנגזרים ואת כל ה‑JWT הקיימים — supabase, n8n ו‑drive יאבדו גישה עד ל‑push + הפעלה מחדש."
  now: "plain env -> supabase; ANON_KEY + SERVICE_KEY are JWTs SIGNED by this (scripts/supabase-keygen.py).
        They are DERIVED, so they survive down -v as long as this secret is stable."
  probe: {type: tcp, host: supabase-db, port: 5432}
  wizard: "auto-mint"

- id: supabase-service-key
  title: Supabase service key (privileged)
  kind: derived
  derive_from: SUPABASE_JWT_SECRET
  env: SUPABASE_SERVICE_KEY
  # consumers: DERIVED from each app\'s connections[] (see catalog()) — do not author
  now: "generated by supabase-keygen.py from the JWT secret; reseeded into n8n cred 'Supabase Storage'
        (supabaseStorage001) via credential_overrides; drive uses it to write storage objects."
  # Presence is all the BASE can assert: the key is a JWT derived from SUPABASE_JWT_SECRET and is
  # consumed by drive and indox whether or not the supabase gallery app is installed. The stronger
  # probe — http://storage:5000/status, which proves the key actually opens the object-storage API —
  # names a layer-3 container, so apps/supabase contributes it (contributes.connection_probes) and
  # it overrides this row only while that app is installed. Gate G9.
  probe: {type: present}
  wizard: "auto-derived, never asked"

- id: supabase-anon-key
  title: Supabase anon key (public)
  kind: derived
  derive_from: SUPABASE_JWT_SECRET
  env: SUPABASE_ANON_KEY
  # consumers: DERIVED from each app\'s connections[] (see catalog()) — do not author
  now: "generated by supabase-keygen.py; PostgREST/Kong use it as the public API key"
  probe: {type: present}
  wizard: "auto-derived, never asked"

- id: supabase-db-password
  automint: {type: password, chars: 24}
  title: Supabase Postgres password
  kind: password
  env: SUPABASE_DB_PASSWORD
  # consumers: DERIVED from each app\'s connections[] (see catalog()) — do not author
  now: "plain env -> supabase-db; reseeded into n8n cred 'INDOX Supabase Postgres'(yY8F) via
        credential_overrides; drive connects with it"
  probe: {type: tcp, host: supabase-db, port: 5432}
  wizard: "auto-mint"

# supabase-dashboard MOVED to apps/supabase/app.json (contributes.connection_providers). It is a
# basic-auth password for kong + Studio and an app-password tile pointing at SUPABASE_STUDIO_BASE_URL
# — a layer-1 catalog file describing a layer-3 app's login, which is the portainer-admin bug
# verbatim: with supabase uninstalled the connections UI offered a credential card for a service
# nobody has. Declared by the app, the compiler emits it into .generated/registry and it appears
# only while the app is installed.

# ── WhatsApp ──────────────────────────────────────────────────────────────────────
- id: whatsapp-baileys
  title: WhatsApp device session (Baileys QR pairing) — the QR/barcode key
  title_he: חיבור מכשיר ווצאפ (סריקת QR)
  kind: qr-session
  # session_path REMOVED: it named `production/chat/…`, renamed away by the platform-OS refactor —
  # and where the session lives is the owning app's fact. chat mounts it and now names it too
  # (contributes.env.connections WA_SESSION_DIR, beside the /wa volume).
  # consumers: DERIVED from each app\'s connections[] (see catalog()) — do not author
  now: "the chat service embeds Baileys IN-PROCESS (NOT Evolution). useMultiFileAuthState writes the
        session as FILES under /app/data/auth_info (bind-mounted, host path hardcoded today). QR string
        surfaced at GET /api/bot/qr as a PNG when disconnected; a true logout fs.rmSync's the dir ->
        re-pair. NO env var."
  probe: {type: qr-paired}
  wizard: "render the /api/bot/qr PNG inline; watch for pairing; mirror auth_info into the vault + 're-pair'"

# chat-auth MOVED to apps/chat/app.json (contributes.connection_providers), 2026-10-07: the chat
# service's admin login, shown under «סיסמאות אפליקציות» with an address to open. hp-laptop does not
# run chat and its screen offered that login and that address anyway — the supabase-dashboard bug
# again. The vault key is unchanged (and `wadmin-auth`, its old name, is still read:
# RENAMED_CONNECTIONS in app.py).

# REMOVED — `whsp2-evolution` and `chatbase`, both catalogued "declared, NOT built": no container,
# no code, no consumer, and their env vars appear nowhere in this repo but here. A catalog row is a
# claim that something needs the secret; "listed for completeness" is how it becomes a catalog of
# what someone once planned, for a human to read and dismiss.

# ── Error tracking (GlitchTip) ──────────────────────────────────────────────────
# glitchtip-secret-key, glitchtip-db-password and glitchtip-admin MOVED to
# platform-base/glitchtip/app.json (contributes.connection_providers), 2026-10-07: GlitchTip is their
# only consumer, so they are in an office's catalog exactly while GlitchTip is. The two rows below
# stay because someone else reads them (notifications reads the API token; the DSNs go to the apps
# that report errors).
- id: app-sentry-dsns
  title: Per-app GlitchTip DSNs (n8n/apitools/chat)
  kind: derived
  derive_from: GLITCHTIP_SECRET_KEY
  env: N8N_SENTRY_DSN
  # LIBRECHAT_SENTRY_DSN dropped with the app: nothing mints or reads it, and an env listed here is
  # counted as a field of this connection — it made the row report 4 fields where 3 exist.
  envs_extra: [APITOOLS_SENTRY_DSN, CHAT_SENTRY_DSN]
  # consumers: DERIVED from each app\'s connections[] (see catalog()) — do not author
  now: "scripts/glitchtip-push computes deterministic DSNs and WRITES them back into .env; each app's
        SDK reads its DSN from env"
  probe: {type: present}
  wizard: "auto-derived, never asked"

- id: glitchtip-api-token
  title: GlitchTip read API token (notifications poller)
  title_he: מפתח קריאה של GlitchTip (למרכז ההתראות)
  kind: derived
  derive_from: GLITCHTIP_ADMIN_PASSWORD
  env: GLITCHTIP_API_TOKEN
  # consumers: DERIVED from each app\'s connections[] (see catalog()) — do not author
  now: "scripts/glitchtip-push mints a scoped read APIToken for the admin user and writes
        GLITCHTIP_API_TOKEN into .env; the notifications service polls GlitchTip issues with it"
  probe: {type: present}
  wizard: "auto-minted by glitchtip-push, never asked"

