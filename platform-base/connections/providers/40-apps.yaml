# ── Links between digital offices (apps/dgo-extend) ──────────────────────────────
# A link token is not a password a person types: it is minted by the office that consumes the link
# and stored as one instance per (link, direction). It is what the other office checks before it
# accepts a request over the tunnel — the tunnel proves WHO is calling (WireGuard), the token proves
# that this caller is allowed to (the direction was granted).
- id: dgo-link
  title: Digital office link (a token per link, per direction)
  title_he: קישור בין לשכות (אסימון לכל קישור ולכל כיוון)
  kind: secret
  env: DGO_LINK_TOKEN
  now: "minted by apps/dgo-extend when a link is declared; the consuming office holds the token and
        the serving office holds the grant, so revoking a link is removing one instance and one line
        of a declaration — and it is enforced on the receiving side, not by the token alone."
  wizard: "automatic (bbox dgo link add / the connect screen); no secret is ever pasted by hand"
