  var LABELS = { more: "הצג עוד", less: "הצג פחות", open: "פתיחת התפריט", close: "סגירת התפריט",
                 rail: "התפריט: מלא, או פס של סמלים" };

  // Every mounted menu, by `id` — so a toggle anywhere in the document can name the one it opens.
  var NAVS = {};

  function svg(name) {
    if (!name) return "";
    if (name.charAt(0) === "<") return name;            // a caller may pass its own <svg>…</svg>
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
      + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'
      + (ICONS[name] || ICONS.dot) + '"/></svg>';
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  /** A line of the brand row. It is one line, cut where it does not fit — and it reads the way its own
   *  first letter does (`dir=auto`), so an address («office@…») loses its END. In the menu's own
   *  right-to-left box it lost its beginning: «…olutions.co.il · Gmail». The stylesheet keeps the line
   *  on the menu's side whichever way it reads. */
  function brandLine(tag) {
    var n = el(tag);
    n.setAttribute("dir", "auto");
    return n;
  }

  /** Is a part of the menu on the screen? A rail takes parts away in the stylesheet — the brand's text,
   *  the search's field — and what a press does there depends on which. */
  function shown(n) {
    return !!n && (typeof n.getClientRects !== "function" || n.getClientRects().length > 0);
  }

  /** A search box: its magnifier and its field. The magnifier is a BUTTON — it puts the keyboard in the
   *  field. In a rail the field is gone and the box is the magnifier alone: there a press opens the
   *  menu over the page (`reach`) and lands in the field. A rail used to have no search at all. */
  function searchBox(placeholder, value, reach) {
    var box = el("div", "bnv-search");
    var go = el("button", null, svg("search"));
    go.type = "button";
    go.title = placeholder;
    go.setAttribute("aria-label", placeholder);
    var input = el("input");
    input.type = "search";
    input.placeholder = placeholder;
    input.setAttribute("aria-label", placeholder);
    if (value) input.value = value;
    box.appendChild(go);
    box.appendChild(input);
    box.addEventListener("click", function (ev) {
      if (ev.target === input) return;
      if (!shown(input)) reach();
      input.focus({ preventScroll: true });       // (the menu may still be sliding in: the page must not chase the field)
    });
    return { box: box, input: input };
  }

  /** The element the page actually scrolls inside — the nearest scroller, or none (the window). */
  function scrollerOf(node) {
    for (var n = node && node.parentElement; n; n = n.parentElement) {
      var cs = getComputedStyle(n);
      if (/(auto|scroll)/.test(cs.overflowY) && n.scrollHeight > n.clientHeight) return n;
    }
    return null;
  }

  /* ── a row ────────────────────────────────────────────────────────────────── */
  /* The trailing slot is built as NODES, never as a string: the badge is what changes while a
     person is looking at it (`setBadge`), so it has to be an element this file can find again. */
  function tailNode(spec) {
    var has = (spec.badge !== undefined && spec.badge !== null && spec.badge !== "") || spec.tail;
    if (!has) return null;
    var tail = el("span", "bnv-tail");
    if (spec.badge !== undefined && spec.badge !== null && spec.badge !== "") {
      var badge = el("span", "bnv-badge");
      badge.setAttribute("data-bnv-badge", "");
      badge.textContent = spec.badge;
      tail.appendChild(badge);
    }
    if (spec.tail) {
      if (typeof spec.tail === "string" && spec.tail.charAt(0) === "<") tail.innerHTML += spec.tail;
      else { var t = el("span"); t.textContent = spec.tail; tail.appendChild(t); }
    }
    return tail;
  }

  function row(spec, ctx) {
    var node = el(spec.href ? "a" : "button", "bnv-item");
    if (spec.href) node.setAttribute("href", spec.href); else node.setAttribute("type", "button");
    if (spec.id !== undefined && spec.id !== null) node.setAttribute("data-bnv-id", spec.id);
    node.title = spec.title || spec.label || "";
    node.appendChild(el("span", "bnv-ic", svg(spec.icon)));
    var label = el("span", "bnv-label");
    label.textContent = spec.label == null ? "" : spec.label;
    node.appendChild(label);
    if (spec.meta !== undefined && spec.meta !== null && spec.meta !== "") {
      var meta = el("span", "bnv-meta");
      meta.textContent = spec.meta;
      node.appendChild(meta);
    }
    var tail = tailNode(spec);
    if (tail) node.appendChild(tail);
    /* `active` is how a menu with MORE THAN ONE choice says where it stands: notifications picks a
       level AND a read state AND a source, so `setActive()` (one row in the whole menu) cannot
       express it. Re-rendering the section carries the marks with it. */
    if (spec.active) node.classList.add("is-active");
    if (spec.disabled) { node.setAttribute("aria-disabled", "true"); node.setAttribute("tabindex", "-1"); }
    node.addEventListener("click", function (ev) {
      if (spec.disabled) { ev.preventDefault(); return; }
      if (spec.onClick) spec.onClick(ev, spec);
      if (ctx.onPick) ctx.onPick(spec.id, spec);
      if (!spec.keepOpen) ctx.closeDrawer();
    });
    return node;
  }

  /* ── a group: header (title · ≤2 actions · search), rows, Priority+ ───────── */
  function group(spec, ctx) {
    var g = el("div", "bnv-group");
    if (spec.id) g.setAttribute("data-bnv-group", spec.id);
    var rows = [];
    var state = { el: g, rows: rows, section: spec, spec: spec };

    var actions = (spec.actions || []).slice(0, 2);
    if (spec.title || actions.length || spec.search) {
      var head = el("div", "bnv-ghead");
      var gtitle = el("span", "bnv-gtitle");
      gtitle.textContent = spec.title == null ? "" : spec.title;
      head.appendChild(gtitle);
      actions.forEach(function (a) {
        var node = el(a.href ? "a" : "button", "bnv-act", svg(a.icon));
        if (a.href) node.setAttribute("href", a.href); else node.setAttribute("type", "button");
        node.title = a.label || a.title || ""; node.setAttribute("aria-label", a.label || a.title || "");
        node.addEventListener("click", function (ev) { if (a.onClick) a.onClick(ev, a); });
        head.appendChild(node);
      });
      if (spec.search) {
        var toggle = el("button", "bnv-act", svg("search"));
        toggle.type = "button";
        toggle.title = (spec.search.placeholder || "חיפוש");
        toggle.setAttribute("aria-label", toggle.title);
        toggle.setAttribute("aria-expanded", spec.search.always ? "true" : "false");
        head.appendChild(toggle);
        g.appendChild(head);

        var sb = searchBox(spec.search.placeholder || "חיפוש", spec.search.value, ctx.openMenu);
        var box = sb.box, input = sb.input;
        if (!spec.search.always) box.hidden = true;
        g.appendChild(box);
        state.input = input; state.box = box; state.toggle = toggle;

        toggle.addEventListener("click", function () {
          box.hidden = !box.hidden;
          toggle.setAttribute("aria-expanded", box.hidden ? "false" : "true");
          if (!box.hidden) input.focus();
          else { input.value = ""; filter(state, ""); }
        });
        var onInput = function () {
          var q = input.value;
          if (spec.search.filter !== false) filter(state, q);
          if (spec.search.onInput) spec.search.onInput(q, spec);
        };
        input.addEventListener("input", onInput);
        input.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape" && input.value) { input.value = ""; onInput(); }
          ev.stopPropagation();
        });
      } else {
        g.appendChild(head);
      }
    }

    var list = el("div", "bnv-list");
    var items = spec.items || [];
    var limit = spec.showMore === true ? 8 : (typeof spec.showMore === "number" ? spec.showMore : 0);
    var head_items = limit > 0 && items.length > limit ? items.slice(0, limit) : items;
    var rest_items = limit > 0 && items.length > limit ? items.slice(limit) : [];
    head_items.forEach(function (it) { var r = row(it, ctx); rows.push(r); list.appendChild(r); });
    g.appendChild(list);

    if (rest_items.length) {
      var rest = el("div", "bnv-rest");
      rest_items.forEach(function (it) { var r = row(it, ctx); rows.push(r); rest.appendChild(r); });
      g.appendChild(rest);
      state.rest = rest;
      var more = el("button", "bnv-more");
      more.type = "button";
      var setMore = function (open) {
        rest.classList.toggle("is-open", open);
        more.textContent = open ? ctx.labels.less : ctx.labels.more + " (" + rest_items.length + ")";
      };
      setMore(false);
      more.addEventListener("click", function () { setMore(!rest.classList.contains("is-open")); });
      g.appendChild(more);
    }
    return state;
  }

  /** Client-side filtering: the label and the meta column are what a person reads. */
  function filter(state, q) {
    q = (q || "").trim().toLowerCase();
    var shown = 0;
    state.rows.forEach(function (r) {
      var on = !q || r.textContent.toLowerCase().indexOf(q) >= 0;
      r.hidden = !on;
      if (on) shown++;
    });
    if (q && !shown && !state.empty) {
      state.empty = el("div", "bnv-empty");
      state.empty.textContent = "לא נמצאו פריטים";
      state.el.appendChild(state.empty);
    } else if (state.empty) {
      state.empty.hidden = !!shown || !q;
    }
  }

  /* ── the mounted menu ─────────────────────────────────────────────────────── */
  function build(root, cfg) {
    var ctx = {
      labels: { more: cfg.labels && cfg.labels.more || LABELS.more, less: cfg.labels && cfg.labels.less || LABELS.less,
                rail: cfg.labels && cfg.labels.rail || LABELS.rail },
      onPick: cfg.onPick || null,
      closeDrawer: function () { if (root.classList.contains("is-open")) api.close(); },
      openMenu: function () { api.open(); }
    };
    var states = [];
    var rowsById = {};
    var headName = null, headSub = null, headAvatar = null;   // setBrand() writes these
    var navSearch = null;                                      // setSearch() writes this

    // 1. the brand row — square avatar, name, one line of context, the collapse control
    if (cfg.brand) {
      var head = el("div", "bnv-head");
      var av = cfg.brand.href ? el("a", "bnv-avatar") : el("span", "bnv-avatar");
      if (cfg.brand.href) av.setAttribute("href", cfg.brand.href);
      if (cfg.brand.image) av.innerHTML = '<img src="' + esc(cfg.brand.image) + '" alt="">';
      else av.textContent = cfg.brand.avatar || (cfg.brand.name || "?").charAt(0);
      head.appendChild(av);
      var text = el("div", "bnv-head-text");
      headName = brandLine("b");
      headName.textContent = cfg.brand.name || "";
      text.appendChild(headName);
      if (cfg.brand.sub) {
        headSub = brandLine("small");
        headSub.textContent = cfg.brand.sub;
        text.appendChild(headSub);
      }
      headAvatar = av;
      head.appendChild(text);
      if (cfg.collapse !== false) {
        var cbtn = el("button", "bnv-collapse", svg("chevron-end"));
        cbtn.type = "button";
        cbtn.title = ctx.labels.rail;
        cbtn.setAttribute("aria-label", ctx.labels.rail);
        /* ONE control, and what it does is what the menu is not. An opened menu folds back. The whole
           menu becomes a rail — a person's choice, remembered. A chosen rail is the whole menu again;
           and where the frame has no room for that (a rail by WIDTH), the menu opens over the page.
           It used to be hidden in a rail: one press of it, and there was nothing left to press. */
        cbtn.addEventListener("click", function () {
          if (api.isOpen()) { api.close(); return; }
          if (shown(headName)) { api.setRail(true); return; }
          if (root.classList.contains("is-rail")) api.setRail(false);
          if (!shown(headName)) api.open();
        });
        head.appendChild(cbtn);
      }
      if (cfg.brand.onClick) {
        av.style.cursor = "pointer";
        av.addEventListener("click", function (ev) { if (!cfg.brand.href) ev.preventDefault(); cfg.brand.onClick(ev); });
      }
      root.appendChild(head);
    }

    // 2. the ONE flat primary action
    if (cfg.primary) {
      var p = el(cfg.primary.href ? "a" : "button", "bnv-primary");
      if (cfg.primary.href) p.setAttribute("href", cfg.primary.href); else p.setAttribute("type", "button");
      p.title = cfg.primary.title || cfg.primary.label || "";
      p.appendChild(el("span", "bnv-ic", svg(cfg.primary.icon)));
      var plabel = el("span", "bnv-label");
      plabel.textContent = cfg.primary.label || "";
      p.appendChild(plabel);
      var ptail = tailNode(cfg.primary);
      if (ptail) p.appendChild(ptail);
      if (cfg.primary.disabled) { p.setAttribute("aria-disabled", "true"); p.setAttribute("tabindex", "-1"); }
      p.addEventListener("click", function (ev) {
        if (cfg.primary.disabled) { ev.preventDefault(); return; }
        if (cfg.primary.onClick) cfg.primary.onClick(ev);
        if (!cfg.primary.href) ev.preventDefault();
        ctx.closeDrawer();
      });
      root.appendChild(p);
    }

    // 3. the scrolling body
    var scroll = el("div", "bnv-scroll");
    root.appendChild(scroll);

    // a nav-level search: one box that filters every group, in the menu and not on the page
    if (cfg.search) {
      var nsb = searchBox(cfg.search.placeholder || "חיפוש", cfg.search.value, ctx.openMenu);
      var nbox = nsb.box, ninput = nsb.input;
      navSearch = ninput;
      scroll.appendChild(nbox);
      ninput.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && ninput.value) { ninput.value = ""; states.forEach(function (s) { filter(s, ""); }); }
        if (ev.key === "Escape") ev.stopPropagation();
      });
      /* `filter:false` is how an app says "this box searches the WORLD, not my menu": mail's search
         queries the mailbox, and hiding every menu row because a message did not match would be the
         menu answering a question nobody asked. */
      var filters = cfg.search.filter !== false;
      ninput.addEventListener("input", function () {
        var q = ninput.value;
        if (filters) states.forEach(function (s) { filter(s, q); });
        if (cfg.search.onInput) cfg.search.onInput(q);
      });
    }

    (cfg.sections || []).forEach(function (spec) {
      var st = group(spec, ctx);
      states.push(st);
      scroll.appendChild(st.el);
      st.rows.forEach(function (r) {
        var id = r.getAttribute("data-bnv-id");
        if (id !== null) rowsById[id] = r;
      });
    });

    // 4. the pinned footer
    if (cfg.footer) {
      var foot = el("div", "bnv-foot");
      (cfg.footer.items || []).forEach(function (it) { var r = row(it, ctx); foot.appendChild(r); });
      if (cfg.footer.text) { var ft = el("div", "bnv-foot-text"); ft.textContent = cfg.footer.text; foot.appendChild(ft); }
      /* `html` is the app's own block — a settings POPUP container, say — so it is not styled as
         the footer's small print, and it is never hidden by a rail: a rail still opens popups. */
      if (cfg.footer.html) foot.appendChild(el("div", "bnv-foot-extra", cfg.footer.html));
      root.appendChild(foot);
    }

    // 4b. THE FRAME AND THE WAY IN, owned here too — an adopter can no longer lose its menu.
    //   · The size classes are CONTAINER queries (`.bnv-host` + `.appgrid`), and an app that
    //     declares neither gets the desktop menu in every frame. Measured on the live office,
    //     2026-10-12: `sites` and `domains` drew a 56px rail **127px tall** with the rest of the
    //     menu nowhere, and `drive` parked its drawer off-canvas at x=404 of a 390px phone — three
    //     apps whose navigation a phone could not reach at all. So the menu marks the element it was
    //     given as the container, which is exactly what its own sizes answer.
    //   · A page that placed no `[data-nav-toggle]` gets one from here: a 48px button in the corner
    //     a phone leaves free, shown only in the compact frame (`html.bnv-float` + the stylesheet).
    function ownFrame() {
      // A frame that cannot be asked is not a frame to fail in: every step is guarded, and losing
      // the fallback button is the most a limited host can cost.
      try {
        var parent = root.parentElement;
        if (parent && parent.classList && typeof parent.closest === "function" && !parent.closest(".bnv-host")) {
          parent.classList.add("bnv-host");
        }
        if (typeof document.querySelector !== "function") return;
        if (document.querySelector("[data-nav-toggle]")) return;
        var b = el("button", "bnv-burger is-float");
        b.type = "button";
        b.setAttribute("data-nav-toggle", "menu");
        (document.body || document.documentElement).appendChild(b);
        if (document.documentElement && document.documentElement.classList) document.documentElement.classList.add("bnv-float");
      } catch (e) { /* the menu still draws: the button is the only thing that can be missing */ }
    }

    // 5. the drawer: a scrim, the toggles, Escape — all owned here, none of it in the app
    var scrim = null;
    function ensureScrim() {
      if (scrim) return scrim;
      scrim = el("button", "bnv-scrim");
      scrim.type = "button";
      scrim.setAttribute("aria-label", ctx.labels.less === "הצג פחות" ? "סגירת התפריט" : "close");
      scrim.addEventListener("click", function () { api.close(); });
      document.body.appendChild(scrim);
      return scrim;
    }
    if (document.body) ensureScrim();

    /* The page's half of the drawer: a button it marks `data-nav-toggle` opens and shuts the menu,
       and one it marks `data-nav-find` opens the menu ON its search. The page only places them (as
       `.bnv-burger`, which the stylesheet shows where the menu is a drawer); the drawing and the
       wiring are here — two screens had each written both for themselves, and three had no button
       at all, so on a phone their menu could not be opened. */
    function bindToggles() {
      [["data-nav-toggle", "menu", "תפריט", function () { api.toggle(); }],
       ["data-nav-find", "search", "חיפוש", function () { api.open(); if (navSearch) navSearch.focus({ preventScroll: true }); }]
      ].forEach(function (kind) {
        var nodes = document.querySelectorAll("[" + kind[0] + "]");
        for (var i = 0; i < nodes.length; i++) {
          var t = nodes[i];
          if (t.getAttribute("data-bnv-bound") === "1") continue;
          t.setAttribute("data-bnv-bound", "1");
          if (kind[0] === "data-nav-toggle") t.setAttribute("aria-expanded", "false");
          if (!t.getAttribute("aria-label")) t.setAttribute("aria-label", t.getAttribute(kind[0]) || kind[2]);
          if (!String(t.innerHTML || "").trim()) t.innerHTML = svg(kind[1]);
          t.addEventListener("click", function (ev) { ev.preventDefault(); kind[3](); });
        }
      });
    }

    ownFrame();
    bindToggles();

    var api = {
      el: root,
      id: cfg.id || null,
      sections: states,
      /** Mark one row as the current place. */
      setActive: function (id) {
        Object.keys(rowsById).forEach(function (k) {
          var on = k === String(id);
          rowsById[k].classList.toggle("is-active", on);
          if (on) rowsById[k].setAttribute("aria-current", "page");
          else rowsById[k].removeAttribute("aria-current");
        });
        return api;
      },
      /** The badge in a row's trailing slot — a count that changes under the reader. */
      setBadge: function (id, value) {
        var r = rowsById[String(id)];
        if (!r) return api;
        var tail = r.querySelector(".bnv-tail");
        var badge = tail && tail.querySelector("[data-bnv-badge]");
        if (value === null || value === undefined || value === "") {
          if (badge) badge.remove();
          return api;
        }
        if (!tail) { tail = el("span", "bnv-tail"); r.appendChild(tail); }
        if (!badge) { badge = el("span", "bnv-badge"); badge.setAttribute("data-bnv-badge", ""); tail.appendChild(badge); }
        badge.textContent = value;
        return api;
      },
      /** The second column of a row. */
      setMeta: function (id, value) {
        var r = rowsById[String(id)];
        if (!r) return api;
        var meta = r.querySelector(".bnv-meta");
        if (!meta) { meta = el("span", "bnv-meta"); r.insertBefore(meta, r.querySelector(".bnv-tail")); }
        meta.textContent = value == null ? "" : value;
        meta.hidden = !value;
        return api;
      },
      /** The brand's second line — whose mailbox, which account, which build. */
      setBrand: function (part) {
        if (!part) return api;
        if (part.name != null && headName) headName.textContent = part.name;
        if (part.sub != null) {
          if (!headSub) {
            headSub = brandLine("small");
            var box = root.querySelector(".bnv-head-text");
            if (box) box.appendChild(headSub);
          }
          headSub.textContent = part.sub;
        }
        if (part.avatar != null && headAvatar && !part.image) headAvatar.textContent = part.avatar;
        return api;
      },
      /** Mirror a URL's query into the menu's search, without firing the app's own handler. */
      setSearch: function (value) {
        if (navSearch) navSearch.value = value == null ? "" : value;
        return api;
      },
      /** Replace one group's rows in place — a menu whose lists come from the server. */
      setItems: function (sectionId, items, showMore) {
        var st = null;
        states.forEach(function (s) { if (!st && (s.spec.id === sectionId || s.spec.title === sectionId)) st = s; });
        if (!st) return api;
        var keep = st.el.querySelector(".bnv-ghead");
        var keepBox = st.box, keepToggle = st.toggle;
        st.el.innerHTML = "";
        if (keep) st.el.appendChild(keep);
        if (keepBox) st.el.appendChild(keepBox);
        var fresh = group({ id: st.spec.id, title: null, items: items, showMore: showMore === undefined ? st.spec.showMore : showMore }, ctx);
        [].slice.call(fresh.el.children).forEach(function (c) { st.el.appendChild(c); });
        st.rows = fresh.rows;
        st.rest = fresh.rest;
        st.rows.forEach(function (r) {
          var id = r.getAttribute("data-bnv-id");
          if (id !== null) rowsById[id] = r;
        });
        if (keepBox) { st.box = keepBox; st.toggle = keepToggle; }
        return api;
      },
      /** Rail (icon-only) — the state a person chooses; the size classes choose it by width. */
      setRail: function (on) {
        if (root.classList.contains("is-open")) api.close();     // (the menu over the page is not a state to be left in)
        root.classList.toggle("is-rail", !!on);
        try { if (api.id) localStorage.setItem("bnav:rail:" + api.id, on ? "1" : "0"); } catch (e) { /* private mode */ }
        if (cfg.onRail) cfg.onRail(!!on);
        return api;
      },
      isRail: function () { return root.classList.contains("is-rail"); },
      /** The menu over the page: the drawer of a phone-sized container, and a rail that is opened —
          by its collapse control, or by its search (see bina-nav.css §3 and §4). Where the menu is
          whole and in its own column nothing calls this. */
      open: function () {
        ensureScrim().classList.add("is-open");
        root.classList.add("is-open");
        document.querySelectorAll("[data-nav-toggle]").forEach(function (t) {
          t.setAttribute("aria-expanded", "true");
        });
        return api;
      },
      close: function () {
        if (scrim) scrim.classList.remove("is-open");
        root.classList.remove("is-open");
        document.querySelectorAll("[data-nav-toggle]").forEach(function (t) {
          t.setAttribute("aria-expanded", "false");
        });
        return api;
      },
      toggle: function () { return root.classList.contains("is-open") ? api.close() : api.open(); },
      isOpen: function () { return root.classList.contains("is-open"); },
      destroy: function () {
        if (scrim && scrim.parentElement) scrim.parentElement.removeChild(scrim);
        root.innerHTML = "";
        root.classList.remove("bnv", "is-rail", "is-open");
        if (api.id && NAVS[api.id] === api) delete NAVS[api.id];
      },
    };

    bindToggles();
    if (cfg.id) {
      NAVS[cfg.id] = api;
      try {
        if (cfg.rail === true || (cfg.rail !== false && localStorage.getItem("bnav:rail:" + cfg.id) === "1")) {
          root.classList.add("is-rail");
        }
      } catch (e) { /* private mode: no memory, no failure */ }
    } else if (cfg.rail) {
      root.classList.add("is-rail");
    }
    if (cfg.onRail) cfg.onRail(root.classList.contains("is-rail"));

    /* Escape shuts a menu that stands over the page, and the key stops there: it was for the top
       layer, not for whatever the page would close under it (so: on the way DOWN, before the page's
       own listeners). A search field with something in it keeps its first Escape — it empties itself. */
    document.addEventListener("keydown", function (ev) {
      if (ev.key !== "Escape" || !root.classList.contains("is-open")) return;
      var t = ev.target;
      if (t && t.value && t.closest && t.closest(".bnv-search")) return;
      api.close();
      ev.stopPropagation();
    }, true);
    return api;
  }

  /* ── the two older shapes, kept working ───────────────────────────────────── */
  /** Sections a page marked up itself: `<section id="x" data-nav="חשבונות" data-nav-icon="users">`.
      The SAME menu as a declared one — the brand row, the rail, the drawer, the remembered state —
      with one row per section: this shape built its rows by hand and so had none of them, and the
      one screen that uses it stood in the office as the menu with no name over it. A row scrolls to
      its section; the section in view is the one marked. */
  function mountSections(root, opts) {
    var secs = [].slice.call(document.querySelectorAll(opts.sections || "[data-nav]"));
    if (!secs.length) return null;
    /* A pressed row IS the marked one while the page travels to its section — and stays it when the
       page cannot travel that far: a last section too short to reach the top left the mark on the
       long one above it, under the finger that had just pressed another row. */
    var pressed = 0;
    var api = build(root, {
      id: opts.id, brand: opts.brand, rail: opts.rail, collapse: opts.collapse, labels: opts.labels, footer: opts.footer,
      sections: [{ items: secs.map(function (s) {
        return { id: s.id, label: s.getAttribute("data-nav") || s.id, icon: s.getAttribute("data-nav-icon"),
                 onClick: function () {
                   var sc = scrollerOf(root);
                   var top = s.getBoundingClientRect().top - (sc ? sc.getBoundingClientRect().top : 0)
                     + (sc ? sc.scrollTop : window.scrollY) - 8;
                   pressed = Date.now() + 1200;
                   api.setActive(s.id);
                   (sc || window).scrollTo({ top: top, behavior: "smooth" });
                 } };
      }) }],
    });
    if (typeof IntersectionObserver === "function") {
      /* The FIRST section in view, in the page's order — not the last one the observer happened to
         report: on load it reports them all at once, and the mark landed on whichever came last. */
      var inView = {};
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { inView[en.target.id] = en.isIntersecting; });
        if (Date.now() < pressed) return;
        for (var i = 0; i < secs.length; i++) if (inView[secs[i].id]) { api.setActive(secs[i].id); break; }
      }, { root: scrollerOf(root), rootMargin: "-10% 0px -70% 0px", threshold: 0 });
      secs.forEach(function (s) { io.observe(s); });
    }
    return api;
  }

  function mount(root, opts) {
    if (!root) return null;
    opts = opts || {};
    root.classList.add("bnv");
    root.setAttribute("data-bnv-mounted", "1");
    if (typeof opts.sections === "string") return mountSections(root, opts);
    // the flat list an app passes when it has routes and nothing else: `{items, onPick}`
    if (!opts.sections && opts.items) opts = { id: opts.id, items: null, sections: [{ items: opts.items }], onPick: opts.onPick, rail: opts.rail, collapse: false, labels: opts.labels };
    return build(root, opts);
  }

  // ── a menu nobody mounted is still this component's menu ────────────────────────────────────────
  // WHAT WAS WRONG. Eight screens (sites, domains, drive, git, digital-assets, social-list,
  // telegram-tv, …) carry the menu's MARKUP — rows they wrote themselves — and copied only the CSS
  // block, never this script. So they had the component's looks and none of its behaviour: no
  // container, no rail geometry at the sizes it declares, no drawer, and no button to open it. On a
  // phone that is a 56px rail 127px tall and a menu that cannot be reached (measured on the live
  // office 2026-10-12, from the owner's screenshot: «חייב פיתרון אחיד לניווט צד שמתפקד אותו דבר בכל
  // האפלקציות»). The answer is not eight fixes: the script ADOPTS any `.bnv` on the page that was
  // not mounted, gives it the container its sizes answer and the way in it lacks — one mechanism,
  // the same in every app.
  function adoptStatic(doc) {
    var menus = doc.querySelectorAll(".bnv:not([data-bnv-mounted])");
    for (var i = 0; i < menus.length; i++) {
      var menu = menus[i];
      try {
        var parent = menu.parentElement;
        if (parent && parent.classList && typeof parent.closest === "function" && !parent.closest(".bnv-host")) {
          parent.classList.add("bnv-host");
        }
        // the drawer's own furniture, since no `build()` ran for this menu: a scrim, Escape, and a
        // button — and picking a row shuts it, like every mounted menu does
        var scrim = doc.querySelector(".bnv-scrim");
        if (!scrim) {
          scrim = el("button", "bnv-scrim");
          scrim.type = "button";
          scrim.setAttribute("aria-label", LABELS.close);
          (doc.body || doc.documentElement).appendChild(scrim);
        }
        var shut = function () { menu.classList.remove("is-open"); scrim.classList.remove("is-open"); };
        scrim.addEventListener("click", shut);
        menu.addEventListener("click", function (ev) {
          var row = ev.target && ev.target.closest && ev.target.closest(".bnv-item");
          if (row) shut();
        });
        doc.addEventListener("keydown", function (ev) { if (ev.key === "Escape") shut(); });
        menu.setAttribute("data-bnv-mounted", "static");
        // …and the way in: the component's own 48px button, exactly as a page that placed none
        if (typeof doc.querySelector === "function" && !doc.querySelector("[data-nav-toggle]")) {
          var b = el("button", "bnv-burger is-float");
          b.type = "button";
          b.setAttribute("data-nav-toggle", "menu");
          b.setAttribute("aria-label", LABELS.open);
          b.innerHTML = svg("menu");
          b.addEventListener("click", function () {
            var open = !menu.classList.contains("is-open");
            menu.classList.toggle("is-open", open);
            scrim.classList.toggle("is-open", open);
            b.setAttribute("aria-expanded", String(open));
          });
          (doc.body || doc.documentElement).appendChild(b);
          if (doc.documentElement && doc.documentElement.classList) doc.documentElement.classList.add("bnv-float");
        }
      } catch (e) { /* one menu that cannot be adopted is not the other menus' problem */ }
    }
  }
  if (typeof document !== "undefined" && typeof document.querySelectorAll === "function") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { adoptStatic(document); });
    else adoptStatic(document);
  }

  return { mount: mount, svg: svg, icons: ICONS, labels: LABELS, navs: NAVS, adopt: adoptStatic,
           forId: function (id) { return NAVS[id] || null; } };
})();
/* @bina-nav-js:end */
</script>
