// The Digital Office's Android app (DGO-1071). Built by .github/workflows/android-app.yml on a hosted
// runner, which carries the Android SDK; dgo for android/arm64 goes in as the app's native library.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "DigitalOffice"
include ":app"
