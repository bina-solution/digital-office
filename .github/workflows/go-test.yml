name: go-test

# The office's native binaries are tested on every push that can change them, and on every pull
# request — not only on a release tag. Until this workflow, `go test` ran in release-binaries.yml
# alone (a v* tag or a manual dispatch), so a Go change that broke a test could sit on a branch unseen
# until the next release (plan step 0, ai/context/dgo-architecture-2026.md §6, DGO-594). "That can
# change them" is the path list below and it is why it exists: `every push` was 90 pushes a day on one
# 2-core runner, and the gates of a released batch waited ten hours behind them (DGO-1619).
#
# packaging/dgo's tests include ORACLE tests: they run platform/manager/reconcile.py (and the other
# Python originals a slice ports) beside the Go code on the same input and require identical answers.
# They skip themselves when no Python with PyYAML is on PATH, which on a runner would read as a pass
# while proving nothing — so PyYAML and Flask are ensured first, and a skipped oracle fails the job.

# WHICH PUSHES ASK FOR A GO TEST (DGO-1619). It used to be every push of every branch: on 2026-11-09
# alone that was 20 pushes on hp-dgo and 70 on mac-dgo, and each one queued this file's five-module
# matrix on the ONE runner (the Dell, 2 cores) — behind which a dgo-stable batch's gates waited ten
# hours. What runs `go test` reads MORE of the checkout than it looks: the oracles run the checkout's
# own Python, its schema and its state files, they exec `bbox` and `scripts/lib.sh`, and the console
# package is an oracle on `platform-base/console/`. An ALLOW-LIST of "the paths that matter" was the
# first draft and it was wrong in a way that fails open: one forgotten path (platform-base/console/**,
# platform.state.core.yaml, .env.ex, bbox) and a push that changes them runs NO Go test at all — and
# the only other `go test` in the repo is release-binaries.yml on a v* tag, which is the "sits on a
# branch unseen until the next release" this file was written to end.
# So the filter is a DENY-LIST of trees no Go code can observe. A file that is not inert in a way
# somebody checked runs the matrix: the wrong answer costs a queued job, never a silent green.
on:
  push:
    # A push that changes nothing a Go test reads takes no turn on the Dell's one runner, the runner the
    # release gates wait on. Measured 2026-11-09: go-test took ~512 runner-minutes in 24 h, and 26 of 51
    # mac-dgo pushes touched only these trees. None of them is read by packaging/dgo: no Go file names
    # them (git grep, 0 hits each). Briefs (AGENT.md) and ai/context ARE read by the compiler, so they
    # stay in. GitHub skips the run only when EVERY changed file matches.
    paths-ignore:
      - 'research_notes/**'
      - 'reports/**'
      - 'issues/**'
      - 'apps/project-pln/plans/**'
      - 'apps/digital-assets/content/**'
      # the public exporter's rules and its selftest (2026-11-13, DGO-1838: eight pushes of only these in one night,
      # each a five-module run that held the Dell's take of a green batch behind it); no Go file names them
      - 'scripts/release/**'
  pull_request:
  workflow_dispatch:

# ONE RUN PER BRANCH, AND THE RUNNING ONE FINISHES: a newer push replaces only the run still WAITING in the
# group (GitHub's rule for `cancel-in-progress: false`), so a branch always gets the verdict of the proof
# that started, then of its newest head. This is the SECOND time it is chosen, each time on a measurement:
# `false` on 2026-11-02 (five pushes in ten minutes cancelled every run, r030-003); then cancelling in place
# for every branch but dgo-stable, which on 2026-11-10 — seven lanes pushing mac-dgo every ~1.5 minutes —
# cancelled 60 of 63 go-test runs since 12:00Z and left the branch with almost no verdict, and never a green one
# (issues/the-branch-seven-lanes-…yaml, DGO-1797). The price: a running branch run now drains, and the one
# runner has no priorities, so a dgo-stable run queued behind it waits. dgo-stable's RUNNING run was never
# cancelled and still is not; its waiting one, like every branch's, is replaced by a newer one.
concurrency:
  group: go-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    # An UNCHANGED fork's pull request is skipped here: this job runs on our own machine, and the public copy of this
    # file is on a public repository, where anyone can open one (DGO-1962). A branch of this repository runs as before.
    # Defence in depth only: a pull request runs the workflow files of its own merge commit, which its author can
    # change. The boundary is the repository's setting — the self-hosted runner not available to the public
    # repository, or every outside contributor's run held for approval.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, portable]
    permissions:
      contents: read
      actions: write   # scripts/ci/step-aside: whether a version's proof is waiting, and the cancel of this run
    timeout-minutes: 75   # 30 for the job + up to 45 that ops/prejob_waitfree.sh may hold it (memory, heat, a fresh boot)
    strategy:
      fail-fast: false
      matrix:
        module: [packaging/trust, packaging/dgo, packaging/installer, packaging/relsign, platform-base/forward-auth]
    steps:
      # A VERSION'S PROOF GOES FIRST (DGO-1819): the price above, measured — on 2026-11-11 a version's proof stood
      # 45 minutes behind office-branch jobs. On any branch but dgo-stable this job asks scripts/ci/step-aside first,
      # when the runner takes it: while a gates-hosted run of dgo-stable is queued or running, it cancels its own run in
      # seconds (the run reads «cancelled», never a green). A running run still drains; a superseded head is not a
      # reason (the group's comment above: DGO-1797); a hand-run, a tag or a pull request never steps aside.
      - uses: actions/checkout@v4
        if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/dgo-stable'
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: scripts/ci/step-aside
          sparse-checkout-cone-mode: false
          path: .step-aside
          persist-credentials: false
      - name: A version's proof goes first (scripts/ci/step-aside)
        if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/dgo-stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .step-aside/scripts/ci/step-aside && rm -rf .step-aside

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false   # stdlib-only modules: no go.sum, nothing to cache

      # The oracles compare the Go code with CPython 3.12's exact answers — refusal messages, nesting and
      # digit limits, address tables. The runner's own python3 is Ubuntu 26.04's, newer, and an
      # interpreter that is not 3.12 answers some inputs differently: in WSL's 3.10, five oracle cases
      # of the compiler lanes differ (2026-10-15), and the net lane requires 3.12.4 or later. A red that
      # is the interpreter's and not the port's proves nothing, so the interpreter is pinned.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The console image's own declaration, as release-binaries.yml installs it: PyYAML, Flask, werkzeug,
      # flask-compress and requests, pinned as the image has them — the console's oracle needs the last
      # three, and under DGO_ORACLE_REQUIRED a clean tool cache would fail it on the first missing one.
      - name: The oracles' Python (the console image's requirements.txt)
        run: python3 -m pip install --quiet -r platform-base/console/requirements.txt

      - name: vet + gofmt — ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then echo "::error::not gofmt-formatted: ${unformatted}"; exit 1; fi

      - name: test — ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        env:
          # The oracles FAIL instead of skipping when what they compare against is missing (Python,
          # PyYAML, Flask, the checkout's state file) — the skip below is the second guard, not the first.
          DGO_ORACLE_REQUIRED: "1"
        run: |
          set -euo pipefail
          # The compiler's oracle package takes 5–11 minutes on a loaded machine (measured 2026-10-15: 685 s
          # on Windows, 678 s in WSL) — past go test's default 10-minute timeout, which would read as a hang.
          # -p 2: two packages at a time, not one per CPU. On the Dell (an i7-5500U laptop, 4 threads) the full
          # width ran the package to 96°C and froze it (DGO-1122, 2026-11-02); the wall time is the oracle
          # package's own, so halving the width costs little.
          go test -p 2 -count=1 -timeout 20m -v ./... 2>&1 | tee "${RUNNER_TEMP}/go-test.log"
          # An oracle that skipped proved nothing: the job fails instead of reading as green — known by
          # its name (…MatchesPython), or by its reason, which -v prints on a line BEFORE the skip: serve's
          # and engine's oracles skip as "no python with … on PATH" / "no python3 here" under names that
          # say neither (the second reader of 3158af77..ce975f56, DGO-1038).
          if grep -E -- '--- SKIP' "${RUNNER_TEMP}/go-test.log" | grep -qiE 'python|pyyaml|flask' \
             || grep -qE '_test\.go:[0-9]+: no python' "${RUNNER_TEMP}/go-test.log"; then
            echo "::error::an oracle test skipped — the Python it compares against was not found"
            exit 1
          fi
