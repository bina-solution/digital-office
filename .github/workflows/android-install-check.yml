name: android-install-check

# A drafted APK installed on an Android emulator on the Dell's runner with `adb install`, which says WHY an
# install fails — a phone's installer says only «App not installed as package appears to be invalid» (the
# owner's phone, android-0.1.50, 2026-11-02, DGO-1090). The draft is read by its tag, checked against its
# .sha256, installed, and the app is started; the installer's and the app's log lines are kept.
#
#   a push to mac-dgo whose head commit says "[android-install-check android-0.1.50]" checks that draft
#
# With "[machine-check]" too, the app's first open is followed as a phone's is (DGO-1089): the machine
# fetched over the emulator's Wi-Fi, checked, unpacked, and its QEMU started — the bytes the emulator
# received, /data used and a QEMU process each minute, a screenshot every 5 minutes, attached to the draft
# as check-<run>-*.png. (Its boot is android-guest.yml's proof: QEMU under the emulator's own arm64
# translation is far slower than on a phone.)
#
# The emulator is x86_64 with Android's own arm64 translation (the app ships arm64-v8a only), on KVM.
#
# Where (DGO-1797): the office's device first. Job `office` is light — the device does the work inside its own
# app (apps/android-emulator, its heat rule and limits) — so any portable runner may take it; where it reaches
# the device's door (ci-runner's agent, in the office) apps/android-emulator/check.py asks it every part below.
# Where it does not (a runner on the Dell's host), job `install` starts an emulator on the host as before, with
# a warning — until the office's runner has run the check once; then `install` is removed.

on:
  push:
    branches: [mac-dgo]
  # …or by hand, for a release that android-app.yml just made (DGO-1328): no commit to carry the tag
  workflow_dispatch:
    inputs:
      release:
        description: "the APK's release, e.g. android-0.2.89"
        type: string
        required: true
      machine:
        description: "follow the first open's machine too ([machine-check])"
        type: boolean
        default: false

permissions:
  contents: write   # a draft release is visible only to a token that may write ("release not found" under read)
jobs:
  office:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-install-check ')
    runs-on: [self-hosted, portable]
    timeout-minutes: 255   # the boot under the heat rule (30), the install (30) and the machine's 170
    # one check at a time: two would put a host emulator and the office's device on the Dell together (its 92°C
    # shutdown), or one run's cleanup would stop the device the other uses. On the JOBS, not the workflow: every
    # push to mac-dgo makes a run, and a run-level group would let a push that checks nothing cancel a queued check
    concurrency:
      group: android-install-check
      cancel-in-progress: false
    outputs:
      office: ${{ steps.door.outputs.office }}
    env:
      MSG: ${{ github.event_name == 'workflow_dispatch' && format('[android-install-check {0}]', inputs.release) || github.event.head_commit.message }}
      MACHINE: ${{ (contains(github.event.head_commit.message, '[machine-check]') || inputs.machine) && '1' || '' }}
    steps:
      - name: The draft the commit names
        id: draft
        run: |
          set -euo pipefail
          t="$(printf '%s\n' "${MSG}" | grep -oE '\[android-install-check android-[0-9]+\.[0-9]+\.[0-9]+\]' | head -1 \
            | sed -E 's/^\[android-install-check (android-[0-9.]+)\]$/\1/')"
          [ -n "${t}" ] || { echo "::error::name the draft in the commit: [android-install-check android-0.1.N]"; exit 1; }
          echo "tag=${t}" >> "${GITHUB_OUTPUT}"
          echo "draft ${t}"

      - name: The office's Android device, when this job runs in the office
        id: door
        run: |
          door="${ANDROID_DEVICE_DOOR:-http://android-emulator:8080}"
          # three tries over ~30 s: a door that is restarting is not «no device here»
          for i in 1 2 3; do
            if curl -fsS --max-time 5 "${door}/healthz" > /dev/null 2>&1; then
              echo "office=1" >> "${GITHUB_OUTPUT}"
              echo "the office's device answers at ${door}: the check asks it (apps/android-emulator/check.py)"
              exit 0
            fi
            [ "${i}" = 3 ] || sleep 10
          done
          echo "no office device at ${door} from runner ${RUNNER_NAME}: job «install» checks on its host"

      - uses: actions/checkout@v4
        if: steps.door.outputs.office == '1'
        with:
          sparse-checkout: apps/android-emulator
          persist-credentials: false

      - name: gh, where the runner has none
        if: steps.door.outputs.office == '1'
        run: |
          set -euo pipefail
          if command -v gh >/dev/null; then gh --version | head -1; exit 0; fi
          v=2.62.0
          sum=41c8b0698ad3003cb5c44bde672a1ffd5f818595abd80162fbf8cc999418446a   # gh_2.62.0_checksums.txt
          d="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP}}/gh/${v}"
          if [ ! -x "${d}/bin/gh" ]; then
            mkdir -p "${d}"
            t="${RUNNER_TEMP}/gh.tgz"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_amd64.tar.gz" -o "${t}"
            echo "${sum}  ${t}" | sha256sum -c -
            tar -xzf "${t}" -C "${d}" --strip-components=1
            rm -f "${t}"
          fi
          echo "${d}/bin" >> "${GITHUB_PATH}"
          "${d}/bin/gh" --version | head -1

      - name: The APK, as the draft has it
        if: steps.door.outputs.office == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="${RUNNER_TEMP}/apk"
          rm -rf "${d}" && mkdir -p "${d}"
          gh release download "${{ steps.draft.outputs.tag }}" -R "${GITHUB_REPOSITORY}" -p '*.apk' -p '*.apk.sha256' -D "${d}"
          (cd "${d}" && sha256sum -c ./*.sha256)
          ls -l "${d}"

      # every part of job «install», asked of the office's device: installed, started, «מצב», and with
      # [machine-check] the machine; its files attached to the draft as «install»'s are
      - name: On the office's device — installed, started, its status screen (and its machine)
        if: steps.door.outputs.office == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/check"; rm -rf "${out}"; mkdir -p "${out}"
          python3 apps/android-emulator/check.py --apk "$(ls "${RUNNER_TEMP}"/apk/*.apk)" --out "${out}" \
            --status-screen ${MACHINE:+--machine}
          rc=$?
          if ls "${out}"/check-* > /dev/null 2>&1; then
            gh release upload "${{ steps.draft.outputs.tag }}" -R "${GITHUB_REPOSITORY}" "${out}"/check-* --clobber \
              && echo "files: $(ls "${out}" | wc -l), on draft ${{ steps.draft.outputs.tag }}" \
              || echo "::warning::the check's files were not attached"
          fi
          exit "${rc}"

      # a cancel or the job's timeout kills the check before its own undo: what it marked is undone here
      - name: What the check left, undone
        if: always() && steps.door.outputs.office == '1'
        run: |
          python3 apps/android-emulator/check.py --cleanup --out "${RUNNER_TEMP}/check" || true
          rm -rf "${RUNNER_TEMP}/apk"

  # the host way: only where job «office» found no device of the office's
  install:
    needs: office
    if: needs.office.outputs.office != '1'
    runs-on: [self-hosted, portable, ssd]
    concurrency:
      group: android-install-check
      cancel-in-progress: false
    timeout-minutes: 255   # 60 for the check and 150 for the machine's, up to 45 that ops/prejob_waitfree.sh may hold it
    env:
      # a dispatch says it in the commit message's own words, so one reading serves both
      MSG: ${{ github.event_name == 'workflow_dispatch' && format('[android-install-check {0}]', inputs.release) || github.event.head_commit.message }}
      IMAGE: "system-images;android-35;google_apis;x86_64"
      MACHINE: ${{ (contains(github.event.head_commit.message, '[machine-check]') || inputs.machine) && '1' || '' }}
    steps:
      - name: The draft the commit names
        id: draft
        run: |
          set -euo pipefail
          t="$(printf '%s\n' "${MSG}" | grep -oE '\[android-install-check android-[0-9]+\.[0-9]+\.[0-9]+\]' | head -1 \
            | sed -E 's/^\[android-install-check (android-[0-9.]+)\]$/\1/')"
          [ -n "${t}" ] || { echo "::error::name the draft in the commit: [android-install-check android-0.1.N]"; exit 1; }
          echo "tag=${t}" >> "${GITHUB_OUTPUT}"
          echo "draft ${t}"
          echo "::warning::an emulator on this runner's host — the old way, until the office's device has run the check (DGO-1797)"

      - name: KVM, which the emulator needs at any useful speed
        run: |
          ls -l /dev/kvm || { echo "::error::no /dev/kvm on this runner"; exit 1; }
          [ -r /dev/kvm ] && [ -w /dev/kvm ] || { echo "::error::$(id -un) cannot open /dev/kvm (not in its group?)"; exit 1; }

      - name: gh, where the runner has none
        run: |
          set -euo pipefail
          if command -v gh >/dev/null; then gh --version | head -1; exit 0; fi
          v=2.62.0
          sum=41c8b0698ad3003cb5c44bde672a1ffd5f818595abd80162fbf8cc999418446a   # gh_2.62.0_checksums.txt
          d="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP}}/gh/${v}"
          if [ ! -x "${d}/bin/gh" ]; then
            mkdir -p "${d}"
            t="${RUNNER_TEMP}/gh.tgz"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_amd64.tar.gz" -o "${t}"
            echo "${sum}  ${t}" | sha256sum -c -
            tar -xzf "${t}" -C "${d}" --strip-components=1
            rm -f "${t}"
          fi
          echo "${d}/bin" >> "${GITHUB_PATH}"
          "${d}/bin/gh" --version | head -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator ${{ env.IMAGE }}'

      - name: The APK, as the draft has it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="${RUNNER_TEMP}/apk"
          rm -rf "${d}" && mkdir -p "${d}"
          gh release download "${{ steps.draft.outputs.tag }}" -R "${GITHUB_REPOSITORY}" -p '*.apk' -p '*.apk.sha256' -D "${d}"
          (cd "${d}" && sha256sum -c ./*.sha256)
          ls -l "${d}"

      - name: Installed on an emulator, and started
        run: |
          set -uo pipefail
          apk="$(ls "${RUNNER_TEMP}"/apk/*.apk)"
          PATH="${ANDROID_HOME}/emulator:${ANDROID_HOME}/platform-tools:${PATH}"
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/avd"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo no | avdmanager create avd -n dgo-check -k "${IMAGE}" -d pixel_6 --force
          # room for the 1 GB APK twice (the staged copy and the installed one) and its extracted libraries; for
          # the machine, what the app asks before it fetches (Guest.java: 2 GB + 10 GB) and a phone's memory
          # that gives its machine 2 GB (EngineService: half the phone)
          mem=3072 part=8192
          [ -z "${MACHINE}" ] || { mem=4096 part=20480; }
          # what the emulator will write, and 20 GB left for the Dell's own office (as export-verify keeps): its disk
          # is sparse and grows by what the app writes (the APK; for the machine its pieces and its unpacked disk),
          # not by its declared size — 36 GB free refused a 20 GB disk that writes ~8 (run 41603416323). The machine's
          # step stops the emulator if the disk falls under the office's 20 while it runs.
          need=4; [ -z "${MACHINE}" ] || need=10
          room=$(( $(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 {print $4}') / 1048576 ))
          [ "${room}" -ge $(( need + 20 )) ] || { echo "::error::${room} GB free under ${RUNNER_TEMP}, and the emulator's ${need} GB with the office's 20 needs $(( need + 20 ))"; exit 1; }
          # ONE physical core, and the heat governed for the emulator's whole life (DGO-1723, DGO-1726, DGO-1728):
          # on 2026-11-09 a boot on two threads took the Dell from 83 to 92°C in 81 s and it switched itself off,
          # the herd's only runner with it. The coordinator's rule: the emulator starts under 80°C (prejob holds
          # the job until then), is paused (SIGSTOP, never killed) at 85°C, resumed under 80°C, and stopped at
          # 90°C — the job then fails and says so. On one core it climbs 81→91°C in 5 s and cools in 5 s, so it
          # runs at about half speed; the waits below allow for that.
          cpus="$(cat /sys/devices/system/cpu/cpu0/topology/thread_siblings_list 2>/dev/null || echo 0)"
          echo "the emulator on CPU ${cpus} (cpu0 and its hyperthread sibling), one virtual core"
          taskset -c "${cpus}" emulator -avd dgo-check -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -cores 1 -memory "${mem}" -partition-size "${part}" > "${RUNNER_TEMP}/emulator.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/emulator.pid"
          epid="$!"
          # the governor outlives this step (as the emulator does) and is ended by «The emulator stopped»
          setsid bash -c '
            epid="$1"; log="$2"; stop="$3"
            heat() { for z in /sys/class/thermal/thermal_zone*; do
                       if [ "$(cat "${z}/type" 2>/dev/null)" = x86_pkg_temp ]; then
                         t="$(cat "${z}/temp" 2>/dev/null)" && [ -n "${t}" ] && { echo $(( t / 1000 )); return; }
                       fi; done; echo 0; }
            sig() { kill "-$1" "${epid}" 2>/dev/null; pkill "-$1" -P "${epid}" 2>/dev/null; }
            paused=0
            while kill -0 "${epid}" 2>/dev/null; do
              c="$(heat)"
              if [ "${c}" -ge 90 ]; then
                echo "$(date -u +%T) ${c}°C: the emulator STOPPED (the 90°C limit)" >> "${log}"
                echo "${c}" > "${stop}"; sig CONT; sig KILL; exit 0
              elif [ "${c}" -ge 85 ] && [ "${paused}" = 0 ]; then
                sig STOP; paused=1; : > "${log}.paused"; echo "$(date -u +%T) ${c}°C: paused" >> "${log}"
              elif [ "${c}" -lt 80 ] && [ "${paused}" = 1 ]; then
                sig CONT; paused=0; rm -f "${log}.paused"; echo "$(date -u +%T) ${c}°C: resumed" >> "${log}"
              fi
              sleep 2
            done' heat "${epid}" "${RUNNER_TEMP}/heat.log" "${RUNNER_TEMP}/heat.stopped" > /dev/null 2>&1 < /dev/null &
          echo "$!" > "${RUNNER_TEMP}/heat.pid"
          hot() { [ -f "${RUNNER_TEMP}/heat.stopped" ] && { echo "::error::the Dell reached $(cat "${RUNNER_TEMP}/heat.stopped")°C: the emulator was stopped (DGO-1726)"; cat "${RUNNER_TEMP}/heat.log"; exit 1; }; return 0; }
          adb wait-for-device
          for i in $(seq 1 240); do
            hot
            # a paused emulator does not answer: adb is not left waiting on it
            [ "$(timeout 20 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 5
          done
          hot
          echo "heat while it booted: $(cat "${RUNNER_TEMP}/heat.log" 2>/dev/null | grep -c paused || true) pauses"
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] || { echo "::error::the emulator did not boot in 20 min"; tail -40 "${RUNNER_TEMP}/emulator.log"; exit 1; }
          echo "booted: Android $(adb shell getprop ro.build.version.release | tr -d '\r'), ABIs $(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
          # DGO-1723 P3's open question, answered on this same boot: does this emulator give an app AVF (a VM on
          # the phone's own hypervisor, Virt.java's first check) — or only QEMU's emulation?
          echo "AVF here: feature $(timeout 20 adb shell pm has-feature android.software.virtualization_framework 2>&1 | tr -d '\r'), vm.supported=$(timeout 20 adb shell getprop ro.boot.hypervisor.vm.supported | tr -d '\r'), protected_vm.supported=$(timeout 20 adb shell getprop ro.boot.hypervisor.protected_vm.supported | tr -d '\r'), /dev/kvm: $(timeout 20 adb shell ls -l /dev/kvm 2>&1 | tr -d '\r')"
          adb shell df -h /data | tail -1
          adb logcat -c
          adb install -r "${apk}" 2>&1 | tee "${RUNNER_TEMP}/install.txt"
          rc="${PIPESTATUS[0]}"
          echo "--- the installer's log"
          # (a log with no such line is no failure: the step runs under bash -e)
          adb logcat -d | grep -E 'PackageManager|PackageInstaller|INSTALL_|NativeLibraryHelper|ApkSignatureVerifier|PackageParser' | tail -60 || true
          if [ "${rc}" -ne 0 ] || ! grep -q '^Success' "${RUNNER_TEMP}/install.txt"; then
            echo "::error::adb install refused ${apk##*/}: $(tail -1 "${RUNNER_TEMP}/install.txt")"
            exit 1
          fi
          adb logcat -c
          adb shell monkey -p il.co.digitaloffice.app -c android.intent.category.LAUNCHER 1
          sleep 45
          echo "--- the app's first 45 s"
          adb logcat -d | grep -E 'il\.co\.digitaloffice|AndroidRuntime|FATAL|DEBUG' | tail -80 || true
          adb shell pidof il.co.digitaloffice.app && echo "the app is running" || { echo "::error::the app is not running 45 s after its start"; exit 1; }

      # «מצב» (DGO-1328), opened as a page that waits for the machine opens it — its dgo://status link — and
      # read as the owner reads it: a screenshot, and the screen's own text (uiautomator), both attached to
      # the release; the step fails if the screen does not say its engine and the machine's stage.
      - name: The status screen, as the owner opens it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          PATH="${ANDROID_HOME}/platform-tools:${PATH}"
          adb shell am start -W -a android.intent.action.VIEW -d dgo://status il.co.digitaloffice.app
          sleep 8
          out="${RUNNER_TEMP}/status"; mkdir -p "${out}"
          adb exec-out screencap -p > "${out}/check-${{ github.run_id }}-status.png"
          adb shell uiautomator dump /sdcard/status.xml >/dev/null && adb pull /sdcard/status.xml "${out}/check-${{ github.run_id }}-status.xml" >/dev/null
          # the one screen of DGO-1723 (the mock in ci-artifacts/dgo1723/mock): the office, its base, «מכולות», and
          # the way into the office — and none of the old screen's machine words or raw checks
          python3 - "${out}/check-${{ github.run_id }}-status.xml" <<'PY'
          import re, sys, xml.etree.ElementTree as et
          texts = [n.get("text", "") for n in et.parse(sys.argv[1]).iter("node") if n.get("text")]
          print("\n".join(texts))
          said = " ".join(texts)
          missing = [w for w in ("הלשכה הדיגיטלית", "הבסיס", "מכולות", "פתיחת הלשכה") if w not in said]
          old = [w for w in ("מנוע:", "המכונה של הלשכה", "✗") if w in said]
          sys.exit(f"::error::the status screen does not say {missing}" if missing
                   else f"::error::the status screen still says {old}" if old else 0)
          PY
          rc=$?
          gh release upload "${{ steps.draft.outputs.tag }}" -R "${GITHUB_REPOSITORY}" "${out}"/check-* --clobber || echo "::warning::the screenshot was not attached"
          exit "${rc}"

      # The app's first open asks for the machine (the core asks once its listeners are bound, for an office
      # with apps in its machine): fetched at 0–49 %, unpacked at 50–99 %, then QEMU — read from outside, as a
      # release APK lets nothing read its files. Done once the app's QEMU has run 20 minutes (its first screens);
      # failed when the app goes, when its QEMU ends before then, or 150 minutes pass with no QEMU. The Dell's
      # heat is watched as the engine's build watches it: at 92°C the emulator is paused 30 s at a time.
      - name: The machine, as a phone gets it
        if: env.MACHINE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          PATH="${ANDROID_HOME}/platform-tools:${PATH}"
          epid="$(cat "${RUNNER_TEMP}/emulator.pid")"
          # the heat is the governor's (started with the emulator): paused at 85°C, resumed under 80, stopped at 90.
          # Here, the disk alone
          ( while sleep 30; do
              left=$(( $(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 {print $4}') / 1048576 ))
              if [ "${left}" -lt 20 ]; then
                echo "::error::${left} GB left on the disk, under the office's 20 — the emulator stopped"
                kill -CONT "${epid}" 2>/dev/null || true; kill "${epid}" 2>/dev/null || true; exit 0
              fi
            done ) &
          hpid=$!
          # one group under `|| true`: under bash -e a failing kill in an EXIT trap would be the step's status
          trap '{ pkill -P "${hpid}"; kill "${hpid}"; } 2>/dev/null || true' EXIT
          shots="${RUNNER_TEMP}/shots"; rm -rf "${shots}"; mkdir -p "${shots}"
          # an empty capture (the emulator paused, adb between answers) is no screenshot: removed, taken again later
          shot() {
            f="${shots}/check-${GITHUB_RUN_ID}-$(printf '%03d' "$1")min.png"
            timeout 30 adb exec-out screencap -p > "${f}" 2>/dev/null || true
            if [ -s "${f}" ]; then last_shot=$(date +%s); else rm -f "${f}"; fi
          }
          rx() { timeout 30 adb shell cat /proc/net/dev 2>/dev/null | tr -d '\r' | awk '$1 != "lo:" && $1 ~ /:$/ {s += $2} END {print int(s / 1048576)}'; }
          used() { timeout 30 adb shell df -k /data 2>/dev/null | tr -d '\r' | awk 'NR == 2 {printf "%.1f", $3 / 1048576}'; }
          # the app's own QEMU (EngineService: libqemu-system-aarch64.so from its native-library directory),
          # never the emulator image's own processes; nothing when adb gave no answer (paused, between answers)
          qemu() {
            local out
            out="$(timeout 30 adb shell ps -A -o NAME,ARGS 2>/dev/null | tr -d '\r')" || true
            [ -n "${out}" ] || return 0
            printf '%s\n' "${out}" | grep -c 'libqemu-system-aarch64' || true
          }
          s=$(date +%s); seen=""; rc=1; last_shot=0; gone=0
          while :; do
            m=$(( ($(date +%s) - s) / 60 ))
            if [ -f "${RUNNER_TEMP}/heat.stopped" ]; then
              echo "::error::the Dell reached $(cat "${RUNNER_TEMP}/heat.stopped")°C at ${m} min: the emulator was stopped (DGO-1726)"
              cat "${RUNNER_TEMP}/heat.log"; break
            fi
            # paused for heat: nothing it answers now is a fact about the app
            if [ -f "${RUNNER_TEMP}/heat.log.paused" ]; then sleep 10; continue; fi
            q="$(qemu)"
            echo "[${m} min] received $(rx) MB, /data used $(used) GB, the app's QEMU ${q:-unread}"
            [ $(( $(date +%s) - last_shot )) -ge 300 ] && shot "${m}"
            timeout 30 adb shell pidof il.co.digitaloffice.app >/dev/null || [ -f "${RUNNER_TEMP}/heat.log.paused" ] \
              || { echo "::error::the app is gone at ${m} min"; shot "${m}"; break; }
            if [ -n "${q}" ] && [ "${q}" -gt 0 ] && [ -z "${seen}" ]; then seen="${m}"; echo "QEMU started at ${m} min: the machine is fetched, checked and unpacked"; fi
            # ended: no QEMU in two answers in a row (one read can miss)
            if [ "${q:-x}" = 0 ]; then gone=$((gone + 1)); elif [ -n "${q}" ]; then gone=0; fi
            [ -z "${seen}" ] || [ "${gone}" -lt 2 ] || { echo "::error::the app's QEMU ended at ${m} min, $(( m - seen )) min after it started"; shot "${m}"; break; }
            if [ -n "${seen}" ] && [ $(( m - seen )) -ge 20 ]; then rc=0; shot "${m}"; break; fi
            [ -n "${seen}" ] || [ "${m}" -lt 150 ] || { echo "::error::no QEMU after 150 min"; shot "${m}"; break; }
            sleep 60
          done
          echo "--- the app's last lines"
          adb logcat -d | grep -E 'il\.co\.digitaloffice|AndroidRuntime|FATAL' | tail -40 || true
          gh release upload "${{ steps.draft.outputs.tag }}" -R "${GITHUB_REPOSITORY}" "${shots}"/*.png --clobber \
            && echo "screenshots: $(ls "${shots}" | wc -l), on draft ${{ steps.draft.outputs.tag }}"
          exit "${rc}"

      - name: The emulator stopped
        if: always()
        run: |
          # the governor first (it would pause it again), then resumed: an emulator paused for heat when its step
          # was killed holds every signal until then
          [ -f "${RUNNER_TEMP}/heat.pid" ] && kill "$(cat "${RUNNER_TEMP}/heat.pid")" 2>/dev/null || true
          echo "heat: $(cat "${RUNNER_TEMP}/heat.log" 2>/dev/null | grep -c paused || true) pauses"; tail -5 "${RUNNER_TEMP}/heat.log" 2>/dev/null || true
          if [ -f "${RUNNER_TEMP}/emulator.pid" ]; then
            kill -CONT "$(cat "${RUNNER_TEMP}/emulator.pid")" 2>/dev/null || true
            pkill -CONT -P "$(cat "${RUNNER_TEMP}/emulator.pid")" 2>/dev/null || true
          fi
          "${ANDROID_HOME}/platform-tools/adb" emu kill 2>/dev/null || true
          [ -f "${RUNNER_TEMP}/emulator.pid" ] && kill "$(cat "${RUNNER_TEMP}/emulator.pid")" 2>/dev/null || true
          rm -rf "${RUNNER_TEMP}/avd" "${RUNNER_TEMP}/apk" "${RUNNER_TEMP}"/heat.*
