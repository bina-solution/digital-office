name: ci-verify

# Brings the self-hosted stack up from scratch (like a fresh `down -v` + `up -d` on
# the dev laptop) and asserts each app came up correctly from the DECLARATIVE config
# (compose + .env + blueprints). See scripts/ci-verify.sh.
#
# Scope: the FULL stack EXCEPT apitools (a headless OCR backend with no UI — it is
# built and tested in indox-e2e, and stripping it keeps this UI-verify stack lean).
# chat now builds in-repo, so it runs here and its admin panel is
# screenshotted. External-API
# features (Google Vision, LLM keys) are NOT exercised — CI uses generated secrets and
# local-only paths. Optional repo secret N8N_ENCRYPTION_KEY makes committed n8n
# credentials decrypt (not required; import/count check passes either way).

on:
  push:
    branches: [main, shlomo-laptop, release-v2-lockin, platform-os-refactor]
    # The auto-publish step below commits the refreshed scorecard/screenshots back
    # to .ci-cd/ with [skip ci]; ignoring that path is a second guard against loops.
    paths-ignore: ['.ci-cd/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # publish step pushes the refreshed .ci-cd/ back to the branch
  checks: write     # named JUnit Check Run

jobs:
  verify:
    # The CI_VERIFY_PAUSED switch existed for one reason: this lane needs the FULL stack, the
    # self-hosted DinD box was a 2-vCPU machine that could not host it, and the GitHub-hosted
    # fallback was billing-blocked — so the only options were "skip" or "burn minutes".
    # Both premises are gone: the lane now runs on the portable runner (4 cores / 15 GB — more
    # capable than the 2-vCPU VPS) where minutes are free, so it runs unconditionally again.
    # Re-add an `if:` here if you ever need to gate it; it is no longer a cost decision.
    runs-on: [self-hosted, portable]
    timeout-minutes: 50
    env:
      # Everything except apitools (headless OCR backend, no UI) and the redundant
      # n8n-worker-2 replica (+its runner) — dropped to free runner CPU/RAM so
      # authentik/n8n initialise reliably. worker-1 still verifies the worker path.
      # chat IS included (in-repo now) so its admin panel is screenshotted.
      # SERVICES is DERIVED (see the "Derive SERVICES" step). No roots = every app enabled in
      # platform.state.yaml, i.e. the whole platform — which is what a deployment-verify lane
      # means. The excludes below reproduce this lane's PREVIOUS hand-written set exactly, so
      # behaviour is unchanged; what changes is that a newly added service now joins this lane
      # automatically unless someone deliberately lists it here.
      #
      # WORTH REVIEWING: this lane calls itself the full-stack verify, yet these excludes show it
      # never started console, connections, drive, mail, my-docs, notifications or app-management.
      # That was invisible while the list was hand-written; it is now explicit. Deleting entries
      # from LANE_EXCLUDE is how you widen the lane.
      # `webmail`, `meta` and `studio` were removed from this list when roundcube was deleted and
      # supabase studio + postgres-meta moved to the gallery app `supabase-studio`. They were dead
      # entries: --exclude on a service that no longer exists now warns rather than silently
      # ignoring, which is what surfaced them.
      LANE_EXCLUDE: >-
        apitools,app-management,console,connections,drive,
        my-docs,notifications,inbox,mailview,mailserver,
        incoming-documents,
        n8n-worker-2,n8n-worker-2-runners
    steps:
      - uses: actions/checkout@v4

      # apitools is excluded via LANE_EXCLUDE above, so the derived SERVICES never names it.
      # The old "Strip apitools service" step that edited production/compose{,.override}.yml is
      # gone with those files — service selection is the capability graph's job now.

      - name: Cap CPU limits to the 2-vCPU runner (prod sizes some services higher)
        run: |
          set -euo pipefail
          # docker compose up ENFORCES deploy.resources.limits.cpus and errors if a
          # service asks for more than the host has (e.g. browser42-browser cpus '3' on a
          # 2-vCPU runner). Cap every `cpus: 'N'` to <= 2 across the compose files; the
          # committed values stay correct for the bigger prod host.
          python3 scripts/ci/cap-cpus.py

      - name: Generate CI .env (random secrets; local *.localhost over http)
        env:
          N8N_ENCRYPTION_KEY_SECRET: ${{ secrets.N8N_ENCRYPTION_KEY }}
        run: |
          chmod +x scripts/ci-env.sh
          ./scripts/ci-env.sh

      - name: Validate compose
        run: ./scripts/dc config -q

      - name: Derive SERVICES from the capability graph
        run: |
          set -euo pipefail
          # No --for: the closure is every app enabled in platform.state.yaml (the whole
          # platform), which is what "deployment verify" means. LANE_EXCLUDE is the deliberate,
          # reviewable trim — see the comment on it in this job's env.
          bash scripts/ci/derive-services.sh

      - name: Bring up stack (authentik-first, then the rest)
        run: |
          set -euo pipefail
          chmod +x bbox scripts/* 2>/dev/null || true   # bbox is the deployment CLI used below
          # traefik-network is declared external (created out-of-band on the host).
          . ./scripts/lib.sh && ensure_network   # one implementation (scripts/lib.sh)
          # Cold CI runner: authentik migrations + blueprint + embedded-outpost sync take a while,
          # so give `bbox run --wait` a generous ceiling (same gate local uses, just more headroom).
          export BBOX_WAIT_TIMEOUT=600
          # Phase 1 — authentik + redis ALONE. Authentik's migrations + serial blueprint application
          # are CPU-heavy; giving them uncontended cores here (instead of racing the whole stack)
          # cuts init from ~20 min to a few. `bbox run` --waits until the authentik-bootstrap SENTINEL
          # is HEALTHY = SSO truly ready (blueprint applied AND the embedded outpost serving every
          # gated host). Replaces the old proxyprovider DB-count poll, which only proved rows-written
          # (L2), not outpost-serving (L3) — the gap that caused transient *.localhost 404s.
          ./bbox run authentik-postgres authentik-server authentik-worker authentik-bootstrap redis
          # Phase 2 — everything else (build the custom images now); --wait gates the rest too.
          ./bbox run --build $SERVICES
          ./bbox run $SERVICES   # reconcile any "created" stragglers
          echo "---- initial state ----"
          ./scripts/dc ps

      - name: Verify declarative bring-up
        run: |
          chmod +x scripts/ci-verify.sh scripts/ci-screenshots.sh apps/n8n/hooks/push
          ./scripts/ci-verify.sh   # writes ci-artifacts/ci-results.junit.xml + ci-summary.md (-> $GITHUB_STEP_SUMMARY)

      # The INDOX full-system E2E runs in the FAST lane (.github/workflows/indox-e2e.yml —
      # lean stack, ~3x quicker feedback). This lane verifies the full deployment bring-up.
      - name: Capture app screenshots (browser42)
        if: always()
        run: ./scripts/ci-screenshots.sh

      - name: Publish verification report (named per-app checks)
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: ci-artifacts/ci-results.junit.xml
          check_name: deployment-verification
          detailed_summary: true
          include_passed: true
          fail_on_failure: false

      - name: Upload verification artifacts (report + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verify-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: ignore

      # Publish the scorecard + screenshots into committed .ci-cd/ so the
      # observability is browsable on the repo page (not just inside this run).
      # Runs on push + manual dispatch (NOT pull_request — forks have no write
      # token). Commit carries [skip ci] and .ci-cd/** is in paths-ignore → no loop.
      - name: Publish observability to .ci-cd/ (commit back)
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          chmod +x scripts/ci-publish.sh
          export CI_PUBLISH_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          ./scripts/ci-publish.sh ci-artifacts
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci-cd
          if git diff --cached --quiet; then
            echo "No .ci-cd changes to publish."; exit 0
          fi
          git commit -m "ci(observability): publish run #${{ github.run_number }} scorecard + screenshots [skip ci]"
          # Rebase the single publish commit onto the current branch tip, then push.
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped (branch advanced or no write access) — artifacts still uploaded."

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "==== docker ps -a ===="; docker ps -a || true
          for c in authentik-server-ci authentik-worker-ci authentik-bootstrap-ci n8n-ci \
                   glitchtip-ci browser42-browser-ci portainer-ci machine-ci any-concurrency-ci; do
            echo "==== docker logs: $c ===="; docker logs --tail 60 "$c" 2>&1 || true
          done

      - name: Teardown (wipe volumes)
        if: always()
        run: ./bbox reset --force --remove-orphans || ./scripts/dc down -v --remove-orphans || true

  # ── platform-OS invariants ────────────────────────────────────────────────
  # These are cheap, need no stack, and exist so the app-ownership model cannot
  # silently decay back into a second home for services.
  platform-invariants:
    runs-on: [self-hosted, portable]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/pip-ensure.sh yaml:pyyaml
      - name: G5 — nothing lives outside apps/
        run: python3 scripts/refactor/ownership-lint.py --strict
      - name: G7 — no bare `docker compose` (silent no-op under the app model)
        run: python3 scripts/refactor/compose-invocation-lint.py
      - name: G9 — layering invariant (a base app may never name a layer-3 app)
        run: python3 scripts/refactor/layering-lint.py --strict
      # G31 — G9's blind spot. It scans platform-base/ but never looked at LAYER 0, which is where
      # app knowledge actually piled up: bbox minted portainer's admin password on every run (for a
      # gallery app that ships disabled), chmod'ed traefik's acme.json, and lib.sh carried a whole
      # browser42-keyed function into every entry point. G9 passed the entire time. Ratcheted: the
      # three known debts are listed in the script with their task ids, anything new fails.
      - name: G31 — layer 0 carries no app-specific logic
        run: |
          python3 scripts/refactor/layer0-lint.py --self-test
          python3 scripts/refactor/layer0-lint.py
      # G32 — G7 checks that compose carries the compiled -f list. It never checked WHICH compose,
      # or which ENGINE. `docker compose` is a plugin search that resolves to Docker Desktop's
      # binary wherever Desktop is installed, and a /var/run/docker.sock bind is Desktop's socket
      # under WSL integration — the hijack that made traefik discover zero routers while reporting
      # healthy, 404ing every gated host. packaging/make-runtime-compose.py, which produces the file
      # the SHIPPED ARTIFACT boots from, was calling bare `docker compose` the whole time.
      - name: G32 — no engine or compose bypass
        run: |
          python3 scripts/refactor/engine-bypass-lint.py --self-test
          python3 scripts/refactor/engine-bypass-lint.py
      # G33 — platform.state.yaml had FOUR writers and two spellings ({enabled: bool} vs
      # {state: …, by: …}), which is why disposition() must accept both and why three inline
      # parsers in app.py drifted from it. One writer, one shape, one parser.
      - name: G33 — one writer of platform.state.yaml
        run: |
          python3 scripts/refactor/state-writer-lint.py --self-test
          python3 scripts/refactor/state-writer-lint.py
      # G34 — `attic/` was deleted on the strength of a README that said nothing referenced it. Two
      # things did: THIS repo's indox-e2e lane booted a compose stack out of it, and
      # digital-office/sim/build.mjs read a dashboard html out of it. The survivor moved to
      # legacy/feature-validation and legacy/README.md now declares its consumers — but a table in a
      # README is prose. This is the mechanical half: a reference into legacy/ must be on the
      # allow-list in the gate, with a reason. Comments and .md docs are not references.
      - name: G34 — every reference into legacy/ is declared
        run: |
          python3 scripts/refactor/legacy-ref-lint.py --self-test
          python3 scripts/refactor/legacy-ref-lint.py
      # G35 — a publisher selector from the native-group proof leaked into a proposed generic action
      # API. Historical evidence remains intact, but operative Browser42 surfaces must derive all
      # site behavior from the task and live inspection rather than compiled-in fixture knowledge.
      - name: G35 — Browser42 contains no incident fixtures
        run: |
          python3 scripts/refactor/browser42-site-neutrality-lint.py --self-test
          python3 scripts/refactor/browser42-site-neutrality-lint.py
      # G22 ran on the `fresh` lane only, so a compose-profile gate could reach main without CI ever
      # looking. Found by `scripts/ci/gates.sh --verify-ci`, which is the point of that check.
      - name: G22 — no app gates its services behind a compose profile
        run: python3 scripts/refactor/profile-gate-lint.py
      # The gate LIST is scripts/ci/gates.sh. This asserts the steps above still match it, so a gate
      # added to the list cannot quietly skip CI (and vice versa).
      - name: gates — CI enumeration matches the canonical list
        run: bash scripts/ci/gates.sh --verify-ci
      # G25 — a declared capability must actually be CONSUMED. Three apps declared
      # `use: sql (requires)`, the resolver pulled the postgres provider into the closure and
      # ordered bring-up around it, and then all three connected to a Postgres of their own: FOUR
      # servers across THREE major versions where the graph says there is one. The declaration was
      # decorative, and nothing noticed because nothing checked. An app that genuinely needs its own
      # instance says so with `own_instance` + `reason`, which keeps the decision visible instead
      # of silent. --strict additionally refuses an own_instance with no reason.
      - name: G25 — a declared capability is actually consumed
        run: python3 scripts/refactor/capability-use-lint.py --self-test && python3 scripts/refactor/capability-use-lint.py --strict
      # G26 — `data.volumes` is the only machine-readable inventory of state this platform has, and
      # nothing read it, so it rotted: drive declared [] while owning localdrive_data, mail declared
      # one of five. There is no backup tooling yet; whoever writes it will derive it from this
      # field, and a backup built on a wrong inventory silently skips what the manifest forgot —
      # you find out at restore. Rule: if git tracks it, it is not state.
      - name: G26 — data.volumes matches the state the compose actually creates
        run: python3 scripts/refactor/data-volumes-lint.py
      # G30 — the enabled render declares 36.4 GiB of memory limits against hosts of 7-16 GiB.
      # Nobody chose that: every limit is a literal in one app's compose and no view summed them.
      # On one Docker host the caps protect nothing (the host OOM-killer fires first and picks its
      # own victim), so they read as a capacity plan while behaving like decoration — and under
      # swarm/k8s the same numbers become hard scheduling failures. This does not forbid overcommit;
      # it makes it a ratio someone chose, declared beside the machine envelope in perf-profiles.yml.
      - name: G30 — declared memory fits the machine the profile describes
        run: python3 scripts/refactor/memory-budget-lint.py --profile ci-small
      # G65 is G30's CPU twin, but the caps it bounds are ENFORCED by the kernel on one host (CFS
      # quota), so an over-subscribed sum is not decoration: on the 4-vCPU macOS engine 47 vCPU of
      # caps meant every container contended at once with every agent idle (load 145, 2026-09-30).
      - name: G65 — declared CPU caps fit the machine the profile describes
        run: python3 scripts/refactor/cpu-budget-lint.py --profile ci-small
      # G36 — a provider list call that fetches ONE page and never follows nextPageToken reports
      # everything past that page as ABSENT, with no error. On 2026-08-05 that hid 43,326 of the
      # client's 78,651 Drive documents; folders holding 17,066 files reported exactly 460.
      - name: G36 — provider list calls paginate or are explicitly bounded
        run: python3 scripts/refactor/paginated-list-lint.py --self-test && python3 scripts/refactor/paginated-list-lint.py
      # G49 — G36's mirror image, on the CLIENT side. SyncBoard.tsx's infinite scroll derived
      # "is there more?" from `rows.length < total` and fired the next page from a useEffect. A
      # page returning ZERO rows changes neither side of that comparison, so the effect re-fires
      # forever against a server answering "none". Caught in review, 2026-08-06, before it shipped.
      - name: G49 — an auto-advancing pager can be stopped by its own response
        run: python3 scripts/refactor/stalled-pagination-lint.py --self-test && python3 scripts/refactor/stalled-pagination-lint.py
      # G37 — SOURCE_ID is documented as the drive file id / gmail message id the pipeline stamped
      # on ingest (the join key _docs_by_source() reads back). Five live writers (the v1 drive/gmail
      # processors sync-v3 wires up as the default processor_wf) stamped the watched FOLDER's id or
      # the SENDER's email instead, collapsing every document from the same folder/sender onto one
      # SOURCE_ID. Measured on 2026-08-05: 6,250 rows, 579 distinct SOURCE_ID values.
      - name: G37 — SOURCE_ID is a per-document id, never a folder id or a sender
        run: python3 scripts/refactor/source-id-lint.py --self-test && python3 scripts/refactor/source-id-lint.py
      # G38 — 41 live workflows had settings.errorWorkflow pointing at a workflow id that does not
      # exist (RqAY1Z1i2F7ZaPbe). n8n logs one line and creates ZERO execution rows for a dangling
      # errorWorkflow — silent, total loss of alerting, invisible in the UI. Live-only drift (the
      # blueprints never had the bad value), so this gate polices the tree going forward: any
      # errorWorkflow / executeWorkflow target must name a workflow id that exists in this repo.
      - name: G38 — errorWorkflow / executeWorkflow targets a workflow that exists
        run: python3 scripts/refactor/dangling-workflow-ref-lint.py --self-test && python3 scripts/refactor/dangling-workflow-ref-lint.py
      # G39 — an executeWorkflowTrigger's explicit input schema (jsonExample / "Define below" fields)
      # silently drops any field not on the list. indoxDocBatchUpsert01.json's trigger was missing
      # CONNECTION, NEXT_RETRY_AT and RETRY_COUNT — real columns on incoming_documents — so every
      # caller's retry-scheduling value was discarded before the upsert ever ran (NEXT_RETRY_AT: 0 of
      # 6,207 rows populated, 2026-08-05).
      - name: G39 — executeWorkflowTrigger's declared schema matches the table it upserts
        run: python3 scripts/refactor/trigger-schema-drift-lint.py --self-test && python3 scripts/refactor/trigger-schema-drift-lint.py
      # G40 — scripts/ui-coverage/seed.sh (bbox ui-map / bbox seed, seeding opt-OUT by default)
      # upserted apps/indox/blueprint/fixtures/settings.json's 6-entry demo `sync_registry`
      # straight over a real client's live sync registry, twice, deleting two configured drive
      # pipes and blanking `connection` on two more (2026-08-05). seed.sh itself is now
      # insert-only (`on conflict do nothing`), but that only protects a key that already
      # exists — it does nothing for a brand-new tenant's first, empty seed. This gate is the
      # complementary check: no demo/QA fixture may carry a live-operational key at all.
      - name: G40 — a demo/QA fixture never carries a live-operational settings key
        run: python3 scripts/refactor/fixture-live-key-lint.py --self-test && python3 scripts/refactor/fixture-live-key-lint.py
      # G58 — G40's sibling from the other direction. G40 stops a fixture OVERWRITING live config;
      # this stops a fixture CLEANUP deleting live rows. On 2026-08-06 syncV3SourcesTest01's
      # "Cleanup SQL" deleted 2,432 real client documents: its only prefix guard was bound to the
      # JOIN PARTNER (`sync_ledger`), never to `incoming_documents`, and the join condition was an
      # unanchored substring test on an IMAP uid, so fixture uid `12` matched production
      # `#inbox/120`, `#inbox/128`, `#inbox/1234`. Fourteen sibling cleanups were correct — and
      # each restated its own prefix list inline, so nothing mechanical separated the fleet from
      # the fifteenth. scripts/test-fixture-prefixes.yaml is now the single registry of what a
      # fixture row looks like; this gate is what makes it binding. Its --self-test carries the
      # incident query verbatim, so the gate is proven against the real defect, not a paraphrase.
      - name: G58 — an E2E cleanup may only delete its own fixture rows
        run: python3 scripts/refactor/fixture-delete-scope-lint.py --self-test && python3 scripts/refactor/fixture-delete-scope-lint.py
      # G41 — a rules-mode switch with no fallbackOutput silently drops any item matching none of its
      # named cases: no error, no log, no execution row. indoxV2ActionsGlobal01.json's "3a. DOC BASE
      # Actions Switch" drops extract_invoice_google_ai (plus 4 more of its own decide function's
      # return values); indoxV2ActionsBS01/GDoc01/Ship01 each drop at least one more of their own.
      # KNOWN FAILING as of 2026-08-05 — the detector is correct; the 8 underlying drops are not yet
      # fixed (see ai/context/ERROR-RCA-2026-08-05.md addendum). Left wired per this file's own rule
      # (GATES.md, "Adding a gate": "a gate that runs nowhere is documentation") rather than hidden
      # until someone fixes the switches — that is what red CI is for.
      - name: G41 — switch fallback + decide/switch case coverage
        run: python3 scripts/refactor/switch-fallback-lint.py --self-test && python3 scripts/refactor/switch-fallback-lint.py
      # G42 — INDOX-UNIFIED-N8N-SPEC.md §1: exactly one sub-workflow (indoxDataGateway01) may write
      # public.incoming_documents; every other workflow must call it instead of touching Postgres
      # directly. As of 2026-08-05, 65 of 66 indox blueprints still write Postgres directly (or via a
      # direct PostgREST call) — this gate is added in a KNOWN-FAILING state on purpose (Phase 3 BUILDS
      # the gateway + this gate; Phase 4, tracked separately, REWIRES the 65 direct writers onto it and
      # is the only thing that can turn this gate green). Left wired red per this file's own rule
      # (GATES.md, "a gate that runs nowhere is documentation"), exactly like G41 was.
      # ^ RETIRED 2026-08-07 — the step below is gone, and so is G43's. Both required every
      # Postgres write / every identity computation to route through `indoxDataGateway01` and
      # `indoxIdentity01`: workflows an agent lane invented, the owner rejected as "not part of the
      # existing architecture", which never executed once and were disarmed on 2026-08-07. The
      # comment block above is kept as the record of what they asserted and why it no longer holds.
      # Scripts moved to data/_attic_agent_drafts/ alongside the workflows. See GATES.md.
      # G43 — INDOX-UNIFIED-N8N-SPEC.md §2: one sub-workflow (indoxIdentity01) computes document
      # identity; nothing else may. Three divergent SHORT_DOC_ID (last-5-alphanumeric) formulas were
      # confirmed live pre-indoxIdentity01 (INDOX-CODEBASE-MAP-2026-08-05.md §1c), with known collision
      # sinks '00000' (empty value padded), '61520' (a vendor template repeating one real number),
      # '22026' (any February-2026 date). KNOWN FAILING as of 2026-08-05 for the same reason as G42 —
      # the files that compute this locally have not been migrated to call indoxIdentity01 yet
      # (Phase 4). Left wired red on purpose.
      # ^ RETIRED 2026-08-07 with G42 above, for the same reason.
      # G42' (re-pointed, 2026-08-15) — the retired G42 asserted "only indoxDataGateway01 may write",
      # a rejected design. This one enforces the owner's ACTUAL invariant ("only the state machine
      # should ever change the line — one upsert at each end of action execution"): every write to
      # public.incoming_documents must come from a sanctioned writer (the end-of-action batch
      # upsert, the explicit API verbs, the sync ingest lanes, the failure-path recorder kept by
      # cleanup #8, or the operator's reset verb). Anything else is the defect class removed on
      # 2026-08-14: Terminalize Stalled authoring STATUS, errorHandler01 authoring MAX_ITERATIONS,
      # the NoAct/lock ACTION_LOG stamps. Green at wiring time (19 sanctioned write nodes, 0 violations).
      - name: G42' — only the state machine writes incoming_documents
        run: python3 scripts/refactor/incoming-documents-writer-lint.py
      # G44 — an active:true workflow must own a node n8n's activation cycle can actually use
      # (webhook/schedule/poller/errorTrigger/executeWorkflowTrigger/...). 2026-08-06: two test/E2E
      # workflows (indoxV2BSTest01, indoxV2DocBaseTest01 — both manualTrigger-only) were captured
      # active:true and retried activation forever in docker logs, burying real errors. Fixed in
      # apps/indox/; KNOWN FAILING as of 2026-08-06 on one instance outside this fix's ownership
      # boundary — apps/chat/blueprint/n8n/whatsappSendDoc01.json is the same bug, reported not fixed
      # here (apps/chat is owned elsewhere). Wired anyway, same reasoning as G41/G42/G43.
      - name: G44 — active workflows own a real activation trigger
        run: python3 scripts/refactor/dead-activation-lint.py --self-test && python3 scripts/refactor/dead-activation-lint.py
      # G45 — canvas HEIGHT is execution order, so a loop is never drained before its work runs.
      # REPLACES the previous G45, which enforced a COMPUTED layout (n8n-layout.py) and was actively
      # harmful: nodes[].position is not decoration. Verified in the running engine's own source
      # (n8n 2.17.0, n8n-core/dist/execution-engine/workflow-execute.js), a fan-out's targets are
      # collected across ALL output indices into one list, sorted DESCENDING by (y, x), then each is
      # `unshift`ed onto the front of the execution stack which is consumed with `shift` — so the
      # TOP-MOST target runs FIRST, left-most breaking an exact y tie, and position overrides output
      # index entirely. Running the old layout tool repo-wide took loop-order violations from 3
      # (pre-existing) to 55: a splitInBatches loop lane and the edge re-entering the loop landed on
      # the same row, the x tiebreak put the re-entry first, and every batch was then drained before
      # any per-batch work ran — while the workflow still reported success. This gate is that
      # invariant, checked on the file in front of it with no reference layout to drift from.
      - name: G45 — a loop's work lane runs before the loop is re-entered
        run: python3 scripts/refactor/n8n-loop-order-lint.py --self-test && python3 scripts/refactor/n8n-loop-order-lint.py
