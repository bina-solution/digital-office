      # ...and (invariant 4) a host the manifest gates with `auth: sso` has no hand-written router
      # without the forward-auth middleware. The compiler gates every router it emits; a compose that
      # writes its own labels has to, and two did not: `apitools-local` (the production edge served
      # apitools to anyone who sent its .localhost Host header) and `browser42-http`, whose rule on a
      # .localhost office is the same as its gated twin's — which of the two traefik picked decided
      # whether the automation browser asked for a sign-in. An open path is a line in the manifest
      # (`auth_exclude`), not three labels down a compose file.
      - name: G21 — routed hosts are declared, routers are namespaced, an sso host has no open router
        run: python3 scripts/refactor/route-claim-lint.py --self-test && python3 scripts/refactor/route-claim-lint.py
      - name: G15 — every third-party image is pinned
        run: python3 scripts/refactor/image-pin-lint.py --self-test && python3 scripts/refactor/image-pin-lint.py

      # The gates above run against THIS checkout, which the runner has been accumulating state in.
      # This one clones into a scratch dir with no .env, no .generated and no volumes and proves the
      # platform stands up from nothing — the "works because my machine has X" class of bug.
      - name: FRESH MACHINE — a bare clone compiles, renders and gates green
        run: bash scripts/fresh-machine-check.sh
      # `dc config` INTERPOLATES the compose files, so it needs a .env even though this job never
      # starts anything: without it compose aborts on the first required variable
      # (POSTGRES_PASSWORD), the render step exits 1, and G0/G6 below never run at all.
      # Random throwaway secrets are fine — nothing here is started or reachable.
      - name: Generate CI .env (interpolation only — nothing is started in this job)
        run: |
          chmod +x scripts/ci-env.sh
          ./scripts/ci-env.sh

      # portainer binds ./portainer_password.txt — a gitignored deploy-time secret, absent from a
      # fresh clone. This job starts nothing, but G0 asserts every bind source exists, so the file
      # has to be there. Run the APP'S OWN hook rather than a third copy of "write portainer's
      # password": the hook already handles the empty-.env case, the docker-bind-created-a-directory
      # case, and the trailing-newline bug that makes portainer reject every login. Two hand-rolled
      # copies of it lived in this file and neither knew any of that.
      - name: Prepare portainer bind source (the app's own hook)
        run: bash apps/portainer/hooks/prepare

      - name: render the platform config
        run: |
          python3 platform/manager/reconcile.py validate
          python3 platform/manager/reconcile.py render
          ./scripts/dc config > /tmp/candidate.yml
      - name: G0 — every referenced host path exists
        run: python3 scripts/refactor/paths-exist.py /tmp/candidate.yml
      - name: G6 — no SSO bypass via colliding router rules
        run: python3 scripts/refactor/auth-lint.py /tmp/candidate.yml
