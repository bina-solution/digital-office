# release-binaries — build, test and publish the office's three native binaries.
#
# What ships from here (core-005 / core-006 / core-007): dgo-install (the tiny signed bootstrapper),
# dgo (DGO core's CLI) and forward-auth (the identity plane), each for windows/darwin/linux × amd64/arm64,
# and dgo alone for android/arm64 (an app's command; a phone's office runs in its Linux terminal, which
# takes the linux/arm64 build — packaging/android.md), with SHA256SUMS and the per-OS download tree
# (dgo-core + manifest.json) the installer verifies.
# The build is ONE script — packaging/build-binaries.sh — so what this lane publishes is what anybody
# can re-derive from the tag on a laptop (the script proves its own reproducibility on every run).
#
# Three triggers, two meanings:
#   * a version tag (v1.4.0) is the owner's release button: the binaries are attached to a DRAFT release
#     of that tag, which is published once the release page (r030-108) is checked — never by this job;
#   * a push to mac-dgo whose head commit says "[release-binaries]", or workflow_dispatch, is a dry run:
#     the same build, attached to a draft `binaries-dev-<run>` (not a workflow artifact: the account's
#     Actions storage is what its due payment holds back, DGO-1116).
#
# Signing is optional and never silent (DGO-595). The trust chain is: the ROOT public keys, committed in
# packaging/installer/roots.txt and embedded in every stub (empty until the owner's D1 — then no signed
# release can be built at all) → keys.json, signed offline by a root, naming the online signing keys,
# their validity windows and the document types each may sign → the manifest, signed whole by one of
# them and bound to its download site. A release is signed only on a v* tag, and only when both the
# DGO_RELEASE_KEY secret (the ONLINE signing key, never a root) and DGO_KEYS_JSON (that keys.json) exist;
# otherwise the stubs are development builds and the manifests are manifest.unsigned.json — the
# installer refuses both (fail-closed), and the summary says so. No key ever lives in the repo; this lane
# holds the online key for the seconds of one job and deletes it after.
#
# On the Dell's runner: cross-compiling three stdlib-only Go modules needs no docker and about two
# minutes, and GitHub's hosted runners start nothing while the account's payment is due (DGO-1116; v0.3.0,
# r030-102). Go and Python are pinned by setup-go/setup-python, not taken from the machine.
name: release-binaries

on:
  push:
    tags: ['v*']
    branches: [mac-dgo]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (no leading v). Empty = 0.0.0-dev+<sha>"
        default: ""

permissions:
  contents: write   # used by exactly one step: attaching the binaries to a draft release

jobs:
  binaries:
    if: >-
      startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[release-binaries]')
    # on the job, not the workflow: a mac-dgo push that skips this job must not cancel a build running
    concurrency:
      group: release-binaries-${{ github.ref }}
      cancel-in-progress: false   # a build cancelled mid-upload would leave a half-filled draft
    runs-on: [self-hosted, portable, ssd]
    timeout-minutes: 65   # 20 for the build, up to 45 that ops/prejob_waitfree.sh may hold it
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history: a signed build checks that HEAD sits on an origin branch and that the
          # committed roots.txt is the one on disk (build-binaries.sh, DGO-595) — a shallow clone has
          # neither, and every signed v* build would be refused
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false   # stdlib-only modules: no go.sum, nothing to cache

      # The oracles' interpreter, pinned as go-test.yml pins it: the Go twin's tests compare dgo with
      # CPython 3.12's own answers, and 3.14 (ubuntu-26.04's python3, measured 3.14.4 + PyYAML 6.0.3)
      # answers six of them differently by itself — argparse reads "-1." and "-1e5" as numbers, textwrap
      # drops a chunk's trailing space, json says "Illegal trailing comma", json.loads no longer crashes
      # past its nesting limit, Unicode 16 has new digits (DGO-1038). The image pin above did this by
      # accident; this does it on purpose.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The console image's own declaration is the oracles' packages: Flask and werkzeug (pinned, the
      # console twin answers as that werkzeug), PyYAML for the compiler's and yamlish's oracles too,
      # flask-compress and requests for the console's. One file, so an oracle and the image it stands
      # for cannot drift apart unseen (issues/the-console-twin-follows-a-werkzeug-and-a-python-the-
      # console-image-left.yaml: werkzeug moved under an unpinned line, and no release build ran it).
      - name: The oracles' Python (the console image's requirements.txt)
        run: python3 -m pip install --quiet -r platform-base/console/requirements.txt

      - name: Version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-dev+$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version: ${VERSION}"

      - name: Release key (a version tag, and only when the owner's keys exist)
        env:
          DGO_RELEASE_KEY: ${{ secrets.DGO_RELEASE_KEY }}
          DGO_KEYS_JSON: ${{ secrets.DGO_KEYS_JSON || vars.DGO_KEYS_JSON }}
        run: |
          set -euo pipefail
          # A signed release is three things together (DGO-595): a v* tag; DGO_RELEASE_KEY, the ONLINE
          # signing key — never a root (the roots are the committed packaging/installer/roots.txt,
          # embedded in every stub; build-binaries.sh refuses DGO_ROOT_KEYS); and DGO_KEYS_JSON, the
          # root-signed key list that names that key (made offline with `relsign keys`). Without all
          # three this run builds UNSIGNED drafts exactly as before — and build-binaries.sh refuses
          # --sign-key on a pre-release version, so a branch or dispatch run can never sign.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && [ -n "${DGO_RELEASE_KEY}" ] && [ -n "${DGO_KEYS_JSON}" ]; then
            umask 077
            # in memory, not on the runner's disk: a shared laptop that loses power mid-job keeps no key
            kd="${RUNNER_TEMP}"
            if [ -d /dev/shm ] && [ -w /dev/shm ]; then kd="$(mktemp -d /dev/shm/dgo-release.XXXXXX)"; fi
            echo "DGO_KEY_DIR=${kd}" >> "$GITHUB_ENV"
            printf '%s\n' "${DGO_RELEASE_KEY}" > "${kd}/release-key.pem"
            printf '%s\n' "${DGO_KEYS_JSON}" > "${kd}/keys.json"
            echo "SIGN_ARGS=--sign-key ${kd}/release-key.pem --keys ${kd}/keys.json" >> "$GITHUB_ENV"
            echo "signing: yes"
          else
            echo "SIGN_ARGS=" >> "$GITHUB_ENV"
            echo "::warning::not a signed release (it needs a v* tag, the DGO_RELEASE_KEY secret and DGO_KEYS_JSON) — manifests are UNSIGNED drafts and dgo-install is the inert template; nothing here is installable"
          fi

      - name: Build, test, prove reproducible
        env:
          # An oracle whose Python or packages are missing fails the build instead of skipping, as in
          # go-test.yml — each oracle that reads the variable; the few that skip by themselves run here
          # because the step above installs what they need, and go-test.yml's skip grep catches them
          # on every push. A release is not built on a test that proved nothing.
          DGO_ORACLE_REQUIRED: "1"
        run: |
          set -euo pipefail
          bash packaging/build-binaries.sh --selftest
          bash packaging/build-binaries.sh "${VERSION}" --check-reproducible ${SIGN_ARGS}

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Native binaries ${VERSION}"
            echo
            if [ -n "${SIGN_ARGS}" ]; then echo "**Signed** manifests (DGO_RELEASE_KEY present)."; else echo "**UNSIGNED drafts** — no DGO_RELEASE_KEY; the installer refuses these."; fi
            echo
            echo '```'
            cat dist/bin/SHA256SUMS 2>/dev/null || echo "(no build output)"
            echo '```'
            echo
            echo "Download tree (what the website serves to dgo-install):"
            echo '```'
            (cd dist/dl 2>/dev/null && find . -type f | sort) || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: gh, where the runner has none
        run: |
          set -euo pipefail
          # the tag's draft is made with --verify-tag, gh 2.21's: an older gh on the machine is passed over
          if command -v gh >/dev/null && printf '%s\n' 2.21.0 "$(gh --version | awk 'NR == 1 { print $3 }')" | sort -V -C; then
            gh --version | head -1; exit 0
          fi
          v=2.62.0
          sum=41c8b0698ad3003cb5c44bde672a1ffd5f818595abd80162fbf8cc999418446a   # gh_2.62.0_checksums.txt
          d="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP}}/gh/${v}"
          if [ ! -x "${d}/bin/gh" ]; then
            mkdir -p "${d}"
            t="${RUNNER_TEMP}/gh.tgz"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_amd64.tar.gz" -o "${t}"
            echo "${sum}  ${t}" | sha256sum -c -
            tar -xzf "${t}" -C "${d}" --strip-components=1
            rm -f "${t}"
          fi
          echo "${d}/bin" >> "${GITHUB_PATH}"
          "${d}/bin/gh" --version | head -1

      # The owner's button is a tag; a dry run gets a draft of its own. Either way a DRAFT: the release is
      # published by hand once its page is checked (r030-108), so nothing half-proven ever shows.
      - name: Attached to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then t="${GITHUB_REF_NAME}"; else t="binaries-dev-${{ github.run_number }}"; fi
          notes="$(mktemp)"
          {
            echo "DGO native binaries ${VERSION} — dgo-install, dgo, forward-auth for windows/darwin/linux × amd64/arm64, and dgo for android/arm64."
            echo
            echo "dgo-android-arm64 runs in an Android app (Termux) and says where a phone's office runs: in Android's Linux terminal, a Debian VM, which takes dgo-linux-arm64 (packaging/android.md)."
            echo
            echo "Built by packaging/build-binaries.sh (CGO_ENABLED=0, -trimpath, reproducible; the run's log holds the proof)."
            if [ -n "${SIGN_ARGS}" ]; then echo "Manifests signed with the release key."; else echo "**Unsigned drafts** — not installable until a release key is configured."; fi
            echo
            echo '```'
            cat dist/bin/SHA256SUMS
            echo '```'
          } > "${notes}"
          # only "not found" creates one — a view that failed otherwise (network, rate limit) would leave two
          files=(dist/bin/*)
          # the download tree as one file: each OS's folder holds a manifest.json of its own (a signed one is
          # made only here, where the key is)
          if [ -d dist/dl ]; then
            dl="dist/dgo-dl-${VERSION//+/-}.tar.gz"
            tar -czf "${dl}" -C dist dl
            files+=("${dl}")
          fi
          if seen="$(gh release view "${t}" -R "${GITHUB_REPOSITORY}" 2>&1)"; then
            # a release already published is the owner's: this job fills drafts and never touches one
            [ "$(gh release view "${t}" -R "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = true ] \
              || { echo "::error::release ${t} is published already — this job only fills drafts"; exit 1; }
            gh release upload "${t}" "${files[@]}" -R "${GITHUB_REPOSITORY}" --clobber
          elif ! printf '%s' "${seen}" | grep -qi "not found"; then
            echo "::error::could not tell whether release ${t} exists: ${seen}"; exit 1
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            gh release create "${t}" "${files[@]}" -R "${GITHUB_REPOSITORY}" --draft --verify-tag \
              --title "DGO ${VERSION}" --notes-file "${notes}"
          else
            gh release create "${t}" "${files[@]}" -R "${GITHUB_REPOSITORY}" --draft --prerelease --target "${GITHUB_SHA}" \
              --title "DGO ${VERSION} (dry run)" --notes-file "${notes}"
          fi
          echo "draft ${t}: ${#files[@]} file(s)" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Forget the key
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/release-key.pem" "${DGO_KEY_DIR:-${RUNNER_TEMP}}/release-key.pem"
          case "${DGO_KEY_DIR:-}" in /dev/shm/dgo-release.*) rm -rf "${DGO_KEY_DIR}" ;; esac
