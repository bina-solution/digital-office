<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="muted"/></marker></defs><rect width="860" height="270" class="bg"/><rect x="645" y="30" width="195" height="210" rx="14" class="surface"/><rect x="645" y="30" width="195" height="210" rx="14" class="edge" stroke-width="1.5"/><path d="M720.5,106 l0,-46 q22,-22 44,0 l0,46 z" class="olive"/><circle cx="754.5" cy="84" r="3.5" class="onolive"/><text x="742.5" y="128" font-size="16" font-weight="700" class="ink" text-anchor="middle" direction="rtl">מה זה DGO</text><text x="742.5" y="156" font-size="13.5" font-weight="400" class="muted" text-anchor="middle" direction="rtl">מה הלשכה מריצה</text><text x="742.5" y="178" font-size="13.5" font-weight="400" class="muted" text-anchor="middle" direction="rtl">בשבילכם, ומה לא.</text><rect x="434" y="30" width="195" height="210" rx="14" class="surface"/><rect x="434" y="30" width="195" height="210" rx="14" class="edge" stroke-width="1.5"/><path d="M509.5,106 l0,-46 q22,-22 44,0 l0,46 z" class="olive"/><circle cx="543.5" cy="84" r="3.5" class="onolive"/><text x="531.5" y="128" font-size="16" font-weight="700" class="ink" text-anchor="middle" direction="rtl">התחלה</text><text x="531.5" y="156" font-size="13.5" font-weight="400" class="muted" text-anchor="middle" direction="rtl">איזה מחשב, איזו מיומנות,</text><text x="531.5" y="178" font-size="13.5" font-weight="400" class="muted" text-anchor="middle" direction="rtl">ואיך מתקינים.</text><rect x="223" y="30" width="195" height="210" rx="14" class="surface"/><rect x="223" y="30" width="195" height="210" rx="14" class="edge" stroke-width="1.5"/><path d="M298.5,106 l0,-46 q22,-22 44,0 l0,46 z" class="olive"/><circle cx="332.5" cy="84" r="3.5" class="onolive"/><text x="320.5" y="128" font-size="16" font-weight="700" class="ink" text-anchor="middle" direction="rtl">המושגים</text><text x="320.5" y="156" font-size="13.5" font-weight="400" class="muted" text-anchor="middle" direction="rtl">המילים של הלשכה,</text><text x="320.5" y="178" font-size="13.5" font-weight="400" class="muted" text-anchor="middle" direction="rtl">כל אחת פעם אחת.</text><rect x="12" y="30" width="195" height="210" rx="14" class="surface"/><rect x="12" y="30" width="195" height="210" rx="14" class="edge" stroke-width="1.5"/><path d="M87.5,106 l0,-46 q22,-22 44,0 l0,46 z" class="olive"/><circle cx="121.5" cy="84" r="3.5" class="onolive"/><text x="109.5" y="128" font-size="16" font-weight="700" class="ink" text-anchor="middle" direction="rtl">כמה מחשבים — לשכה אחת</text><text x="109.5" y="156" font-size="13.5" font-weight="400" class="muted" text-anchor="middle" direction="rtl">הרעיון,</text><text x="109.5" y="178" font-size="13.5" font-weight="400" class="muted" text-anchor="middle" direction="rtl">שכבה אחרי שכבה.</text></svg>
