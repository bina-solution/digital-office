<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" role="img" aria-label="ארבע דלתות מדף הבית: מה זה DGO, התחלה, המושגים, כמה מחשבים — לשכה אחת"><title>ארבע דלתות מדף הבית: מה זה DGO, התחלה, המושגים, כמה מחשבים — לשכה אחת</title><style>
.bg{fill:#f3f5f7}.surface{fill:#fff}.soft{fill:#e7eae4}.olive{fill:#56693f}.oliveline{fill:none;stroke:#56693f}.line{fill:none;stroke:#6a7068}.edge{fill:none;stroke:#bfc6b6}.ink{fill:#1f2a17}.muted{fill:#6a7068}.onolive{fill:#f3f5f7}.block{fill:none;stroke:#5b3349}.blocktext{fill:#5b3349}.plum{fill:#e8e2e6}.head{fill:#56693f}
