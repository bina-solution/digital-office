  env:
    # HEALTHCHECK_INTERVAL — how often Docker runs every app's health probe (compose files read it as
    # `interval: ${HEALTHCHECK_INTERVAL:-30s}`; the 10-20s probes of databases/outpost are deliberate
    # and not parameterised). Measured 2026-09-30 on the 5 GiB macOS engine: 40 health-checked
