# INDOX performance profiles — one machine envelope = one profile.
# Selected via PERFORMANCE_PROFILE in .env; applied by `bbox n8n push`:
#   env block (compose reads) + perf_* settings rows + workflow knobs via perf-manifest.json.
# Sizing rules + full knob markout: ai/context/indox-performance-profiles.md
# Class-B serializers (batchSize=1 overlap-safety loops) are NEVER touched by profiles.
#
# `host_mem` is the machine envelope each profile already implied in its comment, written down so it
# can be checked. Gate G30 (scripts/refactor/memory-budget-lint.py) sums every declared
# deploy.resources.limits.memory across the ENABLED apps and asserts it stays within
# host_mem x mem_overcommit.
#
# Overcommit is deliberate and legitimate — services are not all hot at once, and
# packaging/OPTIMISATION.md measures actual usage far below the declared sum. The gate's job is not
# to forbid it but to make it a ratio someone CHOSE, next to the machine it applies to. Before this,
# the sum was 36.4 GiB against hosts of 7-16 GiB and no view in the repo showed it.
#
# ── READ THIS BEFORE TRUSTING THE RATIOS ────────────────────────────────────────────────────────
# The ratios below are set to TODAY'S REALITY plus a little headroom, not to a defensible target.
# They are a ratchet: the declared sum can no longer grow unnoticed, which is the property that was
# missing. They are NOT an endorsement of 5x on a CI runner.
#
# They were not set lower because lowering a real cap is not a paperwork change. On a single Docker
# host an over-subscribed cap protects nothing (the host OOM-killer fires first and picks its own
# victim), but a cap that is too LOW kills a container that is currently fine. Which limits have
# room is a question for `docker stats` against the running 36-service render — measured evidence
# this repo does not currently have (packaging/OPTIMISATION.md's numbers predate this app set).
#
# REDUCTION TARGET: every profile at <= 2.5x. The concentration is n8n (~17 GiB declared across its
# containers) and glitchtip (~6 GiB, and a candidate for the gallery). Do the measurement first.
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# Note what these profiles do NOT size: memory is parameterised for exactly one service
# (APITOOLS_MEM). Every other limit is a literal, identical on a 2-vCPU runner and an 8-core VPS.

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# PROFILE SELECTION — `requires:` is the envelope, and it is the ONLY selector input
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# Every profile declares the machine it needs. `bbox` picks the RICHEST profile whose envelope the
# machine satisfies, on BOTH cores and memory. Adding a profile therefore needs no `bbox` edit —
# the same pattern the CI view-profiles matrix already uses.
#
# WHY THIS EXISTS (measured 2026-08-06): selection used to read `bbox:202`
#     prof="prod"; [ $n -le 4 ] && prof="vps"; [ $n -le 2 ] && prof="ci-small"
# — core count alone. Memory was never consulted, even though every profile below has ALWAYS
# declared `host_mem`. This box has 6 cores and a 9.7 GiB WSL2 VM, so it was handed `prod`, which
# declares host_mem: 16G. The stack was sized for a machine with 65% more memory than it has. That
# is where APITOOLS_MEM=8G on a 9.7 GiB VM came from; nobody chose it by hand.
#
# `requires.mem` is checked against the DOCKER HOST's memory (the WSL2 VM on Windows, the box
# itself on Linux) — not the Windows host's, because the VM is the machine the containers land on.
#
# DO NOT add a second selection rule anywhere. If a machine needs different sizing, give it a
# profile with an envelope. scripts/refactor/memory-budget-lint.py (gate G30) enforces that every
# profile has both an envelope and a declared memory budget.

ci-small:        # 2 vCPU GitHub runner
  requires: { cores: 1, mem_gb: 5 }   # floor profile — must match the weakest supported machine
  host_mem: 7G          # standard GitHub-hosted runner
  mem_overcommit: 5.5   # today's reality on a 7G runner — see REDUCTION TARGET above
  # host_cpus / cpu_overcommit — the CPU twin of host_mem / mem_overcommit, checked by gate G65
  # (scripts/refactor/cpu-budget-lint.py). scripts/perf-profile-apply renders the plan,
  # .generated/cpu-budget.yml: every enabled service's `cpus` cap scaled by budget/declared_sum
  # (never up, floor 0.1) — told to the running containers after every `up`, not merged into
  # compose. Measured 2026-09-30 on the 4-vCPU macOS engine: 57 capped services
  # declared 47.4 vCPU (11.9x). Unlike memory, CPU caps are NOT decoration on one host — the
  # kernel enforces every one of them, so 47 vCPU of quota on 4 vCPUs meant every container
  # contended at once (CPU pressure 95%, load 145, health probes timing out, 12 flapping
  # unhealthy) with every agent idle. Overcommit stays legitimate (services are not all hot at
  # once); the ratio is the number someone chose.
  host_cpus: 4
  cpu_overcommit: 4.0
  env:
    # HEALTHCHECK_INTERVAL — how often Docker runs every app's health probe (compose files read it as
    # `interval: ${HEALTHCHECK_INTERVAL:-30s}`; the 10-20s probes of databases/outpost are deliberate
    # and not parameterised). Measured 2026-09-30 on the 5 GiB macOS engine: 40 health-checked
    # containers, 21 of them spawning a python interpreter, at 30s = ~50 execs/min. With the guest
    # 3.5 GB into swap each interpreter start pages in ~50 MB, so the probes themselves kept the
    # machine starved (CPU pressure 92%, load 145 on 4 cores with every agent idle), timed out, and
    # flapped 12 containers "unhealthy" — a self-sustaining storm. Slower probes cost only how
    # quickly autoheal notices a wedged container (retries x interval); nothing on the request path.
    HEALTHCHECK_INTERVAL: 90s
    # HEALTHCHECK_TIMEOUT — how long one probe may take before Docker counts it failed (compose files
    # read it as `timeout: ${HEALTHCHECK_TIMEOUT:-<their old literal>}`). Measured 2026-09-30: at CPU
    # pressure 90%+ the 5-10 s literals could not be met — 150 probe execs timed out per 5 min — and
    # every timeout is a health_status event that makes traefik re-list and re-inspect every
    # container through a daemon that cannot answer; a reload with the inspects failed is a config
    # with ZERO routers, i.e. the whole office 404 (seen 2026-09-29 16:28 and 2026-09-30 13:27). A
    # longer timeout costs nothing when the probe is fast and stops the storm when it is slow.
    HEALTHCHECK_TIMEOUT: 30s
    N8N_WORKER_CONCURRENCY: 4
    # [2026-08-23] RUNNER SLOTS FOLLOW WORKER SLOTS. Unset here, this fell through to the
    # compose default of 15 — on EVERY profile, including ci-small at ONE core. The rule is not
    # new and is not mine; apps/n8n/docker-compose.yml states it beside the sidecar's own
    # setting: "worker slots 20 vs runner slots 12 wedged 16 driver lanes for 15+ minutes with 0
    # rows written, 0.3% CPU and not one error line. Keep these equal." Every profile sized
    # N8N_WORKER_CONCURRENCY for its host and left the runner side at prod-shaped 15.
    #
    # MEASURED on this 4-core host, 2026-08-23: syncV3FullTest01 died at 'HD Guard' — a code node
    # whose entire body is `return [{json:{_iter:$runIndex+1}}]` — with "Task request timed out
    # after 300 seconds". Not slow: starved. It waited past N8N_RUNNERS_TASK_REQUEST_TIMEOUT for a
    # slot. In the same battery sync_sources' gmail-doc fell 8/8 -> 6/8 with delivered:1 of 2, and
    # its sibling lanes' ledger watches went from t+37s/t+43s to t+280s/t+287s — the same work,
    # six times slower, because 15 JS tasks were contending for 4 cores.
    #
    # NOT fixed by raising the timeout: that lets a starved queue wait longer, which is what the
    # 2026-08-18 tuning pass deliberately balanced away from. The profile is the target-hardware
    # declaration (requires.cores below), so the slot count belongs here.
    #
    # This is the same defect the N8N_WORKER_CONCURRENCY comment in the laptop profile already
    # names in its own words: "UNCHANGED from prod was itself the bug -- prod's 8-core sizing
    # carried here unexamined."
    N8N_RUNNERS_MAX_CONCURRENCY: 4   # == N8N_WORKER_CONCURRENCY, per the compose rule
    APITOOLS_GUNICORN_WORKERS: 4
    APITOOLS_MAX_CONCURRENT_JSON_QUERY: 3
    APITOOLS_MAX_CONCURRENT_OCR: 1
    APITOOLS_CPUS: '2.0'    # compose cpus is env-driven now — the CI cap step regex
    APITOOLS_MEM: '3G'      # no longer sees a literal, so every profile MUST set these
  settings:
    perf_extract_fanout: 2
    perf_scan_take: 25
    perf_sync_chunk: 10
    perf_batch_upsert: 10
    perf_main_jitter_max_s: 0
    perf_line_poll_s: 15
    perf_lock_ttl_s: 480
    perf_test_budget_scale: 1.5

laptop:          # dev box — SIZE TO THE DOCKER VM (6 CPUs / ~12G), not host threads!
  requires: { cores: 4, mem_gb: 11 }
  host_mem: 12G         # the Docker VM's memory, not the host's
  mem_overcommit: 3.25
  host_cpus: 6
  cpu_overcommit: 4.0
  env:
    HEALTHCHECK_INTERVAL: 60s   # see the note under ci-small
    HEALTHCHECK_TIMEOUT: 20s
    N8N_WORKER_CONCURRENCY: 8
    # [2026-08-23] RUNNER SLOTS FOLLOW WORKER SLOTS. Unset here, this fell through to the
    # compose default of 15 — on EVERY profile, including ci-small at ONE core. The rule is not
    # new and is not mine; apps/n8n/docker-compose.yml states it beside the sidecar's own
    # setting: "worker slots 20 vs runner slots 12 wedged 16 driver lanes for 15+ minutes with 0
    # rows written, 0.3% CPU and not one error line. Keep these equal." Every profile sized
    # N8N_WORKER_CONCURRENCY for its host and left the runner side at prod-shaped 15.
    #
    # MEASURED on this 4-core host, 2026-08-23: syncV3FullTest01 died at 'HD Guard' — a code node
    # whose entire body is `return [{json:{_iter:$runIndex+1}}]` — with "Task request timed out
    # after 300 seconds". Not slow: starved. It waited past N8N_RUNNERS_TASK_REQUEST_TIMEOUT for a
    # slot. In the same battery sync_sources' gmail-doc fell 8/8 -> 6/8 with delivered:1 of 2, and
    # its sibling lanes' ledger watches went from t+37s/t+43s to t+280s/t+287s — the same work,
    # six times slower, because 15 JS tasks were contending for 4 cores.
    #
    # NOT fixed by raising the timeout: that lets a starved queue wait longer, which is what the
    # 2026-08-18 tuning pass deliberately balanced away from. The profile is the target-hardware
    # declaration (requires.cores below), so the slot count belongs here.
    #
    # This is the same defect the N8N_WORKER_CONCURRENCY comment in the laptop profile already
    # names in its own words: "UNCHANGED from prod was itself the bug -- prod's 8-core sizing
    # carried here unexamined."
    N8N_RUNNERS_MAX_CONCURRENCY: 8   # == N8N_WORKER_CONCURRENCY, per the compose rule
    APITOOLS_GUNICORN_WORKERS: 16
    APITOOLS_MAX_CONCURRENT_JSON_QUERY: 8   # capacity-matched: cpus x1.5 (16 was demand-
                                            # matched -> 75s soft-timeout storms, measured)
    APITOOLS_MAX_CONCURRENT_OCR: 3    # OCR slots derive from MEMORY (cold multipage OCR
                                      # ~1-2G each; 5 slots @4G = OOM SIGKILL storm, measured)
    APITOOLS_CPUS: '5.0'              # knob 11 — cgroup was the query gate (p50 stuck 3.15s)
    APITOOLS_MEM: '6G'                # knob 12 — the OCR OOM gate
  settings:
    perf_extract_fanout: 6
    perf_scan_take: 50
    perf_sync_chunk: 25
    perf_batch_upsert: 25
    perf_main_jitter_max_s: 0
    perf_line_poll_s: 10
    perf_lock_ttl_s: 300
    perf_test_budget_scale: 1.0

