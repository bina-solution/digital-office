    N8N_RUNNERS_MAX_CONCURRENCY: 6   # == N8N_WORKER_CONCURRENCY, per the compose rule
    APITOOLS_GUNICORN_WORKERS: 6
    APITOOLS_MAX_CONCURRENT_JSON_QUERY: 6
    APITOOLS_MAX_CONCURRENT_OCR: 2
    APITOOLS_CPUS: '3.0'
    APITOOLS_MEM: '4G'
  settings:
    perf_extract_fanout: 3
    perf_scan_take: 50
    perf_sync_chunk: 25
    perf_batch_upsert: 25
    perf_main_jitter_max_s: 3
