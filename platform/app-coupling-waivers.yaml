# app-coupling-waivers — chassis that names an installable app, and why.
#
# G33 (scripts/refactor/app-coupling-lint.py) asserts that layer 1 and 2 apps do not name layer 2/3
# apps in their source. What is here is the coupling that ALREADY existed when the gate was
# introduced: recorded so the gate is green today and NEW coupling fails, not because any of it is
# endorsed. Each entry lists where it occurs; deleting one and keeping the gate green is always an
# improvement.
#
# data-management is deliberately absent. It is the newest chassis app and has zero entries: it
# discovers postgres and redis instances by container IMAGE and reads their credentials from each
# container's own POSTGRES_USER / REDIS_PASSWORD, so a newly installed app with its own database is
# inventoried and backed up without anyone editing the backup service.
#
# Format:  <chassis app id>: [ <app id it names>, ... ]


any-concurrency:
  # 2x — e.g. apps/any-concurrency/app.py:278
  - "apitools"
  # 13x — e.g. apps/any-concurrency/app.py:62
  - "n8n"

